<SCRIPT language=JScript defer>//
var oldFlowP;
var mode = 0;
//var arrExecPeriod = [1000,,,,50,100,200,500,1000,2000,5000,10000,20000];
//
//
function FilterCommands(){
	var State, ModAttr, Mode;
	var oState, oMode, oModeAttr, oCommand;
	//
	oState = document.getElementById("AlpState");
	oMode = document.getElementById("ScConCboMode");
	oModeAttr = document.getElementById("ConCboModeAttr");
	oCommand = document.getElementById("ScConCboCommand");
	//
	State = oState.value;
	ModAttr = oModeAttr.value;
	Mode = oMode.value;
	//
	oCommand.ResetContent();
	oCommand.AddString('None');

	if (ModAttr != 'PROGRAM'){
		switch(Mode){
			case "SINGLESTEP":	oCommand.AddString('Resume');
								oCommand.AddString('Cancel');
								break;

			case "SEMIAUTO":	switch (State){
									//2
									case "Inactive":	oCommand.AddString('Active');
														break;
									//3
									case "Validated":	oCommand.AddString('Reset');
														break;
									//4
									case "Running":		oCommand.AddString('Hold');
														oCommand.AddString('Abort');
														oCommand.AddString('Resume');
														break;
									//5
									case "Complete":	oCommand.AddString('Reset');
														break;
									//7
									case "Idle":	oCommand.AddString('Start');
													break;
									//13
									case "Held":	oCommand.AddString('Restart');
													oCommand.AddString('Abort');
													break;
									//15
									case "Stopped":	oCommand.AddString('Reset');
													oCommand.AddString('Abort');
													break;
									//17
									case "Aborted":	oCommand.AddString('Inactive');
													oCommand.AddString('Reset');
													break;

									case "Starting":	oCommand.AddString('Abort'); 
														break;
								}
							break;


			case "MANUAL":
		
		
			case "AUTO":	switch (State){
								//2
								case "Inactive":	oCommand.AddString('Active');
													break;
								//3
								case "Validated":	oCommand.AddString('Reset');
													break;
								//4
								case "Running":		oCommand.AddString('Hold');
													oCommand.AddString('Abort');
													break;
								//5
								case "Complete":	oCommand.AddString('Reset');
													break;
								//7
								case "Idle":	oCommand.AddString('Start');
												break;
								//13
								case "Held":	oCommand.AddString('Restart');
												oCommand.AddString('Abort');
												break;
								//15
								case "Stopped":	oCommand.AddString('Reset');
												oCommand.AddString('Abort');
												break;
								//17
								case "Aborted":	oCommand.AddString('Reset');
												break;
							
								case "Starting":	oCommand.AddString('Abort'); 
													break;
							}
		}
	}
	oCommand.value = 'None';
}
//
function actMode_onchange(oSource){
	var tmpCV, set, tmpM;

	tmpCV = oSource.currentValue;
	switch(tmpCV){
		case 'AUTO': 		val = 1; break;
		case 'SEMIAUTO': 	val = 2; break;
		case 'SINGLESTEP': 	val = 3; break;
		case 'MANUAL': 		val = 4; break;
	}
	//
	set = oSource.SetDataValueSynchronous('FlowPoint.MODE', val);
	//
	if (set){
		FilterCommands();
	}else{
		tmpM = oSource.DataValue('FlowPoint.MODE');
		switch(tmpM){
			case 1: oSource.value = 'AUTO'; break;
			case 2: oSource.Value = 'SEMIAUTO'; break;
			case 3: oSource.Value = 'SINGLESTEP'; break;
			case 4: oSource.Value = 'MANUAL'; break; 					}
		}
}
//
//
function actMode_ondatachange(oSource){
	var tmp;

	if (mode<2){
			oSource.ResetContent();
	
			oSource.AddString("AUTO");
			oSource.AddString("SEMIAUTO");
			oSource.AddString("SINGLESTEP");
			oSource.AddString("MANUAL");		
			//
			tmp = oSource.DataValue("FlowPoint.MODE");
			//
			switch(tmp){
				case 1: oSource.Value = "AUTO"; break;
				case 2: oSource.Value = "SEMIAUTO"; break;
				case 3: oSource.Value = "SINGLESTEP"; break;
				case 4: oSource.Value = "MANUAL"; break;
			}
			//
			FilterCommands();
			mode++;
	}
}
//
//
function ScConAlpStepTimes_datachange(oSource){
var dataVal, dataVal1, dataArray, MinTime;

	dataVal = oSource.DataValue("ACT1.ACTIVELOC.STEP(1)");
	dataVal1 = oSource.DataValue("ACT1.ACTIVELOC.TIME(1)");

	if (dataVal1 > 0){
		dataArray = dataVal.split(".");
		MinTime = dataArray[1]+".MINTIME";
		DisplayDataRepository.PutValue("MINTIME", MinTime);
		//ConAlpMinWaitTime.style.visibility = "inherit";
		TxtWaitValue.style.visibility = "inherit";
		TxtMinWaitTime.style.visibility = "inherit";
	}else{
		//ConAlpMinWaitTime.style.visibility = "hidden"
		TxtWaitValue.style.visibility = "hidden";
		TxtMinWaitTime.style.visibility = "hidden"
	}
}
//
//
function updateTimeValue(oSource){
	var oPeriod, iCycles, iTimeValueMSec, iPeriod;
	var iYears, iDays, iHours, iMinutes, iSeconds;
	var txtTime, sDays, sYears, sTimeValue;

	oPeriod = document.getElementById("ConAlpPeriod");
	//oTxtTime = document.getElementById("TxtTimeValue");
	sTimeValue = "------"
	if(isNumeric(oPeriod.value) && isNumeric(oSource.value)){
		iPeriod = oPeriod.value;
	window.external.Application.logmessage(">>>> period enum = " + iPeriod);
	window.external.Application.logmessage(">>>> arrPeriod len = "+ arrExecPeriod.length);		
		iPeriodMSec = arrExecPeriod[iPeriod];
	for(var ii=0;ii<14;ii++){
		window.external.Application.logmessage(">>>> arrPeriod[" +  ii + "] = "+ arrExecPeriod[ii]);
	}
	window.external.Application.logmessage(">>>> period msec = " + iPeriodMSec);		
		iCycles = oSource.value;
		iTimeValueMSec = iCycles * iPeriodMSec;
	
		iSeconds = Math.floor(iTimeValueMSec / 1000);
		iMinutes = Math.floor(iSeconds / 60);
		iSeconds = iSeconds % 60;
		iHours = Math.floor(iMinutes / 60);
		iMinutes = iMinutes % 60;
		iDays = Math.floor(iHours / 60);
		iHours = iHours % 24;
		iYears =  Math.floor(iDays / 365);
		iDays = iDays % 365;
		//
		if (iYears > 0) {
			sYears = iYears + "y ";
		}else{
			sYears = "";
		}
		//	
		if (iDays > 0) {
			sDays = iDays + "d ";	
		}else{
			sDays = "";
		}
		//Write formatted time
		sTimeValue = sYears + sDays + pad(iHours) + ":" + pad(iMinutes) + ":" + pad(iSeconds);
	}

	return sTimeValue;
}
//
var pad = function (n) { return n < 10 ? '0' + n : n; };
//
function isNumeric(n) {
	return !isNaN(parseFloat(n)) && isFinite(n);
}
//
//(inline call on body - onload and onresize, trend object set inline to 100% width/height of page)
function ResizeSeqPopup() {
	Page.style.pixelHeight = document.body.clientHeight;
	Page.style.pixelWidth = document.body.clientWidth;
}
//(inline call on Background object)
function BackgroundPropChange() {
		if (window.event.propertyName == "style.zoom") {
			ResizeMiniTrend();
        }
}</SCRIPT>
