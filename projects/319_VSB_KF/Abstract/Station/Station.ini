Key72DownPAR1=2
Key72DownPAR2=6
Key72UpLRN=98
Key72UpPAR1=2
Key72UpPAR2=4

;Keypad 9 - pan right tilt up
Key73DownLRN=98
Key73DownPAR1=2
Key73DownPAR2=18
Key73UpLRN=98
Key73UpPAR1=2
Key73UpPAR2=20

;Keypad / - zoom in
