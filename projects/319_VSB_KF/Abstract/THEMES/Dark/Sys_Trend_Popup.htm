<SCRIPT language=JScript defer>var g_iHeight, g_iWidth;

function SetCustomSize() {
	window.external.dialogHeight = g_iHeight;	
	window.external.dialogWidth = g_iWidth;
}

//(inline call on body - onload and onresize, trend object set inline to 100% width/height of page)
function ResizeCustomTrend() {
	Page.style.pixelHeight = document.body.clientHeight;
	Page.style.pixelWidth = document.body.clientWidth;
}

//(inline call on Background object)
function BackgroundPropChange() {
		if (window.event.propertyName == "style.zoom") {
			ResizeCustomTrend();
		}
}

function ChartPP_pagecomplete() {
	var sTrdNo, oShape, oSview;
	addEventHandler(window, "resize", ResizeCustomTrend);
    
    sTrdNo = DisplayDataRepository.GetValue("TrdNo");
	document.title = "Trend Number " + sTrdNo;
	oShape = document.getElementById(Page.getAttribute("Trend_Sup_GSH"));
	oShape.Objects("AlpTrendGrp").value = parseInt(sTrdNo);
    window.setTimeout(function(){trd_popup_data();},100,"Jscript");

	oSview = new ActiveXObject("Honeywell.Workspace.Client");
	if (oSview.IsManagerActive == false) {
		//set CSS popup size
		var oPage = window.external.parentDocument.parentWindow.Page;
		g_iHeight = oPage.GetStyleClassProperty("Trend_popup","size_height");
		g_iWidth = oPage.GetStyleClassProperty("Trend_popup","size_width");
		if (g_iWidth != "default" && g_iHeight != "default") {
			window.setTimeout(function(){SetCustomSize();},200,"Jscript");
		}
	}
}

function trd_popup_data() {
	var oShape = document.getElementById(Page.getAttribute("Trend_Sup_GSH"));
	DisplayDataRepository.autoReloadContent = false;
	for (var i=1; i<=32; i++) {
		point = oShape.Objects("TrdTbl").fields.item("Point.value").getvalue(i-1);
		par = oShape.Objects("TrdTbl").fields.item("Parameter.value").getvalue(i-1);
		DisplayDataRepository.PutValue("Point" + i, point);
		DisplayDataRepository.PutValue("Parameter" + i, par);
    }
	DisplayDataRepository.autoReloadContent = true;
}

//==============================================================================================================================================================

//This shape provides the ability to view, edit and invoke trend groups.
//if (window.external.Application.environment = 0 && spDebug ) { window.external.Application.LogMessage window.external.Application.currentpage + " :>>> Trend_Sup_GSH R500.1 version date: 2016/03/07"
var tid;			//Timer ID
var bGroupSelected;	//Used if All_TrdSel_lib/eoc_h_0x.sha is missing to ensure the operator response (single window || multi-window with Global Trend No functionality disabled)
var sParameter;		//Used to store the parameter to be added in the selected trend group
var bLoaded;		//Used to to ensure once off update of the chart shape if present
var oWindow_Tnd;	//Used to reload trend in SafeView Environment when trace added
var selrecoffset;	//Used to reload trend in SafeView Environment when trace added
var bTrendSet;		//Used to set the trend number to the last selected trend
bTrendSet = false;
bLoaded = false;
//Check the number of empty pens left in the currently selected trend group. Called within AlpTrendGrp.onupdate
function is_empty(){
	var e_pl, pointpar, oShape, oShape_sel, glbTrdNo, bGlobalTrdNo;

	//if (!Page.getAttribute("TrdSel")) )  return;
	oShape = document.getElementById(Page.getAttribute("Trend_Sup_GSH"));
	oShape_sel = document.getElementById(Page.getAttribute("TrdSel"));
	if (oShape.Objects("alpisprotected").value == 1 && window.external.Application.Parent.RuntimeStatus.SecurityLevel < 4) {
		oShape_sel.title = "Protected";
		if (typename(oShape_sel.Objects("TxtFreePens")) != "Nothing") {
			oShape_sel.Objects("TxtFreePens").value = "Protected";
		}
		if (oShape.Objects("TrdTbl").style.visibility == "visible") {
			oShape.Objects("RecProtected").style.pixelWidth = 400;
		}
		return;
	}else {
		oShape.Objects("RecProtected").style.pixelWidth = 0;
	} 
    //number of empty trend pens
    e_pl = 0;
	for(var i=0; i<=31; i++){
		pointpar = oShape.Objects("TrdTbl").fields.item("Point.value").getvalue(i);
		if (pointpar == " ") {
			e_pl++;
		}
	}
//+++ FIX 2016/03/07 === [Trend_Sup_GSH -> is_empty()]
	if (typename(oShape_sel) != "Nothing") {
		oShape_sel.title = "Free Pens " + e_pl;
		if (typename(oShape_sel.Objects("TxtFreePens")) != "Nothing") {
			oShape_sel.Objects("TxtFreePens").value = "Free Pens " + e_pl;
		}
	}

	glbTrdNo = Page.getstyleclassproperty("SP_Options","hw-sp-global-trendno").toLowerCase();
	if ((glbTrdNo == "yes" || glbTrdNo == "on" || glbTrdNo == "true") && window.external.Application.Parent.windowmode == 1) {
		bGlobalTrdNo = true;
	}else {
		bGlobalTrdNo = false;
	}
	if (bGlobalTrdNo) {
	//+++ Add Global Free pens
		try {
			window.external.application.Dictionary.item("TrendFreePens").value = e_pl;
		}catch(e) {
			window.external.application.Dictionary.add("TrendFreePens", e_pl);
		}
	} 
} 
//Update the contents of the chart shape object with the pens in the currently selected trend group. Called within AlpTrendGrp.onupdate
function upd_chart(){
	var oShape, oObj, point, par;

	if (Page.getAttribute("Trend_Sup_GSH") === null) {
		return;
	}
	if (Page.getAttribute("TrdSel") === null) {
		return;
	}
	oShape = document.getElementById(Page.getAttribute("Trend_Sup_GSH"));
	for (var i=0; i<Page.all.tags("DIV").length;i++) {
		oObj = Page.all.tags("DIV").item(i);
		if (oObj.className == "hsc.shape.1") {
			if (oObj.Objects("Custtrd")) {
				for(i=0; i<=31; i++){
					point = oShape.Objects("TrdTbl").fields.item("Point.value").getvalue(i);
					par = oShape.Objects("TrdTbl").fields.item("Parameter.value").getvalue(i);
					if (oObj.Objects("CustTrd").legend.PointID(i+1) != "") {
						oObj.Objects("CustTrd").legend.PointID(i+1) = " ";
					}
					oObj.Objects("CustTrd").legend.parameter(i+1) = "";
					if (point.slice(0,1).charCodeAt(0) != 32) {
						oObj.Objects("CustTrd").legend.PointID(i+1) = point;
						oObj.Objects("CustTrd").legend.parameter(i+1) = par;
						oObj.Objects("CustTrd").legend.PlotVisible(i+1) = true;
					}
				}
			}
		}
	}
} 
//------------------------------------------------------------------------
// Trd Support GSH - AlpTrendGrp bound to CurrentRecordOffset (System Trend Number)
//------------------------------------------------------------------------
function AlpTrendGrp_update(oSource){

	var TrendNo;
	if (bTrendSet == false) {
		try {
			TrendNo = window.external.Application.Dictionary.Item("TrendNo");
			oSource.value = parseInt(TrendNo);
		}catch(e) {
			window.external.Application.Dictionary.Add("TrendNo", 1);
			oSource.value = 1;
		}
		bTrendSet = true;
	}
	window.setTimeout(function(){is_empty();}, 200, "Jscript");
	if (bLoaded == false) {
		window.setTimeout(function(){upd_chart();}, 1000, "Jscript");
		bLoaded = true;
	}
	if (typename(document.getElementById(Page.getAttribute("TrdSel"))) != "Nothing") {
		if (oSource.value != document.getElementById(Page.getAttribute("TrdSel") + "_AlpTrendGrp").value) {
			document.getElementById(Page.getAttribute("TrdSel") + "_AlpTrendGrp").value = oSource.value;
		} 
	} 
}

//============================================================================
function typename(o){
    if(typeof o != "undefined" && o !== null){
        return typeof o;
    }else{
        return "Nothing";
    }
}
function addEventHandler(elem,eventType,handler) {
    if (!!elem.attachEvent){
        //dbg("addEventHandler function : IE == quirks");
        //window.external.application.logmessage(">>> addEventHandler function : IE == quirks: " + eventType);
        elem.attachEvent ("on"+eventType,handler);  
    }else if (!!elem.addEventListener){
        //window.external.application.logmessage(">>> addEventHandler function : IE > quirks : " + eventType);
        elem.addEventListener (eventType,handler);
    }
}
// Util js functions
function isNumeric(n) {
    return !isNaN(parseFloat(n)) && isFinite(n);
}</SCRIPT>
