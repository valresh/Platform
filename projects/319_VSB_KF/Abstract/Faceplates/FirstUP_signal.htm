<SCRIPT language=VBScript for=Page defer event=onpagecomplete>    DisplayDataRepository.autoReloadContent = false
	for i= 2 to 71
		s="00" & i
		s=right(s,3)
		DisplayDataRepository.PutValue "P" & i-1, document.getelementbyid("alpha" & s)
	next
    DisplayDataRepository.autoReloadContent = true
    window.external.dialogheight=40
    window.external.dialogwidth=200</SCRIPT>

<SCRIPT language=VBScript defer>Dim sName, iCnt

iCnt=0

Sub Check
	for i= 2 to 71
		s="00" & i
		s=right(s,3) 
		if document.getelementbyid("AlphaN_" & s).alarm <> 2048 then
			 document.getelementbyid("AlphaN_" & s).style.visibility="inherit"
			 sName=document.getelementbyid("AlphaN_" & s).value
			 exit for
		end if
	next
end sub</SCRIPT>

<SCRIPT language=VBScript for=AlphaN_071 defer event=onupdate>iCnt=iCnt+1
if iCnt=2 then window.settimeout "Check", 500</SCRIPT>
