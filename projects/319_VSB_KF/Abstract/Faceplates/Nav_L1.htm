<SCRIPT language=VBScript defer>'executes every time display is loaded
'********************************************************************
on error resume next

if err.number<>0 then
	window.external.dictionary.add "NavNameDesc", "Опис"	
    PbNameDesc.value="Опис"
	sNameDesc="Опис"
end if
if sNameDesc="Опис" then
    PbNameDesc.value="Имя"
else
    PbNameDesc.value="Опис"
end if

sub Page_OnSelectStart	
	dim InpName	
	on error resume next
	InpName=window.event.SrcElement.TagName
	if InpName <> "INPUT" and InpName<>"TEXTAREA" then window.event.returnvalue = false
end sub

sub AlpChild_Onupdate(oSource)
    on error resume next
	set oDspName=document.getElementById("TxtDspName" & right(oSource.id,3))
	set oDspFrame=document.getElementById("RecFrame" & right(oSource.id,3))
	if (oSource.quality and 192)=192 and instr(oSource.innertext,"NaN")=0 and instr(oSource.innertext,"--")=0 then  		
		sNameDesc=window.external.dictionary.item("NavNameDesc").value
		if sNameDesc="Имя" then 
		   oDspName.value=oSource.value
		   oDspName.style.visibility="visible"
		   oDspFrame.style.visibility="visible"
        end if 
		displayDataRepository.putvalue "AlmGrpDsp" & right(oSource.id,3), oSource.value
	else
  		oDspName.style.visibility="hidden"
		oDspFrame.style.visibility="hidden"
		displayDataRepository.putvalue "AlmGrpDsp" & right(oSource.id,3), ""
	end if
end sub

sub AlpChildName_Onupdate(oSource)
    on error resume next  
    set oAlmObj=document.getelementbyid("RecFrame" & right(oSource.id,3))
	set oDspName=document.getElementById("TxtDspName" & right(oSource.id,3))
    sNameDesc=window.external.dictionary.item("NavNameDesc").value
    if sNameDesc="Опис" then
	    set oDescSrc=document.getElementById("ConAlpChildName" & right(oSource.id,3)) 
	    if not isnumeric(oDescSrc.value) then 
		    oDspName.value=oDescSrc.value
			oDspName.style.visibility="visible"
		    oAlmObj.style.visibility="visible"
        end if 
	end if
	oAlmObj.alarm=oSource.alarm
end sub

sub M_NameDesc(oSource)
    sNameDesc=window.external.dictionary.item("NavNameDesc").value
    set oObjAlm=document.getelementbyid("M_RecFrame" & right(oSource.id,3))
    set oObjTxt=document.getelementbyid("M_TxtDspName" & right(oSource.id,3))
	if (oSource.quality and 192)=192 and instr(oSource.innertext,"NaN")=0 and instr(oSource.innertext,"---")=0 then  		
	   oObjAlm.style.visibility="visible"
	   oObjTxt.style.visibility="visible"
	   if sNameDesc="Имя" then
          oObjTxt.value=oSource.value
       else 	    
		  oObjTxt.value=oSource.datavalue("M_AlmGrp" & right(oSource.id,1) & ".description")
       end if
	else
  	   oObjAlm.style.visibility="hidden"
	   oObjTxt.style.visibility="hidden"  
    end if
	oObjAlm.alarm=oSource.alarm
end sub</SCRIPT>

<SCRIPT language=VBScript for=PbNameDesc defer event=onclick>on error resume next
    if window.external.dictionary.item("NavNameDesc").value="Опис" then
		me.value="Опис"

	    for i=1 to 54
	   		if i<10 then: s="00" & i: else: s="0" & i: end if
	   		document.getElementById("TxtDspName" & s).value=document.getElementById("ConAlpChild" & s).value  
			if i<=8 then document.getElementById("M_TxtDspName00" & i).value=document.getElementById("M_ConAlpChild00" & i).value                    		
	    next
	else		 
	    window.external.dictionary.item("NavNameDesc").value="Опис"
		me.value="Имя"
		for i=1 to 54
	    	if i<10 then: s="00" & i: else: s="0" & i: end if
	        document.getElementById("TxtDspName" & s).value=document.getElementById("ConAlpChildName" & s).value
			if i<=8 then document.getElementById("M_TxtDspName00" & i).value=document.getElementById("M_ConAlpChild00" & i).datavalue("M_AlmGrp" & i & ".description")
	    next
	end if</SCRIPT>

	    set oDescSrc=document.getElementById("ConAlpChildName" & right(oSource.id,3)) 
	    if not isnumeric(oDescSrc.value) then 
		    oDspName.value=oDescSrc.value
			oDspName.style.visibility="visible"
		    oAlmObj.style.visibility="visible"
        end if 
	end if
	oAlmObj.alarm=oSource.alarm
end sub

sub M_NameDesc(oSource)
    sNameDesc=window.external.dictionary.item("NavNameDesc").value
    set oObjAlm=document.getelementbyid("M_RecFrame" & right(oSource.id,3))
    set oObjTxt=document.getelementbyid("M_TxtDspName" & right(oSource.id,3))
	if (oSource.quality and 192)=192 and instr(oSource.innertext,"NaN")=0 and instr(oSource.innertext,"---")=0 then  		
	   oObjAlm.style.visibility="visible"
	   oObjTxt.style.visibility="visible"
	   if sNameDesc="Имя" then
          oObjTxt.value=oSource.value
       else 	    
		  oObjTxt.value=oSource.datavalue("M_AlmGrp" & right(oSource.id,1) & ".description")
       end if
	else
  	   oObjAlm.style.visibility="hidden"
	   oObjTxt.style.visibility="hidden"  
    end if
	oObjAlm.alarm=oSource.alarm
end sub</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onclick>    set oSource=window.event.srcelement

	'**************************************************************************</SCRIPT>
