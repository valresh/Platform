<SCRIPT language=VBScript for=ConAlpCycle defer event=onupdate>AlpCycle.value=me.value</SCRIPT>

<SCRIPT language=VBScript for=ConAlpStep defer event=onupdate>if me.value=0 then 
	ConAlpCycle.value=AlpCycle.value
	me.value=1
end if</SCRIPT>

<SCRIPT language=VBScript for=ScConAlpPSAON defer event=onupdate>	on error resume next
	if me.value="ON" then 
		TxtHide.style.visibility="visible"
    else 
		TxtHide.style.visibility="hidden"
    end if</SCRIPT>

<SCRIPT language=VBScript for=txtMode defer event=ondatachange>if me.datavalue("41SEQ4101A_FLAG.12BED.PV")=1 then me.value="12 АДСОРБЕРА"
if me.datavalue("41SEQ4101A_FLAG.10BED.PV")=1 then me.value="10 АДСОРБЕРА"
if me.datavalue("41SEQ4101A_FLAG.8BED.PV")=1 then me.value="8 АДСОРБЕРА"</SCRIPT>

<SCRIPT language=VBScript for=AlpCycle defer event=onchange>if instr(txtMode.value, "8") then
	if me.value>8 then 
		me.cancelchange
		exit sub
	end if
end if

if instr(txtMode.value, "10") then
	if me.value>10 then 
		me.cancelchange
		exit sub
	end if
end if


if csng(me.value)<>csng(ConAlpCycle.value) then	ConAlpStep.value=0</SCRIPT>
