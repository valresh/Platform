<SCRIPT language=VBScript for=Page defer event=onpagecomplete>on error resume next
trend.Legend.PlotColor(1)=12566272
trend.Legend.PlotColor(2)=48896
trend.Legend.PlotColor(3)=49087
document.title=displaydatarepository.getvalue("Point1")
set oSview=getobject("","Honeywell.Workspace.Client")
If oSview.IsManagerActive = false then
	iheight=window.external.parentdocument.parentwindow.page.getstyleclassproperty("Mini_Trend","size_height")
	iwidth=window.external.parentdocument.parentwindow.page.getstyleclassproperty("Mini_Trend","size_width")
	if iwidth<>"default" and iheight<>"default" then
	    set window.onresize=getref("res")
		window.settimeout "res",500
	end if
end if</SCRIPT>

<SCRIPT language=VBScript defer>dim iheight, iwidth

sub res
	on error resume next
	window.external.dialogheight=iheight	
	window.external.dialogwidth=iwidth	
	page.style.pixelheight=iheight
	page.style.pixelwidth=iwidth
	trend.style.pixelheight=iheight
	trend.style.pixelwidth=iwidth
end sub</SCRIPT>
