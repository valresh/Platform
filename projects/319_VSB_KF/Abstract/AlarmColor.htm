<SCRIPT language=VBScript defer>sub UpdateColors()
	critical_rgb.fillcolor = rgb(critical_red.value,critical_green.value,critical_blue.value)
	urgent_rgb.fillcolor = rgb(urgent_red.value,urgent_green.value,urgent_blue.value)
	high_rgb.fillcolor = rgb(high_red.value,high_green.value,high_blue.value)
	Low_rgb.fillcolor = rgb(Low_red.value,Low_green.value,Low_blue.value)
End Sub

Sub SetStyle()
	
	if(window.external.SecurityLevel = 5)Then
		critical_red.fillColor = vbwhite
		critical_green.fillColor = vbwhite
		critical_blue.fillColor = vbwhite
		urgent_red.fillColor = vbwhite
		urgent_green.fillColor = vbwhite
		urgent_blue.fillColor = vbwhite
		high_red.fillColor = vbwhite
		high_green.fillColor = vbwhite
		high_blue.fillColor = vbwhite
		Low_red.fillColor = vbwhite
		Low_green.fillColor = vbwhite
		Low_blue.fillColor = vbwhite

		critical_red.textColor = vbblack
		critical_green.textColor = vbblack
		critical_blue.textColor = vbblack
		urgent_red.textColor = vbblack
		urgent_green.textColor = vbblack
		urgent_blue.textColor = vbblack
		high_red.textColor = vbblack
		high_green.textColor = vbblack
		high_blue.textColor = vbblack
		Low_red.textColor = vbblack
		Low_green.textColor = vbblack
		Low_blue.textColor = vbblack

	Else
		critical_red.fillColor = rgb(100,100,100)
		critical_green.fillColor = rgb(100,100,100)
		critical_blue.fillColor = rgb(100,100,100)
		urgent_red.fillColor = rgb(100,100,100)
		urgent_green.fillColor = rgb(100,100,100)
		urgent_blue.fillColor = rgb(100,100,100)
		high_red.fillColor = rgb(100,100,100)
		high_green.fillColor = rgb(100,100,100)
		high_blue.fillColor = rgb(100,100,100)
		Low_red.fillColor = rgb(100,100,100)
		Low_green.fillColor = rgb(100,100,100)
		Low_blue.fillColor = rgb(100,100,100)
		
		critical_red.textColor = vbwhite
		critical_green.textColor = vbwhite
		critical_blue.textColor = vbwhite
		urgent_red.textColor = vbwhite
		urgent_green.textColor = vbwhite
		urgent_blue.textColor = vbwhite
		high_red.textColor = vbwhite
		high_green.textColor = vbwhite
		high_blue.textColor = vbwhite
		Low_red.textColor = vbwhite
		Low_green.textColor = vbwhite
		Low_blue.textColor = vbwhite
	End If	

End Sub</SCRIPT>
