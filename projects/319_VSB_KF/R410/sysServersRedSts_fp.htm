<SCRIPT language=VBScript defer>Sub ApplyLayout()
	on error resume next
	grpLowerPanel.style.top = "" 
	grpLowerPanel.style.bottom = "2px" :
	grpCenterPanel.style.top = grpUpperPanel.style.pixelTop + grpUpperPanel.style.pixelHeight + 2 
	grpCenterPanel.style.bottom = (grpLowerPanel.style.pixelHeight + 15) & "px"
End Sub
sub NBCC_FP_Update()
	dim maskCpuStsPrimary
	dim maskCpuStsRunning
	dim fPrimaryA
	dim fPrimaryB
	maskCpuStsPrimary = &h8000	' top bit in CPUSTS
	maskCpuStsRunning = &h4000	' second top bit in CPUSTS
	' process A Server
	fPrimaryA = false
	if not (isnumeric(txtLnkStsA1.value) and _
	        isnumeric(txtLinkInUseA.value) and _
			isnumeric(alphaCPUStsFlagsA.value) ) then
		' can't get data so so show default mode
		ShpServerARunningSts.value = 1
		shpServerARunningSts.style.visibility = "inherit"
		lblPrimaryA.style.visibility = "hidden"
		shpServerASyncSts.style.visibility = "hidden"
		shpServerALinkSts0.style.visibility = "hidden"
		lblServerALink0.style.visibility = "hidden"
		shpServerALinkSts1.style.visibility = "hidden"
		lblServerALink1.style.visibility = "hidden"
	else
		' check primary bit
		if (alphaCPUStsFlagsA.value AND maskCpuStsPrimary) = maskCpuStsPrimary then
			' this server is primary
			' hide all LEDs other than running status
			' show [Primary] text
			shpServerASyncSts.style.visibility = "hidden"
			shpServerALinkSts0.style.visibility = "hidden"
			lblServerALink0.style.visibility = "hidden"
			shpServerALinkSts1.style.visibility = "hidden"
			lblServerALink1.style.visibility = "hidden"
			lblPrimaryA.style.visibility = "inherit"
			fPrimaryA = true
		else
			' this server is backup
			' hide [Primary] text
			' show sync status, Link 0 LEDs
			lblPrimaryA.style.visibility = "hidden"
			shpServerASyncSts.style.visibility = "inherit"
			shpServerALinkSts0.style.visibility = "inherit"
			lblServerALink0.style.visibility = "inherit"
		end if
		' check running bit
		if (alphaCPUStsFlagsA.value AND maskCpuStsRunning) = maskCpuStsRunning then
			' server is running
			ShpServerARunningSts.value = 2
		else
			' server is stopped
			ShpServerARunningSts.value = 1
		end if
		shpServerARunningSts.style.visibility = "inherit"
		' check if LNK01 is built, if it isn't this is a single link system
		if txtLnkStsA1.value = 0 or fPrimaryA then
			' LNK01 not built so hide all link 1 related fields
			shpServerALinkSts1.style.visibility = "hidden"
			lblServerALink1.style.visibility = "hidden"
			lblServerALink0.style.fontWeight = "bold"
			lblServerALink1.style.fontWeight = "normal"
		else
			' LNK01 is built
			shpServerALinkSts1.style.visibility = "inherit"
			lblServerALink1.style.visibility = "inherit"
			' check which link is in use
			if txtLinkInUseA.value = 0 then
				' LNK00 in use so show LNK00 text in bold & show LNK01 text normal
				lblServerALink0.style.fontWeight = "bold"
				lblServerALink1.style.fontWeight = "normal"
			else
				' LNK01 in use so show LNK01 text in bold & show LNK00 text normal
				lblServerALink0.style.fontWeight = "normal"
				lblServerALink1.style.fontWeight = "bold"
			end if
		end if
	end if
	' process B Server
	fPrimaryB = false
	if not (isnumeric(txtLnkStsB1.value) and _
	        isnumeric(txtLinkInUseB.value) and _
			isnumeric(alphaCPUStsFlagsB.value) ) then
		' can't get data so so show default mode
		ShpServerBRunningSts.value = 1
		shpServerBRunningSts.style.visibility = "inherit"
		lblPrimaryB.style.visibility = "hidden"
		shpServerBSyncSts.style.visibility = "hidden"
		shpServerBLinkSts0.style.visibility = "hidden"
		lblServerBLink0.style.visibility = "hidden"
		shpServerBLinkSts1.style.visibility = "hidden"
		lblServerBLink1.style.visibility = "hidden"
	else
		' check primary bit
		if (alphaCPUStsFlagsB.value AND maskCpuStsPrimary) = maskCpuStsPrimary then
			' this server is primary
			' hide all LEDs other than running status
			' show [Primary] text
			shpServerBSyncSts.style.visibility = "hidden"
			shpServerBLinkSts0.style.visibility = "hidden"
			lblServerBLink0.style.visibility = "hidden"
			shpServerBLinkSts1.style.visibility = "hidden"
			lblServerBLink1.style.visibility = "hidden"
			lblPrimaryB.style.visibility = "inherit"
			fPrimaryB = true
		else
			' this server is backup
			' hide [Primary] text
			' show sync status, Link 0 LEDs
			lblPrimaryB.style.visibility = "hidden"
			shpServerBSyncSts.style.visibility = "inherit"
			shpServerBLinkSts0.style.visibility = "inherit"
			lblServerBLink0.style.visibility = "inherit"
		end if
		' check running bit
		if (alphaCPUStsFlagsB.value AND maskCpuStsRunning) = maskCpuStsRunning then
			' server is running
			ShpServerBRunningSts.value = 2
		else
			' server is stopped
			ShpServerBRunningSts.value = 1
		end if
		shpServerBRunningSts.style.visibility = "inherit"
		' check if LNK01 is built, if it isn't this is a single link system
		if txtLnkStsB1.value = 0 or fPrimaryB then
			' LNK01 not built so hide all link 1 related fields
			shpServerBLinkSts1.style.visibility = "hidden"
			lblServerBLink1.style.visibility = "hidden"
			lblServerBLink0.style.fontWeight = "bold"
			lblServerBLink1.style.fontWeight = "normal"
		else
			' LNK01 is built
			shpServerBLinkSts1.style.visibility = "inherit"
			lblServerBLink1.style.visibility = "inherit"
			' check which link is in use
			if txtLinkInUseB.value = 0 then
				' LNK00 in use so show LNK00 text in bold & show LNK01 text normal
				lblServerBLink0.style.fontWeight = "bold"
				lblServerBLink1.style.fontWeight = "normal"
			else
				' LNK01 in use so show LNK01 text in bold & show LNK00 text normal
				lblServerBLink0.style.fontWeight = "normal"
				lblServerBLink1.style.fontWeight = "bold"
			end if
		end if
	end if
end sub</SCRIPT>
