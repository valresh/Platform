<SCRIPT language=VBScript defer>Sub Invoke_CM_Point_Detail( This)
Dim CMName, ParamEnd
If Trim( This.value) <> vbNullString  Then
ParamStart = instr ( This.value, TxtPoint.value)
CMName = Left ( This.value, ParamStart-1 )
window.external.Parent.RequestTask 21, 73, 0, 0, 0, CMName
End if
End sub</SCRIPT>
