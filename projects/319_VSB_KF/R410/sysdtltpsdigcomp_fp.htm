<SCRIPT language=VBScript for=Page defer event=onoperatorkey>' possible special handling if ramping for momentary/latched if combo_OP selected

'	if UCase(window.document.activeElement.id) = "COMBO_OP" then

	window.external.parentdocument.parentwindow.external.logmessage "OnOperatorKey, code: " & code

		if code = IKB_KEY_RAISE_RELEASE then
			window.external.parentdocument.parentwindow.external.logmessage "OnOperatorKey, code is IKB_KEY_RAISE_RELEASE"

		elseif code = IKB_KEY_LOWER_RELEASE then

	end if</SCRIPT>

<SCRIPT language=VBScript for=sd_OPFINAL defer event=ondatachange>'	This routine just to speed response to OPFINAL tracking of OP change made via synchdatawrite of OP
	combo_OPFINAL.innerText = me.DataValue("CurrentPoint.OPFINAL")

	if (nDemandCount >= 0) then
		if combo_OPFINAL.innerText = sOPTemp.innerText then 'turn off OP highlight, we're done
			textboxOPoffNormal.style.visibility = "hidden"
			textboxOP.style.visibility = "inherit"
			nDemandCount = -1
			window.clearInterval(intTimerID)
			exit sub
		end if
	end if

	if nDemandCount = -1 then
		window.clearInterval(intTimerID)
		window.external.parentdocument.parentwindow.external.logmessage "OPFINAL: sd_OPFINAL, nDemandCount == -1, we're done; get out"
		exit sub
	end if

	'if we've iterated twice, then update the "OP" text highlight indicator and we're done
	if nDemandCount >= 2 then 
		nDemandCount = -1
		window.clearInterval(intTimerID)
		ShowOPText
	else
	'	wait 2 seconds and check value again for 'best update performance' 
		ShowOPText
		nDemandCount = nDemandCount + 1
		window.clearInterval(intTimerID)   ' PAR 1-3J7WC2B; uncleared  200ms timer may go one forever if not cleared before set again
		intTimerID = window.setInterval("UpdateOPFINAL()", 2000)  'try a total of 4 times
	end if</SCRIPT>

<SCRIPT language=VBScript for=combo_OPFINAL defer event=onchange>	bNeedMomentaryReturn = false

	on error resume next

	' if this is a *momentary* point then schedule a return-to-normal write
	if sd.DataValue("CurrentPoint.MOMSTATE") <> "NONE" and sd.DataValue("CurrentPoint.NOSTATES") > 1 and sOPMouseDownCurrentValue <> "" then
		'if not really changed, do nothing
		if combo_OPFINAL.innerText = sOPMouseDownCurrentValue then
			sOPMouseDownCurrentValue = ""
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: OPFINAL current value selected (no change), no *momentary* action taken"
		else
			' keep track of 'return to' state, which is dependent upon MOMSTATE value:
			'Mom_1 	State 1 is momentary.
			'  When released from this state, it jumps back to State 0. 
			'Mom_0 	State 0 is momentary.
			'  When released from this state, it jumps back to State 1 
			'  Mom_0 can be selected only if the NOSTATES parameter = 2 
			'Mom_2 	State 2 is momentary.
			'  When released from this state, it jumps back to State 0 
			'  Mom_2 can be selected only if NOSTATES parameter = 3 
			'Mom_1_2	States 1 and 2 are momentary.
			'  When released from any one of these states, it jumps back to State 0 
			'  Mom_1_2 can be selected only if NOSTATES parameter = 3 

			select case sd.DataValue("CurrentPoint.MOMSTATE")
				case "MOM_1"  	
					if me.innerText = sd.DataValue("CurrentPoint.STATETXT(1)") then ' going TO state1 ALWAYS returns to state0			
						bNeedMomentaryReturn = true
						sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(0)")  'in these cases *current* is *return to*
						shapeState1.Objects("shapeLEDRight").Value = 2
						shapeState0.Objects("shapeLEDRight").Value = 1
					end if
				case "MOM_0"
					if me.innerText = sd.DataValue("CurrentPoint.STATETXT(0)") then 'going TO state0 ALWAYS returns to state1
						bNeedMomentaryReturn = true
						sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(1)")
						shapeState0.Objects("shapeLEDRight").Value = 2
						shapeState1.Objects("shapeLEDRight").Value = 1
					end if
				case "MOM_2"
					if me.innerText = sd.DataValue("CurrentPoint.STATETXT(2)") then 'going TO state2 ALWAYS returns to state0
						bNeedMomentaryReturn = true
						sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(0)")
						shapeState2.Objects("shapeLEDRight").Value = 2
						if sOPCurrentMouseDownValue = sd.DataValue("CurrentPoint.STATETXT(1)") then
							shapeState1.Objects("shapeLEDRight").Value = 1
						else
							shapeState0.Objects("shapeLEDRight").Value = 1
						end if

					end if
				case "MOM_1_2"  'CHANGING (tested above) means we ARE moving from state0 to either state1 or state2, ALWAYS returns to state0
					bNeedMomentaryReturn = true
					sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(0)")
					shapeState0.Objects("shapeLEDRight").Value = 1
					if me.innerText = sd.DataValue("CurrentPoint.STATETXT(1)") then 
						shapeState1.Objects("shapeLEDRight").Value = 2
					else
						shapeState2.Objects("shapeLEDRight").Value = 2
					end if
			end select

			if bNeedMomentaryReturn = true then
				' operator is doing an explicit *momentary write* of OP, which we need to immediately recover back to current value
				bMomentaryTimerActive = false ' tested in TimerFunction2 to write return-to value
				window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: OPFINAL combo value selected: " & combo_OPFINAL.innerText & ", will immediately revert to: " & sCurrentShownRaiseLowerValue
				sDelayedWriteReleaseValue = sCurrentShownRaiseLowerValue 'delayed RTN value to write
		        if iTimerID2 <> 0 then
					window.clearInterval("TimerFunction2")
				end if
'				window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: explicit release; setting TimerFunction2 to write " & sCurrentShownRaiseLowerValue
    	    	iTimerID2 = window.setInterval("TimerFunction2",1500)
			else
				window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: NOT going TO momentary value; current: " & sCurrentShownRaiseLowerValue & ", new: " & me.innerText
				sOPMouseDownCurrentValue = ""
			end if
		end if
	end if
	
	'this object bound to OPFINAL which is the reflected process value
	'however, writes are made to OP not OPFINAL

	'value that timer routine will write to OP
	sOPTemp.innerText = me.innerText 

	'nDemandCount = 0 tells timer routine to 'write sOPTemp'
	nDemandCount = 0 

	'clear any potential existing timer (e.g. operator changes mind and sets value again)
	window.clearInterval(intTimerID)

	'immediately reflect (dis)agreement of OP vs this newly-requested OPFINAL value
	if me.innerText <> sd.DataValue("CurrentPoint.OPFINAL") then 
		textboxOPoffNormal.style.visibility = "inherit"
		textboxOP.style.visibility = "hidden"
	else
		textboxOPoffNormal.style.visibility = "hidden"
		textboxOP.style.visibility = "inherit"
	end if

	intTimerID = window.setInterval("UpdateOPFINAL()", 200) '2000)  'first time short as we do synch data write

	'we've handled the 'write' here, so don't have Experion attempt to actually write to opfinal
	me.CancelChange
		
	'probably not necessary, but add'l hint to Experion to just forget this event
	window.event.returnvalue = false</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onexecutecommand>	dim strCommand
	strCommand = window.event.getAttribute("onExecuteCommand", 0)

'	if not (strCommand="Raise" or strCommand="OKB RAISE" or strCommand="Lower" or strCommand="OKB LOWER") then
'		exit sub
'	end if

	window.external.parentdocument.parentwindow.external.logmessage "Event-OnExecuteCmd: " & strCommand

	'note: the OKB release keys are not raised as onexecutecommand events - see those actually handled as OnOperatorKey events on Page
	if not (strCommand="Raise" or strCommand="OKB RAISE" or strCommand="Lower" or strCommand="OKB LOWER" _
		or strCommand="Raise Release" or strCommand="Lower Release" or strCommand="RaiseRepeat" or _
		strCommand="LowerRepeat" or strCommand="OKB RAISE REPEATED" or strCommand="OKB LOWER REPEATED" _
		or strCommand="OKB RAISE RELEASE" or strCommand="OKB LOWER RELEASE") then
		exit sub
	end if

	'disable PV ramping if not PVSOURCE=MAN
	if sd.QualityGood("CurrentPoint.PVSOURCE") and sd.DataValue("CurrentPoint.PVSOURCE") <> "MAN" and UCase(window.document.activeElement.id) = "COMBO_PV" then
		window.event.returnvalue = false 'Notify Station the command is handled  (do nothing)
		exit sub
	end if


	'momentary support

	window.external.parentdocument.parentwindow.external.logmessage "RAMPING; activeElement: " & UCase(window.document.activeElement.id) & ", MOMSTATE: " & sd.DataValue("CurrentPoint.MOMSTATE") & ", NOSTATES: " & sd.DataValue("CurrentPoint.NOSTATES")

	if sHoldMomentaryValue <> "" or ((UCase(window.document.activeElement.id) = "COMBO_OP" or UCase(window.document.activeElement.id) = "GRPOP" or UCase(window.document.activeElement.id) = "COMBO_OPFINAL") and sd.DataValue("CurrentPoint.MOMSTATE") <> "NONE" and sd.DataValue("CurrentPoint.NOSTATES") > 1) then
		window.external.parentdocument.parentwindow.external.logmessage "RAMPING-MOMENTARY: calling MomentaryKeyHandling function" 
		call MomentaryKeyHandling(strCommand) 
		if bMomentaryHandled = true then
			window.external.parentdocument.parentwindow.external.logmessage "RAMPING-MOMENTARY: MomentaryKeyHandling DID ramp"
		else
			window.external.parentdocument.parentwindow.external.logmessage "RAMPING-MOMENTARY: MomentaryKeyHandling did NOT ramp" 
		end if	 
		'whether or not we actually were in position to make a momentary move, we do not proceed to non-momentary handling subsequently
		window.event.returnvalue = false 'Notify Station the command is handled
		exit sub
	end if

	' not momentary...

	window.external.parentdocument.parentwindow.external.logmessage "RAMPING: NON-MOMENTARY ****" 


	if Page.hasFocus or sElementRaiseLower <> "" or UCase(window.document.activeElement.id) = "COMBO_OPFINAL" or UCase(window.document.activeElement.id) = "COMBO_OP" or UCase(window.document.activeElement.id) = "COMBO_MD" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then

'raise/lower keys require operator confirmation - supported for OP, MODE, MODATTR
		if strCommand="Raise" or strCommand="OKB RAISE" then

			window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise " 
			if sElementRaiseLower = "OP" or UCase(window.document.activeElement.id) = "COMBO_OPFINAL" or UCase(window.document.activeElement.id) = "COMBO_OP" then							
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "OP"
				GrpOP.focus 'set focus to unbound element to avoid Station noise, reset to OP later
				if sCurrentShownRaiseLowerValue = "" then
					if bOPOnly then 
						sCurrentShownRaiseLowerValue = combo_OP.innerText
					else
						sCurrentShownRaiseLowerValue = combo_OPFINAL.innerText
					end if
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseOP(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			elseif sElementRaiseLower = "MODE" or UCase(window.document.activeElement.id) = "COMBO_MD" then				
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODE"

				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MD.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseMODE(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				GrpMD.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			elseif sElementRaiseLower = "MODATTR" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then				
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODATTR"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MDATTR.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseMODATTR(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue

Function UpdateOPFINAL()

	'This routine is used to write operator OP-changes and then track corresponding OPFINAL updates that are
	'directly placed into the OP's combobox text area
	window.external.parentdocument.parentwindow.external.logmessage "DIGCOMP faceplate - operator command to UpdateOPFinal to: >>" & sOPTemp.innerText & "<<"
	
	window.clearInterval(intTimerID)
	if nDemandCount = 0 then
		if not sd.SetDataValueSynchronous("CurrentPoint.OP", sOPTemp.innerText) then
			nDemandCount = 2  ' write failed, don't bother waiting any longer
		end if
	end if
	if 1 = trigger_update.value then 
		sd.TriggerDataUpdate("CurrentPoint.OPFINAL"), 1
	end if
	sd_OPFINAL.RequestDemandData
	sOPMouseDownCurrentValue = ""   'clear any possible mouse-driven momentary write (click on OP/OPFINAL combobox)

End Function

Function RaiseLowerConfirm2()

	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID) 'clear old/other timers
  	intRaiseLowerTimerID = window.setInterval ("CheckRaiseLowerResponse2()", 500)

End Function

sub CheckRaiseLowerResponse2

	dim sResponse
	dim iStatus
	dim ptPromptType 
	dim sMsgZoneText
	ptPromptType = 1

	on error resume next 'until page.AutoSelect... station issue resolved

	nConfirmCount = nConfirmCount + 1

	sMsgZoneText = window.external.parentdocument.parentwindow.external.MessageZoneText 

'	sConfirmRaiseLowerMsg = "<" & nConfirmCount & "> " & "Change state of TPS:" & text_NAME.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	sConfirmRaiseLowerMsg = "Change state of TPS:" & alphaTagName.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	iStatus = window.external.parentdocument.parentwindow.external.GetResponse3 (sConfirmRaiseLowerMsg, ptPromptType, sResponse)

	'window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: status returned= " & iStatus

	if iStatus = 0 and nConfirmCount > 1 then

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: - action cancelled by user" 
		call CancelRaiseLowerConfirmation
		exit sub
	elseif iStatus = 1 then
		if sResponse = "" then
			'no response yet... let timer fire again shortly
		else
			'recieved response, process it and we're DONE
			if UCase(sResponse) = "Y" then

				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: setting: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				if sElementRaiseLower = "OP" then
					if bOPOnly then 
'						sd.DataValue("CurrentPoint.OP") = sCurrentShownRaiseLowerValue
						combo_OP.hostpopulation = true
						combo_OP.value = sCurrentShownRaiseLowerValue
						if 1 = trigger_update.value then 
							sd.TriggerDataUpdate("CurrentPoint.OP"), 1
						end if
						combo_OP.focus
					else
						' same as if selected via combobox - reflect OPFINAL update a.s.a.p.
						sOPTemp.innerText = sCurrentShownRaiseLowerValue 

						'nDemandCount = 0 tells timer routine to 'write sOPTemp'
						nDemandCount = 0 

						'clear any potential existing timer (e.g. operator changes mind and sets value again)
						window.clearInterval(intTimerID)

						'immediately reflect (dis)agreement of OP vs this newly-requested OPFINAL value
						if combo_OPFINAL.innerText <> sCurrentShownRaiseLowerValue then 
							textboxOPoffNormal.style.visibility = "inherit"
							textboxOP.style.visibility = "hidden"
						else
							textboxOPoffNormal.style.visibility = "hidden"
							textboxOP.style.visibility = "inherit"
						end if

						intTimerID = window.setInterval("UpdateOPFINAL()", 200) '2000)  'first time short as we do synch data write
						combo_OPFINAL.focus
					end if
				elseif sElementRaiseLower = "MODE" then
					combo_MD.hostpopulation = true
					page.AutoSelectOnNextModeChange = true
					combo_MD.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODE"), 1
					end if
					combo_MD.focus
				elseif sElementRaiseLower = "MODATTR" then
					combo_MDATTR.hostpopulation = true
					combo_MDATTR.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODATTR"), 1
					end if
					combo_MDATTR.focus
				end if
			end if

			call CancelRaiseLowerConfirmation

		end if
	end if

	if nConfirmCount > 2 and (sMsgZoneText = "" or (sConfirmRaiseLowerMsg <> sMsgZoneText)) then		
		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: message text changed operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if

	'expire after Experion's "operator timeout" - e.g. 60 seconds (x2 as timer is .5 secs)
	if nConfirmCount > oper_timeout.value * 2 then 

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: nConfirmCount > Experion operator timeout: " & oper_timeout.value & "; operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if


end sub


Function GetNextLowerOP(sThisValue)

'state1 = StateText2
'state0 = StateText1
'state2 = StateText3
'don't allow "wrap-around ramping"

	if sThisValue <> sd.DataValue("CurrentPoint.STATETXT(0)") and sThisValue <> sd.DataValue("CurrentPoint.STATETXT(1)") and sThisValue <> sd.DataValue("CurrentPoint.STATETXT(2)") then
		'for case of 'UNDEF' ordering of 'next choice' is arbitrary
		if sd.QualityGood("CurrentPoint.STATETXT(1)") then
			GetNextLowerOP = sd.DataValue("CurrentPoint.STATETXT(1)")
		elseif sd.QualityGood("CurrentPoint.STATETXT(0)") then
			GetNextLowerOP = sd.DataValue("CurrentPoint.STATETXT(0)")
		elseif sd.QualityGood("CurrentPoint.STATETXT(2)") then
			GetNextLowerOP = sd.DataValue("CurrentPoint.STATETXT(2)")
		else
			GetNextLowerOP = sThisValue
		end if
	elseif sThisValue = sd.DataValue("CurrentPoint.STATETXT(0)") then
		if sd.QualityGood("CurrentPoint.STATETXT(2)") then
			GetNextLowerOP = sd.DataValue("CurrentPoint.STATETXT(2)")
		else
			GetNextLowerOP = sThisValue
		end if
	elseif sThisValue = sd.DataValue("CurrentPoint.STATETXT(1)") then
		if sd.QualityGood("CurrentPoint.STATETXT(0)") then

sub ApplyLayout()
'	This routine enables the 'smart sizing' of faceplates

	on error resume next

	'*******************************************************************************************************************
	' this code section enables faceplates to stretch taller, 
	' if the provided (SafeView) window has a height/width aspect ratio of 2.5 or greater
    
	dim oSview
    	dim nFpRatio, nSVWindowRatio, nNewRatio

	set oSview=getobject("","Honeywell.Workspace.Client")
    	If oSview.IsManagerActive = true then
        	nFpRatio= (Page.style.pixelHeight / Page.style.pixelWidth)
        	nSVWindowRatio= round((Page.parentElement.clientHeight / Page.parentElement.clientWidth),1)   'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        	nNewRatio = round(nSVWindowRatio / nFpRatio,1)                                                'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        	if window.external.AppWindow.width <= 500 and nSVWindowRatio >= 2.5 then                      '500px is max facplate width supported
            		Page.style.pixelHeight = clng((Page.style.pixelHeight * nNewRatio))
        	end if
    	end if
	' 
	'*******************************************************************************************************************

	GrpLowerPanel.style.top = ""
	GrpLowerPanel.style.bottom = "2px"

	grpPanelBackground.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2
	grpPanelBackground.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	grpPanelBackground.style.pixelHeight = Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10

	GrpCenterPanel.style.top = ""
	if (Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10) > 153 then
		GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	else
		GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 2) & "px"
	end if

	call UpdateCenterPanelLayout

end sub

'Set interlock value and OP value
Sub DigcompInterlock
    
    ' setinterlock
    If sd.QualityGood("CurrentPoint.Initman") Then
        If sd.DataValue("CurrentPoint.Initman") = 1 Then
            S0 = 0
            S1 = 0
            S2 = 0
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, Initman==1, Setting S0/S1/S2=0"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.REDTAG") Then
        If UCase(sd.DataValue("CurrentPoint.REDTAG")) = "ON" Then
            S0 = 0
            S1 = 0
            S2 = 0
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, RED TAG, Setting S0/S1/S2=0"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.modAttr") Then
        If UCase(sd.DataValue("CurrentPoint.PTEXECST")) = "ACTIVE" And UCase(sd.DataValue("CurrentPoint.modAttr")) = "PROGRAM" Then
            S0 = OPS0
            S1 = OPS1
            S2 = OPS2
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, PROGRAM modattr, Setting S0/S1/S2=OPS0/1/2"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.SI0") Then
        If sd.DataValue("CurrentPoint.SI0") = 1 Then
            S0 = 1
            S1 = 0
            S2 = 0
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, SIO==1, Setting S0=1, S1/S2=0"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.BYPASS") Then
        If sd.DataValue("CurrentPoint.BYPASS") = 1 Then
            S0 = 1
            S1 = 1
            S2 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, BYPASS==1, Setting S0/S1/S2=1"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.I0") Then
        If sd.DataValue("CurrentPoint.I0") = 1 Then
            S0 = 1
            S1 = 0
            S2 = 0
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, I0==1, Setting S0=1,S1/S2=0"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.I1") Then
        If sd.DataValue("CurrentPoint.I1") = 1 Then
            S0 = 0
            S1 = 1
            S2 = 0
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, I1==1, Setting S0=0,S1=1,S2=0"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.I2") Then
        If sd.QualityGood("CurrentPoint.I2") Then
            If sd.DataValue("CurrentPoint.I2") = 1 Then
                S0 = 0
                S1 = 0
                S2 = 1
                'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, Initman==1, Setting S0/S1=0,S2=1"
                Exit Sub
            End If
        End If
    End If
    If sd.QualityGood("CurrentPoint.P0") Then
        If sd.DataValue("CurrentPoint.P0") = 1 Then
            S0 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, P0==1, Setting S0=1"
        Else
            S0 = OPS0
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, P0<>1, Setting S0=OPS0=" & OPS0
        End If
    Else
        S0 = 0
        'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, Setting S0=0, P0 not GoodQuality"
    End If
    If sd.QualityGood("CurrentPoint.P1") Then
        If sd.DataValue("CurrentPoint.P1") = 1 Then
            S1 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, P1==1, Setting S1=1"
        Else
            S1 = OPS1
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, P1<>1, Setting S1=OPS1=" & OPS1
        End If
    Else
        S1 = 0
        'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, Setting S1=0, P1 not GoodQuality"
    End If
    If sd.QualityGood("CurrentPoint.P2") Then
        If sd.DataValue("CurrentPoint.P2") = 1 Then
            S2 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, P2==1, Setting S2=1"
        Else
            S2 = OPS2
        'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, P2<>1, Setting S2=OPS2=" & OPS2
        End If
    Else
        S2 = 0
        'window.external.parentdocument.parentwindow.external.logmessage "DigcompInterlock, Setting S2=0, P2 not GoodQuality"
    End If
    
End Sub


Sub DigitalPVComboEx(PVCombo, SecurityLevel)

    If SecurityLevel < 2 Then
        PVCombo.hostpopulation = True
        Exit Sub
    End If
    
    Dim sVal
    sVal = PVCombo.innerText
    
    If sd.QualityGood("CurrentPoint.PV") Then

        'window.external.parentdocument.parentwindow.external.logmessage "DigitalPVCombo - PV QualityGood"
        PVCombo.hostpopulation = False
        PVCombo.ResetContent

		if sd.QualityGood("CurrentPoint.PVSOURCE") and UCase(sd.DataValue("CurrentPoint.PVSOURCE")) <> "MAN" then
			PVCombo.innerText = sVal

' support for Momentary

sub MomentaryKeyHandling(strCommand)

	bMomentaryHandled = false

	if strCommand = "Raise" or strCommand = "RaiseRepeat" or strCommand = "OKB RAISE" or strCommand = "OKB RAISE REPEATED" then
		
		if sPrevStrCommand = "" then 'if not set, set it now to *same*
			sPrevStrCommand = "Raise"
		end if

		bMomentaryPressed = true
		'if we're just starting to ramp (no sCurrent...) or if **reversing** ramp direction in a hurry..., else allow timer-based ramping to continue
		if sCurrentShownRaiseLowerValue = "" or sPrevStrCommand = "Lower" then 'initial setup, else, let the timer function keep working
			if sCurrentShownRaiseLowerValue <> "" and sPrevStrCommand = "Lower" then  'indicative of **reversing** quickly (e.g. ramp up to ramp down)
				' do not change the *RTN* sCurrentShownRaiseLowerValue value
				window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: **quick-reverse** of ramping noted!!"
			else
 				sCurrentShownRaiseLowerValue = combo_OP.innerText  'this is the RTN *normal* value to which we eventually return on ramp-release
			end if
			sPrevStrCommand = "Raise" 'this is now our 'current ramping direction
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: *RTN* (combo_OP) is: >>" & sCurrentShownRaiseLowerValue & "<<"

			' determine which is correct raise value per MOMSTATE/NOSTATES values
			select case sd.DataValue("CurrentPoint.MOMSTATE")
				case "MOM_0" ' "OK to go to State0"
					if sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(2)") then 'ramping from State2 to State0 momentary
						window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: raise from State2 to State0"
						sHoldMomentaryValue = sd.DataValue("CurrentPoint.STATETXT(0)")
					else
						window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: raise but MOMSTATE=MOM_0 means do nothing"
						sCurrentShownRaiseLowerValue = "" 'bailing out
						bMomentaryHandled = false
						bMomentaryPressed = false
						sPrevStrCommand = ""
						exit sub
					end if
				case "MOM_1" ' "OK to go to State1"
					if sd.DataValue("CurrentPoint.NOSTATES") = 2 then
						'we will be returning to State0, even if for some reason current value is State1, so reset sCurrentShownRaiseLowerValue
						sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(0)")
						sHoldMomentaryValue = sd.DataValue("CurrentPoint.STATETXT(1)")' GetNextRaiseOP(sCurrentShownRaiseLowerValue) ' the one to raise to				
						window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: raise from State0 to State1"
					else ' NOSTATES=3
						if sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(2)") then 'ramping from 2 to 0 - NOT momentary
							window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: raise but from State2 to State0 non-momentary"
							sCurrentShownRaiseLowerValue = "" 'bailing out
							bMomentaryHandled = false
							bMomentaryPressed = false
							sPrevStrCommand = ""
							exit sub
						else 'we are ramping/holding from State0 to State1
							'we will be returning to State0, even if for some reason current value is State1, so reset sCurrentShownRaiseLowerValue
							sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(0)")
							sHoldMomentaryValue = sd.DataValue("CurrentPoint.STATETXT(1)")' GetNextRaiseOP(sCurrentShownRaiseLowerValue) ' the one to raise to				
							window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: raise from State2 to State0, hold value: >>" & sHoldMomentaryValue & "<<"
						end if
					end if
				case "MOM_2" ' you can't "ramp up" TO State2, so bail out														
					window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: raise but MOMSTATE=MOM_0 means do nothing"
					sCurrentShownRaiseLowerValue = "" 'bailing out
					bMomentaryHandled = false
					bMomentaryPressed = false
					sPrevStrCommand = ""
					exit sub
				case "MOM_1_2" 'NOSTATES=3 by defn; only valid for Momentary on RAISE if current value is State0
					if sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(2)") then 'NOT momentary ramp from State2 to State0
						window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: raise MOM_1_2 to non-momentary State0 from State2"
						sCurrentShownRaiseLowerValue = "" 'bailing out
						bMomentaryHandled = false
						bMomentaryPressed = false
						sPrevStrCommand = ""
						exit sub
					else 'either State0 or State1, we hold to State1 as Momentary
						'we will be returning to State0, even if for some reason current value is State1, so reset sCurrentShownRaiseLowerValue
						sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(0)")
						sHoldMomentaryValue = sd.DataValue("CurrentPoint.STATETXT(1)")
					end if
				case else
					window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: raise, invalid MOMSTATE! no-op"
					sCurrentShownRaiseLowerValue = "" 'bailing out
					MomentaryKeyHandling = false
					bMomentaryHandled = false
					bMomentaryPressed = false
					sPrevStrCommand = ""
			end select

'				sHoldMomentaryValue = sd.DataValue("CurrentPoint.STATE2")' GetNextRaiseOP(sCurrentShownRaiseLowerValue) ' the one to raise to
		else
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: sCurrentShownRaiseLowerValue already set to >>" & sCurrentShownRaiseLowerValue & "<<"
		end if
        if iTimerID = 0 then
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: Raise/Repeat set TimerFunction to write " & sHoldMomentaryValue
            iTimerID = window.setInterval("TimerFunction",1000)
 			bMomentaryTimerActive = true
       end if
	elseif strCommand = "Lower" or strCommand = "LowerRepeat" or strCommand = "OKB LOWER" or strCommand = "OKB LOWER REPEATED" then

		if sPrevStrCommand = "" then 'if not set, set it now to *same*
			sPrevStrCommand = "Lower"
		end if

		bMomentaryPressed = true
'		if sCurrentShownRaiseLowerValue = "" then

		if sCurrentShownRaiseLowerValue = "" or sPrevStrCommand = "Raise" then 'initial setup, else, let the timer function keep working
			if sCurrentShownRaiseLowerValue <> "" and sPrevStrCommand = "Raise" then  'indicative of **reversing** quickly (e.g. ramp up to ramp down)
				' do not change the *RTN* sCurrentShownRaiseLowerValue value
				window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: **quick-reverse** of ramping noted!!"
			else
 				sCurrentShownRaiseLowerValue = combo_OP.innerText  'this is the RTN *normal* value to which we eventually return on ramp-release
			end if
			sPrevStrCommand = "Lower" 'this is now our 'current ramping direction
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: *RTN* value is (combo_OP) is: >>" & sCurrentShownRaiseLowerValue & "<<"

			select case sd.DataValue("CurrentPoint.MOMSTATE")
				case "MOM_0" ' "OK to go to State0"
					if sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(1)") then 'ramping down from State1 to State0 momentary
						window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: lower from State1 to State0"
						sHoldMomentaryValue = sd.DataValue("CurrentPoint.STATETXT(0)")
					else
						window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: lower but MOMSTATE=MOM_0 means do nothing"
						sCurrentShownRaiseLowerValue = "" 'bailing out
						bMomentaryHandled = false
						bMomentaryPressed = false
						sPrevStrCommand = ""
						exit sub
					end if
				case "MOM_1" ' you can't "ramp down" to State1, so bail out														
					window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: lower, but MOMSTATE=MOM_1 (can't ramp DOWN to State1) means do nothing"
					sCurrentShownRaiseLowerValue = "" 'bailing out
					bMomentaryHandled = false
					bMomentaryPressed = false
					sPrevStrCommand = ""
					exit sub
				case "MOM_2" ' ramp down from either State1 (non-momentary) or from State0 (momentary)
					if sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(1)") then 'ramping DOWN from State1 to 0 - NOT momentary
						window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: lower but from State1 to State0 non-momentary"
						sCurrentShownRaiseLowerValue = "" 'bailing out
						bMomentaryHandled = false
						bMomentaryPressed = false
						sPrevStrCommand = ""
						exit sub
					else 'we are ramping/holding from State0 DOWN to State2
						'we will be returning to State0, even if for some reason current value is State2, so reset sCurrentShownRaiseLowerValue
						sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(0)")
						sHoldMomentaryValue = sd.DataValue("CurrentPoint.STATETXT(2)")' GetNextRaiseOP(sCurrentShownRaiseLowerValue) ' the one to raise to				
					end if
				case "MOM_1_2" 'NOSTATES=3 by defn; only valid for Momentary on LOWER if current value is State0
					if sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(1)") then 'NOT momentary ramp from State1 to State0
						window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: lower MOM_1_2 to non-momentary State0 from State2"
						sCurrentShownRaiseLowerValue = "" 'bailing out
						bMomentaryHandled = false
						bMomentaryPressed = false
						sPrevStrCommand = ""
						exit sub
					else 'either State0 or State2, we hold to State2 as Momentary
						'we will be returning to State0, even if for some reason current value is State2, so reset sCurrentShownRaiseLowerValue
						sCurrentShownRaiseLowerValue = sd.DataValue("CurrentPoint.STATETXT(0)")
						sHoldMomentaryValue = sd.DataValue("CurrentPoint.STATETXT(2)")
					end if
				case else
					window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: lower, invalid MOMSTATE! no-op"
					sCurrentShownRaiseLowerValue = "" 'bailing out
					bMomentaryHandled = false
					bMomentaryPressed = false
					sPrevStrCommand = ""
					exit sub
			end select

'				iDigitalOPValue = 0
            if iTimerID = 0 then
				window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: Lower/Repeat set TimerFunction to write " & sHoldMomentaryValue
                iTimerID = window.setInterval("TimerFunction",1000)
				bMomentaryTimerActive = true
            end if
		end if
	elseif strCommand = "Raise Release" or strCommand = "OKB RAISE RELEASE" then
		'set timer2 to write a delayed RTN normal value (so as to not defeat a recent or very short ramp)
		window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: (raise-release) setting OP back to " & sCurrentShownRaiseLowerValue
		sDelayedWriteReleaseValue = sCurrentShownRaiseLowerValue 'delayed RTN value to write
        if iTimerID2 = 0 then
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: Raise release; setting TimerFunction2 to write " & sCurrentShownRaiseLowerValue
            iTimerID2 = window.setInterval("TimerFunction2",1000)
    	end if
	elseif strCommand = "Lower Release" or strCommand = "OKB LOWER RELEASE" then
		'set timer2 to write a delayed RTN normal value (so as to not defeat a recent or very short ramp)
		window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: (lower-release) setting OP back to " & sCurrentShownRaiseLowerValue
		sDelayedWriteReleaseValue = sCurrentShownRaiseLowerValue 'delayed RTN value to write
        if iTimerID2 = 0 then
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: Lower release; setting TimerFunction2 to write " & sCurrentShownRaiseLowerValue
            iTimerID2 = window.setInterval("TimerFunction2",1000)
    	end if
	end if

	bMomentaryHandled = true

end sub

sub TimerFunction
    if bMomentaryPressed = true then
		window.external.parentdocument.parentwindow.external.logmessage "Momentary Timer - writing value " & sHoldMomentaryValue
		combo_OP.hostpopulation = true
		if sHoldMomentaryValue <> "" then
			combo_OP.value = sHoldMomentaryValue
			combo_OP.innerText = sHoldMomentaryValue 'because combo OP doesn't update well when continous ramping
		end if
		'clear each time - must be reset by the keypress to keep going
		bMomentaryPressed = false
		bMomentaryTimerActive = true
	elseif bMomentaryPressed = false then
		sPrevStrCommand = "" 'reset this to default blank value
		bMomentaryTimerActive = false
        window.clearInterval(iTimerID)
		sHoldMomentaryValue = ""
		sCurrentShownRaiseLowerValue = ""
		window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: Timer turned OFF"
		iTimerID = 0
    end if
end sub

sub TimerFunction2 
' This delayed function delays the write of the return value long enough to enable a previous
' raise/lower to be completed; particularly important for scenario in which a single ramp/lower click
' is pressed on an IKB that has instant release-response

	' do not write while bMomentaryActive flag is true; wait for ramps to complete first

	if not bMomentaryTimerActive then   'if active, we've yet to complete a delayed write, so wait

		if sDelayedWriteReleaseValue <> "" then 
			combo_OP.value = sDelayedWriteReleaseValue
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: delayed release RTN value written: " & sDelayedWriteReleaseValue
		end if
		bMomentaryPressed = false
		bMomentaryTimerActive = true
		sCurrentShownRaiseLowerValue = ""
		sDelayedWriteReleaseValue = ""
		window.clearInterval(iTimerID2)
		iTimerID2 = 0
	end if
	'else let this timer return to test again

end sub</SCRIPT>

Sub CommonAlarm

    Dim state_PNTSTATE
    ' point state indicator
    If sd.QualityGood("CurrentPoint.PNTSTATE") And UCase(sd.DataValue("CurrentPoint.PNTSTATE")) <> "OK" Then
        state_PNTSTATE = Left(sd.DataValue("CurrentPoint.PNTSTATE"), 1)
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - PNTSTATE=" & state_PNTSTATE
    Else
        state_PNTSTATE = ""
    End If
    
    '   Replace HIGHAL with ALENBST if inhibited
    If UCase(sd.DataValue("CurrentPoint.ALENBST")) <> "INHIBIT" Then
        If UCase(sd.DataValue("CurrentPoint.HIGHAL")) = "NOALARM" Or Not sd.QualityGood("CurrentPoint.HIGHAL") Then
            If state_PNTSTATE <> "" Then
                state_alarmState.Value = state_PNTSTATE
                If bToolTips = True Then
                    state_alarmState.Title = "PNTSTATE= " & sd.DataValue("CurrentPoint.PNTSTATE")
                End If
                state_alarmState.Style.visibility = "Visible"
            Else
                state_alarmState.Style.visibility = "Hidden"
            End If  ' state_PNTSTATE
           'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - NOALARM (or not config)"

Sub AnalogPVStatus
'
'   See Faceplate ocx for comment-matrix as to behavior here

    Dim bExOK

    If sd.QualityGood("CurrentPoint.PVEXHIFL") And Not sd.IsNan("CurrentPoint.PVEXHIFL") And sd.QualityGood("CurrentPoint.PVEXLOFL") And Not sd.IsNan("CurrentPoint.PVEXLOFL") Then
        bExOK = True
    Else
        bExOK = False
    End If

'   PV may be "not configured" in which case we hide the PV Status shape
    If UCase(sd.DataValue("CurrentPoint.PVSTS")) = "NORMAL" Or sd.QualityConfigError("CurrentPoint.PV") Then
		if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
			window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
			shpPvstatus.Value = 15 'Path status input error (alone)
			shpPvstatus.Style.visibility = "Visible"
		else
	        shpPvstatus.Value = 1  '1st is invisible
    	    shpPvstatus.Style.visibility = "Hidden"
	        'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - Normal (or not configured)"
		end if
    ElseIf UCase(sd.DataValue("CurrentPoint.PVSTS")) = "BAD" Then
        If bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'B'"
            shpPvstatus.Value = 2   ' red "B"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And (Not sd.DataValue("CurrentPoint.PVEXLOFL") <> 0) Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'H'"
            shpPvstatus.Value = 3   ' red "H"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf bExOK And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 And (Not sd.DataValue("CurrentPoint.PVEXHIFL") <> 0) Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'L'"
            shpPvstatus.Value = 4   ' red "L"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "MAN" Then
            'both EX..FL params must be 'off' ...look at PVSOURCE
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - M'"
            shpPvstatus.Value = 5   ' red "M"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "SUB" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'S'"
            shpPvstatus.Value = 6   ' red "S"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "BAD" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'B'(2)"
            shpPvstatus.Value = 13   ' red "B"
            shpPvstatus.Style.visibility = "Visible"
        Else
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'B'(3)"
            shpPvstatus.Value = 2   ' just make it bad - red "B"
            shpPvstatus.Style.visibility = "Visible"
        End If

		'for all of the above cases, if the path status is also bad, then adding "14" will update the tooltip accordingly in the shape sequence
		'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
		if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
			window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
			shpPvstatus.Value = shpPvstatus.value + 14  'include *Path Status Error* in tooltip ALONG WITH above status 
		end if

    ElseIf UCase(sd.DataValue("CurrentPoint.PVSTS")) = "UNCERTN" Then
        If bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'U'"
            shpPvstatus.Value = 7   ' yellow "U"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And (Not sd.DataValue("CurrentPoint.PVEXLOFL") <> 0) Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'H'(yellow)"
            shpPvstatus.Value = 8   ' yellow "H"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf bExOK And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 And (Not sd.DataValue("CurrentPoint.PVEXHIFL") <> 0) Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'L'(yellow)"
            shpPvstatus.Value = 9   ' yellow "L"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "MAN" Then
            'both EX..FL params must be 'off' ...look at PVSOURCE
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'M'(yellow)"
            shpPvstatus.Value = 10   ' yellow "M"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "SUB" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'S'(yellow)"
            shpPvstatus.Value = 11  ' red "S"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "BAD" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'U'(2)"
            shpPvstatus.Value = 7   ' yellow "U"
            shpPvstatus.Style.visibility = "Visible"
        Else
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'U'(3)"
            shpPvstatus.Value = 7   ' just make it uncertain - yellow "U"
            shpPvstatus.Style.visibility = "Visible"
        End If

		'for whatever the above is - adding "14" appends the "Path status error" msg to the tooltip.
		'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
		if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
			window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
			shpPvstatus.Value = shpPvstatus.value + 14  'include *Path Status Error* in tooltip ALONG WITH above status
		end if

    Else ' non-configured PVSTS parameter; GUS fp then looks for only SUB/MAN
        If UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "MAN" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'M'(2, yellow)"
            shpPvstatus.Value = 14   ' yellow "M" 
            shpPvstatus.Style.visibility = "Visible"
 			'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
			if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
				window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
				shpPvstatus.Value = shpPvstatus.value + 14 
			end if
       ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "SUB" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'S'(2, yellow)"
            shpPvstatus.Value = 12  ' yellow "S" 
            shpPvstatus.Style.visibility = "Visible"

			'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
			if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
				window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
				shpPvstatus.Value = shpPvstatus.value + 14 
			end if
        Else    ' hide it "OK" (unless path bad)
			'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
			if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
				window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
				shpPvstatus.Value = 15 
            	shpPvstatus.Style.visibility = "Visible"
			else
		    	'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - Normal (2)"
            	shpPvstatus.Value = 1  'invisible
            	shpPvstatus.Style.visibility = "Hidden"
			end if
	    End If
    End If

End Sub

Function RaiseLowerConfirm()

	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID) 'clear old/other timers
  	intRaiseLowerTimerID = window.setInterval ("CheckRaiseLowerResponse()", 500)

End Function

sub CancelRaiseLowerConfirmation

	'generic routine to clean up and bail out of confirmation of raise/lower OP/MODE/MODATTR
	window.external.parentdocument.parentwindow.external.CancelResponse
	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID)
	sCurrentShownRaiseLowerValue = ""
	sElementRaiseLower = ""
	sConfirmRaiseLowerMsg = ""
end sub

Function OnDeactivateCancelRamp2

	window.clearInterval(intCancelRampOnPageDeactivateID)
	call CancelRaiseLowerConfirmation

end function


sub CheckRaiseLowerResponse

	dim sResponse
	dim iStatus
	dim ptPromptType 
	dim sMsgZoneText
	ptPromptType = 1

	nConfirmCount = nConfirmCount + 1

	sMsgZoneText = window.external.parentdocument.parentwindow.external.MessageZoneText 

'	sConfirmRaiseLowerMsg = "<" & nConfirmCount & "> " & "Change state of TPS:" & text_NAME.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	sConfirmRaiseLowerMsg = "Change state of TPS:" & alphaTagName.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	iStatus = window.external.parentdocument.parentwindow.external.GetResponse3 (sConfirmRaiseLowerMsg, ptPromptType, sResponse)

	'window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: status returned= " & iStatus

	if iStatus = 0 and nConfirmCount > 1 then

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: - action cancelled by user" 
		call CancelRaiseLowerConfirmation
		exit sub
	elseif iStatus = 1 then
		if sResponse = "" then
			'no response yet... let timer fire again shortly
		else
			'recieved response, process it and we're DONE
			if UCase(sResponse) = "Y" then

				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: setting: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				if UCase(sElementRaiseLower) = "MODE" then
					combo_MD.hostpopulation = true
'					page.AutoSelectOnNextModeChange = true
					Call SetAutoSelect
					combo_MD.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODE"), 1
					end if
					combo_MD.focus
				elseif UCase(sElementRaiseLower) = "MODATTR" then
					combo_MDATTR.hostpopulation = true
					combo_MDATTR.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODATTR"), 1
					end if
					combo_MDATTR.focus
				end if
			end if

			call CancelRaiseLowerConfirmation

		end if
	end if

	if nConfirmCount > 2 and (sMsgZoneText = "" or (sConfirmRaiseLowerMsg <> sMsgZoneText)) then		
		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: message text changed operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if

	'expire after Experion's "operator timeout" - e.g. 60 seconds (x2 as timer is .5 secs)
	if nConfirmCount > oper_timeout.value * 2 then 

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: nConfirmCount > Experion operator timeout: " & oper_timeout.value & "; operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if


end sub

<SCRIPT id=44E2F4AF-016E-4438-83E1-2015B17A2118 language=JScript defer 
shaperefcount="1">var centerPanelCurrentPage = 1;
centerPanelCurrentDot = 1;
var centerPanelMaxPage = 5;
var centerPanelMaxPageConfigured = 5;
var oShape
var ColorTheme = 'Light';
var colorTheme = 1;
var bshow2ndPage = true;
var bshow3rdPage = true;
var bshow4thPage = true;
var PageContentBaseId = 'CenterPanelPage';

function calculateActualDots()
{

	//Calculate actual dots as per the boolean configured like show2ndPage, show3rdPage
	if (bshow2ndPage != true && centerPanelMaxPageConfigured >= 2)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}
	if (bshow3rdPage != true && centerPanelMaxPageConfigured >= 3)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}
	if (bshow4thPage != true && centerPanelMaxPageConfigured >= 4)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}

	//Once Actual dots calculated initialize the Navigation button with dots
	initializeNavButton()
}

function initializeNavButton()
{

	//Default hide all and show only dots which are applicable
	oShape.objects("btn" + ColorTheme + 'Closed').style.visibility = "inherit";

	switch (centerPanelMaxPage)
	{
		case 2:
			oShape.objects("dotSelected" + ColorTheme + 21).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 22).style.visibility = "inherit";
			break;
		case 3:
			oShape.objects("dotSelected" + ColorTheme + 31).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 32).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 33).style.visibility = "inherit";
			break;
		case 4:
			oShape.objects("dotSelected" + ColorTheme + 41).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 42).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 43).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 44).style.visibility = "inherit";
			break;
		case 5:
			oShape.objects("dotSelected" + ColorTheme + 51).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 52).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 53).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 54).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 55).style.visibility = "inherit";
			break;
		default:
			oShape.style.visibility = 'hidden';
	}
}

function PanelNavigation()
{

	// centerPanelCurrentDot to handle current dots to be selected.
	// centerPanelCurrentPage page to handle current Page to be shwon

	//Hide all
	centerPanelCurrentPage = centerPanelCurrentPage + 1;
	centerPanelCurrentDot = centerPanelCurrentDot + 1;


	//skipping current page based on the boolean configured like show2ndPage, show3rdPage and show4thPage
	if (bshow2ndPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 2)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;

	}
	if (bshow3rdPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 3)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;

	}
	if (bshow4thPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 4)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;
	}
	//Resetting the centerPanelCurrentPage to default in case centerPanelCurrentPage crossed the limit as per the boolean configured like show2ndPage, show3rdPage and show4thPage
	if (bshow2ndPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 2)
	{
		centerPanelCurrentPage = 1
	}
	if (bshow3rdPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 3)
	{
		centerPanelCurrentPage = 1
	}
	if (bshow4thPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 4)
	{
		centerPanelCurrentPage = 1
	}

	//Applying the style to the button as per the Closed and Open Status, If the selected dots is other than 1 then its open button.
	if (centerPanelCurrentDot == 1)
	{
		oShape.objects("btn" + ColorTheme + 'Closed').style.visibility = "inherit";
	}
	else
	{
		oShape.objects("btn" + ColorTheme + 'Open').style.visibility = "inherit";
	}
	//Applying the style to the dots as per selected/unselected dots.
	for (var i = 1; i <= centerPanelMaxPage; i++)
	{
		if (i == centerPanelCurrentDot)
		{
			oShape.objects("dotSelected" + ColorTheme + centerPanelMaxPage + i).style.visibility = "inherit";
		}
		else
		{
			oShape.objects("dotUnselected" + ColorTheme + centerPanelMaxPage + i).style.visibility = "inherit";
		}
	}
	// Showing only the applicable page as per the selected dots
	for (obj in oShape.parentElement.children)
	{
		if (obj.toUpperCase().indexOf(PageContentBaseId) !== -1)
		{
			if (obj.slice(-1) == centerPanelCurrentPage)
			{
				document.getElementById(obj).style.display = "block"
				document.getElementById(obj).style.visibility = "Inherit";
			}
			else
			{
				document.getElementById(obj).style.display = "None"
				document.getElementById(obj).style.visibility = "Hidden";
			}
		}
	}
	// Resetting the centerPanelCurrentPage in case it ha crossed the max of configured page
	if (centerPanelCurrentPage >= centerPanelMaxPageConfigured)
	{
		centerPanelCurrentPage = 0;
	}
	// Resetting the dots in case it ha crossed the max of configured page
	if (centerPanelCurrentDot >= centerPanelMaxPage)
	{
		centerPanelCurrentDot = 0;
	}
}</SCRIPT>
