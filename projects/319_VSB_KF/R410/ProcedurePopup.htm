<SCRIPT language=JScript>
function GetPageParam(Param)
{
	var sValue = "";				// Parse the SCM name from the URL

	if( (document.location.search != null) && (document.location.search.length > 0) )
	{
		// get rid of the leading '?', url unencode, and split at '&'
		var arrPairs = unescape( document.location.search.substr(1) ).split("&");
		var len = arrPairs.length;
	
		for( var i=0; i < len; i++ )
		{
			// split at the equals
			var arrPair = arrPairs[i].split("=");

			if( arrPair.length == 2 )
			{
				if( arrPair[0].toUpperCase() == Param.toUpperCase())
				{
					sValue = arrPair[1];
				}
			}
		}
	}
	return sValue;
}
</SCRIPT>

<SCRIPT language=VBScript event=onpagecomplete for=Page defer>Dim procedureName
Dim showDescription
Dim showBatchId
Dim enableCommand
Dim enableMode
Dim enableModeAttribute

procedureName = GetPageParam("ProcedureName")
showDescription = GetPageParam("ShowDescription")
showBatchId= GetPageParam("ShowBatchId")
enableCommand = GetPageParam("EnableCommand")
enableMode = GetPageParam("EnableMode")
enableModeAttribute = GetPageParam("EnableModeAttribute")


PPC1.ProcedureName = procedureName
PPC1.BindTo = "Specific Procedure"
If showDescription = "true" Then
    PPC1.ShowDescription = true
Else
    PPC1.ShowDescription = false
End if
If showBatchId = "true" Then
    PPC1.ShowBatchId = true
Else
    PPC1.ShowBatchId = false
End if
If enableCommand = "true" Then
    PPC1.EnableCommand = true
Else
    PPC1.EnableCommand = false
End if
If enableMode = "true" Then
    PPC1.EnableMode = true
Else
    PPC1.EnableMode = false
End if
If enableModeAttribute = "true" Then
    PPC1.EnableModeAttribute = true
Else
    PPC1.EnableModeAttribute = false
End if

PC1.ProcedureName = procedureName
PC1.Initialize()</SCRIPT>
