<SCRIPT language=JScript for=cboFileName defer event=ondatachange>if (this.QualityGood("CurrentPoint.FileServiceQuery"))
{
	var sFileNames = this.DataValue("CurrentPoint.FileServiceQuery").split(",");
	this.ResetContent();
	cboFileName.value = alpSelectFileName.value;
	for ( var i = 0 ; i < sFileNames.length ; i++ )
	{
		this.AddString(sFileNames[i]);
	}
}</SCRIPT>
<SCRIPT language=JScript for=Page defer event=onpagecomplete>cboFileCommand.AddString(FileCommandType0.value);
cboFileCommand.AddString(FileCommandType1.value);
cboFileCommand.AddString(FileCommandType2.value);
cboFileCommand.value = alpSelectCommand.value ;
cboFileName.value = alpSelectFileName.value
var gobjShell = window.external.CreateWhitelistedObject("WScript.Shell", 1);
if (typeof(gobjShell) == "object" )
{
	var strIEC61850ConfigPath = gobjShell.RegRead("HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Honeywell\\IEC61850\\IEC61850Root");
	var strIEC61850BasePath = strIEC61850ConfigPath.slice(0, -13);
	strIEC61850FileTransferPath = strIEC61850BasePath + 'FileTransfer' + '\\';
	ConAlpReadFileOutPath.value = strIEC61850FileTransferPath;
}</SCRIPT>
<SCRIPT language=JScript defer>var iFileServiceCommand = 1;
var sFilePath = "";
var sFileName = ""
var bReadFileName = false;
var strIEC61850FileTransferPath = "";</SCRIPT>
<SCRIPT language=JScript for=pbConfirm defer event=onclick>if (this.QualityGood("CurrentPoint.FileServiceCommand"))
{
	sFileName = "";
	sFilePath = "";
	if (cboFileCommand.selectedIndex == 0)  // Read File
	{
		if (ConAlpLocalFileName.value.length == 0 || ConAlpLocalFileName.value == "Enter local file name" )
		{
			ConAlpLocalFileName.value = "Enter local file name";	
			ConAlpLocalFileName.focus();
			return;
		}
		sFileName = cboFileName.value;
		sFilePath = ConAlpReadFileOutPath.value + ConAlpLocalFileName.value;
		var sFileServiceQuery = sFileName + "," + sFilePath 
		this.DataValue("CurrentPoint.FileServiceQuery") = sFileServiceQuery;
		this.DataValue("CurrentPoint.FileServiceCommand") = iFileServiceCommand;
	}
	if (cboFileCommand.selectedIndex == 1)  //Delete File
	{
		sFileName = cboFileName.value;
		var sFileServiceQuery = sFileName;
		this.DataValue("CurrentPoint.FileServiceQuery") = sFileServiceQuery;
		this.DataValue("CurrentPoint.FileServiceCommand") = iFileServiceCommand;
	}
	if (cboFileCommand.selectedIndex == 2)  //Transfer File
	{
		if (ConAlpLocalFilePath.value.length == 0 || ConAlpLocalFilePath.value == "Enter local file name")
		{
			ConAlpLocalFilePath.value = "Enter local file name";	
			ConAlpLocalFilePath.focus();
			return;
		}
		if (ConAlpRemoteFileName.value.length == 0 || ConAlpRemoteFileName.value == "Enter remote file name")
		{
			ConAlpRemoteFileName.value = "Enter remote file name";	
			ConAlpRemoteFileName.focus();
			return;
		}
		sFileName = ConAlpRemoteFileName.value;
		sFilePath = strIEC61850FileTransferPath + ConAlpLocalFilePath.value;
		var sFileServiceQuery =  sFilePath + "," + sFileName;
		this.DataValue("CurrentPoint.FileServiceQuery") = sFileServiceQuery;
		this.DataValue("CurrentPoint.FileServiceCommand") = iFileServiceCommand;
	}
}
	cboFileCommand.value = alpSelectCommand.value;
	cboFileName.value = alpSelectFileName.value;
	this.DataValue("CurrentPoint.FileServiceQuery") = "";
	alpLastCommandSent.innerText = alpCurrentDate.innerText + " " + new Date().toLocaleTimeString();</SCRIPT>
<SCRIPT language=JScript for=cboFileCommand defer event=onchange>if (this.QualityGood("CurrentPoint.FileServiceCommand") )
	{
		this.DataValue("CurrentPoint.FileServiceCommand") = 1 // Update the file list
	}
if (this.selectedIndex == 0)
{
	iFileServiceCommand = 4;	//Read File
	GrpFileList.style.visibility = "inherit"
	grpReadFile.style.visibility = "inherit"
	grpTransferFile.style.visibility = "hidden"
	pbConfirm.disabled = false;
	ConAlpLocalFileName.value = "Enter local file name"
}
else if (this.selectedIndex == 1)
{
	iFileServiceCommand = 5;	//Delete File
	if (this.QualityGood("CurrentPoint.FileServiceCommand") )
	{
		this.DataValue("CurrentPoint.FileServiceCommand") = 1 // Update the file list
	}
	GrpFileList.style.visibility = "inherit"
	grpReadFile.style.visibility = "hidden"
	grpTransferFile.style.visibility = "hidden"
	if (window.external.Application.SecurityLevel <= 2)
	{
		pbConfirm.disabled = true;	
	}
	else
	{
		pbConfirm.disabled = false;
	}
}
else if (this.selectedIndex == 2)
{
	iFileServiceCommand = 6;	// Transfer File
	if (this.QualityGood("CurrentPoint.FileServiceCommand") )
	{
		this.DataValue("CurrentPoint.FileServiceCommand") = 1 // Update the file list
	}
	grpTransferFile.style.visibility = "inherit"
	grpReadFile.style.visibility = "hidden"
	GrpFileList.style.visibility = "hidden"
	ConAlpLocalFilePath.value = "Enter local file name"
	ConAlpRemoteFileName.value = "Enter remote file name"
	if (window.external.Application.SecurityLevel <= 2)
	{
		pbConfirm.disabled = true	
	}
	else
	{
		pbConfirm.disabled = false
	}
}
grpCommandStatus.style.visibility = "Inherit";</SCRIPT>
