<SCRIPT language=VBScript defer>dim gbPageComplete, strCtlBlockName ,PreviousModeAttr

strCtlBlockName = "mai"


correctWidth = 0
SKIP = -1

Sub ApplyLayout()           
                Call AdjustHeight()
                Call AdjustWidth()
End Sub

Sub AdjustHeight()
                
                GrpLowerPanel.style.top = "" 
                GrpLowerPanel.style.bottom = "2px"
                GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 
                GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
              	 
End Sub

Sub AdjustWidth()
                Call CalculateCorrectWidth()       
                if (correctWidth <> SKIP) then                   
                    GrpUpperPanel.style.pixelwidth = correctWidth 
                    GrpCenterPanel.style.pixelwidth = correctWidth
                    GrpLowerPanel.style.pixelwidth = correctWidth 
												
                end if
End Sub

Sub CalculateCorrectWidth()
                POPUP = 0
                displayType = window.external.Application.CurrentDisplayPageType 
				CurrentPage = window.external.CurrentPage
					if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
                	
                                correctWidth = SKIP
                                Exit Sub
               		else   

               		if (page.style.zoom > 1) then   
                 		shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))                               
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                                                                                                 
                    else                                        
                         shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                         correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                

                    end if

                end if    

End Sub

sub AlarmUpdate
dim iAlarm
	On error resume next
	iAlarm = sd.DataValue("CurrentPoint.do.alarm_sum.current")
	'if (iAlarm and &H2)>0 then
	'    ShpHiAlmType.value=2
	'elseif (iAlarm and &H8)>0 then
	'    ShpHiAlmType.value=3
	'elseif (iAlarm and &H4)>0 then
	'    ShpHiAlmType.value=4
	'elseif (iAlarm and &H10)>0 then
	'    ShpHiAlmType.value=5
	'elseif (iAlarm and &H20)>0 then
	'    ShpHiAlmType.value=6
	'elseif (iAlarm and &H40)>0 then
	'    ShpHiAlmType.value=7
	if (iAlarm and &H80)>0 then
	    ShpHiAlmType.value=8
	else
	    ShpHiAlmType.value=1
	end if
end sub

sub GrantDeny
   On error resume next
	if sd.DataValue("Currentpoint.mai.grant_deny.grant.oper") xor sd.DataValue("Currentpoint.mai.grant_deny.grant.local") then
		cboModeAttr.value = txtsdPROGRAM.value
	elseif not(sd.DataValue("Currentpoint.mai.grant_deny.grant.oper")) then
		cboModeAttr.value = txtsdOPERATOR.value
	else 
		cboModeAttr.value = txtsdNONE.value ' This shouldn't happen
	end if
	PreviousModeAttr = cboModeAttr.value
end sub</SCRIPT>
