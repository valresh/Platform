<SCRIPT language=JScript for=pbLocationBrowser defer event=onclick>
try
{
	var itype

	{
		case 5:
		case 6:
		case 7:
			itype = 3; //show both models for EBI products

			itype = 5; //show only the asset and system components model
	}
	LocationDialog.Show(itype)
}
catch (e)
{};</SCRIPT>
