<SCRIPT language=JScript for=alpMessage defer event=onupdate>if(this.DataChanged("CurrentPoint.Message"))
{
	if (this.QualityGood("CurrentPoint.Message"))
	{
		var newMessage = this.value;
		if ((newMessage.length != 0 )  && (bPageComplete == true))
		{
			window.external.Application.TemporaryMessageZoneText(newMessage);
			bPageComplete = true;
		}
		else
		{
			bPageComplete = true;
		}
	}
}</SCRIPT>
