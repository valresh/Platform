<SCRIPT language=VBScript for=HwPropCollControl defer 
event="PropertyChanged(szKey, szProperty)">'On Error resume Next
If False then

ElseIf(szKey = "/Trend_Line_Ready") then	'FullTrend Re-Init logic here
	Dim i
	Dim iTrendLineCount

	iTrendLineCount = HwPropCollControl.Use("/Trend_Line_Count").Value
	If iTrendLineCount < 0 Then
		iTrendLineCount = 0
	ElseIf(iTrendLineCount > 32) Then
		iTrendLineCount = 32
	End If
	If (iTrendLineCount = 0) Then
		'Clean the FullTrend/Rmove all plots
		For i = 1 to 32
			FullTrend.Legend.PlotVisible(i) = False
		Next
	Else
		Dim strPoint, strParam, iStyle, iColor
		'Read the Keys and populate FullTrend
		FullTrend.AutoRuntimeDataRequest = False
		For i=0 to iTrendLineCount-1
			strPoint = Eval("HwPropCollControl.Use(""/Trend_Line_Point[" & i & "]"").Value")
			strParam = Eval("HwPropCollControl.Use(""/Trend_Line_Param[" & i & "]"").Value")
			iStyle = Eval("HwPropCollControl.Use(""/Trend_Line_Style[" & i & "]"").Value")
			iColor = Eval("HwPropCollControl.Use(""/Trend_Line_Color[" & i & "]"").Value")
			
			FullTrend.Legend.PointID(i+1) = strPoint
			FullTrend.Legend.Parameter(i+1) = strParam
			FullTrend.Legend.PlotVisible(i+1) = True
			FullTrend.Legend.PlotColor(i+1) = iColor
			FullTrend.ChartArea.Plots.Item(i+1).MarkerStyle = iStyle
		Next
		For i = iTrendLineCount+1 to 32
			FullTrend.Legend.PlotVisible(i) = False
		Next
		FullTrend.RuntimeDataRequest	'Batch subscribe the plots	
		Select Case CInt(HwPropCollControl.Use("/Trend_Interval").Value)
			Case 0		FullTrend.SetSampleInterval 0,1,0,0,False	'1Min
			Case 1		FullTrend.SetSampleInterval 0,6,0,0,True	'6MinAvg
			Case 2		FullTrend.SetSampleInterval 1,0,0,0,True	'1HourAvg
			Case 3		FullTrend.SetSampleInterval 8,0,0,0,True	'8HourAvg
			Case 4		FullTrend.SetSampleInterval 24,0,0,0,True	'24HourAvg
			Case 5		FullTrend.SetSampleInterval 0,0,5,0,False	'5Sec
			Case 6		FullTrend.SetSampleInterval 1,0,0,0,False	'1Hour
			Case 7		FullTrend.SetSampleInterval 8,0,0,0,False	'8Hour
			Case 8		FullTrend.SetSampleInterval 24,0,0,0,False	'24Hour
			Case Else	FullTrend.SetSampleInterval 0,0,3,0,False	'default 3Sec
		End Select
		If(HwPropCollControl.Use("/Trend_Freeze").Value = False) Then
			FullTrend.Resume
			FullTrend.SetPeriod 0,0,0,0,0,0,HwPropCollControl.Use("/Trend_Est_Duration").Value
			FullTrend.SetPeriod 0,0,0,0,0,0,HwPropCollControl.Use("/Trend_Est_Duration").Value
		Else
			FullTrend.SetTimeRange CDate(HwPropCollControl.Use("/Trend_Start_Time").Value), 0.0, CDate(HwPropCollControl.Use("/Trend_End_Time").Value)
			FullTrend.Pause
		End If
	End If
End if</SCRIPT>

<SCRIPT language=JScript defer>function BackgroundPropChange()
{
	if ( (event.propertyName == "style.zoom") || (event.propertyName == "style.width") || (event.propertyName == "style.height") )
	{
		ResizeSystemTrend();
	}
}

function ResizeSystemTrend()
{
	try
	{	
		if (window.external.ZoomToFit ) 
		{
			Page.style.width = "100%";
			Page.style.height = "100%";
		}
		else
		{
			var varZoomLevel = Page.style.zoom;
			var varClientWidth = document.body.clientWidth;
			var varClientHeight = document.body.clientHeight;	
			
			// zoomed client width:
			varClientWidth = varClientWidth * varZoomLevel;
			varClientHeight = varClientHeight * varZoomLevel;						
	
			Page.style.pixelWidth = varClientWidth;
			Page.style.pixelHeight = varClientHeight;		
			
			Background.style.pixelWidth = varClientWidth;
			Background.style.pixelHeight = varClientHeight;		
			
		}
	}
	catch (e)
	{
		// Don't try anything if we got an exception
	}		
}

function BeforePrint()
{
	
	var DefaultPageWidth, DefaultPageHeight;

	DefaultPageWidth = 1020;
	DefaultPageHeight = 589;

	if (window.external.ZoomToFit)
	{
		Page.style.width = "100%";
		Page.style.height = "90%";
		
	}
	else
	{
		Page.style.width = DefaultPageWidth;
		Page.style.height = DefaultPageHeight;
	}
}</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onpagecomplete>'On Error Resume Next
Dim strLocation
Dim SEQ
Dim SelectedName
Dim RefType
Dim p1pos
Dim p2pos

SEQ = vbNullString
SelectedName = vbNullString
RefType = vbNullString
'Fetch the Query String Parameters and set Custom Properties.
strLocation = lcase(document.location)

p1pos = InStr(strLocation,"seq=")
p2pos = InStr(p1pos,strLocation,"%")
if(p2pos = 0) then 
p2pos = InStr(p1pos,strLocation,"&")
end if
If(p2pos <> 0) Then
	SEQ = Mid(strLocation, p1pos+4, p2pos-p1pos-4)
End If

p1pos = InStr(strLocation,"selectedname=")
p2pos = InStr(p1pos,strLocation,"%")
if(p2pos = 0) then 
p2pos = InStr(p1pos,strLocation,"&")
end if
If(p2pos <> 0) Then
	SelectedName = Mid(strLocation, p1pos+13, p2pos-p1pos-13)
End If

p1pos = InStr(strLocation,"reftype=")
p2pos = InStr(p1pos,strLocation,"%")
if(p2pos = 0) then 
p2pos = InStr(p1pos,strLocation,"&")
end if
If(p2pos <> 0) Then
	RefType = Mid(strLocation, p1pos + 8, p2pos-p1pos-8)
End If

If(SEQ<>vbNullString AND SelectedName<>vbNullString AND RefType<>vbNullString) Then
	If(RefType = "step") Then
		Set seqStepDetail.HwPropColl = HwPropCollControl
		seqStepDetail.Init
	ELseIf(RefType = "phase") Then
		Set seqPhaseDetail.HwPropColl = HwPropCollControl
		seqPhaseDetail.Init
	Else
		window.external.TemporaryMessageZoneText = txtInvalidRefType.value
	End If

	HwPropCollControl.Use("/Chart_Visualisation").Value = True
	HwPropCollControl.Use("/Monitor").Value = True
	HwPropCollControl.Use("/Access_Level").Value = CInt(window.external.SecurityLevel)
	HwPropCollControl.Use("/User").Value = CStr(window.external.OperatorID)
	HwPropCollControl.Use("/Server").Value = CStr(window.external.DetailPointServerNetworkName)
	HwPropCollControl.Use("/Station_Number").Value = CInt(window.external.StationNumber)
	HwPropCollControl.Use("/TrendLogicOnly").Value = True

	HwPropCollControl.Use("/SEQ").Value = CStr(SEQ)
	HwPropCollControl.Use("/SEQ_SelectedBlock").Value = CStr(SelectedName)
Else
	window.external.TemporaryMessageZoneText = txtInvalidProcedureNameRefType.value
End If</SCRIPT>
