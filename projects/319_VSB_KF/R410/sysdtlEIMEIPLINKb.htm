<SCRIPT language=JScript defer>var bPageLoadComplete = false;
var CurrScrollBarPosition = 0;
var NumOfScrolls = 0;
var gNumAdjParams = 255 ;
var NumOfRows = 20;
var CurrPageNo = 1;
function ChangeParameters()
{
	for( var i=0; i<=19; i++)
	{
		var iTemp = (CurrScrollBarPosition) * 20 + i;
		if(iTemp > gNumAdjParams - 1)
		{
			document.getElementById("grpDevices" +i).style.visibility = "hidden";
			document.getElementById("alpNum" +i).style.visibility = "hidden";
		}
		else
		{			
			DisplayDataRepository.PutValue("index" + i , iTemp);
			//document.getElementById("grpDevices" +i).style.visibility = "Inherit";
			document.getElementById("alpNum" +i).style.visibility = "Inherit";
		}
	}

	if(gNumAdjParams < 20)
	{
           	document.getElementById("grpPageNavigation").style.visibility = "hidden";
	}

	for( var i=0; i<=19; i++)
	{
		 var iTemp = (CurrScrollBarPosition) * 20 + i;
		 document.getElementById("alpNum" +i).value = iTemp;
	}
		if( NumOfScrolls == 0)
		{
			pbFirstPage.disabled = true;
			pbLastPage.disabled = true;
			pbNextPage.disabled = true;
			pbPrevPage.disabled = true;
		}
		else if(CurrScrollBarPosition > 0 && CurrScrollBarPosition < NumOfScrolls)
		{
			pbFirstPage.disabled = false;
			pbLastPage.disabled = false;
			pbNextPage.disabled = false;
			pbPrevPage.disabled = false;
		}
		else if(CurrScrollBarPosition == 0)
		{
			pbFirstPage.disabled = true;
			pbLastPage.disabled = false;
			pbNextPage.disabled = false;
			pbPrevPage.disabled = true;
		}
		else if(CurrScrollBarPosition == NumOfScrolls)
		{
			pbFirstPage.disabled = false;
			pbLastPage.disabled = true;
			pbNextPage.disabled = true;
			pbPrevPage.disabled = false;
		}
		PageNo.value = (CurrScrollBarPosition + 1);
		CurrPageNo = (CurrScrollBarPosition + 1);
}</SCRIPT>
