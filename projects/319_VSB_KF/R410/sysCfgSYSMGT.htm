<SCRIPT language=VBScript for=PBAssetbrowser1 defer event=onclick>	bAlarmGroupBrowser = false
	itype = 1 
	LocationDialog.Show(itype)</SCRIPT>
<SCRIPT language=JScript for=Page defer event=onunload>	try
	{
		LocationDialog.visible = false;
	}
	catch(e)
	{
	};</SCRIPT>
<SCRIPT language=JScript defer>var LocationDialog;
	// The owner of the location dialog
    // 1 - The dialog is called up by "Assignable asset"
    // 2 - The dialog is called up by "Associated asset"
    var LocationDialogOwner;</SCRIPT>
<SCRIPT language=JScript for=pbBrowse defer event=onclick>    try
    {
        var itype = 1;
		LocationDialogOwner = 2;      //called up by "Associated asset"
        LocationDialog.Show(itype)
    }
    catch (e)
    {};</SCRIPT>
<SCRIPT language=JScript for=PBAssetbrowser1 defer event=onclick>try
{
	LocationDialogOwner = 1;      //called up by "Assignable asset"
	LocationDialog.show(1);
}
catch (e)
{};</SCRIPT>
<SCRIPT language=JScript for=Page defer event=onuserobjectnotify>	var param;
	var id;
	param = window.event.getAttribute("OnUserObjectNotify_Param",1);
	id = window.event.getAttribute("OnUserObjectNotify_ID",1);
	try
	{
		if (id == 6320)
		{
			switch (LocationDialogOwner)
            {
                case 1:
                    alpha005.value = param;
                    break;
                case 2:
                    alpAssetNumber.value = param;
                    break;
                default:
                    break;
	    	}		
		}
	}
	catch(e)
	{
	};</SCRIPT>
<SCRIPT language=VBScript for=alpAssetNumber defer event=onupdate>	Seclevel = CInt(SecurityLevel.innerText)
	If window.external.SecurityLevel < Seclevel Then
		txtAsset.disabled = true
		alpAssetName.disabled = true
		pbBrowse.disabled = true
		PbClear.disabled = true
	else
		txtAsset.disabled = false
		alpAssetName.disabled = false
		pbBrowse.disabled = false
		PbClear.disabled = false
	End If</SCRIPT>
<SCRIPT language=VBScript for=PbClear defer event=onclick>	alpAssetNumber.value = 0</SCRIPT>
<SCRIPT language=JScript for=Page defer event=onpagecomplete>	try
	{
		LocationDialog = window.external.Dictionary.Item("LocationDialog").Value;
	}
	catch(e)
	{
	};</SCRIPT>
