            OVERFLOW: hidden !important; POSITION: relative; HEIGHT: 100%; WIDTH: 100%; PADDING-BOTTOM: 0px; PADDING-TOP: 0px; PADDING-LEFT: 0px; MARGIN: 0px; PADDING-RIGHT: 0px

            DISPLAY: none; HEIGHT: 100%; WIDTH: 100%; PADDING-BOTTOM: 0px; PADDING-TOP: 0px; PADDING-LEFT: 0px; MARGIN: 0px; PADDING-RIGHT: 0px
        }
    </STYLE>

    <script type=text/javascript>
        function getColorTheme() {
            var colorTheme = -1;
            try {
                colorTheme = window.external.application.ColorTheme;
            } catch (err) {
            }
            return colorTheme;
        }

        var creationCssFile = "activity-creation-ui";
        var dataCssFile = "activity-data-ui";
        var suffix = "";
        switch (getColorTheme()) {
            case 2: // light
                suffix += "-light";
                break;
            case 1: // dark
                suffix += "-dark";
                break;
            case 0: // classic
            default:
                suffix += "-classic";
                break;
        }
        suffix += ".css";
        creationCssFile += suffix;
        dataCssFile += suffix;

        var creationLink = document.createElement("link");
        creationLink.type = "text/css";
        creationLink.rel = "stylesheet";
        creationLink.href = "./ActivityCreationUI_files/Styles/" + creationCssFile;
        document.head.appendChild(creationLink);

        var dataLink = document.createElement("link");
        dataLink.type = "text/css";
        dataLink.rel = "stylesheet";
        dataLink.href = "./ActivityDataUI_files/Styles/" + dataCssFile;
        document.head.appendChild(dataLink);

        // handle zoom change or window rezise
        function resizePage()
        {
            try
            {	
                // Size the activity creation UI to the entire client area, and always set the zoom to 100%
                Page.style.pixelWidth = window.innerWidth;
                Page.style.pixelHeight = window.innerHeight;
                Page.style.zoom = 1;
            }
            catch (e)
            {
                // Don't try anything if we got an exception
                if (window.external && window.external.logMessage) {
                    window.external.logMessage("ActivityCreationUI.htm | resizePage | Exception occurred, " + e.message);
                }
            }		
        }

        function backgroundPropChange()
        {
            if (event.propertyName == "style.zoom" || event.propertyName == "style.width" || event.propertyName == "style.height") 
            {
                resizePage();
            }
        }
    </script>

    <script data-main="./ActivityCreationUI_files/scripts/activity-creation-ui" src="./libs/require.js"></script>
