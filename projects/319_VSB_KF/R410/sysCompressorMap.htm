	<script type="text/javascript">
		var src = "sysCompressorMap.htm";
		$(document).ready(function () {
			var readyTime = new Date();
			InitializeLogger();
			LogMessage(L_CALLUP_HI, src, "Call Up Diagnostics OpApps: L1: Ready()");

			var displays = [];
			try {
				var theCM = hscOpAppsCompressorMap;
				theCM.OnReady("#graphdivfull", windowWidthCompressorMap, windowHeightCompressorMap, hscOpAppsTimeControl);
				displays.push(theCM);

				hscOpAppsChart.OnReady(hscOpAppsTimeControl, readyTime);
				hscOpAppsNavControl.OnReady(hscOpAppsChart, displays);
				hscOpAppsTimeControl.OnReady(hscOpAppsChart, false);
				hscOpAppsNavControl.NavigateToDefault("CompressorMap");

				$("body").dblclick(function (event) {
					// Prevent the user being taken to the point's detail display from this display
					event.preventDefault();
					event.stopImmediatePropagation();
				});
			}
			catch (err) {
				var errorString = err + "<BR>Unable to ready display elements.";
				LogErrorMessage(src, errorString.replace("<BR>", " "));
				$("#graphdivfull").html(errorString);

				try { // Pause the time control to stop it from doing anything on a non-working display 
					hscOpAppsTimeControl.Pause()
				}
				catch (err) { // Ignore any exceptions
				}
			}
		});

		function PluginLoaded(sender, args) {
			hscOpAppsChart.OnSilverlightPluginLoaded("silverlightObject", sender, args)
		};
	</script>
