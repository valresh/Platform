sub CheckIsFDMInstalled()  ' for HART Maintenance tab

	On Error Resume Next
    Dim Wshell
    Dim StrPath
    set Wshell = window.external.CreateWhitelistedObject("Wscript.shell",1)
    if not Wshell is nothing then
        StrPath= Wshell.RegRead("HKEY_LOCAL_MACHINE\SOFTWARE\Honeywell\HFDCM\" & "RootDir")
        If Err.number = 0 then
            bIsFDMInstalled = true            
        else        
            bIsFDMInstalled = false    
        End If

        Set Wshell= Nothing
    end if
 
end sub

<SCRIPT language=VBScript for=Page defer event=onpagecomplete>	dim sEntType
	dim idxTabs
	dim sDispType
	dim bTrend
	bTrend = true

	pbGeneral.style.visibility = "Inherit"

	call CheckIsFDMInstalled()  'for Maintenance tab

	sDispType = sdTabInfo.DataValue("CurrentPoint.DISPTYPE")	
	sEntType = sdTabInfo.DataValue("CurrentPoint.ENT_TYPE")

	select case sDispType 'determine if 3rd or 6th tab

		case "LOGIC" 
			idxTabs = 2
			bTrend = false
		case "ACID"
			idxTabs = 2
			bTrend = false
		case "NULL"
			idxTabs = 2
			bTrend = false
		case "ARRAY"
			idxTabs = 2
			bTrend = false
		case "CUSTOM"
			idxTabs = 2
			bTrend = false
		case "SEQUENCE"
			idxTabs = 2
			bTrend = false
		case "DIGCOMP"
			idxTabs = 2
		case "DIGIN"
			idxTabs = 2
		case "DIGOUT"
			idxTabs = 2
		case "DIGINOUT"
			idxTabs = 2
		case "DEVCTL"
			idxTabs = 2
		case "SWITCH"
			idxTabs = 2

		case else
			idxTabs = 4
	end select

	'PV Info and Ctl Tuning pair
	if idxTabs <> 2 then 'not "basic"
		pbPvInfo.style.visibility = "Inherit"  
		if sdTabInfo.DataValue("CurrentPoint.DISPTYPE") = "RAMPSOAK" then 
			pbCtlTuningRampsoak.style.visibility = "Inherit"
			pbCtlTuning.style.visibility = "Hidden"
		else
			pbCtlTuningRampsoak.style.visibility = "Hidden"
			pbCtlTuning.style.visibility = "Inherit"
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.HENABLE") then
		pbHART.style.Left = arrayTabs(idxTabs)
		idxTabs = idxTabs + 1
		pbHART.style.visibility = "Inherit"
		'pbMaintenance tab
		if bIsFDMInstalled then
			pbMaintenance.style.Left = arrayTabs(idxTabs)
			idxTabs = idxTabs + 1
			pbMaintenance.style.visibility = "Inherit"
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.NOPINPTS") then
		if (sEntType = "REGAM" or sEntType = "REGPVNIM") and sdTabInfo.DataValue("CurrentPoint.NOPINPTS") > 0 then
			pbPVConnect.style.Left = arrayTabs(idxTabs)
			idxTabs = idxTabs + 1
			pbPVConnect.style.visibility = "Inherit"
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.PNTTYPE")and sdTabInfo.DataValue("CurrentPoint.PNTTYPE") = "LOGIC" then
		if sdTabInfo.QualityGood("CurrentPoint.PNTNODTY") and (sdTabInfo.DataValue("CurrentPoint.PNTNODTY") = "LM" or sdTabInfo.DataValue("CurrentPoint.PNTNODTY") = "SM" or sdTabInfo.DataValue("CurrentPoint.PNTNODTY") = "HPM") then
			pbLogicView.style.left = arrayTabs(idxTabs)
			idxTabs = idxTabs + 1
			pbLogicView.style.visibility = "Inherit"
		end if
	end if


	if sdTabInfo.QualityGood("CurrentPoint.NOCINPTS") and sdTabInfo.QualityGood("CurrentPoint.NOCOPTS") then
		if sdTabInfo.DataValue("CurrentPoint.NOCINPTS") > 0 or sdTabInfo.DataValue("CurrentPoint.NOCOPTS") > 0 then  'show if either...
			pbCtlConnect.style.Left = arrayTabs(idxTabs)
			idxTabs = idxTabs + 1
			pbCtlConnect.style.visibility = "Inherit"
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.NOGINPTS") and sdTabInfo.QualityGood("CurrentPoint.NOGOPTS") then
		if (sEntType = "REGAM" or sEntType = "TIMER" or sEntType = "COUNTER") and (sdTabInfo.DataValue("CurrentPoint.NOGINPTS") > 0 or sdTabInfo.DataValue("CurrentPoint.NOGOPTS") > 0) then  'show if either...
			pbGnrlConnect.style.Left = arrayTabs(idxTabs)
			idxTabs = idxTabs + 1
			pbGnrlConnect.style.visibility = "Inherit"
		end if
	end if
	
	if sdTabInfo.QualityGood("CurrentPoint.CCINPT") then
		if sdTabInfo.DataValue("CurrentPoint.CCINPT") = "YES" and (sEntType = "REGAM" or sEntType = "COUNTER" or sEntType = "TIMER") then  
			pbCutout.style.Left = arrayTabs(idxTabs)
			idxTabs = idxTabs + 1
			pbCutout.style.visibility = "Inherit"
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.PNTBOXTY") then
		if sdTabInfo.DataValue("CurrentPoint.PNTBOXTY") = "EC" or sdTabInfo.DataValue("CurrentPoint.PNTBOXTY") = "MC" or sdTabInfo.DataValue("CurrentPoint.PNTBOXTY") = "BC" then
			pbHGTuning.style.Left = arrayTabs(idxTabs)
			if idxTabs > 10 then 
				pbHGTuning.style.top = tab2ndRowTop
				bmpTab11.style.visibility = "Inherit"
			else 
				pbHGTuning.style.top = 38 'tab1stRowTop
			end if
			idxTabs = idxTabs + 1
			pbHGTuning.style.visibility = "Inherit"
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.NODINPTS") then
		if sEntType = "DICMPNIM" and sdTabInfo.DataValue("CurrentPoint.NOPINPTS") > 0 then
			if sDispType = "DIGCOMP" then
				pbDigConnect.style.Left = arrayTabs(idxTabs)
				if idxTabs > 10 then 
					pbDigConnect.style.top = tab2ndRowTop
					bmpTab11.style.visibility = "Inherit"
				else
					pbDigConnect.style.top = tab1stRowTop
				end if
				idxTabs = idxTabs + 1
				pbDigConnect.style.visibility = "Inherit"
			end if
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.NOLINPTS") then
		if sEntType = "LOGICNIM" and sdTabInfo.DataValue("CurrentPoint.NOLINPTS") > 0 then
			if sDispType = "LOGIC" then
				pbInConnect.style.Left = arrayTabs(idxTabs)
				if idxTabs > 10 then 
					pbInConnect.style.top = tab2ndRowTop
					bmpTab11.style.visibility = "Inherit"
				else
					pbInConnect.style.top = tab1stRowTop
				end if
				if idxTab > 11 then bmpTab12.style.visibility = "Inherit"
				idxTabs = idxTabs + 1
				pbInConnect.style.visibility = "Inherit"
			end if
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.NOLOPTS") then
