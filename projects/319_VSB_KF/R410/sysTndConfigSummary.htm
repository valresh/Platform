<SCRIPT language=VBScript defer>Dim g_TimerId
Sub DisableTrackers()
Dim i, trackerButton, buttonName
For i = 0 to table001.ViewSize - 1
	if i + 1 < 10 then
		buttonName = "pbTracker0" & (i + 1)
	else
		buttonName = "pbTracker" & (i + 1)
	end if
	set trackerButton = document.getElementById(buttonName)
    if table001.Fields.Item("Type.Value").GetValue(i) = "Tracker" Then
		trackerButton.style.visibility = "visible"
	else
		trackerButton.style.visibility = "hidden"
	End if
Next
End Sub</SCRIPT>
