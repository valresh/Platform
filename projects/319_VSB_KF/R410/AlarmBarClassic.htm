<html>
<head>
<title>Alarm Bar</title>
</head>
<body topmargin="0" ZoneHeight="19" bottomargin="0" leftmargin="0" scroll="no">
	<div id="Alarm" name="Alarm" style="BORDER: 0px none; padding: 0px; margin: 0px; TEXT-ALIGN: center; 
			FONT-FAMILY: Arial; FONT-SIZE: 11pt; FONT-WEIGHT: 900;
			background-color:buttonface; color: buttontext; width: 100%; HEIGHT: 100%; CURSOR: hand;" 
 			onfocus="Alarm.style.backgroundColor='highlight'; Alarm.style.color='highlighttext'"
			onblur="Alarm.style.backgroundColor='buttonface'; Alarm.style.color='buttontext';document.selection.empty();"> 
	</div>
</body>
</html>
