<SCRIPT id=63075DFF-AE02-4163-B527-F915127C1D65 language=VBScript defer 
shaperefcount="1">dim ntimer 
dim sha, obj
function myfunction(sha)
set obj = sha.parentelement
if obj.objects("visi").value =1 then
	obj.style.visibility="visible"
	obj.style.Top=0 'position the group besides the navigation pane
	obj.style.posLeft=55 'position the group below the title bar
	obj.objects("rect4").style.posLeft=78 'moving the shaects diferently
	obj.objects("rect4").style.Top=0 'moving rect4 to match top and left coordinate of group
	obj.objects("pushbutton1").style.posLeft=78 'moving pushbutton1 to match top and left coordinate of group
	obj.objects("pushbutton1").style.Top=0
	obj.objects("rect4").style.width=1180 'resizing rect4 to cover the required area without resizing the text
	obj.objects("rect4").style.height=850
	obj.objects("pushbutton1").style.width=1180 'resizing rect4 to cover the required area without resizing the text
	obj.objects("pushbutton1").style.height=850
	obj.objects("text1").style.posTop=800 'aligning the text middle to the rect4
	obj.objects("text1").style.posLeft=220 'aligning the text center to the rect4
	For i=1 to page.all.length-1
		If (page.all(i).style.posLeft > obj.objects("rect4").style.posLeft) And (page.all(i).style.posTop > obj.objects("rect4").style.posTop) Then
			page.all(i).style.visibility = "hidden"
		End If 
		' this code is used to hide any objects beyond shapes boundary after resizing. 
	next 
	obj.objects("text1").style.visibility="visible"
end if
window.clearInterval(ntimer)
end function</SCRIPT>
