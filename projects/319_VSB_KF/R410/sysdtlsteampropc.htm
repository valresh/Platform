function GetConstPressureData()
{
oxmlDoc = new ActiveXObject("Microsoft.XMLDOM");
oxmlDoc.async = false;
oxmlDoc.load("ConstantPressure.xml");
var objPressureDataSetPath =oxmlDoc.selectNodes(ConstPressureDataSetPath);
for (i = 0; i<objPressureDataSetPath.length; i++)
{
	var objPressureData = objPressureDataSetPath(i).selectNodes("Data");
	var tempPressureDataSet = new Array();
	for (j = 0; j<objPressureData.length; j++)
	{
		var tempPressureData = new Array();
		tempPressureData.push(objPressureData(j).getAttribute("Entropy"));
		tempPressureData.push(objPressureData(j).getAttribute("Enthalpy"));
		if (j==objPressureData.length-1)
		{
		tempPressureData.push('<span style="color:' + ConstPressurePlotColor + '">' + "P=" + objPressureDataSetPath(i).getAttribute("Pressure") + '</span>');
		}
		else
		{
		tempPressureData.push(null);
		}
		
		tempPressureDataSet.push(tempPressureData);
		
	}

ConstPressureDataSet.push(tempPressureDataSet);	
}
}
