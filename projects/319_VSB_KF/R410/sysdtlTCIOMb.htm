<SCRIPT language=VBScript for=alpUIOChannel defer event=onupdate>For I = 1 to 32
	if not me.QualityBad("CurrentPoint.DICHNLNAME[" & i & "]") then
		if me.DataValue("CurrentPoint.IOPTYPE") = UIO or me.DataValue("CurrentPoint.IOPTYPE") = UIO_2 then
			if me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]")<> Vbnullstring and instr (me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]"), ".") then
				DIPointName = Mid(me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]"),1,(instr (me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]"), ".")-1))
				DIParamName = Mid(me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]"),instr (me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]"), ".")+1 )
				DisplayDataRepository.PutValue "DIChannelPoint" & i , DIPointName
				DisplayDataRepository.PutValue "DIChannelParam" & i , DIParamName & ".DITYPE"
				DisplayDataRepository.autoReloadContent = true
			elseif me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]")<> Vbnullstring and instr (me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]"), "[") then
				DIPointName = Mid(me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]"),1,(instr (me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]"), "[")-1))
				DisplayDataRepository.PutValue "DIChannelPoint" & i , DIPointName
				DisplayDataRepository.PutValue "DIChannelParam" & i , "DITYPE"
				DisplayDataRepository.autoReloadContent = true
			else
				DIPointName = me.DataValue("CurrentPoint.DICHNLNAME[" & i & "]")
				DisplayDataRepository.PutValue "DIChannelPoint" & i , DIPointName
				DisplayDataRepository.PutValue "DIChannelParam" & i , "DITYPE"
				DisplayDataRepository.autoReloadContent = true

			end if
		end if
	end if
Next</SCRIPT>

<SCRIPT language=VBScript defer>' // IOPTYPE constants are from \db\src\iolim\sc_ioptype.enm. 
'
AI_HART       = 51
AI_LLMUX      = 52
AO_HART       = 53
DI_HV         = 54
DI_24         = 55
DO_24B        = 56
DI_SOE        = 57
AI_HL         = 58
AO            = 59
SVP           = 60
SP            = 61
PI            = 62
UIO           = 63
UIO_2         = 66
UIO_16        = 67
AI_LLAI       = 64
SIMIOM        = 65
bChannel15PulseAccum = false
bChannel16PulseAccum = false
bChannel17PulseAccum = false
bChannel18PulseAccum = false
bpageComplete = false

Sub IOPTYPE_Onupdate( )
'On Error Resume Next

'	 // Make the correct set of channel data me.style.visibility to the user.

	Select Case sd.DataValue("CurrentPoint.IOPTYPE") 

	Case  SVP
'		 // SVP module
		for i = 1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"
		next
		shpheader1.value = 1
		shpheader2.value = 1
		shpPIM.value = 1
		shpIODATA.src = "sysSVP08.sha"
		shpIODATA.style.visibility = "Inherit"
		hdrChannelDetails.style.visibility = "Hidden"
	Case  SP
'		 // SP module
		for i = 1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"
		next
		shpheader1.value = 1
		shpheader2.value = 1
		shpPIM.value = 1
		shpIODATA.src = "sysSP26.sha"
		shpIODATA.style.visibility = "Inherit"
		hdrChannelDetails.style.visibility = "Hidden"

	Case  PI
'		 // Pulse input channels
		numChans = sd.DataValue("CurrentPoint.NUMCHANS")
		for i = 1 to numChans
			Document.getElementById("shpChaNum"&i).value = 2
			Document.getElementById("txtChaNum"&i).style.visibility = "Inherit"
		next
		for i = numChans+1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"
		next
		shpheader1.value = 2
		shpheader2.value = 1
		shpIODATA.style.visibility = "Hidden"
		shpPIM.style.visibility = "Inherit"
		shpPIM.value = 2
	Case  UIO, UIO_2
'		 // UIO channels
	call UIO_Channel_Onupdate()
		numChans = sd.DataValue("CurrentPoint.NUMCHANS")
		for i = numChans+1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"
		next
		shpheader1.value = 3
		shpheader2.value = 3
		shpIODATA.style.visibility = "Hidden"
	Case  UIO_16
'		 // UIO channels
	call UIO_Channel_Onupdate()
		numChans = sd.DataValue("CurrentPoint.NUMCHANS")
		for i = numChans+1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"
		next
		shpheader1.value = 3
		shpheader2.value = 1
		shpIODATA.style.visibility = "Hidden"
	case SIMIOM
	 ' No channel details are supported for SIMIOM
	 		for i = 1 to 32
				Document.getElementById("shpChaNum"&i).value = 1
				Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"
			next
				shpheader1.value = 1
				shpheader2.value = 1
				shpIODATA.style.visibility = "Hidden"
				grpSIMIOM.style.visibility = "Inherit"
	Case Else
'		 // An error... No channel data will be updated/displayed
		for i = 1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"
		next
			shpheader1.value = 1
			shpheader2.value = 1
	End Select
End Sub
Function UIO_Channel_Onupdate()
numChans = sd.DataValue("CurrentPoint.NUMCHANS")

	for i = 1 to numChans
		if not sd.QualityBad("CurrentPoint.PNTTYPE("&i&")") then
			chType =  sd.Datavalue("CurrentPoint.PNTTYPE("&i&")")
			select case chType
				case 1 'Channel type is AI
					Document.getElementById("shpChaNum"&i).value = 4
				case 2 'Channel Type is AO
					Document.getElementById("shpChaNum"&i).value = 5
				case 4 'Channel Type is DI
					Document.getElementById("shpChaNum"&i).value = 6
				case 5 'Channel Type is DO
					Document.getElementById("shpChaNum"&i).value = 7
				case else
					Document.getElementById("shpChaNum"&i).value = 3
			End select
		else
			Document.getElementById("shpChaNum"&i).value = 3
		end if
		Document.getElementById("txtChaNum"&i).style.visibility = "Inherit"
	next
End function

Function UIO_Pulse_Accumlation_Onupdate(i)

	Document.getElementById("shpChaNum"&i).value = 8

End function
Sub Navigate_To_Channel_Detail_Display(oSource)
DisplayDataRepository.PutValue "CMName" , "."
DisplayDataRepository.PutValue "CHName" , "."
DisplayDataRepository.autoReloadContent = true
	strChname = oSource.value
	if (instr(strChname, ".") > 0) then
		str = split(strChname , ".")
		DisplayDataRepository.PutValue "CMName" , str(0) 'Navigate to CM Detail Display
		DisplayDataRepository.PutValue "CHName" , str(1) 'Navigate to Channel Detail Display
		DisplayDataRepository.autoReloadContent = true
	elseif (instr(strChname, "[") > 0) and (instr(strChname, "]") > 0)then
		str = split(strChname , "[")
		DisplayDataRepository.PutValue "CHName" , str(0) 'Navigate to Channel Detail Display
		str1 = split(str(1) , "]")
		DisplayDataRepository.PutValue "CMName" , str1(0) 'Navigate to CM Detail Display
		DisplayDataRepository.autoReloadContent = true
	else
		DisplayDataRepository.PutValue "CHName" , strChname
	end if
Call_Channel_Point_Detail_Dislay
End sub
Sub Call_Channel_Point_Detail_Dislay()
if not alpCHDesc.QualityBad("CHName.DESC") then
	window.external.Parent.RequestTask 21, 73, 0, 0, 0, DisplayDataRepository.GetValue("CHName")
elseif not alpCMDesc.QualityBad("CMName.DESC") then
	window.external.Parent.RequestTask 21, 73, 0, 0, 0, DisplayDataRepository.GetValue("CMName")
end if
End sub</SCRIPT>
