<SCRIPT language=vbscript ExcludeFromShapes="1">
Sub InstallCodebase()
    urlbase	 = location.protocol & "//" & location.host
	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
    install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
    redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub
</SCRIPT>

	End If</SCRIPT>
<SCRIPT language=VBScript for=ServerTypeRaw defer event=onupdate> If (IsNumeric(ServerTypeRaw.Value)) Then
	Select Case ServerTypeRaw.Value
	Case 3, 8, 9		'PlantScape
		txtSystemInterfaces.style.visibility = "visible"
		txtPointServers.style.visibility = "hidden"
		txtSystemInterface2.style.visibility = "visible"
		txtPointServer2.style.visibility = "hidden"
	Case Else	'EBI
		txtSystemInterfaces.style.visibility = "hidden"
		txtPointServers.style.visibility = "visible"
		txtSystemInterface2.style.visibility = "hidden"
		txtPointServer2.style.visibility = "visible"
	End Select
  Else
		' Use EBI Setting
		txtSystemInterfaces.style.visibility = "hidden"
		txtPointServers.style.visibility = "visible"
		txtSystemInterface2.style.visibility = "hidden"
		txtPointServer2.style.visibility = "visible"
  End If</SCRIPT>
