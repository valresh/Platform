<SCRIPT language=VBScript defer>Dim objXMLDoc, ReportFldrPath, RptType, XmlFileLocation
Const sReportPath = "/ReportExplorer/ReportPath"
Const sReportType = "/ReportExplorer/ReportType"


' This reads the folder path where the metering reports are created
Sub ReadConfigXML()
	Dim Root, Nd, listReportType
	ReportFldrPath = ""	
	'Set objXMLDoc = CreateObject("Microsoft.XMLDOM")
	Set objXMLDoc = window.external.Application.Document.ParentWindow.external.CreateWhitelistedObject("MSXML2.DOMDocument",1)
	XmlFileLocation = cstr(window.external.Application.FindFile("RE_Config.xml"))
	
	objXMLDoc.async = False
	objXMLDoc.load XmlFileLocation
	
	'Check if document exists
	If objXMLDoc is nothing then
		InfoBox.value = "Configuration document doesn't exist"
		InfoBox.style.color = RGB(0,0,193)'This actually changes to RED!!!!
	Else
		Set Nd = objXMLDoc.selectSingleNode(sReportPath)
		'Check if ReportPath exists
		If Nd is nothing then
			InfoBox.value = "ReportPath node object doesn't exist"
			InfoBox.style.color = RGB(0,0,193)
		Else
			ReportFldrPath = Nd.Text
			txtRptPath.value = ReportFldrPath
			Set Nd = objXMLDoc.selectSingleNode(sReportType)
			'Check if ReportPath exists
			If Nd is Nothing Then
				InfoBox.value = "ReportType node object doesn't exist"
				InfoBox.style.color = RGB(0,0,193)
			Else
				RptType = Nd.Text
				txtRptType.value = RptType
				listReportType = Split(RptType,",")
				InfoBox.value=""
			End If
		End If
	End If
End Sub

' This saves folder path where the metering reports are created
Sub SaveConfigXML()

	Dim Root, Nd, objFSO, res
	ReportFldrPath = ""
			
	'Set objXMLDoc = CreateObject("Microsoft.XMLDOM")
	Set objXMLDoc = window.external.Application.Document.ParentWindow.external.CreateWhitelistedObject("MSXML2.DOMDocument",1)
	XmlFileLocation = cstr(window.external.Application.FindFile("RE_Config.xml"))
	objXMLDoc.async = False
	objXMLDoc.load XmlFileLocation
	
	'Check if document exists
	If objXMLDoc is nothing then
		InfoBox.value = "Configuration document doesn't exist"
		InfoBox.style.color = RGB(0,0,193)'This actually changes to RED!!!!
	Else
		Set Nd = objXMLDoc.selectSingleNode(sReportPath)
		'Check if ReportPath exists
		If Nd is nothing then
			InfoBox.value = "ReportPath node object doesn't exist"
			InfoBox.style.color = RGB(0,0,193)
		Else
			If Trim(txtRptPath.value) = "" Then
				InfoBox.value =  "Report path cannot be empty!"
				InfoBox.style.color = RGB(0,0,193)
				txtRptPath.value = Nd.Text
				IF Trim(txtRptType.value)="" Then
					txtRptType.value = RptType
				End If
				'InfoBox.value = ""
			Else
				IF	InStr(txtRptPath.value,"../") > 0 OR InStr(txtRptPath.value,"\..") > 0 THEN
					InfoBox.value = "Report path should be absolute path"
					InfoBox.style.color = RGB(0,0,193)
				ELSE
					Set objFSO = window.external.Application.Document.ParentWindow.external.CreateWhitelistedObject("Scripting.FileSystemObject",1)
					If NOT objFSO.FolderExists(txtRptPath.value) THEN
							InfoBox.value = "Configured Report's path does not exist"
							InfoBox.style.color = RGB(0,0,193)
					ELSE
						Nd.Text = Trim(txtRptPath.value)
			
						Set Nd = objXMLDoc.selectSingleNode(sReportType)
						'Check if ReportPath exists
						If Nd is Nothing Then
							InfoBox.value = "ReportType node object doesn't exist"
							InfoBox.style.color = RGB(0,0,193)
						Else
							If Trim(txtRptType.value) = "" Then
								InfoBox.value =  "Report type cannot be empty!"
								InfoBox.style.color = RGB(0,0,193)
								txtRptType.value = Nd.Text
							Else
								Nd.Text = Trim(txtRptType.value)
								InfoBox.value = XmlFileLocation
								objXMLDoc.Save XmlFileLocation
								ReadConfigXML()
								InfoBox.value = "Configuration saved successfully"
								InfoBox.style.color =RGB(0,128,0)
							End If
						End If
					End If
				END IF
			End If
		End If
	End If
End Sub</SCRIPT>
