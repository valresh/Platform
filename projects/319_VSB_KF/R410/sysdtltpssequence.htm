Class ListObj
  Public AObject
  Public NextObj
  Public PriorObj
  Public OriginalTop

  Public Sub CleanUp()
   set AObject = Nothing
   set NextObj = Nothing
   set PriorObj = Nothing
  end sub  

  Private Sub Class_Initialize()
   set AObject = Nothing
   set NextObj = Nothing
   set PriorObj = Nothing
   OriginalTop = 0
  End Sub
End Class

Class GrpList
  Public Count
  Public FirstObj

	Public Sub Build(AGroup)
		if IsEmpty(AGroup) or IsNull(AGroup) then
		  exit sub
		end if	
			
		itemCount = AGroup.children.length
		' Add each item to a SORTED list
		Dim AObject
		for index = 0 to itemCount-1
			set AObject = AGroup.children.item(index)
			AddItem AObject
		next
	End Sub

 Public Sub AddItem(AObject)
  if FirstObj Is Nothing then
	  Set FirstObj = New ListObj
	  Set FirstObj.AObject = AObject
	  Exit Sub
	end if
	Dim LoopObj
	Dim LastValidObj
	Set LoopObj = FirstObj
	while not (LoopObj Is Nothing)
	  Set LastValidObj = LoopObj
	  if (LoopObj.AObject) Is Nothing then
 	   Exit Sub
  	  end if
	  if LoopObj.AObject.style.pixelTop < AObject.style.pixelTop then
	    ' keep searching
	  	Set LoopObj = LoopObj.NextObj
	  else
	    ' We come before the current loop object.  Either this is the new
		' first object or inserted in the middle
	  	Dim NewObj
		Set NewObj = new ListObj
		Set NewObj.AObject = AObject
		if (LoopObj.PriorObj is Nothing) then
			' We are the new first obj
			Set LoopObj.PriorObj = NewObj
			Set NewObj.NextObj = LoopObj
			Set FirstObj = NewObj
			NewObj.OriginalTop = NewObj.AObject.style.pixelTop
			Exit Sub
		else
			' We are being inserted in the middle of the list
			Dim TempObj
			Set TempObj = LoopObj.PriorObj
			Set TempObj.NextObj = NewObj
			Set LoopObj.PriorObj = NewObj
			Set NewObj.NextObj = LoopObj
			Set NewObj.PriorObj = TempObj
			NewObj.OriginalTop = NewObj.AObject.style.pixelTop
			Exit Sub
		end if
		Exit Sub
	  end if
	wend
	' We are at the end of the list.  Add our item
	Dim ANewObj
	Set ANewObj = new ListObj
	Set ANewObj.AObject = AObject
	Set LastValidObj.NextObj = ANewObj
	Set ANewObj.PriorObj = LastValidObj
  End Sub

  Public Sub Reset
    Dim LoopObj
	Set LoopObj = FirstObj
	while not (LoopObj Is Nothing)
	  if (LoopObj.AObject) Is Nothing then
	    Exit Sub
 	  end if
	  LoopObj.AObject.style.pixelTop = LoopObj.OriginalTop
	  Set LoopObj = LoopObj.NextObj
   wend
  End Sub

  Public Sub ShowAll
    Dim LoopObj
	Set LoopObj = FirstObj
	while not (LoopObj Is Nothing)
	  if (LoopObj.AObject) Is Nothing then
	    Exit Sub
 	  end if
	  LoopObj.AObject.style.visibility = "inherit"
	  Set LoopObj = LoopObj.NextObj
   wend
  End Sub

  Public Sub Reposition
	Dim LoopObj
	Dim LastValidObj
	Set LoopObj = FirstObj
	if FirstObj is Nothing then
		Msgbox "Group is empty" 
		exit sub
	end if

	' Find the first object - it is the upper most visible object
	Dim VisibleFirst
	Set VisibleFirst = Nothing
	do while not (LoopObj Is Nothing)
	  if (LoopObj.AObject) Is Nothing then
	    Exit Sub
  	  end if
	  if LoopObj.AObject.style.visibility <> "hidden" then
	  	set VisibleFirst = LoopObj
		Exit do
	  end if
	  Set LoopObj = LoopObj.NextObj
   loop

	' if no visible objects we're done
	if VisibleFirst is Nothing then
		exit Sub
	end if

	VisibleFirst.AObject.style.pixelTop = 0
	Set LoopObj = VisibleFirst.NextObj

	if LoopObj is Nothing then
		exit sub
	end if

	Dim LastVisibleObj
	Set LastVisibleObj = VisibleFirst.AObject
	' Reposition the rest based on the first
	while not (LoopObj Is Nothing)
	  if (LoopObj.AObject) Is Nothing then
	    Exit Sub
 	  end if
	  if not (LoopObj.PriorObj Is Nothing) then
	    if (LoopObj.AObject.style.visibility <> "hidden") then
          LoopObj.AObject.style.pixelTop = LastVisibleObj.style.pixelTop + LastVisibleObj.style.pixelHeight + 2
		  set LastVisibleObj = LoopObj.AObject
		end if
	  end if
	  Set LoopObj = LoopObj.NextObj
    wend
  End Sub

  Public Sub Cleanup
 '	clean up our new'd objects!
	Dim LoopObj
	Dim NextObj
	Set LoopObj = FirstObj
	while not (LoopObj) Is Nothing
		set NextObj = LoopObj.NextObj
		LoopObj.CleanUp()
		set LoopObj = Nothing
		set LoopObj = NextObj
	wend
  End Sub

  Private Sub Class_Initialize()
    set FirstObj = Nothing
	Count = 0
  End Sub
End Class

Sub GroupIt(AGroup)
  Dim Grouping 
  Set Grouping = new GrpList
  Grouping.Build AGroup
  Grouping.Reposition
  Grouping.Cleanup
  Set Grouping = Nothing
End Sub

' PPS Confirmation
'*************************************************

sub CancelConfirmPPS

	'generic routine to clean up and bail out of confirmation of raise/lower OP/MODE/MODATTR
	window.external.parentdocument.parentwindow.external.CancelResponse
	nConfirmCount = 0
	window.clearInterval(intConfirmPPSTimerID)
	sConfirmPPSMsg = ""

end sub

sub ConfirmPPS

	dim sResponse
	dim iStatus
	dim ptPromptType 
	dim sMsgZoneText
	ptPromptType = 1

	nConfirmCount = nConfirmCount + 1
	sMsgZoneText = window.external.parentdocument.parentwindow.external.MessageZoneText 
	sConfirmPPSMsg = "Perform immediate point Process on point " & param_NAME.value & " ?"
	iStatus = window.external.parentdocument.parentwindow.external.GetResponse3 (sConfirmPPSMsg, ptPromptType, sResponse)

	if iStatus = 0 and nConfirmCount > 1 then

		window.external.parentdocument.parentwindow.external.logmessage "ConfirmPPS: - action cancelled by user" 
		call CancelConfirmPPS
		exit sub
	elseif iStatus = 1 then
		if sResponse = "" then
			'no response yet... let timer fire again shortly
		else
			'recieved response, process it and we're DONE
			if UCase(sResponse) = "Y" then
				window.external.parentdocument.parentwindow.external.logmessage "ConfirmPPS by operator for point " & param_NAME.value
				param_PPS.value = "TRUE"
'				sd.DataValue("tagname.PPS") = 1
			end if

			call CancelConfirmPPS

		end if
	end if

	if nConfirmCount > 2 and (sMsgZoneText = "" or (sConfirmPPSMsg <> sMsgZoneText)) then		
		window.external.parentdocument.parentwindow.external.logmessage "ConfirmPPS: message text changed operation cancelled for point " & param_NAME.value
		call CancelConfirmPPS
		exit sub

	end if

	'expire after Experion's "operator timeout" - e.g. 60 seconds (x2 as timer is .5 secs)
	if nConfirmCount > oper_timeout.value * 2 then 

		window.external.parentdocument.parentwindow.external.logmessage "ConfirmPPS: nConfirmCount > Experion operator timeout: " & oper_timeout.value & "; operation cancelled" 
		call CancelConfirmPPS
		exit sub

	end if

end sub</SCRIPT>

        //------------------------------------------------------------------------

        // CreateExtensionDiv

        //------------------------------------------------------------------------

        // <summary>

        // Creates a single div in the specified parent element with the specified

        // styles and attributes.

        // </summary>

        // <param name="extId">The ID for the new div.</param>

        // <param name="extClass">The class(es) for the new div.</param>

        // <param name="extXStyle">The style used to give the div its horizontal position ('left' or 'right')</param>

        // <param name="extXPos">The expression for the div's horizontal position.</param>

        // <param name="extYStyle">The style used to give the div its vertical position ('top or 'bottom')</param>

        // <param name="extYPos">The expression for the div's vertical position.</param>

        // <param name="extWidth">The expression for the div's width.</param>

        // <param name="extHeight">The expression for the div's height.</param>

        // <param name="extDisplay">The expression for the div's display style - null or '' if this is not needed.</param>

        // <param name="objExtParent">The element to insert the new div as a child of.</param>

        // <returns>

        // true if the div was created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateExtensionDiv(extId, extClass, extXStyle, extXPos, extYStyle, extYPos, extWidth, extHeight, extDisplay, objExtParent)

        {

          try

          {

            var objExt = window.document.getElementById(extId);

            if (objExt == null)

            {

              objExt = window.document.createElement("div");

              objExt.id = extId;

              objExt.className = extClass;

              objExt.style.position = "absolute";

              objExt.style.overflow = "hidden";

              objExt.style.setExpression(extXStyle, extXPos, "JavaScript");

              objExt.style.setExpression(extYStyle, extYPos, "JavaScript");

              objExt.style.setExpression("width", extWidth, "JavaScript");

              objExt.style.setExpression("height", extHeight, "JavaScript");

              if (typeof(extDisplay) == "string" && extDisplay.length > 0)

              {

                objExt.style.setExpression("display", extDisplay, "JavaScript");

              }

              

              // Insert the new extension div into the proper location in a seperate thread, so that

              // the time it takes doesn't delay the calculation of the size and location of the

              // other extensions. This also breaks out of the onreadystatechange handler thread before

              // mucking around with the DOM, which could potentially change the readyState again.

              window.setTimeout(function(){ objExtParent.appendChild(objExt); }, 5);

            }

            return true;

          }

          catch(e)

          {

            alert("Exception creating background extension '" + extId + "': " + (typeof(e) == "string" ? e : e.description));

          }

          return false;

        }

        

        //------------------------------------------------------------------------

        // CreateBackgroundExtensions

        //------------------------------------------------------------------------

        // <summary>

        // Create empty elements inside the background that match the colored

        // parts of the shape to give the impression that the Page stretches

        // all the way to the edges of the Background.

        // </summary>

        // <returns>

        // true if the extensions were created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateBackgroundExtensions()

        {

          try

          {

              var objPage = window.document.getElementById("Page");

              var objBackground = window.document.getElementById("Background");      

              if (objPage == null || objBackground == null)

              {

                return false;

              }

                                          

              // Extend the TitleBar on the right-hand edge

              CreateExtensionDiv("bgTitleBar", "TitleBar", 

                                  "right", "'0px'", "top", "'0px'", 

                                  "Background.clientWidth - Page.offsetWidth", 

                                  "TitleBarBackground.offsetHeight", 

                                  null, objBackground);

              

              // Extend the TabSet on the right-hand edge.

              CreateExtensionDiv("bgTabSet", "TabSet", 

                                  "right", "'0px'", "top", "TitleBarBackground.offsetHeight", 

                                  "Background.clientWidth - Page.offsetWidth", "TabSetBackground.offsetHeight", 

                                  "TabSetBackground.currentStyle.display", objBackground);

              

              // Extend the NavPane on the bottom edge.



              CreateExtensionDiv("bgNavPane", "NavPane NavPaneFP",

                                   "left", "'0px'", "bottom", "'0px'", 

                                   "NavPane.offsetWidth", "Background.clientHeight - Page.offsetHeight", 

                                   null, objBackground);



              return true;

          }

          catch(e)

          {

             alert("Exception creating background extensions: " + (typeof(e) == "string" ? e : e.description));

          }  

          return false;

        }

        



      </SCRIPT>
