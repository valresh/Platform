<SCRIPT language=JScript defer>var g_TDO;
var g_ALPHATPNTYPE;
var g_ALPHANODENUM;
function OnPageLoad()
{
// alert(window.external.DetailPointID);
	try
	{
		g_TDO = eventtable.Binding.DataObjects.Item(0);
		g_ALPHATPNTYPE = alphaTPNType.Binding.DataObjects.Item(0);
		g_ALPHANODENUM = alphaNodeNum.Binding.DataObjects.Item(0);
	}
	catch( err )
	{
		// If we couldn't access the table data object or the 2 alpha objects,
		// then we must wait until the page connector is ready.
		BindingBehavior.attachEvent("onpageconnectorready", OnPageLoad);
		return;
	}
	BindingBehavior.detachEvent("onpageconnectorready", OnPageLoad);
	var strSource;
	var strQuery;
	if (Number(g_ALPHANODENUM.value) < 10)
	{
		strSource = g_ALPHATPNTYPE.value + " " + "0" + g_ALPHANODENUM;
	}
	else
	{
		strSource = g_ALPHATPNTYPE.value + " " + g_ALPHANODENUM;
	}
	strQuery = "((Source like '" + strSource + "') AND not ('" + strSource + "' like '') AND (CardHolderID = 76))";
	g_TDO.AuxFilter = strQuery;
	g_TDO.SetState("","");
}</SCRIPT>
