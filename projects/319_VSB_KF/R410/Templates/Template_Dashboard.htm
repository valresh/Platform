<SCRIPT language=JScript defer>function checkDashboardGlobalScripts()
{
	try 
	{
		if (isDashboardGlobalScriptLinked == true)
		{
			return;
		}
	}
	catch (err){}

	var element_head=document.getElementsByTagName("HEAD")[0];
	if(element_head != null)
	{
		var scriptLink = document.createElement("script");
		scriptLink.language = "JScript";
	
		try {
			var systemSummaryPath = window.external.parent.FindFile("sysSystemSummary.htm");
			systemSummaryPath = systemSummaryPath.substr(0, systemSummaryPath.lastIndexOf("\\") + 1); 
			var scriptFilePath = systemSummaryPath + "/Scripts/DashboardScripts.js";

			scriptLink.src = scriptFilePath;
			element_head.appendChild(scriptLink);
		}
		catch(err)
		{
			console.log("Error = " + err);
		}
	}
}

checkDashboardGlobalScripts();

var element_head=document.getElementsByTagName("HEAD")[0];
if(element_head != null)
{
    var themeLink = document.createElement("link");
    themeLink.type = "text/css";
    themeLink.rel = "stylesheet";
    
    var systemSummaryPath = window.external.parent.FindFile("sysSystemSummary.htm");
    systemSummaryPath = systemSummaryPath.substr(0, systemSummaryPath.lastIndexOf("\\") + 1); 
    // default to classic theme
    var themeFilePath = systemSummaryPath + "/Styles/EPKS_SystemDashboard_Classic.css";
    try
    {
        var colorTheme = window.external.application.ColorTheme;
        switch ( colorTheme )
        {
            case 2:
                themeFilePath = systemSummaryPath + "/Styles/EPKS_SystemDashboard_Light.css";
                break;
            case 1:
                themeFilePath = systemSummaryPath + "/Styles/EPKS_SystemDashboard_Dark.css";
                break;
            default:
                break;
        }
    }
    catch (e)
    {
    }
    themeLink.href = themeFilePath;
    element_head.appendChild(themeLink);
    
    var commonLink  = document.createElement("link");
    commonLink.type = "text/css";
    commonLink.rel = "stylesheet";
    commonLink.href = systemSummaryPath + "/Styles/EPKS_SystemDashboard_Common.css";
    element_head.appendChild(commonLink);
}</SCRIPT>

<SCRIPT language=JScript for=compositeMenu_auxMenu000_statustext01 defer 
event=ondatachange> 		checkDashboardGlobalScripts();
        //check the sysdsp path
        if(typeof compositeMenu_auxMenu000_sysdspPath01 == "undefined")
        {
                return;
        }
        if (compositeMenu_auxMenu000_sysdspPath01.value.length == 0)
        {
                GetSysdspPath(compositeMenu_auxMenu000_sysdspPath01);
        }

        if (compositeMenu_auxMenu000_sysdspPath01.value.length == 0)
        {
                return;
        }

        var statusValue = compositeMenu_auxMenu000_statustext01.DataValue("AuxPoint.AuxStatus");

        var backgroundImagePath = compositeMenu_auxMenu000_sysdspPath01.value + "images\\";
        var iconImagePath = compositeMenu_auxMenu000_sysdspPath01.value + "images\\";
        var iconImageBlinkPath = compositeMenu_auxMenu000_sysdspPath01.value + "images\\";

		compositeMenu_auxMenu000_background01.className = "shapeBackground";

        if(statusValue == 0)
        {
                compositeMenu_auxMenu000_statustext01.value = "UNKNOWN";
        }
        else if(statusValue == 2)
        {
                compositeMenu_auxMenu000_statustext01.value = "DISABLED";
				compositeMenu_auxMenu000_background01.className = "shapeBackgroundOff";
        }
        else if(statusValue == 3)
        {
                compositeMenu_auxMenu000_statustext01.value = "FAIL";
        }
        else if(statusValue == 4)
        {
                compositeMenu_auxMenu000_statustext01.value = "MARGINAL";
        }
        else if(statusValue == 5)
        {
                compositeMenu_auxMenu000_statustext01.value = "OK";
        }
        else if(statusValue == 7)
        {
                compositeMenu_auxMenu000_statustext01.value = "TRANSIT";
        }
        else
        {
            if(statusValue == 1 || statusValue !== statusValue)
            {
                    compositeMenu_auxMenu000_label01.style.top = "2px";
                    compositeMenu_auxMenu000_label01.style.height = "28px";
                    compositeMenu_auxMenu000_label01.style.lineHeight = "12px";
					compositeMenu_auxMenu000_label01.style.wordWrap = "break-word";
                    compositeMenu_auxMenu000_statustext01.value = "";
                    backgroundImagePath += "blank.png";
                    iconImagePath += "blank.png";
                    compositeMenu_auxMenu000_backgroundStatus01.src = backgroundImagePath;
                    compositeMenu_auxMenu000_status01.src= iconImagePath;
					checkTextBoxOverflow(compositeMenu_auxMenu000_label01,"30px","2px","80px","28px", "center")
                    return;
            }
            else
            {
                    compositeMenu_auxMenu000_statustext01.value = statusValue.toUpperCase();
                    statusValue = ConvertStatusTextToNumber(statusValue);
            }
        }
        
		checkTextBoxOverflow(compositeMenu_auxMenu000_label01,"30px","2px","80px","14px", "center")

        var statusImages = DetermineStatusImages(statusValue);

        iconImagePath += statusImages.nonblinkIcon;
        iconImageBlinkPath += statusImages.blinkIcon;
        backgroundImagePath += statusImages.background;

        compositeMenu_auxMenu000_backgroundStatus01.src = backgroundImagePath;
        compositeMenu_auxMenu000_status01.src= iconImagePath;

        if(statusValue == 5 || statusValue == "OK" || statusValue == "BACKUP")
        {
                compositeMenu_auxMenu000_statustext01.style.color = "#808080";
                compositeMenu_auxMenu000_status01.style.visibility = "hidden";
                compositeMenu_auxMenu000_statustext01.style.left = "36px";
                compositeMenu_auxMenu000_statustext01.style.width = "75px";
        }
		else if(statusValue == 2)
		{
				compositeMenu_auxMenu000_statustext01.style.color = OFF_TEXT_COLOR;
                compositeMenu_auxMenu000_status01.style.visibility = "inherit";
                compositeMenu_auxMenu000_statustext01.style.left = "50px";
                compositeMenu_auxMenu000_statustext01.style.width = "54px";
		}
        else
        {       
                compositeMenu_auxMenu000_statustext01.style.color = DEFAULT_TEXT_COLOR;
                compositeMenu_auxMenu000_status01.style.visibility = "inherit";
                compositeMenu_auxMenu000_statustext01.style.left = "50px";
                compositeMenu_auxMenu000_statustext01.style.width = "54px";
        }

        if(statusValue == 0 || statusValue == 3)
        {
                compositeMenu_auxMenu000_statustext01.style.color = "#FFFFFF";
        }</SCRIPT>
