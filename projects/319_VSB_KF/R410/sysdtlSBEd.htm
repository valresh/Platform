<SCRIPT language=VBScript defer>Sub IsRev1()
if not sd.QualityBad("CurrentPoint.SBE1A.PEN") then
		If sd.DataValue("CurrentPoint.SBE1A.PEN") = 0 Then
			grpRev3.style.visibility = "hidden"
			grpFunctionFail.style.visibility = "visible"
			txtAlarmDealy.style.visibility = "visible"
			txtDesc.style.visibility = "hidden"
			grpFunctionFail.style.posTop = grpRev3.style.posTop
		else
			grpRev3.style.visibility = "visible"
			txtDesc.style.visibility = "visible"
			grpFunctionFail.style.visibility = "hidden"
			txtAlarmDealy.style.visibility = "hidden"
			grpFunctionFail.style.posTop = 286
		end If
end if
end Sub</SCRIPT>
