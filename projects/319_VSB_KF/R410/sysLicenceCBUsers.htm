<SCRIPT language=VBScript defer>Dim MaxNumOfUsers
MaxNumOfUsers = 25
Sub ResetListOfUsers()
On Error Resume Next
for i = 1 to MaxNumOfUsers
	document.getElementById("txtNum"&i).value = ""
	document.getElementById("txtServerName"&i).value = ""
	document.getElementById("txtUserName"&i).value = ""
	document.getElementById("txtLoginTime"&i).value = ""
next
End Sub</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onpagecomplete>On Error Resume Next
Call ResetListOfUsers()
Dim arrUserFields, iUserCount, NumOfActiveUsers
iUserCount = 1
NumOfActiveUsers = 0
CBUserControl.SetServerName window.external.Application.ServerName
For Each UserInfo In CBUserControl.GetCBUsers
if len(UserInfo) > 0 then
	arrUserFields = Split(UserInfo, vbTab)
	document.getElementById("txtNum"&iUserCount).value = iUserCount
	document.getElementById("txtServerName"&iUserCount).value = arrUserFields(0)
	document.getElementById("txtUserName"&iUserCount).value = arrUserFields(1)
	document.getElementById("txtLoginTime"&iUserCount).value = arrUserFields(2)
	iUserCount = iUserCount + 1
	NumOfActiveUsers = NumOfActiveUsers + 1
end if
Next
alpNumOfActiveUsers.value = NumOfActiveUsers</SCRIPT>
