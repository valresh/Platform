<SCRIPT language=VBScript for=pbDelete defer event=onclick>	alpConfiguredBit.value = 0</SCRIPT>
<SCRIPT language=VBScript for=alpConnectedBit defer event=onupdate>	If Not IsNumeric(alpConnectedBit.value) Then
		Exit Sub
	End If
	ConfiguredBit = document.getElementById("alpConfiguredBit").value
	ConnectionBit = document.getElementById("alpConnectedBit").value
	if (ConfiguredBit = 0 and (ConnectionBit = 1 or ConnectionBit = 0)) then
		document.getElementById("shaConnectionStatus").value = 1 'Not Configured
	Elseif (ConfiguredBit = 1 and ConnectionBit = 1) then
		document.getElementById("shaConnectionStatus").value = 2 'OK
	Elseif (ConfiguredBit = 1 and ConnectionBit = 0) then
		document.getElementById("shaConnectionStatus").value = 3 'Failed
	Else 
		document.getElementById("shaConnectionStatus").value = 1 'Not Configured
	End if</SCRIPT>
<SCRIPT language=VBScript for=alpConfiguredBit defer event=onupdate>	If Not IsNumeric(alpConfiguredBit.value) Then
		Exit Sub
	End If
	ConfiguredBit = document.getElementById("alpConfiguredBit").value
	ConnectionBit = document.getElementById("alpConnectedBit").value
	if (ConfiguredBit = 0 and (ConnectionBit = 1 or ConnectionBit = 0)) then
		document.getElementById("shaConnectionStatus").value = 1 'Not Configured
	Elseif (ConfiguredBit = 1 and ConnectionBit = 1) then
		document.getElementById("shaConnectionStatus").value = 2 'OK
	Elseif (ConfiguredBit = 1 and ConnectionBit = 0) then
		document.getElementById("shaConnectionStatus").value = 3 'Failed
	Else 
		document.getElementById("shaConnectionStatus").value = 1 'Not Configured
	End if</SCRIPT>
<SCRIPT language=VBScript for=alpRecord defer event=onchange>	dim MaxRecordNum

<SCRIPT language=VBScript for=alpRecord defer event=onupdate>	dim MaxRecordNum
