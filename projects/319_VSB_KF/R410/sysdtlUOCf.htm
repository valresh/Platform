<SCRIPT language=VBScript for=pbSaveChkpntMaun defer event=onclick>on error resume next

	NumSig=1
End If
If NumSig=1 And len(SecSig.Value) <> 255  Then
	NumSig=2
End If

Dim strPointID
strPointID = CStr(window.external.DetailPointID)
Dim strServer
strServer = CStr(window.external.DetailPointServerNetworkName)
Dim strSecuirtyLevel
strSecuirtyLevel = CStr(window.external.SecurityLevel)
Dim strOperatorID
strOperatorID = CStr(window.external.OperatorID)
Dim strServerName
strServerName = CStr(window.external.ServerName)
Dim strStationNumber
strStationNumber = CStr(window.external.StationNumber)
Dim strESig
strESig = CStr(ESig.value)

	Dim strPath
