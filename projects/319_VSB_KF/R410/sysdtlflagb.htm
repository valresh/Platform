<SCRIPT language=VBScript for=sd defer event=ondatachange>if me.QualityGood("CurrentPoint.FLAGA.ALTENBOPT") then
	if me.DataValue("CurrentPoint.FLAGA.ALTENBOPT") = 1 then
		OffNormalAlarm.disabled = true
		ChangeOfStateAlarm.disabled = true
	else
		if me.DataValue("CurrentPoint.FLAGA.ALMSELOPT") = 0 then
			OffNormalAlarm.disabled = false
			ChangeOfStateAlarm.disabled = true
		else
			OffNormalAlarm.disabled = true
			ChangeOfStateAlarm.disabled = false
		end if
	end if
end if</SCRIPT>
