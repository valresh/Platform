        <script language="JScript" type="text/jscript">
            
            // The DSP content will use the screen resolution at which it is first rendered
            // to set its aspect ratios until the page is reloaded, even if the screen 
            // resolution changes. We therefore need to cache these values for use in
            // working out what size the NavMenu should be rendered at so that it always
            // matches the DSP Content.
            var _initialScreenWidth = window.screen.availWidth;
            var _initialScreenHeight = window.screen.availHeight;
            var _DSPZoomingAllowed;
            var _gotDSPZoomingAllowed = false;
        
            // ISR103382 resizeTimer controls DSP render resize timeout, to throttle DSP resize requests.
            var _resizeTimer;
           var _isHostedInConfigurationStudio;	
            //------------------------------------------------------------------------
            // ZoomFactor
            //------------------------------------------------------------------------
            // This function returns the numeric zoom factor that has been 
            // applied to the given element.
            // This is also defined in the HTMLUtils script library file, but is 
            // redefined here to minimise the number of external script files that
            // need to be parsed and thus the load time of the page.
            //------------------------------------------------------------------------
            function ZoomFactor(objElem)
            {
	            if (objElem == null || 
		            typeof(objElem) != "object")
	            {
	                return 1;
	            }
	            else
	            {
		            var zoom = objElem.currentStyle.zoom;
		            var nZoom = 1;
	                if (typeof(zoom) == "string")
	                {
	                    if (zoom.toLowerCase() == "normal")
	                    {
	                        nZoom = 1;
	                    }
	                    else if (zoom.indexOf("%") >= 0)
	                    {
	                        nZoom = parseFloat(zoom)/100;
	                    }
	                    else
	                    {
   	                        nZoom = parseFloat(zoom);
	                    }
	                }
	                else if (typeof(zoom) == "number")
	                {
	                    nZoom = zoom;
	                }
            	   
                    // Accumulate any zoom factor specified on the parent element.
                    return nZoom * ZoomFactor(objElem.parentElement);
	            }
            }

            //------------------------------------------------------------------------
            // GetStandardDspWidth
            //------------------------------------------------------------------------
            // This function returns the unzoomed width that the DSP content has 
            // available to it at the current screen resolution. 
            // Two standard resolution-widths are supported: 1024 and 1280 pixels.
            //------------------------------------------------------------------------
            function GetStandardDspWidth()
            {
	            var WidthAdjustment = 4;    // Space reserved for left and right border chrome in standard configuration.
	            if (_initialScreenWidth <= 1024)
	            {
	                // Treat the display width as being the width of the lowest supported resolution: 1024px.
		            return (1024 - WidthAdjustment);
	            }
	            else
	            {
	                // Treat the display width as being the width of the highest supported resolution: 1280px.
		            return (1280 - WidthAdjustment);
	            }
            }
            
            //------------------------------------------------------------------------
            // GetStandardDspHeight
            //------------------------------------------------------------------------
            // This function returns the unzoomed height that the DSP content has 
            // available to it at the current screen resolution. 
            // Two standard resolution-heights are supported: 768 and 1024 pixels.
            //------------------------------------------------------------------------
            function GetStandardDspHeight()
            {
	            var HeightAdjustment = 179;     // Space required for top toolbars and bottom border chrome in standard configuration.
	            if (_initialScreenHeight <= 768)
	            {
	                // Treat the display height as being the height of the lowest supported resolution: 768px.
		            return (768 - HeightAdjustment);
	            }
	            else
	            {
	                // Treat the display height as being the height of the highest supported resolution: 1020px.
	                return (1024 - HeightAdjustment);
	            }
            }
            
            //------------------------------------------------------------------------
            // ScrollNavMenu
            //------------------------------------------------------------------------
            // Scrolling will cause the DSP Content to be redrawn over the top of 
            // the menu and in a new position, but unfortunately not an offset that 
            // exactly matches the scroll amount of the webpage.
            // We need to reposition and redraw the menu element so that it remains
            // over the correct part of the DSP content.
            // Redrawing is done by toggling the visibility rather than the display
            // style property, because the OnUserObjectNotify uses the display
            // property to show or hide the menu all together.
            //------------------------------------------------------------------------
            function ScrollNavMenu()
            {
                NavMenu.style.visibility = "hidden"; 
                NavMenu.style.left = -0.85 * document.body.scrollLeft; 
                NavMenu.style.top = -0.85 * document.body.scrollTop; 
                NavMenu.style.visibility = "visible";                           
            }
            
            //------------------------------------------------------------------------
            // ScaleNavMenu
            //------------------------------------------------------------------------
            // This function scales the NavMenu element to have the given effective
            // width and height, zooming all its content in proportion with the
            // change in width.
            //------------------------------------------------------------------------
            function ScaleNavMenu(effectiveTopLeftWidth, effectiveTopLeftHeight)
            {
                // Calculate the actual widths, heights and zoom factor that will make
                // the top-left section have the required effective size. 
                // Calculating the zoom factor from the widths and setting the top-left-height
                // gives a closer match to the DSP font zoom  levels than does calculating the 
                // zoom factor from the heights and setting the width because the widths change 
                // more or less in propertion with the zoom factor, while the heights do not.
                var actualTopLeftWidth = NavMenu.style.pixelWidth;
                var navMenuZoom = parseFloat(effectiveTopLeftWidth / actualTopLeftWidth);   // The ratio that turns the pixel width into the effective width.
                var actualTopLeftHeight = parseFloat(effectiveTopLeftHeight / navMenuZoom); // The pixel height that gives the effectiveHeight at the calculated zoom level.
              
                if (window.external.Environment == 1)
                {
                    // Any zooming applied by the browser (IE7)affects the body Element only, and
                    // does not show up as part of the zoom factor on the page. 
                
                    // The DSPContent will ignore any browser-zoom by design: this effectively
                    // gives zoom to fit in browser Station at all browser-zoom levels. 
                    
                    // Because the parameters to this function specify the desired size of the
                    // top-left part of the NavMenu relative to the DSP content, we need to 
                    // apply a correction for any browser-zoom factor that the DSPContent is ignoring.
                    var browserZoom = parseFloat(document.documentElement.offsetWidth) / parseFloat(document.body.offsetWidth);
                    navMenuZoom = parseFloat(navMenuZoom / browserZoom);
                }
                                            
                // Make the TopLeft section of the display have the correct height.
                // This will only work if the display contents are in the same domain as
                // this host page, so make sure the case where it _doesn't_ work is handled.
                try
                {
                    var topLeftSection = NavFrame.document.getElementById("TopLeft");
                    if (topLeftSection != null)
                    {
                        topLeftSection.style.height = Math.ceil(actualTopLeftHeight);
                    }
                }
                catch(e)
                {
                    // This failure can occur if the display contents are not in the same domain as
                    // this host page, which is quite possible, so we will just swallow this error: it's
                    // not an unexpected one.
                }                                       
                NavMenu.style.height = Math.floor(DSPContent.style.pixelHeight * ZoomFactor(Page) / navMenuZoom); // The full height of the display.
                NavMenu.style.zoom = navMenuZoom;
            }

            //------------------------------------------------------------------------
            // DoZoomToFit
            //------------------------------------------------------------------------
            // This function resizes the DSP control and associated content to
            // be as large as possible while still fitting into the Station window
            // without scrollbars appearing.
            //------------------------------------------------------------------------
            function DoZoomToFit()
            {
	            //ISR79455: We used to render the style to 100% before rendering again via
	            //the if condition below.  This caused performance issues and a "shudder"
	            //effect because dsprender would render twice.  If changing this code
	            //please ensure that all code paths in this if-else block set the 
	            //DSPContent.style property for height and width
	           var bodyWidth = document.body.clientWidth;
	            var bodyHeight = document.body.clientHeight;
	            var fittedNavWidth = NavMenu.style.pixelWidth;
              
	           // ISR103382 - redundant Configuration Studio specific DSPContent resizing has been removed.

	           // ISR79455 - These lines force DSPContent to be the full screen size, even in zoom-to-fit
	           // The zoom level needs to be taken into account because the DSPContent is zoomed,
	           // but the page-body is not. (Zoom is applied to the page-element).
	           var pageZoomLevel = ZoomFactor(Page);
	           DSPContent.style.pixelWidth = Math.floor(parseFloat(bodyWidth / pageZoomLevel));
	           DSPContent.style.pixelHeight = Math.floor(parseFloat(bodyHeight / pageZoomLevel));
                
	            // The DSP "shadow" is the same size as the control when the display zooms-to-fit.
	            //ISR70347 - assign style.width to style.width itself, assigning to pixelwidth doesn't work.
	            DSPContentShadow.style.width = DSPContent.style.width;
	            DSPContentShadow.style.height = DSPContent.style.height;

                // The width of the navigation pane depends on the aspect ratio of the window,
                // since the DSP content doesn't necessarily take up the whole of its container.
                // The constants used here have been worked out by trial-and-error, and will 
                // probably not stay the same if the initial size for the DSPContent should change.
                var horizontalScaleWidth = parseFloat(bodyWidth / 4.55);
                var verticalScaleWidth = parseFloat(bodyHeight / 3);
                fittedNavWidth = Math.ceil(Math.min(horizontalScaleWidth, verticalScaleWidth));
	            
	            // The NavMenu should take up the calculated width, and the aspect ratio of the top-left corner should be constant.
                var topLeftAspectRatio = 5.5;
	            ScaleNavMenu(fittedNavWidth, Math.floor(parseFloat(fittedNavWidth / topLeftAspectRatio)));
            }
 
            // There are 9 possible sizes for the top-left section of the navmenu.
            // In any particular resolution range, the smallest size (89 x 18) will be used 
            // for all zoom levels at and below a 'magic' threshold, then the next consecutive 
            // sizes are used for the next consecutive zoom levels above that.
            var _magicMenuWidths =   new Array(89, 142, 142, 177, 212, 264, 334, 404, 508);
            var _magicMenuHeights =  new Array(18, 20,  23,  28,  36,  46,  59,  75,  93);
            
            //------------------------------------------------------------------------
            // DoMagicNumberZoom
            //------------------------------------------------------------------------
            // This function resizes the DSP control and associated content to
            // as aspect ratio governed by a set of the passed-in arguments that
            // depends on what the current aspect-ratio of the monitor is.
            //
            // Note that two standard resolutions are supported: 1024x768 (low) and
            // 1280x1024 (high). If a non-standard resolution is in use, then
            // this function will try to use whichever of the standard sizes is
            // closest to scale the DSP content by.
            //------------------------------------------------------------------------
            function DoMagicNumberZoom(widthRatioLow, widthRatioHigh, heightRatioLow, heightRatioHigh, zoomLevelIndex)
            {
                // Get the standard sizes for the DSP content.
	            var VirtualDSPWidth = GetStandardDspWidth();
	            var VirtualDSPHeight = GetStandardDspHeight();
                                
                // Multiply the standard sizes by the magin-number ratio that is
                // appropriate for the current screen resolution.
	            if (_initialScreenWidth <= 1024)
	            {
	                // This is a low-resolution display.
		            VirtualDSPWidth *= widthRatioLow;
		            VirtualDSPHeight *= heightRatioLow;
	            }
	            else
	            {
	                // This is a high-resolution display.
		            VirtualDSPWidth *= widthRatioHigh;
	                VirtualDSPHeight *= heightRatioHigh;
	            }
	            	            
	            // The Station window may actually offer more space than the calculated size 
	            // due to a non-standard resolution. 
	            // Size the content so it takes up the maximum of the available space and the required space.
	            var pageZoomLevel = ZoomFactor(Page);
	            var unzoomedClientWidth = document.body.clientWidth / pageZoomLevel;
	            var unzoomedClientHeight = document.body.clientHeight / pageZoomLevel;
	            if (unzoomedClientWidth > VirtualDSPWidth)
	            {
		            DSPContent.style.pixelWidth = unzoomedClientWidth;  // Blank space on on the right margin.  
	            }
	            else
	            {
		            DSPContent.style.pixelWidth = VirtualDSPWidth;      // Horizontal scrollbars will happen.
	            }	

	            if (unzoomedClientHeight > VirtualDSPHeight)
	            {
		            DSPContent.style.pixelHeight = unzoomedClientHeight;    // Blank space on the bottom margin.   
	            }
	            else
	            {
		            DSPContent.style.pixelHeight = VirtualDSPHeight;        // Vertical scrollbars.
	            }
	            
                // The DSP "shadow" is the size the control would be if it was simply page sized (and not inflated to the size of the window)
                DSPContentShadow.style.pixelWidth = VirtualDSPWidth;
                DSPContentShadow.style.pixelHeight = VirtualDSPHeight;            			
                                
                // Offset the zoomLevelIndex so that the smallest-menu-size threshold-index 
                // for the current resolution is at '0'.
	            var magicMenuOffset = 0;
	            if (_initialScreenWidth < 400 || _initialScreenHeight < 240)
	            {
		            magicMenuOffset = -5;
	            }
	            else if (_initialScreenWidth < 640 || _initialScreenHeight < 285)
	            {
		            magicMenuOffset = -4;
	            }
	            else if (_initialScreenHeight < 330)
	            {
	                magicMenuOffset = -3;   // There really is no width-condition for this offset! This is not a bug.
	                noZoomIndex = 1;
	            }
	            else if (_initialScreenWidth < 800 || _initialScreenHeight < 420)
	            {
		            magicMenuOffset = -2;
	            }
	            else if (_initialScreenWidth < 960 || _initialScreenHeight < 555)
	            {
		            magicMenuOffset = -1;
	            }
	            else if (_initialScreenWidth < 1200 || _initialScreenHeight < 735)
	            {
		            magicMenuOffset = 0;
	            }
	            else
	            {
	                magicMenuOffset = 1;
	            }
	            
	            // Scale the nav menu to have a top-left section with the possible size that
	            // is correct for the current zoom level and resolution-threshold.
                var magicMenuIndex = Math.max(zoomLevelIndex + magicMenuOffset, 0);
                magicMenuIndex = Math.min(magicMenuIndex, _magicMenuWidths.length - 1);
                                
                ScaleNavMenu(_magicMenuWidths[magicMenuIndex], _magicMenuHeights[magicMenuIndex]);
	        }
            
            //------------------------------------------------------------------------
            // ResizeDSPRender
            //------------------------------------------------------------------------
            // This functionis called to resize all the DSP and associated content
            // to an aspect ratio that works with the current Station zoom level.
            //------------------------------------------------------------------------
            function ResizeDSPRender()
            {
	            // Calculate whether DSP zooming is permitted at all.
	            var DSPZoomingAllowed = true;
                try
	            {
	                if(_gotDSPZoomingAllowed == false)
	                {
	                _DSPZoomingAllowed = window.external.Parent.DSPZoomingAllowed;
	                _gotDSPZoomingAllowed = true;
	                }
	                if (typeof(_DSPZoomingAllowed) == "boolean")
	                {
                        DSPZoomingAllowed = _DSPZoomingAllowed;
                    }
	            }
	            catch(e)
	            {
	                ScriptError("ResizeDSPRender", e);
		            DSPZoomingAllowed = true;
	            }

	            try
	            {
		            if (window.external.ZoomToFit && DSPZoomingAllowed && DSPContent.ZoomingAllowed)
		            {
                        DoZoomToFit();	
		            }
		            else
		            {
			            // Since the DSP zoom levels are not exactly 30/50/60/80/100/125/150/200, but the DSPRender control *is* resized
			            // to those exact percentages, to make the size of the control scale in the same way as the control's visual
			            // contents, the "base" size of the control must be adjusted.

			            // The scale factors are different for each zoom level, and also for the case where the 100% zoom display is
			            // 1024x768 in size and when it is about 1280x1024.
			            // The unfortunate result is the messy nested "if" statements below.
	                    var ZoomLevel = ZoomFactor(Page);
			            if (ZoomLevel > 1.55)  // 200% zoom 
			            {
			                DoMagicNumberZoom(1.0, 0.95, 1.2, 1.05, 7);
			            }
			            else if (ZoomLevel > 1.30)  // 150% zoom 
			            {
			                DoMagicNumberZoom(1.1, 1.02, 1.3, 1.12, 6);
			            }
			            else if (ZoomLevel > 1.10)  // 125% zoom 
			            {
			                DoMagicNumberZoom(1.0, 1.0, 1.2, 1.03, 5);
			            }
			            else if (ZoomLevel > 0.9)  // 100% zoom 
			            {
			                DoMagicNumberZoom(1.0, 1.0, 1.0, 1.0, 4);			
			            }
			            else if (ZoomLevel > 0.7)  // 80% zoom 
			            {
			                DoMagicNumberZoom(1.1, 0.99, 1.1, 0.95, 3);            				
			            }
			            else if (ZoomLevel > 0.55)  // 60% zoom 
			            {
			                DoMagicNumberZoom(1.1, 1.1, 0.97, 0.97, 2);
			            }
			            else if (ZoomLevel > 0.4)  // 50% zoom 
			            {
			                DoMagicNumberZoom(1.33, 1.05, 1.2, 0.95, 1);
			            }
			            else   // 30% zoom
			            {
			                DoMagicNumberZoom(1.4, 1.75, 1.7, 1.35, 0);
			            }
		            }		            
          		    // And now correct the scrolled position of the menu, since the
	                // resize may have removed (or increased) the need for scrolling.
       	            ScrollNavMenu();
	            }
	            catch (e)
	            {
		            ScriptError("ResizeDSPRender", e);
	            }
            }
            
            //------------------------------------------------------------------------
            // HandleBackgroundPropertyChange
            //------------------------------------------------------------------------
            // This function is used as the event handler for the OnPropertyChange
            // event on the background element. It ensures that the page content
            // is resized appropriately.
            //------------------------------------------------------------------------
            function HandleBackgroundPropertyChange()
            {
                try
                {
                    var changedProperty = window.event.propertyName.toLowerCase();
	                if (changedProperty == "style.zoom")
	                {
		                ResizeDSPRender();
	                }
	            }
                catch(e)
                {
                    ScriptError("HandleBackgroundPropertyChange", e);
                }
            }

            //------------------------------------------------------------------------
            // HandleUserObjectNotify
            //------------------------------------------------------------------------
            // This function is used as the event handler for the OnUserObjectNotify
            // event that fires on the Page object via the StnEvtReflector behavior.
            // It watches for a notification of the menu content to be called up,
            // and arranges for the appropriate left-bar navigation menu to be shown.
            //------------------------------------------------------------------------
            function HandleUserObjectNotify()
            {
                try
                {
                    var param = window.event.getAttribute("OnUserObjectNotify_Param", 1);
                    var id = parseInt(window.event.getAttribute("OnUserObjectNotify_ID", 1), 10);
                    switch(id)
                    {
                        case 8002:
                        {
                            // Menu-content notification. 
                            if (param.toLowerCase().indexOf(".xml") > 0)
                            {
                                // Assume we have been given the name of a menu definition file
                                // which the standard NavMenu display is able to parse.
                                NavFrame.document.getElementById("NavPane").MenuXML = param;
                            }
                            else
                            {
                                // Assume that we have been given the URL of a whole
                                // new menu display. 
                                NavFrame.navigate(param);
                            }
                            NavMenu.style.display = "block";
                            break;
                        }
                        case 8003:
                        {
                            // LicenceValues notification.
                            NavFrame.document.getElementById("OperatorsMenu").LicenceValues = param;
                            NavFrame.document.getElementById("NavPane").LicenceValues = param;
                            break;
                        }
                        case 8004:
                        {
                            // CurrentDisplay notification.
                            NavFrame.document.getElementById("OperatorsMenu").CurrentDisplay = param;
                            NavFrame.document.getElementById("NavPane").CurrentDisplay = param;
                        }
                        default:
                        {
                            // We don't care about other notifications: do nothing.
                            break;
                        }
                    }
                }
                catch(e)
                {
                    ScriptError("HandleUserObjectNotify", e);
                }
            }            
        </script>
        <script event="onresize" for="window" language="jscript" type="text/jscript">
	       
	if ( _isHostedInConfigurationStudio) 
	{
		// ISR103382 Clear and reschedule a new DSP resize at 10ms from now if the page is opened in Configuration Studio.
        		clearTimeout(_resizeTimer);
       		 _resizeTimer = setTimeout(ResizeDSPRender, 10);
	}
	else
	{
		ResizeDSPRender();
	}
        </script>
	<script event="onpagecomplete" for=Page language="jscript" type="text/jscript">
		DSPContent.focus();
	</script>
        <script event="onload" for="window" language="jscript" type="text/jscript">
	        _isHostedInConfigurationStudio = (window.external.Environment == 2);
	
	        if (ZoomFactor(Page) == 1)
	        {
				// ISR103382 Schedule a DSP resize at 10ms from now
	        		_resizeTimer = setTimeout(ResizeDSPRender, 10);
		
	        }
	        else
	        {
	            // ResizeDSPRender will be called from the
	            // HandleBackgroundPropertyChange function when the
	            // page-zoom factor is applied to the background.
	            // Do not duplicate the call here.
	        }
        </script>
        <script event = "onscroll" for="window"  language="jscript" type="text/jscript">
            ScrollNavMenu(); 
        </script>

    <body style="font-size: 12pt; margin: 0px; overflow: auto; zoom: 1; background-color: transparent">
        <div id="NavMenu" 
            style="display: none;
                height: 100%;   
                left: 0px; 
                position: absolute; 
                top: 0px; 
                width: 212px; 
                z-index: 3;
                zoom: 1;">
           <iframe id="NavFrame" 
                frameborder="0"
                scrolling="no" 
                src="Menus\NavMenu.htm?ShowTopLeft=true&MenuXML="
                style="height: 100%;
                    position: relative; 
                    width: 100%;"
                tabindex="0">
            </iframe>
        </div>
        <div id="Background" onpropertychange="jscript: HandleBackgroundPropertyChange();"
            style="z-index: 0; margin: 0px; width: 1020px; background-repeat: no-repeat;
            zoom: 1; position: absolute; height: 589px; background-color: white;">
            &nbsp;</div>
        <!--
        DO NOT put quotation marks around the id of the Page element, or the page-load event will be called with 
        a page zoom level of '1' before the onbackgroundproprtychange event fires with the proper zoom level.
        This makes the DSP content jump around after the page loads.
        --> 
        <DIV id=Page 
            style="FONT-SIZE: 10pt; MARGIN: 0px; BEHAVIOR: url(#HDXPageBehavior) url(#StnEvtReflector) url(#DisplayDataRepository); WIDTH: 1020px; ZOOM: 1; FONT-FAMILY: Helvetica; POSITION: absolute; HEIGHT: 589px; BACKGROUND-COLOR: transparent;" 
             onuserobjectnotify="jscript: HandleUserObjectNotify();">
            <!-- DO NOT CHANGE THIS ELEMENT's ID WITHOUT ALSO CHANGING IT IN HSCDSPRender.exe -->
            <script language="JScript">
                WriteGenevieveControl();
            </script>
