<SCRIPT language="JScript">
    function GetPageParam(Param)
    {
        var sValue = "";

        if ((document.location.search != null) && (document.location.search.length > 0))
        {
            var decodedURI = decodeURIComponent(document.location.search.substr(1));
            var arrPairs = decodedURI.split("&");
            var len = arrPairs.length;

            for (var i = 0; i < len; i++)
            {
                // split at the equals
                var arrPair = arrPairs[i].split("=");

                if (arrPair.length == 2)
                {
                    if (arrPair[0].toUpperCase() == Param.toUpperCase())
                    {
                        sValue = arrPair[1];
                    }
                }
            }
        }
        return sValue;
    }

function ShowProcedureExplorerPopup(procedureName) {
    var objPopupWindow;
    var objHdxPopup;
    objHdxPopup = document.getElementById("HDXPopupBehavior");
    if (objHdxPopup != null) {
        objPopupWindow = objHdxPopup.FindPopup(procedureName);
        if (objPopupWindow == null) {
            objHdxPopup.CreatePopupWindow3("sysProcedureExplorer.htm?ProcedureName=" + procedureName, 1, 1, 650, 700, 0, false, true);
        }
        else {
            objPopupWindow.close();
            objHdxPopup.CreatePopupWindow3("sysProcedureExplorer.htm?ProcedureName=" + procedureName, 1, 1, 650, 700, 0, false, true);
        }
    }
}

function CloseProcedureExplorerPopup(procedureName) {
	try {
        window.external.close();
	}
	catch (e) {
		// Just log a simple message if we get an exception. Nothing the user could do about this so no need to do anything more here...
        window.external.application.logmessage("sysProcedureExplorer.htm | CloseProcedureExplorerPopup() Exception caught and ignored.");
	}
}

function InvokeMessages(parameters) {
    var indexOfFirstComma = -1;
    var indexOfSecondComma = -1;

    // Expecting parameters to be a comma separated string like "source,sourceTagName,BlockName"...
    indexOfFirstComma = parameters.indexOf(",");
    if (indexOfFirstComma != -1) {
        indexOfSecondComma = parameters.indexOf(",", indexOfFirstComma + 1);
    }

    // So far, so good...
    if (indexOfFirstComma != -1 && indexOfSecondComma != -1) {
        // Extract the source, the sourceTagName and blockName...
        var source = parameters.substring(0, indexOfFirstComma);
        var sourceTagName = parameters.substring(indexOfFirstComma + 1, indexOfSecondComma);
        var blockName = parameters.substring(indexOfSecondComma + 1, parameters.length);

        // Set the filters...
        var filterCols = ['Source', 'SourceTagName', 'Block'];
        var filterVals = [source, sourceTagName, blockName + ".*"]; // Add a period between block name and wildcard to force exact search on step name!
        window.external.application.logmessage("sysProcedureExplorer.htm - filterCols = <" + filterCols + ">, filterVals = <" + filterVals + ">");

        //if (window.external.application.InvokeMessages != null) {
            // Invoke the Message Summary or Notification Center...
            // Note: No need to encode the parameters but need to pass the INVOKE_MESSAGE_TARGET parameter, set to 0 when calling from popup ...
            window.external.application.InvokeMessages(true, filterCols, filterVals, true, 0);
        //}
        //else {
        //    // Log informational message
        //    window.external.application.logmessage("sysProcedureExplorer.htm - window.external.application.InvokeMessages not defined. Need to upgrade Station.");
        //    // Fall back on old way to invoke the MessageSummary if old Station...
        //    var url = "sysMessageSummary.htm?source=" + encodeURIComponent(source) + "&sourcetagname=" + encodeURIComponent(sourceTagName) + "&block=" + encodeURIComponent(blockName) + "*" + "&selectfirstrow=true";
        //    window.external.application.currentpage = url;
        //}
    }
    else {
        window.external.application.logmessage("sysProcedureExplorer.htm - Invalid parameter passed to InvokeMessages() function. Parameters = <" + parameters + ">");
    }
}

function OpenPropertiesPopup(parameters) {
    var indexOfComma = -1;

    // Expecting parameters to be a comma separated string like "propertiesType,procedureName" or "propertiesType,procedureName.blockName" depending on the type passed...
    indexOfComma = parameters.indexOf(",");
    if (indexOfComma != -1) {
        // So far, so good...
        var propertiesType = parameters.substring(0, indexOfComma);
        var itemName = parameters.substring(indexOfComma + 1, parameters.length);

        window.external.application.logmessage("sysProcedureExplorer.htm - parameters = <" + parameters + ">, propertiesType = <" + propertiesType + ", itemName = <" + itemName + ">");

        var objPopupWindow;
        var objHdxPopup;
        objHdxPopup = document.getElementById("HDXPopupBehavior");
        if (objHdxPopup != null) {
            var popupWidth = 650;
            var popupHeight = 700;
            var popuUrl = "";
            var popupToSearchFor = "";

            switch (propertiesType) {
                case "ProceduralElementProperties":
                    popupToSearchFor = "Procedural Element Properties Popup";
                    popuUrl = "sysProceduralElementPropertiesPopup.htm?ProcedureName=" + encodeURIComponent(itemName);
                    popupWidth = 850;
                    popupHeight = 685;
                    break;
                case "RecipeStepProperties":
                    popupToSearchFor = "Recipe Step Properties Popup";
                    popuUrl = "sysRecipeStepPropertiesPopup.htm?RecipeStepName=" + encodeURIComponent(itemName);
                    popupWidth = 734;
                    popupHeight = 740;
                    break;
                case "StepProperties":
                    popupToSearchFor = "Step Properties Popup";
                    popuUrl = "sysStepPropertiesPopup.htm?StepName=" + encodeURIComponent(itemName);
                    popupWidth = 735;
                    popupHeight = 760;
                    break;
                case "TransitionProperties":
                    popupToSearchFor = "Transition Properties Popup";
                    popuUrl = "sysTransitionPropertiesPopup.htm?TransitionName=" + encodeURIComponent(itemName);
                    popupWidth = 735;
                    popupHeight = 565;
                    break;
            }

            objPopupWindow = objHdxPopup.FindPopup(popupToSearchFor);
            if (objPopupWindow == null) {
                objHdxPopup.CreatePopupWindow3(popuUrl, 1, 1, popupWidth, popupHeight, 0, false, true);
            }
            else {
                objPopupWindow.close();
                objHdxPopup.CreatePopupWindow3(popuUrl, 1, 1, popupWidth, popupHeight, 0, false, true);
            }
        }
        else {
            alert("DBG: objHdxPopup == null");
        }
    }
}

    </SCRIPT>

<SCRIPT language="JScript">

    function BackgroundPropChange() {
        if ((event.propertyName == "style.zoom" || event.propertyName == "style.width" || event.propertyName == "style.height")) {
            ResizeProcedureExplorer();
        }
    }

    function ResizeProcedureExplorer() {
        try {
            //window.external.application.logmessage("ResizeProcedureExplorer() - document.body.clientWidth = " + document.body.clientWidth + ", document.body.clientHeight = " + document.body.clientHeight);
            // Size the Procedure Explorer control to the entire client area, it may then be zoomed from this base size
            // For some yet-to-be-explained reason, the ProcedureExplorer has 16 pixels to its right and botton when the display is brought up as a Popup.
            // The following is a temporary workaround to be replaced with a real solution when/if one is identified.
            var fudgeIncrement = 0; //16;
            Page.style.pixelWidth = document.body.clientWidth + fudgeIncrement;
            Page.style.pixelHeight = document.body.clientHeight + fudgeIncrement;
        }
        catch (e) {
            // Don't try anything if we got an exception
            window.external.application.logmessage("sysProcedureExplorer.htm | ResizeProcedureExplorer | Exception occurred, " + e.message);
        }
    }

    </SCRIPT>
     
<SCRIPT language="VBScript" for="Page" event="onpagecomplete" defer="">
        Dim procedureName
        Dim unitName

        ' Bind ProcedureExplorerControl to "Specific Procedure"...
        PX.BindTo = "Specific Procedure"

        ' Get Procedure Name if it was passed...
        procedureName = GetPageParam("ProcedureName")

        ' If Procedure Name passed, initialize ProcedureExplorerControl with it.
        ' If not, check for Unit Name...
        If procedureName <> "" Then
            PX.InitializeWithProcedureName(procedureName)
        Else
            unitName = GetPageParam("UnitName")
            ' If Unit Name passed, initialize ProcedureExplorerControl with it.
            If unitName <> "" Then
                PX.InitializeWithUnitName(unitName)
            Else
                PX.InitializeWithNoProcedureOrUnitName(unitName)
            End if
        End if</SCRIPT>
     
<SCRIPT language="JScript">

    function ShowDataUI_GeneralTab(entityName) {
        ShowDataUI(entityName, 1)
    }

    function ShowDataUI_FormulaTab(entityName) {
        ShowDataUI(entityName, 4)
    }

    function ShowDataUI_ReportTab(entityName) {
        ShowDataUI(entityName, 5)
    }

    function ShowDataUI(entityName, tab) {
	    var iframe = document.getElementById("dataUIIFrameId");
	    var innerDoc = iframe.contentDocument || iframe.contentWindow.document;
	    var activityData = innerDoc.getElementById("activityData");

        window.external.application.logmessage("sysProcedureExplorer.htm - Calling activityData.show() with entityName = " + entityName + " and tab = " + tab);
    	activityData.show(entityName, tab);
        dataUIContainer.style.visibility = "visible";
    }

    function HideDataUI(entityName) {
        // NOTE: entityName is not used at this time...
	    var iframe = document.getElementById("dataUIIFrameId");
	    var innerDoc = iframe.contentDocument || iframe.contentWindow.document;
	    var activityData = innerDoc.getElementById("activityData");

	    activityData.hide();
        dataUIContainer.style.visibility = "hidden";
    }

	function MoveDataUI(ltwh) {
        var arrPairs = ltwh.split(",");
        var len = arrPairs.length;
        for (var i = 0; i < len; i++)
        {
            // split at the equals
            var arrPair = arrPairs[i].split("=");
            if (arrPair.length == 2)
            {
                if (arrPair[0] == "l")
                {
	    	        dataUIContainer.style.left = arrPair[1] + "px";
                }
		        else if (arrPair[0] == "t")
                {
	    	        dataUIContainer.style.top = arrPair[1] + "px";
                }
		        else if (arrPair[0] == "w")
                {
	    	        dataUIContainer.style.width = arrPair[1] + "px";
                }
		        else if (arrPair[0] == "h")
                {
	    	        dataUIContainer.style.height = arrPair[1] + "px";
                }
            }
        }
	}
    </SCRIPT>
