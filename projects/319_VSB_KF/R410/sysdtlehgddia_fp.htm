<SCRIPT language=VBScript for=sd defer event=ondatachange>if sd.DataChanged("currentpoint.{%FFBNAME%}.PVSOURCE") then
	if not sd.QualityBad("currentpoint.{%FFBNAME%}.PVSOURCE") then
		if sd.DataValue("currentpoint.{%FFBNAME%}.PVSOURCE") = 1 then
			ConCboPVMAN.style.visibility = "Visible" : ConCboPV.style.visibility = "Hidden"
		else
			ConCboPVMAN.style.visibility = "Hidden" : ConCboPV.style.visibility = "VIsible"
		end if
	end if
end if</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onpagecomplete>On Error Resume Next

	End If
document.title = cstr(ConAlpTagname.Value)</SCRIPT>

<SCRIPT id=0D03BDD1-EAF6-4D7D-9870-2976FE87250F language=vbscript defer 
shaperefcount="1">Sub InstallCodebase()
	urlbase	 = location.protocol & "//" & location.host
	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
	install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
	redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub
</SCRIPT>
