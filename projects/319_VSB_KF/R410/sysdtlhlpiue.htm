<SCRIPT language=VBScript defer>dim sCMName
dim iBoxNum
dim iBoxNum1

public sub PointDetail(CMName)
sCMName=CMName.value
	If sCMName = Empty or sCMName = "NaN" then
		window.external.TemporaryMessageZoneText Message.value
	Else 
		window.external.RequestTask 21, 73, 0, 0, 0, sCMName
	end if
end sub

public sub selection(BoxNum)
iBoxNum = BoxNum
if Document.getElementById("CMNAME" & iBoxNum) <> VBNullstring then
		Document.getElementById("CMNAME" & iBoxNum).textColor=50282496
		Document.getElementById("SubSlot" & iBoxNum).textColor=50282496
		Document.getElementById("line" & iBoxNum).style.visibility="vISIBLE"
		Document.getElementById("line" & iBoxNum).lineColor=50282496
end if
end sub

public sub Deselection(BoxNum1)
iBoxNum1=BoxNum1
		Document.getElementById("CMNAME" & iBoxNum1).textColor=VBBLACK
		Document.getElementById("SubSlot" & iBoxNum1).textColor=VBBLACK
		Document.getElementById("line" & iBoxNum1).style.visibility="hidden"
end sub

Sub Dataupdate()

for i = 1 to 16
Document.getElementById("CMNAME" & i).style.visibility = "HIDDEN"
	if Document.getElementById("CM" & i).Value = empty or Document.getElementById("CM" & i).Value = "NaN"  then
		Document.getElementById("CMNAME" & i).value = ""
		Document.getElementById("CMNAME" & i).style.visibility = "HIDDEN"
	Else
		IOName = Document.getElementById("CM" & i).Value
		dotPos = InStr(1,IOName,".",1)
		CMName = Mid(IOName, 1,dotPos-1)
		Document.getElementById("CMNAME" & i).Value = CMName
		Document.getElementById("CMNAME" & i).style.visibility = "VISIBLE"
	end if
next
end Sub</SCRIPT>
