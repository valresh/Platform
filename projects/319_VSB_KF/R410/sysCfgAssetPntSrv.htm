<SCRIPT language=vbscript ExcludeFromShapes="1">
Sub InstallCodebase()
    urlbase	 = location.protocol & "//" & location.host
	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
    install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
    redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub
</SCRIPT>

<SCRIPT language=VBScript for=ServerTypeRaw defer event=onupdate>Select Case ServerTypeRaw.Value
		Case 5,6,7	'EBI
			txtLocationMapping.style.visibility = "visible"
			txtAssetMapping.style.visibility = "hidden"
			txtDefaultArea.style.visibility = "hidden"
			txtDefaultLocation.style.visibility = "visible"
			txtDftLocConnection.style.visibility = "visible"
			txtDftAstConnection.style.visibility = "hidden"
		Case Else	'EPKS
			txtAssetMapping.style.visibility = "visible"
			txtLocationMapping.style.visibility = "hidden"
			txtDefaultArea.style.visibility = "visible"
			txtDefaultLocation.style.visibility = "hidden"
			txtDftLocConnection.style.visibility = "hidden"
			txtDftAstConnection.style.visibility = "visible"
End Select</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onpagecomplete>set LocationDialog = window.external.Dictionary.Item("LocationDialog").value</SCRIPT>
<SCRIPT language=VBScript defer>Dim LocationDialog</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onuserobjectnotify>	param = window.event.getAttribute("OnUserObjectNotify_Param", 1)
	id = window.event.getAttribute("OnUserObjectNotify_ID", 1)
	If id = 6320 Then
		txtAreaNumber.Value = CInt(Param)
	End If</SCRIPT>
<SCRIPT language=VBScript for=txtRecord defer event=onchange>If txtRecord.value <= 500 then
		Record.value = txtRecord.value + 500
	End If</SCRIPT>
<SCRIPT language=VBScript for=Record defer event=onupdate>	If (window.external.CurrentRecordOffset < 2) Then
		window.external.CurrentPage = "sysServersLclSts"
	End If
	If Record.value > 500 then
		txtRecord.value = Record.value - 500
	End If</SCRIPT>
<SCRIPT language=VBScript for=pbLocationBrowser defer event=onclick>	Dim itype
	On Error Resume Next
		Select Case ServerTypeRaw.Value
		Case 5,6,7
			itype = 1 'show only the asset/location models, use 3 for organization model as well
		Case Else
			itype = 1 'show only the asset/location model
	End Select
	LocationDialog.Visible = True
	LocationDialog.Show(itype)</SCRIPT>
