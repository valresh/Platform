Dim bPageInitialized
Dim sBoxPointName

bPageInitialized = FALSE
sBoxPointName = "TBD" 'format is $NMnnNnn, e.g., $NM<NTWKNUM>N<NODENUM>" and parameter is array NN(1..4095) for box numerics


Sub UpdatePage()
' This routine drives the box-point name to the shapes that pick up 
' the HPM node parameters with format $NM<netwk>B<box> e.g. $NM01B09
' On the faceplate, these are COMCFAVG "Comm CPU" and CTLCFAVG "Controller CPU"
	shpcomcfavg.autoReloadContent = FALSE
	shpctlcfavg.autoReloadContent = FALSE

	if bPageInitialized = FALSE then
		window.external.parent.logmessage "driving sBoxPointName to shape: >>" & sBoxPointName & "<<"

		shpcomcfavg.SetCustomProperty "point", "boxpoint", sBoxPointName
		shpcomcfavg.ReloadContent
		shpcomcfavg.autoReloadContent = TRUE
		shpcomcfavg.style.visibility = "Inherit"

		shpctlcfavg.SetCustomProperty "point", "boxpoint", sBoxPointName
		shpctlcfavg.ReloadContent
		shpctlcfavg.autoReloadContent = TRUE
		shpctlcfavg.style.visibility = "Inherit"
		bPageInitialized = TRUE
	end if 

end sub

Sub UpdateIcons()

	if sd.QualityBad("CurrentPoint.LANAFAILED") then
		shpLANAFAILED.value = 2		  ' off
		txtA.textColor = txtCPU_free.textColor  'never highlighted when bad
	else
		if sd.DataValue("CurrentPoint.LANAFAILED") = 0 then '0 == 'not failed', i.e. OK
			shpLANAFAILED.value = 3   ' OK
			txtA.textColor = vbWhite
			txtA.title = "FTE A OK"
			shpLANAFAILED.title = "FTE A OK"
		else
			shpLANAFAILED.value = 4         ' shape sequence # for 'failed'
			txtA.textColor = txtCPU_free.textColor
			txtA.title= "FTE A fail"
			shpLANAFAILED.title = "FTE A fail"
		end if
	end if
	shpLANAFAILED.style.visibility = "Inherit"

	if sd.QualityBad("CurrentPoint.LANBFAILED") then
		shpLANBFAILED.value = 2            ' Off
		txtB.textColor = txtCPU_free.textColor 'never highlighted when bad
	else
		if sd.DataValue("CurrentPoint.LANBFAILED") = 0 then 
			shpLANBFAILED.value = 3        ' OK
			txtB.textColor = vbWhite
			txtB.title = "FTE B OK"
			shpLANBFAILED.title = "FTE B OK"
		else
			shpLANBFAILED.value = 4       ' Fail         
			txtB.textColor = txtCPU_free.textColor
			txtB.title= "FTE B fail"
			shpLANBFAILED.title = "FTE B fail"
		end if
	end if
	shpLANBFAILED.style.visibility = "Inherit"


End Sub

' below is from C300 Faceplate, in common wiht EHPM node faceplate


correctWidth = 0
SKIP = -1

Sub ApplyLayout()           
                Call AdjustHeight()
                Call AdjustWidth()
End Sub

Sub AdjustHeight()
                
                GrpLowerPanel.style.top = "" 
                GrpLowerPanel.style.bottom = "2px"
                GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 
                GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
              	 
End Sub

Sub AdjustWidth()
                Call CalculateCorrectWidth()       
                if (correctWidth <> SKIP) then                   
                    GrpUpperPanel.style.pixelwidth = correctWidth 
                    GrpCenterPanel.style.pixelwidth = correctWidth
                    GrpLowerPanel.style.pixelwidth = correctWidth 
												
                end if
End Sub

Sub CalculateCorrectWidth()
                POPUP = 0
                displayType = window.external.Application.CurrentDisplayPageType 
				CurrentPage = window.external.CurrentPage
					if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
                	
                                correctWidth = SKIP
                                Exit Sub
               		else   

               		if (page.style.zoom > 1) then   
                 		shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))                               
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                                                                                                 
                    else                                        
                         shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                         correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                

                    end if

                end if    

End Sub</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>dim sFirstNum, sSecondNum

if sd.QualityGood("currentpoint.SIMTARGET") and sd.DataValue("currentPoint.SIMTARGET") = 1 then

	txtSimulation.style.visibility = "Inherit"
	GrpCPUAverages.style.visibility = "Hidden"

else

	if me.QualityGood("CurrentPoint.UCNNW") and me.QualityGood("CurrentPoint.HPMNODENO") then
		if me.DataValue("CurrentPoint.UCNNW") < 10 then
			sFirstNum = "0" & me.DataValue("CurrentPoint.UCNNW")
		else
			sFirstNum = me.DataValue("CurrentPoint.UCNNW")
		end if
		if me.DataValue("CurrentPoint.HPMNODENO") < 10 then
			sSecondNum = "0" & me.DataValue("CurrentPoint.HPMNODENO")
		else
			sSecondNum = me.DataValue("CurrentPoint.HPMNODENO")
		end if

		sBoxPointName = "$NM" & sFirstNum & "B" & sSecondNum
		window.external.parent.logmessage "sBoxPointName is: >>" & sBoxPointName & "<<"
		if bPageInitialized = FALSE then
			window.external.parent.logmessage "OnDataChange - calling initial UpdatePage"
		  	call UpdatePage()
		end if
	end if

	GrpCPUAverages.style.visibility = "Inherit"

end if

if sd.DataChanged("currentpoint.RDNROLESTATE") then
  if not sd.QualityBad("currentpoint.RDNROLESTATE") then
    if sd.DataValue("currentpoint.RDNROLESTATE") = 0 then
		 'RDNROLESTATE  is UNDEFINED
        alpRDN_State.style.visibility = "hidden"
		txtSYNC_State.style.visibility = "hidden"
		alpSYNC_State.style.visibility = "hidden"
		txtRDN_Role.style.visibility = "hidden"
    elseif sd.DataValue("currentpoint.RDNROLESTATE") = 1 then 
		'RDNROLESTATE is NONREDUND
	   	txtSYNC_State.style.visibility = "hidden"
		alpSYNC_State.style.visibility = "hidden"
	else
		'a Redundant state, show both.  Note that during failover, may be temporarily undefined
        alpRDN_State.style.visibility = "visible"
		txtSYNC_State.style.visibility = "visible"
		alpSYNC_State.style.visibility = "visible"
		txtRDN_Role.style.visibility = "visible"
    End if
 End if
End if

if sd.QualityGood("currentpoint.LANAFAILED") then
	if sd.DataValue("currentpoint.LANAFAILED") = 1 then
		shpLANAFAILED.value = 2 'good
	else
		shpLANAFAILED.value = 3 'bad
	end if
else
	shpLANAFAILED.value = 6
end if

if sd.QualityGood("currentpoint.LANBFAILED") then
	if sd.DataValue("currentpoint.LANBFAILED") = 1 then
		shpLANBFAILED.value = 2 'good
	else
		shpLANBFAILED.value = 3 'bad
	end if
else
	shpLANBFAILED.value = 6
end if</SCRIPT>
