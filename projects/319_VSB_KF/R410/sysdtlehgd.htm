<SCRIPT language=VBScript event=ondatachange for=sd defer>if sd.DataChanged("currentpoint.MODISREDUN") then
	if not sd.QualityBad("currentpoint.MODISREDUN") then
		if sd.DataValue("currentpoint.MODISREDUN") = 1 then
			rect.style.visibility="Hidden" 
		else
			rect.style.visibility="visible"
		end if
	end if
end if</SCRIPT>

<SCRIPT language=VBScript event=onresponse for=Page defer>strResponse = window.event.getAttribute ("OnResponse", 1)
if ucase(strResponse) = ucase(ResponseYes.value) then
	if flag = 1 then
		sd.DataValue("currentpoint.INITHWYADDIAG") = 1
	elseif flag = 2 then
		sd.DataValue("currentpoint.HWYSWAP") = 1
	else
		Flag = 0 
		'This is for setting default value to flag
	end if
end if</SCRIPT>
