<SCRIPT language=VBScript defer>Sub ApplyLayout()
	on error resume next
	GrpLowerPanel.style.top = "" : GrpLowerPanel.style.bottom = "2px"
	GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 : GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	GrpCenterPanel.style.pixelHeight = Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10
		 if window.external.Application.CurrentDisplayPageType=10 then 
			grpEU.style.posTop = ConIndPV.style.posTop - 2
	end if
End Sub
sub setSpToolTip()
	SpHiL =  sd.DataValue("CurrentPoint.SPHI")
	SpLol =  sd.DataValue("CurrentPoint.SPLO") 
strOpToolTip = "SP High Limit = " & SpHil & " EU" & vbcr & "SP Low Limit  = " & SpLol & " EU"
if SpHiL = "1.#QNAN" OR SpLOl = "1.#QNAN" THEN 
ConIndSP.title = ""
else
ConIndSP.title = strOpToolTip
end if
end sub
sub setOpToolTip()
	OpHiL =  sd.DataValue("CurrentPoint.OPHI")
	OpLol =  sd.DataValue("CurrentPoint.OPLO")
strOpToolTip = "OP High Limit = " & OpHil & " %" & vbcr & "OP Low Limit  = " & OpLol & " %"
if OpHiL = "1.#QNAN" OR OpLol = "1.#QNAN" THEN 
ConIndOP.title = ""
else 
ConIndOP.title = strOpToolTip
end if
end sub
Sub EUdescWidth
On Error Resume Next
    If ConAlpEUTickMarksServerBits.Value = 1 Then
        If Len(ConAlpPVEU2.Value) > 8 Then  'compensate for big/small numbers
           ConAlpUNITS.Style.pixelWidth = 45 - (Len(ConAlpPVEU2.Value) - 8) * 10
                If ConAlpUNITS.Style.pixelWidth < 20 Then
                    ConAlpUNITS.Style.pixelWidth = 20
                End If
        ElseIf Len(ConAlpPVEU2.Value) < 9 Then
            ConAlpUNITS.Style.pixelWidth = 45 + (7 - Len(ConAlpPVEU2.Value)) * 10
            If ConAlpUNITS.Style.pixelWidth > 62 Then
                ConAlpUNITS.Style.pixelWidth = 62
            End If
        End If
    End If
End Sub
sub ShowHidePvOpSpMd()
'OP Parameter
	if sd.DataValue("CurrentPoint.opController") = 0 and sd.DataValue("CurrentPoint.OPDESTINATION") = vbnullstring  then
		'OP hidden
		TxtOP.style.visibility="hidden"
		line003.style.visibility="hidden"
		ConAlpOP.style.visibility="hidden"
		txtOPPerc.style.visibility="hidden"
		ConIndOP.style.visibility="hidden"
	else
		'OP Visible
		TxtOP.style.visibility="visible"
		line003.style.visibility="visible"
		ConAlpOP.style.visibility="visible"
		txtOPPerc.style.visibility="visible"
		ConIndOP.style.visibility="visible"
	end if
'MD Parameter
	if sd.DataValue("CurrentPoint.MDController") =  0 and sd.DataValue("CurrentPoint.MDDESTINATION") = vbnullstring then 
		'MD Hidden
		ConCboMode.style.visibility="hidden"
		TxtMode.style.visibility="hidden"
	else
		'MD Visible
		ConCboMode.style.visibility="visible"
		TxtMode.style.visibility="visible"
		page.modeElement = "ConCboMode" ' for Auto selection
	end if
'SP Parameter
	if sd.DataValue("CurrentPoint.SPController") = 0 and sd.DataValue("CurrentPoint.SPDESTINATION") = vbnullstring  then
 		'SP Hidden
		TxtSP.style.visibility= "hidden"
		ConAlpSP.style.visibility="hidden"
		TxtSPEU.style.visibility="hidden"
		line002.style.visibility="hidden"
		ConIndSP.style.visibility="hidden"
	else
		'SP Visible
		TxtSP.style.visibility= "visible"
		ConAlpSP.style.visibility="visible"
		TxtSPEU.style.visibility="visible"
		line002.style.visibility="visible"
		ConIndSP.style.visibility="visible"
	end if
'PV Parameter
	if  sd.DataValue("CurrentPoint.PVController") = 0  then
 		'PV Hidden
		TxtPV.style.visibility="hidden"
		ConAlpPV.style.visibility="hidden"
		txtPVEU.style.visibility="hidden"
		line001.style.visibility="hidden"
		ConIndPV.style.visibility="hidden"
		ConShpPVinEror.style.visibility="hidden"
	else 
		'show PV
		TxtPV.style.visibility="visible"
		ConAlpPV.style.visibility="visible"
		txtPVEU.style.visibility="visible"
		line001.style.visibility="visible"
		ConIndPV.style.visibility="visible"
		ConShpPVinEror.style.visibility="visible"
	end if
End sub</SCRIPT>
