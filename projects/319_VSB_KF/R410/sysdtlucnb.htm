<SCRIPT language=JScript for=alphaConsoleDrives defer event=onupdate>	var groupDriveOption2List = document.getElementById("grpDriveOption2List");
	if(alphaConsoleDrives.DataValue("$LCNnode01.CONSOLEDRIVES") == null)
	{
		return;
	}
	var drives = alphaConsoleDrives.DataValue("$LCNnode01.CONSOLEDRIVES").toArray();
	//disable all drives
	for(i=1; i<=NUM_DRIVES; i++)
	{
		var btnElement = document.getElementById("btnDriveOption1_"+i);
		var btnElement2 = document.getElementById("btnDriveOption2_"+i);
		btnElement.className = "Commands_Unavailable_Button";
		btnElement2.className = "Commands_Unavailable_Button";
		btnElement.disabled = true;
		btnElement2.disabled = true;
	}
	for(i=0; i<drives.length; i++)
	{
		var driveInfo = drives[i].split(",");
		var btnElement = document.getElementById("btnDriveOption1_"+driveInfo[1]);
		btnElement.nodeNo = driveInfo[0];
		btnElement.driveNumber = driveInfo[1];
		btnElement.driveID = driveInfo[2];
		btnElement.driveDesc = driveInfo[3];
		btnElement.disabled = false;
		if(drive1Option == driveInfo[2])
		{
			btnElement.className = "Commands_Selected_Button";
		}
		else
		{
			btnElement.className = "Commands_Option_Button";
		}
		var btnElement2 = document.getElementById("btnDriveOption2_"+driveInfo[1]);
		btnElement2.nodeNo = driveInfo[0];
		btnElement2.driveNumber = driveInfo[1];
		btnElement2.driveID = driveInfo[2]
		btnElement2.driveDesc = driveInfo[3];
		btnElement2.disabled = false;
		if(drive2Option == driveInfo[2])
		{
			btnElement2.className = "Commands_Selected_Button";
		}
		else
		{
			btnElement2.className = "Commands_Option_Button";
		}
		if (/\S/.test(driveInfo[2])) 
		{
			btnElement.value = driveInfo[1] + " - " + driveInfo[2];
			btnElement2.value = driveInfo[1] + " - " + driveInfo[2];
		}
		else
		{
			btnElement.value = driveInfo[1];
			btnElement2.value = driveInfo[1];
		}
	}</SCRIPT>

<SCRIPT language=JScript for=btnExecute defer event=onclick>var command;
	if(commandType == -1)
	{
		window.external.showCallout(this, "Please select a command", 2, 0);
		return;
	}
	if(commandType == LOAD)
	{
		if(drive1Option != -1 && drive1OptionNodeNo != -1 && drive2Option != -1 && drive2OptionNodeNo != -1 && loadType != -1 && alphaNetNo.value != 0 && alphaNodeNo.value != 0 && alphaNIMNo.value)
		{
			command = commandType.toString() + ";" + alphaNIMNo.value + ";" + drive1Option.toString() + ";" + drive1OptionNodeNo.toString() + ";" + drive2Option.toString() + ";" + drive2OptionNodeNo.toString() + ";" + loadType.toString() + ";" + alphaNetNo.value + ";" + alphaNodeNo.value + ";" + DEFAULT_IOP_NUMBER;
			alphaCommand.value= command;
		}
		else if(drive1Option == -1 || drive1OptionNodeNo == -1 || drive2Option == -1 || drive2OptionNodeNo == -1)
		{
			window.external.showCallout(this, "Please select the drives", 2, 0);
		}
		else if(alphaNetNo.value == 0 || alphaNodeNo.value == 0 || alphaNIMNo.value == 0)
		{
			window.external.showCallout(this, "An error occurred", 2, 0);
		}
	}
	else if(commandType == SAVE)
	{
		if(drive1Option != -1 && drive1OptionNodeNo != -1 && alphaNetNo.value != 0 && alphaNodeNo.value != 0 && alphaNIMNo.value != 0)
		{
			command = commandType.toString() + ";" + alphaNIMNo.value + ";" + drive1Option.toString() + ";" + drive1OptionNodeNo.toString() + ";" + alphaNetNo.value + ";" + alphaNodeNo.value;
			alphaCommand.value= command;
		}
		else if(drive1Option == -1 || drive1OptionNodeNo == -1)
		{
			window.external.showCallout(this, "Please select the drives", 2, 0);
		}
		else if(alphaNetNo.value == 0 || alphaNodeNo.value == 0 || alphaNIMNo.value == 0)
		{
			window.external.showCallout(this, "An error occurred", 2, 0);
		}
	}
	else if(commandType == RESTORE)
	{
		if(drive1Option != -1 && drive1OptionNodeNo != -1 && alphaNetNo.value != 0 && alphaNodeNo.value != 0 && alphaNIMNo.value != 0)
		{
			command = commandType.toString() + ";" + alphaNIMNo.value + ";" + drive1Option.toString() + ";" + drive1OptionNodeNo.toString() + ";" + alphaNetNo.value + ";" + alphaNodeNo.value;
			alphaCommand.value= command;
		}
		else if(drive1Option == -1 || drive1OptionNodeNo == -1)
		{
			window.external.showCallout(this, "Please select the drives", 2, 0);
		}
		else if(alphaNetNo.value == 0 || alphaNodeNo.value == 0)
		{
			window.external.showCallout(this, "An error occurred", 2, 0);
		}
	}
	else if(commandType == FASTCOMMAND)
	{
		if(alphaNetNo.value != 0 && alphaNodeNo.value != 0 && alphaNIMNo.value != 0)
		{
			command = commandType.toString() + ";" + alphaNIMNo.value + ";0;0;" + fastCommandType.toString() + ";" + alphaNetNo.value + ";" + alphaNodeNo.value + ";" + DEFAULT_IOP_NUMBER;
			alphaCommand.value = command;
		}
		else
		{
			window.external.showCallout(this, "An error occurred", 2, 0);
		}
	}</SCRIPT>
<SCRIPT language=JScript defer>var LOAD = 27;

var drive1Option = -1;

var DISABLED_ICON = "./Images/Icon_Disabled.png"
var BLANK_ICON = "./Images/blank.png"

	btnProgramLoad.className = "Commands_Option_Button";
	btnSimulatorLoad.className = "Commands_Option_Button";
	btnRestore.className = "Commands_Option_Button";
	btnWarmStartup.className = "Commands_Option_Button";
	btnColdStartup.className = "Commands_Option_Button";
	btnShutdown.className = "Commands_Option_Button";	
	btnIdle.className = "Commands_Option_Button";

}
function SelectCommandOption(element)
{
	ClearDriveSelections();
	commandType = -1;
	loadType = -1;
	fastCommandType = -1;
	grpDriveOption1.style.visibility = "hidden";
	grpDriveOption2.style.visibility = "hidden";
	btnSave.className = "Commands_Option_Button";
	btnProgramLoad.className = "Commands_Option_Button";
	btnSimulatorLoad.className = "Commands_Option_Button";
	btnRestore.className = "Commands_Option_Button";
	btnWarmStartup.className = "Commands_Option_Button";
	btnColdStartup.className = "Commands_Option_Button";
	btnShutdown.className = "Commands_Option_Button";	
	btnIdle.className = "Commands_Option_Button";
	btnSwapPrimary.className = "Commands_Option_Button";
	element.className = "Commands_Selected_Button";
}
function ClearDriveSelections()
{
	drive1Option = -1;
	drive1OptionNodeNo = -1;
	drive2Option = -1;
	drive2OptionNodeNo = -1;
	lblDriveOption1Desc.style.visibility = "hidden";
	txtDriveOption1Desc.style.visibility = "hidden";
	lblDriveOption2Desc.style.visibility = "hidden";
	txtDriveOption2Desc.style.visibility = "hidden";
	btnDriveOption1Net.className = "Commands_Option_Button";
	for(i=1; i<=NUM_DRIVES; i++)
	{
		var btnElement = document.getElementById("btnDriveOption1_" + i);
		if(btnElement.driveNumber)
		{
			btnElement.className = "Commands_Option_Button";
		}
		else
		{
			btnElement.className = "Commands_Unavailable_Button";
		}
	}
	btnDriveOption2Net.className = "Commands_Option_Button";
	for(i=1; i<=NUM_DRIVES; i++)
	{
		var btnElement = document.getElementById("btnDriveOption2_" + i);
		if(btnElement.driveNumber)
		{
			btnElement.className = "Commands_Option_Button";
		}
		else
		{
			btnElement.className = "Commands_Unavailable_Button";
		}
	}
}
function SelectDriveOption1(element)
{
	btnDriveOption1Net.className = "Commands_Option_Button";
	for(i=1; i<=NUM_DRIVES; i++)
	{
		var btnElement = document.getElementById("btnDriveOption1_" + i);
		if(btnElement.driveNumber)
		{
			btnElement.className = "Commands_Option_Button";
		}
		else
		{
			btnElement.className = "Commands_Unavailable_Button";
		}
	}
	element.className = "Commands_Selected_Button";
	drive1Option = element.driveNumber;
	drive1OptionNodeNo = element.nodeNo;
	if(drive1Option != 0)
	{
		lblDriveOption1Desc.style.visibility = "inherit";
		txtDriveOption1Desc.style.visibility = "inherit";
	}
	else
	{
		lblDriveOption1Desc.style.visibility = "hidden";
		txtDriveOption1Desc.style.visibility = "hidden";
	}
	if(/\S/.test(element.driveDesc))
	{
		if(commandType == LOAD)
		{
