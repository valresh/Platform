<SCRIPT language=VBScript for=alpBoxType defer event=onupdate>if not me.QualityBad("BoxTagName.PNTBOXTY") then
	if ucase(me.value) = ucase("CB") then
		pbRegAll.style.visibility = "Inherit"
		pbAllRVAI.style.visibility = "Inherit"
		pbAllDI.style.visibility = "Hidden"
		pbReset.style.visibility = "Inherit"
	elseif ucase(me.value) = ucase("EC") then
		pbRegAll.style.visibility = "Inherit"
		pbAllRVAI.style.visibility = "Hidden"
		pbAllDI.style.visibility = "Inherit"
		pbNext.style.visibility = "Inherit"
		pbReset.style.visibility = "Inherit"
	else
		pbRegAll.style.visibility = "Hidden"
		pbAllRVAI.style.visibility = "Hidden"
		pbAllDI.style.visibility = "Hidden"
		pbNext.style.visibility = "Hidden"
		pbReset.style.visibility = "Hidden"
	end if
end if</SCRIPT>

<SCRIPT language=VBScript for=pbReset defer event=onclick>On Error Resume Next
for i = 1 to 16
	Window.external.StationDataRepository.PutValue cstr("S"&i&"TagName") , "."
	Window.external.StationDataRepository.PutValue cstr("S"&i&"RGPoint") , "."
	Window.external.StationDataRepository.PutValue cstr("S"&i&"RVPoint") , "."
	Window.external.StationDataRepository.PutValue cstr("S"&i&"DIPoint") , "."
	Window.external.StationDataRepository.PutValue cstr("S"&i&"RGParam") , "."
	Window.external.StationDataRepository.PutValue cstr("S"&i&"RVParam") , "."
	Window.external.StationDataRepository.PutValue cstr("S"&i&"DIParam") , "."
	Window.external.StationDataRepository.PutValue cstr("S"&i&"Num") , i
	Window.external.StationDataRepository.autoReloadContent = True
next

pbLoading.style.visibility = "Inherit"
Window.external.StationDataRepository.PutValue cstr("HiwayNum") , 0
Window.external.StationDataRepository.PutValue cstr("BoxNum") , 0
Window.external.StationDataRepository.PutValue cstr("OPMessage") , ""
window.external.StationDataRepository.autoReloadContent = true
for i = 1 to window.external.Dictionary.item("NumHGTag").value -1
	str = Window.external.Dictionary.item("HGTAG"&i).value
	Window.external.Dictionary.Remove(str)
	Window.external.Dictionary.Remove("HGTAG"&i)
next
window.external.Dictionary.Remove("IsTagListAvailable")

<SCRIPT language=VBScript defer>Const sREGLATRY = "REGLATRY"

Const sDIGIN    = "DIGIN"
Const sREGLATRYType = 7
Const sANALGINType  = 1
Const sDIGINType    = 4

Function Load_Page_Initial_Data()
On Error Resume Next
	for i = 1 to 8
		document.getElementById("AlpSlot"&i).value = window.external.StationDataRepository.GetValue(cstr("S"&i+8&"Num"))
	next
	alpHiwayNum.value = window.external.StationDataRepository.GetValue("HiwayNum")
	alpBoxNum.value = window.external.StationDataRepository.GetValue("BoxNum")
	ConAlpMessage.value = window.external.StationDataRepository.GetValue("OPMessage")

End Function
Function Hiway_Box__Number_Onchange()
On Error Resume Next
pbLoading.style.visibility = "Visible"
	if (window.external.Dictionary.item("IsTagListAvailable").value <> "Yes") then
		call Get_Tag_From_HGTAGLST()
	end if
	for i = 1 to 16
		Window.external.StationDataRepository.PutValue cstr("S"&i&"TagName") , "."
		Window.external.StationDataRepository.PutValue cstr("S"&i&"RGPoint") , "."
		Window.external.StationDataRepository.PutValue cstr("S"&i&"RVPoint") , "."
		Window.external.StationDataRepository.PutValue cstr("S"&i&"DIPoint") , "."
		Window.external.StationDataRepository.PutValue cstr("S"&i&"RGParam") , "."
		Window.external.StationDataRepository.PutValue cstr("S"&i&"RVParam") , "."
		Window.external.StationDataRepository.PutValue cstr("S"&i&"DIParam") , "."
		Window.external.StationDataRepository.PutValue cstr("S"&i&"Num") , i
		Window.external.StationDataRepository.autoReloadContent = True
	next
	for i = 1 to 8
		document.getElementById("AlpSlot"&i).value = window.external.StationDataRepository.GetValue(cstr("S"&i+8&"Num"))
	next
	Window.external.StationDataRepository.autoReloadContent = true
	sHiwayNum = cstr(window.external.StationDataRepository.GetValue("HiwayNum"))
	sBoxNum = cstr(window.external.StationDataRepository.GetValue("BoxNum"))
	for i = 1 to 16
		sRGkey = "HY" & sHiwayNum & "BX" & sBoxNum & "SL" & i & "PT" & sREGLATRYType
			Window.external.StationDataRepository.PutValue cstr("S"&i&"RGPoint") , Window.external.Dictionary.item(sRGkey).value
			Window.external.StationDataRepository.PutValue cstr("S"&i&"TagName") , Window.external.Dictionary.item(sRGkey).value
			Window.external.StationDataRepository.autoReloadContent = true
		
		sRVkey = "HY" & sHiwayNum & "BX" & sBoxNum & "SL" & i & "PT" & sANALGINType
			Window.external.StationDataRepository.PutValue cstr("S"&i&"RVPoint") , Window.external.Dictionary.item(sRVkey).value
			window.external.StationDataRepository.autoReloadContent = True

		sDIkey = "HY" & sHiwayNum & "BX" & sBoxNum & "SL" & i & "PT" & sDIGINType
			Window.external.StationDataRepository.PutValue cstr("S"&i&"DIPoint") , Window.external.Dictionary.item(sDIkey).value
			Window.external.StationDataRepository.autoReloadContent = true
	next
	Window.external.StationDataRepository.autoReloadContent = true
	for i = 1 to 8
		document.getElementById("shaph"&i).ReloadContent()
		document.getElementById("shaem"&i).ReloadContent()
	Next
pbLoading.style.visibility = "Hidden"
End Function
Function Slot__Number_Onchange(SIndex, oSlotNum)
On Error Resume Next
		Window.external.StationDataRepository.PutValue cstr("S"&SIndex&"TagName") , "."
		Window.external.StationDataRepository.PutValue cstr("S"&SIndex&"RGPoint") , "."
		Window.external.StationDataRepository.PutValue cstr("S"&SIndex&"RVPoint") , "."
		Window.external.StationDataRepository.PutValue cstr("S"&SIndex&"DIPoint") , "."
		Window.external.StationDataRepository.autoReloadContent = True
if oSlotNum.value <> "" and oSlotNum.value <> vbnullstring then
	sHiwayNum = cstr(window.external.StationDataRepository.GetValue("HiwayNum"))
	sBoxNum = cstr(window.external.StationDataRepository.GetValue("BoxNum"))
	sNum = oSlotNum.value
		sRGkey = "HY" & sHiwayNum & "BX" & sBoxNum & "SL" & sNum & "PT" & sREGLATRYType
			Window.external.StationDataRepository.PutValue cstr("S"&SIndex&"RGPoint") , Window.external.Dictionary.item(sRGkey).value
			Window.external.StationDataRepository.PutValue cstr("S"&SIndex&"TagName") , Window.external.Dictionary.item(sRGkey).value
			Window.external.StationDataRepository.autoReloadContent = true
		
		sRVkey = "HY" & sHiwayNum & "BX" & sBoxNum & "SL" & sNum & "PT" & sANALGINType
			Window.external.StationDataRepository.PutValue cstr("S"&SIndex&"RVPoint") , Window.external.Dictionary.item(sRVkey).value
			window.external.StationDataRepository.autoReloadContent = True

		sDIkey = "HY" & sHiwayNum & "BX" & sBoxNum & "SL" & sNum & "PT" & sDIGINType
			Window.external.StationDataRepository.PutValue cstr("S"&SIndex&"DIPoint") , Window.external.Dictionary.item(sDIkey).value
			Window.external.StationDataRepository.autoReloadContent = true
			
	Window.external.StationDataRepository.PutValue "S"&SIndex&"RGParam" , Window.external.StationDataRepository.GetValue("S"&sNum&"RGParam")
	window.external.StationDataRepository.autoReloadContent = true
	Window.external.StationDataRepository.PutValue "S"&SIndex&"RVParam" , Window.external.StationDataRepository.GetValue("S"&sNum&"RVParam")
	window.external.StationDataRepository.autoReloadContent = true
	Window.external.StationDataRepository.PutValue "S"&SIndex&"DIParam" , Window.external.StationDataRepository.GetValue("S"&sNum&"DIParam")
	window.external.StationDataRepository.autoReloadContent = true
end if
End Function
Function Get_Hiway_Box_TagName()
On Error Resume Next
sPrevBoxTag = Window.external.StationDataRepository.GetValue("BoxTagName")
sHiwayNum = cstr(window.external.StationDataRepository.GetValue("HiwayNum"))
if sHiwayNum < 10 then
	sHiwayNum = cstr("0" & sHiwayNum)
end if
sBoxNum = cstr(window.external.StationDataRepository.GetValue("BoxNum"))
if sBoxNum < 10 then
	sBoxNum = cstr("0" & sBoxNum)
end if
sBoxTagName = "$HY"&sHiwayNum & "B"& sBoxNum
window.external.StationDataRepository.PutValue "BoxTagName" ,"."
window.external.StationDataRepository.autoReloadContent = true
window.external.StationDataRepository.PutValue "BoxTagName" , sBoxTagName
window.external.StationDataRepository.autoReloadContent = true
if ucase(sPrevBoxTag) <> ucase(sBoxTagName) then
	call Hiway_Box__Number_Onchange()
end if
End Function
Function Operator_Message_Onchange()
	window.external.StationDataRepository.PutValue "OpMessage" , ConAlpMessage.value
	window.external.StationDataRepository.autoReloadContent = true
	ConAlpMessage.value = window.external.StationDataRepository.GetValue("OPMessage")
End Function

Function Get_Tag_From_HGTAGLST()
window.external.Dictionary.Add "NumHGTag", 1, true
'On Error Resume Next
Set objFS = window.external.CreateWhitelistedObject("Scripting.FileSystemObject",1)
If objFS is Nothing then
	Exit Function
end if
	strFile = window.external.FindFile("HGTAGLST.XX")
	if strFile = "" then
			Window.external.TemporaryMessageZoneText "Error encountered while trying to launch the cut-over display. Please check for HGTAGLST.XX and try again"
		Exit function
	end if
	Set objFile = objFS.GetFile(strFile)
	Set ts = objFile.OpenAsTextStream(1,-2)
	Do Until ts.AtEndOfStream
		strLine = ts.ReadLine
		Do Until InStr(strLine , Space(2)) = 0
			strLine = Replace(strLine , Space(2), Space(1))
		Loop
		strTagInfo = split(strLine , space(1))
		if IsTagname(strTagInfo(0)) and IsHiwayNumber(strTagInfo(1)) and IsBoxNumber(strTagInfo(2)) and IsSlotNumber(strTagInfo(3)) and IsPointType(strTagInfo(4)) then
			call Add_TagKey_To_StationDictionary(strTagInfo(0),strTagInfo(1), strTagInfo(2), strTagInfo(3), strTagInfo(4))
		end if
	Loop
ts.Close
window.external.Dictionary.Add "IsTagListAvailable", "Yes", true
End Function

Function Add_TagKey_To_StationDictionary(sTagname,sHiwayNum,sBoxNum,sSlotNum,sPointType)
	strTagKey =  "HY" & sHiwayNum & "BX" & sBoxNum & "SL" & sSlotNum & "PT" & GetPointType(sPointType)
	strskey = "HGTAG" & window.external.Dictionary.item("NumHGTag").value
	window.external.Dictionary.Add strskey, strTagKey, true
	Window.external.Dictionary.Add strTagKey, sTagname, true
	sNumHGTag = window.external.Dictionary.item("NumHGTag").value
	sNumHGTag = sNumHGTag+1
	window.external.Dictionary.item("NumHGTag").value = sNumHGTag
End Function


Function IsTagname(sTagname)
If(sTagname <> "" and sTagname <> vbnullstring) Then
	IsTagname = true
else
	IsTagname = false
end if
End Function
Function IsHiwayNumber(sHiwayNum)
If(sHiwayNum <> "" and sHiwayNum <> vbnullstring and IsNumeric(sHiwayNum)) Then
	IsHiwayNumber = true
else
	IsHiwayNumber = false
end if
End Function
Function IsBoxNumber(sBoxNum)
If(sBoxNum <> "" and sBoxNum <> vbnullstring and IsNumeric(sBoxNum)) Then
	IsBoxNumber = true
else
	IsBoxNumber = false
end if
End Function
Function IsSlotNumber(sSlotNum)
If(sSlotNum <> "" and sSlotNum <> vbnullstring and IsNumeric(sHiwayNum)) Then
	IsSlotNumber = true
else
	IsSlotNumber = false
end if
End Function

Function IsPointType(sPointType)
If(sPointType <> "" and sPointType <> vbnullstring) Then
	if ucase(sPointType) = sREGLATRY or ucase(sPointType) = sANALGIN or ucase(sPointType) = sDIGIN then
		IsPointType = true
	else
		isPointType = false
	end if
else
	isPointType = false
end if
End function
Function GetPointType(sPointType)
if ucase(sPointType) = sREGLATRY then
	GetPointType = sREGLATRYType
end if
if ucase(sPointType) = sANALGIN then
	GetPointType = sANALGINType
end if
if ucase(sPointType) = sDIGIN then
	GetPointType = sDIGINType
end if
End Function</SCRIPT>
