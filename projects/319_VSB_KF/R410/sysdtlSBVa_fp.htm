<SCRIPT language=VBScript defer>correctWidth = 0
SKIP = -1

Sub ApplyLayout()           
                Call AdjustHeight()
                Call AdjustWidth()
End Sub

Sub AdjustHeight()
                
                GrpLowerPanel.style.top = "" 
                GrpLowerPanel.style.bottom = "2px"
                GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 
                GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
              	 
End Sub

Sub AdjustWidth()
                Call CalculateCorrectWidth()       
                if (correctWidth <> SKIP) then                   
                    GrpUpperPanel.style.pixelwidth = correctWidth 
                    GrpCenterPanel.style.pixelwidth = correctWidth
                    GrpLowerPanel.style.pixelwidth = correctWidth 
												
                end if
End Sub

Sub CalculateCorrectWidth()
                POPUP = 0
                displayType = window.external.Application.CurrentDisplayPageType 
				CurrentPage = window.external.CurrentPage
					if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
                	
                                correctWidth = SKIP
                                Exit Sub
               		else   

               		if (page.style.zoom > 1) then   
                 		shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))                               
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                                                                                                 
                    else                                        
                         shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                         correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                

                    end if

                end if    

End Sub</SCRIPT>

<SCRIPT language=JScript defer>function InitializeMode(){
	try {
	if (ConCboMode.DataValue("CurrentPoint.SBV1A.PEN") == 1){

	for (var i = 0; i<=2 ; i++){
		ConCboMode.AddString(document.getElementById("txtMDOpt" + i).value);
	}
	}
	else
	{
	ConCboMode.ResetContent();
	for (var i = 1; i<=2 ; i++){
		ConCboMode.AddString(document.getElementById("txtMDOpt" + i).value);
	}
	}
	}
	catch(e){
		window.external.LogMessage("error while initializing Mode combo-box:" +e);
	}
}
function InitializeCommand(){
	if (ConCboCommand.DataValue("CurrentPoint.SBV1A.PEN") == 1){
	ConCboCommand.ResetContent();
	for (var i = 0; i<=1 ; i++){
		ConCboCommand.AddString(document.getElementById("txtCmdOpt" + i).value);
	}
	}
}

function IsRev1(){
	if(!alpPEN.QualityBad("CurrentPoint.SBV1A.PEN")){
		if(alpPEN.DataValue("CurrentPoint.SBV1A.PEN") == 0){
			grpRev3a.style.visibility = "hidden";
			grpRev3.style.visibility = "hidden";
			grpRev1Status.style.top = "23";
		}
		else
		{
			grpRev3.style.visibility = "inherit";
			grpRev3a.style.visibility = "inherit";
			grpRev1Status.style.top	= "63";
		}
	}
}</SCRIPT>

<SCRIPT language=JScript for=ConCboMode defer event=ondatachange>try {
	if(this.DataValue("CurrentPoint.SBV1A.PEN") == 1){
	if (this.DataChanged("CurrentPoint.SBV1A.BA")){
		InitializeMode();
		if ((this.QualityGood("CurrentPoint.SBV1A.BA"))&& (this.QualityGood("CurrentPoint.SBV1A.BO"))){
			if (this.DataValue("CurrentPoint.SBV1A.BA") == 1){
				this.value = txtMDOpt2.value;
				ConCboCommand.disabled = true;
			}
			else if( (this.DataValue("CurrentPoint.SBV1A.BO") == 0 )&& (this.DataValue("CurrentPoint.SBV1A.BA") == 0)){
				this.selectedIndex = 1;
				if(this.QualityGood("CurrentPoint.SBV1A.OUTSIDE_PERM")){
					if(this.DataValue("CurrentPoint.SBV1A.OUTSIDE_PERM")==0){
						ConCboCommand.disabled = true;
					}
					else if(this.DataValue("CurrentPoint.SBV1A.OUTSIDE_PERM")==1){
						ConCboCommand.disabled = false;
					}
				}
			}
			else if( (this.DataValue("CurrentPoint.SBV1A.BO") == 1 )&& (this.DataValue("CurrentPoint.SBV1A.BA") == 0)){
				this.selectedIndex = 0;
				if(this.QualityGood("CurrentPoint.SBV1A.OUTSIDE_PERM")){
					if(this.DataValue("CurrentPoint.SBV1A.OUTSIDE_PERM")==0){
						ConCboCommand.disabled = true;
					}
					else if(this.DataValue("CurrentPoint.SBV1A.OUTSIDE_PERM")==1){
						ConCboCommand.disabled = false;
					}
				}
			}
		}
	}
	}
	else
	{
		if (this.DataChanged("CurrentPoint.SBV1A.BA")){
		InitializeMode();
			if ((this.QualityGood("CurrentPoint.SBV1A.BA"))){
				if (this.DataValue("CurrentPoint.SBV1A.BA") == 1){
					this.value = txtMDOpt2.value;
				}
				else
				{
					this.value = txtMDOpt1.value;
				}
			}
		}
	}
}
catch(e){
	window.external.LogMessage("error during command change:" + e);
}</SCRIPT>

<SCRIPT language=JScript for=ConCboMode defer event=onchange>/*for manual mode*/
try {
	/*when MAN mode is selected*/
	if (this.DataValue("CurrentPoint.SBV1A.PEN") == 1){
	if (this.selectedIndex == 1){
		if ((this.DataValue("CurrentPoint.SBV1A.BO") == 0 )){
			if (this.QualityGood("CurrentPoint.SBV1A.OM")){
				this.DataValue("CurrentPoint.SBV1A.OM") = 1;
				this.selectedIndex = 1;
			}
		}
		else if ((this.DataValue("CurrentPoint.SBV1A.BO") == 1 )){
			if (this.QualityGood("CurrentPoint.SBV1A.OM")){
				this.DataValue("CurrentPoint.SBV1A.OM") = 0;
				this.selectedIndex = 0;
			}
		}
		}

	//}
	/*when AUTO mode is selected*/
		else if (this.selectedIndex == 2){
		if ((this.DataValue("CurrentPoint.SBV1A.BO") == 0 )){
			if (this.QualityGood("CurrentPoint.SBV1A.OA")){
				this.DataValue("CurrentPoint.SBV1A.OA") = 1;
				this.selectedIndex = 2;
			}
		}
		else if ((this.DataValue("CurrentPoint.SBV1A.BO") == 1 )){
			if (this.QualityGood("CurrentPoint.SBV1A.OA")){
				this.DataValue("CurrentPoint.SBV1A.OA") = 0;
				this.selectedIndex = 0;
			}
		}
	}
	/*when None mode is selected*/
	else if (this.selectedIndex == 0){
		if ((this.QualityGood("CurrentPoint.SBV1A.BA")) && (this.QualityGood("CurrentPoint.SBV1A.BO"))){
			if( (this.DataValue("CurrentPoint.SBV1A.BO") == 1 )&& (this.DataValue("CurrentPoint.SBV1A.BA") == 0)){
				this.value = txtMDOpt0.value;
			}
			else if( (this.DataValue("CurrentPoint.SBV1A.BO") == 0 )&& (this.DataValue("CurrentPoint.SBV1A.BA") == 1)){
				this.DataValue("CurrentPoint.SBV1A.OM") = 1;
				this.value = txtMDOpt1.value;
			}
			else if( (this.DataValue("CurrentPoint.SBV1A.BO") == 1 )&& (this.DataValue("CurrentPoint.SBV1A.BA") == 1)){
				this.DataValue("CurrentPoint.SBV1A.OM") = 1;
				this.value = txtMDOpt0.value;
			}
			else if( (this.DataValue("CurrentPoint.SBV1A.BO") == 0 )&& (this.DataValue("CurrentPoint.SBV1A.BA") == 0)){
				this.DataValue("CurrentPoint.SBV1A.OM") = 1;
				this.value = txtMDOpt1.value;
			}
		}
		}
	}
	else
	{
		if (this.selectedIndex == 0){
			if (this.QualityGood("CurrentPoint.SBV1A.OM")){
				this.DataValue("CurrentPoint.SBV1A.OM") = 1;
				this.value = txtMDOpt1.value;
			}
		}
		else if(this.selectedIndex == 1){
			if (this.QualityGood("CurrentPoint.SBV1A.OA")){
				this.DataValue("CurrentPoint.SBV1A.OA") = 1;
				this.value = txtMDOpt2.value;
			}
		}
	}
}
catch(e){
	window.external.LogMessage("error during command change:" + e);
}</SCRIPT>
