<SCRIPT language=VBScript defer>sub selection(Slot)
	b=Slot
	Document.getElementById("Slot" & b).textColor=50282496
	Document.getElementById("CardType" & b).textColor=50282496
	Document.getElementById("Cardoption" & b).textColor=50282496
	Document.getElementById("Tog" & b).textColor=50282496
	Document.getElementById("line" & b).style.visibility="vISIBLE"
	Document.getElementById("line" & b).lineColor=50282496
end sub

sub Deselection(Slot1)
	c=Slot1
	Document.getElementById("Slot" & c).textColor=VBBLACK
	Document.getElementById("CardType" & c).textColor=VBBLACK
	Document.getElementById("Cardoption" & c).textColor=VBBLACK
	Document.getElementById("Tog" & c).textColor=VBBLACK
	Document.getElementById("line" & c).style.visibility="Hidden"
	Document.getElementById("line" & c).lineColor=VBBLACK
end sub

Sub InvokeSubSlot(CardType,Slot)
if CardType.VALUE <> empty and CardType.VALUE <> txtZero.value and CardType.VALUE <> txtNONE.value and CardType.VALUE <> "NaN" then
	SlotBox.value=Ucase(Slot)
	Subslotpage.click
else 
	window.external.TemporaryMessageZoneText Message.value
end if

end Sub


Sub SlotUpdate(oSource,SlotNo)
		Document.getElementById("Tog" & SlotNo).style.visibility="visible"
		Document.getElementById("Cardoption" & SlotNo).style.visibility="visible"
		Document.getElementById("CardType" & SlotNo).style.visibility="visible"
		If oSource.value = txtNONE.value then 
			Document.getElementById("Tog" & SlotNo).style.visibility="Hidden"
			Document.getElementById("Cardoption" & SlotNo).style.visibility="Hidden"
			Document.getElementById("CardType" & SlotNo).style.visibility="Hidden"
		end if
			if oSource.value = txtDIGIN.value or oSource.value = txtANALOGIN.value or oSource.value = txtCOUNTER.value then
				Document.getElementById("Tog" & SlotNo).style.visibility="Hidden"	
			end if
end sub</SCRIPT>
