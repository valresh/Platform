' tables, where the items to include in each table change according to
' database configurations, and can be associated with links to other displays.
' ****************************************************************************/
Dim MAX_ITEMS
Dim ITEMS_PER_ROW, ITEMS_PER_COL
Dim ITEMS_HORI_FIRST, ITEMS_VERT_FIRST
Dim ITEM_DEFAULT_WIDTH, ITEM_DEFAULT_HEIGHT
MAX_ITEMS           = 40
ITEMS_HORI_FIRST    = 0 ' Arrange items from left to right, and then add rows
ITEMS_VERT_FIRST    = 1 ' Arrange items from top to bottom, and then add columns
ITEMS_PER_ROW       = 8
ITEMS_PER_COL       = MAX_ITEMS / ITEMS_PER_ROW
ITEM_DEFAULT_WIDTH  = 120
ITEM_DEFAULT_HEIGHT = 30
Dim ITEM_TYPE_FLEX, ITEM_TYPE_CSTN, ITEM_TYPE_CON
ITEM_TYPE_FLEX = "Flex"
ITEM_TYPE_CSTN = "CStn"
ITEM_TYPE_CON  = "Con"
Sub UpdateFlexTable()
    UpdateTable ITEM_TYPE_FLEX, ITEM_DEFAULT_WIDTH, ITEM_DEFAULT_HEIGHT, grpFlexData, null, grpFlexDetails
End Sub
Sub UpdateCStnTable()
    UpdateTable ITEM_TYPE_CSTN, (ITEM_DEFAULT_WIDTH+20), ITEM_DEFAULT_HEIGHT, grpCStnData, grpCStnFlags, grpCStnDetails
End Sub
Sub UpdateConTable()
    UpdateTable ITEM_TYPE_CON, ITEM_DEFAULT_WIDTH, ITEM_DEFAULT_HEIGHT, grpConData, null, grpConDetails
End Sub
'/*****************************************************************************
' Arranges a table of items
' Parameters:
'   * itemType - string, used as a prefix to identify children elements of the
'                group parameters that provide the table content
'   * itemWidth  - integer
'   * itemHeight - integer
'   * grpItemData - group, contains information about the items to potentially
'                   be displayed in the table
'   * grpItemFlags - group, contains additional flags that indicate if an
'                    item should be ignored
'   * grpItems - group, the actual items that form the user-visible table
' ****************************************************************************/
Sub UpdateTable(itemType, itemWidth, itemHeight, grpItemData, grpItemFlags, grpItems)
 	itemCount = 0
	For itemIndex = 1 To MAX_ITEMS
        grpItems.children("pb" & itemType & "Detail" & itemIndex).style.visibility = "hidden"
	    checkProfileSetting = True
        If (Not IsNull(grpItemFlags)) Then
            checkProfileSetting = (grpItemFlags.children("alphaIgnore" & itemType & itemIndex).value = 0)
        End If
        If (checkProfileSetting and (grpItemData.children("alpha" & itemType & "UseProfile" & itemIndex).value = 1)) Then
	        assignedProfile = grpItemData.children("alpha" & itemType & "Profile" & itemIndex).value 
			If (CInt(assignedProfile) = CInt(alphaRecord.value)) Then
    	        itemCount = itemCount + 1
        	    GetTableItemPosition ITEMS_HORI_FIRST, itemCount, itemWidth, itemHeight, topPosition, leftPosition
				grpItems.children("pb" & itemType & "Detail" & itemIndex).value        = grpItemData.children("alpha" & itemType & "Name" & itemIndex).value
				grpItems.children("pb" & itemType & "Detail" & itemIndex).style.left   = leftPosition
	            grpItems.children("pb" & itemType & "Detail" & itemIndex).style.top    = topPosition
				grpItems.children("pb" & itemType & "Detail" & itemIndex).style.width  = itemWidth
   	         	grpItems.children("pb" & itemType & "Detail" & itemIndex).style.height = itemHeight
				grpItems.children("pb" & itemType & "Detail" & itemIndex).style.visibility = "visible"
			End If
		End If
	Next
	If (itemCount = 0) Then
		grpItems.children("msgNo" & itemType).style.visibility = "visible"
    Else
		grpItems.children("msgNo" & itemType).style.visibility = "hidden"
	End If
End Sub
'/*****************************************************************************
' Calculates the position of item #itemIndex in a table, using the magic of
' modular arithmetic.
' The table items can be arranged by row first, and then by column or
' vice-versa.
' ****************************************************************************/
Sub GetTableItemPosition(tableOrientation, itemIndex, itemWidth, itemHeight, topPosition, leftPosition)
    If (tableOrientation = ITEMS_HORI_FIRST) Then
        leftPosition = 1 + ((itemIndex - 1) mod ITEMS_PER_ROW) * itemWidth
        topPosition  = 1 + ((itemIndex - 1) \ ITEMS_PER_ROW) * itemHeight
    Else
        leftPosition = 1 + ((itemIndex - 1) \ ITEMS_PER_COL)  * itemWidth
        topPosition  = 1 + ((itemIndex - 1) mod ITEMS_PER_COL) * itemHeight
    End If
End Sub</SCRIPT>
