<SCRIPT language=VBScript defer>correctWidth = 0
SKIP = -1

Sub ApplyLayout()           
                Call AdjustHeight()
                Call AdjustWidth()
End Sub

Sub AdjustHeight()
                
                GrpLowerPanel.style.top = "" 
                GrpLowerPanel.style.bottom = "2px"
                GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 
                GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
              	 
End Sub

Sub AdjustWidth()
                Call CalculateCorrectWidth()       
                if (correctWidth <> SKIP) then                   
                    GrpUpperPanel.style.pixelwidth = correctWidth 
                    GrpCenterPanel.style.pixelwidth = correctWidth
                    GrpLowerPanel.style.pixelwidth = correctWidth 
												
                end if
End Sub

Sub CalculateCorrectWidth()
                POPUP = 0
                displayType = window.external.Application.CurrentDisplayPageType 
				CurrentPage = window.external.CurrentPage
					if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
                	
                                correctWidth = SKIP
                                Exit Sub
               		else   

               		if (page.style.zoom > 1) then   
                 		shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))                               
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                                                                                                 
                    else                                        
                         shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                         correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                

                    end if

                end if    

End Sub</SCRIPT>

<SCRIPT language=VBScript for=EnumSimulationState defer event=onupdate>if not sd.QualityBad("IOMTagName.SIMSTATE") then
	if sd.DataValue("IOMTagName.SIMSTATE") = 2 then
		'SIMSTATE is SIMFREEZE
		txtSIM.style.visibility = "Hidden" : EnumSimulationState.style.visibility = "visible"
	elseif sd.DataValue("IOMTagName.SIMSTATE") = 1 then
		'SIMSTATE is SIMRUN
		txtSIM.style.visibility = "visible" : EnumSimulationState.style.visibility = "Hidden"
	else 
		txtSIM.style.visibility = "hidden" : EnumSimulationState.style.visibility = "Hidden" 
	end if
else
	txtSIM.style.visibility = "hidden" : EnumSimulationState.style.visibility = "Hidden" 
end if</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>if not sd.QualityBad("CurrentPoint.PNTTYPE") then
	select case sd.DataValue("CurrentPoint.PNTTYPE")
		case 1 'Channel type is AI
			ConTxtAnalogInput.style.visibility = "Inherit"
			ConTxtAnalogOutput.style.visibility = "Hidden"
			ConTxtDigitalInput.style.visibility = "Hidden"
			ConTxtDigitalOutput.style.visibility = "Hidden"
			ConTxtPulsenput.style.visibility = "Hidden"
			grpAI.style.visibility = "Inherit"
			grpAO.style.visibility = "Hidden"
			grpDI.style.visibility = "Hidden"
			grpDO.style.visibility = "Hidden"
			grpPI.style.visibility = "Hidden"
		case 2 'Channel type is AO
			ConTxtAnalogInput.style.visibility = "Hidden"
			ConTxtAnalogOutput.style.visibility = "Inherit"
			ConTxtDigitalInput.style.visibility = "Hidden"
			ConTxtDigitalOutput.style.visibility = "Hidden"
			ConTxtPulsenput.style.visibility = "Hidden"
			grpAI.style.visibility = "Hidden"
			grpAO.style.visibility = "Inherit"
			grpDI.style.visibility = "Hidden"
			grpDO.style.visibility = "Hidden"
			grpPI.style.visibility = "Hidden"
		case 4 'Channel type is DI
			ConTxtAnalogInput.style.visibility = "Hidden"
			ConTxtAnalogOutput.style.visibility = "Hidden"
			ConTxtDigitalInput.style.visibility = "Inherit"
			ConTxtDigitalOutput.style.visibility = "Hidden"
			ConTxtPulsenput.style.visibility = "Hidden"
			grpAI.style.visibility = "Hidden"
			grpAO.style.visibility = "Hidden"
			grpDI.style.visibility = "Inherit"
			grpDO.style.visibility = "Hidden"
			grpPI.style.visibility = "Hidden"
		case 5 'Channel type is DO
			ConTxtAnalogInput.style.visibility = "Hidden"
			ConTxtAnalogOutput.style.visibility = "Hidden"
			ConTxtDigitalInput.style.visibility = "Hidden"
			ConTxtDigitalOutput.style.visibility = "Inherit"
			ConTxtPulsenput.style.visibility = "Hidden"
			grpAI.style.visibility = "Hidden"
			grpAO.style.visibility = "Hidden"
			grpDI.style.visibility = "Hidden"
			grpDO.style.visibility = "Inherit"
			grpPI.style.visibility = "Hidden"
		case 34 'Channel type is PI
			ConTxtAnalogInput.style.visibility = "Hidden"
			ConTxtAnalogOutput.style.visibility = "Hidden"
			ConTxtDigitalInput.style.visibility = "Hidden"
			ConTxtDigitalOutput.style.visibility = "Hidden"
			ConTxtPulsenput.style.visibility = "Inherit"
			grpAI.style.visibility = "Hidden"
			grpAO.style.visibility = "Hidden"
			grpDI.style.visibility = "Hidden"
			grpDO.style.visibility = "Hidden"
			grpPI.style.visibility = "Inherit"
		case else 'Channel type is invalid
			ConTxtAnalogInput.style.visibility = "Inherit"
			ConTxtAnalogOutput.style.visibility = "Hidden"
			ConTxtDigitalInput.style.visibility = "Hidden"
			ConTxtDigitalOutput.style.visibility = "Hidden"
			ConTxtPulsenput.style.visibility = "Hidden"
			grpAI.style.visibility = "Hidden"
			grpAO.style.visibility = "Hidden"
			grpDI.style.visibility = "Hidden"
			grpDO.style.visibility = "Hidden"
			grpPI.style.visibility = "Hidden"
	End select
end if</SCRIPT>
