<SCRIPT language=JScript defer>
//===============================================================================================================
//The following code to extract filter settings from the SQL formatted string MUST match exactly with the filtering definition as
// defined in behavior.xml
//helper to determine basefilter for activitiytype from the SQL formatted filter
//will assume any appearance of filtering for activity type will be aggregated by an OR regardless of the actual SQL aggregation
//the following are regular expression objects
var FILTERSUBSTR_ACTTYPE_BATCHFILTER = /ActivityType like '?Batch/i;
var FILTERSUBSTR_ACTTYPE_PROCEDUREFILTER = /ActivityType like '?Procedure/i;
var ALL_ACTIVITIES=0;
var BATCH_ONLY=1;
var PROCEDURE_ONLY=2;
function extractActFilterFromSQL(bstrSQLFilter)
{
	includeBatches = false;
	includeProcedures = false;
	if ( bstrSQLFilter.search(FILTERSUBSTR_ACTTYPE_BATCHFILTER) >= 0 ) {
		includeBatches = true;
	}
	if ( bstrSQLFilter.search(FILTERSUBSTR_ACTTYPE_PROCEDUREFILTER) >= 0 ) {
		includeProcedures = true;
	}
	var actTypeFilter = ALL_ACTIVITIES;	
	if (includeBatches && !includeProcedures) {
		actTypeFilter = BATCH_ONLY;
	} else if ( !includeBatches && includeProcedures) {
		actTypeFilter = PROCEDURE_ONLY;
	}
	return actTypeFilter;
}
//regular expressions to extract normal string type filter values
var FILTERSUBSTR_TAGNAME_FIELD = /Tagname like '([^']+)'/i;
var FILTERSUBSTR_PUBLICNAME_FIELD = /PublicName like '([^']+)'/i;
var FILTERSUBSTR_ASSET_FIELD = /Asset like '([^']+)'/i;
//helper to extract all the different filters from the SQL formatted filter string and set the silver light object with the filters
//assumes the aggregation between different SQL substrings for different field is always an AND.  
function SetBaseFilter(bstrSQLFilter, slObject)
{
	//get the TagName filter
	var tagNameFilter = bstrSQLFilter.match(FILTERSUBSTR_TAGNAME_FIELD);
	var tagNameFilterStr = "";
	if ( (tagNameFilter != null) && (tagNameFilter.length >= 2) ) {
		tagNameFilterStr = tagNameFilter[1];
	}
	//get the PublicName filter
	var publicNameFilter = bstrSQLFilter.match(FILTERSUBSTR_PUBLICNAME_FIELD);
	var publicNameFilterStr = "";
	if ( (publicNameFilter != null) && (publicNameFilter.length >= 2) ) {
		publicNameFilterStr = publicNameFilter[1];
	}
	//get the Activity Type filter
	var actTypeFilter = extractActFilterFromSQL(bstrSQLFilter);
	//get the assets Filter
	var assetfilterDelimited = bstrSQLFilter.match(FILTERSUBSTR_ASSET_FIELD);
	var assetfilterDelimitedStr = "";
	if ( (assetfilterDelimited != null) && (assetfilterDelimited.length >= 2) ) {
		assetfilterDelimitedStr = assetfilterDelimited[1];
	}
	slObject.Content.DataPage.SetCreationUIBaselineFilter(actTypeFilter, assetfilterDelimitedStr, tagNameFilterStr, publicNameFilterStr);
}
//=================================================================================================================
//used to set the hosting environment for the creation UI.  i.e. tell it that it is in a popup
var EBMCREATIONDATAUI_POPUP = 3;
//used to set SilverLight Object configurations
function SetCreationUIConfig()
{
    try
    {
        var slObject = document.getElementById("ActCreationUI");
        //tell the UI that it is embedded in a pop up
        slObject.Content.DataPage.SetHostingEnvironment(EBMCREATIONDATAUI_POPUP);
        //tell the Silverlight object it is to show the creation UI
        slObject.Content.DataPage.RequestNavigate("CreationUIView");
        slObject.Content.DataPage.CreationUIClosed = CloseCreationUI;
        //set baseline filter
        bstrSQLFilter = DisplayDataRepository.GetValue("CreationBaselineFilter");
        SetBaseFilter(bstrSQLFilter, slObject);
    }
    catch (err){} //do nothing
}
//used to set SilverLight Object configurations
function CloseCreationUI()
{
	window.external.close();
}
</SCRIPT>
