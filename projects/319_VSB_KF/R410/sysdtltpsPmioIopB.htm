<SCRIPT language=VBScript defer>' // IOPTYPE constants are from \db\src\iolim\pm_ioptype.enm. 
'
LLAI 		= 1
HLAI 		= 2
DI 			= 3
DO16 		= 4
AO8			= 5
LLMUX 		= 7
STIMV  		= 14
DISOE		= 16
AO16 		= 24
DO32 		= 25
RHMUX 		= 28
HLAIHART 	= 29
DI24V 		= 30	
AO16HART	= 31
dim numChans
numChans = 0

'Analog Output, HART Capable, 16 ch
'High Level Analog Input, HART Capable, 16 ch

Sub IOPTYPE_Onupdate ( )
'On Error Resume Next

'	 // Make the correct set of channel data me.style.visibility to the user.
dim nSelector 
	nSelector = 0

	if sd.QualityGood("CurrentPoint.IOPTYPE") and sd.DataValue("CurrentPoint.IOPTYPE") <> 0 and not sd.IsNan("CurrentPoint.IOPTYPE") then
		nSelector = sd.DataValue("Currentpoint.IOPTYPE")
	elseif sd.QualityGood("CurrentPoint.IOMTYPE") then
		if sd.DataValue("CurrentPoint.IOMTYPE") 	= "Low Level Analog Input, 8 ch" then
			nSelector = 1
			numChans = 8
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "High Level Analog Input, 16 ch" then
			nSelector = 2
			numChans = 16
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Digital Input, 32 ch" then
			nSelector = 3
			numChans = 32
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Digital Output, 16 ch" then
			nSelector = 4
			numChans = 16
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Analog Output, 8 ch" then
			nSelector = 5
			numChans = 8
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Low Level Multiplexer, 32 ch" then
			nSelector = 7
			numChans = 32
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Smart Transmitter Interface Multi-Variable, 16 ch" then
			nSelector = 14
			numChans = 16
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Digital Input - Sequence of Events, 32 ch" then
			nSelector = 16
			numChans = 32
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Analog Output, 16 ch" then
			nSelector = 24
			numChans = 16
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Digital Output, 32 ch" then
			nSelector = 25
			numChans = 32
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Remote Hardened Multiplexer, 32 ch" then
			nSelector = 28
			numChans = 32
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "High Level Analog Input, HART Capable, 16 ch" then
			nSelector = 29
			numChans = 16
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "24 Volt Digital Input, 32 ch" then
			nSelector = 30
			numChans = 32
		elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Analog Output, HART Capable, 16 ch" then
			nSelector = 31
			numChans = 16
		end if
	end if

	Select Case nSelector 'sd.DataValue("CurrentPoint.IOPTYPE") 

	Case LLAI, HLAI, HLAIHART, STIMV, LLMUX, RHMUX
'		 //  analog input channels
'		numChans = sd.DataValue("CurrentPoint.NUMCHANS")
		for i = 1 to numChans
			if sd.QualityGood("CurrentPoint.CHNLNAME("&i&")") then
				Document.getElementById("shpChaNum"&i).value = 2
				Document.getElementById("txtChaNum"&i).style.visibility = "Inherit"
				Document.getElementById("shpChaNum"&i).SetCustomProperty "point", "TagChannel", sd.DataValue("CurrentPoint.CHNLNAME("&i&")")
				Document.getElementById("shpChaNum"&i).ReloadContent
			end if
		next
		for i = numChans+1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"

		next
		shpheader1.value = 2
		if (numChans >16) then
			shpheader2.value = 2
		else
			shpheader2.value = 1
		end if

	Case DI, DISOE, DI24V
'		 //  digital input channels
'		numChans = sd.DataValue("CurrentPoint.NUMCHANS")
		for i = 1 to numChans
			if sd.QualityGood("CurrentPoint.CHNLNAME("&i&")") then
				Document.getElementById("shpChaNum"&i).value = 4
				Document.getElementById("txtChaNum"&i).style.visibility = "Inherit"
				Document.getElementById("shpChaNum"&i).SetCustomProperty "point", "TagChannel", sd.DataValue("CurrentPoint.CHNLNAME("&i&")")
				Document.getElementById("shpChaNum"&i).ReloadContent
			end if

		next
		for i = numChans+1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"
		next
		shpheader1.value = 4
		if (numChans >16) then
			shpheader2.value = 4
		else
			shpheader2.value = 1
		end if
	
	Case DO16, DO32
'		 //  digital output channels
		'numChans = sd.DataValue("CurrentPoint.NUMCHANS")
		for i = 1 to numChans
			if sd.QualityGood("CurrentPoint.CHNLNAME("&i&")") then
				Document.getElementById("shpChaNum"&i).value = 5
				Document.getElementById("txtChaNum"&i).style.visibility = "Inherit"
				Document.getElementById("shpChaNum"&i).SetCustomProperty "point", "TagChannel", sd.DataValue("CurrentPoint.CHNLNAME("&i&")")
				Document.getElementById("shpChaNum"&i).ReloadContent
			end if

		next
		for i = numChans+1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"

		next
		shpheader1.value = 5
		if (numChans >16) then
			shpheader2.value = 5
		else
			shpheader2.value = 1
		end if


	Case  AO8, AO16, AO16HART
'		 //  analog output channels
'		numChans = sd.DataValue("CurrentPoint.NUMCHANS")
		for i = 1 to numChans
			if sd.QualityGood("CurrentPoint.CHNLNAME("&i&")") then
				Document.getElementById("shpChaNum"&i).value = 3
				Document.getElementById("txtChaNum"&i).style.visibility = "Inherit"
'msgbox "Updating shape shpChaNum"&i& " TagChannel point as: " & sd.DataValue("CurrentPoint.CHNLNAME(" & i & ")")
				Document.getElementById("shpChaNum"&i).SetCustomProperty "point", "TagChannel", sd.DataValue("CurrentPoint.CHNLNAME("&i&")")
				Document.getElementById("shpChaNum"&i).ReloadContent
			end if
		next
		for i = numChans+1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"
		next
		shpheader1.value = 3
		if (numChans >16) then
			shpheader2.value = 3
		else
			shpheader2.value = 1
		end if


	Case Else
'		 // An error... No channel data will be updated/displayed
		for i = 1 to 32
			Document.getElementById("shpChaNum"&i).value = 1
			Document.getElementById("txtChaNum"&i).style.visibility = "Hidden"
			shpheader1.value = 1
			shpheader2.value = 1
		next

	End Select

End Sub


Sub Navigate_To_Channel_Detail_Display(oSource)
DisplayDataRepository.PutValue "CMName" , "."
DisplayDataRepository.PutValue "CHName" , "."
DisplayDataRepository.autoReloadContent = true
	strChname = oSource.value
	if (instr(strChname, ".") > 0) then
		str = split(strChname , ".")
		DisplayDataRepository.PutValue "CMName" , str(0) 'Navigate to CM Detail Display
		DisplayDataRepository.PutValue "CHName" , str(1) 'Navigate to Channel Detail Display
		DisplayDataRepository.autoReloadContent = true
	elseif (instr(strChname, "[") > 0) and (instr(strChname, "]") > 0)then
		str = split(strChname , "[")
		DisplayDataRepository.PutValue "CHName" , str(0) 'Navigate to Channel Detail Display
		str1 = split(str(1) , "]")
		DisplayDataRepository.PutValue "CMName" , str1(0) 'Navigate to CM Detail Display
		DisplayDataRepository.autoReloadContent = true
	else
		DisplayDataRepository.PutValue "CHName" , strChname
	end if
Call_Channel_Point_Detail_Dislay
End sub

Sub Call_Channel_Point_Detail_Dislay()
if not alpCHDesc.QualityBad("CHName.DESC") then
	window.external.Parent.RequestTask 21, 73, 0, 0, 0, DisplayDataRepository.GetValue("CHName")
elseif not alpCMDesc.QualityBad("CMName.DESC") then
	window.external.Parent.RequestTask 21, 73, 0, 0, 0, DisplayDataRepository.GetValue("CMName")
end if
End sub</SCRIPT>
