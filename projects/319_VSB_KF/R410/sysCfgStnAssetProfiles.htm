<SCRIPT language=VBScript for=alphaRecord defer event=onchange>	if (me.value > alphaMaxStations.value) then
		me.CancelChange
	end if</SCRIPT>
<SCRIPT language=VBScript for=alphaRecord defer event=onupdate>    If (me.value > alphaMaxStations.value) Then
        me.value = alphaMaxStations.value 
    End if</SCRIPT>
<SCRIPT language=VBScript for=alphaKeyboardType defer event=onupdate>   If (IsNumeric(me.value)) Then
        If (me.value = 14 Or me.value = 15) Then
            pbTabKeyboard.disabled = False
        Else
            pbTabKeyboard.disabled = True
        End If
    End If</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onpagecomplete>    infoAvailableProfiles.title = tooltipAvailableProfiles.innerText</SCRIPT>
<SCRIPT language=VBScript for=alphaServerType defer event=onupdate>    If (IsNumeric(me.value)) Then
        If (me.value >= 5 And me.value <= 7) Then
            ' This display should not be used on EBI systems!
            NavigateToDefaultDisplay()
        End If
    End If</SCRIPT>
<SCRIPT language=VBScript for=chkUseProfile defer event=onupdate>    If (me.value = 0) Then
        NavigateToDefaultDisplay()
    End If</SCRIPT>
<SCRIPT language=VBScript defer>' Navigate to a default display if this tab should not be accessed
Sub NavigateToDefaultDisplay()
    window.external.RequestTask 21, 72, 0, 0, 0, "sysCfgStnDetails?HSCRecord=" & alphaRecord.value
End Sub</SCRIPT>
