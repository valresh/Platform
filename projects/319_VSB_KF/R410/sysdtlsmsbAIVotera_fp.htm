<SCRIPT language=VBScript for=Page defer event=onpagecomplete>on error resume next
document.title=cstr(alphaTagName.value) 
gbPageComplete = true
call PVFormatUpdate(sd,strDacaBlockName)
call SetEUDescHeight(ConAlpEUDesc_GSH)

	'AI_x PV bars in FP center panel
	for i = 1 to 3
		set oConAlpPV = document.getElementById("ScConAlpPVAI"&i)
		set oIndPV = document.getElementById("IndPVAI"&i)
		'Config Error for AI
		if (oConAlpPV.quality and 4)=4  and (oConAlpPV.quality and 8)<>8 then '
			oIndPV.style.visibility = "hidden"
			document.getElementById("TxtPVAI"&i).style.visibility = "hidden"
			document.getElementById("ConShpAlmPrAI"&i).style.visibility = "hidden"
		else
		 	oIndPV.style.visibility = "inherit"
			document.getElementById("TxtPVAI"&i).style.visibility = "inherit"
			document.getElementById("ConShpAlmPrAI"&i).style.visibility = "inherit"
		end if
	 	'AI PV bars for COM BOs in Voter FLD - driven by script (not getting EU range when bound)
		iPVEUHI = oConAlpPV.Datavalue("Currentpoint.AI_" & i & ".PVEUHI")
		iPVEULO = oConAlpPV.Datavalue("Currentpoint.AI_" & i & ".PVEULO")
		oIndPV.RangeHI = iPVEUHI
		oIndPV.RangeLO = iPVEULO
		oIndPV.RangeOrigin = 0
	next

	'Hide DEV SP if not present in FLD (1oo1 Voter only?)
	set oConAlpDEVSP = document.getElementById("ConAlpDEVSP")
	if typename(oConAlpDEVSP)<>"Nothing" then
		if (oConAlpDEVSP.quality and 4)=4  and (oConAlpDEVSP.quality and 8)<>8 then
		 	oConAlpDEVSP.style.visibility = "hidden"
			document.getElementById("TxtDEVSP").style.visibility = "hidden"
			document.getElementById("TxtDEVEU").style.visibility = "hidden"
		 else
		 	oConAlpDEVSP.style.visibility = "inherit"
			document.getElementById("TxtDEVSP").style.visibility = "inherit"
			document.getElementById("TxtDEVEU").style.visibility = "inherit"
		 end if
	 end if
