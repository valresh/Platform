<SCRIPT language=VBScript defer>Sub UpdateCrt()
Dim channelNum
ChannelAEnable.style.visibility = "hidden"
ChannelBEnable.style.visibility = "hidden"
TxtLinkAStatus.style.visibility = "Hidden"
TxtLinkBStatus.style.visibility = "Hidden"
textbox017.style.left = 667
For channelNum = 20 To 1 Step -1
	document.getElementById("LinkBEnable"&channelNum).style.visibility = "hidden"
	document.getElementById("AlpChannelBType"&channelNum).style.visibility = "hidden"
	document.getElementById("shpLinkBStatus"&channelNum).style.visibility = "hidden"
	If not(document.getElementById("ChnType"&channelNum).IsElementNaN)then
		If (document.getElementById("LinkBImpl"&channelNum).value = 1 ) Then
			If (document.getElementById("ChnType"&channelNum).value = 34) Then
		document.getElementById("LinkBEnable"&channelNum).style.visibility = "hidden"
		document.getElementById("AlpChannelBType"&channelNum).style.visibility = "hidden"
		document.getElementById("shpLinkBStatus"&channelNum).style.visibility = "hidden"
			Else
		document.getElementById("LinkBEnable"&channelNum).style.visibility = "Inherit"
		document.getElementById("AlpChannelBType"&channelNum).style.visibility = "Inherit"
		document.getElementById("shpLinkBStatus"&channelNum).style.visibility = "Inherit"
		textbox017.style.left = 725
			ChannelAEnable.style.visibility = "Visible"
			ChannelBEnable.style.visibility = "Visible"
			TxtLinkAStatus.style.visibility = "Visible"
			TxtLinkBStatus.style.visibility = "Visible"
			End If
		End If
	End if
Next
End Sub
Sub NavigateToDetailDisplay(tablepos,chnenb)
	if isNumeric(tablepos) and isNumeric(chnenb) then
		if (chnenb <> 0) and (tablepos > 0) then
			window.external.CurrentPage = "sysCfgChannelSts?hscpoint=$CHANNEL"&Right(String(4,"0")&CStr(window.external.CurrentRecordOffset+tablepos-1),4)
		end if
	end if
End Sub</SCRIPT>
