<SCRIPT language=VBScript defer>Dim StrServerName
Dim strServerNodeName
Dim strUserName


Sub AddServerNameToList()
cmbSelSever.ResetContent
'Initializing combobox value
'cmbSelSever.value = alpLocalServerAliasName.value & " - " & alpLocalServerNodeName.value 
alpEditServer.value = alpLocalServerAliasName.value & " - " & alpLocalServerNodeName.value 
Dim cmbSelOption(56)
Dim i
cmbSelOption(0) = alpSystemName.value & " - " & alpLocalServerNodeName.value 
cmbSelOption(1) = alpLocalServerAliasName.value & " - " & alpLocalServerNodeName.value 

cmbSelSever.AddString(cmbSelOption(0)) 
cmbSelSever.AddString(cmbSelOption(1))  

For i = 2 To 56
	serverVersion = document.getElementById("alpServerVersion"&i).value
	if serverVersion >= 910 then
		cmbSelOption(i) = document.getElementById("alpServerAliasName"&i).value  & " - " & document.getElementById("alpServerNodeName"&i).value
		cmbSelSever.AddString(cmbSelOption(i))
	end if
Next
End sub</SCRIPT>

<SCRIPT language=VBScript for=cmbSelSever defer event=onchange>Dim val, nodeName
alpEditServer.value = cmbSelSever.value
val = cmbSelSever.value
nodeName = Split(val, " - ", -1, 1)
StrServerNodeName = nodeName(1)
StrServerNodeName = chr(34) & StrServerNodeName & chr(34)
cmbSelSever.value = ""</SCRIPT>

<SCRIPT language=VBScript for=alpEditServer defer event=onchange>StrServerNodeName = alpEditserver.value
StrServerNodeName = chr(34) & StrServerNodeName & chr(34)</SCRIPT>

<SCRIPT language=VBScript for=pbLaunchOnline defer event=onclick>	Dim strPath
	strPath = "OdsApp.exe" & " " & "/s:" & strServerNodeName & " " & "/u:"& strUserName & " " & "/q:"
	window.external.CreateWhitelistedObject strPath,0</SCRIPT>
