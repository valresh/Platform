<SCRIPT language=VBScript for=alpPointName defer event=onupdate>On Error Resume Next
if not alpPointName.QualityBad("CurrentPoint.LocationFullItemName") then
	if ucase(alpPointName.DataValue("currentpoint.BLOCKTYPNAME")) = Ucase("SYSTEM:CONTROLMODULE") or ucase(alpPointName.DataValue("currentpoint.BLOCKTYPNAME")) = Ucase("SYSTEM:UCM") Then
		shpChart.src = "sysscdaActiveXCM.sha"
		shpChart.ReloadContent
	elseif ucase(alpPointName.DataValue("currentpoint.BLOCKTYPNAME")) = Ucase("SYSTEM:SCM")or ucase(alpPointName.DataValue("currentpoint.BLOCKTYPNAME")) = Ucase("SYSTEM:RCM")or ucase(alpPointName.DataValue("currentpoint.BLOCKTYPNAME")) = Ucase("SYSTEM:MASTERRECIPE") then
		shpChart.src = "sysscdaActiveXAC.sha"
		shpChart.ReloadContent
	else
		shpChart.value = 2
	end if
else
	
	shpChart.value = 1
End if</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onpagecomplete>On Error Resume Next

page.style.height = "100%"

ShpChart.style.height = "100%"
if not alpPointName.QualityBad("CurrentPoint.LocationFullItemName") then
	document.title = "Chart View:  " & alpPointName.DataValue("CurrentPoint.Name")
end if</SCRIPT>
