<SCRIPT language=VBScript defer>Sub InvokeSubSlot(CardType,Slot)
if CardType.VALUE <> empty and CardType.VALUE <> "NaN" and CardType.VALUE <> txtNONE.value and CardType.VALUE <> txtRESERVED.value then
	SlotBox.value=Ucase(Slot)
	Subslotpage.click
else 
	window.external.TemporaryMessageZoneText Message.value
end if
end Sub

Dim b,c
Sub selection(BoxNum)
	b=BoxNum
	Document.getElementById("Slot" & b).textColor=50282496
	Document.getElementById("CardType" & b).textColor=50282496
	Document.getElementById("line" & b).style.visibility="vISIBLE"
	Document.getElementById("line" & b).lineColor=50282496
end sub

Sub Deselection(BoxNum1)
	c=BoxNum1
	Document.getElementById("Slot" & c).textColor=VBBLACK
	Document.getElementById("CardType" & c).textColor=VBBLACK
	Document.getElementById("line" & c).style.visibility="hidden"
end sub

Sub SlotUpdate(oSource,SlotNo)
			Document.getElementById("CardType" & SlotNo).style.visibility="visible"
		If oSource.value = txtNONE.value then 
			Document.getElementById("CardType" & SlotNo).style.visibility="Hidden"
		end if
		If oSource.value = txtRESERVED.value and SlotNo = 32 and  sd.DataValue("currentpoint.BOXSIZE") = 0 then 
			Document.getElementById("CardType" & SlotNo).style.visibility="Hidden"
		end if
end sub</SCRIPT>

<SCRIPT language=VBScript event=ondatachange for=sd defer>if sd.DataChanged("currentpoint.BOXSIZE") then
	if not sd.QualityBad("currentpoint.BOXSIZE") then
		if sd.DataValue("currentpoint.BOXSIZE") = 1 then
			'Box Size is EXTENDED
			Slot17to32.style.visibility="Visible" 
		Else
			Slot17to32.style.visibility="hidden" 
		end if
	end if
end if</SCRIPT>
