<SCRIPT language=VBScript defer>Const numMaxScrollReport = 978       	'Max value for non-UL system.  To prevent seeing records 998 and over
										'UL reserves report 998 and 999 on EBI.
Const numMaxULScrollReport = 980</SCRIPT>
<SCRIPT language=VBScript for=CurrentRecordOffset defer event=onupdate>' chkUL value is true if UL Listing is licenced.
' To prevent seeing records 998+  Only for EBI
If (IsNumeric(alpServerTypeRaw.value)) Then
	If (alpServerTypeRaw.value >= 5 And alpServerTypeRaw.value <= 7) Then
		If chkUL.value = 0 And me.Value > numMaxScrollReport  Then
			window.external.CurrentRecordOffset = numMaxScrollReport
		elseIf me.Value > numMaxULScrollReport Then
			window.external.CurrentRecordOffset = numMaxULScrollReport
		End If
	End If
End If</SCRIPT>
