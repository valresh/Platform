<SCRIPT language=VBScript defer>bPageComplete = False

Sub SetPageCompleteTrue()
	bPageComplete = true
end sub</SCRIPT>

<SCRIPT language=VBScript event=onpagecomplete for=Page defer>call SetPageCompleteTrue

On Error Resume Next
	If sd.DataValue("currentpoint.BLCKCOMMENT2") <> vbNullString Then
		DisplayDataRepository.PutValue "FFBNAME", CStr(sd.DataValue("currentpoint.BLCKCOMMENT2"))
	End If</SCRIPT>

<SCRIPT language=VBScript event=ondatachange for=sd defer>if sd.DataChanged("currentpoint.{%FFBNAME%}.BOXTYPE") then
	if sd.DataValue("currentpoint.{%FFBNAME%}.BOXTYPE") = "HLPIU" then
		AlmFunCombobox.style.visibility = "VISIBLE" : AlmFunLable.style.visibility = "VISIBLE"
	else
		AlmFunCombobox.style.visibility = "HIDDEN" : AlmFunLable.style.visibility = "HIDDEN"
	end if

	if sd.DataValue("currentpoint.{%FFBNAME%}.BOXTYPE") = "HLPIU" or sd.DataValue("currentpoint.{%FFBNAME%}.BOXTYPE") = "DHP" then
		SupprsForDHPHLPIU.style.visibility = "VISIBLE"
	else
		SupprsForDHPHLPIU.style.visibility = "HIDDEN"
	end if
end if
 
 if sd.DataChanged("currentpoint.{%FFBNAME%}.IPCRDOP") then
	if sd.DataValue("currentpoint.{%FFBNAME%}.IPCRDOP") = 0 then
		'NOTIFYST
		AlmFunCombobox.disabled = true : AlmFunCombobox.fillColor = "#C0C0C0" 'Gray
	else
		AlmFunCombobox.disabled = False : AlmFunCombobox.fillColor = VBWhite
	end if
	if sd.DataValue("currentpoint.{%FFBNAME%}.IPCRDOP") = 1 or sd.DataValue("currentpoint.{%FFBNAME%}.IPCRDOP") = 2 then
		'CHNGDECT or SOE 
		SupprsForDHPHLPIU.disabled = true	
	else
		SupprsForDHPHLPIU.disabled = False	
	end if
end if</SCRIPT>
