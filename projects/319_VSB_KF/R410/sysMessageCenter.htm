    <SCRIPT type="text/javascript">
        // --------------------------------------------------------------------------------------
        // ISR219404 - Workaround for IE DISPID mapping bug. Once the HMIWeb elements are injected into the DOM,
        // the DISPID of the elements may change, causing property change notifications to be ignored or HSCStationWindow to crash.
        // Workaround is to do a read of the property before DOM elements get injected, which for some reason
        // locks the DISPIDs in place. Related ISR135891.
        // https://support.microsoft.com/en-us/help/2855169/internet-explorer-may-not-return-the-same-dispid-for-the-same-property
        // NOTE: the property have to be read in this specific way "element.myProperty" for the dispids to be locked.
        // Reading the property like "element['myProperty']" will not lock the dispids.
        function lockDispids() {
            var val;

            // lock dispids for comboboxes
            var comboBoxElements = document.getElementsByClassName("hsc.combo.1");
            for (var i = 0; i < comboBoxElements.length; i++) {
                var elem = comboBoxElements[i];
                val = elem.currentValue;
                val = elem.OptionList;
                val = elem.Message;
                val = elem.Quality;
                val = elem.QualityStatus;
            }

            // lock dispids for alphanumerics
            var alphaNumericElements = document.getElementsByClassName("hsc.alpha.1");
            for (var i = 0; i < alphaNumericElements.length; i++) {
                var elem = alphaNumericElements[i];
                val = elem.currentValue;
                val = elem.quality;
                val = elem.SecurityLevel;
                val = elem.Message;
                val = elem.QualityStatus;
                val = elem.NotifyAfterBlur;
            }

            // lock dispids for HVG
            var hvgElements = document.getElementsByClassName("hvg.base.1");
            for (var i = 0; i < hvgElements.length; i++) {
                var elem = hvgElements[i];
                val = elem.Message;
            }

            // lock dispids for scriptdata
            var scriptDataElements = document.getElementsByClassName("HSC.ScriptDataObject.1");
            for (var i = 0; i < scriptDataElements.length; i++) {
                var elem = scriptDataElements[i];
                val = elem.RuntimePointNames;
                val = elem.RuntimeParameters;
                val = elem.RuntimeValues;
                val = elem.Message;
            }
        }
        document.addEventListener('DOMContentLoaded', lockDispids);
    </SCRIPT>

    <script type="text/javascript">
        var cssFile;
        
        //look for "dest=touchpanel-navigation" in url param to see if we are in the nav pane of OTP
        var regexS = "[\\?&]dest=([^&#]*)";
        var regex = new RegExp(regexS, 'i');  // do case insensitive regex search
        var results = regex.exec(window.location.href);
        if (results && (results[1] == "touchpanel-navigation")) {
            cssFile = "message-center-dsp-dark.css";
        } else {
            switch (window.external.application.ColorTheme) {
            case 2: // light
                cssFile = "message-center-dsp-light.css";
                break;
            case 1: // dark
                cssFile = "message-center-dsp-dark.css";
                break;
            case 0: // classic
            default:
                cssFile = "message-center-dsp-classic.css";
                break;
            }
        }

        var link = document.createElement("link");
        link.type = "text/css";
        link.rel = "stylesheet";
        link.href = "./sysMessageCenter_files/styles/" + cssFile;
        document.head.appendChild(link);
    </script>

<SCRIPT language=JScript 
for=instructionResponseShape_ParamResolver_scriptDataObj defer 
event=ondatachange>	// iterate through all the custom property script data on this object
	var bResolutionComplete = true;
	for (var i = 0; i < PARAM_NAME_LIST.length; ++i) 
	{
		if (instructionResponseShape_ParamResolver_scriptDataObj.DataChanged("MSGPOINT." + PARAM_NAME_LIST[i])) {
			resolvedParams[PARAM_NAME_LIST[i]] = RetrieveBindingValue(this, PARAM_NAME_LIST[i]);
		}
		// param value may have been retrieved in an earlier ondatachange
		if(!(PARAM_NAME_LIST[i] in resolvedParams))
		{
			window.external.application.logMessage("!!! Not in resolved param list: " + PARAM_NAME_LIST[i]);
			bResolutionComplete = false;
		}	
	}

	if (bResolutionComplete && (instructionResponseShape_ParamResolver_scriptDataObj.parentElement.parentElement.ParamsResolvedCallback != undefined))
	{
		instructionResponseShape_ParamResolver_scriptDataObj.parentElement.parentElement.ParamsResolvedCallback(resolvedParams);
	}</SCRIPT>

<SCRIPT language=JScript for=instructionResponseShape_InstructionText defer 
event=onshapeload>// remove vertical size restriction to enable scrollbar
	instructionResponseShape_InstructionText_instructionTextElem.parentElement.style.overflow = "hidden";
	instructionResponseShape_InstructionText_instructionTextElem.style.height = null;

	var bindingTargets = instructionResponseShape_InstructionText_instructionTextElem.parentElement.parentElement.parentElement.customBindingTargets;
	var customAlphaList = [	{numeric: instructionResponseShape_InstructionText_customalpha1, enumerate: instructionResponseShape_InstructionText_customenum1}, 
							{numeric: instructionResponseShape_InstructionText_customalpha2, enumerate: instructionResponseShape_InstructionText_customenum2}, 
							{numeric: instructionResponseShape_InstructionText_customalpha3, enumerate: instructionResponseShape_InstructionText_customenum3},
							{numeric: instructionResponseShape_InstructionText_customalpha4, enumerate: instructionResponseShape_InstructionText_customenum4},
							{numeric: instructionResponseShape_InstructionText_customalpha5, enumerate: instructionResponseShape_InstructionText_customenum5}];
	
	// get the instruction text string from shape's parent
	var instructionTextString = instructionResponseShape_InstructionText_instructionTextElem.parentElement.parentElement.parentElement.instructionTextString;
	if ((typeof(instructionTextString) != 'string') || (instructionTextString.length == 0)) {
		return;
	}
	instructionResponseShape_InstructionText_instructionTextElem.innerHTML = instructionTextString;

	// Resize the instruction text area
	// This is done in setTimeout to allow the instruction text innerHTML to be parsed, 
	// new DOM elements created and laid out correctly before resizing everything according to the instruction text.
	setTimeout(function() {
		var MAX_INSTRUCTION_TEXT_HEIGHT = 300;
		var newHeight = Math.min(MAX_INSTRUCTION_TEXT_HEIGHT, instructionResponseShape_InstructionText_instructionTextElem.clientHeight);
		instructionResponseShape_InstructionText_instructionTextElem.parentElement.style.height = newHeight.toString() + "px";
		instructionResponseShape_InstructionText_instructionTextElem.parentElement.parentElement.style.height = newHeight.toString() + "px";

		// Once the instruction area size has been set, allow it to be rendered, then 
		// resize the whole instruction response shape accordingly
		setTimeout(function() {
			if (instructionResponseShape_InstructionText_instructionTextElem.parentElement.parentElement.parentElement.OnResize) {
				instructionResponseShape_InstructionText_instructionTextElem.parentElement.parentElement.parentElement.OnResize();
			}
			
			// setup the custom scrollbar only if it is necessary
			instructionResponseShape_InstructionText_instructionTextElem.parentElement.classList.remove("instruction-response-shape-text-with-scrollbar");
			if (instructionResponseShape_InstructionText_instructionTextElem.clientHeight > MAX_INSTRUCTION_TEXT_HEIGHT) {
				setTimeout(function() {
					var elNC = document.getElementsByTagName("hn-notification-center")[0];
					if (elNC && elNC.applyCustomScrollbar) {
						instructionResponseShape_InstructionText_instructionTextElem.parentElement.classList.add("instruction-response-shape-text-with-scrollbar");
						elNC.applyCustomScrollbar(instructionResponseShape_InstructionText_instructionTextElem.parentElement, instructionResponseShape_InstructionText_instructionTextElem.clientHeight);
					}
					// once scrollbar is set, position the live value alphas
					setTimeout(function() {
						InitializeCustomBindingAlphas(bindingTargets, customAlphaList);
					}, 0);
				}, 0);
			} else {
				// if we don't need a scrollbar, position the live value alphas now
				InitializeCustomBindingAlphas(bindingTargets, customAlphaList);
			}
		}, 0);
	}, 0);
	
	instructionResponseShape_InstructionText_instructionTextElem.parentElement.parentElement.parentElement.parentElement.RepositionLiveValueAlphas = function() {
		PositionCustomBindingAlphas(bindingTargets, customAlphaList);
	};</SCRIPT>

<SCRIPT language=JScript for=instructionResponseShape defer event=onshapeload>// extract the message point and param info
	var msgpoint = instructionResponseShape_ParamResolver.parentElement.parentElement.GetCustomProperty("Point", "msgpoint")
	var msgblock = instructionResponseShape_ParamResolver.parentElement.parentElement.GetCustomProperty("Parameter", "msgblock")

	// this is a vanilla DOM element that is focusable but has no binding property and is outside the notification center element
	var activateHelperId = "instructionResponseShapeActivateHelper";
	var activateHelper = document.getElementById(activateHelperId);
	// create it if it doesn't exist yet
	if (activateHelper == null) {
		activateHelper = document.createElement("textarea");
		activateHelper.id = activateHelperId;
		Page.appendChild(activateHelper);
	}
	
	var firstAlphaActivate = true;
	var firstActivateElem = null;
	instructionResponseShape_ParamResolver.parentElement.addEventListener("activate", function (event) {
		// For alpha selection, fire a double shot "activate" such that 1st event is allowed to bubble for selection context,
		// 2nd event is cancelled at the shape level to re-select the alpha as the currently selected object on the page.
		if (event.target.classList.contains("hsc.alpha.1")) {
			if ((!firstAlphaActivate) && (event.target == firstActivateElem)) {
				event.cancelBubble = true;
				event.stopPropagation();
				firstAlphaActivate = true;
				
			} else {
				setTimeout(function() {
					// move the focus to an element that has no binding behavior so be safely cancelled.
					// this allows the original selection target to be reselected 
					activateHelper.setActive();
					setTimeout(function() {
						firstAlphaActivate = false;
						firstActivateElem = event.target;
						firstActivateElem.setActive();
					}, 50);
				}, 20);
			}
		}
	});
	
	activateHelper.addEventListener("activate", function (event) {
		event.cancelBubble = true;
		event.stopPropagation();
	});

		
	// register callbacks on the grouping object
	instructionResponseShape_ParamResolver.parentElement.ParamsResolvedCallback = function(resolvedParams) {
		instructionResponseShape_Entry.autoReloadContent = false;
		instructionResponseShape_Target.autoReloadContent = false;
		instructionResponseShape_InstructionText.autoReloadContent = false;
		
		var hideInstruction = true;
		var hideEntry = true;
		var hideTarget = true;

		try {
			// Check for act entity and basename, extract them first
			var actEntity = "";
			var baseName = "";
			if ('ACTENTITY' in resolvedParams && resolvedParams.ACTENTITY != null) {
				actEntity = resolvedParams.ACTENTITY.trim().toUpperCase();
			}
			if ('BASENAME' in resolvedParams && resolvedParams.BASENAME != null) {
				baseName = resolvedParams.BASENAME.trim().toUpperCase();
			}
		
			// loop through all the key value pairs
			for (var propertyName in resolvedParams) {
				if (!resolvedParams.hasOwnProperty(propertyName) || (resolvedParams[propertyName] == null)) {
					continue;
				}
				var propertyValue = resolvedParams[propertyName].trim();
				if (propertyValue.length == 0) {
					continue;
				}

				switch(propertyName) {
				case "ACTENTITY":
				case "BASENAME":
					break;
				case "TARGETLABEL":
					instructionResponseShape_Target.SetCustomProperty("Value", "LABEL" , propertyValue);
					break;
				case "TARGETVAL":
					SetDataEntryCustomProperty(instructionResponseShape_Target, true, propertyValue, actEntity, baseName, msgpoint);
					hideTarget = false;
					break;
				case "TARGETEUDESC":
					SetDataEntryCustomProperty(instructionResponseShape_Target, false, propertyValue, actEntity, baseName, msgpoint);
					break;
				case "ENTRYLABEL":
					instructionResponseShape_Entry.SetCustomProperty("Value", "LABEL" , propertyValue);
					break;
				case "ENTRYVAL":
					SetDataEntryCustomProperty(instructionResponseShape_Entry, true, propertyValue, actEntity, baseName, msgpoint);
					hideEntry = false;
					break;
				case "ENTRYEUDESC":
					SetDataEntryCustomProperty(instructionResponseShape_Entry, false, propertyValue, actEntity, baseName, msgpoint);
					break;
				case "INSTRUCTION":
					// sanitize html string
					if (html_sanitize) {
						var rawInstructionText = html_sanitize(propertyValue);
						ParseInstructionText(rawInstructionText, actEntity, baseName, msgpoint, instructionResponseShape_InstructionText);
						hideInstruction = false;
					} else {
						window.external.application.logMessage("Error: html sanitizing library not found. Instruction text will be ignored");
					}
					break;
				default:
					break;
				}
			}

		} catch (err) {
			window.external.application.logMessage("Error:" + err);
			throw err;
		}

		if (hideEntry) {
			instructionResponseShape_Entry.style.display = "none";
		} else {
			instructionResponseShape_Entry.style.display = "block";
			instructionResponseShape_Entry.ReloadContent();
		}

		if (hideTarget) {
			instructionResponseShape_Target.style.display = "none";
		} else {
			instructionResponseShape_Target.style.display = "block";
			instructionResponseShape_Target.ReloadContent();
		}

		if (hideInstruction) {
			instructionResponseShape_InstructionText.style.display = "none";
			// If we are hiding instruction text, instruction text resizing logic is not executed, so we have to make sure
			// shape is resized according to a collapsed instruction text area.
			setTimeout(function() {
				if (instructionResponseShape_ParamResolver.parentElement.OnResize) {instructionResponseShape_ParamResolver.parentElement.OnResize();}
			}, 0);
		} else {
			instructionResponseShape_InstructionText.style.display = "block";
			instructionResponseShape_InstructionText.ReloadContent();
		}
	};

	instructionResponseShape_ParamResolver.parentElement.OnResize = function() {
		var instructionTextHeight = instructionResponseShape_InstructionText.clientHeight;
		var entryHeight = instructionResponseShape_Entry.clientHeight;
		var targetHeight = instructionResponseShape_Target.clientHeight;
		var VERTICAL_MARGIN = 10;
		// make the height of data entry absolute rather than percentage
		instructionResponseShape_Entry.style.height = entryHeight + "px";
		instructionResponseShape_Target.style.height = targetHeight + "px";
		instructionResponseShape_Entry.style.top = (instructionTextHeight + VERTICAL_MARGIN) + "px";
		instructionResponseShape_Target.style.top = (instructionTextHeight + (entryHeight ? (entryHeight + VERTICAL_MARGIN) : 0) + VERTICAL_MARGIN) + "px";
		var totalHeightString = (instructionTextHeight + (entryHeight ? (entryHeight + VERTICAL_MARGIN) : 0) + (targetHeight ? (targetHeight + VERTICAL_MARGIN) : 0) + VERTICAL_MARGIN) + "px";
		instructionResponseShape_ParamResolver.parentElement.style.height = totalHeightString;
		instructionResponseShape_ParamResolver.parentElement.parentElement.style.height = totalHeightString;
		setTimeout(function() {
			if (instructionResponseShape_ParamResolver.parentElement.parentElement.shapeLoadedCallback) {
				instructionResponseShape_ParamResolver.parentElement.parentElement.shapeLoadedCallback();
			}
		}, 0);
	}; 

	// set the custom binding on the param resolver
	instructionResponseShape_ParamResolver.autoReloadContent = false;
	instructionResponseShape_ParamResolver.SetCustomProperty("Point",	 "MSGPOINT",	 msgpoint);
	instructionResponseShape_ParamResolver.SetCustomProperty("Parameter", "TARGETVAL",	msgblock + ".TARGETVALREF");
	instructionResponseShape_ParamResolver.SetCustomProperty("Parameter", "ENTRYVAL",	 msgblock + ".ENTRYVALREF");
	instructionResponseShape_ParamResolver.SetCustomProperty("Parameter", "TARGETEUDESC", msgblock + ".TARGETEUDESCREF");
	instructionResponseShape_ParamResolver.SetCustomProperty("Parameter", "ENTRYEUDESC",  msgblock + ".ENTRYEUDESCREF");
	instructionResponseShape_ParamResolver.SetCustomProperty("Parameter", "TARGETLABEL",  msgblock + ".TARGETLABEL");
	instructionResponseShape_ParamResolver.SetCustomProperty("Parameter", "ENTRYLABEL",   msgblock + ".ENTRYLABEL");
	instructionResponseShape_ParamResolver.SetCustomProperty("Parameter", "INSTRUCTION" , msgblock + ".INSTRUCTION");
	instructionResponseShape_ParamResolver.SetCustomProperty("Parameter", "ACTENTITY",	"ACTENTITY");
	instructionResponseShape_ParamResolver.ReloadContent();</SCRIPT>

<SCRIPT id=152521D5-861F-4F6D-A10A-B12681EDEF49 language=JScript defer 
shaperefcount="1">// Global defines
MAX_SUPPORTED_CUSTOM_BINDINGS = 5;

// IRS global functions
function SetDataEntryCustomProperty(shapeElement, bIsValue, strPointParam, actEntity, baseName, msgPoint) {
	var delimIndex = strPointParam.indexOf(".");
	if (delimIndex == -1 || (delimIndex >= (strPointParam.length - 1))) {
		window.external.application.logMessage("SetDataEntryCustomProperty: failed to split value reference \"" + strPointParam + "\" into point parameter");
		return;
	}
	var point = strPointParam.substring(0, delimIndex);
	var pointNameUpper = point.toUpperCase();

	// Check if point matches act entity or the basename. If so, replace with msg point
	if (ComparePointName(actEntity, pointNameUpper) || ComparePointName(baseName, pointNameUpper)) {
		point = msgPoint;
	}
	var param = strPointParam.substring(delimIndex + 1);

	var propertyNameRoot = bIsValue ? "VAL" : "EUDESC";
	shapeElement.SetCustomProperty("Point", propertyNameRoot+"POINT" , point);
	shapeElement.SetCustomProperty("Parameter", propertyNameRoot+"PARAM" , param);
}


function ParseInstructionText(rawInstructionText, actEntity, baseName, msgPoint, instructionElement) {
	// "$MSGPOINT$" can be used as a special symbol in the point param binding syntax in the instruction text to refer to the point that the message is raised on.
	// This is usually the activity point or the SCM point,
	var MSGPOINT_TAG = "$MSGPOINT$";
	var DEFAULT_CHAR_LENGTH = 8;
	var PIXEL_PER_CHAR_LARGE = 13;
	var PIXEL_PER_CHAR_SMALL = 6;
	var NUM_CHAR_LARGE = 6;
	var CHAR_MIN = 2;
	var CHAR_MAX = 24;
	var bindingTargets = [];
	
	// from hsc_isValidPointName() and hsc_isValidParamName()
	// static char *INVALID_CHARS_POINTS	= ".,/\\<>'\"*?|:; \t"; // removed colon from invalid chars list for points in regex below to support server prepended point name.
	// static char *INVALID_CHARS_PARAMS	= ",/\\<>'\"*?|:; \t";  // Equivalent to points, except dot is allowed
	// optional formatting configuration Dxx for decimal places and Wxx for character length
	var processedText = rawInstructionText.replace(/{{([^.,\/\\<>'"*?|; \t{}]*)[.]([^,\/\\<>'"*?|:; \t{}]*)((:[DW][0-9]+)+)?}}/ig, 
		function(wholeMatch, point, param, options, lastOption, offset, string) {
			if (bindingTargets.length >= MAX_SUPPORTED_CUSTOM_BINDINGS) {
				window.external.application.logMessage("Maximum number of instruction key parameters reached. Maximum is: "+ MAX_SUPPORTED_CUSTOM_BINDINGS);
				return wholeMatch;
			}

			// extract optional formattings
			var decimalPlaces = 2;
			var charLength = -1;
			
			var optionList = options ? options.split(":") : [];
			for(var i = 0; i < optionList.length; ++i ) {
				if (!optionList[i] || optionList[i].length == 0) { 
					continue;
				} else if (optionList[i].charAt(0).toUpperCase() === 'D') {
					switch (optionList[i].toUpperCase()) {
					case "D0":
					case "D1":
					case "D2":
					case "D3":
					case "D4":
						decimalPlaces = parseInt(optionList[i].substring(1));
					}
				} else if (optionList[i].charAt(0).toUpperCase() === 'W') {
					var widthNum = parseInt(optionList[i].substring(1));
					if ((widthNum >= CHAR_MIN) && (widthNum <= CHAR_MAX)) {
						charLength = widthNum;
					}
				}
			}
			
			var pointNameUpper = point.toUpperCase();
			if ((pointNameUpper == MSGPOINT_TAG) || ComparePointName(actEntity, pointNameUpper) || ComparePointName(baseName, pointNameUpper)) {
				point = msgPoint;
			}
			
			//construct span element with inline width styling
			var calcCharLength = (charLength > 0) ? charLength: DEFAULT_CHAR_LENGTH;
			var spanId= "spanLiveValuePlaceHolder" + bindingTargets.length;
			var placeholderWidth = calcCharLength > NUM_CHAR_LARGE ? (PIXEL_PER_CHAR_LARGE*NUM_CHAR_LARGE+PIXEL_PER_CHAR_SMALL*(calcCharLength-NUM_CHAR_LARGE)) : (PIXEL_PER_CHAR_LARGE*calcCharLength);
			var replacementString = "<span class='instruction-response-live-value-placeholder' id='" + spanId + "' style='width: " + (placeholderWidth + 2) + "px;'></span>&nbsp";
			
			bindingTargets.push({point: point, param: param, placeholder: spanId, decimals: decimalPlaces, numberOfChars: charLength});
			return replacementString;
	});

	SetCustomBindings(bindingTargets, instructionElement);
	instructionElement.parentElement.instructionTextString = processedText;
	instructionElement.parentElement.customBindingTargets = bindingTargets;
}

function ComparePointName(pointName1, pointName2) {
	var delimPos1 = pointName1.indexOf(":");
	var delimPos2 = pointName2.indexOf(":");
	// if both name is server prepended, compare as it is.
	if ((delimPos1 != -1) && (delimPos2 != -1)) {
		return (pointName1 == pointName2);
	}
	// otherwise strip off any prepended server name, then compare
	if (delimPos1 != -1) {
		pointName1 = pointName1.substr(delimPos1 + 1);
	}
	if (delimPos2 != -1) {
		pointName2 = pointName2.substr(delimPos2 + 1);
	}
	return (pointName1 == pointName2);
}

function SetCustomBindings(bindingTargets, instructionElement) {
	for (var i = 0; (i < bindingTargets.length) && (i < MAX_SUPPORTED_CUSTOM_BINDINGS); ++i) {
		var bindingTarget = bindingTargets[i];
		if (!bindingTarget || !bindingTarget.point || !bindingTarget.param) {
			continue;
		}
		instructionElement.SetCustomProperty("Point", "CUSTOM" + (i+1) + "POINT" , bindingTarget.point);
		instructionElement.SetCustomProperty("Parameter", "CUSTOM" + (i+1) + "PARAM" , bindingTarget.param);
	}
}
</SCRIPT>

<SCRIPT id=F2956D8E-0997-4A5D-92C4-DE3321D0F3CD language=JScript defer 
shaperefcount="1">// global instruction text shape functions
function InitializeCustomBindingAlphas(bindingTargets, customAlphaList) {
	if (!bindingTargets){
		return;
	}
	
	for (var i = 0; i < Math.min(bindingTargets.length, customAlphaList.length); ++i) {
		var bindingTarget = bindingTargets[i];
		if (!bindingTarget.point || !bindingTarget.param || !bindingTarget.placeholder || (bindingTarget.decimals == null)) {
			window.external.application.logMessage("InstructionText: bindingTargets[" + i + "] is not valid");
			continue;
		}
		var spanParent = document.getElementById(bindingTarget.placeholder);
		if (!spanParent) {
			window.external.application.logMessage("InstructionText: spanParent with id:" + bindingTarget.placeholder + " not found");
			continue;
		}
		// move the alpha in the dom
		spanParent.appendChild(customAlphaList[i].numeric);
		spanParent.appendChild(customAlphaList[i].enumerate);
		customAlphaList[i].enumerate.firstUpdateReceived = false;
		customAlphaList[i].numeric.firstUpdateReceived = false;
		
		// format the alpha
		var decimalFormatter = "";
		switch (bindingTarget.decimals) {
		case 0:
		case 1:
		case 2:
		case 3:
		case 4:
			decimalFormatter = "%." + bindingTarget.decimals + "f";
			break;
		default:
			decimalFormatter = "%.2f";
			break;
		}
		customAlphaList[i].numeric.numericDisplayFormat = decimalFormatter;		
		customAlphaList[i].numeric.style.whiteSpace = "nowrap";
		customAlphaList[i].numeric.indicateBadState = false;
		
	}
	
	PositionCustomBindingAlphas(bindingTargets, customAlphaList);
}

// throttled alpha reposition function
var repositionThrottleTimer = null;
function PositionCustomBindingAlphas(bindingTargets, customAlphaList) {
	if (repositionThrottleTimer) {
		return;
	}
	// throttle to max 5 reposition of alpha per second
	repositionThrottleTimer = setTimeout(function() {
		PositionCustomBindingAlphasDelayed(bindingTargets, customAlphaList);
		repositionThrottleTimer = null;
	}, 200);
}

function PositionCustomBindingAlphasDelayed(bindingTargets, customAlphaList) {
	if (!bindingTargets){
		return;
	}
	for (var i = 0; i < Math.min(bindingTargets.length, customAlphaList.length); ++i) {
		var bindingTarget = bindingTargets[i];
		if (!bindingTarget.placeholder) {
			continue;
		}
		var spanParent = document.getElementById(bindingTarget.placeholder);
		if (!spanParent) {
			continue;
		}
		customAlphaList[i].numeric.style.width = spanParent.offsetWidth + "px";
		customAlphaList[i].numeric.style.height = (spanParent.offsetHeight - 1) + "px";
		customAlphaList[i].numeric.style.left = (spanParent.offsetLeft + 1) + "px";
		customAlphaList[i].numeric.style.top = (spanParent.offsetTop - 1) + "px";
		customAlphaList[i].enumerate.style.width = spanParent.offsetWidth + "px";
		customAlphaList[i].enumerate.style.height = (spanParent.offsetHeight - 1) + "px";
		customAlphaList[i].enumerate.style.left = (spanParent.offsetLeft + 1) + "px";
		customAlphaList[i].enumerate.style.top = (spanParent.offsetTop - 1) + "px";
		
	}
}
