<SCRIPT language=VBScript defer>sub CheckSecurityLevel
	if cint(txtMinSecurityLevel.value) <= cint(txtCurrentSecurityLevel.value) then
		rctInsufficientSecurity.style.visibility = "hidden"
	else
		rctInsufficientSecurity.style.pixeltop = 75
		rctInsufficientSecurity.style.pixelleft = 240
		rctInsufficientSecurity.style.pixelwidth = 690
		rctInsufficientSecurity.style.pixelheight = 450
		rctInsufficientSecurity.style.visibility = "visible"
	end if
end sub
sub CheckDay
	if chkTime1.value=1 and chkTime2.value=1 and _
	   chkTime3.value=1 and chkTime4.value=1 and _
	   chkTime5.value=1 and chkTime6.value=1 and _
	   chkTime7.value=1 and chkTime8.value=1 then
		chkSelectAll.value=1
	else
		chkSelectAll.value=0
	end if
end sub</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onpagecomplete>	call CheckSecurityLevel
	call CheckDay</SCRIPT>
<SCRIPT language=VBScript for=txtAppUserFlag defer event=onupdate>if cint(txtAppUserFlag.value) = 1 then
