<HTML>

<script language="JScript">

    // Public interface for EM Browser Prototype
    public_description = new CreateEmBrowser();
    function CreateEmBrowser() 
    {
        // methods
        this.SetStationObject = fnSetStationObject;
        this.SetServerName = fnSetServerName;
        this.GetServerName = fnGetServerName;
        this.ConnectServer = fnConnectServer;
        this.ReconnectServer = fnReconnectServer;
        this.DisconnectServer = fnDisconnectServer;
        this.GetServerStatus = fnGetServerStatus;
        this.GetTagName = fnGetTagName;
		this.GetTagName2 = fnGetTagName2;
        this.GetPointDescription = fnGetPointDescription;
        this.GetFullPointName = fnGetFullPointName;
        this.Refresh = fnRefresh;
        this.SetBackgroundColor = fnSetBackgroundColor;

        // Events raised via the container's onscriptletevent:
        // onready
        // onpointselect
        // onserverstatuschange
        this.event_onready = "";
        this.event_onpointselect = "";
        this.event_onserverstatuschange = "";

        // Raise event that EM browser is created
        // 
        if (window.external.frozen == false) {
            window.external.raiseEvent("event_onemcreated", "");
        }
    }

    function fnSetStationObject() {
        PBControlObject.SetExtStnDoc();
        mfnStationConnectServer();
    }

    function fnSetServerName(sServerName) {
        mfnSetServerName(sServerName);
    }

    function fnGetServerName() {
        return mfnGetServerName();
    }

    function fnConnectServer() {
        return mfnConnectServer();
    }

    function fnReconnectServer() {
        return mfnReconnectServer();
    }

    function fnDisconnectServer() {
        return mfnDisconnectServer();
    }

    function fnGetServerStatus() {
        return mfnGetServerStatus();
    }

    function fnGetTagName() {
        return mfnGetTagName();
    }
    function fnGetTagName2(){
	    return mfnGetTagName2();
	}
    function fnGetPointDescription() {
        return mfnGetPointDescription();
    }

    function fnGetFullPointName() {
        return mfnGetFullPointName();
    }

    function fnRefresh() {
        return mfnRefresh();
    }

    function fnSetBackgroundColor(sColor) {
        g_strBckgndColor = sColor;
        scrpltBody.style.backgroundColor = sColor;
        txtFullName.firstChild.style.backgroundColor = sColor;
        txtDescription.firstChild.style.backgroundColor = sColor;
    }

    function fnEvent_onpointselect() {
        if (window.external.frozen == false) {
            window.external.raiseEvent(EVENT_ONPOINTSELECT, "");
        }
    }

    function fnEvent_onserverstatuschange() {
        if (window.external.frozen == false) {
            window.external.raiseEvent(EVENT_ONSERVERSTATUSCHANGE, "");
        }
    }
</script>
