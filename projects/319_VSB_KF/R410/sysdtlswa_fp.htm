<SCRIPT language=VBScript defer>dim gbPageComplete, strCtlBlockName

strCtlBlockName = "switcha"

Sub ApplyLayout()
	on error resume next
	call ApplyLayout_NoStretch(strCtlBlockName)
End Sub

sub Butt_OnClick(oSource)
on error resume next
if ConAlpSelEqn.value=0 then 
   ScConAlpSelXInp.value=csng(right(oSource.id,1))
elseif ConAlpSelEqn.value=1 then
   document.getElementById("ScConAlpSelXfl" & right(oSource.id,1)).value=1
else
   document.getElementById("ScConAlpSelXfl" & right(oSource.id,1)).value=1-document.getElementById("ScConAlpSelXfl" & right(oSource.id,1)).value
end if
end sub

sub XFl_OnUpdate(oSource)
dim i, sfstl(2), iSel
sfstl(1)="normal"
sfstl(2)="bold"
i=right(oSource.id,1)

if document.getElementById("ScConAlpSelXfl" & i).value = "0" or document.getElementById("ScConAlpSelXfl" & i).value = "1" then
	 iSel=document.getElementById("ScConAlpSelXfl" & i).value
end if
     document.getElementById("ScShpX" & i).value=iSel+1
	 document.getElementById("ShpX" & i).value=iSel+1
	 document.getElementById("ConAlpXDesc" & i).style.fontweight=sfstl(iSel+1)
	 document.getElementById("TxtX" & i).style.fontweight=sfstl(iSel+1) 	
end sub

sub X_Onupdate(oSource)
on error resume next
if right(oSource.id,1)=cstr(ScConAlpSelXInp.value) then  TxtX.value=oSource.innertext
end sub



sub Shift_Row_Down(i)
	for j = i to 7
			Eval("ShpX" & CStr(j+1)).style.pixeltop         = (Eval("ShpX" & CStr(j+1)).style.pixeltop) + 15 
			Eval("ScShpX" & CStr(j+1)).style.pixeltop       = (Eval("ScShpX" & CStr(j+1)).style.pixeltop) + 15 
			Eval("TxtX" & CStr(j+1)).style.pixeltop         = (Eval("TxtX" & CStr(j+1)).style.pixeltop) + 15 
			Eval("ConAlpXDesc" & CStr(j+1)).style.pixeltop  = (Eval("ConAlpXDesc" & CStr(j+1)).style.pixeltop) + 15 
	next
end sub</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>on error resume next
If sd.DataChanged("CurrentPoint." & strCtlBlockName & ".REDTAG") Or sd.DataChanged("CurrentPoint." & strCtlBlockName & ".OPERTAG") Or sd.DataChanged("{%SECPNTNAME%}.{%SECBLOCKNAME%}.REDTAG") Then
	call SetTags(sd, picRedTag, picOperTag, picSecRedTag, strCtlBlockName)
	picOperTag.Title = sd.DataValue("CurrentPoint." & strCtlBlockName & ".OPERTAGDESC")
End If

If sd.DataChanged("CurrentPoint." & strCtlBlockName & ".OPERTAGDESC") Then
    picOperTag.Title = sd.DataValue("CurrentPoint." & strCtlBlockName & ".OPERTAGDESC")
End If

If Not sd.QualityBad("CurrentPoint." & strCtlBlockName & ".SECBLOCKID") Then
    If sd.DataChanged("CurrentPoint." & strCtlBlockName & ".SECBLOCKID") Then
		call GetSecData(sd, 0, strCtlBlockName)
    End If
End If

If sd.DataChanged("CurrentPoint." & strCtlBlockName & ".selval[1]") or sd.DataChanged("CurrentPoint." & strCtlBlockName & ".selval[2]") or sd.DataChanged("CurrentPoint." & strCtlBlockName & ".selval[3]") or sd.DataChanged("CurrentPoint." & strCtlBlockName & ".selval[4]") or sd.DataChanged("CurrentPoint." & strCtlBlockName & ".selval[5]") or sd.DataChanged("CurrentPoint." & strCtlBlockName & ".selval[6]") or sd.DataChanged("CurrentPoint." & strCtlBlockName & ".selval[7]") or sd.DataChanged("CurrentPoint." & strCtlBlockName & ".selval[8]") then	
	for k = 1 to 8
			Eval("ShpX" & CStr(k)).style.pixeltop  = 105 - (k-1)*15
			Eval("ScShpX" & CStr(k)).style.pixeltop  = 105 - (k-1)*15
			Eval("TxtX" & CStr(k)).style.pixeltop  = 105 - (k-1)*15
			Eval("ConAlpXDesc" & CStr(k)).style.pixeltop  = 105 - (k-1)*15
	next

	For i = 1 to 8
			If sd.DataValue ("CurrentPoint.SWITCHA.selval["&i&"]") = "OFF" then 	
				Eval("ShpX" & CStr(i)).style.visibility    = "hidden"
				Eval("ScShpX" & CStr(i)).style.visibility  = "hidden"
				Eval("TxtX" & CStr(i)).style.visibility    = "hidden"
				Eval("ConAlpXDesc" & CStr(i)).style.visibility  = "hidden"			
				call Shift_Row_Down(i)
								
			else
				Eval("ShpX" & CStr(i)).style.visibility    = "visible"
				Eval("ScShpX" & CStr(i)).style.visibility  = "visible"
				Eval("TxtX" & CStr(i)).style.visibility    = "visible"
				Eval("ConAlpXDesc" & CStr(i)).style.visibility  = "visible"						

			end if
	Next
end if

If sd.DataChanged("CurrentPoint." & strCtlBlockName & ".NORMMODE") Then
    call OffNormalModeState(sd, ConCboMode, TxtMode, strCtlBlockName, "NormMode")
End If

If sd.DataChanged("CurrentPoint." & strCtlBlockName & ".NORMMODEATTR") Then
    call OffNormalModeAttrState(sd, ConCboModeAttr, TxtModeAttr1, TxtModeAttr2, strCtlBlockName,"NORMMODEATTR")
End If
If sd.DataChanged("currentpoint.switcha.ctleqn") then
	if sd.DataValue("currentpoint.switcha.ctleqn") > 1 then
   		GrpB.style.visibility="visible" : GrpRB.style.visibility="hidden"
	else
   		GrpRB.style.visibility="visible" : GrpB.style.visibility="hidden"
	end if
end if</SCRIPT>
