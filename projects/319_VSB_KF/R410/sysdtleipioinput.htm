<SCRIPT language=VBScript for=PageNo defer event=onchange>On Error Resume Next
Dim iPageNo
If IsNumeric(me.value) Then
	iPageNo = CInt(me.value) - 1
	If iPageNo >=0 AND iPageNo <= NumOfScrolls Then
		CurrScrollBarPosition = iPageNo
		'Update the parameters
		Call ChangeParameters
	Else
		window.external.TemporaryMessageZoneText = Invalidpagenumber.value
		me.value = CInt (CurrScrollBarPosition + 1)
		me.CancelChange
	End If
Else
	window.external.TemporaryMessageZoneText = Invalidpagenumber.value
	me.value = CInt (CurrScrollBarPosition + 1)
	me.CancelChange
End If</SCRIPT>

<SCRIPT language=JScript for=alpNumAdjParams defer event=onupdate>if(!(alpNumAdjParams.isNaN))
{ 
  if((bPageLoadComplete) && (gNumAdjParams != alpNumAdjParams.value))
    {
	 gNumAdjParams = alpNumAdjParams.value
      ChangeParameters();
     }
     if(alpNumAdjParams.value > 0)
	   {
       if(alpNumAdjParams.value%NumOfRows == 0)
	   NumOfScrolls = Math.floor(alpNumAdjParams.value/NumOfRows)-1;
	   else
	   NumOfScrolls = Math.floor(alpNumAdjParams.value/NumOfRows);
	   NoOfPages.value= NumOfScrolls +1;
	   }
	 }</SCRIPT>

<SCRIPT language=VBScript defer>Dim CurrScrollBarPosition
Dim NumOfScrolls
Dim gNumAdjParams
Dim NumOfRows
NumOfRows = 20
CurrScrollBarPosition = 0
NumOfScrolls = 0
gNumAdjParams = -1
Dim bPageLoadComplete

Function ChangeParameters()
	Dim i
	For i= 0 to 19
		Dim iTemp
		iTemp = (CurrScrollBarPosition) * 20 + i
		
		If(iTemp > alpNumAdjParams.value) Then
			DisplayDataRepository.PutValue CStr("INPUTPARAM"&CStr(i)), "-"
		Else
			DisplayDataRepository.PutValue CStr("INPUTPARAM"&CStr(i)), CStr("INPUTPARAM(" & CStr(CInt(iTemp)) &")")
		End If
		Next
		For i= 0 to 19
	     iTemp = (CurrScrollBarPosition) * 20 + i
		 document.getElementById("alpNum" & CStr(i)	).value = cstr(iTemp)
		 next
		If NumOfScrolls = 0 Then
			pbFirstPage.disabled = True
			pbLastPage.disabled = True
			pbNextPage.disabled = True
			pbPrevPage.disabled = True
		ElseIf CurrScrollBarPosition > 0 AND CurrScrollBarPosition < NumOfScrolls Then
			pbFirstPage.disabled = False
			pbLastPage.disabled = False
			pbNextPage.disabled = False
			pbPrevPage.disabled = False
		ElseIf CurrScrollBarPosition = 0 Then
			pbFirstPage.disabled = True
			pbLastPage.disabled = False
			pbNextPage.disabled = False
			pbPrevPage.disabled = True
		ElseIf CurrScrollBarPosition = NumOfScrolls Then
			pbFirstPage.disabled = False
			pbLastPage.disabled = True
			pbNextPage.disabled = True
			pbPrevPage.disabled = False
		End If
		PageNo.value = CStr(CurrScrollBarPosition + 1)
End Function</SCRIPT>
