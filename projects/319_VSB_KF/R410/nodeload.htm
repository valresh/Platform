<SCRIPT language=VBScript event=onshapeload for=shape001 defer>dim tpscmd
set tpscmd = CreateObject("TPS.Commands")
dim stnum
dim Mynode 
dim PRSTS_TAG

MyNode = tpscmd.NodeNumber

if MyNode < 10 then
	PRSTS_TAG = "$PRSTS0" & Cstr(MyNode)
else
	PRSTS_TAG = "$PRSTS" & Cstr(MyNode)
end if

shape001_txt_node.value =  Cstr(MyNode)

me.setCustomProperty "Point", "NodeNumber", PRSTS_TAG
SetHeapStart = false
shape001_txt_console.value = cstr(tpscmd.consolenumber)
tpscmd.ReadDDB 1, 0, 2, stnum
shape001_Txt_station.value = Cstr(stnum)</SCRIPT>
