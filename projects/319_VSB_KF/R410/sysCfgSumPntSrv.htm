<SCRIPT language=VBScript defer>Sub UpdatePointServerDetails()
	dim i
	If (window.external.CurrentRecordOffset < 501) Then
		window.external.CurrentRecordOffset = 501
	ElseIf (window.external.CurrentRecordOffset > 981) Then
		window.external.CurrentRecordOffset = 981
	End If
	If (window.external.CurrentRecordOffset > 500) or (window.external.CurrentRecordOffset < 991) Then
		pnt = cstr(right(window.external.CurrentRecordOffset,1))
	End If
	document.getElementById("Num1").value = window.external.CurrentRecordOffset - 500
	for i = 2 to 20
	document.getElementById("Num" & i).value = window.external.CurrentRecordOffset - 500 + i - 1
	Next
End Sub</SCRIPT>
