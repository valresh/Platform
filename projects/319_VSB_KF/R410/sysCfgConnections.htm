	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
    install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
    redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub

<SCRIPT language=VBScript defer>Const UpdateDisplayTimerID = 1
dim Station
Dim UpdateFailed
dim cnt
Sub UpdateDisplay
    UpdateFailed = 0
	'on error resume next
    For i = 1 To 20
		document.getElementById("txtIPAddress" & i).value = ""
		DevName = trim(document.getElementById("alphachn" & i).value)
		If StrComp(left(DevName, 3), txtSTN.value, vbTextCompare) = 0 Then
			Station = cstr(right(DevName, 3))
			If Station <= 100 Then
	               	If document.getElementById("Grp4Alpha" & Station).value = 3  Then						
		   				document.getElementById("txtIPAddress" & i).innertext = IPString(document.getElementById("alphaIP1" & i).value, document.getElementById("alphaIP2" & i).value)
					Else
                	   	document.getElementById("txtIPAddress" & i).innerText = strNoConnection.innerText
					End If
            End IF
		End If
	 Next
End Sub
Function IPString(IP1, IP2)
    If IP1 < 0 Then IP1 = IP1 + 65536
    If IP2 < 0 Then IP2 = IP2 + 65536
    IPString = IP1 Mod 256
    IP1 =  fix(IP1 / 256)
    IPString = IPString & txtDot.value & (IP1 Mod 256)
    IPString = IPString & txtDot.value & (IP2 Mod 256)
    IP2 =  fix(IP2 / 256)
    IPString = IPString & txtDot.value & (IP2 Mod 256)
End Function</SCRIPT>
