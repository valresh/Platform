<SCRIPT language=VBScript for=sd defer event=ondatachange>if not sd.QualityBad("Currentpoint.NUMCHANNELS") then
	For i = 0 to sd.DataValue("Currentpoint.NUMCHANNELS")-1 
		document.getElementById("Channel"&i).Style.Visibility = "Inherit"
	Next
End if

if not sd.QualityBad("CurrentPoint.IOPTYPE") then
	if sd.DataValue("CurrentPoint.IOPTYPE") = 6 then 'Module type is 1738_IB8M
		pbChannelStatus.style.visibility = "Hidden"
		shpTabs.Objects("bitmap003").style.visibility = "Hidden"
		pbAlarms.style.pixelleft = pbChannelStatus.style.pixelleft
		pbConfigDetails.style.pixelleft = pbAlarms.style.pixelleft
	end if

	if sd.DataValue("CurrentPoint.NUMALARMS") <= 0 then
		shpTabs.Objects("bitmap004").style.visibility = "Hidden"
		pbAlarms.style.visibility = "Hidden"
		pbConfigDetails.style.pixelleft = pbAlarms.style.pixelleft
	end if
end if

if not sd.QualityBad("CurrentPoint.IOPTYPE") then
	if sd.DataValue("CurrentPoint.IOPTYPE") = 16 then 'module is 1732E_IB16M type
		For i = 0 to 15
			document.getElementById("chkOpenwireDetection"&i).Style.Visibility = "Hidden"
			document.getElementById("alpFilterOff"&i).Style.Visibility = "Hidden"
			document.getElementById("alpFilterOn"&i).Style.Visibility = "Hidden"
		Next
		txtFilterOn.style.visibility = "Hidden"
		txtFilterOff.style.visibility = "Hidden"
	end if
	if sd.DataValue("CurrentPoint.IOPTYPE") = 5 then 'module is 1738_IB4DM type
		For i = 0 to 15
			document.getElementById("chkOpenwireDetection0"&i).Style.Visibility = "Hidden"
			document.getElementById("alpFilterOff0"&i).Style.Visibility = "Hidden"
			document.getElementById("alpFilterOn0"&i).Style.Visibility = "Hidden"
		Next
		txtFilterOn001.style.visibility = "Hidden"
		txtFilterOff001.style.visibility = "Hidden"
	end if
	if sd.DataValue("CurrentPoint.IOPTYPE") = 6 then 'module is 1738_IB8M type
		For i = 0 to 15
			document.getElementById("chkOpenwireDetection"&i).Style.Visibility = "Hidden"
			document.getElementById("chkOpenwireDetection0"&i).Style.Visibility = "Hidden"
			document.getElementById("alpFilterOff0"&i).Style.Visibility = "Hidden"
			document.getElementById("alpFilterOn0"&i).Style.Visibility = "Hidden"
		Next
		txtFilterOn001.style.visibility = "Hidden"
		txtFilterOff001.style.visibility = "Hidden"
		txtOWDENBL.style.visibility = "Hidden"
	end if
end if</SCRIPT>
