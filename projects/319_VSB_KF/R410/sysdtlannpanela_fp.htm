<SCRIPT language=VBScript defer>correctWidth = 0
SKIP = -1

Sub ApplyLayout()           
                Call AdjustHeight()
                Call AdjustWidth()
End Sub

Sub AdjustHeight()
                
                GrpLowerPanel.style.top = "" 
                GrpLowerPanel.style.bottom = "2px"
                GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 
                GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
              	 
End Sub

Sub AdjustWidth()
                Call CalculateCorrectWidth()       
                if (correctWidth <> SKIP) then                   
                    GrpUpperPanel.style.pixelwidth = correctWidth 
                    GrpCenterPanel.style.pixelwidth = correctWidth
                    GrpLowerPanel.style.pixelwidth = correctWidth 
												
                end if
End Sub

Sub CalculateCorrectWidth()
                POPUP = 0
                displayType = window.external.Application.CurrentDisplayPageType 
				CurrentPage = window.external.CurrentPage
					if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
                	
                                correctWidth = SKIP
                                Exit Sub
               		else   

               		if (page.style.zoom > 1) then   
                 		shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))                               
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                                                                                                 
                    else                                        
                         shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                         correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                

                    end if

                end if    

End Sub</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onpagecomplete>on error resume next
document.title= alphaTagName.value

intMaxInput = 32 : intMinInput = 0
if not sd.QualityBad("currentpoint.ANNPANELA.NUMANNWIN") Then
   IntCheck = vartype(sd.DataValue("currentpoint.ANNPANELA.NUMANNWIN"))
	If(IntCheck <> 4) then
	If((sd.DataValue("currentpoint.ANNPANELA.NUMANNWIN")) >= intMinInput) then
	if((sd.DataValue("currentpoint.ANNPANELA.NUMANNWIN"))<=intMaxInput) then
	  	for i = sd.DataValue("currentpoint.ANNPANELA.NUMANNWIN")+1 to intMaxInput
      		document.getElementById("ConShapLED"&i).style.visibility = "Hidden" 
      		document.getElementById("ConTxtAlarmLabel"&i).style.visibility = "Hidden" 
		next
	 
		if(sd.DataValue("currentpoint.ANNPANELA.LAMPTEST") = 1) then
		   	for j = 1 to sd.DataValue("currentpoint.ANNPANELA.NUMANNWIN")
	       		document.getElementById("ConShapLtest"&j).style.visibility = "Visible"
			next
		else
			for j = 1 to sd.DataValue("currentpoint.ANNPANELA.NUMANNWIN")
				document.getElementById("ConShapLtest"&j).style.visibility = "Hidden"
			next
		end if 
	end if
    
	else
		for i = 1 to intMaxInput
			document.getElementById("ConShapLED"&i).style.visibility = "Hidden" 
			document.getElementById("ConTxtAlarmLabel"&i).style.visibility = "Hidden" 
		next
	end if
	  
	else
   	  	for i = 1 to intMaxInput
		    document.getElementById("ConShapLED"&i).style.visibility = "Hidden" 
		    document.getElementById("ConTxtAlarmLabel"&i).style.visibility = "Hidden" 
		next
  
   	end if
	else
	    for i = 1 to intMaxInput
		    document.getElementById("ConShapLED"&i).style.visibility = "Hidden" 
		    document.getElementById("ConTxtAlarmLabel"&i).style.visibility = "Hidden" 
		next
end if</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>if not sd.QualityBad("currentpoint.ANNPANELA.LAMPTEST") then
	if(sd.DataValue("currentpoint.ANNPANELA.LAMPTEST") = 1) then
		for j = 1 to sd.DataValue("currentpoint.ANNPANELA.NUMANNWIN")
			document.getElementById("ConShapLtest"&j).style.visibility = "Visible"
		next
	else
	    for j = 1 to sd.DataValue("currentpoint.ANNPANELA.NUMANNWIN")
	    	document.getElementById("ConShapLtest"&j).style.visibility = "Hidden"
		next
	end if
end if


if sd.DataChanged("currentpoint.SIMSTATE") then
    if sd.DataValue("currentpoint.SIMSTATE") = 2 then
		'SIMSTATE is SIMFREEZE
	    txtSIM.style.visibility = "Hidden" : EnumSimulationState.style.visibility = "visible"
	elseif sd.DataValue("currentpoint.SIMSTATE") = 1 then
		'SIMSTATE is SIMRUN
		txtSIM.style.visibility = "visible" : EnumSimulationState.style.visibility = "Hidden"
	else
		txtSIM.style.visibility = "hidden" : EnumSimulationState.style.visibility = "Hidden" 
	end if
end if</SCRIPT>
