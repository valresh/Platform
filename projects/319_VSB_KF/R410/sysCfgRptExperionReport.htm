<SCRIPT language=VBScript for=Page defer event=onpagecomplete>On Error Resume Next
ClusterServerName = window.external.status.ClusterServerName
ReportDefinitionPath = "\\" & ClusterServerName & "\ReportDefinition\"
Set objFSO = window.external.CreateWhitelistedObject("Scripting.FileSystemObject" , 1)
Set objFolder = objFSO.GetFolder(ReportDefinitionPath)
Set colFiles = objFolder.Files
For Each objFile in colFiles
	If objFSO.GetExtensionName(objFile) = "htm" Then
    	cboFileName.AddString split(objFile.Name, ".htm")(0)
	end if
Next</SCRIPT>
<SCRIPT language=VBScript for=alpFileName defer event=onupdate>On Error Resume Next
if instr(me.value, ".htm") > 0 then
	cboFileName.value = split(me.value, ".htm")(0)
else
	cboFileName.value = ""
end if</SCRIPT>
</HEAD>
<SCRIPT language=VBScript defer>Dim ReportDefinitionPath</SCRIPT>
<SCRIPT language=VBScript for=cboFileName defer event=onchange>On Error Resume Next
if instr(alpFileName.value, ".htm") > 0 then
	prev = split(alpFileName.value, ".htm")(0)
else
	prev = ""
end if
CurrFile = me.value
Set objFSO = window.external.CreateWhitelistedObject("Scripting.FileSystemObject" , 1)
if objFSO.FolderExists(ReportDefinitionPath & CurrFile & "_files") then
	if objFSO.FileExists(ReportDefinitionPath & CurrFile & "_files\ReportBinding.xml") then
		alpFileName.value = me.value & ".htm"
	else
		window.external.showCallout me, "There is no report with this name", 2, 0
		me.value = prev
	end if
else
	window.external.showCallout me, "There is no report with this name", 2, 0
	me.value = prev
end if</SCRIPT>
