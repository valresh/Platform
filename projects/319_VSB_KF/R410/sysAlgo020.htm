<SCRIPT language=VBScript defer>Dim CurrentFieldOffset 
CurrentFieldOffset = 1
Function DecToBin(intDec)
  dim strResult
  dim intValue
  dim intExp
  strResult = ""
  intValue = intDEC
  intExp = 4294967296
  while intExp >= 1
    if intValue >= intExp then
      intValue = intValue - intExp
      strResult = strResult & "1"
    else
      strResult = strResult & "0"
    end if
    intExp = intExp / 2
  wend
  DecToBin = strResult
End Function
Function SeterrorStatus(StrInputStatusinBin)
On Error Resume Next
	dim ErrorStr
	'Assigning error string first to null
	ErrorStr = ""
	'Check whether 1st bit is ON
		FirstBit1 = Right(StrInputStatusinBin,2)
		FirstBit = Left(FirstBit1,1)
			if(FirstBit=1) then
				ErrorStr = ErrorStr&txtinerror.innerText
			end if
	'Check whether 4th bit in ON
		FourthBit1 = Right(StrInputStatusinBin,5)
		FourthBit = Left(FourthBit1,1)
			if(FourthBit=1) then
				if ErrorStr = "" then
					ErrorStr = ErrorStr&txtmanualPV.innerText
				else
					ErrorStr = ErrorStr&", "&txtmanualPV.innerText
				end if
			end if
'	check whether zeroth bit is ON
		ZeroBit = Right(StrInputStatusinBin,1)
			if(ZeroBit=1) then
			if ErrorStr = "" then
				ErrorStr = ErrorStr&txtoffscan.innerText
			else
				ErrorStr = ErrorStr&", "&txtoffscan.innerText
			end if
			end if
	'Check whether 2nd bit in ON
		SecondBit1 = Right(StrInputStatusinBin,3)
		SecondBit = Left(SecondBit1,1)
			if(SecondBit=1) then
			if ErrorStr = "" then
				ErrorStr = ErrorStr&txtunreasonable.innerText
			else
				ErrorStr = ErrorStr&", "&txtunreasonable.innerText
			end if
			end if
	'Check whether 9th bit is ON
		NinthBit1 = Right(StrInputStatusinBin,9)
		NinthBit = Left(NinthBit1,1)
			if(NinthBit=1) then
			if ErrorStr = "" then
				ErrorStr = ErrorStr&txtstale.innerText
			else
				ErrorStr = ErrorStr&", "&txtstale.innerText
			end if
			end if
 SeterrorStatus = ErrorStr
 End function</SCRIPT>
