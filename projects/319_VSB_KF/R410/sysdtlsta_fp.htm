<SCRIPT language=VBScript defer>dim bPageComplete
bPageComplete = false
Sub SetPageCompleteTrue()
	bPageComplete = true
end sub
sub ApplyLayout()
	On error resume next
	GrpLowerPanel.style.top = "" 
	GrpLowerPanel.style.bottom = "0px" 
	GrpCenterPanel.style.top= "" 
	GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight - 2) & "px"
end sub
sub AlmarmState(oSymbol)
if bPageComplete = false then
	exit sub
end if
dim iNum,iPriority,iEnabled
On error resume next
iNum=right(oSymbol.id,1)
iPriority=cint(document.getelementbyid("ConAlpAlPri"&iNum).value)
iEnabled=cint(document.getelementbyid("ConAlpAlArm"&iNum).value)
If iPriority>0 and  iEnabled>0 then
  oSymbol.linecolor=vbBlack
  select case iPriority
    case 1 oSymbol.linecolor=AlarmStateIconFactory.lowcolor
    case 2 oSymbol.linecolor=AlarmStateIconFactory.highcolor
    case 3 oSymbol.linecolor=AlarmStateIconFactory.urgentcolor
  end select
  oSymbol.title="State " & iNum & ": State Alarm"
else
  oSymbol.linecolor="transparent"
  oSymbol.title=""
end if
end sub
sub AlmarmState1
if bPageComplete = false then
	exit sub
end if
dim iNum,iPriority,iEnabled
On error resume next
for i = 0 to 8
iPriority=cint(document.getelementbyid("ConAlpAlPri"&i).value)
iEnabled=cint(document.getelementbyid("ConAlpAlArm"&i).value)
If iPriority>0 and  iEnabled>0 then
  oSymbol.linecolor=vbBlack
  select case iPriority
    case 1 document.getelementbyid("LinAlm"&i).linecolor=AlarmStateIconFactory.lowcolor
    case 2 document.getelementbyid("LinAlm"&i).linecolor=AlarmStateIconFactory.highcolor
    case 3 document.getelementbyid("LinAlm"&i).linecolor=AlarmStateIconFactory.urgentcolor
  end select
  document.getelementbyid("LinAlm"&i).title="State " & i & ": State Alarm"
else
  document.getelementbyid("LinAlm"&i).linecolor="transparent"
  document.getelementbyid("LinAlm"&i).title=""
end if
next
end sub
Sub OffNormalModeState()
 On Error Resume Next
    Dim strMode, strNormMode
    strMode = ConCboMode.value
    strNormMode = rect001.DataValue("CurrentPoint.NORMALMODE")
	If strcomp(lcase(strNormMode), "none") <> 0 and  StrComp(strMode, strNormMode) <> 0 Then	
        TxtMode.styleclass = "Txt_Label_Off_Normal"	
		TxtMode.title = "Mode is off-normal (Normal mode is " & strNormMode & ")"	
    Else		
        TxtMode.styleclass = "Txt_Label_Normal"
		TxtMode.title = Vbnullstring
    End If
End Sub</SCRIPT>
