<SCRIPT language=VBScript for=Page defer event=onexecutecommand>	dim strCommand
	strCommand = window.event.getAttribute("onExecuteCommand", 0)
	if not (strCommand="Raise" or strCommand="OKB RAISE" or strCommand="Lower" or strCommand="OKB LOWER") then
		exit sub
	end if

	if Page.hasFocus or sElementRaiseLower <> "" or UCase(window.document.activeElement.id) = "COMBOBOXCMD" then

'raise/lower keys require operator confirmation - supported for comboboxcmd
		if strCommand="Raise" or strCommand="OKB RAISE" then

			window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise " 
			if sElementRaiseLower = "STRTSTOP" or UCase(window.document.activeElement.id) = "COMBOBOXCMD" then	
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "STRTSTOP"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = "STOP"  ' just always start from the 'middle'
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseSTRTSTOP(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				GrpCMD.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			end if
		elseif strCommand="Lower" or strCommand="OKB LOWER" then

			if sElementRaiseLower = "STRTSTOP" or UCase(window.document.activeElement.id) = "COMBOBOXCMD" then
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "STRTSTOP"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = "STOP"  ' just always start from the 'middle'
				end if
				sCurrentShownRaiseLowerValue = GetNextLowerSTRTSTOP(sCurrentShownRaiseLowerValue)
				GrpCMD.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			end if
		end if
	end if</SCRIPT>

	if sd.QualityGood("CurrentPoint.HENABLE") and sd.DataValue("CurrentPoint.HENABLE") = 1 then

Function RaiseLowerConfirm2()

	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID) 'clear old/other timers
  	intRaiseLowerTimerID = window.setInterval ("CheckRaiseLowerResponse2()", 500)

End Function

Function OnDeactivateCancelRamp

	window.clearInterval(intCancelRampOnPageDeactivateID)
	call CancelRaiseLowerConfirmation

end function

sub CheckRaiseLowerResponse2

	dim sResponse
	dim iStatus
	dim ptPromptType 
	dim sMsgZoneText
	ptPromptType = 1

	nConfirmCount = nConfirmCount + 1

	sMsgZoneText = window.external.parentdocument.parentwindow.external.MessageZoneText 

	sConfirmRaiseLowerMsg = "Change state of TPS:" & alphaTagName.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	iStatus = window.external.parentdocument.parentwindow.external.GetResponse3 (sConfirmRaiseLowerMsg, ptPromptType, sResponse)
'	window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: status returned= " & iStatus

	if iStatus = 0 and nConfirmCount > 1 then

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: - action cancelled by user" 
		call CancelRaiseLowerConfirmation
		exit sub
	elseif iStatus = 1 then
		if sResponse = "" then
			'no response yet... let timer fire again shortly
		else
			'recieved response, process it and we're DONE
			if UCase(sResponse) = "Y" then

				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: setting: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				if sElementRaiseLower = "STRTSTOP" then
					sd.SetDataValueSynchronous "CurrentPoint.COMMAND", sCurrentShownRaiseLowerValue	
					comboboxcmd.innerText = sd.DataValue("CurrentPoint.STATE")   'Make CMD track the displayed State value
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.STATE"), 1
					end if
					comboboxcmd.focus
				end if

			end if

			call CancelRaiseLowerConfirmation

		end if
	end if

	if nConfirmCount > 2 and (sMsgZoneText = "" or (sConfirmRaiseLowerMsg <> sMsgZoneText)) then		
		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: message text changed operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if

	'expire after Experion's "operator timeout" - e.g. 60 seconds (x2 as timer is .5 secs)
	if nConfirmCount > oper_timeout.value * 2 then 

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: nConfirmCount > Experion operator timeout: " & oper_timeout.value & "; operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if

end sub


Function GetNextRaiseSTRTSTOP(sThisValue)

	if sThisValue = "START" or sThisValue = "STOP" then 'for START OR STOP, next "up" is START
		GetNextRaiseSTRTSTOP = "START"
	elseif sThisValue = "RESET" then
		GetNextRaiseSTRTSTOP = "STOP"
	else 
		GetNextRaiseSTRTSTOP = sThisValue
	end if

end function

Function GetNextLowerSTRTSTOP(sThisValue)

	if sThisValue = "RESET" or sThisValue = "STOP" then 'for RESET OR STOP, next "down" is RESET
		GetNextLowerSTRTSTOP = "RESET"
	elseif sThisValue = "START" then
		GetNextLowerSTRTSTOP = "STOP"
	else 
		GetNextLowerSTRTSTOP = sThisValue
	end if

end function

sub ApplyLayout()
'	This routine enables the 'smart sizing' of faceplates
'	Comment the very last line to disable stretching of the center panel

	on error resume next
	'*******************************************************************************************************************
	' this code section enables faceplates to stretch taller, 
	' if the provided (SafeView) window has a height/width aspect ratio of 2.5 or greater
    
	dim oSview
    	dim nFpRatio, nSVWindowRatio, nNewRatio

	set oSview=getobject("","Honeywell.Workspace.Client")
    	If oSview.IsManagerActive = true then
        	nFpRatio= (Page.style.pixelHeight / Page.style.pixelWidth)
        	nSVWindowRatio= round((Page.parentElement.clientHeight / Page.parentElement.clientWidth),1)   'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        	nNewRatio = round(nSVWindowRatio / nFpRatio,1)                                                'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        	if window.external.AppWindow.width <= 500 and nSVWindowRatio >= 2.5 then                      '500px is max facplate width supported
            		Page.style.pixelHeight = clng((Page.style.pixelHeight * nNewRatio))
        	end if
    	end if
	' 
	'*******************************************************************************************************************
	GrpLowerPanel.style.top = ""
	GrpLowerPanel.style.bottom = "2px"

	GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2
	GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	GrpCenterPanel.style.pixelHeight = Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10

	grpPanelBackground.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2
	grpPanelBackground.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	grpPanelBackground.style.pixelHeight = Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10

	if GrpCenterPanel.style.pixelheight > 283 then
		shaOUTIND.style.pixeltop = shaOUTIND.style.pixeltop + 3
		shaOUTIND.style.pixelheight = ConIndPV.style.pixelheight + 17
		grpEU.style.pixeltop = 45
	end if

	call UpdateCenterPanelLayout

end sub

Sub ANALGINUpdateRanges

    Dim nTemp

'   PV HI Range (PVDSPHI else PVEUHI else 100)
    If sd.QualityGood("CurrentPoint.PVDSPHI") And Not sd.IsNan("CurrentPoint.PVDSPHI") Then
        'window.external.parentdocument.parentwindow.external.logmessage "ANALGINUpdateRanges - ConIndPV/PVTV.rangeHi=PVDSPHI=" & sd.DataValue("CurrentPoint.PVDSPHI")
        ConIndSP.RangeHi = sd.DataValue("CurrentPoint.PVDSPHI")
        ConIndPV.RangeHi = sd.DataValue("CurrentPoint.PVDSPHI")
        ConAlpPVEUHi.Value = FormatNumber(ConIndPV.RangeHi, formatPV)
        'window.external.parentdocument.parentwindow.external.logmessage "PV/PVTV rangeHi per PVDSPHI:" & sd.DataValue("CurrentPoint.PVDSPHI")
    ElseIf sd.QualityGood("CurrentPoint.PVEUHI") And Not sd.IsNan("CurrentPoint.PVEUHI") Then
        'window.external.parentdocument.parentwindow.external.logmessage "ANALGINUpdateRanges - ConIndPV/PVTV.rangeHi=PVEUHI=" & sd.DataValue("CurrentPoint.PVEUHI")
        ConIndSP.RangeHi = sd.DataValue("CurrentPoint.PVEUHI")
        ConIndPV.RangeHi = sd.DataValue("CurrentPoint.PVEUHI")
        'window.external.parentdocument.parentwindow.external.logmessage "PV/PVTV rangeHi per PVEUHI:" & sd.DataValue("CurrentPoint.PVEUHI")
        ConAlpPVEUHi.Value = FormatNumber(ConIndPV.RangeHi, formatPV)
    Else
        'window.external.parentdocument.parentwindow.external.logmessage "ANALGINUpdateRanges - ConIndPV/PVTV.rangeHi=100"
        ConIndSP.RangeHi = 100
        ConIndPV.RangeHi = 100
        ConAlpPVEUHi.Value = "100%"
    End If

'   PV LO Range (PVDSPLO else PVEULO else 0)
    If sd.QualityGood("CurrentPoint.PVDSPLO") And Not sd.IsNan("CurrentPoint.PVDSPLO") Then
        'window.external.parentdocument.parentwindow.external.logmessage "ANALGINUpdateRanges - ConIndPV/PVTV.rangeLo=PVDSPLO=" & sd.DataValue("CurrentPoint.PVDSPLO")
        ConIndSP.RangeLo = sd.DataValue("CurrentPoint.PVDSPLO")
        ConIndPV.RangeLo = sd.DataValue("CurrentPoint.PVDSPLO")
        ConAlpPVEULo.Value = FormatNumber(ConIndPV.RangeLo, formatPV)
        'window.external.parentdocument.parentwindow.external.logmessage "PV/PVTV rangeLo per PVDSPLO:" & sd.DataValue("CurrentPoint.PVDSPLO")
    ElseIf sd.QualityGood("CurrentPoint.PVEULO") And Not sd.IsNan("CurrentPoint.PVEULO") Then
        'window.external.parentdocument.parentwindow.external.logmessage "ANALGINUpdateRanges - ConIndPV/PVTV.rangeLo=PVEULO=" & sd.DataValue("CurrentPoint.PVEULO")
        ConIndSP.RangeLo = sd.DataValue("CurrentPoint.PVEULO")
        ConIndPV.RangeLo = sd.DataValue("CurrentPoint.PVEULO")
        ConAlpPVEULo.Value = FormatNumber(ConIndPV.RangeLo, formatPV)
        'window.external.parentdocument.parentwindow.external.logmessage "PV/PVTV rangeLo per PVEULO:" & sd.DataValue("CurrentPoint.PVEULO")
    Else
        'window.external.parentdocument.parentwindow.external.logmessage "ANALGINUpdateRanges - ConIndPV/PVTV.rangeLo=0"
        ConIndSP.RangeLo = 0
        ConIndPV.RangeLo = 0
        ConAlpPVEULo.Value = "0%"
    End If

' Special case: if rangeLo is > rangeHi, invert them can call them 0%-100%
    If ConIndPV.RangeHi < ConIndPV.RangeLo Then
        'window.external.parentdocument.parentwindow.external.logmessage "ANALGINUpdateRanges - Inverting rangeHi/rangeLo!"
        nTemp = ConIndPV.RangeHi
        
        ConIndPV.RangeHi = ConIndPV.RangeLo
        ConIndSP.RangeHi = ConIndPV.RangeLo
        ConIndPV.RangeLo = nTemp
        ConIndSP.RangeLo = nTemp
        ConAlpPVEULo.Value = "0%"
        ConAlpPVEU1.Value = " 25%"
        ConAlpPVEU2.Value = " 50%"
        ConAlpPVEU3.Value = " 75%"
        ConAlpPVEUHi.Value = "100%"
    ElseIf True = bServerBitsFlagTicMarkValues And ConAlpPVEUHi.Value = "100%" Then
        ConAlpPVEULo.Value = "  0%"
        ConAlpPVEU1.Value = " 25%"
        ConAlpPVEU2.Value = " 50%"
        ConAlpPVEU3.Value = " 75%"
    ElseIf True = bServerBitsFlagTicMarkValues Then   ' If not ranges inverted and Serverwide setting for intermiate tickmark values, calculate them
        ConAlpPVEU2.Value = ConIndPV.RangeLo + (ConIndPV.RangeHi - ConIndPV.RangeLo) / 2
        ConAlpPVEU2.Value = FormatNumber(ConAlpPVEU2.Value, formatPV)
		ConAlpPVEU3.Value = ConAlpPVEU2.Value + (ConIndPV.RangeHi - ConAlpPVEU2.Value) / 2
        ConAlpPVEU3.Value = FormatNumber(ConAlpPVEU3.Value, formatPV)
        ConAlpPVEU1.Value = ConIndPV.RangeLo + (ConAlpPVEU2.Value - ConIndPV.RangeLo) / 2
        ConAlpPVEU1.Value = FormatNumber(ConAlpPVEU1.Value, formatPV)
        'window.external.parentdocument.parentwindow.external.logmessage "ANALGINUpdateRanges: intermediate tick marks: " & ConAlpPVEU3.Value & ", " & ConAlpPVEU2.Value & ", " & ConAlpPVEU1.Value
    End If

''    ConIndSP.FillColor = ConIndSP.FillColor 'force view update
''    ConIndPV.FillColor = ConIndPV.FillColor 'force view update

    'window.external.parentdocument.parentwindow.external.logmessage "ANALGINUpdateRanges - ConIndSP value: " & ConIndSP.Value & " Hi:" & ConIndSP.RangeHi & " Lo:" & ConIndSP.RangeLo
    'window.external.parentdocument.parentwindow.external.logmessage "ANALGINUpdateRanges - BOTTOM, PVindicator lo=" & ConIndPV.RangeLo & " hi= " & ConIndPV.RangeHi

End Sub

Sub CommonIntermediateTicMarkValues

'on error resume next 'to allow time for ConAlpEUTickMarksServerBits.value to be set

	'window.external.parentdocument.parentwindow.external.logmessage "CommonIntermediateTicMarkValues, ConAlpPVEULo visibility= " & ConAlpPVEULo.Style.visibility
    If  ("0" = ConAlpEUTickMarksServerBits.Value) or UCase(ConAlpPVEULo.Style.visibility) = "HIDDEN" then
       'window.external.parentdocument.parentwindow.external.logmessage  "Intermediate tickmark values OFF"
        ConAlpPVEU1.Style.visibility = "Hidden"
        ConAlpPVEU2.Style.visibility = "Hidden"
        ConAlpPVEU3.Style.visibility = "Hidden"
        ConAlpEUDesc.Style.pixelWidth = 80
		ConAlpEUDesc.Style.pixelHeight = 20 'was 15
        bServerBitsFlagTicMarkValues = False
    Else
       'window.external.parentdocument.parentwindow.external.logmessage  "Intermediate tickmark values ON"
        ConAlpPVEU1.Style.visibility = "Inherit"
        ConAlpPVEU2.Style.visibility = "Inherit"
        ConAlpPVEU3.Style.visibility = "Inherit"
        ConAlpEUDesc.Style.pixelWidth = 45 'uses two lines if necessary, wrapping even if ugly
		ConAlpEUDesc.Style.pixelHeight = 44 'was 30
' 		if the tick mark value is just too big to fit, then blank it out
'        If Len(ConAlpPVEU2.Value) > 5 Then 'compensate for big/small numbers
'			if Len(ConAlpEUDesc.Value) > 2 then 'but only if not a tiny EUDESC
		If (Len(ConAlpPVEU2.Value) + Len(ConAlpEUDesc.Value)) > 10 then
	        	ConAlpEUDesc.Style.pixelWidth = 80 'full length again
	        	ConAlpPVEU2.Style.visibility = "Hidden" ' just hide the middle tick value altogether			
				ConAlpEUDesc.Style.pixelHeight = 20 '15
'			end if
		end if
        bServerBitsFlagTicMarkValues = True
    End If
End Sub

sub SetPVFormat
    
    'window.external.parentdocument.parentwindow.external.logmessage  "PV Format= " & sd.DataValue("CurrentPoint.PVFORMAT")
    If sd.QualityGood("CurrentPoint.PVFORMAT") Then
    
        Select Case sd.DataValue("CurrentPoint.PVFORMAT")
        Case "D0"
            formatPV = 0
        Case "D1"
            formatPV = 1
        Case "D2"
            formatPV = 2
        Case "D3"
            formatPV = 3
        Case "D4"
            formatPV = 4
        Case "D5"
            formatPV = 5
        Case "D6"
            formatPV = 6
        Case Else
            formatPV = -1  ' use default - i.e. computer's regional setting
        End Select
    End If   'defaulted to -1
    
End Sub

Sub SetSPFormat

    'window.external.parentdocument.parentwindow.external.logmessage  "SP Format= " & sd.DataValue("CurrentPoint.SPFORMAT")
    If sd.QualityGood("CurrentPoint.SPFORMAT") Then
    
        Select Case sd.DataValue("CurrentPoint.SPFORMAT")
        Case "D0"
            formatSP = 0
        Case "D1"
            formatSP = 1
        Case "D2"
            formatSP = 2
        Case "D3"
            formatSP = 3
        Case "D4"
            formatSP = 4
        Case "D5"
            formatSP = 5
        Case "D6"
            formatSP = 6
        Case Else
            formatSP = -1  ' use default - i.e. computer's regional setting
        End Select
    Else
        formatSP = formatPV 'drop back to formatPV in case PVFORMAT is OK
    End If
        
End Sub

'set alarm zone
Sub CommonAlarm

    Dim state_PNTSTATE
    ' point state indicator
    If sd.QualityGood("CurrentPoint.PNTSTATE") And UCase(sd.DataValue("CurrentPoint.PNTSTATE")) <> "OK" Then
        state_PNTSTATE = Left(sd.DataValue("CurrentPoint.PNTSTATE"), 1)
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - PNTSTATE=" & state_PNTSTATE
    Else
        state_PNTSTATE = ""
    End If
    
    '   Replace HIGHAL with ALENBST if inhibited
    If UCase(sd.DataValue("CurrentPoint.ALENBST")) <> "INHIBIT" Then
        If UCase(sd.DataValue("CurrentPoint.HIGHAL")) = "NOALARM" Or Not sd.QualityGood("CurrentPoint.HIGHAL") Then
            If state_PNTSTATE <> "" Then
                state_alarmState.Value = state_PNTSTATE
                If bToolTips = True Then
                    state_alarmState.Title = "PNTSTATE= " & sd.DataValue("CurrentPoint.PNTSTATE")
                End If
                state_alarmState.Style.visibility = "Visible"
            Else
                state_alarmState.Style.visibility = "Hidden"
            End If  ' state_PNTSTATE
           'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - NOALARM (or not config)"
        Else
           'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - in alarm: " & sd.DataValue("CurrentPoint.HIGHAL")
            state_alarmState.Style.visibility = "Visible"
            state_alarmState.Value = sd.DataValue("CurrentPoint.HIGHAL")
            If state_PNTSTATE <> "" Then
                state_alarmState.Value = state_alarmState.Value & " " & state_PNTSTATE
                If bToolTips = True Then
                    state_alarmState.Title = "HIGHAL= " & sd.DataValue("CurrentPoint.HIGHAL") & ", PNTSTATE= " & sd.DataValue("CurrentPoint.PNTSTATE")
                End If
            Else
                If bToolTips = True Then
                    state_alarmState.Title = "HIGHAL= " & sd.DataValue("CurrentPoint.HIGHAL")
                End If
            End If  ' state_PNTSTATE
        End If  ' state_HIGHAL
    Else
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - INHIBIT"
        state_alarmState.Style.visibility = "Visible"
        state_alarmState.Value = sd.DataValue("CurrentPoint.ALENBST")
        If state_PNTSTATE <> "" Then
            If bToolTips = True Then
                state_alarmState.Title = "ALENBST= INHIBIT, PNTSTATE=" & sd.DataValue("CurrentPoint.PNTSTATE")
            End If
            state_alarmState.Value = state_alarmState.Value & " " & state_PNTSTATE
        Else
            If bToolTips = True Then
                state_alarmState.Title = "ALENBST= INHIBIT"
            End If
       End If  'state_PNTSTATE
    End If  ' state_ALENBST


'   Show "DISABLED" in case below
    If UCase(sd.DataValue("CurrentPoint.ALENBST")) = "DISABLE" Then
        textAlarmDisabled.Style.visibility = "Visible"
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - DISABLED"
    Else
        textAlarmDisabled.Style.visibility = "Hidden"
    End If
End Sub


'ALPSTATUS will be displayed if the status is not "ACTIVE"
Sub CommonPointState

'   Update "point state" in the description zone
'   Called when either PTEXECST or REDTAG params change
    If sd.QualityGood("CurrentPoint.PTEXECST") Then
        If UCase(sd.DataValue("CurrentPoint.PTEXECST")) = "INACTIVE" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonPointState - INACTIVE"

Sub AnalogPVStatus
'
'   See Faceplate ocx for comment-matrix as to behavior here

    Dim bExOK

    If sd.QualityGood("CurrentPoint.PVEXHIFL") And Not sd.IsNan("CurrentPoint.PVEXHIFL") And sd.QualityGood("CurrentPoint.PVEXLOFL") And Not sd.IsNan("CurrentPoint.PVEXLOFL") Then
        bExOK = True
    Else
        bExOK = False
    End If

'   PV may be "not configured" in which case we hide the PV Status shape
    If UCase(sd.DataValue("CurrentPoint.PVSTS")) = "NORMAL" Or sd.QualityConfigError("CurrentPoint.PV") Then
		if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
			window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
			shpPvstatus.Value = 15 'Path status input error (alone)
			shpPvstatus.Style.visibility = "Visible"
		else
	        shpPvstatus.Value = 1  '1st is invisible
    	    shpPvstatus.Style.visibility = "Hidden"
	        'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - Normal (or not configured)"
		end if
    ElseIf UCase(sd.DataValue("CurrentPoint.PVSTS")) = "BAD" Then
        If bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'B'"
            shpPvstatus.Value = 2   ' red "B"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And (Not sd.DataValue("CurrentPoint.PVEXLOFL") <> 0) Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'H'"
            shpPvstatus.Value = 3   ' red "H"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf bExOK And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 And (Not sd.DataValue("CurrentPoint.PVEXHIFL") <> 0) Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'L'"
            shpPvstatus.Value = 4   ' red "L"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "MAN" Then
            'both EX..FL params must be 'off' ...look at PVSOURCE
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - M'"
            shpPvstatus.Value = 5   ' red "M"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "SUB" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'S'"
            shpPvstatus.Value = 6   ' red "S"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "BAD" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'B'(2)"
            shpPvstatus.Value = 13   ' red "B"
            shpPvstatus.Style.visibility = "Visible"
        Else
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'B'(3)"
            shpPvstatus.Value = 2   ' just make it bad - red "B"
            shpPvstatus.Style.visibility = "Visible"
        End If

		'for all of the above cases, if the path status is also bad, then adding "14" will update the tooltip accordingly in the shape sequence
		'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
		if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
			window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
			shpPvstatus.Value = shpPvstatus.value + 14  'include *Path Status Error* in tooltip ALONG WITH above status 
		end if

    ElseIf UCase(sd.DataValue("CurrentPoint.PVSTS")) = "UNCERTN" Then
        If bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'U'"
            shpPvstatus.Value = 7   ' yellow "U"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And (Not sd.DataValue("CurrentPoint.PVEXLOFL") <> 0) Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'H'(yellow)"
            shpPvstatus.Value = 8   ' yellow "H"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf bExOK And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 And (Not sd.DataValue("CurrentPoint.PVEXHIFL") <> 0) Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'L'(yellow)"
            shpPvstatus.Value = 9   ' yellow "L"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "MAN" Then
            'both EX..FL params must be 'off' ...look at PVSOURCE
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'M'(yellow)"
            shpPvstatus.Value = 10   ' yellow "M"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "SUB" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'S'(yellow)"
            shpPvstatus.Value = 11  ' red "S"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "BAD" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'U'(2)"
            shpPvstatus.Value = 7   ' yellow "U"
            shpPvstatus.Style.visibility = "Visible"
        Else
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'U'(3)"
            shpPvstatus.Value = 7   ' just make it uncertain - yellow "U"
            shpPvstatus.Style.visibility = "Visible"
        End If

		'for whatever the above is - adding "14" appends the "Path status error" msg to the tooltip.
		'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
		if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
			window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
			shpPvstatus.Value = shpPvstatus.value + 14  'include *Path Status Error* in tooltip ALONG WITH above status
		end if

    Else ' non-configured PVSTS parameter; GUS fp then looks for only SUB/MAN
        If UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "MAN" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'M'(2, yellow)"
            shpPvstatus.Value = 14   ' yellow "M" 
            shpPvstatus.Style.visibility = "Visible"
 			'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
			if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
				window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
				shpPvstatus.Value = shpPvstatus.value + 14 
			end if
       ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "SUB" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'S'(2, yellow)"
            shpPvstatus.Value = 12  ' yellow "S" 
            shpPvstatus.Style.visibility = "Visible"

			'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
			if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
				window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
				shpPvstatus.Value = shpPvstatus.value + 14 
			end if
        Else    ' hide it "OK" (unless path bad)
			'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
			if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
				window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
				shpPvstatus.Value = 15 
            	shpPvstatus.Style.visibility = "Visible"
			else
		    	'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - Normal (2)"
            	shpPvstatus.Value = 1  'invisible
            	shpPvstatus.Style.visibility = "Hidden"
			end if
	    End If
    End If

End Sub

  	intRaiseLowerTimerID = window.setInterval ("CheckRaiseLowerResponse()", 500)

sub CancelRaiseLowerConfirmation

	'generic routine to clean up and bail out of confirmation of raise/lower OP/MODE/MODATTR
	window.external.parentdocument.parentwindow.external.CancelResponse
	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID)
	sCurrentShownRaiseLowerValue = ""
	sElementRaiseLower = ""
	sConfirmRaiseLowerMsg = ""
end sub

Function OnDeactivateCancelRamp2

	window.clearInterval(intCancelRampOnPageDeactivateID)
	call CancelRaiseLowerConfirmation

end function


sub CheckRaiseLowerResponse

	dim sResponse
	dim iStatus
	dim ptPromptType 
	dim sMsgZoneText
	ptPromptType = 1

	nConfirmCount = nConfirmCount + 1

	sMsgZoneText = window.external.parentdocument.parentwindow.external.MessageZoneText 

'	sConfirmRaiseLowerMsg = "<" & nConfirmCount & "> " & "Change state of TPS:" & text_NAME.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	sConfirmRaiseLowerMsg = "Change state of TPS:" & alphaTagName.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	iStatus = window.external.parentdocument.parentwindow.external.GetResponse3 (sConfirmRaiseLowerMsg, ptPromptType, sResponse)

	'window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: status returned= " & iStatus

	if iStatus = 0 and nConfirmCount > 1 then

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: - action cancelled by user" 
		call CancelRaiseLowerConfirmation
		exit sub
	elseif iStatus = 1 then
		if sResponse = "" then
			'no response yet... let timer fire again shortly
		else
			'recieved response, process it and we're DONE
			if UCase(sResponse) = "Y" then

				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: setting: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				if UCase(sElementRaiseLower) = "MODE" then
					combo_MD.hostpopulation = true
'					page.AutoSelectOnNextModeChange = true
					Call SetAutoSelect
					combo_MD.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODE"), 1
					end if
					combo_MD.focus
				elseif UCase(sElementRaiseLower) = "MODATTR" then
					combo_MDATTR.hostpopulation = true
					combo_MDATTR.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODATTR"), 1
					end if
					combo_MDATTR.focus
				end if
			end if

			call CancelRaiseLowerConfirmation

		end if
	end if

	if nConfirmCount > 2 and (sMsgZoneText = "" or (sConfirmRaiseLowerMsg <> sMsgZoneText)) then		
		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: message text changed operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if

	'expire after Experion's "operator timeout" - e.g. 60 seconds (x2 as timer is .5 secs)
	if nConfirmCount > oper_timeout.value * 2 then 

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: nConfirmCount > Experion operator timeout: " & oper_timeout.value & "; operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if


end sub

<SCRIPT id=44E2F4AF-016E-4438-83E1-2015B17A2118 language=JScript defer 
shaperefcount="1">var centerPanelCurrentPage = 1;
centerPanelCurrentDot = 1;
var centerPanelMaxPage = 5;
var centerPanelMaxPageConfigured = 5;
var oShape
var ColorTheme = 'Light';
var colorTheme = 1;
var bshow2ndPage = true;
var bshow3rdPage = true;
var bshow4thPage = true;
var PageContentBaseId = 'CenterPanelPage';

function calculateActualDots()
{

	//Calculate actual dots as per the boolean configured like show2ndPage, show3rdPage
	if (bshow2ndPage != true && centerPanelMaxPageConfigured >= 2)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}
	if (bshow3rdPage != true && centerPanelMaxPageConfigured >= 3)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}
	if (bshow4thPage != true && centerPanelMaxPageConfigured >= 4)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}

	//Once Actual dots calculated initialize the Navigation button with dots
	initializeNavButton()
}

function initializeNavButton()
{

	//Default hide all and show only dots which are applicable
	oShape.objects("btn" + ColorTheme + 'Closed').style.visibility = "inherit";

	switch (centerPanelMaxPage)
	{
		case 2:
			oShape.objects("dotSelected" + ColorTheme + 21).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 22).style.visibility = "inherit";
			break;
		case 3:
			oShape.objects("dotSelected" + ColorTheme + 31).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 32).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 33).style.visibility = "inherit";
			break;
		case 4:
			oShape.objects("dotSelected" + ColorTheme + 41).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 42).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 43).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 44).style.visibility = "inherit";
			break;
		case 5:
			oShape.objects("dotSelected" + ColorTheme + 51).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 52).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 53).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 54).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 55).style.visibility = "inherit";
			break;
		default:
			oShape.style.visibility = 'hidden';
	}
}

function PanelNavigation()
{

	// centerPanelCurrentDot to handle current dots to be selected.
	// centerPanelCurrentPage page to handle current Page to be shwon

	//Hide all
	centerPanelCurrentPage = centerPanelCurrentPage + 1;
	centerPanelCurrentDot = centerPanelCurrentDot + 1;


	//skipping current page based on the boolean configured like show2ndPage, show3rdPage and show4thPage
	if (bshow2ndPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 2)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;

	}
	if (bshow3rdPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 3)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;

	}
	if (bshow4thPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 4)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;
	}
	//Resetting the centerPanelCurrentPage to default in case centerPanelCurrentPage crossed the limit as per the boolean configured like show2ndPage, show3rdPage and show4thPage
	if (bshow2ndPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 2)
	{
		centerPanelCurrentPage = 1
	}
	if (bshow3rdPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 3)
	{
		centerPanelCurrentPage = 1
	}
	if (bshow4thPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 4)
	{
		centerPanelCurrentPage = 1
	}

	//Applying the style to the button as per the Closed and Open Status, If the selected dots is other than 1 then its open button.
	if (centerPanelCurrentDot == 1)
	{
		oShape.objects("btn" + ColorTheme + 'Closed').style.visibility = "inherit";
	}
	else
	{
		oShape.objects("btn" + ColorTheme + 'Open').style.visibility = "inherit";
	}
	//Applying the style to the dots as per selected/unselected dots.
	for (var i = 1; i <= centerPanelMaxPage; i++)
	{
		if (i == centerPanelCurrentDot)
		{
			oShape.objects("dotSelected" + ColorTheme + centerPanelMaxPage + i).style.visibility = "inherit";
		}
		else
		{
			oShape.objects("dotUnselected" + ColorTheme + centerPanelMaxPage + i).style.visibility = "inherit";
		}
	}
	// Showing only the applicable page as per the selected dots
	for (obj in oShape.parentElement.children)
	{
		if (obj.toUpperCase().indexOf(PageContentBaseId) !== -1)
		{
			if (obj.slice(-1) == centerPanelCurrentPage)
			{
				document.getElementById(obj).style.display = "block"
				document.getElementById(obj).style.visibility = "Inherit";
			}
			else
			{
				document.getElementById(obj).style.display = "None"
				document.getElementById(obj).style.visibility = "Hidden";
			}
		}
	}
	// Resetting the centerPanelCurrentPage in case it ha crossed the max of configured page
	if (centerPanelCurrentPage >= centerPanelMaxPageConfigured)
	{
		centerPanelCurrentPage = 0;
	}
	// Resetting the dots in case it ha crossed the max of configured page
	if (centerPanelCurrentDot >= centerPanelMaxPage)
	{
		centerPanelCurrentDot = 0;
	}
}</SCRIPT>
