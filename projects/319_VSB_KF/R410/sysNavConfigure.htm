<SCRIPT language=vbscript>
<!--

Dim oldColor
Dim intCount

intCount = 0

Function AddParent(strName)
    Dim strID 
    Dim strTemp

    strID = "ID" & intCount
    intCount = intCount + 1

    strTemp = "<table cellspacing=1 cellpadding=0 width=""100%""><tr><td width=" & iIndent & "px""></td><td nowrap><DIV ID=""" & strID & """ CLASS=""parent""><IMG CLASS=""image"" SRC=""Images\plus.gif"">&nbsp;" & strName & "<DIV CLASS=""child"" STYLE=""display:none""></DIV></DIV></td></tr></table>"

    outlineDiv.insertAdjacentHTML "BeforeEnd", strTemp

    AddParent = strID
End Function

Function AddChild(strParentID, strLinkName, strUrl, bHasChild, iLevel)
    Dim strTemp
    Dim objTemp
    Dim strClass
    dim strStyle
    dim i
    dim iIndent
    Dim strID
    strID = "ID" & intCount
    intCount = intCount + 1
    
    'If this child is the active child then the class is set to "activelink" 
    'so that it is highlighted in the menu.
    strClass = "link"
	if CStr(strCurrentDoc) = CStr(strLinkName) then
		strClass = "activelink"
		strExpand = strParentID
	end if
	
	if strClass = "activelink" then
		strStyle = "FONT-SIZE: 11pt;FONT-FAMILY: Helvetica, Arial;FONT-WEIGHT: normal;COLOR: #E9E9E9;BACKGROUND-COLOR: #494949"
	end if
	
	iIndent = 5*(iLevel+1)
	
	if bHasChild then
		strTemp = "<table cellspacing=1 cellpadding=0 width=""100%""><tr><td width=" & iIndent & "px""></td><td nowrap><DIV ID=""" & strID & """ CLASS=""parent1""><IMG CLASS=""image"" SRC=""Images\plus.gif""/>&nbsp;<A class=par HREF=""PAGE://" & strUrl & """ target=_parent>" & strLinkName & "</A><DIV CLASS=""child"" STYLE=""display:none""></DIV></DIV></td></tr></table>"
	else
		strTemp = "<table cellspacing=1 cellpadding=0 width=""100%""><tr><td width=" & iIndent & "px""></td><td nowrap style=""" & strStyle & """><IMG SRC=""Images\blank.gif""/>&nbsp;<A class=lin HREF=""PAGE://" & strUrl & """ target=_parent>" & strLinkName & "</A><BR></tr></td></table>"
	end if  

    Set objTemp = document.all.item(strParentID)
    if objTemp.children(1).className = "child" then
  		objTemp.children(1).insertAdjacentHTML "BeforeEnd", strTemp
  	else
  		objTemp.children(2).insertAdjacentHTML "BeforeEnd", strTemp
  	end if
    AddChild = strID
End Function

Sub ExpandCollapse(objElement, bAuto)    
    Dim objTargetDiv
    Dim imgIcon

    ' did the user click the image or the parent name?
    If objElement.className = "parent" or objElement.className = "parent1" Then
        Set objTargetDiv = objElement.children(1)
        If objTargetDiv.className <> "child" then
        	Set objTargetDiv = objElement.children(2)
        End if
        Set imgIcon = objElement.children(0)
    Else
        Set objTargetDiv = objElement.parentElement.children(1)
        if objTargetDiv.className <> "child" then
        	Set objTargetDiv = objElement.parentElement.children(2)
        end if
        Set imgIcon = objElement
    End If
    
    ' if the parent has children, expand or collapse them
    If objTargetDiv.children.length > 0 Then
        If objTargetDiv.style.display = "none" Then   
            objTargetDiv.style.display = ""
            imgIcon.src = "Images\minus.gif"
        Else
            objTargetDiv.style.display = "none"
            imgIcon.src = "Images\plus.gif"
        End If
    End If
    
    if bAuto Then
	    'if the parent has parents, expand them
	    Dim objParent
	    Set objParent = objTargetDiv.parentElement
	    While Not objParent Is Nothing
	    	if objParent.className = "parent" or objParent.className = "parent1" then
	    		Dim objChild
	    		Set objChild = objParent.children(1)
	    		Set imgIcon = objParent.children(0)
	    		if objChild.className <> "child" then
	    			set objChild = objParent.children(2)
	    		end if
	    		objChild.style.display = ""
	    		imgIcon.src = "Images\minus.gif"
	    	end if
	    	
	    	Set objParent = objParent.parentElement
	    Wend
	end if
End Sub

Sub DoClick()
    If (window.event.srcElement.className = "parent") Or (window.event.srcElement.className = "image") Then
        ExpandCollapse window.event.srcElement, false
    End If
    window.event.cancelBubble = True
End Sub

-->
</SCRIPT>

<DIV language=VBScript id=outlineDiv onclick=DoClick></DIV></BODY></HTML>
