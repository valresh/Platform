<SCRIPT>
// Summary types
var SUMMARY_ALARM               = 1;
var SUMMARY_MESSAGE             = 2;
var SUMMARY_EVENT               = 3;
var SUMMARY_SOE                 = 4;
var SUMMARY_SYSTEM_ALARM        = 5;
var SUMMARY_ALERT               = 6;
var SUMMARY_EVENTVIEW           = 7;
var SUMMARY_ACTIVITY            = 8;
var SUMMARY_BATCH               = 9;
var SUMMARY_PROCEDURE           = 10;
var SUMMARY_ACTIVITY_ORPHAN     = 11;
</SCRIPT>

<SCRIPT language=VBScript for=btnOk defer event=onclick>
	Dim fullName
	fullName = DisplayDataRepository.GetValue("FullName")
	CloseDialog true, Array(fullName)
</SCRIPT>

<SCRIPT language=VBScript for=btnCancel defer event=onclick>
    CloseDialog false, ""
</SCRIPT>

<SCRIPT language=JScript for=Page defer event=onactivate>
var txtUnshelve = "Unshelve ";
var txtFor = " for ";
var txtTotalShelvedAlarms = DisplayDataRepository.GetValue("NotifCount");
var txtEntity = DisplayDataRepository.GetValue("EntityName");
var txtAlarmOrAlert = "";

var summaryType = DisplayDataRepository.GetValue("SummaryType");
var parsedSummaryType = parseInt(summaryType);

if (parsedSummaryType == SUMMARY_ALARM || parsedSummaryType == SUMMARY_SYSTEM_ALARM) {
	txtAlarmOrAlert = " alarms";
} else if (parsedSummaryType == SUMMARY_ALERT) {
	txtAlarmOrAlert = " alerts";
} else {
	txtAlarmOrAlert = " alarms/alerts";
}

lblText.innerText = txtUnshelve + txtTotalShelvedAlarms + txtAlarmOrAlert + txtFor + txtEntity;

if (window.external && window.external.parentDocument && window.external.parentDocument.onshelvingdialogcomplete) {
	window.external.parentDocument.onshelvingdialogcomplete(window.external);
}

if (g_nTimer != -1) {
    window.clearInterval(g_nTimer);
}

g_nTimer = window.setInterval("CallOnTimer()", 1000);
</SCRIPT>

<SCRIPT language=VBScript>
Dim g_bUnloaded 
Dim g_lCStnStatus
Dim g_lOperator
Dim g_nTimer

g_bUnloaded = false
g_lCStnStatus = window.external.Application.Status.FieldState(5)
g_lOperator = window.external.Application.Status.SecurityLevel
g_nTimer = -1

Sub CloseDialog(bShelve, param2)
	If not g_bUnloaded Then
		If not IsEmpty(window.external.parentDocument) Then
			If not IsEmpty(window.external.parentDocument.oncloseshelvingdialog) Then
				window.external.parentDocument.oncloseshelvingdialog bShelve, param2
			End If
		End If
		g_bUnloaded = true
		window.external.close
	End If
End Sub

Sub CallOnTimer

If g_lCStnStatus <> window.external.Application.Status.FieldState(5) Then
	CloseDialog false, "server availability changed"
End If
If g_lOperator <> window.external.Application.Status.SecurityLevel Then
	CloseDialog false, "operator security change"
End If

End Sub

</SCRIPT>
<SCRIPT language=JScript for=Page defer event=onpagecomplete>
var txtUnshelve = "Unshelve ";
var txtFor = " for ";
var txtTotalShelvedAlarms = DisplayDataRepository.GetValue("NotifCount");
var txtEntity = DisplayDataRepository.GetValue("EntityName");
var txtAlarmOrAlert = "";

var summaryType = DisplayDataRepository.GetValue("SummaryType");
var parsedSummaryType = parseInt(summaryType);

if (parsedSummaryType == SUMMARY_ALARM || parsedSummaryType == SUMMARY_SYSTEM_ALARM) {
	txtAlarmOrAlert = " alarms";
} else if (parsedSummaryType == SUMMARY_ALERT) {
	txtAlarmOrAlert = " alerts";
} else {
	txtAlarmOrAlert = " alarms/alerts";
}

lblText.innerText = txtUnshelve + txtTotalShelvedAlarms + txtAlarmOrAlert + txtFor + txtEntity;

if (window.external && window.external.parentDocument && window.external.parentDocument.onshelvingdialogcomplete) {
	window.external.parentDocument.onshelvingdialogcomplete(window.external);
}

if (g_nTimer != -1) {
    window.clearInterval(g_nTimer);
}

g_nTimer = window.setInterval("CallOnTimer()", 1000);
</SCRIPT>
