<SCRIPT language=VBScript for=Comments defer event=onpropertychange>
Dim valuelen
valuelen = Len(Comments.value)

If window.event.propertyName = "value" Then
	If valuelen > 0 And Not Comments.Value = g_strServerUnavailable Then
		btnOk.disabled = false
		Comments.style.backgroundColor = "white"
	ElseIf valuelen = 0 and alphaShelvingOptions.value = 1 Then
		btnOk.disabled = true
		Comments.style.backgroundColor = "yellow"
	End If
End If
</SCRIPT>

<SCRIPT language=VBScript for=Comments defer event=onkeypress>
Dim charoffset, valuelen, keycode

charoffset = 0
valuelen = Len(Comments.value)
keycode = window.event.keyCode

If keycode > 31 Then 'if printable char
	charoffset = 1
End If

If valuelen + charoffset > 200 Then
	txtError.value = ("Error: Maximum of 200 characters in comments")
	Comments.value = Left(Comments.value,199)
End If
</SCRIPT>

<SCRIPT language=VBScript for=alphaShelvingOptions defer event=onupdate>
If (alphaShelvingOptions.value AND 1) > 0 Then
	txtRequired.style.visibility = "visible"
	If Len(Comments.value) = 0 Or Comments.Value = g_strServerUnavailable Then
		If Not Comments.readonly Then
			Comments.style.backgroundColor = "yellow"
		End If
		btnOk.disabled = true
	End If
Else
	txtRequired.style.visibility = "hidden"
	If Not Comments.readonly Then
		Comments.style.backgroundColor = "white"
	End If
	btnOk.disabled = false
End If

If (alphaShelvingOptions.value AND 8) > 0 Then
	txtError.value = ("Shelving across shift boundaries is not permitted.")
Else
	txtError.value = ""
End If
</SCRIPT>

<SCRIPT language=JScript defer>var HOURS_IN_DAY = 24;
var MINUTES_IN_HOUR = 60;
var MILLISECONDS_IN_MINUTE = 60000;
var SHV_FLAG_PREVENT_BEYOND_SHIFT = 8;
var SHV_NO_MAX_TIME_OFFSET = -3;

function CalcNextShiftBoundaryUTC() {
	var nStartOfDay = parseInt(alphaStartOfDay.value);
	var nShiftLength = parseInt(alphaShiftLength.value);
	if (isNaN(nStartOfDay) || isNaN(nShiftLength)) {
		window.external.application.logMessage("Value error -- start of day:" + alphaStartOfDay.value + ", shift length:" + alphaShiftLength.value);
		return NaN;
	}
	if (nShiftLength <= 0)
	{
		window.external.application.logMessage("Invalid shift length" + alphaShiftLength.value);
		return NaN;
	}

	// get next shift boundary
	var currTimeUTC = Date.now();
	// set shift boundary to todat's start of day first
	var shiftBoundaryTime = new Date();
	shiftBoundaryTime.setHours(Math.floor(nStartOfDay / MINUTES_IN_HOUR));
	shiftBoundaryTime.setMinutes(nStartOfDay % MINUTES_IN_HOUR);
	shiftBoundaryTime.setSeconds(0, 0);
	var shiftBoundaryTimeUTC = shiftBoundaryTime.valueOf();
	
	// then increment or decrement by shift length  until next shift boundary is reached
	if (shiftBoundaryTimeUTC < currTimeUTC) {
		while (shiftBoundaryTimeUTC < currTimeUTC) {
			shiftBoundaryTimeUTC += (nShiftLength * MILLISECONDS_IN_MINUTE);
		}
	} else {
		while ((shiftBoundaryTimeUTC - nShiftLength*MILLISECONDS_IN_MINUTE) > currTimeUTC) {
			shiftBoundaryTimeUTC -= (nShiftLength * MILLISECONDS_IN_MINUTE);
		}
	}

	return shiftBoundaryTimeUTC;
}

function SetMaxCustomTime(){

	// default is 9999 days
	var maxDateTimeUTC = Date.now() + g_lMaxDayOffset * HOURS_IN_DAY * MINUTES_IN_HOUR * MILLISECONDS_IN_MINUTE;

	// if the configured max for this reason is not "no max", check that value
	var nMaxTimeIndex = parseInt(alphaMaxTimeIndex.value)
	if ( (!isNaN(nMaxTimeIndex)) && nMaxTimeIndex != SHV_NO_MAX_TIME_OFFSET) {
		var durationMinutes = tblShelvePeriods.Fields.Item("shelvingPeriods.value").getValue(nMaxTimeIndex);
		var configuredMaxTimeUtc = Date.now() + durationMinutes * MILLISECONDS_IN_MINUTE;
		maxDateTimeUTC = Math.min(maxDateTimeUTC, configuredMaxTimeUtc);
	} 

	// if this reason doesn't allow shelve over shift, check shift boundary
	if ((alphaShelvingOptions.value & SHV_FLAG_PREVENT_BEYOND_SHIFT) > 0) {
		var shiftBoundaryTimeUTC = CalcNextShiftBoundaryUTC();
		if (!isNaN(shiftBoundaryTimeUTC))
		{
			maxDateTimeUTC = Math.min(maxDateTimeUTC, shiftBoundaryTimeUTC);
		}
	}

	var maxDateTime = new Date(maxDateTimeUTC);

	SetMaxDtByComponents(maxDateTime.getFullYear(), 
			 			 maxDateTime.getMonth() + 1,	// month returns [0-11]
			 			 maxDateTime.getDate(), 
						 maxDateTime.getHours(),
						 maxDateTime.getMinutes(),
						 maxDateTime.getSeconds());
}</SCRIPT>

<SCRIPT language=VBScript defer>Dim g_strServerUnavailable
Dim g_bUnloaded 
Dim g_lCStnStatus
Dim g_lOperator
Dim g_lCustomShelveTimeIndex
Dim g_lDefaultMinuteOffset
Dim g_lMinMinuteOffset
Dim g_lMaxDayOffset
Dim g_dtMax
Dim g_dtMin
g_bUnloaded = false
g_strServerUnavailable = "(Comments cannot be added when the server is unavailable)"
g_lCStnStatus = window.external.Application.Status.FieldState(5)
g_lOperator = window.external.Application.Status.SecurityLevel
g_lCustomShelveTimeIndex = -4
g_lDefaultMinuteOffset = 30
g_lMinMinuteOffset = 1
g_lMaxDayOffset = 9999
g_dtMax = Null
g_dtMin = Null

Sub CloseDialog(bShelve, param2)
	If not g_bUnloaded Then
		If not IsEmpty(window.external.parentDocument) Then
			If not IsEmpty(window.external.parentDocument.oncloseshelvingdialog) Then
				window.external.parentDocument.oncloseshelvingdialog bShelve, param2
			End If
		End If
		g_bUnloaded = true
		window.external.close
	End If
End Sub

Sub EnableUnshelveDelayOnRTNInput(bEnable)
	txtError.value = ""
	If bEnable Then
		UnshelveDelayOnRTN.disabled = ""
		UnshelveDelayOnRTN.style.background  = "white"
		UnshelveDelayOnRTN.value = 0
	Else 
		UnshelveDelayOnRTN.disabled = "disabled"
		UnshelveDelayOnRTN.style.background  = "transparent"
		UnshelveDelayOnRTN.value = ""
	End If
End Sub

Sub CheckIfUnshelveOnRTNShouldBeDisabled()
	Dim rtn
	rtn = CBool(DisplayDataRepository.GetValue("RTN"))
	If rtn Then
		chkUnshelveRTN.disabled = true
		txtUnshelveRTN.title = "Option disabled as alarm is returned to normal"
		chkUnshelveRTN.title = txtUnshelveRTN.title
	End If
End Sub

Function GetDT()
	Dim dt
	dt = DateSerial(dtShelveDate.Year, dtShelveDate.Month, dtShelveDate.Day)
	dt = DateAdd("h", dtShelveTime.Hour, dt)
	dt = DateAdd("n", dtShelveTime.Minute, dt)
	dt = DateAdd("s", dtShelveTime.Second, dt)
	GetDT = dt
End Function

Function SetDT(dt)
	' zero out the seconds field
	dt = DateAdd("s", -1 * Second(dt), dt)
	dtShelveDate.value = dt
	dtShelveTime.value = dt
End Function

Function SetMaxDT(maxDt)
	g_dtMax = maxDt

	' check and clamp selected value
	CheckDTBound()

	dtShelveDate.MaxDate = g_dtMax
	dtShelveTime.MaxDate = g_dtMax
End Function

Function SetMinDT()
	' set min date to now + 1 minute
	Dim currDt
	currDt = Date()
	currDt = DateAdd("h", Hour(now()), currDt)
	currDt = DateAdd("n", Minute(now()), currDt)
	g_dtMin = DateAdd("n", g_lMinMinuteOffset, currDt)

	' check and clamp selected value
	CheckDTBound()

	dtShelveDate.MinDate = g_dtMin
    dtShelveTime.MinDate = g_dtMin
End Function

Function SetMaxDtByComponents(nYear, nMonth, nDay, nHour, nMinute, nSecond)
	Dim maxDt
	maxDt = DateSerial(nYear, nMonth, nDay)
	maxDt = DateAdd("h", nHour, maxDt)
	maxDt = DateAdd("n", nMinute, maxDt)
	maxDt = DateAdd("s", nSecond, maxDt)
	SetMaxDT(maxDt)
End Function

Sub SyncDateTimeControls()
	Dim dt
	dt = CheckDTBound()
	dtShelveDate.value = dt
	dtShelveTime.value = dt
End Sub

Function CheckDTBound()
	Dim selectedDt, secDiff
	selectedDt = GetDt()
	' check min date
	If Not(IsNull(g_dtMin)) Then
		secDiff = DateDiff("s", g_dtMin, selectedDt)
		If secDiff < 0 Then
			SetDT(g_dtMin)
			selectedDt = g_dtMin
		End If
	End If
	' check max date
	If Not(IsNull(g_dtMax)) Then
		secDiff = DateDiff("s", selectedDt, g_dtMax)
		If secDiff < 0 Then
			SetDT(g_dtMax)
			selectedDt = g_dtMax
		End If
	End If
	CheckDTBound = selectedDt
End Function

Sub SetDTPickerVisibility()
	Dim selectedPeriod
	selectedPeriod = alphaPeriod.value
	If selectedPeriod = g_lCustomShelveTimeIndex Then
		dtShelveDate.style.visibility = "inherit"
		dtShelveTime.style.visibility = "inherit"
		textboxUntil.style.visibility = "inherit"
		SetMaxCustomTime()
		SetMinDT()
	Else
		dtShelveDate.style.visibility = "hidden"
		dtShelveTime.style.visibility = "hidden"
		textboxUntil.style.visibility = "hidden"
	End If
End Sub

Sub CallOnTimer

If g_lCStnStatus <> window.external.Application.Status.FieldState(5) Then
	CloseDialog false, "server availability changed"
End If
If g_lOperator <> window.external.Application.Status.SecurityLevel Then
	CloseDialog false, "operator security change"
End If

window.clearinterval(ntimer)


End Sub</SCRIPT>
