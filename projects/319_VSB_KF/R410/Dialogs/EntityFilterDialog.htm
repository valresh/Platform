<script language="JScript">
// ----------------------------------------------------------------------------------
// Constants
// ----------------------------------------------------------------------------------

// Some key-codes used in key-press handling

var VK_ESC				= 27;
var VK_ENTER			= 13;

// ----------------------------------------------------------------------------------
// DoKeyPress
//
//	Invoked by the 'onkeypress' event on the body element. This is used to provide
//	keyboard support for such keys as 'ESC' and 'ENTER'
// ----------------------------------------------------------------------------------

function DoKeyPress()
{
	var key = window.event.keyCode;

	switch(key)
	{
	case VK_ESC:
		window.close();
		break;

	case VK_ENTER:

		// ENTER on a button element
		if( window.event.srcElement.tagName != "BUTTON" )
			DoUnload();
	}
}

// ----------------------------------------------------------------------------------
// DoLoad
//
//	Invoked by the 'onload' event of the body element. It is responsible for 
//	retrieving and restoring the previous state of the dialog.
// ----------------------------------------------------------------------------------

function DoLoad()
{
	// Get the summary type and auxfilter from the parameters
	if ( window.dialogArguments.param != null )
	{
		var strParameters = new String(window.dialogArguments.param);
		var nDivider = strParameters.indexOf(";");
		if ( nDivider != -1 )
		{
			var strSummaryType = strParameters.substr(0, nDivider);
			var strAuxFilter = strParameters.substr(nDivider + 1, strParameters.length - nDivider);
			AreaTable.Binding.DataObjects.Item(0).SummaryType = strSummaryType;
			AreaTable.Binding.DataObjects.Item(0).AuxFilter = strAuxFilter;
		}
	}

	AreaTable.Binding.DataObjects.Item(0).SetState("","");

	// Get the assets currently selected from the dialog arguments
	AreaTable.Binding.DataObjects.Item(0).SelectionListString = window.dialogArguments.Value;

	// Set the cancel value to 'true' in case we terminate early
	window.returnValue = true;
}

// ----------------------------------------------------------------------------------
// DoUnload
//
//	Invoked by the user clicking the 'OK' button to apply a filter. 
// ----------------------------------------------------------------------------------

function DoUnload()
{
	// Set the new value
	window.dialogArguments.Value = AreaTable.Binding.DataObjects.Item(0).SelectionListString;
	
	// Set the cancel value to 'false' since we're setting a new value
	window.returnValue = false;
	
	window.close();
}

// --------------------------------------------------------------------------------------

function OnEnter_MenuItem(object)
{
	if (parent.disabled == true) return;
	object.className = "MENUITEM_HOVER";
}

// --------------------------------------------------------------------------------------

function OnLeave_MenuItem(object)
{
	if (parent.disabled == true) return;
	object.className = "";
}

// --------------------------------------------------------------------------------------

function CheckDrag()
{
	return window.event.srcElement.isContentEditable;
}

// --------------------------------------------------------------------------------------

function CheckSelect()
{
	return window.event.srcElement.isContentEditable;
}

</script>
