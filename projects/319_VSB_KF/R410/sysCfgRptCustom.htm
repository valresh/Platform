    Sub InstallCodebase()
        urlbase	 = location.protocol & "//" & location.host
	    instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
        install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
        redirect = Escape(location.href)
	    window.location = instpage & "?install=" & install & "&redirect=" & redirect
    End Sub
    </SCRIPT>

</SCRIPT>
<SCRIPT language=VBScript for=alphaReportStatus defer event=onupdate>				'If currently being requested... 
				If alphaReportStatus.value <> 1 Then
					'Show the non-hyperlink version
					textboxLastRequested.style.visibility = "hidden"
					textboxRequested.style.visibility = "inherit"
				Else
					'Otherwise, show the hyperlink
					textboxRequested.style.visibility = "hidden"
					textboxLastRequested.style.visibility = "inherit"
				End If</SCRIPT>
<SCRIPT language=VBScript for=alphaReportType defer event=onupdate>'Redirect page if report type isn't Custom
	'Will need to be changed to include CH reports for ISR89570
	If (alphaReportType.Value <> 5) Then    
    	window.external.RequestServerLRN 21, 9, window.external.CurrentRecordOffset
	End If</SCRIPT>
<SCRIPT language=VBScript defer>Dim PageCompleted
            PageCompleted = false
            Dim ASPLoaded
            ASPLoaded = false
            public function IsCardholderReport()
                'Report type 5 is SSRS Report
                If (alphaReportType.Value = 5) Then
                    IsCardholderReport = false
                Else
                    IsCardholderReport = true
                End If
            End function
	        Public Sub ShowLastRequestedDetails()
	            'Hide last requested details if the report has never been requested
                If PageCompleted Then
                    If alphaStatus.value = "" Then
		                groupLastRequested.style.visibility = "hidden"
	                Else
    		            groupLastRequested.style.visibility = "visible"
	                End If
	            End If
	        End Sub
	        Public Sub LoadReportContent(firstTime)
	            'Ignore any onupdate calls until onpagecomplete has fired
	            If firstTime Or PageCompleted Then
                    If IsCardholderReport() Then
                        'Build up the URL for the FrameReport.asp page
                        reportFrame.navigate("/report/webpages/FrameReport.asp?ReportNumber=" & window.external.CurrentRecordOffset & "&ReportType=" & (alphaReportType.Value + 1))
                    Else
                        'Build up the URL for the SSRSParamDetails.aspx page
                        reportFrame.navigate("/report/webpages/ssrsreports/Default.aspx?SSRSParamDetails.aspx?reportName=" & alphaReportName.value & "&reportNumber=" & window.external.CurrentRecordOffset)
                    End If
                    PageCompleted = true
                End If
	        End Sub</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onoperatorchange>
		If window.external.SecurityLevel = 0 And ASPLoaded Then
			call reportFrame.CheckReportNameIsValid()	' to switch the selection to false
			ASPLoaded=false
		Else
	        If ASPLoaded Then
    	        Call reportFrame.CheckReportNameIsValid()
			ElseIf Not ASPLoaded Then
				LoadReportContent(false)
        	End If
		End If</SCRIPT>
