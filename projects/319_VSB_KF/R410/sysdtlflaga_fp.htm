<SCRIPT language=VBScript for=ConAlpHiAlmType defer event=onupdate>if me.value= txtNONE.value then
  me.style.visibility="hidden"
else
  me.style.visibility="visible"
end if</SCRIPT>

<SCRIPT language=JScript for=alphaTagName defer event=onupdate>	if ((this.scrollHeight - this.clientHeight) > 0 )
	{
		this.styleClass = "PointName_LongTag_Style";
		ConAlpDescription.styleClass = "Description_LongTag_Style";
	}
	else
	{
		this.styleClass = "PointName_Style";
		ConAlpDescription.styleClass = "Description_Style";
	}</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>if sd.DataChanged("currentpoint.SIMSTATE") then
    if sd.DataValue("currentpoint.SIMSTATE") = 2 then
		'SIMSTATE is SIMFREEZE
	    txtSIM.style.visibility = "Hidden" : EnumSimulationState.style.visibility = "visible"
	elseif sd.DataValue("currentpoint.SIMSTATE") = 1 then
		'SIMSTATE is SIMRUN
		txtSIM.style.visibility = "visible" : EnumSimulationState.style.visibility = "Hidden"
	else
		txtSIM.style.visibility = "hidden" : EnumSimulationState.style.visibility = "Hidden" 
	end if
end if</SCRIPT>

<SCRIPT language=VBScript for=alpPV defer event=onupdate>if  me.QualityGood("CurrentPoint.FLAGA.PVFL") then
	if me.DataValue("CurrentPoint.FLAGA.PVFL") = 1 then
		shpPVFL1.value = 2
		shpPVFL0.value = 2
	else
		shpPVFL1.value = 1
		shpPVFL0.value = 1
	end if
end if</SCRIPT>

<SCRIPT language=VBScript for=shpPVFL0 defer event=onclick>if sd.QualityGood("currentpoint.FLAGA.PVFL") then
	sd.DataValue("CurrentPoint.FLAGA.PVFL") = 0
end if</SCRIPT>

<SCRIPT language=VBScript for=shpPVFL1 defer event=onclick>if sd.QualityGood("currentpoint.FLAGA.PVFL") then
	sd.DataValue("CurrentPoint.FLAGA.PVFL") = 1
end if</SCRIPT>

<SCRIPT id=0D03BDD1-EAF6-4D7D-9870-2976FE87250F language=vbscript defer 
shaperefcount="1">Sub InstallCodebase()
	urlbase	 = location.protocol & "//" & location.host
	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
	install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
	redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub
</SCRIPT>
