<SCRIPT language=VBScript defer>page.style.visibility = "hidden"
MULTI_LOAD = "61"
LOAD_FAIL = "3"
LOAD_PWR_ON_QUALIF = "4"
LOAD_ISOL = "16"
LOAD_CONFIG = "22"
CMD_ACK = "101"
CABLE_STATUS_ACK = "64"
CABLE_STATUS_SUSPECT = "0"
CABLE_STATUS_OK = "2"
CABLE_STATUS_MARGINAL = "3"
OK_ICON = "./Images/Icon_OK.png"
FAIL_ICON = "./Images/Icon_Fail.png"
FAIL_BLINK_ICON = "./Images/Icon_Fail_Blink.png"
MARGINAL_ICON = "./Images/Icon_Marginal.png"
MARGINAL_BLINK_ICON = "./Images/Icon_Marginal_Blink.png"
SEVERE_ICON = "./Images/Icon_Severe.png"
SEVERE_BLINK_ICON = "./Images/Icon_Severe_Blink.png"
TRANSITIONAL_ICON = "./Images/Icon_Transitional.png"
UNKNOWN_ICON = "./Images/Icon_Unknown.png"
UNKNOWN_BLINK_ICON = "./Images/Icon_Unknown_Blink.png"
DISABLED_ICON = "./Images/Icon_Disabled.png"
BLANK_ICON = "./Images/blank.png"
command = ""
ack = ""
ack2 = ""
lowerFaceplate.style.top = ""
cableStatusAIcon = BLANK_ICON
cableStatusABlinkIcon = BLANK_ICON
Function UpdateCableAStatus()
	if(alphaCableStsA.value = "OK") Then
		cableStatusAIcon = OK_ICON
		cableStatusABlinkIcon = OK_ICON
		txtCableA.value = "OK"
	elseif(alphaCableStsA.value = "SUSPECT") Then
		cableStatusAIcon = MARGINAL_ICON
		cableStatusABlinkIcon = MARGINAL_BLINK_ICON
		txtCableA.value = "SUSPECT"
	elseif(alphaCableStsA.value = "MARGINAL") Then
		cableStatusAIcon = MARGINAL_ICON
		cableStatusABlinkIcon = MARGINAL_BLINK_ICON
		txtCableA.value = "MARGINAL"
	elseif(alphaCableStsA.value = "FAIL") Then
		cableStatusAIcon = FAIL_ICON
		cableStatusABlinkIcon = FAIL_BLINK_ICON
		txtCableA.value = "FAIL"
	else
		cableStatusAIcon = UNKNOWN_ICON
		cableStatusABlinkIcon = UNKNOWN_BLINK_ICON
		txtCableA.value = "UNKNOWN"
	End if
	cableStatusA.src = cableStatusAIcon
End Function
cableStatusBIcon = BLANK_ICON
cableStatusBBlinkIcon = BLANK_ICON
Function UpdateCableBStatus()
	if(alphaCableStsB.value = "OK") Then
		cableStatusBIcon = OK_ICON
		cableStatusBBlinkIcon = OK_ICON
		txtCableB.value = "OK"
	elseif(alphaCableStsB.value = "SUSPECT") Then
		cableStatusBIcon = MARGINAL_ICON
		cableStatusBBlinkIcon = MARGINAL_BLINK_ICON
		txtCableB.value = "SUSPECT"
	elseif(alphaCableStsB.value = "MARGINAL") Then
		cableStatusBIcon = MARGINAL_ICON
		cableStatusBBlinkIcon = MARGINAL_BLINK_ICON
		txtCableB.value = "MARGINAL"
	elseif(alphaCableStsB.value = "FAIL") Then
		cableStatusBIcon = FAIL_ICON
		cableStatusBBlinkIcon = FAIL_BLINK_ICON
		txtCableB.value = "FAIL"
	else
		cableStatusBIcon = UNKNOWN_ICON
		cableStatusBBlinkIcon = UNKNOWN_BLINK_ICON
		txtCableB.value = "UNKNOWN"
	End if
	cableStatusB.src = cableStatusBIcon
End Function
Function UpdateActiveCable()
	if(alphaActiveCable.value = "A") Then
		txtCableA.className = "ActiveText"
		headingCableA.className = "ActiveText"
		txtCableB.className = "NonActiveText"
		headingCableB.className = "NonActiveText"
	elseif(alphaActiveCable.value = "B") Then
		txtCableA.className = "NonActiveText"
		headingCableA.className = "NonActiveText"
		txtCableB.className = "ActiveText"
		headingCableB.className = "ActiveText"
	else
		txtCableA.className = "NonActiveText"
		txtCableB.className = "NonActiveText"
		headingCableA.className = "NonActiveText"
		headingCableB.className = "NonActiveText"
	End if
End Function
Function UpdateNCFImpact()
	if(alphaNcfImpact.value <> "") Then
		if(alphaNcfImpact.value = 0) Then
			iconNCFImpact.src = SEVERE_ICON
			txtNCFImpact.value = "SEVERE"
		elseif(alphaNcfImpact.value = 1) Then
			iconNCFImpact.src = MARGINAL_ICON
			txtNCFImpact.value = "HIGH"
		elseif(alphaNcfImpact.value = 2) Then
			iconNCFImpact.src = MARGINAL_ICON
			txtNCFImpact.value = "MODERATE"
		elseif(alphaNcfImpact.value = 3) Then
			iconNCFImpact.src = BLANK_ICON
			txtNCFImpact.value = "NONE"
		End if
	else
		txtNCFImpact.value = "UNKNOWN"
	End if
End Function
Function UpdateAckMessage()
	cableABlink = alphaCableStsA.DataValue("CurrentPoint.BLINKCABLEA")
	cableBBlink = alphaCableStsB.DataValue("CurrentPoint.BLINKCABLEB")
	if(cableABlink = 0 or cableBBlink = 0) Then
		ackMessage = "LCN "
		if(cableABlink = 0) Then
			Select case alphaCableStsA.value
				case "SUSPECT"
					ackMessage = ackMessage + "Cable A suspect. "
					ack = CABLE_STATUS_ACK + ";" + CABLE_STATUS_SUSPECT + ";0"
				case "MARGINAL"
					ackMessage = ackMessage + "Cable A marginal. "
					ack = CABLE_STATUS_ACK + ";" + CABLE_STATUS_MARGINAL + ";0"				
			End Select
		End if
		if(cableBBlink = 0) Then
			Select case alphaCableStsB.value
				case "SUSPECT"
					ackMessage = ackMessage + "Cable B suspect. "
					ack2 = CABLE_STATUS_ACK + ";" + CABLE_STATUS_SUSPECT + ";1"
				case "MARGINAL"
					ackMessage = ackMessage + "Cable B marginal. "
					ack2 = CABLE_STATUS_ACK + ";" + CABLE_STATUS_MARGINAL + ";1"				
			End Select
		End if
		ackMessage = ackMessage + "Please acknowledge."
		DisplayAckMessage(ackMessage)
	else
		statusAck.style.visibility = "hidden"
		toggleAck.style.visibility = "hidden"
	End if
End Function
Function DisplayAckMessage(ackMessage)
	statusAck.style.visibility = "visible"
	toggleAck.style.visibility = "visible"
	statusAckText.value = ackMessage
	toggleAck.className = "TabClose"
End Function
Function UpdateIcons()
	//If the zoom is large enought, use the 2x icons instead
	if(page.style.zoom > 1.5) Then
		OK_ICON = "./Images/Icon_OK_2x.png"
		FAIL_ICON = "./Images/Icon_Fail_2x.png"
		FAIL_BLINK_ICON = "./Images/Icon_Fail_Blink_2x.png"
		MARGINAL_ICON = "./Images/Icon_Marginal_2x.png"
		MARGINAL_BLINK_ICON = "./Images/Icon_Marginal_Blink_2x.png"
		SEVERE_ICON = "./Images/Icon_Severe_2x.png"
		SEVERE_BLINK_ICON = "./Images/Icon_Severe_Blink_2x.png"
		TRANSITIONAL_ICON = "./Images/Icon_Transitional_2x.png"
		UNKNOWN_ICON = "./Images/Icon_Unknown_2x.png"
		UNKNOWN_BLINK_ICON = "./Images/Icon_Unknown_Blink_2x.png"
		DISABLED_ICON = "./Images/Icon_Disabled_2x.png"
		BLANK_ICON = "./Images/blank_2x.png"
	End if
	UpdateCableAStatus()
	UpdateCableBStatus()
	UpdateNCFImpact()
End Function</SCRIPT>

function ResetButtons()

	btnLoadFail.disabled = false

	btnLoadPowerOn.className = "Flat_Button_Style"

	btnLoadPowerOn.className = "Flat_Button_Disabled_Style"
	btnLoadFail.className = "Flat_Button_Disabled_Style"
	btnLoadIsol.className = "Flat_Button_Disabled_Style"
	btnLoadConfig.className = "Flat_Button_Disabled_Style"
}
function UpdateCommandStatus()
{
	if(alphaCommandStatus.value == "")
	{
		cmdAck.style.visibility = "hidden"
		alphaCommandFeedback.value = ""
		cmdFailText.value = ""
		ResetButtons()
		ShrinkStatusAck()
		return
	}
	if(alphaCommandStatus.value == OVERRIDE_CMDSTS)
	{
		DisableButtons()
		btnShutdown.disabled = false
		btnShutdown.className = "Flat_Button_Highlight_Style"
		loadMsg = "Press Shutdown to proceed with override"
		window.external.showCallout(btnShutdown, loadMsg, 3, 1)
		return
	}
	cmdSts = alphaCommandStatus.value.split(",");
	if(cmdSts.length < 5)
	{
		alphaCommandFeedback.value = "Unknown"
		return; //cmdsts must have 5 fields
	}
	var state = cmdSts[0].toLowerCase()
	var cmdType = cmdSts[1].toLowerCase()
	var multiLoad = false
	if(cmdSts[2].toLowerCase() == "true")
	{
		multiLoad = true;
	}
	//Check if node type contains UCN information
	var nodeType;
	var ucnNodeNum = 0;
	var isUCNNode = false;
	if(cmdSts[3].indexOf('UCN') >= 0)
	{
		isUCNNode = true;
		var ucnInfo = cmdSts[3].split(" ")
		if(ucnInfo.length == 3)
		{
			ucnNodeNum = parseInt(ucnInfo[1])
			nodeType = ucnInfo[2]
		}
	}
	else
	{
		nodeType = cmdSts[3];
	}
	var nodeNum = parseInt(cmdSts[4])
	var errorStatus = "";
	if(cmdSts.length == 6)
	{
		errorStatus = cmdSts[5].toLowerCase()
	}
	if(nodeNum < 10)
	{
		nodeNum = "0" + nodeNum
	}
	if(isUCNNode && ucnNodeNum < 10)
	{
		ucnNodeNum = "0" + ucnNodeNum
	}
	if(state == "done")
	{
		DisableButtons()
		ExpandStatusAck()
		cmdFailHeading.value = cmdType.toUpperCase() + " DONE";
		if(multiLoad)
		{
			cmdFailText.value = "Multi " + cmdType + " completed."
		}
		else
		{
			if(isUCNNode)
			{
				cmdFailText.value = "UCN" + ucnNodeNum + " " + nodeType + nodeNum + " " + cmdType + " completed."
			}
			else
			{
				cmdFailText.value = nodeType + nodeNum + " " + cmdType + " completed."
			}
		}
		cmdAck.style.visibility = "visible"
	}
	else if(state == "busy")
	{
		ShrinkStatusAck()
		cmdAck.style.visibility = "hidden"
		DisableButtons()
		var displayState = "Busy... "
		if(multiLoad)
		{
			displayState = "Multi... "
		}
		if(cmdType == "load")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Loading"
		}
		else if(cmdType == "dump")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Dumping"
		}
		else if(cmdType == "save")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Saving"
		}
		else if(cmdType == "shutdown")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Shutdown"
		}
		else if(cmdType == "restore")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Restoring"
		}
	}
	else if(state == "fail")
	{
		DisableButtons()
		ExpandStatusAck()
		cmdFailHeading.value = cmdType.toUpperCase() + " FAIL";
		if(multiLoad)
		{
			cmdFailText.value = "Multi " + cmdType + " operation failed."
		}
		else
		{
			if(isUCNNode)
			{
				cmdFailText.value = "UCN" + ucnNodeNum + " " + nodeType + nodeNum + " - " + errorStatus + "."
			} 
			else
			{
				cmdFailText.value = nodeType + nodeNum + " - " + errorStatus + "."
			}	
		}
		cmdAck.style.visibility = "visible"
