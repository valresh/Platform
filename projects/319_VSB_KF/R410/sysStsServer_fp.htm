<SCRIPT language=VBScript for=Page defer event=onpagecomplete>	ItemNumber = alphaItemNumber.value
	if ItemNumber = 1 then
		' Dealing with a local server, show only locally-relevant data.
		GrpLocalData.style.visibility = "inherit" : GrpRemoteData.style.visibility = "hidden"
	else
		GrpLocalData.style.visibility = "hidden" : GrpRemoteData.style.visibility = "inherit"
	end if
' This is a hack to make sure the size of the centre panel is set to match the right set of data in the ApplyLayout() procedure.

<SCRIPT language=VBScript defer>sub ShowLinkFullName(link, value)
	' Determine whether to show or hide link name
	if value = 1 then
		strVisibility = "hidden"
	else
		strVisibility = "inherit"
	end if 
	' Show or hide specified link and server status
	select case link
		case 0
			alphaLink0FullName.style.visibility = strVisibility
		case 1
			alphaLink1FullName.style.visibility = strVisibility
		case 2
			alphaLink2FullName.style.visibility = strVisibility
		case 3
			alphaLink3FullName.style.visibility = strVisibility
	end select
end sub
' Determines whether the primary server label is needed Probably better to check the value of the ItemNumber parameter
sub ShowRedundancyInfo(value)
	if value = "" then
		lblCurrentPrimaryServer.style.visibility = "hidden"
	else
		lblCurrentPrimaryServer.style.visibility = "inherit"
	end if
end sub
' Rearranges the faceplate's contents to cope with resizing.
sub ApplyLayout()
	nPageWidth = Page.style.PixelWidth : nPageHeight = Page.style.PixelHeight
	' Match the width of the upper panel's line to the page.
	Lin.style.pixelWidth = nPageWidth - 6 
	' Anchor the lower panel to the bottom of the faceplate,and the centre panel to the lower panel.
	' The height of the centre panel depends on what data is visible as determined by onpagecomplete().
	if GrpRemoteData.style.visibility = "hidden" then
		nCenterPanelHeight = GrpLocalData.style.pixelHeight
	else
		nCenterPanelHeight = GrpRemoteData.style.pixelHeight
	end if
	nLowerPanelHeight = GrpLowerPanel.style.pixelHeight : nLowerPanelTop = nPageHeight - nLowerPanelHeight - 2
	nCenterPanelTop = nLowerPanelTop - nCenterPanelHeight :	GrpLowerPanel.style.top = (nLowerPanelTop) & "px" 
end sub</SCRIPT>
