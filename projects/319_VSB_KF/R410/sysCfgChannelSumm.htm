<SCRIPT language=VBScript defer>Sub UpdateCrt()
Dim cNum
ALabel.style.visibility = "hidden"
BLabel.style.visibility = "hidden"
For cNum = 20 To 1 Step -1
	document.getElementById("LinkBEnable"&cNum&"").style.visibility = "hidden"
  If (document.getElementById("LinkBImpl"&cNum&"").value = 1 ) Then
     If Isnumeric(document.getElementById("ChnType"&cNum&"").value) then
		  If (document.getElementById("ChnType"&cNum&"").value = 34) Then
			document.getElementById("LinkBEnable"&cNum&"").style.visibility = "hidden"
	    	Else
			document.getElementById("LinkBEnable"&cNum&"").style.visibility = "inherit"
			ALabel.style.visibility = "inherit"
			BLabel.style.visibility = "inherit"
		  End If
      End if
End If
Next
End Sub
Sub NavigateToDetailDisplay(tablepos,chnenb)
	if isNumeric(tablepos) and isNumeric(chnenb) then
		if (chnenb <> 0) and (tablepos > 0) then
			window.external.CurrentPage = "sysCfgChannelConfig?hscpoint=$CHANNEL"&Right(String(4,"0")&CStr(window.external.CurrentRecordOffset+tablepos-1),4)
		end if
	end if
End Sub</SCRIPT>
