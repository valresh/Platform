<SCRIPT language=vbscript ExcludeFromShapes="1">
Sub InstallCodebase()
    urlbase	 = location.protocol & "//" & location.host
	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
    install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
    redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub
</SCRIPT>
<SCRIPT language=VBScript defer>Const ULSecurityLevel = 5             ' Security Level required to make changes on a UL system
Const numULReportMin = 998       ' Record Offset for UL Reports,  to limit configuration to MNGR 
Const numULReportMax = 999
Const numMaxNonULReport = 997       'Max value for non-UL system.  To prevent seeing records 998 and over</SCRIPT>
<SCRIPT language=VBScript for=txtAreaName type="" defer event=onactivate>Set SelectedPoint = txtAreaName</SCRIPT>
<SCRIPT language=VBScript for=Record defer event=onupdate>If (IsNumeric(ServerTypeRaw.value)) Then
	If (ServerTypeRaw.value >= 5 And ServerTypeRaw.value <= 7) Then
		If (chkUL.value=0) And cint(me.Value) > numMaxNonULReport Then
			window.external.CurrentRecordOffset = numMaxNonULReport
		ElseIf  cint(me.Value) > numULReportMax  Then
			window.external.CurrentRecordOffset = numULReportMax
		End If 
	End If
End If</SCRIPT>
<SCRIPT language=VBScript for=ServerTypeRaw defer event=onupdate>  Select Case ServerTypeRaw.value
	Case 5,6,7
		BtnCancel.style.visibility = "inherit"
	Case Else
		BtnCancel.style.visibility = "hidden"
End Select</SCRIPT>
<SCRIPT language=VBScript for=cboReportDestination defer event=onclick>If (chkUL.value=1) And window.external.SecurityLevel < ULSecurityLevel Then
	If  window.external.CurrentRecordOffset >= numULReportMin  And window.external.CurrentRecordOffset <= numULReportMax Then  
		me.CancelEvent
		window.external.MessageZoneText = HigherSecurityTxt.innertext
	End If
End If</SCRIPT>
<SCRIPT language=VBScript for=HitTestRect1 defer event=onclick>' chkUL value is true if UL Listing is licenced.
' Check if the user is looking at a UL report.
If (chkUL.value=1) And window.external.SecurityLevel < ULSecurityLevel Then
	If  window.external.CurrentRecordOffset >= numULReportMin  And window.external.CurrentRecordOffset <= numULReportMax Then  
		me.CancelEvent
		window.external.MessageZoneText = HigherSecurityTxt.innertext
	Else
		If IsNumeric(bitval.value) Then
			 If bitval.value = 0 Then
				bitval.value = 1
			End If
		End If
	End If
Else
	If IsNumeric(bitval.value) Then
		 If bitval.value = 0 Then
			bitval.value = 1
		End If
	End If
End If</SCRIPT>
<SCRIPT language=VBScript for=HitTestRect2 defer event=onclick>' chkUL value is true if UL Listing is licenced.
' Check if the user is looking at a UL report.
If (chkUL.value=1) And window.external.SecurityLevel < ULSecurityLevel Then
	If  window.external.CurrentRecordOffset >= numULReportMin  And window.external.CurrentRecordOffset <= numULReportMax Then  
		me.CancelEvent
		window.external.MessageZoneText = HigherSecurityTxt.innertext
	Else
		If IsNumeric(bitval.value) Then
			 If bitval.value = 1 Then
				bitval.value = 0
			End If
		End If
	End If
Else
	If IsNumeric(bitval.value) Then
		 If bitval.value = 1 Then
			bitval.value = 0
		End If
	End If
End If</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onpagecomplete>	RecNumOnLoad = window.external.CurrentRecordOffset</SCRIPT>
<SCRIPT language=VBScript for=iReportType defer event=onupdate> 	If me.value = 0 Then
		BtnRequest.style.visibility = "hidden"
		BtnCancel.style.visibility= "hidden"
	Else
		BtnRequest.style.visibility = "inherit"
		Select Case ServerTypeRaw.value
			Case 5,6,7
				BtnCancel.style.visibility= "inherit"
			Case Else
				BtnCancel.style.visibility= "hidden"
		End Select
	End If</SCRIPT>
