<SCRIPT language=VBScript defer>'This constants are used to retrieve the appropiate value assigned for a shape in the shape file.
CONST csLEFTMOST = 1
CONST csLEFTMOST_DISABLED = 2
CONST csLEFT = 3
CONST csLEFT_DISABLED = 4
CONST csRIGHTMOST = 5
CONST csRIGHTMOST_DISABLED = 6
CONST csRIGHT = 7
CONST csRIGHT_DISABLED = 8
Dim MASKi 
'This is the global variable used to store the current index of the step to retrieve the name and time of sync cycle of it and this variable will be updated when ever the Number Threads gets updated and also when ever user click button to navigate.
dim intSelectedIndex
'This procedure is used to Enable the Right navigation button on the faceplate.
sub pbRightEnabled()
	shpRight.value = csRIGHT : shpRightMost.value = csRIGHTMOST : pbRight.Disabled = FALSE : pbRightMost.Disabled = FALSE
end sub
'This procedure is used to Disable the Right navigation button on the faceplate.
sub pbRightDisabled()
    shpRight.value = csRIGHT_DISABLED : shpRightMost.value = csRIGHTMOST_DISABLED : pbRight.Disabled = TRUE : pbRightMost.Disabled = TRUE
end sub
'This procedure is used to Enable the Left navigation button on the faceplate.
sub pbLeftEnabled()
	shpLeftMost.value = csLEFTMOST : shpLeft.value = csLEFT : pbLeftMost.Disabled = FALSE : pbLeft.Disabled = FALSE
end sub
'This procedure is used to Disable the Left navigation button on the faceplate.
sub pbLeftDisabled()
	shpLeftMost.value = csLEFTMOST_DISABLED : shpLeft.value = csLEFT_DISABLED : pbLeftMost.Disabled = TRUE : pbLeft.Disabled = TRUE
end sub
'This procedure is used display the Step Name and Step Time sync cycle by making the particular object visible and by hidding all other objects.
sub selectobjectindex()
On Error resume next
dim i, strParamValue, strPhase
	for i = 1 to 15
		document.getElementById("ConAlpExecCycleStep" & Cstr(i)).style.visibility = "hidden"
	next
	if(intSelectedIndex <> vbNullString AND intSelectedIndex <> "1.#QNAN" AND intSelectedIndex >= 1 AND intSelectedIndex <= 15) Then 
		document.getElementById("ConAlpExecCycleStep" & Cstr(intSelectedIndex)).style.visibility = "visible"
		strParamValue = document.getElementById("ConAlpSelcStepN" & Cstr(intSelectedIndex)).value

		strPhase = Split(strParamValue, ".", 2, 1)	'get point and parameter part
		If ubound(strPhase)=1 then
			txtSelectedPhase.value = CStr(strPhase(1))
		Else
			txtSelectedPhase.value = document.getElementById("ConAlpSelcStepN" & Cstr(intSelectedIndex)).value
		End If
	else
		txtSelectedPhase.value = ""
	End If
end sub
correctWidth = 0
SKIP = -1

Sub ApplyLayout()
on error resume next           
                Call AdjustHeight()
                Call AdjustWidth()
End Sub

Sub AdjustHeight()
                
                GrpLowerPanel.style.top = "" 
                GrpLowerPanel.style.bottom = "2px"
                GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 
                GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
              	 
End Sub

Sub AdjustWidth()
                Call CalculateCorrectWidth()       
                if (correctWidth <> SKIP) then                   
                    GrpUpperPanel.style.pixelwidth = correctWidth 
                    GrpCenterPanel.style.pixelwidth = correctWidth
                    GrpLowerPanel.style.pixelwidth = correctWidth 
												
                end if
End Sub

Sub CalculateCorrectWidth()
                POPUP = 0
                displayType = window.external.Application.CurrentDisplayPageType 
				CurrentPage = window.external.CurrentPage
					if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
                	
                                correctWidth = SKIP
                                Exit Sub
               		else   

               		if (page.style.zoom > 1) then   
                 		shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))                               
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                                                                                                 
                    else                                        
                         shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                         correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                

                    end if

                end if    

End Sub

sub setPageTitle(obj)
if obj.QualityBad("CurrentPoint.ACTSTATE") Then
	'Normal point
	document.title = cstr(alpTagName.value)
	if window.external.Application.Parent.WindowMode = 1 then 'Multi-window
		window.external.Application.AppWindow.SetTitleBarFormat cstr(alpTagName.value)
	end if
else
	'Activity Point
	document.title = cstr(alpTagNameAct.value)
	if window.external.Application.Parent.WindowMode = 1 then 'Multi-window
		window.external.Application.AppWindow.SetTitleBarFormat cstr(alpTagNameAct.value)
	end if
end if
End sub</SCRIPT>

	selectobjectindex()</SCRIPT>

<SCRIPT language=VBScript for=ConAlpNumThreads defer event=onupdate>on error resume next
If IsNumeric(me.value) then
   'On update of the Numthreads set the select index to 1 if select index equal to 0 and also numthreads greator than zero.
	If intSelectedIndex = 0 AND ConAlpNumThreads.value > 0 Then
		intSelectedIndex = 1
	End If
    
	'On update of the Numthreads if  numthreads less than two then disable right and left navigation  as well as set select index equal to Numthreads
	If ConAlpNumThreads.value < 2 Then
		intSelectedIndex = ConAlpNumThreads.value
		call pbLeftDisabled()
		call pbRightDisabled()
	Else
		'if  select index value greater than or equal to Numthreads then set the select index equal to numthreads and diable right navigation 
		If  intSelectedIndex >= ConAlpNumThreads.value Then 
			intSelectedIndex = ConAlpNumThreads.value
			call pbRightDisabled()	
		Else
     		'if select index less than Numthreads then enable the right navigation
			If intSelectedIndex < ConAlpNumThreads.value Then 
				call pbRightEnabled()
			End If
		End if
	End If
	'Display the updated value of global variable to the Select Step Object
	TxtSelectedStep.value = intSelectedIndex
	'This procedure will display the Step Name and Step Time sync cycle by making the particular object visible depending on Global variable and by hidding all other objects 
	call selectobjectindex()
Else 
	TxtSelectedStep.value = ""
End If</SCRIPT>

<SCRIPT language=VBScript for=pbLeftMost defer event=onclick>on error resume next
	'Set the global variable to 1
	intSelectedIndex = 1
	'Disable the left navigation
	call pbLeftDisabled()
	'Enable the Right navigation because user is in a position to click left button mean the NumThreads is definitely greater than 1
	call pbRightEnabled()
	'Display the updated value of global variable to the Select Step Object
    TxtSelectedStep.value = intSelectedIndex
	'This procedure will display the Step Name and Step Time sync cycle by making the particular object visible depending on Global variable and by hidding all other objects 
    call selectobjectindex()</SCRIPT>

<SCRIPT language=VBScript for=pbLeft defer event=onclick>on error resume next
	'Decrement the step index by 1
	intSelectedIndex = intSelectedIndex - 1
	'If step index is reached 1 then disable the left navigation
	if IntSelectedIndex = 1 then 
		call pbLeftDisabled()
	end if
	'Enable the Right navigation because user is in a position to click left button mean the NumThreads is definitely greater than 1
	call pbRightEnabled()
	'Display the updated value of global variable to the Select Step Object
    TxtSelectedStep.value = intSelectedIndex
	'This procedure will display the Step Name and Step Time sync cycle by making the particular object visible depending on Global variable and by hidding all other objects 
	call selectobjectindex()</SCRIPT>

<SCRIPT language=VBScript for=pbRight defer event=onclick>on error resume next
	'Increment the step index
	intSelectedIndex = intSelectedIndex + 1
	'If step index is equal to NumThreads then disable the right navigation as step index can not be greater than NumThreads because the moment step index is equal to NumThread right navigation is disabled
	if intSelectedIndex = ConAlpNumThreads.value then 
		call pbRightDisabled()
	end if
	'Enable the Left navigation because user is in a position to click Right button mean the NumThreads is definitely greater than 1
	call pbLeftEnabled()
	'Display the updated value of global variable to the Select Step Object
    TxtSelectedStep.value = intSelectedIndex
	'This procedure will display the Step Name and Step Time sync cycle by making the particular object visible depending on Global variable and by hidding all other objects 
	call selectobjectindex()</SCRIPT>

<SCRIPT language=VBScript for=pbRightMost defer event=onclick>on error resume next
	'Set the step index to NumThread as it is the possible max value
	intSelectedIndex = ConAlpNumThreads.value
	'Disable the Right navigation
	call pbRightDisabled()
	'Enable the Left navigation because user is in a position to click Right button mean the NumThreads is definitely greater than 1
	call pbLeftEnabled()
	'Display the updated value of global variable to the Select Step Object
    TxtSelectedStep.value = intSelectedIndex
	'This procedure will display the Step Name and Step Time sync cycle by making the particular object visible depending on Global variable and by hidding all other objects 
    call selectobjectindex()</SCRIPT>

<SCRIPT language=VBScript for=txtSelectedPhase defer event=onfocus>on error resume next

	document.getElementById("ConAlpSelcStepN" & Cstr(intSelectedIndex)).focus

<SCRIPT language=VBScript for=sd defer event=ondatachange>on error resume next
if not me.QualityBad("CurrentPoint.LocationFullItemName") then
' The above condition checks if the point is bad (SCM's server point deleted or Activity is removed
	if me.QualityBad("CurrentPoint.ACTSTATE") then
		' current point is an RCM/SCM
		txtAssociatedPoint.style.visibility = "hidden"
		alphaTagName.style.pixeltop = txtAssociatedPoint.style.pixeltop
		ConAlpDescription.style.pixeltop = 25
		ConAlpDescription.style.pixelheight = 48
        ActCommand.style.visibility = "Hidden"
		ActStage.style.visibility = "Hidden"
		Actstate.style.visibility = "Visible"
		displaydatarepository.PutValue "NameParam", "Name"
		displaydatarepository.PutValue "PointName", me.DataValue("CurrentPoint.Name")
	else
		' current point is an activity	
		txtAssociatedPoint.style.visibility = "visible"
		alphaTagName.style.pixeltop = 20
		ConAlpDescription.style.pixeltop = 41
		ConAlpDescription.style.pixelheight = 32
        ActCommand.style.visibility = "Visible"
		ActStage.style.visibility = "Visible"
		Actstate.style.visibility = "Visible"
		displaydatarepository.PutValue "NameParam", "ACTENTITY"
		if me.DataValue("CurrentPoint.ACTSTATE")<> 16 then
			' activity is not executing
			Actstate.style.visibility = "Hidden"
			Actstage.style.pixeltop = Actstate.style.pixeltop
		else
			' activity is executing
			displaydatarepository.PutValue "PointName", me.DataValue("CurrentPoint.ACTENTITY")
			Actstate.style.visibility = "Visible"
			Actstage.style.pixeltop = LinStage.style.pixeltop

		end if
	end if
end if</SCRIPT>
