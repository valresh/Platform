<SCRIPT language=VBScript for=ConAlpPVEULo defer event=ondatachange>if not me.QualityBad("TagName.{%PCOUTFBName%}.{%VarName%}({%VarIndex%}).LOWLIMIT") and not me.QualityBad("TagName.{%PCOUTFBName%}.{%VarName%}({%VarIndex%}).HIGHLIMIT")  then

<SCRIPT language=VBScript for=alpTURNONOFF defer event=onupdate>if not me.QualityBad("Tagname.{%PCFBName%}.TURNONOFF") then

<SCRIPT language=VBScript defer>Public Sub ApplyLayout()

	GrpLowerPanel.Style.Top = vbNullString

	GrpLowerPanel.Style.bottom = "2px"

	GrpCenterPanel.Style.Top = GrpUpperPanel.Style.pixelTop + GrpUpperPanel.Style.pixelHeight + 2

	GrpCenterPanel.Style.bottom = (GrpLowerPanel.Style.pixelHeight + 15) & "px"

	GrpCenterPanel.Style.pixelHeight = Page.Style.pixelHeight - GrpLowerPanel.Style.pixelHeight - 	GrpUpperPanel.Style.pixelHeight - 10

	If Window.external.Application.CurrentDisplayPageType = 10 Then

		grpEU.style.PosTop = ConIndPV.style.posTop - 2

	end if

End Sub</SCRIPT>

<SCRIPT language=VBScript for=alpStatus defer event=onupdate>' MV status applicable are: Available, Not Available, Not Controllable, Nearing Limit, Voilating Limit, Windup-Hi, Windup-Lo
if  not me.QualityBad("TagName.{%PCOUTFBName%}.{%VarName%}({%VarIndex%}).STATUSDISPLAY") then
	strStatus = ucase(me.DataValue("TagName.{%PCOUTFBName%}.{%VarName%}({%VarIndex%}).STATUSDISPLAY"))
	strStatusColor = me.DataValue("Tagname.{%PCOUTFBName%}.{%VarName%}({%VarIndex%}).VALUE_C")
	rem is status mode is normal
	if strStatus = 0 or strStatus = 1 or strStatus = 6 then
		if (strStatusColor = 3) then
			rem set status state to Nearing Limit
			imgWindup.style.visibility = "Hidden"
			imgWindupLo.style.visibility = "Hidden"
			imgWindupHi.style.visibility = "Hidden"
			imgViolatingLimit.style.visibility = "Hidden"
			imgNearingLimit.style.visibility = "Inherit"
			imgNotControllable.style.visibility = "Hidden"
			imgNotAvailable.style.visibility = "Hidden"
			imgAvailable.style.visibility = "Hidden"
		elseif (strStatusColor = 0) then
				rem set status state to Voilating Limit
			imgWindup.style.visibility = "Hidden"
			imgWindupLo.style.visibility = "Hidden"
			imgWindupHi.style.visibility = "Hidden"
			imgViolatingLimit.style.visibility = "Inherit"
			imgNearingLimit.style.visibility = "Hidden"
			imgNotControllable.style.visibility = "Hidden"
			imgNotAvailable.style.visibility = "Hidden"
			imgAvailable.style.visibility = "Hidden"
		else
				rem set status state to available
			imgWindup.style.visibility = "Hidden"
			imgWindupLo.style.visibility = "Hidden"
			imgWindupHi.style.visibility = "Hidden"
			imgViolatingLimit.style.visibility = "Hidden"
			imgNearingLimit.style.visibility = "Hidden"
			imgNotControllable.style.visibility = "Hidden"
			imgNotAvailable.style.visibility = "Hidden"
			imgAvailable.style.visibility = "Inherit"
		end if
	elseif strStatus = 4 or strStatus = 5  or strStatus = 8 or strStatus = 9 then
		rem set status state to not controlable
			imgWindup.style.visibility = "Hidden"
			imgWindupLo.style.visibility = "Hidden"
			imgWindupHi.style.visibility = "Hidden"
			imgViolatingLimit.style.visibility = "Hidden"
			imgNearingLimit.style.visibility = "Hidden"
			imgNotControllable.style.visibility = "Inherit"
			imgNotAvailable.style.visibility = "Hidden"
			imgAvailable.style.visibility = "Hidden"
	elseif strStatus = 2 then
		rem set status state to wind up hi
			imgWindup.style.visibility = "Hidden"
			imgWindupLo.style.visibility = "Hidden"
			imgWindupHi.style.visibility = "Inherit"
			imgViolatingLimit.style.visibility = "Hidden"
			imgNearingLimit.style.visibility = "Hidden"
			imgNotControllable.style.visibility = "Hidden"
			imgNotAvailable.style.visibility = "Hidden"
			imgAvailable.style.visibility = "Hidden"
	elseif strStatus = 3 then
		rem set status state to wind up Low
			imgWindup.style.visibility = "Hidden"
			imgWindupLo.style.visibility = "Inherit"
			imgWindupHi.style.visibility = "Hidden"
			imgViolatingLimit.style.visibility = "Hidden"
			imgNearingLimit.style.visibility = "Hidden"
			imgNotControllable.style.visibility = "Hidden"
			imgNotAvailable.style.visibility = "Hidden"
			imgAvailable.style.visibility = "Hidden"
	else
		'Default is not avilable
			imgWindup.style.visibility = "Hidden"
			imgWindupLo.style.visibility = "Hidden"
			imgWindupHi.style.visibility = "Hidden"
			imgViolatingLimit.style.visibility = "Hidden"
			imgNearingLimit.style.visibility = "Hidden"
			imgNotControllable.style.visibility = "Hidden"
			imgNotAvailable.style.visibility = "Inherit"
			imgAvailable.style.visibility = "Hidden"
	end if
end if</SCRIPT>
