Dim bPageInitialized
Dim sBoxPointName

bPageInitialized = FALSE
sBoxPointName = "TBD" 'format is $NMnnNnn, e.g., $NM<NTWKNUM>N<NODENUM>" and parameter is array NN(1..4095) for box numerics


Sub UpdatePage()
' This routine drives the box-point name to the shapes that pick up 
' the HPM node parameters with format $NM<netwk>B<box> e.g. $NM01B09
' On the faceplate, these are COMCFAVG "Comm CPU" and CTLCFAVG "Controller CPU"
	shpcomcfavg.autoReloadContent = FALSE
	shpctlcfavg.autoReloadContent = FALSE

	if bPageInitialized = FALSE then
		window.external.parent.logmessage "driving sBoxPointName to shape: >>" & sBoxPointName & "<<"

		shpcomcfavg.SetCustomProperty "point", "boxpoint", sBoxPointName
		shpcomcfavg.ReloadContent
		shpcomcfavg.autoReloadContent = TRUE
		shpcomcfavg.style.visibility = "Inherit"

		shpctlcfavg.SetCustomProperty "point", "boxpoint", sBoxPointName
		shpctlcfavg.ReloadContent
		shpctlcfavg.autoReloadContent = TRUE
		shpctlcfavg.style.visibility = "Inherit"
		bPageInitialized = TRUE
	end if 

end sub


' below is from C300 Faceplate, in common wiht EHPM node faceplate


correctWidth = 0
SKIP = -1

Sub ApplyLayout()           
                Call AdjustHeight()
                Call AdjustWidth()
End Sub

Sub AdjustHeight()
                
                GrpLowerPanel.style.top = "" 
                GrpLowerPanel.style.bottom = "2px"
                GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 
                GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
              	 
End Sub

Sub AdjustWidth()
                Call CalculateCorrectWidth()       
                if (correctWidth <> SKIP) then                   
                    GrpUpperPanel.style.pixelwidth = correctWidth 
                    GrpCenterPanel.style.pixelwidth = correctWidth
                    GrpLowerPanel.style.pixelwidth = correctWidth 
												
                end if
End Sub

Sub CalculateCorrectWidth()
                POPUP = 0
                displayType = window.external.Application.CurrentDisplayPageType 
				CurrentPage = window.external.CurrentPage
					if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
                	
                                correctWidth = SKIP
                                Exit Sub
               		else   

               		if (page.style.zoom > 1) then   
                 		shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))                               
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                                                                                                 
                    else                                        
                         shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                         correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                

                    end if

                end if    

End Sub</SCRIPT>
