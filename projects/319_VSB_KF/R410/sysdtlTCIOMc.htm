<SCRIPT language=VBScript for=pbChkpntHelp001 defer event=onclick>on error resume next
Dim NumSig
NumSig=0
If (len(sd.DataValue("CurrentPoint.PrimarySignatureMeaning"))) <> 255  Then
	NumSig=1
End If
If NumSig=1 And len(sd.DataValue("CurrentPoint.SecondarySignatureMeaning")) <> 255  Then
	NumSig=2
End If

Dim strPointID
strPointID = CStr(window.external.DetailPointID)
Dim strServer
strServer = CStr(window.external.DetailPointServerNetworkName)
Dim strSecuirtyLevel
strSecuirtyLevel = CStr(window.external.SecurityLevel)
Dim strOperatorID
strOperatorID = CStr(window.external.OperatorID)
Dim strServerName
strServerName = CStr(window.external.ServerName)
Dim strStationNumber
strStationNumber = CStr(window.external.StationNumber)
Dim strESig
strESig = CStr(ESig.value)
'Dim strControlConfirm
'strControlConfirm = CStr(CtrlConfirmProp.calue)
Dim strNumSig
strNumSig = CStr(NumSig)

set oShell = window.external.CreateWhitelistedObject("Wscript.shell",1)
sRegKey = "HKEY_LOCAL_MACHINE\SOFTWARE\Wow6432Node\Honeywell\TPS50\InstallInfo\INSTALLDIR"
sRegValue = oShell.RegRead(sRegKey)
sRegValue= sRegValue & "\system\bin\CBHelp.chm::/Appendix_F__Control_Builder_Checkpoint_Reference-cb_g.html"
sRegValue="mk:@MSITStore:C:\" & sRegValue
window.showHelp(sRegValue)</SCRIPT>

<SCRIPT language=VBScript for=pbRestoreChkpnt001 defer event=onclick>on error resume next
Dim NumSig
NumSig=0
If (len(sd.DataValue("CurrentPoint.PrimarySignatureMeaning"))) <> 255  Then
	NumSig=1
End If
If NumSig=1 And len(sd.DataValue("CurrentPoint.SecondarySignatureMeaning")) <> 255  Then
	NumSig=2
End If

Dim strPointID
strPointID = CStr(window.external.DetailPointID)
Dim strServer
strServer = CStr(window.external.DetailPointServerNetworkName)
Dim strSecuirtyLevel
strSecuirtyLevel = CStr(window.external.SecurityLevel)
Dim strOperatorID
strOperatorID = CStr(window.external.OperatorID)
Dim strServerName
strServerName = CStr(window.external.ServerName)
Dim strStationNumber
strStationNumber = CStr(window.external.StationNumber)
Dim strESig
strESig = CStr(ESig.value)

Dim strNumSig
strNumSig = CStr(NumSig)
if strServer <> " " then	
	Dim strPath
	strPath = "ChkptUIWrapper.exe " & strPointID & " " & strServer & " " & strSecuirtyLevel & " " & strOperatorID & " " & strServerName & " " & strStationNumber & " " & strESig & " " & strNumSig & " " & "ID_RESTORE"
	window.external.CreateWhitelistedObject strPath,0
End if</SCRIPT>
