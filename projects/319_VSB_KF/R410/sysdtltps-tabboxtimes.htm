Sub InitPort(objPort, sKey)
Dim sPath
Dim sDebugStr
Dim sTest

'	window.external.Parent.LogMessage "sysdtlswitch_oneportstatus.sha - InitPort TOP..."
	on error resume next  

	sPath = "localhost.[ROOT\SNMP\" & sSwitchName & "].SNMP_RFC1213_MIB_IFTABLE." & sKey

	sTest = objPort.GetCustomProperty("Value", "valuePortKey")
	if sTest = sKey then
' 		Debug/keep
'		window.external.Parent.LogMessage "InitPort - sKey already set for: " & sKey & ", NOT calling SetCustomProperty for this port's custom parameters"
	else

		objPort.autoReloadContent = false
		objPort.SetCustomProperty "Parameter", "paramOperStatus", sPath & ".ifOperStatus"
		objPort.SetCustomProperty "Parameter", "paramPortDescr", sPath & ".ifDescr"
		objPort.SetCustomProperty "Parameter", "paramPortSpeed", sPath & ".ifSpeed"
		objPort.SetCustomProperty "Parameter", "paramPortIndex", sPath & ".ifIndex"
		objPort.SetCustomProperty "Value", "valuePortKey", sKey
		objPort.SetCustomProperty "Point", "pointPort", sPoint

'Debug/keep
		'window.external.Parent.LogMessage "InitPort - sPath= " & sPath
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramOperStatus")
		'window.external.Parent.LogMessage "InitPort - paramOperStatus= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortDescr")
		'window.external.Parent.LogMessage "InitPort - paramPortDescr= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortSpeed")
		'window.external.Parent.LogMessage "InitPort - paramPortSpeed= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortIndex")
		'window.external.Parent.LogMessage "InitPort - paramOperStatus= " & sDebugStr
		'window.external.Parent.LogMessage "sysdtlswitch_oneportstatus.sha - InitPort bottom, calling .ReloadContent on single port..."
		objPort.ReloadContent

	end if

end sub


Sub PDC(objVal, nCol)
Dim sKey

'	window.external.Parent.LogMessage "oneportstatus - PDC TOP..."
	on error resume next ' hides script error, possibly addressed by above change to throttle .ReloadContent calls

	sKey = objVal.parentElement.parentElement.GetCustomProperty("Value", "valuePortKey")

'	window.external.Parent.LogMessage "... PDC sKey=" & sKey

	if sKey = "" then exit sub


	if IsStsGoodQuality(objVal) then 
'		window.external.Parent.LogMessage "oneportstatus - PDC IsStsGoodQuality GOOD, calling PortDataChange..."
		PortDataChange sKey, nCol, objVal.value
'	else
'		window.external.Parent.LogMessage "oneportstatus - PDC IsStsGoodQuality BAD - NOT calling PortDataChange"
	end if

End Sub

Sub PDC100000(objVal)
Dim sKey

	on error resume next
	sKey = objVal.parentElement.parentElement.GetCustomProperty("Value", "valuePortKey")
	if sKey = "" then exit sub
	if IsStsGoodQuality(objVal) then PortDataChange sKey, 0, objVal.value + 100000

End Sub

' End General Section (sysdtlswitch_oneportstatus.sha)

sub UpdateLabels(nStartIdx)
	dim nIdx
	dim nIdx2
	dim nCounter
	dim nCounter2
	dim sTempObj
	dim sNVal
	dim sNVal2
	dim sNVal3

	nIdx2 = nStartIdx

	txtLoading.style.visibility = "Hidden" 
	if nStartIdx = 1 then
		sNVal = "T00"
		sNVal2 = "T000" ' for values 1..9 only
	elseif nStartIdx < 1000 then ' values less than 1000 
		sNVal = "T0" 'e.g. N0100
		sNVal3 = "T00"
	else
		sNVal = "T"  'e.g. N1000
	end if
	
	if g_nNTIME = 0 then
		msgbox "g_nNTIME not initialized!!!!"
		exit sub
	end if

	'update labels, requires autoReloadContent TRUE
	nCounter2 = nCounter 'only show up to actual count of values shown this page (last is 40)
	nCounter = 0
	do until nCounter => 80 or nIdx2 > g_nNTIME

		nCounter = nCounter + 1  '1..80 iterator
		sTempObj = "textbox" & nCounter
		if nStartIdx = 1 then
			if nCounter < 10 then
'			window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
				shpBoxTimes.Objects(sTempObj).value = sNVal2 & nIdx2 & ":"
			else
				shpBoxTimes.Objects(sTempObj).value = sNVal & nIdx2 & ":"
			end if
		elseif nStartIdx = 81 then
			if nCounter < 20 then
'			window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal & nIdx2 & "<<"
				shpBoxTimes.Objects(sTempObj).value = sNVal3 & nIdx2 & ":"
			else
				shpBoxTimes.Objects(sTempObj).value = sNVal & nIdx2 & ":"
			end if
		else
			shpBoxTimes.Objects(sTempObj).value = sNVal & nIdx2 & ":"
		end if		

		nIdx2 = nIdx2 + 1

	loop

'msgbox "Done updating labels, nCounter = " & nCounter

end sub

Function UpdatePage()

'repopulate shpBoxTimes

	dim nCounter
	dim sTempObj
	dim sParamName
	dim sParamNameDur
	dim sNN
	dim sNND
	dim nNumPages
	dim sPage
	dim sNNObject
	dim nCharIdx
	dim sTimeObject
	dim sDurObject
	dim nTempMax
	dim nIdx
	dim nIdx2

	if combo_pages.value = g_sPage then exit Function ' don't reload same 

	g_sPage = combo_pages.value
	sPage = combo_pages.value
	window.clearInterval(intTimerID)
	if g_nNTIME = 0 then 'not yet initialized, leave at page max
		nTempMax = 80
		window.external.parent.logmessage "g_nNTIME not initialized, set to: " & g_nNTIME
	else
		nTempMax = g_nNTIME
	end if

'	window.external.parent.logmessage "g_nNTIME = " & g_nNTIME
	if Left(sPage, 5) = "Combo" then  
		nIdx = 1	'as yet combo_pages is uninitialized
	else
		' trim e.g. "(101-200)" from string "PAGE 2 (101-200)"
		nCharIdx = Instr(sPage, "(") 'type (skip past) there better be a space!
		sPage = Left(sPage, nCharIdx-2)
		'now trim off "PAGE"
		sPage =  Right(sPage, LEN(sPage)-5)  'i.e. just the number part
		if sPage <> "1" then
			nIdx = ((sPage-1) * 80) + 1 'page 2 is 81-160, page 22 is ...
		else
			nIdx = 1
		end if

	end if

	nIdx2 = nIdx 'for "Nnnnn" label updates
'	window.external.parent.logmessage "nIdx = >>" & nIdx & "<<"
	nCounter = 0 'again

	shpBoxTimes.autoReloadContent = FALSE
	if not g_bPageInitialized then
'		window.external.parent.logmessage "driving sBoxPointName to shape: >>" & sBoxPointName & "<<"

		if not ((sdTabInfo.DataValue("CurrentPoint.PNTTYPE") = "ARRAY" or sdTabInfo.DataValue("CurrentPoint.ENT_TYPE") = "ARRAY") and (sdTabInfo.DataValue("CurrentPoint.NODETYP") = "HPM" or sdTabInfo.DataValue("CurrentPoint.NODETYP") = "APM")) then
			combo_pages.style.visibility = "Inherit"
			combo_pages.value = "PAGE 1 (1-80)" 'to avoid unsightly "Combobox" display
		end if

		shpBoxTimes.SetCustomProperty "point", "boxpoint", sBoxPointName
	end if 

	txtLoading.style.visibility = "Inherit"

	do until nCounter >= 80 or nIdx > nTempMax  'drive up to 80 (full page) params, but only up to count of actual valid parameters on this page
		nCounter = nCounter + 1  '1..80 iterator
		sParamName = "param" & nCounter		
		sParamNameDur = "paramDur" & nCounter
		sNN = "TIME(" & nIdx & ")"
		sNND = "TIME(" & nIdx & ").DURATION"
'		window.external.parent.logmessage "sNN is >>" & sNN & "<<"
'		window.external.Parent.LogMessage "SetCustom, param >>" & sNN & "<<, nCounter:>>" & nCounter & "<<, sTempObj:>>" & sTempObj & "<<, sParamName: >>" & sParamName & "<<"
		shpBoxTimes.SetCustomProperty "parameter", sParamName, sNN		'regular time version
		shpBoxTimes.SetCustomProperty "parameter", sParamNameDur, sNND  	'duration version (< 1000 days)
		nIdx = nIdx + 1 'bumping e.g. N0100 to N0101
	loop

	g_nParamsThisPage = nCounter 'used by shape when hiding/showing times vs. durations

	shpBoxTimes.ReloadContent	'this will cause boxtimes shape alp_NTIME to get an OnDataChange to update visibility of times, (durations vs. times)
	shpBoxTimes.autoReloadContent = TRUE

	if bArrayPoint then
		call UpdateLabels(nIdx2) ' we always know for array points since NTIME is local
		g_bPageInitialized = TRUE
	elseif not g_bPageInitialized then ' don't know how many items yet, so don't update labels
		g_bPageInitialized = TRUE
	else
		call UpdateLabels(nIdx2)
	end if

end Function

sub UpdatePageCount(nCount)
' Populate the "Pages" combobox;  count is number of parameters, there is one page per 100 parameters

	dim nPages
	dim nIndex
	dim nMod
	dim nFromVal
	dim nToVal
	dim nPagesRounded

	if nCount = -1 then 'NTIME is "NaN"
		combo_pages.style.visibility = "Hidden"
		txtLoading.style.visibility = "Hidden" 'hide the "Reading Box Data" text - no values to read
		exit sub
	end if

	g_nNTIME = nCount

	if bPagesCounted then 
		exit sub
	end if

	UpdateLabels(1)

'	window.external.parent.logmessage "Count of box Times is: " & nCount
	combo_pages.ResetContent

	bPagesCounted = TRUE
	if nCount < 81 then 
		combo_pages.AddString "PAGE 1 (1-" & nCount & ")"
		combo_pages.value = "PAGE 1 (1-" & nCount & ")"
		combo_pages.style.visibility = "Inherit"
		combo_pages.disabled = TRUE
		exit sub ' just one page
	else
		combo_pages.AddString "PAGE 1 (1-80)"
		combo_pages.value =   "PAGE 1 (1-80)"
	end if

	nPages = (nCount / 80)

	nPagesRounded = Round(nPages)
	if nPages < nPagesRounded then 
		nPages = nPagesRounded
	elseif nPages > nPagesRounded then
		nPages = nPagesRounded + 1
	end if
		


'	nPages = nPages - nMod
	nIndex = 2 'adding begins with PAGE 2

'	window.external.parent.logmessage "update page count: " & nPages
	
	'while programs support upto 16k sized arrays, LCN only supports transmission of 4095 parameters.
	'so, limit number of 100ea pages to 41
	if nPages > 41 then 
		nPages = 41
	end if

	do until nIndex > nPages
		nFromVal = (80 * (nIndex-1)) + 1
		nToVal = 80 * nIndex
		if nToVal > g_nNTIME and g_nNTIME > 0 then nToVal = g_nNTIME
		combo_pages.AddString "PAGE " & nIndex & " (" & nFromVal & "-" & nToVal & ")"
'		combo_pages.value =  "PAGE " & nIndex & " (" & nFromVal & "-" & nToVal & ")"
		nIndex = nIndex + 1
	loop

	combo_pages.style.visibility = "Inherit"
	g_sLastPageShown = combo_pages.value

end sub

	if window.external.Parent.RuntimeStatus.isconsolestation and me.QualityGood("CurrentPoint.LocalPointType") and me.DataValue("CurrentPoint.LocalPointType") = "PSA" then 
		GrpNativeWindow.style.visibility = "Visible"
	else
		GrpNativeWindow.style.visibility = "Hidden"
	end if

	if (sdTabInfo.DataValue("CurrentPoint.PNTTYPE") = "ARRAY" or sdTabInfo.DataValue("CurrentPoint.ENT_TYPE") = "ARRAY") and (sdTabInfo.DataValue("CurrentPoint.NODETYP") = "HPM" or sdTabInfo.DataValue("CurrentPoint.NODETYP") = "APM") then
		bArrayPoint = TRUE
		sBoxPointName = sdTabInfo.DataValue("CurrentPoint.NAME")
	elseif me.QualityGood("CurrentPoint.NTWKNUM") and me.QualityGood("CurrentPoint.NODENUM") then

		if me.DataValue("CurrentPoint.NTWKNUM") < 10 then
			sFirstNum = "0" & me.DataValue("CurrentPoint.NTWKNUM")
		else
			sFirstNum = me.DataValue("CurrentPoint.NTWKNUM")
		end if
		if me.DataValue("CurrentPoint.NODENUM") < 10 then
			sSecondNum = "0" & me.DataValue("CurrentPoint.NODENUM")
		else
			sSecondNum = me.DataValue("CurrentPoint.NODENUM")
		end if

		sBoxPointName = "$NM" & sFirstNum & "N" & sSecondNum
'		window.external.parent.logmessage "sBoxPointName is: >>" & sBoxPointName & "<<"
	end if

	if not g_bPageInitialized then
'		window.external.parent.logmessage "OnDataChange - calling initial UpdatePage"
		intTimerID = window.setInterval ("UpdatePage", 50) 'LEAVE THIS DELAY (variable update from BOX point needed prior to call)
'	  	call UpdatePage()
	end if</SCRIPT>

        //------------------------------------------------------------------------

        // CreateExtensionDiv

        //------------------------------------------------------------------------

        // <summary>

        // Creates a single div in the specified parent element with the specified

        // styles and attributes.

        // </summary>

        // <param name="extId">The ID for the new div.</param>

        // <param name="extClass">The class(es) for the new div.</param>

        // <param name="extXStyle">The style used to give the div its horizontal position ('left' or 'right')</param>

        // <param name="extXPos">The expression for the div's horizontal position.</param>

        // <param name="extYStyle">The style used to give the div its vertical position ('top or 'bottom')</param>

        // <param name="extYPos">The expression for the div's vertical position.</param>

        // <param name="extWidth">The expression for the div's width.</param>

        // <param name="extHeight">The expression for the div's height.</param>

        // <param name="extDisplay">The expression for the div's display style - null or '' if this is not needed.</param>

        // <param name="objExtParent">The element to insert the new div as a child of.</param>

        // <returns>

        // true if the div was created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateExtensionDiv(extId, extClass, extXStyle, extXPos, extYStyle, extYPos, extWidth, extHeight, extDisplay, objExtParent)

        {

          try

          {

            var objExt = window.document.getElementById(extId);

            if (objExt == null)

            {

              objExt = window.document.createElement("div");

              objExt.id = extId;

              objExt.className = extClass;

              objExt.style.position = "absolute";

              objExt.style.overflow = "hidden";

              objExt.style.setExpression(extXStyle, extXPos, "JavaScript");

              objExt.style.setExpression(extYStyle, extYPos, "JavaScript");

              objExt.style.setExpression("width", extWidth, "JavaScript");

              objExt.style.setExpression("height", extHeight, "JavaScript");

              if (typeof(extDisplay) == "string" && extDisplay.length > 0)

              {

                objExt.style.setExpression("display", extDisplay, "JavaScript");

              }

              

              // Insert the new extension div into the proper location in a seperate thread, so that

              // the time it takes doesn't delay the calculation of the size and location of the

              // other extensions. This also breaks out of the onreadystatechange handler thread before

              // mucking around with the DOM, which could potentially change the readyState again.

              window.setTimeout(function(){ objExtParent.appendChild(objExt); }, 5);

            }

            return true;

          }

          catch(e)

          {

            alert("Exception creating background extension '" + extId + "': " + (typeof(e) == "string" ? e : e.description));

          }

          return false;

        }

        

        //------------------------------------------------------------------------

        // CreateBackgroundExtensions

        //------------------------------------------------------------------------

        // <summary>

        // Create empty elements inside the background that match the colored

        // parts of the shape to give the impression that the Page stretches

        // all the way to the edges of the Background.

        // </summary>

        // <returns>

        // true if the extensions were created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateBackgroundExtensions()

        {

          try

          {

              var objPage = window.document.getElementById("Page");

              var objBackground = window.document.getElementById("Background");      

              if (objPage == null || objBackground == null)

              {

                return false;

              }

                                          

              // Extend the TitleBar on the right-hand edge

              CreateExtensionDiv("bgTitleBar", "TitleBar", 

                                  "right", "'0px'", "top", "'0px'", 

                                  "Background.clientWidth - Page.offsetWidth", 

                                  "TitleBarBackground.offsetHeight", 

                                  null, objBackground);

              

              // Extend the TabSet on the right-hand edge.

              CreateExtensionDiv("bgTabSet", "TabSet", 

                                  "right", "'0px'", "top", "TitleBarBackground.offsetHeight", 

                                  "Background.clientWidth - Page.offsetWidth", "TabSetBackground.offsetHeight", 

                                  "TabSetBackground.currentStyle.display", objBackground);

              

              // Extend the NavPane on the bottom edge.



              CreateExtensionDiv("bgNavPane", "NavPane NavPaneFP",

                                   "left", "'0px'", "bottom", "'0px'", 

                                   "NavPane.offsetWidth", "Background.clientHeight - Page.offsetHeight", 

                                   null, objBackground);



              return true;

          }

          catch(e)

          {

             alert("Exception creating background extensions: " + (typeof(e) == "string" ? e : e.description));

          }  

          return false;

        }

        



      </SCRIPT>

<SCRIPT language=JavaScript for=shpBkground defer event=onshapeload>

        // Move the shape to take up the whole page.

        this.style.left = "0px";

        this.style.top = "0px";

        this.style.setExpression("width", "Page.clientWidth", "JavaScript");

        this.style.setExpression("height", "Page.clientHeight", "JavaScript");

        

        // Adjust the sizes of page elements that depend on whether the tabs and action bar are shown.

        var showTabs = "true" == "true";

        

        TabSetBackground.style.display = (showTabs ? "block" : "none");

        PageEdge.style.display = "none";

        DisplayAreaBackground.className = (showTabs ? "" : "NoTabs");

        DetailsAreaBackground.className = "NoActionBar DetailsArea";

        LeftBar.className = "";

       

                   

        // Ensure that the background-extensions get added to the DOM.

        // Make sure the object that extends the NavPane to the edge of the display will be created,

        // and that the menu-elements generated only after the window has finished loading. This is

        // because Bad Things happen if you muck with the DOM before it's fully parsed.

        if (!CreateBackgroundExtensions())

        {

          document.attachEvent("onreadystatechange", CreateBackgroundExtensions);

        }

<SCRIPT language=VBScript for=shpBoxTimes_alp_NTIME defer event=ondatachange>	dim nIndex
	dim sMyPointParamName
	dim sTimeObject
	dim sTimeDurObject

	nIndex = 0
'	window.external.parent.logmessage "boxtimes shpBoxTimes_alp_NTIME, gParamsThisPage: " & gParamsThisPage

'	if not bTimesSet then
'		if not bArrayPoint then 
	g_nNTIME = me.DataValue("boxpoint.NTIME") 'pick up from 'box point' else picked up in UpdatePage (for Array points) from point itself
'			window.external.parent.logmessage "NOT array point - setting nTimes to: " & nTimes
'			bTimesSet = TRUE
'		end if
'	end if

	if me.QualityGood("boxpoint.TIMESTIX") then
		shpBoxTimes_txt_TIMESTIX.value = me.DataValue("boxpoint.TIMESTIX")
		shpBoxTimes_txt_TIMESTIX.style.visibility = "Inherit"
'		shpBoxTimes_txt_labelTIMESTIX.style.visibility = "Inherit"
	end if

	if me.QualityGood("boxpoint.TIMEDESC") then
		shpBoxTimes_txt_TIMEDESC.value = me.DataValue("boxpoint.TIMEDESC")
	end if

	do while nIndex < 80 'and nIndex < g_nNTIME 'nTimes being the total count
		nIndex = nIndex + 1
		sMyPointParamName = "boxpoint.param" & nIndex
		sTimeObject = "alp_TIME" & nIndex
		sTimeDurObject = "alp_TIMEDur" & nIndex

		if nIndex > g_nParamsThisPage or not me.QualityGood(sMyPointParamName)then
			call HideThisObject(sTimeDurObject)
			call HideThisObject(sTimeObject)
		elseif me.DataValue(sMyPointParamName) < 29856 then 'its a duration
			call ShowThisObject(sTimeDurObject)
			call HideThisObject(sTimeObject)
		else
			call HideThisObject(sTimeDurObject)
			call ShowThisObject(sTimeObject)
		end if
	loop</SCRIPT>

<SCRIPT language=VBScript for=shpBoxTimes_alp_NTIME defer event=onupdate>'	window.external.Parent.logmessage "shpBoxTimes_alp_NTIME OnUpdate to value: " & me.value

	if me.value <> "NaN" then
		shpBoxTimes_txt_NTIME.style.visibility = "Inherit"
		shpBoxTimes_txt_NTIME.value = me.value
		if me.value > 0 then
			call UpdatePageCount(me.value) 'now that we have the box numeric count, populate the combobox accordingly
		end if

	else
		call UpdatePageCount (-1)  ' just to kill the "Reading Box Data" text
	end if</SCRIPT>
