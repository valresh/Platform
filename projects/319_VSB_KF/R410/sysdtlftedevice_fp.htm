<SCRIPT language=VBScript for=ItemName defer event=onupdate>DIM sPartPath
'	msgbox "In " & me.id & ": itemname=" & me.value
	if NOT IsStsGoodQuality(me) then exit sub
	sPdTag = me.value
	shpFteDevice.autoReloadContent = false
	if sPdTag <> "" then
		sPartPath = "localhost.[ROOT\HONEYWELL].TPS_FTENODE.PDTAG=""" & sPdTag & """."
		shpFteDevice.SetCustomProperty "Point", "FteDevicePoint", alphaPointName.value
		shpFteDevice.SetCustomProperty "Parameter", "paramDeviceIndex", sPartPath & "DeviceIndex"
		shpFteDevice.SetCustomProperty "Parameter", "paramCompStatus", sPartPath & "CompositeStatus"
	else
		shpFteDevice.SetCustomProperty "Point", "FteDevicePoint", ""
		shpFteDevice.SetCustomProperty "Parameter", "paramDeviceIndex", ""
		shpFteDevice.SetCustomProperty "Parameter", "paramCompStatus", ""
	end if
	shpFteDevice.ReloadContent</SCRIPT>

<SCRIPT language=VBScript defer>'
' General Section (sysdtlftedevice_fp.htm)
option explicit
DIM sPdTag
DIM sLocalServer
DIM sInitFlag

sub ApplyLayout()
	on error resume next
	GrpLowerPanel.style.top = ""
	GrpLowerPanel.style.bottom = "2px" '"15px"
	PicBackground.style.pixelWidth = Page.style.pixelWidth + 2
	PicBackground.style.pixelHeight = Page.style.pixelHeight + 6
	GrpCenterPanel.style.top= (GrpUpperPanel.style.pixelHeight + 15) & "px"
	GrpCenterPanel.style.bottom = ""
	' Comment out the following line if you don’t want the center panel to be stretched (e.g. on sysdtlsta)
'	GrpCenterPanel.style.pixelHeight = Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 20
end sub

' IsStsGoodQuality() - Function to determine whether a data bound object has good quality
function IsStsGoodQuality(objMe)
	if not objMe is nothing and IsObject(objMe) then
		if (objMe.quality and 192) = 192 then
			IsStsGoodQuality = TRUE
		else
			IsStsGoodQuality = FALSE
		end if
	else
		IsStsGoodQuality = FALSE
	end if
end function
' General Section (sysdtlftedevice_fp.htm)
'</SCRIPT>

<SCRIPT language=VBScript for=shpFteDevice_alphaCompStatus defer event=onupdate>Dim sVal
	on error resume next
	if IsStsGoodQuality(me) then
		sVal = me.value
		select case sVal
			case "5" shpFteDevice_shpCompStsLED.value = 2
			case "4" shpFteDevice_shpCompStsLED.value = 3
			case "3" shpFteDevice_shpCompStsLED.value = 4
			case else shpFteDevice_shpCompStsLED.value = 1	' black
		end select
		shpFteDevice_shpCompStsLED.style.visibility = "inherit"
		shpFteDevice_textStatusLabel.style.visibility = "inherit"
	else
		shpFteDevice_shpCompStsLED.style.visibility = "hidden"
		shpFteDevice_textStatusLabel.style.visibility = "hidden"
	end if</SCRIPT>

<SCRIPT language=VBScript for=shpFteDevice_alphaDeviceIndex defer 
event=onupdate>Dim sVal
	on error resume next
	if IsStsGoodQuality(me) then
		sVal = me.value
		if sVal = 0 then sVal = shpFteDevice_textDevIxNotAssigned.value
		shpFteDevice_textIndexValue.value = sVal
		shpFteDevice_textIndexValue.style.visibility = "inherit"
		shpFteDevice_textIndexLabel.style.visibility = "inherit"
		shpFteDevice_textIndexBad.style.visibility = "hidden"
	else
		shpFteDevice_textIndexBad.style.visibility = "inherit"
		shpFteDevice_textIndexValue.style.visibility = "hidden"
		shpFteDevice_textIndexLabel.style.visibility = "hidden"
	end if</SCRIPT>
