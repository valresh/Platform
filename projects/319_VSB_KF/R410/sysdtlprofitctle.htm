<SCRIPT language=JScript defer>var bPageLoadComplete = false;
var CurrScrollBarPosition = 0;
var NumOfScrolls = 0;
var gNumAdjParams = -1 ;
var NumOfRows = 20;
var CurrPageNo = 1;
function ChangeParameters()
{
	for( var i=0; i<=19; i++)
	{
		var iTemp = (CurrScrollBarPosition) * 20 + i;
		if(iTemp > gNumAdjParams - 1)
		{
			document.getElementById("grpRow" +i).style.visibility = "hidden";
		}
		else
		{			
			DisplayDataRepository.PutValue("DVINDEX" + i , iTemp);
			document.getElementById("grpRow" +i).style.visibility = "Inherit";
		}
	}

	if(gNumAdjParams < 20)
	{
           	document.getElementById("grpPageNavigation").style.visibility = "hidden";
	}

	for( var i=1; i<=20; i++)
	{
		 var iTemp = (CurrScrollBarPosition) * 20 + i;
		 document.getElementById("alpNum" +i).value = iTemp;
	}
		if( NumOfScrolls == 0)
		{
			pbFirstPage.disabled = true;
			pbLastPage.disabled = true;
			pbNextPage.disabled = true;
			pbPrevPage.disabled = true;
		}
		else if(CurrScrollBarPosition > 0 && CurrScrollBarPosition < NumOfScrolls)
		{
			pbFirstPage.disabled = false;
			pbLastPage.disabled = false;
			pbNextPage.disabled = false;
			pbPrevPage.disabled = false;
		}
		else if(CurrScrollBarPosition == 0)
		{
			pbFirstPage.disabled = true;
			pbLastPage.disabled = false;
			pbNextPage.disabled = false;
			pbPrevPage.disabled = true;
		}
		else if(CurrScrollBarPosition == NumOfScrolls)
		{
			pbFirstPage.disabled = false;
			pbLastPage.disabled = true;
			pbNextPage.disabled = true;
			pbPrevPage.disabled = false;
		}
		PageNo.value = (CurrScrollBarPosition + 1);
		CurrPageNo = (CurrScrollBarPosition + 1);
}</SCRIPT>

<SCRIPT language=JScript for=pbFirstPage defer event=onclick>if(CurrScrollBarPosition > 0)
	{
		CurrScrollBarPosition = 0;
		//Update the Report index
		ChangeParameters();
	}</SCRIPT>

<SCRIPT language=JScript for=pbPrevPage defer event=onclick>if(CurrScrollBarPosition > 0) 
	{
		CurrScrollBarPosition = CurrScrollBarPosition - 1;
		//Update the Report index
		ChangeParameters();
	}</SCRIPT>

<SCRIPT language=JScript for=pbNextPage defer event=onclick>if(CurrScrollBarPosition < NumOfScrolls)
	{
		CurrScrollBarPosition = CurrScrollBarPosition + 1;
		//Update the Report index
		ChangeParameters();
	}</SCRIPT>

<SCRIPT language=JScript for=pbLastPage defer event=onclick>if(CurrScrollBarPosition < NumOfScrolls) 
	{
		CurrScrollBarPosition = NumOfScrolls;
		//Update the Report index
		ChangeParameters();
	}</SCRIPT>

<SCRIPT language=JScript for=PageNo defer event=onchange>if (!isNaN(this.value))
	{
	var iPageNo = (this.value) - 1;
	if (iPageNo >=0 && iPageNo <= NumOfScrolls)
	{
		CurrScrollBarPosition = iPageNo;
		//Update the Report Details
		ChangeParameters();
	}
	else
	{
		window.external.TemporaryMessageZoneText = Invalidpagenumber.value;
		this.value = CurrPageNo;
	}
	}
	else
	{
	window.external.TemporaryMessageZoneText(Invalidpagenumber.value);
	this.value = CurrPageNo;	
	}</SCRIPT>

       	if(alpNumOfDVs.value%NumOfRows == 0)
		{
	   	NumOfScrolls = Math.floor(alpNumOfDVs.value/NumOfRows)-1;
		NoOfPages.value= NumOfScrolls +1;
		}
	   	else
		{
	   	NumOfScrolls = Math.floor(alpNumOfDVs.value/NumOfRows);

		}
	 }

	 {
		document.getElementById("pbNoData").style.visibility = "visible";
	 }
	 ChangeParameters();
