<SCRIPT language=VBScript for=Page defer event=onpagecomplete>dim sArrSts
	On error resume next
	
	if displaydatarepository.getvalue("cp_pv")<>"" then displaydatarepository.Putvalue "cp_Req", displaydatarepository.getvalue("cp_pv")
	if displaydatarepository.getvalue("cp_Req")<>"" then sArrReq = split(displaydatarepository.getvalue("cp_Req"),".")
	
	displaydatarepository.autoReloadContent = false
	if sArrReq(0)<>"" then 
		displaydatarepository.Putvalue "blockname", sArrReq(0)
		displaydatarepository.Putvalue "cp_pvNormal", sArrReq(0) & ".NORMAL"
		displaydatarepository.Putvalue "cp_pvTag", sArrReq(0) & ".TAG"
		displaydatarepository.Putvalue "cp_pvOffnrmpri", sArrReq(0) & ".OFFNRMALMPR"
	end if
	displaydatarepository.autoReloadContent = true
	document.title = cstr(alphaTagName.datavalue("currentpoint.name"))</SCRIPT>

<SCRIPT id=0D03BDD1-EAF6-4D7D-9870-2976FE87250F language=vbscript defer 
shaperefcount="2">Sub InstallCodebase()
	urlbase	 = location.protocol & "//" & location.host
	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
	install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
	redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub
