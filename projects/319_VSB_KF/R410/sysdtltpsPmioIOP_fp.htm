<SCRIPT language=VBScript for=sd defer event=ondatachange>If not sd.QualityBad("currentpoint.IOMHWREVB") then
	If sd.DataValue("currentpoint.IOMHWREVB") > 0 Then
		txtIOPB.style.visibility = "visible"

	Else 
		txtIOPB.style.visibility = "hidden"
		txtRedundant.innerText = "Nonredundant" 'txtlblNonredund.innerText
	End If
	txtRedundant.style.pixeltop = GrpCenterPanel.style.pixelbottom - 23
else
		txtRedundant.style.visibility = "Hidden"
End if

'LLAI 		= 1
'HLAI 		= 2
'DI 		= 3
'DO16 		= 4
'AO8		= 5
'LLMUX 		= 7
'STIMV  	= 14
'DISOE		= 16
'AO16 		= 24

'AO16HART	= 31


if sd.QualityGood("CurrentPoint.IOPTYPE") and sd.DataValue("CurrentPoint.IOPTYPE") <> 0 then
	ConTxtModuleType.style.visibility = "Inherit"
	ConTxtModuleIOMType.style.visibility = "Hidden"
elseif sd.QualityGood("CurrentPoint.IOMTYPE") then 
	ConTxtModuleType.style.visibility = "Hidden"
	ConTxtModuleIOMType.style.visibility = "Inherit"
	if sd.DataValue("CurrentPoint.IOMTYPE") 	= "Low Level Analog Input, 8 ch" then
		ConTxtModuleIOMType.value = "LLAI"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "High Level Analog Input, 16 ch" then
		ConTxtModuleIOMType.value = "HLAI"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Digital Input, 32 ch" then
		ConTxtModuleIOMType.value = "DI"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Digital Output, 16 ch" then
		ConTxtModuleIOMType.value = "DO16"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Analog Output, 8 ch" then
		ConTxtModuleIOMType.value = "AO8"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Low Level Multiplexer, 32 ch" then
		ConTxtModuleIOMType.value = "LLMUX"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Smart Transmitter Interface Multi-Variable, 16 ch" then
		ConTxtModuleIOMType.value = "STIMV"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Digital Input - Sequence of Events, 32 ch" then
		ConTxtModuleIOMType.value = "DISOE"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Analog Output, 16 ch" then
		ConTxtModuleIOMType.value = "AO16"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Digital Output, 32 ch" then
		ConTxtModuleIOMType.value = "DO32"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Remote Hardened Multiplexer, 32 ch" then
		ConTxtModuleIOMType.value = "RHMUX"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "High Level Analog Input, HART Capable, 16 ch" then
		ConTxtModuleIOMType.value = "HLAIHART"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "24 Volt Digital Input, 32 ch" then
		ConTxtModuleIOMType.value = "DI24V"
	elseif sd.DataValue("CurrentPoint.IOMTYPE") = "Analog Output, HART Capable, 16 ch" then
		ConTxtModuleIOMType.value = "AO16HART"
	else
		ConTxtModuleIOMType.value = "??"
	end if

end if

if sd.DataChanged("currentpoint.SIMSTATE") then

end if

'

'	GENERAL PURPOSE and MULTI-PARAMETER ROUTINES
'
dim g_UCNNW
dim g_UCNNWupdated
dim g_HPMNODENO
dim g_HPMNODENOupdated
dim g_sBoxPoint
dim g_sUCNPoint
dim g_nIOMNUM

g_UCNNW = 0
g_UCNNWupdated = false
g_HPMNODENO = 0
g_HPMNODENOupdated = false
g_sBoxPoint = "NONE"
g_sUCNPoint = "NONE"
g_nIOMNUM = 0

sub EHPMValueChanged()
'msgbox "EHPMValueChanged! g_UCNNWupdate: " & g_UCNNWupdated & ", g_HPMNODENOupdated: " & g_HPMNODENOupdated & ", g_UCNNW: " & g_UCNNW
	if g_UCNNWupdated = false then exit sub
	if g_HPMNODENOupdated = false then exit sub
	if not IsNan(g_UCNNW) and not IsNan(g_HPMNODENO) and g_UCNNW > 0 and g_HPMNODENO > 0 then
'		msgbox "EHPMValueChanged, g_UCNNW:" & g_UCNNW & ", g_HPMNODENO:" & g_HPMNODENO
		if g_UCNNW < 10 then
			g_sBoxPoint = "$NM0"   & g_UCNNW
			g_sUCNPoint = "$UCN0" & g_UCNNW
		else
			g_sBoxPoint = "$NM"   & g_UCNNW
			g_sUCNPoint = "$UCN" & g_UCNNW
		end if
		if g_HPMNODENO < 10 then
			g_sBoxPoint = g_sBoxPoint & "B0"   & g_HPMNODENO
			g_sUCNPoint = g_sUCNPoint & "N0" & g_HPMNODENO
		else 
			g_sBoxPoint = g_sBoxPoint + "B"   & g_HPMNODENO
			g_sUCNPoint = g_sUCNPoint & "N" & g_HPMNODENO
		end if
		if not sd.QualityGood("CurrentPoint.IOMNUM") or IsNan(sd.DataValue("CurrentPoint.IOMNUM")) then
			g_sUCNPoint = "NONE"
		else
			if sd.DataValue("CurrentPoint.IOMNUM") < 10 then
				g_sUCNPoint = g_sUCNPoint & "I0" & sd.DataValue("CurrentPoint.IOMNUM")
			else
				g_sUCNPoint = g_sUCNPoint & "I" & sd.DataValue("CurrentPoint.IOMNUM")
			end if			
		end if	
'msgbox "BoxPoint is: " & g_sBoxPoint & ", IOMNUM: " & sd.DataValue("CurrentPoint.IOMNUM") & ", UCN point: " & g_sUCNPoint
		shpIOPStatuses.SetCustomProperty "point", "BoxPoint", g_sBoxPoint
'		shpIOPStatuses.SetCustomProperty "point", "UCNPoint", g_sUCNPoint
		shpIOPStatuses.SetCustomProperty "parameter", "IOMNUMIndex", "IOMSTS(" & sd.DataValue("CurrentPoint.IOMNUM") & ")"
		shpIOPStatuses.SetCustomProperty "parameter", "IOMNUMIndex128", "IOMSTS("  & sd.DataValue("CurrentPoint.IOMNUM") + 128 & ")"
		shpIOPStatuses.ReloadContent
'msgbox "done with reloadcontent EHPMValueChanged"
	end if

end sub

Sub ApplyLayout()
	on error resume next
	GrpLowerPanel.style.top = "" : GrpLowerPanel.style.bottom = "2px" 
	GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2 : GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
End Sub</SCRIPT>
