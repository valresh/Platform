<SCRIPT language=JScript for=writeLockoutToggle defer event=onclick>UpdateWriteLockout()</SCRIPT>
<SCRIPT language=JScript for=alphaWriteLock defer event=onupdate>UpdateWriteLockoutToggle();</SCRIPT>
<SCRIPT language=JScript defer>Page.style.visibility = "hidden"
TOGGLE_ON_ICON = "./Images/toggle_on.png"
TOGGLE_OFF_ICON = "./Images/toggle_off.png"
TOGGLE_ERROR_ICON = "./Images/toggle_error.png"
function UpdateWriteLockoutToggle()
{
	if(!alphaWriteLock.DataExists("CurrentPoint.WRITELOCK") || !alphaWriteLock.DataValue("CurrentPoint.WRITELOCK"))
	{
		writeLockoutToggle.src = TOGGLE_ERROR_ICON
	}
	if(alphaWriteLock.DataValue("CurrentPoint.WRITELOCK") == "ON")
	{
		writeLockoutToggle.src = TOGGLE_ON_ICON
	}
	else if(alphaWriteLock.DataValue("CurrentPoint.WRITELOCK") == "OFF")
	{
		writeLockoutToggle.src = TOGGLE_OFF_ICON
	}
	else
	{
		writeLockoutToggle.src = TOGGLE_ERROR_ICON
	}
}
function UpdateWriteLockout()
{
	if(!alphaWriteLock.DataExists("CurrentPoint.WRITELOCK") || !alphaWriteLock.DataValue("CurrentPoint.WRITELOCK"))
	{
		writeLockoutToggle.src = TOGGLE_ERROR_ICON
		msg = "Error occurred when updating write lockout"
		window.external.showCallout(writeLockoutToggle, msg, 2, 1)
	}
	if(window.external.Parent.RuntimeStatus.isconsolestation == 0)
	{
		msg = "The operation is only allowed on a console station"
		window.external.showCallout(writeLockoutToggle, msg, 2, 1)
	}
	else
	{
		if(writeLockoutToggle.src == TOGGLE_OFF_ICON)
		{
			check = alphaWriteLock.SetDataValueSynchronous("CurrentPoint.WRITELOCK", "ON")
			if(check)
			{
				writeLockoutToggle.src = TOGGLE_ON_ICON
			}
			else
			{
				msg = "Error occurred when updating write lockout"
				window.external.showCallout(writeLockoutToggle, msg, 2, 1)
			}
		}
		else if(writeLockoutToggle.src == TOGGLE_ON_ICON)
		{
			check = alphaWriteLock.SetDataValueSynchronous("CurrentPoint.WRITELOCK", "OFF")
			if(check)
			{
				writeLockoutToggle.src = TOGGLE_OFF_ICON
			}
			else
			{
				msg = "Error occurred when updating write lockout"
				window.external.showCallout(writeLockoutToggle, msg, 2, 1)
			}
		}
	}
}</SCRIPT>
