' General Section (sysdtlswitch_oneportstatus.sha)

Sub InitPort(objPort, sKey)
Dim sPath
Dim sDebugStr
Dim sTest

'	window.external.Parent.LogMessage "sysdtlswitch_oneportstatus.sha - InitPort TOP..."
	on error resume next  

	sPath = "localhost.[ROOT\SNMP\" & sSwitchName & "].SNMP_RFC1213_MIB_IFTABLE." & sKey

	sTest = objPort.GetCustomProperty("Value", "valuePortKey")
	if sTest = sKey then
' 		Debug/keep
'		window.external.Parent.LogMessage "InitPort - sKey already set for: " & sKey & ", NOT calling SetCustomProperty for this port's custom parameters"
	else

		objPort.autoReloadContent = false
		objPort.SetCustomProperty "Parameter", "paramOperStatus", sPath & ".ifOperStatus"
		objPort.SetCustomProperty "Parameter", "paramPortDescr", sPath & ".ifDescr"
		objPort.SetCustomProperty "Parameter", "paramPortSpeed", sPath & ".ifSpeed"
		objPort.SetCustomProperty "Parameter", "paramPortIndex", sPath & ".ifIndex"
		objPort.SetCustomProperty "Value", "valuePortKey", sKey
		objPort.SetCustomProperty "Point", "pointPort", sPoint

'Debug/keep
		'window.external.Parent.LogMessage "InitPort - sPath= " & sPath
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramOperStatus")
		'window.external.Parent.LogMessage "InitPort - paramOperStatus= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortDescr")
		'window.external.Parent.LogMessage "InitPort - paramPortDescr= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortSpeed")
		'window.external.Parent.LogMessage "InitPort - paramPortSpeed= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortIndex")
		'window.external.Parent.LogMessage "InitPort - paramOperStatus= " & sDebugStr
		'window.external.Parent.LogMessage "sysdtlswitch_oneportstatus.sha - InitPort bottom, calling .ReloadContent on single port..."
		objPort.ReloadContent

	end if

end sub


Sub PDC(objVal, nCol)
Dim sKey

'	window.external.Parent.LogMessage "oneportstatus - PDC TOP..."
	on error resume next ' hides script error, possibly addressed by above change to throttle .ReloadContent calls

	sKey = objVal.parentElement.parentElement.GetCustomProperty("Value", "valuePortKey")

'	window.external.Parent.LogMessage "... PDC sKey=" & sKey

	if sKey = "" then exit sub


	if IsStsGoodQuality(objVal) then 
'		window.external.Parent.LogMessage "oneportstatus - PDC IsStsGoodQuality GOOD, calling PortDataChange..."
		PortDataChange sKey, nCol, objVal.value
'	else
'		window.external.Parent.LogMessage "oneportstatus - PDC IsStsGoodQuality BAD - NOT calling PortDataChange"
	end if

End Sub

Sub PDC100000(objVal)
Dim sKey

	on error resume next
	sKey = objVal.parentElement.parentElement.GetCustomProperty("Value", "valuePortKey")
	if sKey = "" then exit sub
	if IsStsGoodQuality(objVal) then PortDataChange sKey, 0, objVal.value + 100000

End Sub

' End General Section (sysdtlswitch_oneportstatus.sha)

<SCRIPT language=VBScript for=sdTabInfo defer event=ondatachange>	dim sFirstNum
	dim sSecondNum

	if window.external.Parent.RuntimeStatus.isconsolestation and me.QualityGood("CurrentPoint.LocalPointType") and me.DataValue("CurrentPoint.LocalPointType") = "PSA" then 
		GrpNativeWindow.style.visibility = "Visible"
	else
		GrpNativeWindow.style.visibility = "Hidden"
	end if

	if me.DataValue("CurrentPoint.PNTBOXTY") = "MC" then
		if me.QualityGood("CurrentPoint.HWYNUM") and me.QualityGood("CurrentPoint.BOXNUM") then
			if me.DataValue("CurrentPoint.HWYNUM") < 10 then
				sFirstNum = "0" & me.DataValue("CurrentPoint.HWYNUM")
			else
				sFirstNum = me.DataValue("CurrentPoint.HWYNUM")
			end if
			if me.DataValue("CurrentPoint.BOXNUM") < 10 then
				sSecondNum = "0" & me.DataValue("CurrentPoint.BOXNUM")
			else
				sSecondNum = me.DataValue("CurrentPoint.BOXNUM")
			end if

			sBoxPointName = "$HY" & sFirstNum & "B" & sSecondNum

'			window.external.parent.logmessage "sBoxPointName is: >>" & sBoxPointName & "<<"
			if bPageInitialized = FALSE then
'				window.external.parent.logmessage "OnDataChange - calling initial UpdatePage"
				combo_pages.AddString "PAGE 1 (1-128)"
				combo_pages.AddString "PAGE 2 (129-256)"
				g_nFLAG = 256
				combo_pages.value = "PAGE 1 (1-128)"  'fixed at 256 numerics for MC boxes
			  	call UpdatePage()
			end if
		end if
	else
		if me.QualityGood("CurrentPoint.NTWKNUM") and me.QualityGood("CurrentPoint.NODENUM") then
			if me.DataValue("CurrentPoint.NTWKNUM") < 10 then
				sFirstNum = "0" & me.DataValue("CurrentPoint.NTWKNUM")
			else
				sFirstNum = me.DataValue("CurrentPoint.NTWKNUM")
			end if
			if me.DataValue("CurrentPoint.NODENUM") < 10 then
				sSecondNum = "0" & me.DataValue("CurrentPoint.NODENUM")
			else
				sSecondNum = me.DataValue("CurrentPoint.NODENUM")
			end if

			sBoxPointName = "$NM" & sFirstNum & "N" & sSecondNum
			window.external.parent.logmessage "sBoxPointName is: >>" & sBoxPointName & "<<"
			if bPageInitialized = FALSE then
'				window.external.parent.logmessage "OnDataChange - calling initial UpdatePage"
				combo_pages.value = "PAGE 1 (1-128)"
			  	call UpdatePage()
			end if
		end if
	end if</SCRIPT>

option explicit
Dim bListPopulated
Dim intTimerID
Dim intTimerID2
Dim bPageInitialized
Dim sBoxPointName
Dim sLastPageShown
dim bPagesCounted
dim g_nFLAG 

bPagesCounted = FALSE
sLastPageShown = ""
bPageInitialized = FALSE
sBoxPointName = "TBD" 'format is $NMnnNnn, e.g., $NM<NTWKNUM>N<NODENUM>" and parameter is array NN(1..4095) for box numerics
bListPopulated = false
'g_nFLAG = 0 ' will be count of box point flags (read indirectly from box point)


dim tab1stRowTop
dim tab2ndRowTop 
dim arrayTabs(12) 

arrayTabs(1) = 283
arrayTabs(2) = 382
arrayTabs(3) = 481
arrayTabs(4) = 580
arrayTabs(5) = 679
arrayTabs(6) = 778
arrayTabs(7) = 877
arrayTabs(8) = 976
arrayTabs(9) = 1075
arrayTabs(10) = 1174
arrayTabs(11) = 1174 ' below tab #10
arrayTabs(12) = 1075 ' below tab #9

tab1stRowTop = 39	
tab2ndRowTop = 61

Function UpdatePage()

'repopulate shpBoxFlags

	dim nIdx
	dim nIdx2
	dim nCounter
	dim nCounter2
	dim sPage
	dim sTempObj
	dim sNVal
	dim sNVal2
	dim sNVal3
	dim sParamName
	dim sNN
	dim nNumPages
	dim sSTRObject
	dim nCharIdx

	sPage = combo_pages.value
	window.clearInterval(intTimerID)

	' trim e.g. "(101-200)" from string "PAGE 2 (101-200)"
	nCharIdx = Instr(sPage, "(") 'type (skip past) there better be a space!
	sPage = Left(sPage, nCharIdx-2)

	'now trim off "PAGE"
	sPage =  Right(sPage, LEN(sPage)-5)  'i.e. just the number part
	window.external.parent.logmessage "sPage = >>" & sPage & "<<"

	if g_nFLAG = 0 then 'not yet initialized, leave at page max
		g_nFLAG = 128
'		window.external.parent.logmessage "g_nFLAG not initialized, set to: " & g_nFLAG
	end if

	window.external.parent.logmessage "g_nFLAG = " & g_nFLAG

	if sPage <> "1" then
		nIdx = ((sPage-1) * 128) + 1 'page 2 is 129-257, page 22 is 2100-2200
	else
		nIdx = 1
	end if

	nIdx2 = nIdx 'for "Nnnnn" label updates
	
	window.external.parent.logmessage "nIdx = >>" & nIdx & "<<"

	nCounter = 0 'again
	shpBoxFlags.autoReloadContent = FALSE

	if bPageInitialized = FALSE then
		window.external.parent.logmessage "driving sBoxPointName to shape: >>" & sBoxPointName & "<<"
		shpBoxFlags.SetCustomProperty "point", "boxpoint", sBoxPointName
	end if 

	'drive the actual parameter array values, FL(nnn) into the shape's generic parameter names, param1, param2, ...
	do until nCounter >= 128 or nIdx > g_nFLAG
		nCounter = nCounter + 1  '1..128 iterator
		sParamName = "param" & nCounter	
		sNN = "FL(" & nIdx & ").external"
'		window.external.parent.logmessage "sNN is >>" & sNN & "<<"
'		window.external.Parent.LogMessage "SetCustom, param >>" & sNN & "<<, nCounter:>>" & nCounter & "<<, sTempObj:>>" & sTempObj & "<<, sParamName: >>" & sParamName & "<<"
		shpBoxFlags.SetCustomProperty "parameter", sParamName, sNN
		nIdx = nIdx + 1 'bumping e.g. N0100 to N0101
	loop

	shpBoxFlags.ReloadContent
	shpBoxFlags.autoReloadContent = TRUE

	txtLoading.style.visibility = "Hidden" 
	if sPage = 1 then
		sNVal = "F00"
		sNVal2 = "F000" ' for values 1..9 only
		sNVal3 = "F0"   ' for values 100.128
	elseif sPage <= 7 then ' values less than 1000 
		sNVal = "F0" 'e.g. N0100
		sNVal2 = "F" 'for 1000-1024
	else
		sNVal = "F"  'for all over 1024 (all 4-digit)
	end if
	
	'update labels, requires autoReloadContent TRUE
	nCounter2 = nCounter 'only show up to actual count of values shown this page (last is 40)
	nCounter = 0
	do until nCounter => 128 or nCounter >= nCounter2

		nCounter = nCounter + 1  '1..128 iterator
		sTempObj = "textbox" & nCounter

		if sPage = 1 then
			if  nCounter < 10 then
'				window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
				shpBoxFlags.Objects(sTempObj).value = sNVal2 & nIdx2 & ":"   	'e.g. S0001
			elseif nCounter < 100 then
'				window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal & nIdx2 & "<<"
				shpBoxFlags.Objects(sTempObj).value = sNVal & nIdx2 & ":"		'e.g. S0017
			else
'				window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal3 & nIdx2 & "<<"
				shpBoxFlags.Objects(sTempObj).value = sNVal3 & nIdx2 & ":"	'e.g. S0113
			end if				
		elseif sPage < 7 then 'pages 2-6 are all strictly triple-digit , i.e. S0nnn
'			window.external.parent.logmessage "(sPage < 7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
			shpBoxFlags.Objects(sTempObj).value = sNVal & nIdx2 & ":"
		elseif sPage = 7 then
			if nCounter < 104 then  '7*128 + 104 == 1000 *4-digit*
'				window.external.parent.logmessage "(sPage =7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
				shpBoxFlags.Objects(sTempObj).value = sNVal & nIdx2 & ":"  	'e.g. 897,...
			else
'				window.external.parent.logmessage "(sPage =7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
				shpBoxFlags.Objects(sTempObj).value = sNVal2 & nIdx2 & ":"	'i.e. 1001, 1009, 1017
			end if
		else 'pages 8 and up are all over 1024, i.e. 4-digits 
'			window.external.parent.logmessage "(sPage > 7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
			shpBoxFlags.Objects(sTempObj).value = sNVal & nIdx2 & ":"			'all 4-digit array indices
		end if

		nIdx2 = nIdx2 + 1

	loop

	nCounter = 0

	'"Show" the newly-driven values
	do until nCounter >= 128 or nCounter >= nCounter2
		nCounter = nCounter + 1
		sSTRObject = "combobox" & nCounter
'		window.external.parent.logmessage "showing object >>" & sSTRObject & "<<"
		shpBoxFlags.Objects(sSTRObject).style.visibility = "Visible"    'had been hidden while not yet with valid data
	loop

	if sPage = 32 then 'hide very last parameter of very last page
		shpBoxFlags.Objects("combobox128").style.visibility = "Hidden"
		shpBoxFlags.Objects("textbox128").value = ""
	end if

	bPageInitialized = TRUE

end Function


sub UpdatePageCount(nCount)
' Populate the "Pages" combobox;  count is number of parameters, there is one page per 100 parameters

	dim nPages
	dim nIndex
	dim nMod
	dim nFromVal
	dim nToVal

	if bPagesCounted then exit sub

	g_nFLAG = nCount
	window.external.parent.logmessage "Count of box Flags is: " & nCount

	bPagesCounted = TRUE
	if nCount < 129 then exit sub ' just one page
	nPages = (nCount / 128)
	nMod = (nCount / 128) mod 1

	nPages = nPages - nMod
	nIndex = 2 'adding begins with PAGE 2
	window.external.parent.logmessage "update page count: " & nPages
	
	'while programs support upto 16k sized arrays, LCN only supports transmission of 4095 parameters.
	'so, limit number of 128ea pages to 32
	if nPages > 32 then nPages = 32

	do until nIndex > nPages
		nFromVal = (128 * (nIndex-1)) + 1
		nToVal = 128 * nIndex
		if nToVal > 4095 then
			nToVal = 4095
		elseif nToVal > g_nFLAG then 
			nToVal = g_nFLAG
		end if
		combo_pages.AddString "PAGE " & nIndex & " (" & nFromVal & "-" & nToVal & ")"
		nIndex = nIndex + 1
	loop

end sub</SCRIPT>

<SCRIPT language=VBScript for=combo_pages defer event=onchange>	dim nCounter

	dim sNVal2

	txtLoading.style.visibility = "Inherit"

	nCharIdx = Instr(sPage, "(") 'type (skip past) there better be a space!
	sPage = Left(sPage, nCharIdx-2)

	sPage =  Right(sPage, LEN(sPage)-5)  'i.e. just the number part
	window.external.parent.logmessage "combo_pages, OnChange; sPage = >>" & sPage & "<<"

	if sPage <> "1" then
		nIdx = ((sPage-1) * 128) + 1 'page 2 is 129-257, page 22 is 2100-2200
	else
		nIdx = 1
	end if

	nIdx2 = nIdx 'for "Nnnnn" label updates

	if sPage = 1 then
		sNVal = "F00"
		sNVal2 = "F000" ' for values 1..9 only
		sNVal3 = "F0"   ' for values 100.128
	elseif sPage <= 7 then ' values less than 1000 
		sNVal = "F0" 'e.g. N0100
		sNVal2 = "F" 'for 1000-1024
	else
		sNVal = "F"  'for all over 1024 (all 4-digit)
	end if
	
	'update labels, requires autoReloadContent TRUE
	nCounter = 0
	do until nCounter => 128

		nCounter = nCounter + 1  '1..128 iterator
		sTempObj = "textbox" & nCounter

		if sPage = 1 then
			if  nCounter < 10 then
'				window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
				shpBoxFlags.Objects(sTempObj).value = sNVal2 & nIdx2 & ":"   	'e.g. S0001
			elseif nCounter < 100 then
'				window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal & nIdx2 & "<<"
				shpBoxFlags.Objects(sTempObj).value = sNVal & nIdx2 & ":"		'e.g. S0017
			else
'				window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal3 & nIdx2 & "<<"
				shpBoxFlags.Objects(sTempObj).value = sNVal3 & nIdx2 & ":"	'e.g. S0113
			end if				
		elseif sPage < 7 then 'pages 2-6 are all strictly triple-digit , i.e. S0nnn
'			window.external.parent.logmessage "(sPage < 7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal & nIdx2 & "<<"
			shpBoxFlags.Objects(sTempObj).value = sNVal & nIdx2 & ":"
		elseif sPage = 7 then
			if nCounter < 104 then  '7*128 + 104 == 1000 *4-digit*
'				window.external.parent.logmessage "(sPage =7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
				shpBoxFlags.Objects(sTempObj).value = sNVal & nIdx2 & ":"  	'e.g. 897,...
			else
'				window.external.parent.logmessage "(sPage =7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
				shpBoxFlags.Objects(sTempObj).value = sNVal2 & nIdx2 & ":"	'i.e. 1001, 1009, 1017
			end if
		else 'pages 8 and up are all over 1024, i.e. 4-digits 
'			window.external.parent.logmessage "(sPage > 7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
			shpBoxFlags.Objects(sTempObj).value = sNVal & nIdx2 & ":"			'all 4-digit array indices
		end if

		nIdx2 = nIdx2 + 1

	loop

	nCounter = 0

	'"Hide" the values that will be updated
	do until nCounter >= 128
		nCounter = nCounter + 1
		sSTRObject = "combobox" & nCounter
		sTempObj = "textbox" & nCounter

'window.external.parent.logmessage "hiding object >>" & sSTRObject & "<<"

		shpBoxFlags.Objects(sSTRObject).style.visibility = "Hidden"    'had been hidden while not yet with valid data
		shpBoxFlags.Objects(sTempObj).value = ""

	loop

	'Use briefly delayed timer to the combobox doesn't "hang down" during the page reload;  makes for more responsive feel
	call UpdatePage()</SCRIPT>

        //------------------------------------------------------------------------

        // CreateExtensionDiv

        //------------------------------------------------------------------------

        // <summary>

        // Creates a single div in the specified parent element with the specified

        // styles and attributes.

        // </summary>

        // <param name="extId">The ID for the new div.</param>

        // <param name="extClass">The class(es) for the new div.</param>

        // <param name="extXStyle">The style used to give the div its horizontal position ('left' or 'right')</param>

        // <param name="extXPos">The expression for the div's horizontal position.</param>

        // <param name="extYStyle">The style used to give the div its vertical position ('top or 'bottom')</param>

        // <param name="extYPos">The expression for the div's vertical position.</param>

        // <param name="extWidth">The expression for the div's width.</param>

        // <param name="extHeight">The expression for the div's height.</param>

        // <param name="extDisplay">The expression for the div's display style - null or '' if this is not needed.</param>

        // <param name="objExtParent">The element to insert the new div as a child of.</param>

        // <returns>

        // true if the div was created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateExtensionDiv(extId, extClass, extXStyle, extXPos, extYStyle, extYPos, extWidth, extHeight, extDisplay, objExtParent)

        {

          try

          {

            var objExt = window.document.getElementById(extId);

            if (objExt == null)

            {

              objExt = window.document.createElement("div");

              objExt.id = extId;

              objExt.className = extClass;

              objExt.style.position = "absolute";

              objExt.style.overflow = "hidden";

              objExt.style.setExpression(extXStyle, extXPos, "JavaScript");

              objExt.style.setExpression(extYStyle, extYPos, "JavaScript");

              objExt.style.setExpression("width", extWidth, "JavaScript");

              objExt.style.setExpression("height", extHeight, "JavaScript");

              if (typeof(extDisplay) == "string" && extDisplay.length > 0)

              {

                objExt.style.setExpression("display", extDisplay, "JavaScript");

              }

              

              // Insert the new extension div into the proper location in a seperate thread, so that

              // the time it takes doesn't delay the calculation of the size and location of the

              // other extensions. This also breaks out of the onreadystatechange handler thread before

              // mucking around with the DOM, which could potentially change the readyState again.

              window.setTimeout(function(){ objExtParent.appendChild(objExt); }, 5);

            }

            return true;

          }

          catch(e)

          {

            alert("Exception creating background extension '" + extId + "': " + (typeof(e) == "string" ? e : e.description));

          }

          return false;

        }

        

        //------------------------------------------------------------------------

        // CreateBackgroundExtensions

        //------------------------------------------------------------------------

        // <summary>

        // Create empty elements inside the background that match the colored

        // parts of the shape to give the impression that the Page stretches

        // all the way to the edges of the Background.

        // </summary>

        // <returns>

        // true if the extensions were created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateBackgroundExtensions()

        {

          try

          {

              var objPage = window.document.getElementById("Page");

              var objBackground = window.document.getElementById("Background");      

              if (objPage == null || objBackground == null)

              {

                return false;

              }

                                          

              // Extend the TitleBar on the right-hand edge

              CreateExtensionDiv("bgTitleBar", "TitleBar", 

                                  "right", "'0px'", "top", "'0px'", 

                                  "Background.clientWidth - Page.offsetWidth", 

                                  "TitleBarBackground.offsetHeight", 

                                  null, objBackground);

              

              // Extend the TabSet on the right-hand edge.

              CreateExtensionDiv("bgTabSet", "TabSet", 

                                  "right", "'0px'", "top", "TitleBarBackground.offsetHeight", 

                                  "Background.clientWidth - Page.offsetWidth", "TabSetBackground.offsetHeight", 

                                  "TabSetBackground.currentStyle.display", objBackground);

              

              // Extend the NavPane on the bottom edge.



              CreateExtensionDiv("bgNavPane", "NavPane NavPaneFP",

                                   "left", "'0px'", "bottom", "'0px'", 

                                   "NavPane.offsetWidth", "Background.clientHeight - Page.offsetHeight", 

                                   null, objBackground);



              return true;

          }

          catch(e)

          {

             alert("Exception creating background extensions: " + (typeof(e) == "string" ? e : e.description));

          }  

          return false;

        }
