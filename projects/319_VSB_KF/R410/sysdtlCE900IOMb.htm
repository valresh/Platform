<SCRIPT language=VBScript defer>Dim MaxChan 
MaxChan = 32
Dim bAIorDIChannelConfigured
Dim bAOorDOChannelConfigured
bAIorDIChannelConfigured = false
bAOorDOChannelConfigured = false
Sub IOPTYPE_Onupdate( )
'On Error Resume Next

'	 // Make the correct set of channel data me.style.visibility to the user.

numChans = sd.DataValue("CurrentPoint.NUMCHANS")

	for i = 1 to numChans
		if not sd.QualityBad("CurrentPoint.PNTTYPE("&i&")") then
			chType =  sd.Datavalue("CurrentPoint.PNTTYPE("&i&")")
			select case chType
				case 1 'Channel type is AI
					bAIorDIChannelConfigured = true
					Document.getElementById("shpChannel"&i).value = 3
				case 2 'Channel Type is AO
					bAOorDOChannelConfigured = true
					Document.getElementById("shpChannel"&i).value = 4
				case 4 'Channel Type is DI
					bAIorDIChannelConfigured = true
					Document.getElementById("shpChannel"&i).value = 5
				case 5 'Channel Type is DO
					bAOorDOChannelConfigured = true
					Document.getElementById("shpChannel"&i).value = 6
				case 36
					Document.getElementById("shpChannel"&i).value = 2
				case else
					Document.getElementById("shpChannel"&i).value = 1
			End select
		else
			Document.getElementById("shpChannel"&i).value = 1
		end if
	next
for i = numChans + 1 to MaxChan
	Document.getElementById("shpChannel"&i).style.display = "None"
next
if bAIorDIChannelConfigured And bAOorDOChannelConfigured then
	txtPVOP.style.visibility = "Inherit"
	txtPVStatus.style.visibility = "Inherit"
	txtPV.style.visibility = "Hidden"
	txtOP.style.visibility = "Hidden"
elseif bAIorDIChannelConfigured then
	txtPVOP.style.visibility = "Hidden"
	txtPVStatus.style.visibility = "Inherit"
	txtPV.style.visibility = "Inherit"
	txtOP.style.visibility = "Hidden"
elseif bAOorDOChannelConfigured then
	txtPVOP.style.visibility = "Hidden"
	txtPVStatus.style.visibility = "Hidden"
	txtPV.style.visibility = "Hidden"
	txtOP.style.visibility = "Inherit"
end if
End Sub

Sub Navigate_To_Channel_Detail_Display(oSource)
DisplayDataRepository.PutValue "CMName" , "."
DisplayDataRepository.PutValue "CHName" , "."
DisplayDataRepository.autoReloadContent = true
	strChname = oSource.value
	if (instr(strChname, ".") > 0) then
		str = split(strChname , ".")
		DisplayDataRepository.PutValue "CMName" , str(0) 'Navigate to CM Detail Display
		DisplayDataRepository.PutValue "CHName" , str(1) 'Navigate to Channel Detail Display
		DisplayDataRepository.autoReloadContent = true
	elseif (instr(strChname, "[") > 0) and (instr(strChname, "]") > 0)then
		str = split(strChname , "[")
		DisplayDataRepository.PutValue "CHName" , str(0) 'Navigate to Channel Detail Display
		str1 = split(str(1) , "]")
		DisplayDataRepository.PutValue "CMName" , str1(0) 'Navigate to CM Detail Display
		DisplayDataRepository.autoReloadContent = true
	else
		DisplayDataRepository.PutValue "CHName" , strChname
	end if
Call_Channel_Point_Detail_Dislay
End sub
Sub Call_Channel_Point_Detail_Dislay()
if not alpCHDesc.QualityBad("CHName.DESC") then
	window.external.Parent.RequestTask 21, 73, 0, 0, 0, DisplayDataRepository.GetValue("CHName")
elseif not alpCMDesc.QualityBad("CMName.DESC") then
	window.external.Parent.RequestTask 21, 73, 0, 0, 0, DisplayDataRepository.GetValue("CMName")
end if
End sub</SCRIPT>
