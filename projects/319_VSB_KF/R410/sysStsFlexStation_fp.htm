<SCRIPT language=VBScript defer>sub ApplyLayout()
	on error resume next
	GrpLowerPanel.style.top = ""
	GrpLowerPanel.style.bottom = "2px"
	GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2
	GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	if window.external.Application.Document.ParentWindow.external.CurrentDisplayPageType <> 0 then
		if Page.style.pixelHeight > 475 and Page.style.pixelHeight < 486 then
			GrpUpperPanel.style.pixelWidth  = 180 : GrpCenterPanel.style.pixelWidth = 165 : GrpLowerPanel.style.pixelWidth  = 180 : PbAlmAck.style.width = 22
		elseif Page.style.pixelHeight = 475 then
			GrpUpperPanel.style.pixelWidth  = 185 : GrpCenterPanel.style.pixelWidth = 175 : GrpLowerPanel.style.pixelWidth  = 185 : PbAlmAck.style.width = 22
		end if
	end if
	GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2 : GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
end sub</SCRIPT>

End if</SCRIPT>
