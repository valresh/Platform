<SCRIPT language=VBScript defer>dim a
public sub PointDetail(a, CMNAME)
	a=CMNAME.value
	If a = Empty or a = "NaN" then
	window.external.TemporaryMessageZoneText Message.value
	Else 
	window.external.RequestTask 21, 73, 0, 0, 0, a
	end if
end sub

public sub selection(Slot)
	b=Slot
	page.all.item("CMNAME" & b).textColor=50282496
	page.all.item("SubSlot" & b).textColor=50282496
	page.all.item("line" & b).style.visibility="vISIBLE"
	page.all.item("line" & b).lineColor=50282496
	page.all.item("PB" & b).style.cursor = "Hand"
end sub

public sub Deselection(Slot1)
	c=Slot1
	page.all.item("CMNAME" & c).textColor=VBBLACK
	page.all.item("SubSlot" & c).textColor=VBBLACK
	page.all.item("line" & c).style.visibility="hidden"
	page.all.item("PB" & c).style.cursor = "Auto"
end sub</SCRIPT>
