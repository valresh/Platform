<SCRIPT language=VBScript for=shpChart_ESig defer event=onupdate>If NOT shpChart_alpSd.QualityBad("TagName.LocationFullItemName") then
	On Error Resume Next
	blnESig = True

	If  NOT(blnChartInitialized) Then
		If(blnCtrlConfirmProp AND blnESig AND blnPrimSig AND blnSecSig) Then

			Dim NumSig
			NumSig=0
			If (len(shpChart_PrimSig.Value)) <> 255  Then
				NumSig=1
			End If
			If NumSig=1 And len(shpChart_SecSig.Value) <> 255  Then
				NumSig=2
			End If

			shpChart_AxConfigFrm1.PointName = shpChart_alpTagName.value 
			shpChart_AxConfigFrm1.ServerName = shpChart_alpNetworkName.value 
			shpChart_AxConfigFrm1.SecurityLevel = window.external.Application.SecurityLevel 
			shpChart_AxConfigFrm1.OperatorName = window.external.Application.OperatorID 
			shpChart_AxConfigFrm1.StationServerName = window.external.Application.ServerName 
			shpChart_AxConfigFrm1.StationNumber = window.external.Application.StationNumber	
			shpChart_AxConfigFrm1.ElectronicSignature = shpChart_ESig.value
			if shpChart_CtrlConfirmProp.value <> 1 then
				shpChart_AxConfigFrm1.ControlConfirm = 0
			else
				shpChart_AxConfigFrm1.ControlConfirm = 1
			End if
			shpChart_AxConfigFrm1.NumberSignatures = NumSig
			shpChart_AxConfigFrm1.StationAcronym = window.external.Application.Parent.RuntimeStatus.StationAcronym

			blnChartInitialized = True
		End If
	End If
End If</SCRIPT>

<SCRIPT language=VBScript for=shpChart_AxConfigFrm1 defer 
event=InvokeERDBStatus(nERDBStatus)>On Error Resume Next
    If ((nERDBStatus = ErdbDiscFromA Or nERDBStatus = ErdbDiscFromB) And intERDBStatus <> -1) Then
		window.external.MessageZoneText = Me.parentElement.children.namedItem("shpChart_LostMessage").Value
    ElseIf ((nERDBStatus = ErdbDiscFromA Or nERDBStatus = ErdbDiscFromB) And intERDBStatus = -1) Then
		window.external.MessageZoneText = Me.parentElement.children.namedItem("shpChart_FailMessage").Value
    ElseIf (intERDBStatus = -1) Then
		window.external.MessageZoneText = ""
    Else
		window.external.MessageZoneText = Me.parentElement.children.namedItem("shpChart_SuccMessage").Value
    End If
        
    intERDBStatus = nERDBStatus</SCRIPT>
