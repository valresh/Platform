function RequestUpdate()
{
    if (!g_PageLoadComplete)
        return;

    window.setTimeout(GetUpdate, 50);
}

function GetUpdate()
{
	var table = parent.Table;
	if (table == undefined)
	{
		window.external.application.logMessage("GetUpdate()... unable to get the table object" );
		return;
	}
	
	var nSelectedRow = GetSelectedRow(table);
	if (nSelectedRow < 0)
	{
		window.external.application.logMessage("GetUpdate()... Selected row number is invalid: " + nSelectedRow);
		return;
	}
	
	var timestamp       = GetFieldDataFromTable(table, nSelectedRow, "Time");
	var fullLocation    = GetFieldDataFromTable(table, nSelectedRow, "LocationFullName");
	var locationTagname = GetFieldDataFromTable(table, nSelectedRow, "LocationTagName");
	var batchId         = GetFieldDataFromTable(table, nSelectedRow, "BatchId");
	var message         = GetFieldDataFromTable(table, nSelectedRow, "Description");
	var confState       = GetFieldDataFromTable(table, nSelectedRow, "Confirmed");
	var confirmable     = GetFieldDataFromTable(table, nSelectedRow, "Confirmable");

    if (message != null)
    {
	    message = TrimMessage(message);
        SetFieldData("Message", message);
    }
    
    if (fullLocation != null)
    {
        var unit = GetUnitString(fullLocation);
        var unitTooltip = String(fullLocation) + " (" + String(locationTagname) + ")";
        SetFieldData("Unit", unit, unitTooltip);
    }

    if (batchId != null)
    {
        SetFieldData("BatchId", batchId);
    }
    
    if (timestamp != null && parent.DTFormat != null)
    { 
        var timeString = parent.DTFormat.Localize( timestamp, parent.g_dateTimeFormat || 0 );
        SetFieldData("Timestamp", timeString);
    }
    
    if (confState != null)
    {
		g_MessageConfirmed = confState;
    }
    
    if (confirmable != null)
    {
		g_MessageConfirmable = confirmable;
    }

	UpdateConfirmState();
}

function GetSelectedRow(table)
{
	var nSelectedRow = table.SelectedRowIndex;
	var nTableSize = table.ViewSize;
	var nTablePosn = table.ViewPosn;
	// Calculate last clicked row's position in the currently displayed window and get fields
	nSelectedRow = nSelectedRow - nTablePosn;
	// See if it's correct
	if (nSelectedRow >= 0 && nSelectedRow < nTableSize)
	{
		if (table.Fields.Item("Selected").GetValue(nSelectedRow))
			return nSelectedRow;
	}
	// Check all rows for selection then
	nSelectedRow = 0;
	for (var i = 0; i < nTableSize; i++)
	{
		if (table.Fields.Item("Selected").GetValue(i))
		{
			return i;
		}
	}
	return -1;
}

function GetFieldDataFromTable(table, rowNumber, fieldName)
{
    try
    {
        return table.Fields.Item(fieldName).GetValue(rowNumber);
    }
    catch (err)
    {
        window.external.application.logMessage("GetFieldDataFromTable()... Unable to get field data for " + fieldName);
        return null;
    }
}

function SetFieldData(fieldName, data, tooltip)
{
    var elem = document.getElementById("txt"+ String(fieldName));
    if (elem == null) 
        return;
    elem.innerText = String(data);
    elem.title = tooltip || String(data);
}

function TrimMessage(message)
{
    var MAX_MSG_LENGTH = 132 // defined in almevt fil
    var trimmedMessage = message.substr(0, MAX_MSG_LENGTH);
    if (message.length > MAX_MSG_LENGTH)
        trimmedMessage += "...";
    return trimmedMessage;
}

function ClassNameReplace(elem, oldClass, newClass)
{
    if (elem == null)
        return;
    
    var newClassName = elem.className;
    if (oldClass.length > 0)
    {
        var classArray = newClassName.split(" ");
        for (var i = classArray.length - 1; i >= 0; --i) 
        {
            if (classArray[i] == oldClass)
                classArray.splice(i, 1);
            
            // If existing class list already has the new class, don't add it again.    
            if (classArray[i] == newClass)
                newClass = "";
        }
        newClassName = classArray.join(" ");
    }
    
    if (newClass.length > 0)
    {
        newClassName += (" " + newClass);
    }
    
    elem.className = newClassName;
}

function GetUnitString(fullLocationString)
{
    // strip down to the last part of the full location to get the item name
    var delimPos = fullLocationString.lastIndexOf("/");
    return (delimPos == -1) ? fullLocationString : fullLocationString.substr(delimPos + 1);
}

function UpdateConfirmState() {
	if (!document.ConfirmButton) {
		return;
	}

	if (!g_MessageConfirmed) {
        document.ConfirmButton.innerText = "Confirm";
        document.ConfirmButton.title = "Confirm Message";
        document.ConfirmButton.readonly = false;
        ClassNameReplace(document.ConfirmButton, "iri_disabled", "");
    } else {
        document.ConfirmButton.innerText = "Confirmed";
        document.ConfirmButton.title = "Message has been confirmed";
        document.ConfirmButton.readonly = true;
        ClassNameReplace(document.ConfirmButton, "", "iri_disabled");
    }

	document.ConfirmButton.style.visibility = g_MessageConfirmable ? "inherit" : "hidden";
}

function ResizeDisplay()
{
    var maxColumnWidth = 550;
    var minDisplayWidth = 1000;
	var minHeight = 140;
	var maxShapeWidth = 900;
    
    // Do all the page resize first
    var newClientWidth = Math.max(parseInt(document.documentElement.clientWidth || document.body.clientWidth), minDisplayWidth) - 2 ;
    var newClientHeight = parseInt(document.documentElement.clientHeight || document.body.clientHeight) - 2 ; 
	var newContentHeight = Math.max(parseInt(document.documentElement.clientHeight || document.body.clientHeight) , minHeight) - 2 ; 

    var pageElem = document.getElementById("Page");
    var bgElem = document.getElementById("Background");
    if (pageElem == null || bgElem == null)
        return;

	pageElem.style.overflow = "hidden";
    
    pageElem.style.width = String(newClientWidth) + "px";
	pageElem.style.height = String(newClientHeight) + "px";
    
	// left column
    var newColumnWidth = Math.min(maxColumnWidth, Math.floor(newClientWidth/4));
    var leftColumnDiv = document.getElementById("iri_divLeftColumn");
    if (leftColumnDiv != null)
	{
        leftColumnDiv.style.pixelWidth = newColumnWidth;
		leftColumnDiv.style.pixelHeight = newContentHeight;
	}
	
	// divider
    var leftSeparatorDiv = document.getElementById("iri_divLeftSeparator");
    if (leftSeparatorDiv != null)
	{
        leftSeparatorDiv.style.pixelLeft = newColumnWidth;
		leftSeparatorDiv.style.pixelHeight = newContentHeight;
	}
    
    // shape
	var shapeWidth = Math.min(maxShapeWidth, newClientWidth - newColumnWidth);
	var shapeElem = document.getElementById("shpParamRender");
    if (shapeElem != null) {
		shapeElem.style.pixelTop = 0;
        shapeElem.style.pixelWidth = shapeWidth;
		shapeElem.style.pixelLeft = newColumnWidth;
		shapeElem.style.pixelHeight = newContentHeight;
	}  
	
	if (document.moveCustomBindingAlphas) {
		window.setTimeout(function(){document.moveCustomBindingAlphas(false, false);}, 0);
	}
	    
}

function ParamsResolved(resolvedParams){
    try {
		shpParamRender.autoReloadContent = false;

		// Check for actentity and basename
		var actEntity = "";
		var baseName = "";
		if ('ACTENTITY' in resolvedParams && resolvedParams.ACTENTITY != null) {
			actEntity = resolvedParams.ACTENTITY.trim().toUpperCase();
		}
		if ('BASENAME' in resolvedParams && resolvedParams.BASENAME != null) {
			baseName = resolvedParams.BASENAME.trim().toUpperCase();
		}

		var targetChange = false;
		var rawInstructionText = "";
		var rawNoteText = "";
		var targetValRef = "";
		var targetLabel = "";
		var currValRef = "";
		var monTaskRef = "";

		for (var propertyName in resolvedParams) {
			if ((!resolvedParams.hasOwnProperty(propertyName)) || (!resolvedParams[propertyName])) {
				continue;
			}
			switch(propertyName) {
			case "INSTRUCTION":
				if (window.html_sanitize) {
					rawInstructionText = window.html_sanitize(resolvedParams.INSTRUCTION);
				}
				break;
			case "NOTE":
				if (window.html_sanitize) {
					rawNoteText = window.html_sanitize(resolvedParams.NOTE);
				}
				break;
			case "TARGETLABEL":
				if (resolvedParams.TARGETLABEL == null) {
					break;
				}
				var target = resolvedParams.TARGETLABEL.trim();
				if (target != "") {
					targetLabel = target;
					shpParamRender.SetCustomProperty("Value", "TARGETLABEL" , target);
				}
				break;
			case "ENTRYLABEL":
				if (resolvedParams.ENTRYLABEL == null) {
					break;
				}
				var entry = resolvedParams.ENTRYLABEL.trim();
				if (entry != "") {
					shpParamRender.SetCustomProperty("Value", "ENTRYLABEL" , entry);
				}
				break;
			case "ACTENTITY":
			case "BASENAME":
				break;
			case "TARGETCHANGE":
				targetChange = (resolvedParams.TARGETCHANGE.trim() == "true");
				break;
			case "CURRVALREF":
				currValRef = resolvedParams.CURRVALREF.trim();
				break;
			case "MONTASKREF":
				monTaskRef = resolvedParams.MONTASKREF.trim();
				break;
			default:
				var refString = resolvedParams[propertyName];
				if (propertyName == "TARGETVAL") {
					targetValRef = refString;
				} 
				var delimIndex = refString.indexOf(".");
				if (delimIndex >= 0 && delimIndex < (refString.length - 1)) {
					var point = refString.substring(0, delimIndex);
					
					// Check if point matches act entity or act basename. If so, replace with g_Point
					var pointNameUpper = point.toUpperCase();
					if (ComparePointName(actEntity, pointNameUpper) || ComparePointName(baseName, pointNameUpper)) {
						point = g_Point;
					}

					var param = refString.substring(delimIndex + 1);
					SetResolvedShapeParamBindings(shpParamRender, propertyName, point, param);
				} else {
					window.external.application.logMessage("ParamsResolved: failed to split value reference \"" + refString + "\" for param " + propertyName + " into point parameter");
				}
				break;
			}
		}

		var auxData = {
			targetValRef: (targetValRef.length > 0 && !targetChange) ? targetValRef : undefined,
			targetLabel: (targetLabel.length > 0) ? targetLabel : undefined,
			currValRef: (currValRef.length > 0) ? currValRef : undefined,
			monTaskRef: (monTaskRef.length > 0) ? monTaskRef : undefined
		};

		var processedText = ParseInstructionText(rawInstructionText, actEntity, baseName, rawNoteText, auxData);
		document.InstructionText = processedText;

		if (g_ParamRendererReloadTimer != null)	{
			window.clearTimeout(g_ParamRendererReloadTimer);
		}
		
		g_ParamRendererReloadTimer = window.setTimeout(ParamRendererReload, 100);
    } catch (err) {
		window.external.application.logMessage("Error:" + err);
		throw err
    }
}

function ComparePointName(pointName1, pointName2) {
	var delimPos1 = pointName1.indexOf(":");
	var delimPos2 = pointName2.indexOf(":");
	// if both name is server prepended, compare as it is.
	if ((delimPos1 != -1) && (delimPos2 != -1)) {
		return (pointName1 == pointName2);
	}
	// otherwise strip off any prepended server name, then compare
	if (delimPos1 != -1) {
		pointName1 = pointName1.substr(delimPos1 + 1);
	}
	if (delimPos2 != -1) {
		pointName2 = pointName2.substr(delimPos2 + 1);
	}
	return (pointName1 == pointName2);
}

function ParseInstructionText(rawInstructionText, actEntity, baseName, rawNoteText, auxData) {
	var MSGPOINT_TAG = "$MSGPOINT$";
	var DEFAULT_CHAR_LENGTH = 8;
	var PIXEL_PER_CHAR_LARGE = 13;
	var PIXEL_PER_CHAR_SMALL = 6;
	var NUM_CHAR_LARGE = 6;
	var CHAR_MIN = 2;
	var CHAR_MAX = 24;
	var bindingTargets = [];
	var overallText = "";

	// process instruction text
	overallText = rawInstructionText;

	// process note text
	if (rawNoteText && rawNoteText.length > 0) {
		overallText += "<P>" + "Note" + "</P>";
		overallText += rawNoteText;
	}

	// process aux data
	var definedBindings = 0;
	var additionalMarkup = "";
	if (auxData.targetValRef) {
		additionalMarkup = "<P><SPAN class='iri_fieldLabel'>Target";
		if (auxData.targetLabel) {
			additionalMarkup += (" (" + auxData.targetLabel +")");
		}
		additionalMarkup += "</SPAN><br>{{" + auxData.targetValRef + "}}</P>";
		definedBindings++;
	}
	if (auxData.currValRef) {
		additionalMarkup += "<P><SPAN class='iri_fieldLabel'>Current</SPAN><br>{{" + auxData.currValRef + "}}</P>";
		definedBindings++;
	}
	if (auxData.monTaskRef) {
		additionalMarkup += "<P><SPAN class='iri_fieldLabel'>Monitor</SPAN><br>{{" + auxData.monTaskRef + "}}</P>";
		definedBindings++;
	}
	if (additionalMarkup.length > 0) {
		if (overallText.length > 0) {
			overallText += "<hr style='border-top: 1px solid'>";
		}
		overallText += additionalMarkup;
	}

	// from hsc_isValidPointName() and hsc_isValidParamName()
	// static char *INVALID_CHARS_POINTS	= ".,/\\<>'\"*?|:; \t";  // removed colon from invalid chars list for points in regex below to support server prepended point name.
	// static char *INVALID_CHARS_PARAMS	= ",/\\<>'\"*?|:; \t";  // Equivalent to points, except dot is allowed	
	// optional formatting configuration Dxx for decimal places and Wxx for character length
	var processedText = overallText.replace(/{{([^.,\/\\<>'"*?|; \t{}]*)[.]([^,\/\\<>'"*?|:; \t{}]*)((:[DW][0-9]+)+)?}}/ig, 
		function(wholeMatch, point, param, options, lastOption, offset, string) {
			if (bindingTargets.length >= (MAX_SUPPORTED_CUSTOM_BINDINGS + definedBindings)) {
				window.external.application.logMessage("Maximum number of instruction key parameters reached. Maximum is: "+ MAX_SUPPORTED_CUSTOM_BINDINGS);
				return wholeMatch;
			}

			// extract optional formattings
			var decimalPlaces = 2;
			var charLength = -1;
			
			var optionList = options ? options.split(":") : [];
			for(var i = 0; i < optionList.length; ++i ) {
				if (!optionList[i] || optionList[i].length == 0) { 
					continue;
				} else if (optionList[i].charAt(0).toUpperCase() === 'D') {
					switch (optionList[i].toUpperCase()) {
					case "D0":
					case "D1":
					case "D2":
					case "D3":
					case "D4":
						decimalPlaces = parseInt(optionList[i].substring(1));
					}
				} else if (optionList[i].charAt(0).toUpperCase() === 'W') {
					var widthNum = parseInt(optionList[i].substring(1));
					if ((widthNum >= CHAR_MIN) && (widthNum <= CHAR_MAX)) {
						charLength = widthNum;
					}
				}
			}
			
			var pointNameUpper = point.toUpperCase();
			if ((pointNameUpper == MSGPOINT_TAG) || ComparePointName(actEntity, pointNameUpper) || ComparePointName(baseName, pointNameUpper)) {
				point = g_Point;
			}
			
			//construct span element with inline width styling
			var calcCharLength = (charLength > 0) ? charLength: DEFAULT_CHAR_LENGTH;
			var spanId= "spanLiveValuePlaceHolder" + bindingTargets.length;
			var placeholderWidth = calcCharLength > NUM_CHAR_LARGE ? (PIXEL_PER_CHAR_LARGE*NUM_CHAR_LARGE+PIXEL_PER_CHAR_SMALL*(calcCharLength-NUM_CHAR_LARGE)) : (PIXEL_PER_CHAR_LARGE*calcCharLength);

			bindingTargets.push({point: point, param: param, placeholder: spanId, decimals: decimalPlaces, numberOfChars: charLength});
			return replacementString;
	});

	SetCustomBindings();
	return processedText;
}


function SetCustomBindings() {
	for (var i = 0; i < document.CustomBindingTargets.length; ++i) {

<SCRIPT id=50A6259D-75C4-45F3-A301-27FFFE304344 language=JScript defer 
shaperefcount="1">// shape level global functions

var CustomStateAlphaList = [];
var CustomNumericAlphaList = [];

function moveCustomBindingAlphas(bChangeDom, bSetFormatting) {

	var bindingTargets = document.CustomBindingTargets;
	if (!bindingTargets) {
		return false;
	}

	if (bindingTargets.length == 0) {
		return false;
	}
	
	for (var i = 0; i < Math.min(bindingTargets.length, 8); ++i) {
		var spanParent = document.getElementById(bindingTargets[i].placeholder);
		if (!spanParent) {
			continue;
		}

		var alphaPair = {numeric: CustomNumericAlphaList[i], state: CustomStateAlphaList[i]};

		if (bChangeDom) {
			spanParent.appendChild(alphaPair.numeric);
			spanParent.appendChild(alphaPair.state);
		}

		if (bSetFormatting) {
			var decimalFormatter = "%.2f";
			switch (bindingTargets[i].decimals) {
			case 0:
				decimalFormatter = "%.0f";
				break;
			case 1:
				decimalFormatter = "%.1f";
				break;
			case 2:
				decimalFormatter = "%.2f";
				break;
			case 3:
				decimalFormatter = "%.3f";
				break;
			case 4:
				decimalFormatter = "%.4f";
				break;
			}
			alphaPair.numeric.numericDisplayFormat = decimalFormatter;
		}

		alphaPair.numeric.style.width = String(spanParent.clientWidth) + "px";
		alphaPair.numeric.style.height = String(spanParent.clientHeight + 5) + "px";
		alphaPair.numeric.style.left = String(spanParent.offsetLeft + 1) + "px";
		alphaPair.numeric.style.top = String(spanParent.offsetTop ) + "px";

		alphaPair.state.style.width = String(spanParent.clientWidth) + "px";
		alphaPair.state.style.height = String(spanParent.clientHeight+ 5) + "px";
		alphaPair.state.style.left = String(spanParent.offsetLeft + 1) + "px";
		alphaPair.state.style.top = String(spanParent.offsetTop ) + "px";
	}
	return true;
}

function OnBtnStateChanged(elem, baseClassName, state, bStart) {
    if (elem == null)
        return;
    var stateClassName = baseClassName + "_" + state;
    if (bStart)
        ClassNameReplace(elem, "", stateClassName);
    else
        ClassNameReplace(elem, stateClassName, "");
}

function ClassNameReplace(elem, oldClass, newClass) {
    if (elem == null)
        return;
    
    var newClassName = elem.className;
    if (oldClass.length > 0) {
        var classArray = newClassName.split(" ");
        for (var i = classArray.length - 1; i >= 0; --i) {
            if (classArray[i] == oldClass)
                classArray.splice(i, 1);
            
            // If existing class list already has the new class, don't add it again.    
            if (classArray[i] == newClass)
                newClass = "";
        }
        newClassName = classArray.join(" ");
    }
    
    if (newClass.length > 0) {
        newClassName += (" " + newClass);
    }
    
    elem.className = newClassName;
}

function IsValueEnum(cboElem) {
	var enumType = 8;
	try {
		return (cboElem.Binding.DataObjects.Item(0).ValueType == enumType);
	} catch (err) {
		return false;
	}
}

function IsAlphaNumeric(value) {
	var strValue = String(value).toLowerCase();
	if ((strValue.charAt(0) == " ") &&(parseInt(strValue) != NaN)) {
		// first char is space and first non-space char is a digit
		return true;
	} else if ((strValue == "nan") || (strValue == "+inf") || (strValue == "-inf")) {
		return true;
	}
	return false;
}

// register the alpha moving function on the document
document.moveCustomBindingAlphas = moveCustomBindingAlphas;</SCRIPT>
