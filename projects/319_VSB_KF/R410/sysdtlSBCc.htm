<SCRIPT language=VBScript for=sd defer event=ondatachange>if sd.DataChanged("currentpoint.SCMOPT") then
	If sd.DataValue("currentpoint.SCMOPT") = 3 Then
		'Scm Option is COMMON
		shpTab.objects("bitmap004").style.visibility = "Visible"
		pbArbitration.style.visibility = "Visible"			
	else
		shpTab.objects("bitmap004").style.visibility = "Hidden"
		pbArbitration.style.visibility = "Hidden"
	end If
end if

if not sd.QualityBad ("CurrentPoint.SBCA.PCC") then

	For i = 1 To sd.DataValue ("CurrentPoint.SBCA.PCC")
			document.getElementById("grpSBE"&i).style.visibility = "visible"
	next
	for i = (sd.DataValue("CurrentPoint.SBCA.PCC")+1) to 6
		document.getElementById("grpSBE"&i).style.visibility = "hidden"
	Next
end if</SCRIPT>
