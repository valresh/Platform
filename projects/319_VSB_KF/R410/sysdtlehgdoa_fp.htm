<SCRIPT language=VBScript defer>dim gbPageComplete, strFBName
strFBName = "{%FFBNAME%}"
gbPageComplete = false

bDigitalOutputPoint = false : bMomentaryPressed = false : iDigitalOPValue = 0 : iTimerID = 0
dim IKB_KEY_RAISE, IKB_KEY_RAISE_RELEASE, IKB_KEY_LOWER, IKB_KEY_LOWER_RELEASE, IKB_KEY_FAST_RAISE, IKB_KEY_FAST_RAISE_RELEASE, IKB_KEY_FAST_LOWER, IKB_KEY_FAST_LOWER_RELEASE
IKB_KEY_RAISE=1099431937 : IKB_KEY_RAISE_RELEASE=-1048051711 : IKB_KEY_FAST_RAISE=1099497473 : IKB_KEY_FAST_RAISE_RELEASE=-1047986175 : IKB_KEY_LOWER=1099563009
IKB_KEY_LOWER_RELEASE=-1047920639 : IKB_KEY_FAST_LOWER=1099628545 : IKB_KEY_FAST_LOWER_RELEASE=-1047855103

sub ApplyLayout()
	on error resume next
	GrpLowerPanel.style.top = "" : GrpLowerPanel.style.bottom = "2px"
	GrpCenterPanel.style.top= "" : GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 1) & "px"
end sub

sub HandleMomentaryControl(iKeyCode)
	if rect002.DataValue("CurrentPoint.{%FFBNAME%}.MOOUTIND") = 1 then
		'Moment then
		bDigitalOutputPoint = true
	end if

if bDigitalOutputPoint=True then
		select Case iKeyCode
   		case IKB_KEY_RAISE					
			 window.event.ReturnValue = false 
			 if	bMomentaryPressed = false then
				bMomentaryPressed = true : iDigitalOPValue = 1
			 if iTimerID = 0 then
					iTimerID = window.setInterval("TimerFunction",1000)
			 end if
			 end if
   		case IKB_KEY_RAISE_RELEASE 			
	  		 window.event.ReturnValue=TRUE
			 if	bMomentaryPressed = true then
				bMomentaryPressed = false : SDA_Momentary.value = 0
			 end if
 	  	case IKB_KEY_FAST_RAISE				
			 window.event.ReturnValue = false 
   		case IKB_KEY_FAST_RAISE_RELEASE 	
			 window.event.ReturnValue=TRUE
  		case IKB_KEY_LOWER 					
			 window.event.ReturnValue = false 
  		case IKB_KEY_LOWER_RELEASE 			
	         window.event.ReturnValue=TRUE
		case IKB_KEY_FAST_LOWER 			
			 window.event.ReturnValue = false 
		case IKB_KEY_FAST_LOWER_RELEASE		
			 window.event.ReturnValue=TRUE
	end select
end if
end sub

sub SetTags()
on error resume next
if gbPageComplete then
	if rect002.DataValue("CurrentPoint.{%FFBNAME%}.REDTAG") = 1 then
			picRedTag.style.visibility = "visible"
	else
			picRedTag.style.visibility = "Hidden"
	end if
end if
end sub

sub TimerFunction
	if bMomentaryPressed = true and document.hasFocus = True then
		SDA_Momentary.value = iDigitalOPValue
	else
		window.clearInterval(iTimerID) : iTimerID = 0
		bMomentaryPressed = false : SDA_Momentary.value = 0
	end if
End Sub</SCRIPT>
