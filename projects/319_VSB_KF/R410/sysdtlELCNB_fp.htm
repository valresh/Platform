<SCRIPT language=VBScript for=sd defer event=ondatachange>dim sTemp

if sd.DataChanged("currentpoint.RDNROLESTATE") then
  if not sd.QualityBad("currentpoint.RDNROLESTATE") then
    if sd.DataValue("currentpoint.RDNROLESTATE") = 0 then
		 'RDNROLESTATE  is UNDEFINED
        alpRDN_State.style.visibility = "hidden": txtSYNC_State.style.visibility = "hidden": alpSYNC_State.style.visibility = "hidden": txtRDN_Role.style.visibility = "hidden"
    elseif sd.DataValue("currentpoint.RDNROLESTATE") = 1 then 
		'RDNROLESTATE is NONREDUND
	   	txtSYNC_State.style.visibility = "hidden": alpSYNC_State.style.visibility = "hidden"
    End if
 End if
End if

 	if sd.DataChanged("CurrentPoint.LANAFAILED") or sd.DataChanged("CurrentPoint.LANBFAILED") or sd.DataChanged("CurrentPoint.LCNCBLSTSA") or sd.DataChanged("CurrentPoint.UEADISPLAYLN1") then
		call UpdateIcons()
 	end if

	if sd.DataChanged("CurrentPoint.LCNCBLSTSB") or sd.DataChanged("CurrentPoint.NODESTATESTR") or sd.DataChanged("CurrentPoint.LCNACTVCBL") or sd.DataChanged("CurrentPoint.LCNBCTVCBL") then
		call UpdateIcons()
	end if

	if sd.QualityBad("CurrentPoint.DEVICEIDX") then
		txtFTEIndex.value = ""
	elseif sd.DataChanged("CurrentPoint.DEVICEIDX") then
		txtFTEIndex.value = "#" & sd.DataValue("CurrentPoint.DEVICEIDX")
	end if

	if sd.QualityBad("CurrentPoint.IPADDRESS") or sd.QualityBad("CurrentPoint.DEVICEIDX") then
		txtIPAddress.value = "" ' clear if bad DEVICEIDX also, as IPADDRESS may still be good(?)
	elseif sd.DataChanged("CurrentPoint.IPADDRESS") then
		txtIPAddress.value = sd.DataValue("CurrentPoint.IPADDRESS")
	end if

	' INTERLANFAILED status icon
	if sd.QualityBad("CurrentPoint.INTERLANFAILED") then
		shpStatusINTERLANFAILED.value = 7   ' unknown off
	elseif sd.DataChanged("CurrentPoint.INTERLANFAILED") then
		if sd.DataValue("CurrentPoint.INTERLANFAILED") = 0 then
			shpStatusINTERLANFAILED.value = 2
			txtInterLAN.value = "FTE InterLAN comm."
		else
			shpStatusINTERLANFAILED.value = 4
			txtInterLAN.value = "FTE InterLAN comm. FAIL"
		end if
	end if

	' XOVERFAILED status icon
	if sd.QualityBad("CurrentPoint.XOVERFAILED") then
		shpStatusXOVERFAILED.value = 7   ' unknown off
	elseif sd.DataChanged("CurrentPoint.XOVERFAILED") then
		if sd.DataValue("CurrentPoint.XOVERFAILED") = 0 then
			shpStatusXOVERFAILED.value = 2
			txtCrossover.value = "FTE crossover cable"
		else
			shpStatusXOVERFAILED.value = 4
			txtCrossover.value = "FTE crossover cable FAIL"
		end if
	end if</SCRIPT>

<SCRIPT language=VBScript defer>'                               COPYRIGHT (c) 2017
'                                 HONEYWELL INTL.,
'                              ALL RIGHTS RESERVED

'        as a trade secret. Legal rights of Honeywell Inc. in this

'        must be reproduced in any copies authorized by Honeywell Inc.

'        notice and should not be considered as a commitment by Honeywell
'        Inc.
'

correctWidth = 0
SKIP = -1

'Dim isfpShutDownCommandIssued
'Dim stringShutdown
'Dim stringNone
Dim bStyleLight
Dim n10SecondCounter  'every 10th periodic update, do an icon refresh

'isShutDownCommandIssued = false
'stringShutdown = "SHUTDOWN"
'stringNone = "NONE"
bStyleLight = true   'track style light vs. dark
n10SecondCounter = 0

Sub ApplyLayout()           
                Call AdjustHeight()
                Call AdjustWidth()
End Sub

Sub AdjustHeight()
                
                GrpLowerPanel.style.top = "" 
                GrpLowerPanel.style.bottom = "2px"
                GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 
                GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
              	 
End Sub

Sub AdjustWidth()
                Call CalculateCorrectWidth()       
                if (correctWidth <> SKIP) then                   
                    GrpUpperPanel.style.pixelwidth = correctWidth 
                    GrpCenterPanel.style.pixelwidth = correctWidth
                    GrpLowerPanel.style.pixelwidth = correctWidth 
												
                end if
End Sub

Sub CalculateCorrectWidth()
                POPUP = 0
                displayType = window.external.Application.CurrentDisplayPageType 
				CurrentPage = window.external.CurrentPage

					if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
                	
                                correctWidth = SKIP
                                Exit Sub
               		else   

               		if (page.style.zoom > 1) then   
                 		shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))                               
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                                                                                                 
                    else                                        
                         shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                         correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                

                    end if

                end if    

End Sub

sub UpdateIcons
	sTemp = alpNodeStatusStr.value
	if sTemp = "" or sd.QualityBad("CurrentPoint.NODESTATESTR") then 
		txtNotLoaded.style.visibility = "Inherit"
		alpNodeStatusStr.style.visibility = "Hidden"
		shpNODESTATUS.value = 8		  ' shape # for yellow-dash 'marginal
	else
		if instr(sTemp, "NOSYN") <> 0 then
			shpNODESTATUS.value = 8       ' marginal for e.g. WARN-NOSYNC or BACKUP-NOSYNC
		elseif left(sTemp,2) = "OK" or left(sTemp, 6) = "BACKUP" then
			shpNODESTATUS.value = 3       ' OK
	    elseif left(sTemp,13) = "No LCN Cables" or left(sTemp,4) = "FAIL" then
			shpNODESTATUS.value = 4       ' shape sequence # for (error)
		elseif sd.QualityBad("CurrentPoint.NODESTATESTR") then 
			shpNODESTATUS.value = 2       ' shape sequence # for 'off'
		else
			shpNODESTATUS.value = 8		  ' shape # for yellow-dash 'marginal
		end if
		shpNODESTATUS.style.visibility = "Inherit"
		txtNotLoaded.style.visibility = "Hidden"
		alpNodeStatusStr.style.visibility = "Inherit"
	end if



    if alpRDN_state.value = "PRIMARY" then
		if bStyleLight = true then
			shpPrimarySecondaryStatusPri.value = 2
		else 
			shpPrimarySecondaryStatusPri.value = 3
		end if
		if alphaTagNameSec.value = "" then 
			shpPrimarySecondaryStatusSec.value = 1 'hidden
'		elseif alpSYNC_State.value = "SYNCMAINT" then            <<< when HUE provides new yellow/red shapes, revisit this
'			if bStyleLight then 
'				shpPrimarySecondaryStatusSec.value = 5
'			else
'				shpPrimarySecondaryStatusSec.value = 6  
'			end if
		else
			shpPrimarySecondaryStatusSec.value = 7   ' gray "S"-not active secondary is same for both light/dark
		end if
		alphaTagNameSec.style.visibility = "Inherit"
	elseif alpRDN_state.value = "SECONDARY" then
		if bStyleLight = true then
			shpPrimarySecondaryStatusPri.value = 5 'counterintuitive for now, see comment below
		else 
			shpPrimarySecondaryStatusPri.value = 6
		end if
		'TBD: when secondary has access name of primary point name as a parameter value, we will maintain 
		'presentation of both primary and secondary point names in upper section.   In the meantime, for 
		'secondary points, we only show the secondary name as 'the point name' in the faceplate, so hide in this csae
		'SECMODNAME' i.e. alphaTagNameSec
		alphaTagNameSec.style.visibility = "Hidden"
		shpPrimarySecondaryStatusSec.style.visibility = "Hidden"
	else 
		shpPrimarySecondaryStatusPri.value = 1 ' hidden
		alphaTagNameSec.style.visibility = "Hidden"
		shpPrimarySecondaryStatusSec.value = 1 ' hidden 
		
	end if



	if sd.QualityBad("CurrentPoint.LANAFAILED") then
		shpLANAFAILED.value = 2		  ' off
		txtA.textColor = txtCPU_free.textColor  'never highlighted when bad
	else
		if sd.DataValue("CurrentPoint.LANAFAILED") = 0 then '0 == 'not failed', i.e. OK
			shpLANAFAILED.value = 3   ' OK
			txtA.textColor = vbWhite
			txtA.title = "FTE A OK"
			shpLANAFAILED.title = "FTE A OK"
		else
			shpLANAFAILED.value = 4         ' shape sequence # for 'failed'
			txtA.textColor = txtCPU_free.textColor
			txtA.title= "FTE A fail"
			shpLANAFAILED.title = "FTE A fail"
		end if
	end if
	shpLANAFAILED.style.visibility = "Inherit"

	if sd.QualityBad("CurrentPoint.LANBFAILED") then
		shpLANBFAILED.value = 2            ' Off
		txtB.textColor = txtCPU_free.textColor 'never highlighted when bad
	else
		if sd.DataValue("CurrentPoint.LANBFAILED") = 0 then 
			shpLANBFAILED.value = 3        ' OK
			txtB.textColor = vbWhite
			txtB.title = "FTE B OK"
			shpLANBFAILED.title = "FTE B OK"
		else
			shpLANBFAILED.value = 4       ' Fail         
			txtB.textColor = txtCPU_free.textColor
			txtB.title= "FTE B fail"
			shpLANBFAILED.title = "FTE B fail"
		end if
	end if
	shpLANBFAILED.style.visibility = "Inherit"

	if sd.QualityBad("CurrentPoint.LCNCBLSTSA") then
		shpLCNCBLSTSA.value = 2          ' Off
	else
		if sd.DataValue("CurrentPoint.LCNCBLSTSA") = 0 then 
			shpLCNCBLSTSA.value = 3      ' OK
			shpLCNCBLSTSA.title = "LCN Cable A OK"
		else
			shpLCNCBLSTSA.value = 4      ' Fail      
			shpLCNCBLSTSA.title = "LCN Cable A Fail"
		end if
	end if
	shpLCNCBLSTSA.style.visibility = "Inherit"

	if sd.QualityBad("CurrentPoint.LCNCBLSTSB") then
		shpLCNCBLSTSB.value = 2          ' Off
	else
		if sd.DataValue("CurrentPoint.LCNCBLSTSB") = 0 then 
			shpLCNCBLSTSB.value = 3      ' OK
			shpLCNCBLSTSB.title = "LCN Cable B OK"
		else
			shpLCNCBLSTSB.value = 4      ' Fail        
			shpLCNCBLSTSB.title = "LCN Cable B Fail"
		end if
	end if
	shpLCNCBLSTSB.style.visibility = "Inherit"

	if sd.QualityGood("currentpoint.LCNACTVCBL") then
		if sd.DataValue("currentpoint.LCNACTVCBL") = 0 then
'			lnActiveCableA.style.visibility = "visible" : lnActiveCableB.style.visibility = "hidden"
			txtLcnA.textColor = vbWhite
			txtLcnA.title = "LCN Cable A Active"
			txtLcnB.textColor = txtCPU_free.textColor
			txtLcnB.title = "LCN Cable B Inactive"
		else
'			lnActiveCableA.style.visibility = "hidden" : lnActiveCableB.style.visibility = "visible"
			txtLcnB.textColor =  vbWhite  '"#FFFFFF"
			txtLcnA.title = "LCN Cable A Inactive"
			txtLcnA.textColor = txtCPU_free.textColor
			txtLcnB.title = "LCN Cable B Active"
		end if
	else
		txtLcnA.textColor = txtCPU_free.textColor     ' neither is 'active'
		txtLcnB.textColor = txtCPU_free.textColor
	end if

	if sd.QualityGood("CurrentPoint.UEADISPLAYLN1") then
		sTemp = sd.DataValue("CurrentPoint.UEADISPLAYLN1")
		'specific location of e.g. "ELCN_BRG    LCN:34") is always 13th char
		if mid(sTemp, 13,3) = "LCN" or mid(sTemp, 13, 3) = "UCN" then   'don't update while not showing LCN/UCN at UEA box
			txtLCNNbr.value = mid(sTemp,13,4) & rtrim(right(sTemp,2)) 
		end if
	else
		txtLCNNbr.value = ""
	end if
end sub</SCRIPT>
