<SCRIPT language=VBScript for=MACAddress defer event=onupdate>dim strPortStatusParamBase, strNumberOfPorts, ix

	shpPortStatus.autoReloadContent = false
	if IsStsGoodQuality(me) and me.value <> "" then' and NbrPorts.value <> 0 and NbrPorts.value <> "NAN" then
		' construct parameter path
		strPortStatusParamBase = "localhost.[ROOT\HONEYWELL].ControlFirewall.MACAddress=""" & me.value & """.PortState."
		strNumberOfPorts = "localhost.[ROOT\HONEYWELL].ControlFirewall.MACAddress=""" & me.value & """.NumberOfPorts"
	 	if shpPortStatus.GetCustomProperty("Parameter", "PortStatusParam0") = strPortStatusParamBase & "0" then exit sub

		for ix = 0 to 8' NbrPorts.value '8
		 	shpPortStatus.SetCustomProperty "Parameter", "PortStatusParam" & CStr(ix), strPortStatusParamBase & CStr(ix)
		next

		shpPortStatus.SetCustomProperty "Parameter", "NbrPorts", strNumberOfPorts
		shpPortStatus.SetCustomProperty "Point", "SpsPoint", displayDataRepository.GetValue("CurrentPoint")
	else
	 	if shpPortStatus.GetCustomProperty("Parameter", "PortStatusParam0") = "" then exit sub
		for ix = 0 to 8
		 	shpPortStatus.SetCustomProperty "Parameter", "PortStatusParam" & CStr(ix), ""
		next
		shpPortStatus.SetCustomProperty "Point", "SpsPoint", ""
	end if
	shpPortStatus.ReloadContent</SCRIPT>

sub ApplyLayout()

	' Comment out the following line if you don’t want the center panel to be stretched (e.g. on sysdtlsta)
	grpCenterPanel.style.bottom = (grpLowerPanel.style.pixelHeight + 15) & "px"
'	GrpCenterPanel.style.pixelHeight = Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 20
end sub

' IsStsGoodQuality() - Function to determine whether a data bound object has good quality
function IsStsGoodQuality(obj)
	if not obj is nothing and IsObject(obj) then
		if (obj.quality and 192) = 192 then
			IsStsGoodQuality = TRUE
		else
			IsStsGoodQuality = FALSE
		end if
	else
		IsStsGoodQuality = FALSE
	end if
end function</SCRIPT>

<SCRIPT language=VBScript for=shpPortStatus_sdPortStatus defer 
event=ondatachange>	dim ix, nNbrPorts, wValue, sParamName, sToolTip

'	msgbox "nbr ports: " & me.DataValue("spspoint.nbrports")
'	msgbox "LED1's wValue is: " & me.DataValue("spspoint.portstatusparam1")

	if not me.QualityGood("spspoint.nbrports") then
		shpPortStatus_txtNoPorts.style.visibility = "Inherit"
'		shpPortStatus_grpPortStatus.style.visibility = "Hidden"
'		msgbox "bad quality NbrPorts!"
	else
		shpPortStatus_txtNoPorts.style.visibility = "Hidden"
		shpPortStatus_grpPortStatus.style.visibility = "Inherit"
		nNbrPorts = me.DataValue("spspoint.nbrports")

'		msgbox "Number ports: " & nNbrPorts

		for ix = 0 to nNbrPorts - 1

			sParamName = "spspoint.portstatusparam" & ix

'msgbox "testing quality of " & sParamName

			if not me.QualityGood(sParamName) then
				sToolTip = "Unknown state"
				nState = 1
			else
				wValue = me.DataValue(sParamName)

'msgbox "value of " & sParamName & " is " & wValue

				if wValue AND 128 then
					sToolTip = "100MBit/"
				else
					sToolTip = "10MBit/"
				end if
				if wValue AND 64 then
					sToolTip = sToolTip & "Full Duplex,"
				else
					sToolTip = sToolTip & "Half Duplex,"
				end if
				if wValue AND 32 then
					sToolTip = sToolTip & "Up"
					nState = 2
				else
					sToolTip = sToolTip & "Down"
					nState = 3
				end if

			end if

			select case ix

				case 0 
					shpPortStatus_shpLED00.title = sToolTip
					shpPortStatus_shpLED00.value = nState
				case 1 
					shpPortStatus_shpLED01.title = sToolTip
					shpPortStatus_shpLED01.value = nState
				case 2 
					shpPortStatus_shpLED02.title = sToolTip
					shpPortStatus_shpLED02.value = nState
				case 3 
					shpPortStatus_shpLED03.title = sToolTip
					shpPortStatus_shpLED03.value = nState
				case 4 
					shpPortStatus_shpLED04.title = sToolTip
					shpPortStatus_shpLED04.value = nState
				case 5 
					shpPortStatus_shpLED05.title = sToolTip
					shpPortStatus_shpLED05.value = nState
				case 6 
					shpPortStatus_shpLED06.title = sToolTip
					shpPortStatus_shpLED06.value = nState
				case 7 
					shpPortStatus_shpLED07.title = sToolTip
					shpPortStatus_shpLED07.value = nState
				case 8 
					shpPortStatus_shpLED08.title = sToolTip
					shpPortStatus_shpLED08.value = nState

				case else
					' do nothing
			end select
		next

		' either have 9 ports or 2 ports (latter for modbus)
		' if only 2 ports, then hide the LEDs for ports 2-8 (leaving 0 and 1)

		shpPortStatus_shpLED00.style.visibility = "Inherit"
		shpPortStatus_txtLED00.style.visibility = "Inherit"
		shpPortStatus_shpLED01.style.visibility = "Inherit"
		shpPortStatus_txtLED01.style.visibility = "Inherit"


		if nNbrPorts = 2 then ' hide invalid port status LEDs

			shpPortStatus_shpLED02.style.visibility = "Hidden"
			shpPortStatus_txtLED02.style.visibility = "Hidden"
			shpPortStatus_shpLED03.style.visibility = "Hidden"
			shpPortStatus_txtLED03.style.visibility = "Hidden"
			shpPortStatus_shpLED04.style.visibility = "Hidden"
			shpPortStatus_txtLED04.style.visibility = "Hidden"
			shpPortStatus_shpLED05.style.visibility = "Hidden"
			shpPortStatus_txtLED05.style.visibility = "Hidden"
			shpPortStatus_shpLED06.style.visibility = "Hidden"
			shpPortStatus_txtLED06.style.visibility = "Hidden"
			shpPortStatus_shpLED07.style.visibility = "Hidden"
			shpPortStatus_txtLED07.style.visibility = "Hidden"
			shpPortStatus_shpLED08.style.visibility = "Hidden"
			shpPortStatus_txtLED08.style.visibility = "Hidden"

		else ' all 9 ports 
			shpPortStatus_shpLED02.style.visibility = "Inherit"
			shpPortStatus_txtLED02.style.visibility = "Inherit"
			shpPortStatus_shpLED03.style.visibility = "Inherit"
			shpPortStatus_txtLED03.style.visibility = "Inherit"
			shpPortStatus_shpLED04.style.visibility = "Inherit"
			shpPortStatus_txtLED04.style.visibility = "Inherit"
			shpPortStatus_shpLED05.style.visibility = "Inherit"
			shpPortStatus_txtLED05.style.visibility = "Inherit"
			shpPortStatus_shpLED06.style.visibility = "Inherit"
			shpPortStatus_txtLED06.style.visibility = "Inherit"
			shpPortStatus_shpLED07.style.visibility = "Inherit"
			shpPortStatus_txtLED07.style.visibility = "Inherit"
			shpPortStatus_shpLED08.style.visibility = "Inherit"
			shpPortStatus_txtLED08.style.visibility = "Inherit"


		end if

	end if</SCRIPT>
