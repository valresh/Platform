<SCRIPT language=VBScript defer>Dim RowNum
Sub Display_Channel_Type(RowNum)
If not sd.QualityBad("currentpoint."&"CHANNELTYPE"&"["&RowNum&"]") then
If (sd.DataValue("currentpoint."&"CHANNELTYPE"&"["&RowNum&"]")) = 1 or (sd.DataValue("currentpoint."&"CHANNELTYPE"&"["&RowNum&"]")) = 4 then
     document.getElementById("ConAlpPV" & RowNum).style.visibility = "Hidden"
	if not sd.QualityBad("currentpoint."&"CHANDATA"&"["&RowNum&"]") then
     
	 document.getElementById("ShaDig" & RowNum).value = sd.DataValue("currentpoint."&"CHANDATA"&"["&RowNum&"]") + 2
   end if 
	 

    elseif (sd.DataValue("currentpoint."&"CHANNELTYPE"&"["&RowNum&"]")) = 2 or (sd.DataValue("currentpoint."&"CHANNELTYPE"&"["&RowNum&"]")) = 5 then
	  document.getElementById("ShaDig" & RowNum).style.visibility = "hidden"
	  
    else
      document.getElementById("ShaDig" & RowNum).style.visibility = "hidden"
      document.getElementById("ConAlpPV" & RowNum).style.visibility = "Hidden"
      document.getElementById("txtchn" & RowNum).style.visibility = "Hidden"
 end if
 else 
     
      document.getElementById("ShaDig" & RowNum).value = 1 
end if 


End sub</SCRIPT>
