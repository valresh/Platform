<SCRIPT language=VBScript defer>dim gbPageComplete, strCtlBlockName

strCtlBlockName = "DevCtl"

gbPageComplete = false
bMomentaryTriggered = false : iDigitalOPValue = 0 : iTimerID = 0 
dim IKB_KEY_RAISE, IKB_KEY_RAISE_RELEASE, IKB_KEY_LOWER, IKB_KEY_LOWER_RELEASE, IKB_KEY_FAST_RAISE, IKB_KEY_FAST_RAISE_RELEASE, IKB_KEY_FAST_LOWER, IKB_KEY_FAST_LOWER_RELEASE
IKB_KEY_RAISE=1099431937 : IKB_KEY_RAISE_RELEASE=-1048051711 : IKB_KEY_FAST_RAISE=1099497473 : IKB_KEY_FAST_RAISE_RELEASE=-1047986175 : IKB_KEY_LOWER=1099563009 : IKB_KEY_LOWER_RELEASE=-1047920639
IKB_KEY_FAST_LOWER=1099628545 : IKB_KEY_FAST_LOWER_RELEASE=-1047855103  

sub HandleMomentaryControl(iKeyCode)
if (sd.DataValue("CurrentPoint.DEVCTL.MOMSTRETRIGGER")=1) and (sd.DataValue("CurrentPoint.DEVCTL.MOMSTATE")<> 0) then
   'Momentray is triggered and Momentray state is not None
	bMomentaryTriggered = true
else
	bMomentaryTriggered = false
	Exit sub
end if
if bMomentaryTriggered=True then
	select Case iKeyCode
		case IKB_KEY_RAISE 
        window.event.ReturnValue = false 
			select case sd.DataValue("Currentpoint.DEVCTL.MOMSTATE")
			case 0 ' Mometry is configured as none then as per normal behavior
			case 1 ' Mometry is configured as State 0 
				sd.DataValue("Currentpoint.DEVCTL.GOP") = 4
				iDigitalOPValue = 4
	            if iTimerID = 0 then
	               iTimerID = window.setInterval("TimerFunction",1000)
	             end if
			case 2 ' Mometry is configured as State 1 
				sd.DataValue("Currentpoint.DEVCTL.GOP") = 5
				iDigitalOPValue = 5
	            if iTimerID = 0 then
	               iTimerID = window.setInterval("TimerFunction",1000)
	             end if
			case 3 ' Mometry is configured as State state 0 and state 1
				sd.DataValue("Currentpoint.DEVCTL.GOP") = 5
				iDigitalOPValue = 5
	            if iTimerID = 0 then
	               iTimerID = window.setInterval("TimerFunction",1000)
	             end if
			case 4 ' Mometry is configured as State 2
				sd.DataValue("Currentpoint.DEVCTL.GOP") = 6
				iDigitalOPValue = 6
	            if iTimerID = 0 then
	               iTimerID = window.setInterval("TimerFunction",1000)
	             end if
			case 5 ' Mometry is configured as State 0 and state 2
				sd.DataValue("Currentpoint.DEVCTL.GOP") = 6
				iDigitalOPValue = 6
	            if iTimerID = 0 then
	               iTimerID = window.setInterval("TimerFunction",1000)
	             end if
			case 6 ' Mometry is configured as State 1 amd state 2
			sd.DataValue("Currentpoint.DEVCTL.GOP") = 6
				iDigitalOPValue = 6
	            if iTimerID = 0 then
	               iTimerID = window.setInterval("TimerFunction",1000)
	             end if
			end select
         case IKB_KEY_RAISE_RELEASE   
         window.event.ReturnValue = True
			sd.DataValue("Currentpoint.DEVCTL.GOP") = 3 ' It will return to safe state
			window.clearInterval(iTimerID) : iTimerID = 0  
         case IKB_KEY_FAST_RAISE 
         	  window.event.ReturnValue = false 
         case IKB_KEY_FAST_RAISE_RELEASE 
              window.event.ReturnValue=TRUE         
         case IKB_KEY_LOWER    
              window.event.ReturnValue = false 
			select case sd.DataValue("Currentpoint.DEVCTL.MOMSTATE")
				case 0 ' Mometry is configured as none then No action
				case 1 ' Mometry is configured as State 0 Lower key will not have effect as only only one momentary state
				case 2 ' Mometry is configured as State 1 Lower key will not have effect as only only one momentary state
				case 3 ' Mometry is configured as State 0 and state 1 Lower key will move to state 0
					sd.DataValue("Currentpoint.DEVCTL.GOP") = 4
					iDigitalOPValue = 4
		            if iTimerID = 0 then
		               iTimerID = window.setInterval("TimerFunction",1000)
		             end if
				case 4 ' Mometry is configured as State 2 Lower key will not have effect as only only one momentary state

				case 5 ' Mometry is configured as State 0 and state 2 Lower key will move to state 0
					sd.DataValue("Currentpoint.DEVCTL.GOP") = 4
					iDigitalOPValue = 4
		            if iTimerID = 0 then
		               iTimerID = window.setInterval("TimerFunction",1000)
		             end if
				case 6 ' Mometry is configured as State 1 and state 2 Lower key will move to state 1
					sd.DataValue("Currentpoint.DEVCTL.GOP") = 5
					iDigitalOPValue = 5
		            if iTimerID = 0 then
		               iTimerID = window.setInterval("TimerFunction",1000)
		             end if
				end select
          case IKB_KEY_LOWER_RELEASE 
               window.event.ReturnValue=TRUE
					sd.DataValue("Currentpoint.DEVCTL.GOP") = 3 ' It will return to safe state
					window.clearInterval(iTimerID) : iTimerID = 0
		  case IKB_KEY_FAST_LOWER 
               window.event.ReturnValue = false 
          case IKB_KEY_FAST_LOWER_RELEASE 
               window.event.ReturnValue=TRUE 
          end select
end if
end sub

sub TimerFunction
if bMomentaryTriggered = true then
   sd.DataValue("Currentpoint.DEVCTL.GOP") = iDigitalOPValue
else
 window.clearInterval(iTimerID) : iTimerID = 0
end if
End Sub

  		GrpStateS3.style.visibility="hidden"
	else
  		GrpStateS3.style.visibility="visible"
	end if
end sub

sub GPVUpdate
on error resume next
	select case sd.DataValue("CurrentPoint.DevCtl.gpv")
	   case 4 
	   		ShpGPVStateS0.value=2 : ShpGPVStateS1.value=1 : ShpGPVStateS2.value=1
			ConAlpStateTextS0.style.fontWeight="Bold" : TxtS0.style.fontWeight="Bold"
			ConAlpStateTextS1.style.fontWeight="Normal" : TxtS1.style.fontWeight="Normal"
			ConAlpStateTextS2.style.fontWeight="Normal" : TxtS2.style.fontWeight="Normal"
	   case 5 
	   		ShpGPVStateS0.value=1 : ShpGPVStateS1.value=2 : ShpGPVStateS2.value=1
			ConAlpStateTextS1.style.fontWeight="Bold" : TxtS1.style.fontWeight="Bold"
			ConAlpStateTextS0.style.fontWeight="Normal" : TxtS0.style.fontWeight="Normal"
			ConAlpStateTextS2.style.fontWeight="Normal" : TxtS2.style.fontWeight="Normal"
	   case 6 
	   		ShpGPVStateS0.value=1 : ShpGPVStateS1.value=1 : ShpGPVStateS2.value=2
			ConAlpStateTextS2.style.fontWeight="Bold" : TxtS2.style.fontWeight="Bold"
			ConAlpStateTextS1.style.fontWeight="Normal" : TxtS1.style.fontWeight="Normal"
			ConAlpStateTextS0.style.fontWeight="Normal" : TxtS0.style.fontWeight="Normal"
	   case else 
	    	ShpGPVStateS0.value=1 : ShpGPVStateS1.value=1 : ShpGPVStateS2.value=1
			ConAlpStateTextS0.style.fontWeight="Normal" : TxtS0.style.fontWeight="Normal"
			ConAlpStateTextS1.style.fontWeight="Normal" : TxtS1.style.fontWeight="Normal"
			ConAlpStateTextS2.style.fontWeight="Normal" : TxtS2.style.fontWeight="Normal"
	end select
end sub


sub HideInvalidInputsOutputs
	
	If sd.DataValue("CurrentPoint.DEVCTL.NUMDINPTS") = 0 then
		ShpGPVStateS0.style.visibility = "hidden" : ShpGPVStateS1.style.visibility = "hidden" : ShpGPVStateS2.style.visibility = "hidden" : TxtPV_CP.style.visibility = "hidden" : grpPV.style.visibility = "hidden" : shpLocalMan.style.visibility = "hidden" : txtLocalMan.style.visibility = "hidden"
	else 
		ShpGPVStateS0.style.visibility = "inherit" : ShpGPVStateS1.style.visibility = "inherit" : ShpGPVStateS2.style.visibility = "inherit" : TxtPV_CP.style.visibility = "inherit" : grpPV.style.visibility = "inherit" : shpLocalMan.style.visibility = "inherit" : txtLocalMan.style.visibility = "inherit"
	end if
	If sd.DataValue("CurrentPoint.DEVCTL.NUMDOUTS") = 0 then
		ShpGOPStateS0.style.visibility = "hidden" : ShpGOPStateS1.style.visibility = "hidden" : ShpGOPStateS2.style.visibility = "hidden" : TxtOP_CP.style.visibility = "hidden" : grpOP.style.visibility = "hidden"
	else
		ShpGOPStateS0.style.visibility = "inherit" : ShpGOPStateS1.style.visibility = "inherit" : ShpGOPStateS2.style.visibility = "inherit" : TxtOP_CP.style.visibility = "inherit" : grpOP.style.visibility = "inherit"
	end if
end sub

sub OIUpdate
	if ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[0]")=1 or ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[1]")=1 or ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[2]")=1 then
		ShaOI.value = 2
		ShaOI.title = ""
		if ConAlpGOP.DataValue("CurrentPoint.DevCtl.SAFEOP") = 4 then
			'Safe OP is S0
			if ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[0]")=1 then ShaOI.title = ConAlpStateTextS0.value
			if ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[1]")=1 then 
				if ShaOI.title = "" then ShaOI.title = ShaOI.title & ConAlpStateTextS1.value : else ShaOI.title = ShaOI.title & vbcr & ConAlpStateTextS1.value
			end if
			if ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[2]")=1 then 
				if ShaOI.title = "" then ShaOI.title = ShaOI.title & ConAlpStateTextS2.value : else ShaOI.title = ShaOI.title & vbcr & ConAlpStateTextS2.value
			end if
		elseif ConAlpGOP.DataValue("CurrentPoint.DevCtl.SAFEOP") = 5 then
			'Safe OP is S1
			if ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[1]")=1 then ShaOI.title = ConAlpStateTextS1.value
			if ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[0]")=1 then 
				if ShaOI.title = "" then ShaOI.title = ShaOI.title & ConAlpStateTextS0.value : else ShaOI.title = ShaOI.title & vbcr & ConAlpStateTextS0.value
			end if
			if ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[2]")=1 then 
				if ShaOI.title = "" then ShaOI.title = ShaOI.title & ConAlpStateTextS2.value : else ShaOI.title = ShaOI.title & vbcr & ConAlpStateTextS2.value
			end if
		elseif ConAlpGOP.DataValue("CurrentPoint.DevCtl.SAFEOP") = 6 then
			'Safe Op is S2
			if ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[2]")=1 then ShaOI.title = ConAlpStateTextS2.value
			if ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[0]")=1 then 
				if ShaOI.title = "" then ShaOI.title = ShaOI.title & ConAlpStateTextS0.value : else ShaOI.title = ShaOI.title & vbcr & ConAlpStateTextS0.value
			end if
			if ConAlpGOP.DataValue("CurrentPoint.Devctl.OI[1]")=1 then 
				if ShaOI.title = "" then ShaOI.title = ShaOI.title & ConAlpStateTextS1.value : else ShaOI.title = ShaOI.title & vbcr & ConAlpStateTextS1.value
			end if
		end if
	else
		ShaOI.value = 1
		ShaOI.title = ""
	end if
end sub

sub PIUpdate
	if ConAlpGOP.DataValue("CurrentPoint.Devctl.PI[0]")=0 or ConAlpGOP.DataValue("CurrentPoint.Devctl.PI[1]")=0 or ConAlpGOP.DataValue("CurrentPoint.Devctl.PI[2]")=0 then
		ShaPI.value = 1
		ShaPI.title = ""
		if ConAlpGOP.DataValue("CurrentPoint.Devctl.PI[0]")=0 then ShaPI.title = ConAlpStateTextS0.value
		if ConAlpGOP.DataValue("CurrentPoint.Devctl.PI[1]")=0 then 
			if ShaPI.title = "" then ShaPI.title = ShaPI.title & ConAlpStateTextS1.value : else ShaPI.title = ShaPI.title & vbcr & ConAlpStateTextS1.value
		end if
		if ConAlpGOP.DataValue("CurrentPoint.Devctl.PI[2]")=0 then 
			if ShaPI.title = "" then ShaPI.title = ShaPI.title & ConAlpStateTextS2.value : else ShaPI.title = ShaPI.title & vbcr & ConAlpStateTextS2.value
		end if
	else
		ShaPI.value = 2
		ShaPI.title = ""
	end if
end sub</SCRIPT>
