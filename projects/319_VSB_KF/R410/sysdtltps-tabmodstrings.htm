' General Section (sysdtlswitch_oneportstatus.sha)

Sub InitPort(objPort, sKey)
Dim sPath
Dim sDebugStr
Dim sTest

'	window.external.Parent.LogMessage "sysdtlswitch_oneportstatus.sha - InitPort TOP..."
	on error resume next  

	sPath = "localhost.[ROOT\SNMP\" & sSwitchName & "].SNMP_RFC1213_MIB_IFTABLE." & sKey

	sTest = objPort.GetCustomProperty("Value", "valuePortKey")
	if sTest = sKey then
' 		Debug/keep
'		window.external.Parent.LogMessage "InitPort - sKey already set for: " & sKey & ", NOT calling SetCustomProperty for this port's custom parameters"
	else

		objPort.autoReloadContent = false
		objPort.SetCustomProperty "Parameter", "paramOperStatus", sPath & ".ifOperStatus"
		objPort.SetCustomProperty "Parameter", "paramPortDescr", sPath & ".ifDescr"
		objPort.SetCustomProperty "Parameter", "paramPortSpeed", sPath & ".ifSpeed"
		objPort.SetCustomProperty "Parameter", "paramPortIndex", sPath & ".ifIndex"
		objPort.SetCustomProperty "Value", "valuePortKey", sKey
		objPort.SetCustomProperty "Point", "pointPort", sPoint

'Debug/keep
		'window.external.Parent.LogMessage "InitPort - sPath= " & sPath
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramOperStatus")
		'window.external.Parent.LogMessage "InitPort - paramOperStatus= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortDescr")
		'window.external.Parent.LogMessage "InitPort - paramPortDescr= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortSpeed")
		'window.external.Parent.LogMessage "InitPort - paramPortSpeed= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortIndex")
		'window.external.Parent.LogMessage "InitPort - paramOperStatus= " & sDebugStr
		'window.external.Parent.LogMessage "sysdtlswitch_oneportstatus.sha - InitPort bottom, calling .ReloadContent on single port..."
		objPort.ReloadContent

	end if

end sub


Sub PDC(objVal, nCol)
Dim sKey

'	window.external.Parent.LogMessage "oneportstatus - PDC TOP..."
	on error resume next ' hides script error, possibly addressed by above change to throttle .ReloadContent calls

	sKey = objVal.parentElement.parentElement.GetCustomProperty("Value", "valuePortKey")

'	window.external.Parent.LogMessage "... PDC sKey=" & sKey

	if sKey = "" then exit sub


	if IsStsGoodQuality(objVal) then 
'		window.external.Parent.LogMessage "oneportstatus - PDC IsStsGoodQuality GOOD, calling PortDataChange..."
		PortDataChange sKey, nCol, objVal.value
'	else
'		window.external.Parent.LogMessage "oneportstatus - PDC IsStsGoodQuality BAD - NOT calling PortDataChange"
	end if

End Sub

Sub PDC100000(objVal)
Dim sKey

	on error resume next
	sKey = objVal.parentElement.parentElement.GetCustomProperty("Value", "valuePortKey")
	if sKey = "" then exit sub
	if IsStsGoodQuality(objVal) then PortDataChange sKey, 0, objVal.value + 100000

End Sub

' End General Section (sysdtlswitch_oneportstatus.sha)
'</SCRIPT>

<SCRIPT language=VBScript for=combo_pages defer event=onchange>	dim nCounter
	dim nIdx
	dim nIdx2
	dim sNVal
	dim sNVal2
	dim sNVal3
	dim sTempObj
	dim sSTRObject

'	window.external.parent.logmessage "combo_pages change, new value is: >>" & me.value & "<<"
	if me.value = sLastPageShown then exit sub

	sLastPageShown = me.value
	
	'show the 'reading box data text...
	txtLoading.style.visibility = "Inherit" 
	
	'update the labels for this page
	sPage =  Right(sLastPageShown, LEN(sLastPageShown)-5)  'i.e. just the number part
'	window.external.parent.logmessage "combo_pages, OnChange; sPage = >>" & sPage & "<<"

	'index bumps up 100 per page
	if sPage <> "1" then
		nIdx = ((sPage-1) * 128) + 1 'page 2 is 100-200, page 22 is 2100-2200
	else
		nIdx = 1
	end if

  	intTimerID = window.setInterval ("UpdatePage()", 50)
'  	call UpdatePage()  'breaks display load

exit sub

	nIdx2 = nIdx

	if sPage = 1 then
		sNVal = "S00"
		sNVal2 = "S000" ' for values 1..9 only
		sNVal3 = "S0"   ' for values 100.128
	elseif sPage <= 7 then ' values less than 1000 
		sNVal = "S0" 'e.g. N0100
		sNVal2 = "S" 'for 1000-1024
	else
		sNVal = "S"  'for all over 1024 (all 4-digit)
	end if
	
	'update labels, requires autoReloadContent TRUE
	nCounter = 0
	do until nCounter => 16

		nCounter = nCounter + 1  '1..100 iterator
		sTempObj = "textbox" & nCounter

		if sPage = 1 then
			if  nCounter < 3 then
'				window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
				shpBoxStrings.Objects(sTempObj).value = sNVal2 & nIdx2 & ":"   	'e.g. S0001
			elseif nCounter < 14 then
				shpBoxStrings.Objects(sTempObj).value = sNVal & nIdx2 & ":"		'e.g. S0017
			else
				shpBoxStrings.Objects(sTempObj).value = sNVal3 & nIdx2 & ":"	'e.g. S0113
			end if				
		elseif sPage < 7 then 'pages 2-6 are all strictly triple-digit , i.e. S0nnn
			shpBoxStrings.Objects(sTempObj).value = sNVal & nIdx2 & ":"
		elseif sPage = 7 then
			if nCounter < 14 then
				shpBoxStrings.Objects(sTempObj).value = sNVal & nIdx2 & ":"  	'e.g. 897,...
			else
				shpBoxStrings.Objects(sTempObj).value = sNVal2 & nIdx2 & ":"	'i.e. 1001, 1009, 1017
			end if
		else 'pages 8 and up are all over 1024, i.e. 4-digits 
			shpBoxStrings.Objects(sTempObj).value = sNVal & nIdx2 & ":"			'all 4-digit array indices
		end if

		nIdx2 = nIdx2 + 8

	loop

	nCounter = 0

	'"Hide" the values that will be updated
	do until nCounter >= 128
		nCounter = nCounter + 1
		sSTRObject = "alp_STR8_" & nCounter
window.external.parent.logmessage "hiding object >>" & sSTRObject & "<<"

		shpBoxStrings.Objects(sSTRObject).style.visibility = "Hidden"    'had been hidden while not yet with valid data

	loop


	'Use briefly delayed timer to the combobox doesn't "hang down" during the page reload;  makes for more responsive feel
'  	intTimerID = window.setInterval ("UpdatePage()", 50)
	call UpdatePage() 'because Station otherwise freaks (read: bogs for up to 30 secs) out if call to reload content is timer-delayed</SCRIPT>

option explicit
Dim bListPopulated
Dim intTimerID
Dim intTimerID2
Dim bPageInitialized
Dim sBoxPointName
Dim sLastPageShown
dim bPagesCounted
dim nParamCount
dim g_STRLEN

nParamCount = -1 'init to 'dont use'

g_STRLEN = 0
bPagesCounted = FALSE
sLastPageShown = ""
bPageInitialized = FALSE
sBoxPointName = "TBD" 'format is $NMnnNnn, e.g., $NM<NTWKNUM>N<NODENUM>" and parameter is array NN(1..4095) for box numerics
bListPopulated = false

dim tab1stRowTop
dim tab2ndRowTop 
dim arrayTabs(12) 
arrayTabs(1) = 283
arrayTabs(2) = 382
arrayTabs(3) = 481
arrayTabs(4) = 580
arrayTabs(5) = 679
arrayTabs(6) = 778
arrayTabs(7) = 877
arrayTabs(8) = 976
arrayTabs(9) = 1075
arrayTabs(10) = 1174
arrayTabs(11) = 1174 ' below tab #10
arrayTabs(12) = 1075 ' below tab #9
tab1stRowTop = 39	
tab2ndRowTop = 61

Function UpdatePage()

'repopulate shpModStrings8

	dim nIdx
	dim nIdx2
	dim nCounter
	dim nCounter2
	dim sPage
	dim sTempObj
	dim sTempObj2
	dim sNVal
	dim sNVal2
	dim sNVal3
	dim sParamName
	dim sSTR
	dim nNumPages
	dim sSTRObject
	dim nLimit
	dim nParamsThisPage
	dim nFori

	nParamsThisPage = 128 'by default, expect full page of parameters

	select case g_STRLEN

		case 8
			nParamsThisPage = 128
			shpModStrings8.autoReloadContent = FALSE
		case 16
			nParamsThisPage = 64
			shpModStrings16.autoReloadContent = FALSE
		case 32
			nParamsThisPage = 32
			shpModStrings32.autoReloadContent = FALSE
		case 64
			nParamsThisPage = 16
			shpModStrings64.autoReloadContent = FALSE

	end select

	sPage = combo_pages.value
	window.clearInterval(intTimerID)

	sPage =  Right(sPage, LEN(sPage)-5)  'i.e. just the number part
'	window.external.parent.logmessage "sPage = >>" & sPage & "<<"

	if sPage <> "1" then
		nIdx = ((sPage-1) * nParamsThisPage) + 1 
	else
		nIdx = 1
	end if

	if nParamCount <> -1 and ((nIdx + nParamsThisPage-1) > nParamCount) then
		nParamsThisPage = nParamCount - nIdx + 1  'only show the last portion of this page; some value less than a full 128
	end if

	nIdx2 = nIdx 'for "Snnnn" label updates

'	window.external.parent.logmessage "nIdx = >>" & nIdx & "<<"

	nCounter = 0 

	for nFori=1 to nParamsThisPage

		sTempObj2 = "line" & nFori
		select case g_STRLEN
			case 8
				shpModStrings8.Objects(sTempObj2).style.visibility = "Hidden"
			case 16
				shpModStrings16.Objects(sTempObj2).style.visibility = "Hidden"
			case 32
				shpModStrings32.Objects(sTempObj2).style.visibility = "Hidden"
			case 64
				shpModStrings64.Objects(sTempObj2).style.visibility = "Hidden"
		end select

	next

'	if bPageInitialized = FALSE then
'		window.external.parent.logmessage "driving sBoxPointName to shape: >>" & sBoxPointName & "<<"
'		shpModStrings8.SetCustomProperty "point", "boxpoint", sBoxPointName
'	end if 

	do until nCounter >= nParamsThisPage
		nCounter = nCounter + 1  '1..128 iterator
		sParamName = "param" & nCounter	
		select case g_STRLEN
			case 8	
				sSTR = "STR8(" & nIdx & ")"   'nIdx may start at any interval of 128, e.g. 1, 129, 257, etc..
'				window.external.parent.logmessage "sSTR is >>" & sSTR & "<<  sParamName is >>" & sParamName & "<<"
'		window.external.Parent.LogMessage "SetCustom, param >>" & sSTR & "<<, nCounter:>>" & nCounter & "<<, sTempObj:>>" & sTempObj & "<<, sParamName: >>" & sParamName & "<<"
				shpModStrings8.SetCustomProperty "parameter", sParamName, sSTR
			case 16	
				sSTR = "STR16(" & nIdx & ")"   'nIdx may start at any interval of 128, e.g. 1, 129, 257, etc..
'				window.external.parent.logmessage "sSTR is >>" & sSTR & "<<  sParamName is >>" & sParamName & "<<"
'		window.external.Parent.LogMessage "SetCustom, param >>" & sSTR & "<<, nCounter:>>" & nCounter & "<<, sTempObj:>>" & sTempObj & "<<, sParamName: >>" & sParamName & "<<"
				shpModStrings16.SetCustomProperty "parameter", sParamName, sSTR
			case 32	
				sSTR = "STR32(" & nIdx & ")"   'nIdx may start at any interval of 128, e.g. 1, 129, 257, etc..
'				window.external.parent.logmessage "sSTR is >>" & sSTR & "<<  sParamName is >>" & sParamName & "<<"
'		window.external.Parent.LogMessage "SetCustom, param >>" & sSTR & "<<, nCounter:>>" & nCounter & "<<, sTempObj:>>" & sTempObj & "<<, sParamName: >>" & sParamName & "<<"
				shpModStrings32.SetCustomProperty "parameter", sParamName, sSTR
			case 64	
				sSTR = "STR64(" & nIdx & ")"   'nIdx may start at any interval of 128, e.g. 1, 129, 257, etc..
'				window.external.parent.logmessage "sSTR is >>" & sSTR & "<<  sParamName is >>" & sParamName & "<<"
'		window.external.Parent.LogMessage "SetCustom, param >>" & sSTR & "<<, nCounter:>>" & nCounter & "<<, sTempObj:>>" & sTempObj & "<<, sParamName: >>" & sParamName & "<<"
				shpModStrings64.SetCustomProperty "parameter", sParamName, sSTR
		end select

		nIdx = nIdx + 1 'bumping e.g. N0100 to N0101
	loop

	select case g_STRLEN

		case 8
			shpModStrings8.ReloadContent
			shpModStrings8.autoReloadContent = TRUE
		case 16
			shpModStrings16.ReloadContent
			shpModStrings16.autoReloadContent = TRUE
		case 32
			shpModStrings32.ReloadContent
			shpModStrings32.autoReloadContent = TRUE
		case 64
			shpModStrings64.ReloadContent
			shpModStrings64.autoReloadContent = TRUE

	end select

	txtLoading.style.visibility = "Hidden" 

'	if nCounter < 128 then 'we have less than a full page; hide the values/lines that aren't to be shown
'		do until nCounter >= 128
'			sParamName = "alp_STR8_" & nCounter		
'			shpModStrings8.Objects(sParamName).style.visibility = "Hidden"
'			nCounter = nCounter + 1
'		loop
'	end if
	
	'update labels, requires autoReloadContent TRUE

	sNVal = "S00"
	sNVal2 = "S000" ' for values 1..9 only
	sNVal3 = "S0"   ' for values 100.128

	nCounter = 0

	nIdx = nIdx2 ' reset to 1st array value for this page (1, 129, ...)
	nIdx2 = 1
	do while nCounter < 16 and nIdx <= nParamCount

		nCounter = nCounter + 1  '1..128 iterator
		sTempObj = "textbox" & nCounter
		nCounter2 = 0

'window.external.Parent.logmessage "Update labels, nCounter= " & nCounter & ", nIdx = " & nIdx & ", sTempObj = " & sTempObj

		select case g_STRLEN
	
			case 8 ' eight lines per row
				if sPage = 1 then
					sNVal = "S00"
					sNVal2 = "S000" ' for values 1..9 only
					sNVal3 = "S0"   ' for values 100.128
				elseif sPage <= 7 then ' values less than 1000 
					sNVal = "S0" 'e.g. N0100
					sNVal2 = "S" 'for 1000-1024
				else
					sNVal = "S"  'for all over 1024 (all 4-digit)
				end if

				do while nCounter2 < 8 and nIdx + nCounter2 <= nParamCount 'show the lines and the values
					sTempObj2 = "line" & nIdx2 + nCounter2
'window.external.Parent.logmessage sTempObj2 & ", with nIdx2= >>" & nIdx2 & "<< and nCounter2=>>" & nCounter2 & "<<"
					shpModStrings8.Objects(sTempObj2).style.visibility = "Inherit"
					nCounter2 = nCounter2 + 1
				loop		

				if sPage = 1 then
					if  nCounter < 3 then
'						window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
						shpModStrings8.Objects(sTempObj).value = sNVal2 & nIdx & ":"   	'e.g. S0001
					elseif nCounter < 14 then
'						window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal & nIdx2 & "<<"
						shpModStrings8.Objects(sTempObj).value = sNVal & nIdx & ":"		'e.g. S0017
					else
'						window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal3 & nIdx2 & "<<"
						shpModStrings8.Objects(sTempObj).value = sNVal3 & nIdx & ":"	'e.g. S0113
					end if				
				elseif sPage < 7 then 'pages 2-6 are all strictly triple-digit , i.e. S0nnn
'					window.external.parent.logmessage "(sPage < 7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
					shpModStrings8.Objects(sTempObj).value = sNVal & nIdx & ":"
				elseif sPage = 7 then
					if nCounter < 14 then
'						window.external.parent.logmessage "(sPage =7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
						shpModStrings8.Objects(sTempObj).value = sNVal & nIdx & ":"  	'e.g. 897,...
					else
'						window.external.parent.logmessage "(sPage =7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
						shpModStrings8.Objects(sTempObj).value = sNVal2 & nIdx & ":"	'i.e. 1001, 1009, 1017
					end if
				else 'pages 8 and up are all over 1024, i.e. 4-digits 
'					window.external.parent.logmessage "(sPage > 7) setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
					shpModStrings8.Objects(sTempObj).value = sNVal & nIdx & ":"			'all 4-digit array indices
				end if

				nIdx2 = nIdx2 + 8 'always 1..128 index for e.g. "line110'
				nIdx = nIdx + 8 'actual index

			case 16 'four lines per row
				do while nCounter2 < 4 and nIdx + nCounter2 <= nParamCount 'show the lines and the values
					sTempObj2 = "line" & nIdx2 + nCounter2
					shpModStrings16.Objects(sTempObj2).style.visibility = "Inherit"
					nCounter2 = nCounter2 + 1
				loop		

				if sPage = 1 then
					if  nCounter < 4 then
'						window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
						shpModStrings16.Objects(sTempObj).value = sNVal2 & nIdx & ":"   	'e.g. S0001
					else
'						window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal & nIdx2 & "<<"
						shpModStrings16.Objects(sTempObj).value = sNVal & nIdx & ":"		'e.g. S0017
					end if				
				elseif sPage = 2 then
					if nCounter < 10 then
						shpModStrings16.Objects(sTempObj).value = sNVal & nIdx & ":"		'e.g. S0077
					else 
						shpModStrings16.Objects(sTempObj).value = sNVal3 & nIdx & ":"		'e.g. S0101
					end if
				else
					shpModStrings16.Objects(sTempObj).value = sNVal3 & nIdx & ":"			'all 3-digit array indices
				end if

				nIdx2 = nIdx2 + 4 'always 1..64
				nIdx = nIdx + 4 'actual param array index

			case 32 'two lines per row
				do while nCounter2 < 2 and nIdx + nCounter2 <= nParamCount 'show the lines and the values
					sTempObj2 = "line" & nIdx2 + nCounter2
					shpModStrings32.Objects(sTempObj2).style.visibility = "Inherit"
					nCounter2 = nCounter2 + 1
				loop		

				if sPage = 1 then
					if  nCounter < 6 then
'						window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
						shpModStrings32.Objects(sTempObj).value = sNVal2 & nIdx & ":"   	'e.g. S0001
					else
'						window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal & nIdx2 & "<<"
						shpModStrings32.Objects(sTempObj).value = sNVal & nIdx & ":"		'e.g. S0017
					end if				
				elseif sPage < 4 then
					shpModSTrings32.Objects(sTempObj).value = sNVal & nIdx & ":"			'e.g. S065 (all 2-digit)
				elseif sPage = 4 then
					if nCounter < 3 then
						shpModStrings16.Objects(sTempObj).value = sNVal & nIdx & ":"		'e.g. S0077
					else 
						shpModStrings16.Objects(sTempObj).value = sNVal3 & nIdx & ":"		'e.g. S0101
					end if
				else
					shpModStrings16.Objects(sTempObj).value = sNVal3 & nIdx & ":"			'all 3-digit array indices
				end if

				nIdx2 = nIdx2 + 2	'always 1..32 for e.g. 'line20'
				nIdx = nIdx + 2		'actual parameter array index

			case 64 'one line per row

				sTempObj2 = "line" & nCounter
				shpModStrings64.Objects(sTempObj2).style.visibility = "Inherit"


'window.external.Parent.logmessage sTempObj2 & ", with nIdx2= >>" & nIdx2 & ", sPage = " & sPage


				if sPage = 1 then
					if  nCounter < 10 then
'						window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal2 & nIdx2 & "<<"
						shpModStrings64.Objects(sTempObj).value = sNVal2 & nIdx & ":"   	'e.g. S0001
					else
'						window.external.parent.logmessage "setting value to label: >>" & sTempObj & "<< as: >>" & sNVal & nIdx2 & "<<"
						shpModStrings64.Objects(sTempObj).value = sNVal & nIdx & ":"		'e.g. S0017
					end if				
				elseif sPage < 7 then
					shpModStrings64.Objects(sTempObj).value = sNVal & nIdx & ":"			'e.g. S065 (all 2-digit)
				else
					if nCounter < 4 then
						shpModStrings64.Objects(sTempObj).value = sNVal & nIdx & ":"		'e.g. S0077
					else 
						shpModStrings64.Objects(sTempObj).value = sNVal3 & nIdx & ":"		'e.g. S0101
					end if
				end if

				nIdx2 = nIdx2 + 1
				nIdx = nIdx + 1
		end select
		
		'bail out if we're past the number of parameters on this page
'		if nIdx2 > nParamsThisPage then
'			nCounter = 17 'enough to exit loop now
'		end if
	loop

	if nCounter < 16 then 'we need to hide unused textbox labels

		do while nCounter < 16
			nCounter = nCounter + 1
			sTempObj = "textbox" & nCounter
			select case g_STRLEN
				case 8
					shpModStrings8.Objects(sTempObj).value = ""
				case 16
					shpModStrings16.Objects(sTempObj).value = ""
				case 32
					shpModStrings32.Objects(sTempObj).value = ""
				case 64
					shpModStrings64.Objects(sTempObj).value = ""
			end select
		loop

	end if

	nCounter = 0

	'"Show" the newly-driven values
'	if nParamCount < 129 and nParamCount <> -1 then 
'		nLimit = nParamCount  'less than point page
'	else
'		nLimit = 128
'	end if

	do until nCounter >= nParamsThisPage 'nLimit
		nCounter = nCounter + 1
		select case g_STRLEN
			case 8
				sSTRObject = "alp_STR8_" & nCounter
'				window.external.parent.logmessage "showing object >>" & sSTRObject & "<<"
				shpModStrings8.Objects(sSTRObject).style.visibility = "Visible"    'had been hidden while not yet with valid data
			case 16
				sSTRObject = "alp_STR16_" & nCounter
'				window.external.parent.logmessage "showing object >>" & sSTRObject & "<<"
				shpModStrings16.Objects(sSTRObject).style.visibility = "Visible"    'had been hidden while not yet with valid data
			case 32
				sSTRObject = "alp_STR32_" & nCounter
'				window.external.parent.logmessage "showing object >>" & sSTRObject & "<<"
				shpModStrings32.Objects(sSTRObject).style.visibility = "Visible"    'had been hidden while not yet with valid data
			case 64
				sSTRObject = "alp_STR64_" & nCounter
'				window.external.parent.logmessage "showing object >>" & sSTRObject & "<<"
				shpModStrings64.Objects(sSTRObject).style.visibility = "Visible"    'had been hidden while not yet with valid data

		end select
	loop

	if g_STRLEN = 8 and sPage = 32 then 'hide very last parameter of very last page
	
		shpModStrings8.Objects("alp_STR8_128").style.visibility = "Hidden"
		shpModStrings8.Objects("line128").style.visibility = "Hidden"
'	else
'		shpModStrings8.Objects("line128").style.visibility = "Inherit"
	end if

	bPageInitialized = TRUE

end Function


sub UpdatePageCount()
' Populate the "Pages" combobox;  count is number of parameters, there is one page per 100 parameters

	dim nPages
	dim nPagesInt
	dim nIndex
	dim nMod
	dim nCounter
	dim sSTRObject
	dim nParamsThisPage
'	dim nFromVal
'	dim nToVal


	if bPagesCounted then exit sub
	bPagesCounted = TRUE
	
	combo_pages.ResetContent
	combo_pages.AddString "PAGE 1" 'always have page 1
	combo_pages.innerText = "PAGE 1"

	select case g_STRLEN

		case 8
			nParamsThisPage = 128
		case 16
			nParamsThisPage = 64
		case 32
			nParamsThisPage = 32
		case 64
			nParamsThisPage = 16

	end select



	'if less than one full page, then hide the invalid parameters
	if not sdTabInfo.QualityGood("CurrentPoint.NSTRING") or sdTabInfo.IsNaN("CurrentPoint.NSTRING") then
		nParamCount = nParamsThisPage/8 'fixed
	else
		nParamCount = sdTabInfo.DataValue("CurrentPoint.NSTRING") 'used if < 129
	end if

	if nParamCount < (nParamsThisPage + 1) then 
		'we need to HIDE the 1st page bad parameter
		nCounter = nParamCount
		do until nCounter >= nParamsThisPage
			nCounter = nCounter + 1
			select case g_STRLEN
				case 8
  					sSTRObject = "alp_STR8_" & nCounter
'					window.external.parent.logmessage "showing object >>" & sSTRObject & "<<"
					shpModStrings8.Objects(sSTRObject).style.visibility = "Hidden"    'had been hidden while not yet with valid data
				case 16
  					sSTRObject = "alp_STR16_" & nCounter
'					window.external.parent.logmessage "showing object >>" & sSTRObject & "<<"
					shpModStrings16.Objects(sSTRObject).style.visibility = "Hidden"    'had been hidden while not yet with valid data
				case 32
  					sSTRObject = "alp_STR32_" & nCounter
'					window.external.parent.logmessage "showing object >>" & sSTRObject & "<<"
					shpModStrings32.Objects(sSTRObject).style.visibility = "Hidden"    'had been hidden while not yet with valid data
				case 64
  					sSTRObject = "alp_STR64_" & nCounter
'					window.external.parent.logmessage "showing object >>" & sSTRObject & "<<"
					shpModStrings64.Objects(sSTRObject).style.visibility = "Hidden"    'had been hidden while not yet with valid data

			end select
		loop			
		exit sub ' just one page
	end if

	nPages = (nParamCount / nParamsThisPage)
	nPagesInt = INT(nPages)

	if nPagesInt < nPages then
		nPages = nPagesInt + 1
	end if

	nIndex = 2 'adding begins with PAGE 2
'	window.external.parent.logmessage "update page count: " & nPages
	
	'while programs support upto 16k sized arrays, LCN only supports transmission of 4095 parameters.
	'so, limit number of 128ea pages to 32
	if nPages > 32 then nPages = 32

	do until nIndex > nPages
		combo_pages.AddString "PAGE " & nIndex
		nIndex = nIndex + 1
	loop

end sub</SCRIPT>

        // <param name="objExtParent">The element to insert the new div as a child of.</param>

        // <returns>

        // true if the div was created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateExtensionDiv(extId, extClass, extXStyle, extXPos, extYStyle, extYPos, extWidth, extHeight, extDisplay, objExtParent)

        {

          try

          {

            var objExt = window.document.getElementById(extId);

            if (objExt == null)

            {

              objExt = window.document.createElement("div");

              objExt.id = extId;

              objExt.className = extClass;

              objExt.style.position = "absolute";

              objExt.style.overflow = "hidden";

              objExt.style.setExpression(extXStyle, extXPos, "JavaScript");

              objExt.style.setExpression(extYStyle, extYPos, "JavaScript");

              objExt.style.setExpression("width", extWidth, "JavaScript");

              objExt.style.setExpression("height", extHeight, "JavaScript");

              if (typeof(extDisplay) == "string" && extDisplay.length > 0)

              {

                objExt.style.setExpression("display", extDisplay, "JavaScript");

              }

              

              // Insert the new extension div into the proper location in a seperate thread, so that

              // the time it takes doesn't delay the calculation of the size and location of the

              // other extensions. This also breaks out of the onreadystatechange handler thread before

              // mucking around with the DOM, which could potentially change the readyState again.

              window.setTimeout(function(){ objExtParent.appendChild(objExt); }, 5);

            }

            return true;

          }

          {

            alert("Exception creating background extension '" + extId + "': " + (typeof(e) == "string" ? e : e.description));

          }

          return false;

        }

        // CreateBackgroundExtensions

        //------------------------------------------------------------------------

        // <summary>

        // Create empty elements inside the background that match the colored

        // parts of the shape to give the impression that the Page stretches

        // all the way to the edges of the Background.

        // </summary>

        // <returns>

        // true if the extensions were created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateBackgroundExtensions()

        {

          try

          {

              var objPage = window.document.getElementById("Page");

              var objBackground = window.document.getElementById("Background");      

              if (objPage == null || objBackground == null)

              {

                return false;

              }

                                          

              // Extend the TitleBar on the right-hand edge

              CreateExtensionDiv("bgTitleBar", "TitleBar", 

                                  "right", "'0px'", "top", "'0px'", 

                                  "Background.clientWidth - Page.offsetWidth", 

                                  "TitleBarBackground.offsetHeight", 

                                  null, objBackground);

              

              // Extend the TabSet on the right-hand edge.

              CreateExtensionDiv("bgTabSet", "TabSet", 

                                  "right", "'0px'", "top", "TitleBarBackground.offsetHeight", 

                                  "Background.clientWidth - Page.offsetWidth", "TabSetBackground.offsetHeight", 

                                  "TabSetBackground.currentStyle.display", objBackground);

              

              // Extend the NavPane on the bottom edge.



              CreateExtensionDiv("bgNavPane", "NavPane NavPaneFP",

                                   "left", "'0px'", "bottom", "'0px'", 

                                   "NavPane.offsetWidth", "Background.clientHeight - Page.offsetHeight", 

                                   null, objBackground);



              return true;

          }

          catch(e)

          {

             alert("Exception creating background extensions: " + (typeof(e) == "string" ? e : e.description));

          }  

          return false;

        }
