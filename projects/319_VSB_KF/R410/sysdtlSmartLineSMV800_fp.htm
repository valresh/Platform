<SCRIPT type=text/vbscript defer>
correctWidth = 0
SKIP = -1

Sub ApplyLayout()
	Call AdjustWidth()
End Sub

Sub AdjustWidth()
	Call CalculateCorrectWidth()
        if (correctWidth <> SKIP) then
		groupPanel.style.pixelwidth = correctWidth
        end if
End Sub

Sub CalculateCorrectWidth()
	POPUP = 0
        displayType = window.external.Application.CurrentDisplayPageType
	CurrentPage = window.external.CurrentPage
	if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
		correctWidth = SKIP
                Exit Sub
        else
		if (page.style.zoom > 1) then
                	shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.
                else
                        shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                        correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.
                end if
	end if
End Sub
</SCRIPT>

<SCRIPT for=document type=text/javascript defer event=onreadystatechange>
	try
	{
		if (document.readyState == "complete")
		{
			ApplyLayout();
		}
	}
	catch(err){}
</SCRIPT>

<SCRIPT language=JScript for=shapeFaceplate_alphaAnalogChannel defer 
event=ondatachange>	SL_LogEvent(this, "ondatachange");

	try
	{
		if (shapeFaceplate_alphaItemNameEnable.value == 1)
		{
			this.value = this.DataValue("SLAnalogPoint.ItemName");
		}
		else
		{
			this.value = this.DataValue("SLAnalogPoint.Name");
		}

		SL_Device.pointID = this.value;
	}
	catch(error)
	{
		SL_LogErrorMessage("SL_Faceplate.alphaAnalogChannel_ondatachange", "Could not set the Analog Channel Name indicator.", error);
	}</SCRIPT>

<SCRIPT language=JScript for=shapeFaceplate_alphaDeviceID defer 
event=ondatachange>	SL_LogEvent(this, "ondatachange");

	try
    {
		if (SL_UpdateDeviceType(this, "SLAnalogPoint"))
	    {
			this.value = SL_Device.type.manufacturer + " " + SL_Device.type.model;
			shapeFaceplate_alphaDeviceDescription.value = SL_Device.type.description;
		}
	}
	catch (error)
	{
		SL_LogErrorMessage("SL_Faceplate.alphaDeviceID_ondatachange", "Could not update device info", error);
	}</SCRIPT>

<SCRIPT language=JScript for=shapeFaceplate_textboxHeaderDigitalVariables defer 
event=ondatachange>	SL_LogEvent(this, "ondatachange");

	try
	{
		var scanConfiguration = new SL_ScriptData("HSCANCFG");
		scanConfiguration.Fetch(this, "SLAnalogPoint");

		if (scanConfiguration.changed && scanConfiguration.valid)
		{
			var configuration = IOM_ScanConfigurations[scanConfiguration.value];

			SL_LogDebugLevelMessage(4, "textboxHeaderDigitalVariables_ondatachange", "value = " + scanConfiguration.value + ", Dynamic Variables = " + configuration.dynamicVariables + ", Rate = " + configuration.rate);

			if (configuration.dynamicVariables)
			{
				if (configuration.rate > 0)
				{
					this.styleClass = "SLFP_SectionHeader";
	
					shapeFaceplate_textboxScanrate.value = configuration.rate.toString() + " s";
					shapeFaceplate_textboxScanrate.textColor = this.textColor;
					shapeFaceplate_textboxScanrate.title = "The HART Dynamic Variables listed below are configured to update every " + configuration.rate.toString() + " seconds.";
					shapeFaceplate_textboxScanrate.style.visibility = "visible";
				}
				else
					shapeFaceplate_textboxScanrate.style.visibility = "hidden";
			}
			else
			{
				shapeFaceplate_textboxScanrate.value = "0 s";
				shapeFaceplate_textboxScanrate.textColor = "red";
				shapeFaceplate_textboxScanrate.title = "The I/O Module is not confgured to read the Dynamic Variables from this transmitter. The values below will not update.\n\nCheck the Scan HART Variables parameter with Control Builder.";

				shapeFaceplate_textboxScanrate.style.visibility = "visible";
			}
		}
	}
	catch(error)
	{
		SL_LogErrorMessage("SL_Faceplate.textboxHeaderDigitalVariables_ondatachange", "Could not set the Dynamic Variables scan rate.", error);
	}</SCRIPT>

<SCRIPT language=JScript for=shapeFaceplate_shapeAnalogPV_alphaVariableName 
defer event=ondatachange>	var variableType = this.parentElement.parentElement.GetCustomProperty("Value", "VariableType");

	if (variableType == 0)
	{
		var deviceCode = this.DataValue("SLAnalogPoint.HDEVTYPE7");
		var deviceType = SL_GetDeviceType(deviceCode);

		switch (deviceType)
		{
			case "Level":
			case "Multivariable":
				var deviceVariableCodeParameter = "SLAnalogPoint.HDYNDVC[1]";
				var deviceVariableCode = this.DataValue(deviceVariableCodeParameter);

				this.value = SL_GetDeviceVariableName(deviceCode, deviceVariableCode);
				break;

			case "Pressure":
			case "Temperature":
				//this.value = SL_GetDeviceVariableName(deviceCode, 0);
				break;
			
			default:
				this.value = "";
		}
	}</SCRIPT>

<SCRIPT language=JScript for=shapeFaceplate_alphaCMName defer event=onclick>	SL_LogEvent(this, "onclick");

	try
	{
		if ((this.value != undefined) && (this.value.length > 0))
		{
			LoadCMPointDetailDisplay(this.value);
		}
	}
	catch(error)
	{
		SL_LogErrorMessage("SL_Faceplate.alphaCMName_onclick", "Could not navigate to the CM Point Detail display.", error);
	}</SCRIPT>

<SCRIPT language=JScript for=shapeFaceplate_alphaCMName defer event=onchange>	SL_LogEvent(this, "onchange");

	try
	{
		SL_LogDebugLevelMessage(3, "alphaCMName_onchange", "CM Name = " + this.value);

		if (this.value.length > 0)
		{
			shapeFaceplate_textboxLabelCM.StyleClass = "SLFP_Label";
			shapeFaceplate_textboxLabelCM.style.visibility = "visible";

			this.styleClass = "SLFP_Link_Right";
			this.style.visibilty = "visible";
		}
		else
		{
			SL_LogDebugLevelMessage(3, "alphaCMName_onchange", "Empty CM Name = " + this.value);
		}
	}
	catch(error)
	{
		SL_LogErrorMessage("SL_Faceplate.alphaCMName_onchange", "Could not set the visibility of the Control Module user controls.", error);
	}</SCRIPT>
