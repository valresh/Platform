<div>
    <!-- The hscShape binding provides selection and context menu functionality.
         The extStatus binding is the 'StatusBinding' Knockout binding implemented by this shape. -->
    <img style="width: 1.2em; height: 1.2em; vertical-align: middle;"
         data-bind="extLeakDetectionCalcControl: { status: status, tooltipDescription: tooltipdescription }">
    </img>
    
    <img id="startSLD" class="hsc.style.button" style="width: 1.2em; height: 1.2em; vertical-align: middle; display: none;"
         alt="I18N('Start Static Leak Detection')" src="shapes\leakdetectioncalccontrol\start.png"
         data-bind="extLeakDetectionCalcControl: { status: status, tooltipDescription: tooltipdescription, pointName: pointname }">
    </img>
    <img id="abortSLD" class="hsc.style.button" style="width: 1.2em; height: 1.2em; vertical-align: middle; display: none;"
         alt="I18N('Abort Static Leak Detection')" src="shapes\leakdetectioncalccontrol\abort.png"
         data-bind="extLeakDetectionCalcControl: { status: status, tooltipDescription: tooltipdescription, pointName: pointname }">
    </img>
</div>
