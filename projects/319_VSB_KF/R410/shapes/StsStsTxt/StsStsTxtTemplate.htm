<div align="left" class="truncate">
    <!-- The hscShape binding provides selection and context menu functionality.
         The extStatus binding is the 'StatusBinding' Knockout binding implemented by this shape. -->
    <img style="width: 1.2em; height: 1em; vertical-align: middle;"
         data-bind="extStatus: { value: linka.source.value, pntprmflag: linka.format.isPointParam}">
    </img>
	<img style="width: 1.2em; height: 1em; vertical-align: middle;"
         data-bind="extStatus: { value: linkb.source.value, pntprmflag: linkb.format.isPointParam}">
    </img>
	<span style="vertical-align: middle;"
         data-bind="text: aggregate.source.text() || aggregate.source.value()">
    </span>
</div>
