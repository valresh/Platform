<div style="white-space: nowrap;">
    <!-- The hscShape binding provides selection and context menu functionality.
         The extStatus binding is the 'StatusBinding' Knockout binding implemented by this shape. -->
    <img style="width: 1.2em; height: 1em; vertical-align: middle;"
         data-bind="extCalcStatus: {value1:status, value2:description}">
    </img>
	    <span style="vertical-align: middle;"
         data-bind="text: status.source.text">
    </span>
</div>
