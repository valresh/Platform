<div align="left" class="truncate">
    <!-- The hscShape binding provides selection and context menu functionality.
         The extBinding binding is the 'Binding' Knockout binding implemented by this shape. -->
	<img style="width: 1.2em; height: 1em; vertical-align: middle;"
         data-bind="extBinding: { value: source.value, imagelist: format.imagelist}, hscShape: {data: $data}">
    </img>
	<span style="vertical-align: middle;"
         data-bind="text: source.text">
    </span>
</div>
