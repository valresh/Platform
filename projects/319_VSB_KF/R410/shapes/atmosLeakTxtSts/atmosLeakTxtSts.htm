<div align="right" class="truncate" style="white-space:nowrap;overflow:hidden;">
  <!-- The hscShape binding provides selection and context menu functionality.
       The extStatus binding is the 'StatusBinding' Knockout binding implemented by this shape. -->
  <div style="display:inline-block;padding-right:2px;width:calc(100% - 23px);" data-bind="template: {name: 'hscAlphanumericViewTemplate', data: text}"></div>
  <img style="width: 1.2em; height: 1.2em; vertical-align: middle;"
       data-bind="extAtmosOverviewStatus: {value: link.source.value}">
  </img>
</div>
