<SCRIPT id=A576FE90-8CB1-4331-95FC-EE1418C7CC44 language=JScript defer 
shaperefcount="7">var em_type_SYS						= 8;
var em_stype_SYS_SERVER				= 1002;
var em_stype_SYS_CONTROLLERS		= 1003;
var em_stype_SYS_CONSOLES			= 1015;
var em_stype_SYS_INTERFACES			= 1008;
var em_stype_SYS_STATIONS			= 1010;
var em_stype_SYS_PRINTERS			= 1006;
var em_stype_SYS_NBCCS				= 1039;

function DetermineLargeGraphicIconFile(pointType, pointSubType, itemNumber)
{
	var imageFileName = "Unknown.png";
	
	if (pointType == em_type_SYS)
	{
		switch (pointSubType){
		case em_stype_SYS_SERVER:
			return "server_large.png";
		case em_stype_SYS_CONTROLLERS:
			return "controllers_large.png";
		case em_stype_SYS_CONSOLES:
			return "consoles_large.png";
		case em_stype_SYS_INTERFACES:
			return "interfaces_large.png";
		case em_stype_SYS_STATIONS:
			return "stations_large.png";
		case em_stype_SYS_PRINTERS:
			return "printers_large.png";
		case em_stype_SYS_NBCCS:
			return "nbccs_large.png";
		default:
			break;
		}
	}
	return imageFileName;
}

function  PushupFullItemName(strTagName, strFullItemName)
{
	try {
		ConstructDashboardFilterString(strTagName, strFullItemName);
	}
	catch (err)
	{
		window.external.logMessage("PushupFullItemName("+strTagName + "," + strFullItemName +") failed, " + err.message);

	}
}</SCRIPT>

<SCRIPT language=JScript defer>var strLocalServerTagName = "";
var strDashboardFilterString = "";

function ConstructDashboardFilterString(strTagname, strFullItemName)
{
	// puts local server full item path at the front, append other fullitemnames to the back
	if (strTagname == strLocalServerTagName)
	{
		strDashboardFilterString = String(strFullItemName);
		var entFilter = window.parent.document.getElementById("divEntityFilter");
		if (entFilter)
			entFilter.dashboardFilterString = strDashboardFilterString;

	}
}

// redefine the function ClearCurrSelection for this display only
setTimeout(function(){
ClearCurrSelection = function (updateFilter) {
    if(divCurrSelection.shapeGroup)
	{
		divCurrSelection.shapeGroup.selected = 'false'; 
		divCurrSelection.shapeGroup = null;
	}

	if (updateFilter)
	{
		divCurrSelection.selection = strDashboardFilterString;
	}
};
}, 0);

// insert css file
var cssFile;
switch (window.external.application.ColorTheme) {
case 2: // light
	cssFile = "EPKS_SystemDashboard_Light.css";
	break;
case 1: // dark
	cssFile = "EPKS_SystemDashboard_Dark.css";
	break;
case 0: // classic
	cssFile = "EPKS_SystemDashboard_Classic.css";
	break;
}

var link = document.createElement("link");
link.type = "text/css";
link.rel = "stylesheet";
link.href = ".\\Styles\\" + cssFile;
document.getElementById("documentHead").appendChild(link);</SCRIPT>
