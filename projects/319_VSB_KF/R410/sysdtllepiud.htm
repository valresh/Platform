<SCRIPT language=VBScript defer>Dim iBoxNum,iBoxNum1

public sub selection(BoxNum)
		iBoxNum=BoxNum
		Document.getElementById("Slot" & iBoxNum).textColor=50282496
		Document.getElementById("CardType" & iBoxNum).textColor=50282496
		Document.getElementById("line" & iBoxNum).style.visibility="vISIBLE"
		Document.getElementById("line" & iBoxNum).lineColor=50282496
end sub

public sub Deselection(BoxNum1)
		iBoxNum1=BoxNum1
		Document.getElementById("Slot" & iBoxNum1).textColor=VBBLACK
		Document.getElementById("CardType" & iBoxNum1).textColor=VBBLACK
		Document.getElementById("line" & iBoxNum1).style.visibility="hidden"
end sub

Sub SlotUpdate(oSource,SlotNo)
			Document.getElementById("CardType" & SlotNo).style.visibility="visible"
		If oSource.value = txtNONE.value then 
			Document.getElementById("CardType" & SlotNo).style.visibility="Hidden"
		end if
end sub


Sub InvokeSubSlot(CardType,Slot)
if CardType.VALUE <> empty and CardType.VALUE <> "NaN" and CardType.VALUE <> txtNONE.value then
	SlotBox.value=Ucase(Slot)
	Subslotpage.click
else 
	window.external.TemporaryMessageZoneText Message.value
end if

end Sub</SCRIPT>
