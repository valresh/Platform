<SCRIPT language=VBScript for=Page defer event=onpagecomplete>	Dim gobjWShell
	
	On error resume next
	Set gobjWShell = window.external.Dictionary.Item("WScriptShellObject").Value'CreateObject("WScript.Shell")
	If gobjWShell is Nothing then 
		Window.external.TemporaryMessageZoneText = TxtopertuneAppNotFound.value
	Else 
		gstrInstallPath = gobjWShell.RegRead("HKEY_LOCAL_MACHINE\SOFTWARE\Honeywell\Opertune\InstallDir")
		If Err.number <> 0 then
			cmdOperTune.style.visibility = "hidden"
			imgOperTune.style.visibility = "hidden"
		End if
		Set gobjWShell= Nothing
	End if</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>if not sd.QualityBad("currentpoint.TagName") then
'Checks if the Cm gets loaded properly or Server points has not been deleted
	if sd.QualityBad("currentpoint.PULSECOUNTA.BLOCKTYPENAME") and sd.QualityBad("currentpoint.PULSELENGTHA.BLOCKTYPENAME") then
		'Checks if none of the block Pulse count or pulse lengthe exist 
		ShpTabs.Objects("tab8").style.visibility = "Hidden"
		TabPulseCount.style.visibility = "Hidden"
	else
		if not sd.QualityBad("currentpoint.PULSECOUNTA.BLOCKTYPENAME") then
			'If Pulse count block present change the label of tab to Pulse Count
			TabPulseCount.innerText = TxtPulseCount.value
		elseif not sd.QualityBad("currentpoint.PULSELENGTHA.BLOCKTYPENAME") then
			'If pulse length block presents change the Tab label to Pulse length
			TabPulseCount.innerText = TxtPulseLength.value
		else
		end if
		'After changing the Tab label make the tab and the tab shapes bitmap visible
		ShpTabs.Objects("tab8").style.visibility = "Visible"
		TabPulseCount.style.visibility = "Visible"

	end if
end if</SCRIPT>
