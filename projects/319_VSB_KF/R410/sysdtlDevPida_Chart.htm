<SCRIPT language=VBScript for=sd defer event=ondatachange>if sd.DataChanged("currentpoint.SCMOPT") then
	If sd.DataValue("currentpoint.SCMOPT") = 3 Then
		'Scm Option is COMMON
		shaTabs.objects("tab8").style.visibility = "Visible"
		pbtnArbitration.style.visibility = "Visible"			
	else
		shaTabs.objects("tab8").style.visibility = "Hidden"
		pbtnArbitration.style.visibility = "Hidden"
	end If
end if</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onpagecomplete>On Error Resume Next
	shpChart.autoReloadContent = False

alpPIDTag.textColor = RGB(128, 128, 128)</SCRIPT>

<SCRIPT language=VBScript for=alpPIDTag defer event=onclick>lineCurrentChart.style.pixelLeft= me.style.pixelLeft
shpChart.autoReloadContent = false
shpChart.SetCustomProperty "Point", "Tagname" , me.value
me.textColor = RGB(0, 0, 0)
alpDevTag.textColor = RGB(128, 128, 128)
shpChart.ReloadContent()</SCRIPT>

<SCRIPT language=VBScript for=alpDevTag defer event=onclick>lineCurrentChart.style.pixelLeft= me.style.pixelLeft
shpChart.autoReloadContent = false

alpPIDTag.textColor = RGB(128, 128, 128)
shpChart.ReloadContent()</SCRIPT>
</HEAD>
<SCRIPT language=VBScript for=alpAssocPID defer event=onupdate>On Error Resume Next
if me.QualityGood("CurrentPoint.Devctla.AssocPID") then
	AssocPIDTag = split(me.DataValue("CurrentPoint.Devctla.AssocPID"), ".")
	if ucase(AssocPIDTag(0)) <> ucase(window.external.DetailPointID) then
		grpDevPIDTag.style.visibility = "Inherit"
		alpPIDTag.value = AssocPIDTag(0)
		alpDevTag.value = window.external.DetailPointID
	else
		grpDevPIDTag.style.visibility = "Hidden"
		alpPIDTag.value = ""
		alpDevTag.value = ""
	end if
else
		grpDevPIDTag.style.visibility = "Hidden"
		alpPIDTag.value = ""
		alpDevTag.value = ""
end if</SCRIPT>
