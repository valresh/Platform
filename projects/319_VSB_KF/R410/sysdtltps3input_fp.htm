<SCRIPT language=VBScript for=Page defer event=onexecutecommand>	dim strCommand
	strCommand = window.event.getAttribute("onExecuteCommand", 0)
	if not (strCommand="Raise" or strCommand="OKB RAISE" or strCommand="Lower" or strCommand="OKB LOWER") then
		exit sub
	end if

	if Page.hasFocus or sElementRaiseLower <> "" or UCase(window.document.activeElement.id) = "COMBO_MD" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then

'raise/lower keys require operator confirmation - supported for MODE, MODATTR
		if strCommand="Raise" or strCommand="OKB RAISE" then

			window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise " 
			if sElementRaiseLower = "MODE" or UCase(window.document.activeElement.id) = "COMBO_MD" then	
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODE"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MD.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseMODE(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				GrpMD.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm()
			elseif sElementRaiseLower = "MODATTR" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then				
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODATTR"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MDATTR.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseMODATTR(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				GrpMDAttr.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm()
			end if
		elseif strCommand="Lower" or strCommand="OKB LOWER" then

			if sElementRaiseLower = "MODE" or UCase(window.document.activeElement.id) = "COMBO_MD" then
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODE"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MD.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextLowerMODE(sCurrentShownRaiseLowerValue)
				GrpMD.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm()
			elseif sElementRaiseLower = "MODATTR" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then				
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODATTR"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MDATTR.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextLowerMODATTR(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Lower-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				GrpMDAttr.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm()
			end if
		end if
	end if</SCRIPT>

sub ApplyLayout()
'	This routine enables the 'smart sizing' of faceplates
'	Comment the very last line to disable stretching of the center panel

	on error resume next
'*******************************************************************************************************************
' this code section enables faceplates to stretch taller, 
' if the provided (SafeView) window has a height/width aspect ratio of 2.5 or greater
    
	dim oSview
    dim nFpRatio, nSVWindowRatio, nNewRatio

    set oSview=getobject("","Honeywell.Workspace.Client")
    If oSview.IsManagerActive = true then
        nFpRatio= (Page.style.pixelHeight / Page.style.pixelWidth)
        nSVWindowRatio= round((Page.parentElement.clientHeight / Page.parentElement.clientWidth),1)     'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        nNewRatio = round(nSVWindowRatio / nFpRatio,1)                                                                                                                                                                                                                      'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        if window.external.AppWindow.width <= 500 and nSVWindowRatio >= 2.5 then                                                                                                                                            '500px is max facplate width supported
            Page.style.pixelHeight = clng((Page.style.pixelHeight * nNewRatio))
        end if
    end if
' 
'*******************************************************************************************************************
	GrpLowerPanel.style.top = ""
	GrpLowerPanel.style.bottom = "2px"
	PicBackground.style.pixelWidth  = Page.style.pixelWidth
	PicBackground.style.pixelHeight = Page.style.pixelHeight

	GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2
	GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	GrpCenterPanel.style.pixelHeight = Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10

	if GrpCenterPanel.style.pixelheight > 253 then
		shaOUTIND.style.pixeltop = shaOUTIND.style.pixeltop + 3
		shaOUTIND.style.pixelheight = ConIndPV.style.pixelheight + 17
		grpEU.style.pixeltop = 45
	end if

end sub

Sub A3INPUTUpdateVisibility

    Dim sSPTooltip
	Dim sOPTooltip
    Dim bTab
	sOPTooltip = ""
    sSPTooltip = ""
    bTab = False
    
    If Not sd.QualityConfigError("CurrentPoint.SP") Then
        GrpSP.Style.visibility = "Visible"
        ConIndSP.Style.visibility = "Visible"
         If sd.QualityGood("CurrentPoint.SP") Then 
            If sd.IsNan("CurrentPoint.SP") Then
                If bToolTips = True Then
'                    edit_SP.Title = "SP= NaN"
                    sSPTooltip = "SP= " & Chr(9) & "NaN"
					edit_SP.title = sSPTooltip
                End If
            Else
                If bToolTips = True Then
'                    edit_SP.Title = "SP= " & FormatNumber(sd.DataValue("CurrentPoint.SP"), formatSP) & " EU"
                    sSPTooltip = "SP= " & Chr(9) & Chr(9) & FormatNumber(sd.DataValue("CurrentPoint.SP"), formatSP) & " EU"
 					edit_SP.title = sSPTooltip
               End If
            End If
			if bToolTips then
				if sd.QualityGood("CurrentPoint.SPHILM") and not sd.IsNan("CurrentPoint.SPHILM") then
					sSPTooltip = sSPTooltip & Chr(10) & "SPHILM=    " & Chr(9) & FormatNumber(sd.DataValue("CurrentPoint.SPHILM"), formatSP) & " EU"
				end if
				if sd.QualityGood("CurrentPoint.SPLOLM") and not sd.IsNan("CurrentPoint.SPLOLM") then
					sSPTooltip = sSPTooltip & Chr(10) & "SPLOLM= " & Chr(9) & FormatNumber(sd.DataValue("CurrentPoint.SPLOLM"), formatSP) & " EU"
				end if
				ConIndSP.Title = sSPTooltip
				edit_SP.title = sSPTooltip
			end if
        Else
            edit_SP.Title = ""
            ConIndSP.Title = ""
        End If
        'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - SP shown:" & sd.DataValue("CurrentPoint.SP")
    Else
        GrpSP.Style.visibility = "Hidden"
        ConIndSP.Style.visibility = "Hidden"
	'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - SP Hidden (QualityConfigError)"
    End If

    If Not sd.QualityConfigError("CurrentPoint.PV") Then
        GrpPV.Style.visibility = "Visible"
        ConIndPV.Style.visibility = "Visible"
        GrpScaleMarkers.Style.visibility = "Visible"
        'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - PV shown:" & sd.DataValue("CurrentPoint.PV")
        
        If sd.QualityGood("CurrentPoint.PV") Then
            If sd.IsNan("CurrentPoint.PV") Then
                'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - 'RedX' shown"
                shpGrayX.Style.visibility = "Visible"
                If bToolTips = True Then
                    edit_PV.Title = "PV= NaN"
                    ConIndPV.Title = "PV= NaN"
                End If
                ConIndPV.Value = 0
'msgbox "ConIndPV.value set to: " & ConIndPV.value
            Else
                ConIndPV.Value = sd.DataValue("CurrentPoint.PV")
                shpGrayX.Style.visibility = "Hidden"
                If bToolTips = True Then
                    If sd.QualityGood("CurrentPoint.PVRAW") And Not sd.IsNan("CurrentPoint.PVRAW") Then
                        edit_PV.Title = "PV=           " & FormatNumber(sd.DataValue("CurrentPoint.PV"), formatPV) & " EU" & Chr(10) & "PVRAW=   " & FormatNumber(sd.DataValue("CurrentPoint.PVRAW"), formatPV) & "%"
                        ConIndPV.Title = "PV=           " & FormatNumber(sd.DataValue("CurrentPoint.PV"), formatPV) & " EU" & Chr(10) & "PVRAW=   " & FormatNumber(sd.DataValue("CurrentPoint.PVRAW"), formatPV) & "%"
                    Else
                        edit_PV.Title = "PV= " & FormatNumber(sd.DataValue("CurrentPoint.PV"), formatPV) & " EU"
                        ConIndPV.Title = "PV= " & FormatNumber(sd.DataValue("CurrentPoint.PV"), formatPV) & " EU"
                    End If
                End If
            End If
        Else
            edit_PV.Title = ""
            ConIndPV.Title = ""
        End If
    Else
        GrpPV.Style.visibility = "Hidden"
        ConIndPV.Style.visibility = "Hidden"
        GrpScaleMarkers.Style.visibility = "Hidden"
        shpGrayX.Style.visibility = "Hidden"
        'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - PV Hidden (QualityConfigError)"
    End If

    If Not sd.QualityConfigError("CurrentPoint.OP") Then
        
        If (sd.QualityGood("CurrentPoint.OPHITP") And Not sd.IsNan("CurrentPoint.OPHITP")) Or (sd.QualityGood("CurrentPoint.OPLOTP") And Not sd.IsNan("CurrentPoint.OPLOTP")) Or (sd.QualityGood("CurrentPoint.OPHILM") And Not sd.IsNan("CurrentPoint.OPHILM")) Or (sd.QualityGood("CurrentPoint.OPLOLM") And Not sd.IsNan("CurrentPoint.OPLOLM")) Then
            bTab = True
        End If
          
        GrpOP.Style.visibility = "Visible"
        ConIndOP.Style.visibility = "Visible"
        If sd.QualityGood("CurrentPoint.OP") And Not sd.IsNan("CurrentPoint.OP") Then
            If sd.IsNan("CurrentPoint.OP") Then
               If bToolTips = True Then
                    If bTab = True Then
                        sOPTooltip = "OP= " & Chr(9) & Chr(9) & "NaN"
                    Else
                        sOPTooltip = "OP= NaN"
                    End If
'                    edit_OP.Title = "OP= NaN"
					edit_OP.Title = sOPTooltip
                End If
             Else
                If bToolTips = True Then
                    If bTab = True Then
                        sOPTooltip = "OP= " & Chr(9) & Chr(9) & FormatNumber(sd.DataValue("CurrentPoint.OP"), 1) & " %"
                    Else
                        sOPTooltip = "OP= " & FormatNumber(sd.DataValue("CurrentPoint.OP"), 1) & " %"
                    End If
'                    edit_OP.Title = "OP= " & FormatNumber(sd.DataValue("CurrentPoint.OP"), 1) & " %"
					edit_OP.title = sOPTooltip
                End If
            End If
        Else
           edit_OP.Title = ""
        End If
       
        If bToolTips Then
            If sd.QualityGood("CurrentPoint.OPHITP") And Not sd.IsNan("CurrentPoint.OPHITP") Then
                If sOPTooltip <> "" Then sOPTooltip = sOPTooltip & Chr(10)
                sOPTooltip = sOPTooltip & "OPHITP=" & Chr(9) & FormatNumber(sd.DataValue("CurrentPoint.OPHITP"), 1) & " %"
            End If
            If sd.QualityGood("CurrentPoint.OPLOTP") And Not sd.IsNan("CurrentPoint.OPLOTP") Then
                If sOPTooltip <> "" Then sOPTooltip = sOPTooltip & Chr(10)
                sOPTooltip = sOPTooltip & "OPLOTP=" & Chr(9) & FormatNumber(sd.DataValue("CurrentPoint.OPLOTP"), 1) & " %"
            End If
 
 			if sd.QualityGood("CurrentPoint.OPHILM") and not sd.IsNan("CurrentPoint.OPHILM") then
				sOPTooltip = sOPTooltip & Chr(10) & "OPHILM=" & Chr(9) & FormatNumber(sd.DataValue("CurrentPoint.OPHILM"), 1) & " %"
			end if
			if sd.QualityGood("CurrentPoint.OPLOLM") and not sd.IsNan("CurrentPoint.OPLOLM") then
				sOPTooltip = sOPTooltip & Chr(10) & "OPLOLM=" & Chr(9) & FormatNumber(sd.DataValue("CurrentPoint.OPLOLM"), 1) & " %"
			end if

            ConIndOP.Title = sOPTooltip
			edit_OP.title = sOPTooltip
            'window.external.parentdocument.parentwindow.external.logmessage  "3INPUT OP tooltip = " & sOPTooltip
        End If
       
       
       'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - OP shown:" & sd.DataValue("CurrentPoint.OP")
    Else
        GrpOP.Style.visibility = "Hidden"
        ConIndOP.Style.visibility = "Hidden"
	'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - OP Hidden (QualityConfigError)"
    End If

    If Not sd.QualityConfigError("CurrentPoint.MODATTR") Then
        GrpMDAttr.Style.visibility = "Visible"
        combo_MDATTR.innerText = sd.DataValue("CurrentPoint.MODATTR")
        'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - MODATTR shown:" & sd.DataValue("CurrentPoint.MODATTR")
    Else
        GrpMDAttr.Style.visibility = "Hidden"
	'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - MODATTR Hidden (QualityConfigError)"
    End If

    If Not sd.QualityConfigError("CurrentPoint.MODE") Then
        GrpMD.Style.visibility = "Visible"
	'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - MODE shown:" & sd.DataValue("CurrentPoint.MODE")
    Else
        GrpMD.Style.visibility = "Hidden"
	'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - MODE Hidden (QualityConfigError)"
    End If

    
    If sd.QualityGood("CurrentPoint.INITMAN") And sd.DataValue("CurrentPoint.INITMAN") <> 0 Then
        grp_Initman.Style.visibility = "Visible"
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - INITMAN shown"
    Else
        grp_Initman.Style.visibility = "Hidden"
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - INITMAN Hidden"
    End If
    

    If sd.DataValue("CurrentPoint.CASREQ") = "REQUEST" Then
        textCasreq.Style.visibility = "Visible"
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - CASREQ shown"
    Else
        textCasreq.Style.visibility = "Hidden"
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateVisibility - CASREQ Hidden"
    End If

End Sub

Sub A3INPUTUpdateRanges

    If sd.QualityGood("CurrentPoint.SPDSPHI") And Not sd.IsNan("CurrentPoint.SPDSPHI") Then
        ConIndSP.RangeHi = sd.DataValue("CurrentPoint.SPDSPHI")
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP.rangeHi=(SPDSPHI)=" & sd.DataValue("CurrentPoint.SPDSPHI")
    ElseIf sd.QualityGood("CurrentPoint.SPEUHI") And Not sd.IsNan("CurrentPoint.SPEUHI") Then
        ConIndSP.RangeHi = sd.DataValue("CurrentPoint.SPEUHI")
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP.rangeHi=(SPEUHI)=" & sd.DataValue("CurrentPoint.SPEUHI")
    ElseIf sd.QualityGood("CurrentPoint.PVDSPHI") And Not sd.IsNan("CurrentPoint.PVDSPHI") Then
        ConIndSP.RangeHi = sd.DataValue("CurrentPoint.PVDSPHI")
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP.rangeHi=(PVDSPHI)=" & sd.DataValue("CurrentPoint.PVDSPHI")
    ElseIf sd.QualityGood("CurrentPoint.PVEUHI") And Not sd.IsNan("CurrentPoint.PVEUHI") Then
        ConIndSP.RangeHi = sd.DataValue("CurrentPoint.PVEUHI")
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP.rangeHi=(PVEUHI)=" & sd.DataValue("CurrentPoint.PVEUHI")
    Else
        ConIndSP.RangeHi = 100
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP.rangeHi fixed to 100"
    End If

'   SP LO Range (SPDSPLO else SPEULO else PVEULO else 0)
    If sd.QualityGood("CurrentPoint.SPDSPLO") And Not sd.IsNan("CurrentPoint.SPDSPLO") Then
        ConIndSP.RangeLo = sd.DataValue("CurrentPoint.SPDSPLO")
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP.rangeLo=(SPDSPLO)=" & sd.DataValue("CurrentPoint.SPDSPLO")
    ElseIf sd.QualityGood("CurrentPoint.SPEULO") And Not sd.IsNan("CurrentPoint.SPEULO") Then
        ConIndSP.RangeLo = sd.DataValue("CurrentPoint.SPEULO")
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP.rangeLo=(SPEULO)=" & sd.DataValue("CurrentPoint.SPEULO")
    ElseIf sd.QualityGood("CurrentPoint.PVDSPLO") And Not sd.IsNan("CurrentPoint.PVDSPLO") Then
        ConIndSP.RangeLo = sd.DataValue("CurrentPoint.PVDSPLO")
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP.rangeLo=(PVDSPLO)=" & sd.DataValue("CurrentPoint.PVDSPLO")
    ElseIf sd.QualityGood("CurrentPoint.PVEULO") And Not sd.IsNan("CurrentPoint.PVEULO") Then
        ConIndSP.RangeLo = sd.DataValue("CurrentPoint.PVEULO")
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP.rangeLo=(PVEULO)=" & sd.DataValue("CurrentPoint.PVEULO")
    Else
        ConIndSP.RangeLo = 0
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP.rangeLo shown as 0"
    End If

'   PV HI Range (PVDSPHI else PVEUHI else 100)
    If sd.QualityGood("CurrentPoint.PVDSPHI") And Not sd.IsNan("CurrentPoint.PVDSPHI") Then
        ConIndPV.RangeHi = sd.DataValue("CurrentPoint.PVDSPHI")
        ConAlpPVEUHi.Value = FormatNumber(ConIndPV.RangeHi, formatPV)
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndPV.rangeHi=(PVDSPHI)=" & sd.DataValue("CurrentPoint.PVDSPHI")
    ElseIf sd.QualityGood("CurrentPoint.PVEUHI") And Not sd.IsNan("CurrentPoint.PVEUHI") Then
        ConIndPV.RangeHi = sd.DataValue("CurrentPoint.PVEUHI")
        ConAlpPVEUHi.Value = FormatNumber(ConIndPV.RangeHi, formatPV)
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndPV.rangeHi=(PVEUHI)=" & sd.DataValue("CurrentPoint.PVEUHI")
    Else
        ConIndPV.RangeHi = 100
        ConAlpPVEUHi.Value = "100%"
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndPV.rangeHi fixed at 100"
    End If

'   PV LO Range (PVDSPLO else PVEULO else 0)
    If sd.QualityGood("CurrentPoint.PVDSPLO") And Not sd.IsNan("CurrentPoint.PVDSPLO") Then
        ConIndPV.RangeLo = sd.DataValue("CurrentPoint.PVDSPLO")
        ConAlpPVEULo.Value = FormatNumber(ConIndPV.RangeLo, formatPV)
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndPV.rangeLo=(PVDSPLO)=" & sd.DataValue("CurrentPoint.PVDSPLO")
    ElseIf sd.QualityGood("CurrentPoint.PVEULO") And Not sd.IsNan("CurrentPoint.PVEULO") Then
        ConIndPV.RangeLo = sd.DataValue("CurrentPoint.PVEULO")
        ConAlpPVEULo.Value = FormatNumber(ConIndPV.RangeLo, formatPV)
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndPV.rangeLo=(PVEULO)=" & sd.DataValue("CurrentPoint.PVEULO")
    Else
        ConIndPV.RangeLo = 0
        ConAlpPVEULo.Value = "0%"
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndPV.rangeLo fixed at 0"
    End If

' Special case: if rangeLo is > rangeHi, invert them can call them 0%-100%
    If ConIndPV.RangeHi < ConIndPV.RangeLo Then
        nTemp = ConIndPV.RangeHi
        ConIndPV.RangeHi = ConIndPV.RangeLo
        ConIndPV.RangeLo = nTemp
        ConAlpPVEULo.Value = "  0%"
        ConAlpPVEU1.Value = " 25%"
        ConAlpPVEU2.Value = " 50%"
        ConAlpPVEU3.Value = " 75%"
        ConAlpPVEUHi.Value = "100%"
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndPV ranges inverted"
    ElseIf True = bServerBitsFlagTicMarkValues And ConAlpPVEUHi.Value = "100%" Then
        ConAlpPVEULo.Value = "  0%"
        ConAlpPVEU1.Value = " 25%"
        ConAlpPVEU2.Value = " 50%"
        ConAlpPVEU3.Value = " 75%"
    ElseIf True = bServerBitsFlagTicMarkValues Then   ' If not ranges inverted and Serverwide setting for intermiate tickmark values, calculate them
        ConAlpPVEU2.Value = ConIndPV.RangeLo + (ConIndPV.RangeHi - ConIndPV.RangeLo) / 2
        ConAlpPVEU2.Value = FormatNumber(ConAlpPVEU2.Value, formatPV)
        ConAlpPVEU3.Value = ConAlpPVEU2.Value + (ConIndPV.RangeHi - ConAlpPVEU2.Value) / 2
        ConAlpPVEU3.Value = FormatNumber(ConAlpPVEU3.Value, formatPV)
        ConAlpPVEU1.Value = ConIndPV.RangeLo + (ConAlpPVEU2.Value - ConIndPV.RangeLo) / 2
        ConAlpPVEU1.Value = FormatNumber(ConAlpPVEU1.Value, formatPV)
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges: intermediate tick marks: " & ConAlpPVEU3.Value & ", " & ConAlpPVEU2.Value & ", " & ConAlpPVEU1.Value
    End If

' Update OUTIND-parameter based OP valve direction indicators
    If Not sd.QualityConfigError("CurrentPoint.OUTIND") Then
        If sd.DataValue("CurrentPoint.OUTIND") = "DIRECT" Then
            shaOUTIND.Value = 2
        ElseIf sd.DataValue("CurrentPoint.OUTIND") = "REVERSE" Then
            shaOUTIND.Value = 3
        Else
            shaOUTIND.Value = 1
        End If
    End If

' Same for SP, but only flip the range values
    If ConIndSP.RangeHi < ConIndSP.RangeLo Then
        nTemp = ConIndSP.RangeHi
        ConIndSP.RangeHi = ConIndSP.RangeLo
        ConIndSP.RangeLo = nTemp
		'window.external.parentdocument.parentwindow.external.logmessage  "3INPUTUpdateRanges - ConIndSP ranges inverted"
    End If

    ConIndOP.RangeHi = 100
    ConIndOP.RangeLo = 0

''    ConIndSP.FillColor = ConIndSP.FillColor 'force view update
''    ConIndPV.FillColor = ConIndPV.FillColor 'force view update

End Sub

Sub CommonModeComboEx(SecurityLevel)
    
    If SecurityLevel < 2 Then
        combo_MD.hostpopulation = True
        Exit Sub
    End If
    
    Dim sVal
    sVal = combo_MD.innerText
    If sd.QualityGood("CurrentPoint.mode") Then
        combo_MD.hostpopulation = False
        combo_MD.ResetContent
        If sd.QualityGood("CurrentPoint.modeappl(1)") And sd.DataValue("CurrentPoint.modeappl(1)") <> 0 Then
            combo_MD.AddString "MAN"
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonModeCombo - Adding MAN"
        End If
        If sd.QualityGood("CurrentPoint.modeappl(2)") And sd.DataValue("CurrentPoint.modeappl(2)") <> 0 Then
            combo_MD.AddString "AUTO"
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonModeCombo - Adding AUTO"
        End If
        If sd.QualityGood("CurrentPoint.modeappl(3)") And sd.DataValue("CurrentPoint.modeappl(3)") <> 0 Then
            combo_MD.AddString "CAS"
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonModeCombo - Adding CAS"
        End If
        If sd.QualityGood("CurrentPoint.modeappl(4)") And sd.DataValue("CurrentPoint.modeappl(4)") <> 0 Then
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonModeCombo - Adding BCAS"
            combo_MD.AddString "BCAS"
        End If
        
        combo_MD.innerText = sVal
    End If
    
End Sub

Sub CommonModAttrComboEx(SecurityLevel)
    
    If SecurityLevel < 2 Then
        combo_MDAttr.hostpopulation = True
        Exit Sub
    End If
    
    Dim sVal
    sVal = combo_MDAttr.innerText
    
    If sd.QualityGood("CurrentPoint.modAttr") Then
        combo_MDAttr.hostpopulation = False
        combo_MDAttr.ResetContent
        If sd.QualityGood("CurrentPoint.$modesel(5)") Then
            If sd.DataValue("CurrentPoint.$modesel(5)") <> "0" Then
                'window.external.parentdocument.parentwindow.external.logmessage  "CommonModAttrCombo - Adding PROGRAM (we always add OPERATOR)"
                combo_MDAttr.AddString "PROGRAM"
            End If
        End If
        combo_MDAttr.AddString "OPERATOR"
        combo_MDAttr.innerText = sVal
    
    End If
    
End Sub

End Sub</SCRIPT>

Sub CommonIntermediateTicMarkValues

'on error resume next 'to allow time for ConAlpEUTickMarksServerBits.value to be set

	'window.external.parentdocument.parentwindow.external.logmessage "CommonIntermediateTicMarkValues, ConAlpPVEULo visibility= " & ConAlpPVEULo.Style.visibility
    If  ("0" = ConAlpEUTickMarksServerBits.Value) or UCase(ConAlpPVEULo.Style.visibility) = "HIDDEN" then
       'window.external.parentdocument.parentwindow.external.logmessage  "Intermediate tickmark values OFF"
        ConAlpPVEU1.Style.visibility = "Hidden"
        ConAlpPVEU2.Style.visibility = "Hidden"
        ConAlpPVEU3.Style.visibility = "Hidden"
        ConAlpEUDesc.Style.pixelWidth = 80
		ConAlpEUDesc.Style.pixelHeight = 20 'was 15
        bServerBitsFlagTicMarkValues = False
    Else
       'window.external.parentdocument.parentwindow.external.logmessage  "Intermediate tickmark values ON"
        ConAlpPVEU1.Style.visibility = "Inherit"
        ConAlpPVEU2.Style.visibility = "Inherit"
        ConAlpPVEU3.Style.visibility = "Inherit"
        ConAlpEUDesc.Style.pixelWidth = 45 'uses two lines if necessary, wrapping even if ugly
		ConAlpEUDesc.Style.pixelHeight = 44 'was 30
' 		if the tick mark value is just too big to fit, then blank it out
'        If Len(ConAlpPVEU2.Value) > 5 Then 'compensate for big/small numbers
'			if Len(ConAlpEUDesc.Value) > 2 then 'but only if not a tiny EUDESC
		If (Len(ConAlpPVEU2.Value) + Len(ConAlpEUDesc.Value)) > 10 then
	        	ConAlpEUDesc.Style.pixelWidth = 80 'full length again
	        	ConAlpPVEU2.Style.visibility = "Hidden" ' just hide the middle tick value altogether			
				ConAlpEUDesc.Style.pixelHeight = 20 '15
'			end if
		end if
        bServerBitsFlagTicMarkValues = True
    End If
End Sub

sub SetPVFormat
    
    'window.external.parentdocument.parentwindow.external.logmessage  "PV Format= " & sd.DataValue("CurrentPoint.PVFORMAT")
    If sd.QualityGood("CurrentPoint.PVFORMAT") Then
    
        Select Case sd.DataValue("CurrentPoint.PVFORMAT")
        Case "D0"
            formatPV = 0
        Case "D1"
            formatPV = 1
        Case "D2"
            formatPV = 2
        Case "D3"
            formatPV = 3
        Case "D4"
            formatPV = 4
        Case "D5"
            formatPV = 5
        Case "D6"
            formatPV = 6
        Case Else
            formatPV = -1  ' use default - i.e. computer's regional setting
        End Select
    End If   'defaulted to -1
    
End Sub

Sub SetSPFormat

    'window.external.parentdocument.parentwindow.external.logmessage  "SP Format= " & sd.DataValue("CurrentPoint.SPFORMAT")
    If sd.QualityGood("CurrentPoint.SPFORMAT") Then
    
        Select Case sd.DataValue("CurrentPoint.SPFORMAT")
        Case "D0"
            formatSP = 0
        Case "D1"
            formatSP = 1
        Case "D2"
            formatSP = 2
        Case "D3"
            formatSP = 3
        Case "D4"
            formatSP = 4
        Case "D5"
            formatSP = 5
        Case "D6"
            formatSP = 6
        Case Else
            formatSP = -1  ' use default - i.e. computer's regional setting
        End Select
    Else
        formatSP = formatPV 'drop back to formatPV in case PVFORMAT is OK
    End If
        
End Sub

Sub PVFormatUpdate

    Call SetPVFormat
    If Not formatPV = -1 Then
        edit_PV.numericdisplayformat = "%." & formatPV & "f"
    End If

End Sub

Sub SPFormatUpdate

    Call SetSPFormat
    If Not formatSP = -1 Then
        edit_SP.numericdisplayformat = "%." & formatSP & "f"
    End If

End Sub

	if sd.QualityGood("CurrentPoint.EUDESC") then

'window.external.parentdocument.parentwindow.external.logmessage  "AnalogUpdateValues indicators SP:" & sd.DataValue("CurrentPoint.SP") & " PV:" & sd.DataValue("CurrentPoint.PV") & " OP:" & sd.DataValue("CurrentPoint.OP")

End Sub

'set alarm zone
Sub CommonAlarm

    Dim state_PNTSTATE
    ' point state indicator
    If sd.QualityGood("CurrentPoint.PNTSTATE") And UCase(sd.DataValue("CurrentPoint.PNTSTATE")) <> "OK" Then
        state_PNTSTATE = Left(sd.DataValue("CurrentPoint.PNTSTATE"), 1)
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - PNTSTATE=" & state_PNTSTATE
    Else
        state_PNTSTATE = ""
    End If
    
    '   Replace HIGHAL with ALENBST if inhibited
    If UCase(sd.DataValue("CurrentPoint.ALENBST")) <> "INHIBIT" Then
        If UCase(sd.DataValue("CurrentPoint.HIGHAL")) = "NOALARM" Or Not sd.QualityGood("CurrentPoint.HIGHAL") Then
            If state_PNTSTATE <> "" Then
                state_alarmState.Value = state_PNTSTATE
                If bToolTips = True Then
                    state_alarmState.Title = "PNTSTATE= " & sd.DataValue("CurrentPoint.PNTSTATE")
                End If
                state_alarmState.Style.visibility = "Visible"
            Else
                state_alarmState.Style.visibility = "Hidden"
            End If  ' state_PNTSTATE
           'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - NOALARM (or not config)"
        Else
           'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - in alarm: " & sd.DataValue("CurrentPoint.HIGHAL")
            state_alarmState.Style.visibility = "Visible"
            state_alarmState.Value = sd.DataValue("CurrentPoint.HIGHAL")
            If state_PNTSTATE <> "" Then
                state_alarmState.Value = state_alarmState.Value & " " & state_PNTSTATE
                If bToolTips = True Then
                    state_alarmState.Title = "HIGHAL= " & sd.DataValue("CurrentPoint.HIGHAL") & ", PNTSTATE= " & sd.DataValue("CurrentPoint.PNTSTATE")
                End If
            Else
                If bToolTips = True Then
                    state_alarmState.Title = "HIGHAL= " & sd.DataValue("CurrentPoint.HIGHAL")
                End If
            End If  ' state_PNTSTATE
        End If  ' state_HIGHAL
    Else
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - INHIBIT"
        state_alarmState.Style.visibility = "Visible"
        state_alarmState.Value = sd.DataValue("CurrentPoint.ALENBST")
        If state_PNTSTATE <> "" Then
            If bToolTips = True Then
                state_alarmState.Title = "ALENBST= INHIBIT, PNTSTATE=" & sd.DataValue("CurrentPoint.PNTSTATE")
            End If
            state_alarmState.Value = state_alarmState.Value & " " & state_PNTSTATE
        Else
            If bToolTips = True Then
                state_alarmState.Title = "ALENBST= INHIBIT"
            End If
       End If  'state_PNTSTATE
    End If  ' state_ALENBST


'   Show "DISABLED" in case below
    If UCase(sd.DataValue("CurrentPoint.ALENBST")) = "DISABLE" Then
        textAlarmDisabled.Style.visibility = "Visible"
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - DISABLED"
    Else
        textAlarmDisabled.Style.visibility = "Hidden"
    End If
End Sub


'ALPSTATUS will be displayed if the status is not "ACTIVE"
Sub CommonPointState

'   Update "point state" in the description zone
'   Called when either PTEXECST or REDTAG params change
    If sd.QualityGood("CurrentPoint.PTEXECST") Then
        If UCase(sd.DataValue("CurrentPoint.PTEXECST")) = "INACTIVE" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonPointState - INACTIVE"
            state_pointState.Value = "INACTIVE"
            state_pointState.Style.visibility = "Visible"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.STSMSG") Then
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonPointState, STSMSG=" & sd.DataValue("CurrentPoint.STSMSG")
        If UCase(sd.DataValue("CurrentPoint.STSMSG")) <> "NONE" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonPointState - Showing STSMSG!"
            state_pointState.Style.visibility = "Visible"
            state_pointState.Value = sd.DataValue("CurrentPoint.STSMSG")
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonPointState - Set state_pointState to (STSMSG), state_PointState now:" & state_pointState.Value
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.PTORST") Then
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonPointState, STSMSG=" & sd.DataValue("CurrentPoint.STSMSG")
        If UCase(sd.DataValue("CurrentPoint.PTORST")) = "SEL" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonPointState - Showing STSMSG!"
            state_pointState.Style.visibility = "Visible"
            state_pointState.Value = "OR in SEL"
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonPointState - Set state_pointState to (STSMSG), state_PointState now:" & state_pointState.Value
            Exit Sub
		ElseIf UCase(sd.DataValue("CurrentPoint.PTORST")) = "NOTSEL" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonPointState - Showing STSMSG!"
            state_pointState.Style.visibility = "Visible"
            state_pointState.Value = "OR not SEL"
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonPointState - Set state_pointState to (STSMSG), state_PointState now:" & state_pointState.Value
            Exit Sub
        End If
    End If
    state_pointState.Style.visibility = "Hidden"

End Sub


Sub CommonModeOffNormalCheck
    'window.external.parentdocument.parentwindow.external.logmessage  "CommonModeOffNormalCheck"
    If GrpMD.Style.visibility <> "Hidden" Then
        If sd.QualityGood("CurrentPoint.MODE") And sd.QualityGood("CurrentPoint.NMODE") Then
            If UCase(sd.DataValue("CurrentPoint.NMODE")) <> "NONE" Then
                If sd.DataValue("CurrentPoint.MODE") = sd.DataValue("CurrentPoint.NMODE") Then
                    textMDLabel.Style.visibility = "Inherit"
                    textMDLabelOffNormal.Style.visibility = "Hidden"
                Else
                    'window.external.parentdocument.parentwindow.external.logmessage  "MODE is off-normal"
                    textMDLabel.Style.visibility = "Hidden"
                    textMDLabelOffNormal.Style.visibility = "Inherit"
                End If
            Else
              textMDLabel.Style.visibility = "Inherit"
              textMDLabelOffNormal.Style.visibility = "Hidden"
            End If
        End If
    End If
End Sub

Sub CommonModattrOffNormalCheck
    'window.external.parentdocument.parentwindow.external.logmessage  "CommonModattrOffNormalCheck"
    If GrpMDAttr.Style.visibility <> "Hidden" Then
        If sd.QualityGood("CurrentPoint.MODATTR") And sd.QualityGood("CurrentPoint.NMODATTR") Then
            If UCase(sd.DataValue("CurrentPoint.NMODATTR")) <> "NONE" Then
                If sd.DataValue("CurrentPoint.MODATTR") = sd.DataValue("CurrentPoint.NMODATTR") Then
                    grpModAttr.Style.visibility = "Inherit"
                    grpModAttrOffNormal.Style.visibility = "Hidden"
                Else
                    'window.external.parentdocument.parentwindow.external.logmessage  "...MODATTR off-normal"

                    grpModAttrOffNormal.Style.visibility = "Inherit"
                End If
            Else
                   grpModAttr.Style.visibility = "Inherit"
                   grpModAttrOffNormal.Style.visibility = "Hidden"
            End If
        End If
    End If
End Sub

Sub CommonRedTag
    If sd.QualityGood("CurrentPoint.REDTAG") Then
        If UCase(sd.DataValue("CurrentPoint.REDTAG")) = "ON" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "CommonRedTag - REDTAG=ON"
            redtagIndicator.Style.visibility = "Visible"
        Else
            redtagIndicator.Style.visibility = "Hidden"
        End If
    End If
End Sub

Sub AnalogPVStatus
'
'   See Faceplate ocx for comment-matrix as to behavior here

    Dim bExOK

    If sd.QualityGood("CurrentPoint.PVEXHIFL") And Not sd.IsNan("CurrentPoint.PVEXHIFL") And sd.QualityGood("CurrentPoint.PVEXLOFL") And Not sd.IsNan("CurrentPoint.PVEXLOFL") Then
        bExOK = True
    Else
        bExOK = False
    End If

'   PV may be "not configured" in which case we hide the PV Status shape

        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "SUB" Then

        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "BAD" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'U'(2)"

	on error resume next 'because not all faceplates have grp_Initman

			'augment tooltip only
			grp_InitMan.title = "Initialization manual state; Output path status error"
			grp_InitSI.title = "Init Manual; output path status error; Safety interlock (SHUTDOWN) is ON, OP is SAFEOP"
		else 'possibly recovered path status
			grp_InitMan.title = "Initialization manual state"
			grp_InitSI.title = "Init Manual; Safety interlock (SHUTDOWN) is ON, OP is SAFEOP"
		end if
	else

			if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "OUTERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then

				ConShpOPsts.Value = 9 'L' with tool tip also about $PATHSTS issue
			else
	        	ConShpOPsts.Value = 6  'L' 
			end if
		else
			if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "OUTERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
				window.external.parentdocument.parentwindow.external.logmessage "OP has path issue ($PATHSTS)"

				ConShpOPsts.Value = 1 'invisible

       	ConShpWindupOPsts.Value = 7  
	elseif UCase(sd.DataValue("CurrentPoint.ARWOP")) = "HI" then
        ConShpWindupOPsts.Value = 5
	elseif UCase(sd.DataValue("CurrentPoint.ARWOP")) = "LO" then
        ConShpWindupOPsts.Value = 6
	else 
        ConShpWindupOPsts.Value = 1 ' invisible
	end if
End Sub

Sub CommonModeComboEx(SecurityLevel)
    
    If SecurityLevel < 2 Then
        combo_MD.hostpopulation = True
        Exit Sub
    End If
    
    Dim sVal
    sVal = combo_MD.innerText
    If sd.QualityGood("CurrentPoint.mode") Then
        combo_MD.hostpopulation = False
        combo_MD.ResetContent
        If sd.QualityGood("CurrentPoint.modeappl(1)") And sd.DataValue("CurrentPoint.modeappl(1)") <> 0 Then
            combo_MD.AddString "MAN"
            'dbtrace 27, "CommonModeCombo - Adding MAN"
        End If
        If sd.QualityGood("CurrentPoint.modeappl(2)") And sd.DataValue("CurrentPoint.modeappl(2)") <> 0 Then
            combo_MD.AddString "AUTO"
            'dbtrace 27, "CommonModeCombo - Adding AUTO"
        End If
        If sd.QualityGood("CurrentPoint.modeappl(3)") And sd.DataValue("CurrentPoint.modeappl(3)") <> 0 Then
            combo_MD.AddString "CAS"
            'dbtrace 27, "CommonModeCombo - Adding CAS"
        End If
        If sd.QualityGood("CurrentPoint.modeappl(4)") And sd.DataValue("CurrentPoint.modeappl(4)") <> 0 Then
            'dbtrace 27, "CommonModeCombo - Adding BCAS"
            combo_MD.AddString "BCAS"
        End If
   		If sd.QualityGood("CurrentPoint.NMODE") and sd.DataValue("CurrentPoint.NMODE") <> "NONE" Then
            'dbtrace 27, "CommonModeCombo - Adding NMODE"
			combo_MD.AddString "NORMAL"
		End If
             
        combo_MD.innerText = sVal
    End If
    
End Sub

Sub CommonModAttrComboEx(SecurityLevel)
    
    If SecurityLevel < 2 Then
        combo_MDAttr.hostpopulation = True
        Exit Sub
    End If
    
    Dim sVal
    sVal = combo_MDAttr.innerText
    
    If sd.QualityGood("CurrentPoint.modAttr") Then
        combo_MDAttr.hostpopulation = False
        combo_MDAttr.ResetContent
        If sd.QualityGood("CurrentPoint.$modesel(5)") Then
            If sd.DataValue("CurrentPoint.$modesel(5)") <> "0" Then
                'dbtrace 27, "CommonModAttrCombo - Adding PROGRAM (we always add OPERATOR)"
                combo_MDAttr.AddString "PROGRAM"
            End If
        End If
        combo_MDAttr.AddString "OPERATOR"
        combo_MDAttr.innerText = sVal
    
    End If
    
End Sub

Function RaiseLowerConfirm()

	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID) 'clear old/other timers
  	intRaiseLowerTimerID = window.setInterval ("CheckRaiseLowerResponse()", 500)

End Function

sub CancelRaiseLowerConfirmation

	'generic routine to clean up and bail out of confirmation of raise/lower OP/MODE/MODATTR
	window.external.parentdocument.parentwindow.external.CancelResponse
	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID)
	sCurrentShownRaiseLowerValue = ""
	sElementRaiseLower = ""
	sConfirmRaiseLowerMsg = ""
end sub

Function OnDeactivateCancelRamp2

	window.clearInterval(intCancelRampOnPageDeactivateID)
	call CancelRaiseLowerConfirmation

end function


sub CheckRaiseLowerResponse

	dim sResponse
	dim iStatus
	dim ptPromptType 
	dim sMsgZoneText
	ptPromptType = 1

	nConfirmCount = nConfirmCount + 1

	sMsgZoneText = window.external.parentdocument.parentwindow.external.MessageZoneText 

'	sConfirmRaiseLowerMsg = "<" & nConfirmCount & "> " & "Change state of TPS:" & text_NAME.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	sConfirmRaiseLowerMsg = "Change state of TPS:" & alphaTagName.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	iStatus = window.external.parentdocument.parentwindow.external.GetResponse3 (sConfirmRaiseLowerMsg, ptPromptType, sResponse)

	'window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: status returned= " & iStatus

	if iStatus = 0 and nConfirmCount > 1 then

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: - action cancelled by user" 
		call CancelRaiseLowerConfirmation
		exit sub
	elseif iStatus = 1 then
		if sResponse = "" then
			'no response yet... let timer fire again shortly
		else
			'recieved response, process it and we're DONE
			if UCase(sResponse) = "Y" then

				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: setting: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				if UCase(sElementRaiseLower) = "MODE" then
					combo_MD.hostpopulation = true
'					page.AutoSelectOnNextModeChange = true
					Call SetAutoSelect
					combo_MD.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODE"), 1
					end if
					combo_MD.focus
				elseif UCase(sElementRaiseLower) = "MODATTR" then
					combo_MDATTR.hostpopulation = true
					combo_MDATTR.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODATTR"), 1
					end if
					combo_MDATTR.focus
				end if
			end if

			call CancelRaiseLowerConfirmation

		end if
	end if

	if nConfirmCount > 2 and (sMsgZoneText = "" or (sConfirmRaiseLowerMsg <> sMsgZoneText)) then		
		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: message text changed operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if

	'expire after Experion's "operator timeout" - e.g. 60 seconds (x2 as timer is .5 secs)
	if nConfirmCount > oper_timeout.value * 2 then 

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: nConfirmCount > Experion operator timeout: " & oper_timeout.value & "; operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if


end sub
