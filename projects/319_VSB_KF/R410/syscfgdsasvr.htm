<SCRIPT language=VBScript for=alpRecordOffsetViewer defer event=onupdate>	Call DisplayRecordOne (me.value)
	'Only display DSA connections
	If (window.external.CurrentRecordOffset > 491) Then
		window.external.CurrentRecordOffset = 491		
	End If</SCRIPT>
<SCRIPT language=VBScript defer>Sub DisplayRecordOne (TopRecNum)
	If (TopRecNum = 1) Then	
		grpRecordOne.style.visibility = "visible"		
		pbOnTitlle011.style.visibility = "hidden"
	Else
		grpRecordOne.style.visibility = "hidden"	
		pbOnTitlle011.style.visibility = "visible"			
	End If
End Sub</SCRIPT>
<SCRIPT language=VBScript for=alpServerTypeRaw defer event=onupdate>If (IsNumeric(alpServerTypeRaw.value)) Then
	' If not on an EBI type system then show the EMB details - otherwise rearrange the display to look nice	
	If ((alpServerTypeRaw.value = 5) or (alpServerTypeRaw.value = 6) or (alpServerTypeRaw.value = 7)) Then				
		grpEMB.style.visibility = "hidden"		
		txtThisServer.style.top = grpEMB.style.top	
	Else
		grpEMB.style.visibility = "visible"
		txtThisServer.style.top = 268
	End If
End If</SCRIPT>
<SCRIPT language=VBScript for=alpSystemName defer event=onupdate>If (StrComp(alpSystemName.value, txtUndefined.value) = 0) Then
	alpSystemName.style.visibility = "hidden"
Else
	alpSystemName.style.visibility = "visible"	
End If</SCRIPT>
<SCRIPT language=VBScript for=IsOptionLicenced defer event=onupdate>If IsOptionLicenced.value = 1 Then
	grpOptionNotLicenced.style.visibility = "hidden"
	PageTitle.style.visibility = "visible"
Else
	grpOptionNotLicenced.style.visibility = "visible"
	PageTitle.style.visibility = "hidden"
End If</SCRIPT>
