		'Update the parameters
		Call ChangeParameters

	CurrScrollBarPosition = CurrScrollBarPosition + 1
	'Update the parameters
	Call ChangeParameters
End If</SCRIPT>

<SCRIPT language=VBScript for=pbLastPage defer event=onmouseenter>If this.disabled <> True Then
	this.style.cursor = "hand"

		CurrScrollBarPosition = NumOfScrolls
		'Update the parameters
		Call ChangeParameters
End If</SCRIPT>

<SCRIPT language=VBScript for=PageNo defer event=onchange>On Error Resume Next
Dim iPageNo
If IsNumeric(this.value) Then
	iPageNo = CInt(this.value) - 1
	If iPageNo >=0 AND iPageNo <= NumOfScrolls Then
		CurrScrollBarPosition = iPageNo
		'Update the parameters
		Call ChangeParameters
	Else
		window.external.TemporaryMessageZoneText = Invalidpagenumber.value
		this.value = CInt (CurrScrollBarPosition + 1)
		this.CancelChange
	End If
Else
	window.external.TemporaryMessageZoneText = Invalidpagenumber.value
	this.value = CInt (CurrScrollBarPosition + 1)
	this.CancelChange
End If</SCRIPT>
