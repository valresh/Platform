<SCRIPT id=0D03BDD1-EAF6-4D7D-9870-2976FE87250F language=vbscript defer 
shaperefcount="26">Sub InstallCodebase()
	urlbase	 = location.protocol & "//" & location.host
	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
	install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
	redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub
</SCRIPT>

<SCRIPT language=VBScript defer>Sub ApplyLayout()

End Sub</SCRIPT>

<SCRIPT language=JScript for=CboMode defer event=ondatachange>if (this.DataChanged("CurrentPoint.HBA.BA"))
{
this.ResetContent();
this.AddString(txtMode0.value);
this.AddString(txtMode1.value);
if (this.QualityGood("CurrentPoint.HBA.BA"))
{
	if (this.DataValue("CurrentPoint.HBA.BA") == 1)
	{
		this.value = txtMode1.value;
		grpCommand.disabled = true;
		CboCmd.disabled = true;
	}
	else
	{
		this.value = txtMode0.value;
		grpCommand.disabled = false;
		CboCmd.disabled = false;
	}
}
}</SCRIPT>
