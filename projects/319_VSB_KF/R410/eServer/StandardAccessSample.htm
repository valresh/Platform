<SCRIPT language=VBScript event=onupdate for=current defer>' Simple script to simulate some values rising and falling, and pump statud changing in the sample part of this display
TankLevel.value = me.value / (max.value - min.value) * 100
if old.value > me.value then    
' tank is emptying, therefore indicate the pump is running
	if cint(pump.value) <> 2 then
		pump.value = "2"
	end if
else 
' Tank is filling, therefore indicate the pump is stopped
	if cint(pump.value) <> 1 then 
		pump.value = "1"
	end if
end if
' Write the current value into the old value for next time this scipt is executed.
old.value = me.value
' Now the script to enable the value to be chart.Legacy.d. This script is not needed
' when chart.Legacy.ng a point.value. It is only needed for the sample display.
'Create X and Y data arrays
dim XData1(0), YData1(0)
XData1(0) = Now
YData1(0) = me.value
if g_PlotAdded = true then
    chart.Legacy.AddPlotData g_plotID1, YData1, XData1
End If</SCRIPT>
