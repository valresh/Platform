<SCRIPT language=VBScript defer>'                             COPYRIGHT (c) 2017-2019

correctWidth = 0
SKIP = -1

'Dim isfpShutDownCommandIssued
'Dim stringShutdown
'Dim stringNone
Dim bStyleLight
Dim n10SecondCounter  'every 10th periodic update, do an icon refresh

'isShutDownCommandIssued = false
'stringShutdown = "SHUTDOWN"
'stringNone = "NONE"
bStyleLight = true   'track style light vs. dark
n10SecondCounter = 0

Sub ApplyLayout()           
                Call AdjustHeight()
                Call AdjustWidth()
End Sub

Sub AdjustHeight()
                
                GrpLowerPanel.style.top = "" 
                GrpLowerPanel.style.bottom = "2px"
                GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 
                GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
              	 
End Sub

Sub AdjustWidth()
                Call CalculateCorrectWidth()       
                if (correctWidth <> SKIP) then                   
                    GrpUpperPanel.style.pixelwidth = correctWidth 
                    GrpCenterPanel.style.pixelwidth = correctWidth
                    GrpLowerPanel.style.pixelwidth = correctWidth 
												
                end if
End Sub

Sub CalculateCorrectWidth()
                POPUP = 0
                displayType = window.external.Application.CurrentDisplayPageType 
				CurrentPage = window.external.CurrentPage

					if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
                	
                                correctWidth = SKIP
                                Exit Sub
               		else   

               		if (page.style.zoom > 1) then   
                 		shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))                               
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                                                                                                 
                    else                                        
                         shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                         correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                

                    end if

                end if    

End Sub

sub UpdateIcons

	sTemp = alpNodeStatusStr.value
	if sTemp = "" or sd.QualityBad("CurrentPoint.NODESTATESTR") then 
		txtNotLoaded.style.visibility = "Inherit"
		alpNodeStatusStr.style.visibility = "Hidden"
		shpNODESTATUS.value = 8		  ' shape # for yellow-dash 'marginal
	else
		if instr(sTemp, "NOSYN") <> 0 then
			shpNODESTATUS.value = 8       ' marginal for e.g. WARN-NOSYNC or BACKUP-NOSYNC
		elseif left(sTemp,2) = "OK" or left(sTemp, 6) = "BACKUP" then
			shpNODESTATUS.value = 3       ' OK
	    elseif left(sTemp,13) = "No LCN Cables" or left(sTemp,4) = "FAIL" then
			shpNODESTATUS.value = 4       ' shape sequence # for (error)
		elseif sd.QualityBad("CurrentPoint.NODESTATESTR") then 
			shpNODESTATUS.value = 2       ' shape sequence # for 'off'
		else
			shpNODESTATUS.value = 8		  ' shape # for yellow-dash 'marginal
		end if
		shpNODESTATUS.style.visibility = "Inherit"
		txtNotLoaded.style.visibility = "Hidden"
		alpNodeStatusStr.style.visibility = "Inherit"
	end if

    if alpRDN_state.value = "PRIMARY" then
		if bStyleLight = true then
			shpPrimarySecondaryStatusPri.value = 2
		else 
			shpPrimarySecondaryStatusPri.value = 3
		end if
		if alphaTagNameSec.value = "" then 
			shpPrimarySecondaryStatusSec.value = 1 'hidden
'		elseif alpSYNC_State.value = "SYNCMAINT" then            <<< when HUE provides new yellow/red shapes, revisit this
'			if bStyleLight then 
'				shpPrimarySecondaryStatusSec.value = 5
'			else
'				shpPrimarySecondaryStatusSec.value = 6  
'			end if
		else
			shpPrimarySecondaryStatusSec.value = 7   ' gray "S"-not active secondary is same for both light/dark
		end if
		alphaTagNameSec.style.visibility = "Inherit"
	elseif alpRDN_state.value = "SECONDARY" then
		if bStyleLight = true then
			shpPrimarySecondaryStatusPri.value = 5 'counterintuitive for now, see comment below
		else 
			shpPrimarySecondaryStatusPri.value = 6
		end if
		'TBD: when secondary has access name of primary point name as a parameter value, we will maintain 
		'presentation of both primary and secondary point names in upper section.   In the meantime, for 
		'secondary points, we only show the secondary name as 'the point name' in the faceplate, so hide in this csae
		'SECMODNAME' i.e. alphaTagNameSec
		alphaTagNameSec.style.visibility = "Hidden"
		shpPrimarySecondaryStatusSec.style.visibility = "Hidden"
	else 
		shpPrimarySecondaryStatusPri.value = 1 ' hidden
		alphaTagNameSec.style.visibility = "Hidden"
		shpPrimarySecondaryStatusSec.value = 1 ' hidden 
		
	end if

	' for NG (never redundant) show "R" and "A" vs. above redundant "P" and "S"
	' can be BOTH redundant and alternate, if so , "A" below "R", else, whichever is on main line
	if sd.DataValue("CurrentPoint.ELCNNODETYPE") = "NG" then
		'hide redundancy, as never applicable
		alpRDN_State.style.visibility = "Hidden"
		txtRDN_Role.style.visibility = "Hidden"

		if sd.QualityGood("CurrentPoint.RESPONSIBLENG") and sd.QualityGood("CurrentPoint.ALTERNATENG") then 
			if sd.DataValue("CurrentPoint.RESPONSIBLENG") = 1 then 
				shpPrimarySecondaryStatusPri.style.visibility = "Inherit"
				shpPrimarySecondaryStatusPri.title = "Responsible NG role"
				if bStyleLight = true then
					shpPrimarySecondaryStatusPri.value = 9
				else 
					shpPrimarySecondaryStatusPri.value = 10
				end if
				'if ALSO alternate, show that BELOW using 'secondary' shape
				if sd.DataValue("CurrentPoint.ALTERNATENG") = 1 then
					shpPrimarySecondaryStatusSec.style.visibility = "Inherit"
					shpPrimarySecondaryStatusSec.title = "Alternate NG role"
					if bStyleLight = true then
						shpPrimarySecondaryStatusSec.value = 11
					else 
						shpPrimarySecondaryStatusSec.value = 12
					end if

				else
					shpPrimarySecondaryStatusSec.style.visibility = "Hidden"
				end if
			elseif sd.DataValue("CurrentPoint.ALTERNATENG") = 1 then ' not responsible, so likely 'primary' shape for alternate
				shpPrimarySecondaryStatusPri.title = "Alternate NG role"
				shpPrimarySecondaryStatusPri.style.visibility = "Inherit"
				if bStyleLight = true then
					shpPrimarySecondaryStatusPri.value = 11
				else 
					shpPrimarySecondaryStatusPri.value = 12
				end if
			end if
		else
			shpPrimarySecondaryStatusPri.style.visibility = "Hidden"
			shpPrimarySecondaryStatusSec.style.visibility = "Hidden"
		end if

' CONFIGUREDCABLES_UNDEF 0
' CONFIGUREDCABLES_AONLY 1
' CONFIGUREDCABLES_BONLY 2
' CONFIGUREDCABLES_AB 3

' SELECTEDCABLES_AONLY 0
' SELECTEDCABLES_BONLY 1
' SELECTEDCABLES_AB 2

		' ETH1/ETH2 icons on faceplate
		if sd.QualityBad("CurrentPoint.ETH1CONNECTED") and sd.QualityBad("CurrentPoint.ETH1SILENT") then
			shpETH1Status.value = 2		  ' off
			txtA_ETH1.textColor = txtCPU_free.textColor  'never highlighted when bad
		elseif sd.DataValue("CurrentPoint.CONFIGUREDCABLES") = 2 then 'B only configured, so, dim A
			shpETH1Status.value = 2		  ' off
			txtA_ETH1.textColor = txtCPU_free.textColor  'never highlighted when bad
			shpETH1Status.title = "NG A cable not configured"
		else 
			if sd.DataValue("CurrentPoint.SELECTEDCABLES") = 1 then  'use B only
				shpETH1Status.value = 8		  ' yellow-dash
				txtA_ETH1.textColor = txtCPU_free.textColor  'never highlighted when bad
				shpETH1Status.title = "NG Use Pin B Only Selected"
			elseif sd.DataValue("CurrentPoint.ETH1CONNECTED") = 1 and sd.DataValue("CurrentPoint.ETH1SILENT") = 0 then
				shpETH1Status.value = 3   ' OK
				txtA_ETH1.textColor = vbWhite
				txtA_ETH1.title = "PIN A (ETH1) OK"
				shpETH1Status.title = "PIN A (ETH1) OK"
			elseif sd.DataValue("CurrentPoint.ETH1CONNECTED") = 0 then
				shpETH1Status.value = 4       
				txtA_ETH1.textColor = txtCPU_free.textColor
				txtA_ETH1.title= "ETH1 Link Down"
				shpETH1Status.title = "ETH1 Link Down"
			elseif sd.DataValue("CurrentPoint.ETH1SILENT") = 1 then
				shpETH1Status.value = 4       
				txtA_ETH1.textColor = txtCPU_free.textColor
				txtA_ETH1.title= "PIN A (ETH1) Silent"
				shpETH1Status.title = "PIN A (ETH1) Silent"		
			end if
		end if
		shpETH1Status.style.visibility = "Inherit"

		if sd.QualityBad("CurrentPoint.ETH2CONNECTED") and sd.QualityBad("CurrentPoint.ETH2SILENT") then
			shpETH2Status.value = 2		  ' off
			txtB_ETH2.textColor = txtCPU_free.textColor  'never highlighted when bad
		elseif sd.DataValue("CurrentPoint.CONFIGUREDCABLES") = 1 then 'A only configured, so, dim B
			shpETH2Status.value = 2		  ' off
			txtB_ETH2.textColor = txtCPU_free.textColor  'never highlighted when bad
			shpETH2Status.title = "NG B cable not configured"
		else
			if sd.DataValue("CurrentPoint.SELECTEDCABLES") = 0 then  'use A only
				shpETH2Status.value = 8		  ' yellow-dash
				txtB_ETH2.textColor = txtCPU_free.textColor  'never highlighted when bad
				shpETH2Status.title = "NG Use Pin A Only Selected"
			elseif sd.DataValue("CurrentPoint.ETH2CONNECTED") = 1 and sd.DataValue("CurrentPoint.ETH2SILENT") = 0 then
				shpETH2Status.value = 3   ' OK
				txtB_ETH2.textColor = vbWhite
				txtB_ETH2.title = "PIN B (ETH2) OK"
				shpETH2Status.title = "PIN B (ETH2) OK"
			elseif sd.DataValue("CurrentPoint.ETH2CONNECTED") = 0 then
				shpETH2Status.value = 4       
				txtB_ETH2.textColor = txtCPU_free.textColor
				txtB_ETH2.title= "ETH2 Link Down"
				shpETH2Status.title = "ETH2 Link Down"
			elseif sd.DataValue("CurrentPoint.ETH2SILENT") = 1 then
				shpETH2Status.value = 4       
				txtB_ETH2.textColor = txtCPU_free.textColor
				txtB_ETH2.title= "PIN B (ETH2) Silent"
				shpETH2Status.title = "PIN B (ETH2) Silent"		
			end if
		end if
		shpETH2Status.style.visibility = "Inherit"

	end if

	if sd.QualityBad("CurrentPoint.LANAFAILED") then
		shpLANAFAILED.value = 2		  ' off
		txtA.textColor = txtCPU_free.textColor  'never highlighted when bad
	else
		if sd.DataValue("CurrentPoint.LANAFAILED") = 0 then '0 == 'not failed', i.e. OK
			shpLANAFAILED.value = 3   ' OK
			txtA.textColor = vbWhite
			txtA.title = "FTE A OK"
			shpLANAFAILED.title = "FTE A OK"
		else
			shpLANAFAILED.value = 4         ' shape sequence # for 'failed'
			txtA.textColor = txtCPU_free.textColor
			txtA.title= "FTE A fail"
			shpLANAFAILED.title = "FTE A fail"
		end if
	end if
	shpLANAFAILED.style.visibility = "Inherit"

	if sd.QualityBad("CurrentPoint.LANBFAILED") then
		shpLANBFAILED.value = 2            ' Off
		txtB.textColor = txtCPU_free.textColor 'never highlighted when bad
	else
		if sd.DataValue("CurrentPoint.LANBFAILED") = 0 then 
			shpLANBFAILED.value = 3        ' OK
			txtB.textColor = vbWhite
			txtB.title = "FTE B OK"
			shpLANBFAILED.title = "FTE B OK"
		else
			shpLANBFAILED.value = 4       ' Fail         
			txtB.textColor = txtCPU_free.textColor
			txtB.title= "FTE B fail"
			shpLANBFAILED.title = "FTE B fail"
		end if
	end if
	shpLANBFAILED.style.visibility = "Inherit"

	if sd.QualityGood("CurrentPoint.UEADISPLAYLN1") then
		sTemp = sd.DataValue("CurrentPoint.UEADISPLAYLN1")
		'specific location of e.g. "ELCN_AM     LCN:34") is always 13th char
		if mid(sTemp, 13,3) = "LCN" or mid(sTemp, 13, 3) = "UCN" then   'don't update while not showing LCN/UCN at UEA box
			txtLCNNbr.value = mid(sTemp,13,4) & rtrim(right(sTemp,2)) 
		end if
	else
		txtLCNNbr.value = ""
	end if
end sub</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onpagecomplete>on error resume next
	document.title = cstr(alphaTagName.value)
	if alphatagname.textcolor = "#404040" then  
		bStyleLight = true  'used to explicitly switch between icons for light/dark backgrounds (until proper .pngs available)
	else
		bStyleLight = false
	end if

	shape001.value = 2
	shape002.value = 3

	call UpdateIcons

	txtELCNNode.value = "ELCN_" & sd.DataValue("CurrentPoint.ELCNNODETYPE")
	if sd.DataValue("CurrentPoint.ELCNNODETYPE") = "NG" then
		GrpNGPinStatus.style.visibility = "Inherit"
		txtNGPinStatus.style.visibility = "Inherit" 'because stupid style is 'visible' doesn't obey group
	else
		GrpNGPinStatus.style.visibility = "Hidden"
		txtNGPinStatus.style.visibility = "Hidden"
	end if

	' per HUE, brighten these via style 'StatusText' but that style not yet in sysFaceplate.css
	' until lighter color style available, just assign from existing brighter colored object
	txtLCNNbr.textColor = alpCPU_free.textColor
	txtFTEIndex.textColor = alpCPU_free.textColor
	txtIPAddress.textColor = alpCPU_free.textColor</SCRIPT>
