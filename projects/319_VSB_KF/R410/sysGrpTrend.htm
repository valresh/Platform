<SCRIPT language=VBScript for=hscgroupfaceplate1 defer event=onbeforeactivate>on error resume next
' if this faceplate is activated not through key press or mouse click, then it's not activated through 
' direct user interaction, hence we will ignore it and reset the focus back to the previous active faceplate 
dim bMouseDown
bMouseDown = page.IsMouseDown or (msdwn = 1)
if(kdwn<>1 and bMouseDown<>True and FPSelected<>1) then
	' If a facepalte is already selected reselect it otherwise select the page
	if FPSelected<>0 then
		document.getElementById("hscgroupfaceplate"&FPSelected).children.item(0).contentwindow.page.focus
	else
		page.focus
	end if
	window.event.returnValue = false
end if</SCRIPT>

<SCRIPT language=VBScript defer>dim FPPosition(8)
dim msdwn
dim kdwn
dim FPSelected
dim bPageComplete
dim NextFPSelected
msdwn =0
kdwn = 0
bPageComplete = false
FPSelected = 0
sub ActiveFP_update(value)
	on error resume next
	If value <> 0 then
		if FPSelected <> value then 
            'de-select previous faceplate to ensure no data bound active element
             document.getElementById("hscgroupfaceplate"&FPSelected).children.item(0).contentwindow.page.setActive
		end if
		' Set the Selected faceplate attributes to we can keep track of the selected faceplate
		FPSelected = value
		page.SetAttribute "active", value
		' Set the border to indicate the faceplate is selected
		set GFP = document.getElementById("hscgroupfaceplate"&value)
		if GFP.style.pixelwidth >= 0 then
			activefaceplate.style.pixelwidth 	= GFP.style.pixelwidth
		end if
		if GFP.style.pixelheight >= 0 then
			activefaceplate.style.pixelheight 	= GFP.style.pixelheight
		end if
		if GFP.style.pixeltop >= 0 then
			activefaceplate.style.pixeltop 		= GFP.style.pixeltop
		end if
		if GFP.style.pixelleft >= 0 then
			activefaceplate.style.pixelleft 	= GFP.style.pixelleft
		end if
		activefaceplate.style.visibility = "visible"
		' Call OnGroupFaceplateSelected on the Faceplate Page element
		document.getElementById("hscgroupfaceplate"&FPSelected).children.item(0).contentwindow.page.OnGroupFaceplateSelected
	else
		' Hide the border and reset the selected faceplate flag
		activefaceplate.style.visibility = "hidden"
		FPSelected = 0
	end if
end sub
sub OnMouseDown1

end sub

sub SelectNextFaceplate (key)
on error resume next
dim flag
dim FPCurrentSel
FPCurrentSel = FPSelected
	if key = 37 or key = 40 then
		FPSelected = FPSelected -1
		if FPSelected <= 0 then 
			FPSelected = 8
		end if
		 while FPPosition(FPSelected) = 0 and flag <16
		  	FPSelected = FPSelected - 1
			if FPSelected <= 0 then 
				FPSelected = 8
				flag = flag + 1
			end if
	     wend
		flag = 0
	elseif key = 38 or key = 39 then
		FPSelected = FPSelected +1
		if FPSelected >= 9 then 
			FPSelected = 1
		end if
		while FPPosition(FPSelected) = 0 and flag <16
		  	FPSelected = FPSelected + 1
			if FPSelected >= 9 then 
				FPSelected = 1
				flag = flag + 1
			end if
		wend
	 flag = 0
	end if
if key=37 or key=38 or key=39 or key=40 then 
	' Make sure the currently selected faceplate sets the page element as active before we select anohter faceplate
	if (FPCurrentSel <> 0 ) and (FPCurrentSel <> FPSelected) then
		document.getElementById("hscgroupfaceplate"&FPCurrentSel).children.item(0).contentwindow.page.setActive
	end if
	' Now select the new faceplate
	document.getElementById("hscgroupfaceplate"&FPSelected).children.item(0).contentwindow.page.focus
	call ActiveFP_update(FPSelected)
end if
end sub
sub OnKeyDown1
on error resume next
Dim ActiveElem
ActiveElem = hscgroupfaceplate1.children.item(0).contentwindow.document.activeElement.ID
If hscgroupfaceplate1.children.item(0).contentwindow.document.getelementbyID(ActiveElem).EditState <> 2 then
	key = hscgroupfaceplate1.children.item(0).contentwindow.event.keycode
	if key=37 or key=38 or key=39 or key=40 or key =9 then 
	    kdwn = 1
	end if
	SelectNextFaceplate (key)
End if
end sub
