<SCRIPT id=B5376A2B-115B-479E-AB0B-209B9C1CA00E language=VBScript defer 
shaperefcount="1">sub AlmTP_OnUpdate(oSource, oSource1, oRect)
dim iTop, iHeight, oShape, sToolTipTxt, sEUDesc ,Hilimit
on error resume next
if isnumeric(oSource.currentvalue)and oSource1.value>1 then 
 set oShape=oSource.parentnode.parentnode
 itop=oSource.parentnode.style.pixeltop
 iheight=oSource.parentnode.style.pixelheight
 iheight=oSource.parentnode.style.pixelheight
 pvRange = (oShape.objects("ConAlpPVEUHi").value-oShape.objects("ConAlpPVEULo").value)
 pvRangelo =   oShape.objects("ConAlpPVEULo").value
 iVal = oSource.value

 if oShape.objects("ConAlpHHAlmTP").value = "NaN" or oShape.objects("ConAlpHiAlmTP").value = "NaN"then
    HiFlag = 0
 elseif (oShape.objects("ConAlpHHAlmTP").value-oShape.objects("ConAlpHiAlmTP").value) = 0 then  
    HiFlag = 0
 else 
    HiFlag = 1
 end if

 if (oShape.objects("ConAlpLoAlmTP").value = "NaN" or oShape.objects("ConAlpLLAlmTP").value) = "NaN" then
    LoFlag = 0
 elseif (oShape.objects("ConAlpLoAlmTP").value-oShape.objects("ConAlpLLAlmTP").value) = 0 then  
    LoFlag = 0
 else 
    LoFlag = 1
 end if

 
 'If (oShape.objects("ConAlpHHAlmTP").value-oShape.objects("ConAlpHiAlmTP").value) = 0 then
 '    HiFlag = 0
 'else
 '    HiFlag = 1
 'end if
 
 'If (oShape.objects("ConAlpLoAlmTP").value-oShape.objects("ConAlpLLAlmTP").value) = 0 then
 '    LoFlag = 0
 'else
 '    LoFlag = 1
 'end if
Select Case Right(oRect.id, 1)

            Case "H"
                If pvRange * iHeight <> 0 Then
                    oRect.Style.pixelHeight = (iHeight ) - (iVal - pvRangeLo) / pvRange * iHeight
                Else
                    oRect.Style.pixelHeight = iHeight
                End If
                oRect.Style.pixelTop = iTop
                
                If Right(oRect.id, 2) = "HH" Then
                    If oRect.Style.pixelHeight < 1 Then oRect.Style.pixelHeight = 1
					
				 Else
					 
					If (oRect.Style.pixelHeight <= 1) Then oRect.Style.pixelHeight = 1  + HiFlag
					 
				 End If 
				
			

            Case "L"
                If pvRange * iHeight <> 0 Then
                    oRect.Style.pixelHeight = (iVal - pvRangeLo) / pvRange * iHeight
                Else
                    oRect.Style.pixelHeight = 0
                End If
                
                If Right(oRect.id, 2) = "LL" Then
                    If oRect.Style.pixelHeight < 1 Then oRect.Style.pixelHeight = 1     'min LoLo pixel height is 3, for tooltip access
                Else
				    'If oRect.Style.pixelHeight <= 1 Then oRect.Style.pixelHeight = 2
                    If ( oRect.Style.pixelHeight <= 1) Then oRect.Style.pixelHeight = 1  + LoFlag   'min Lo pixel height is 4, so not *arbitrarily* occluded by above
                End If

                oRect.Style.pixelTop = iTop + iHeight - oRect.Style.pixelHeight

  End Select
  call AlmPriority_OnUpdate(oSource1,oRect)
 
else
 oRect.style.visibility="hidden"
end if

end sub

sub AlmPriority_OnUpdate(oSource,oRect)
On Error resume next
if oRect.style.pixelheight>0 then 
  select case oSource.value
    case 2 
			oRect.Fillcolor=AlarmStateIconFactory.lowcolor
			oRect.style.visibility="visible"
    case 3 
			oRect.Fillcolor=AlarmStateIconFactory.highcolor
			oRect.style.visibility="visible"
    case 4 
			oRect.Fillcolor=AlarmStateIconFactory.urgentcolor
			oRect.style.visibility="visible"
    case else
		    	oRect.style.pixelheight=0
		        oRect.Fillcolor=transparent
    end select
else
    oRect.style.visibility="hidden"
end if

end sub</SCRIPT>

<SCRIPT language=VBScript defer>'Different regulatory algorithm type 
 sDAS  =  "DAS"
 sPIDNORM  =  "PIDNORM"
 sPIDRATIO  =  "PIDRATIO"
 sAUTRATIO  =  "AUTRATIO"
 sAUTOBIAS  =  "AUTOBIAS"
 sPIDCMA  =  "PIDCMA"
 sPIDCM  =  "PIDCM"
 sPIDSPC  =  "PIDSPC"
 sPIDERSQG  =  "PIDERSQG"
 sPIDERSQI  =  "PIDERSQI"
 sPIDGAP  =  "PIDGAP"
 sPIDEXFB  =  "PIDEXFB"
 sEXTRATBI  =  "EXTRATBI"
 sMASSFLOW  =  "MASSFLOW"
 sLEADLAG  =  "LEADLAG"
 sOVERHISL  =  "OVERHISL"
 sOVERLOSL  =  "OVERLOSL"
 sSUMRWMAN  =  "SUMRWMAN"
 sMULTWMAN  =  "MULTWMAN"
 sAUTOMAN  =  "AUTOMAN"
 sSWITCH  =  "SWITCH"
 sCBSUMR  =  "CBSUMR"
 sMULT  =  "MULT"
 sDIVIDR  =  "DIVIDR"
 sSQRT  =  "SQRT"
 sSQRTPROD  =  "SQRTPROD"
 sSUMSQRT  =  "SUMSQRT"
 sHISEL  =  "HISEL"
 sLOSEL  =  "LOSEL"
 sPIDDDC  =  "PIDDDC"
 sPIDDDCSP  =  "PIDDDCSP"
 sPIDNONLN  =  "PIDNONLN"
 sLEADLAGS  =  "LEADLAGS"
 sSELOVDDC  =  "SELOVDDC"
 sECSQRTPROD  =  "ECSQRTPROD"
 sECSUMR  =  "ECSUMR"
 sMULTDIV  =  "MULTDIV"
 sLEADLAGM  =  "LEADLAGM"
 sMIDOF3  =  "MIDOF3"
 sINCRMTL  =  "INCRMTL"
 sRAMPSOAK  =  "RAMPSOAK"
 sLOGIC  =  "LOGIC"
 sDEADTM  =  "DEADTM"
 sCHARACT  =  "CHARACT"


Sub Show_Tunning_Parameter(sAlgoType, sBoxType)
On Error Resume Next
	select case sAlgoType
		case sDAS, sOVERHISL, sOVERLOSL, sHISEL, sLOSEL, sSELOVDDC, sCHARACT, sRAMPSOAK, sINCRMTL
			shpcteng.value = 2
			shpcteng.ReloadContent()
		case  sPIDNORM, sPIDCMA, sPIDCM, sPIDSPC, sPIDDDC, sPIDDDCSP
			shpcteng.value = 3
			shpcteng.ReloadContent()
		case sPIDERSQG, sPIDERSQI 
			shpcteng.value = 4
			shpcteng.ReloadContent()
		case sAUTOMAN
			shpcteng.value = 5
			shpcteng.ReloadContent()
		case sDEADTM
			shpcteng.value = 6
			shpcteng.ReloadContent()
		case sLEADLAG
			shpcteng.value = 7
			shpcteng.ReloadContent()
		case sPIDRATIO
			shpcteng.value = 8
			shpcteng.ReloadContent()
		case sAUTRATIO, sAUTOBIAS
			if (sBoxType = ucase("EC")) then
				shpcteng.value = 8
				shpcteng.ReloadContent()
			else
				shpcteng.value = 9
				shpcteng.ReloadContent()
			end if
		case sPIDGAP
			if (sBoxType = ucase("EC")) then
				shpcteng.value = 11
				shpcteng.ReloadContent()
			else
				shpcteng.value = 10
				shpcteng.ReloadContent()
			end if

		case sSUMRWMAN, sCBSUMR, sSQRT, sSUMSQRT
			shpcteng.value = 12
			shpcteng.ReloadContent()
		case sMULTWMAN, sMULT, sDIVIDR , sSQRTPROD
			shpcteng.value = 13
			shpcteng.ReloadContent()
		case  sLEADLAGS, sLEADLAGM
			shpcteng.value = 14
			shpcteng.ReloadContent()
		case sECSUMR
			shpcteng.value = 15
			shpcteng.ReloadContent()
		case sMASSFLOW
			shpcteng.value = 16
			shpcteng.ReloadContent()
		case sLOGIC
			shpcteng.value = 17
			shpcteng.ReloadContent()
		case sSWITCH
			shpcteng.value = 18
			shpcteng.ReloadContent()
		case sMULTDIV
			shpcteng.value = 19
			shpcteng.ReloadContent()
		case sEXTRATBI
			shpcteng.value = 20
			shpcteng.ReloadContent()
		case sPIDNONLN
			shpcteng.value = 21
			shpcteng.ReloadContent()
		case sECSQRTPROD
			shpcteng.value = 22
			shpcteng.ReloadContent()
		case sMIDOF3
			shpcteng.value = 23
			shpcteng.ReloadContent()
		case sPIDEXFB
			shpcteng.value = 24
			shpcteng.ReloadContent()
		case else
			shpcteng.value = 1
			shpcteng.ReloadContent()
	end select
End Sub</SCRIPT>
