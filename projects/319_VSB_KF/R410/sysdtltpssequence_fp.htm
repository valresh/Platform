sub ApplyLayout()
'	This routine enables the 'smart sizing' of faceplates

	on error resume next

	'*******************************************************************************************************************
	' this code section enables faceplates to stretch taller, 
	' if the provided (SafeView) window has a height/width aspect ratio of 2.5 or greater
    
	dim oSview
    	dim nFpRatio, nSVWindowRatio, nNewRatio

	set oSview=getobject("","Honeywell.Workspace.Client")
    	If oSview.IsManagerActive = true then
        	nFpRatio= (Page.style.pixelHeight / Page.style.pixelWidth)
        	nSVWindowRatio= round((Page.parentElement.clientHeight / Page.parentElement.clientWidth),1)   'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        	nNewRatio = round(nSVWindowRatio / nFpRatio,1)                                                'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        	if window.external.AppWindow.width <= 500 and nSVWindowRatio >= 2.5 then                      '500px is max facplate width supported
            		Page.style.pixelHeight = clng((Page.style.pixelHeight * nNewRatio))
        	end if
    	end if
	' 
	'*******************************************************************************************************************

	GrpLowerPanel.style.top = ""
	GrpLowerPanel.style.bottom = "2px"
	PicBackground.style.pixelWidth  = Page.style.pixelWidth
	PicBackground.style.pixelHeight = Page.style.pixelHeight

	GrpCenterPanel.style.top = ""
	if (Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10) > 153 then
		GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	else
		GrpCenterPanel.style.top = (GrpUpperPanel.style.pixelHeight - 1) & "px"
	end if

end sub

'put a zero in front of the number if it is less than 10
Function FormatCode(I)
    On Error Resume Next
    If I < 10 Then FormatCode = "0" & CStr(I)
    If I >= 10 And I < 100 Then FormatCode = CStr(I)
    If I >= 100 Then FormatCode = CStr(I)
End Function

Sub SetButton(OSource, Param)
    On Error Resume Next
    OSource.Style.border = "inset"
    OSource.Style.BorderWidth = 3
    Param = 1
End Sub


' called from ondatachange on sd for Sequence
Sub Update_Sequence
    
    'window.external.parentdocument.parentwindow.external.logmessage "***Update_SEQUENCE - TOP"
    
    'Following sub will only be called once after the faceplate is invoked.
    If Initialized = False Then
        Initialized = True
        sNameStr = alphaTagName.Value
        ButtonOffState = 0
        ButtonEMSDState = 0
        ButtonHOLDState = 0
        ButtonSHDNState = 0
        ButtonReadyState = 0
        ButtonStartState = 0
        ButtonStopState = 0
        ButtonAutoState = 0
        ButtonSemiState = 0
        ButtonSNGLState = 0
        OverState = 0
        ButtonForwardState = 0
        ButtonBackwardState = 0
    End If
    
    'window.external.parentdocument.parentwindow.external.logmessage "***Update_SEQUENCE - calling SequenceDataChange..."
    Call SequenceDataChange
    'window.external.parentdocument.parentwindow.external.logmessage "***Update_SEQUENCE - calling SequenceRefreshPROCMOD..."
    Call SequenceRefreshPROCMOD
    'window.external.parentdocument.parentwindow.external.logmessage "***Update_SEQUENCE - calling SequenceCFMMSG..."
    Call SequenceCFMMSG
    'window.external.parentdocument.parentwindow.external.logmessage "***Update_SEQUENCE - calling SequencePointState..."
    Call SequencePointState
    
    'window.external.parentdocument.parentwindow.external.logmessage "***Update_SEQUENCE - BOTTOM"

End Sub

'Return all buttons associated with procmod to outset state
Sub SequenceReturnPROCMOD
    
    ButtonOffState = 0

    ButtonReadyState = 0
    pushbuttonoff.Style.border = "outset"
    pushbuttonoff.Style.BorderWidth = 2
    pushbuttonEMSD.Style.border = "outset"
    pushbuttonEMSD.Style.BorderWidth = 2
    pushbuttonHOLD.Style.border = "outset"
    pushbuttonHOLD.Style.BorderWidth = 2
    pushbuttonSHDN.Style.border = "outset"
    pushbuttonSHDN.Style.BorderWidth = 2
    pushbuttonReady.Style.border = "outset"
    pushbuttonReady.Style.BorderWidth = 2
End Sub

'Hide all buttons associated with procmod
'Put oper button to original state.
Sub SequenceHidePROCMOD
        
    pushbuttonOff.Style.visibility = "Hidden"
    pushbuttonEMSD.Style.visibility = "Hidden"
    pushbuttonHOLD.Style.visibility = "Hidden"
    pushbuttonSHDN.Style.visibility = "Hidden"
    pushbuttonReady.Style.visibility = "Hidden"
    pushbuttonReturn.Style.visibility = "Hidden"
    pushbuttonOK.Style.visibility = "Hidden"
    
    pushbuttonOper.Style.border = "outset"
    pushbuttonOper.Style.BorderWidth = 2
    ButtonOperState = 0

End Sub

'display all buttons associated with procmod
Sub SequenceShowPROCMOD

    If sd.DataValue("CurrentPoint.abhemsd") <> "0" Then
        pushbuttonEMSD.Style.visibility = "visible"
    Else
        pushbuttonEMSD.Style.visibility = "Hidden"
    End If
    If sd.DataValue("CurrentPoint.abhHOLD") <> "0" Then
        pushbuttonHOLD.Style.visibility = "visible"
    Else
        pushbuttonHOLD.Style.visibility = "Hidden"
    End If
    If sd.DataValue("CurrentPoint.abhSHDN") <> "0" Then
        pushbuttonSHDN.Style.visibility = "visible"
    Else
        pushbuttonSHDN.Style.visibility = "Hidden"
    End If
    pushbuttonOK.Style.visibility = "visible"
    pushbuttonReturn.Style.visibility = "visible"
    pushbuttonOFF.Style.visibility = "visible"
    If UCase(sd.DataValue("CurrentPoint.ent_type")) = "PRCMODHG" Then
        pushbuttonREADY.Style.visibility = "visible"
    Else
        pushbuttonREADY.Style.visibility = "Hidden"
    End If
End Sub

'set value of param_procmod
Sub SequenceSetPROCMOD
    
    If ButtonOffState = 1 Then
        sd.DataValue("CurrentPoint.procmod") = "OFF"
        Exit Sub
    End If
    If ButtonEMSDState = 1 Then
        sd.DataValue("CurrentPoint.procmod") = "EMSD"
        Exit Sub
    End If
    If ButtonSHDNState = 1 Then
        sd.DataValue("CurrentPoint.procmod") = "SHDN"
        Exit Sub
    End If
    If ButtonHOLDState = 1 Then
        sd.DataValue("CurrentPoint.procmod") = "HOLD"
        Exit Sub
    End If
    If ButtonReadyState = 1 Then
        sd.DataValue("CurrentPoint.procmod") = "REDY"
        Exit Sub
    End If
End Sub

'display all buttons associated with EXEC
Sub SequenceShowExec
    
    pushbuttonStart.Style.visibility = "visible"
    pushbuttonStop.Style.visibility = "visible"
    pushbuttonExeOK.Style.visibility = "visible"
    pushbuttonExeReturn.Style.visibility = "visible"
End Sub

'return all buttons associated with EXEC to its original state
Sub SequenceReturnExec
    
    ButtonStartState = 0
    ButtonStopState = 0
    pushbuttonStart.Style.border = "outset"
    pushbuttonStart.Style.BorderWidth = 2
    pushbuttonStop.Style.border = "outset"
    pushbuttonStop.Style.BorderWidth = 2
End Sub

'Hide all buttons associated with EXEC
Sub SequenceHideExec
    
    pushbuttonStart.Style.visibility = "Hidden"
    pushbuttonStop.Style.visibility = "Hidden"
    pushbuttonExeOK.Style.visibility = "Hidden"
    pushbuttonExeReturn.Style.visibility = "Hidden"

    pushbuttonExec.Style.border = "outset"
    pushbuttonExec.Style.BorderWidth = 2
    
End Sub

'Set procmod to "START" or "STOP"
Sub SequenceSetExec
    
    If ButtonStartState <> 0 Then
        sd.DataValue("CurrentPoint.procmod") = "STRT"
        Exit Sub
    End If
    If ButtonStopState <> 0 Then
        sd.DataValue("CurrentPoint.procmod") = "STOP"
    End If
End Sub

    pushbuttonMDOK.Style.BorderWidth = 2
    pushbuttonMDReturn.Style.border = "outset"
    pushbuttonMDReturn.Style.BorderWidth = 2
End Sub

Sub SequenceHideMode
        
    pushbuttonAuto.Style.visibility = "Hidden"
    pushbuttonSemi.Style.visibility = "Hidden"
    pushbuttonSngl.Style.visibility = "Hidden"
    pushbuttonMDOK.Style.visibility = "Hidden"
    pushbuttonMDReturn.Style.visibility = "Hidden"

    pushbuttonMode.Style.border = "outset"
    pushbuttonMode.Style.BorderWidth = 2
End Sub

Sub SequenceSetMode
    
    If ButtonAutoState <> 0 Then
        sd.DataValue("CurrentPoint.seqmode") = "AUTO"
    End If
    If ButtonSemiState <> 0 Then
        sd.DataValue("CurrentPoint.seqmode") = "SEMIAUTO"
    End If
    If ButtonSNGLState <> 0 Then
        sd.DataValue("CurrentPoint.seqmode") = "SNGLSTEP"
    End If
End Sub

Sub SequenceRefreshPROCMOD

    If ButtonOperState = 1 Then
        Call SequenceShowPROCMOD
    End If
End Sub

'display forward backward button when any of phase, step and statement is selected.
Sub SequenceShowOver
     
    pushbuttonForward.Style.visibility = "visible"
    pushbuttonBackward.Style.visibility = "visible"
    pushbuttonOverReturn.Style.visibility = "visible"
    pushbuttonOverOK.Style.visibility = "visible"
End Sub

'return buttons associated with phase, step and statement to its original state.
Sub SequenceReturnOver
    
    ButtonForwardState = 0
    ButtonBackwardState = 0
    pushbuttonForward.Style.border = "outset"
    pushbuttonForward.Style.BorderWidth = 2
    pushbuttonBackward.Style.border = "outset"
    pushbuttonBackward.Style.BorderWidth = 2
    pushbuttonOverReturn.Style.border = "outset"
    pushbuttonOverReturn.Style.BorderWidth = 2
    pushbuttonOverOK.Style.border = "outset"
    pushbuttonOverOK.Style.BorderWidth = 2
End Sub

'hide buttons associated with phase, step and statement to its original state
Sub SequenceHideOver
    
    pushbuttonForward.Style.visibility = "Hidden"
    pushbuttonBackward.Style.visibility = "Hidden"
    pushbuttonOverReturn.Style.visibility = "Hidden"
    pushbuttonOverOK.Style.visibility = "Hidden"

    Select Case OverState
    Case 1
        pushbuttonPhase.Style.border = "outset"
        pushbuttonPhase.Style.BorderWidth = 2
    Case 2
        pushbuttonStep.Style.border = "outset"
        pushbuttonStep.Style.BorderWidth = 2
    Case 3
        pushbuttonStatement.Style.border = "outset"
        pushbuttonStatement.Style.BorderWidth = 2
    End Select
    OverState = 0
End Sub

'set value to parameter overphas, overstep and overstat
Sub SequenceSetOver
    
    Select Case OverState
    Case 1
        If ButtonForwardState <> 0 Then
            sd.DataValue("CurrentPoint.OVERPHAS") = "FORWARD"
        End If
        If ButtonBackwardState <> 0 Then
            sd.DataValue("CurrentPoint.OVERPHAS") = "BACKWARD"
        End If
    Case 2
        If ButtonForwardState <> 0 Then
            sd.DataValue("CurrentPoint.OVERSTEP") = "FORWARD"
        End If
        If ButtonBackwardState <> 0 Then
            sd.DataValue("CurrentPoint.OVERSTEP") = "BACKWARD"
        End If
    Case 3
        If ButtonForwardState <> 0 Then
            sd.DataValue("CurrentPoint.OVERSTAT") = "FORWARD"
        End If
        If ButtonBackwardState <> 0 Then
            sd.DataValue("CurrentPoint.OVERSTAT") = "BACKWARD"
        End If
    End Select
End Sub

'Display CFM if there is a confirmable message.
Sub SequenceCFMMSG
    
    If UCase(sd.DataValue("CurrentPoint.ent_type")) = "PRCMODHG" Then
        If sd.DataValue("CurrentPoint.Messpend") <> "0" Then
            txt_message.Value = "CFM"
            txt_message.Style.visibility = "visible"
            'window.external.parentdocument.parentwindow.external.logmessage "SequenceCFMMSG - (PRCMODHG) Messpend<>0, setting txt_message=='CFM'"
        Else
            txt_message.Style.visibility = "Hidden"
        End If
    Else
        If sd.DataValue("CurrentPoint.msgpend") <> "0" Then
            txt_message.Value = "CFM"
            txt_message.Style.visibility = "visible"
            'window.external.parentdocument.parentwindow.external.logmessage "SequenceCFMMSG - msgpend<>0, setting txt_message=='CFM'"
        Else
            txt_message.Style.visibility = "Hidden"
        End If
    End If
End Sub

Sub SequenceDataChange
    
    ' point state indicator
    If sd.QualityGood("CurrentPoint.PNTSTATE") And UCase(sd.DataValue("CurrentPoint.PNTSTATE")) <> "OK" Then
        state_PNTSTATE.Value = Left(sd.DataValue("CurrentPoint.PNTSTATE"), 1)
        If bToolTips = True Then
            state_PNTSTATE.Title = sd.DataValue("CurrentPoint.PNTSTATE")   'tooltip
        End If
        'window.external.parentdocument.parentwindow.external.logmessage "SequenceDataChange - PNTSTATE=" & state_PNTSTATE.Value
    Else
        state_PNTSTATE.Style.visibility = "Hidden"
    End If
    
    If sd.DataValue("CurrentPoint.abhhold") <> "0" Then
        textHOLD.Style.visibility = "visible"
        'window.external.parentdocument.parentwindow.external.logmessage "SequenceDataChange - abhhold<>0 showing textHOLD"
    Else
        textHOLD.Style.visibility = "Hidden"
    End If

    If sd.DataValue("CurrentPoint.abhshdn") <> "0" Then
        textSHDN.Style.visibility = "visible"
        'window.external.parentdocument.parentwindow.external.logmessage "SequenceDataChange - abhshdn<>0 showing textSHDN"
    Else
        textSHDN.Style.visibility = "Hidden"
    End If

    If sd.DataValue("CurrentPoint.abhemsd") <> "0" Then
        textEMSD.Style.visibility = "visible"
        'window.external.parentdocument.parentwindow.external.logmessage "SequenceDataChange - abhemsd<>0 showing textEMSD"
    Else
        textEMSD.Style.visibility = "Hidden"
    End If

    pushbuttonstatement.innerText = sd.DataValue("CurrentPoint.Statment")

    pushbuttonStep.innerText = sd.DataValue("CurrentPoint.STEP")

    pushbuttonphase.innerText = sd.DataValue("CurrentPoint.phase")

    pushbuttonMode.innerText = sd.DataValue("CurrentPoint.seqmode")

    Dim DisplayStr
    
    Select Case sd.DataValue("CurrentPoint.seqexec")
    Case "FAIL"
        pushbuttonExec.FillColor = "RED"
        pushbuttonExec.textColor = "WHITE"
        If sd.DataValue("CurrentPoint.ent_type") = "PRCMODHG" Then
            DisplayStr = "FA" & FormatCode(sd.DataValue("CurrentPoint.SEQERR.external"))
        Else
            DisplayStr = "F" & CStr(sd.DataValue("CurrentPoint.SEQERR.external"))
        End If
        'window.external.parentdocument.parentwindow.external.logmessage "SequenceDataChange - seqexec==FAIL, DisplayStr=" & DisplayStr
    Case "ERROR"
        pushbuttonExec.FillColor = "RED"
        pushbuttonExec.textColor = "WHITE"
        If sd.DataValue("CurrentPoint.ent_type") = "PRCMODHG" Then
            DisplayStr = "ER" & FormatCode(sd.DataValue("CurrentPoint.SEQERR.external"))
        Else
            DisplayStr = "E" & CStr(sd.DataValue("CurrentPoint.SEQERR.external"))
        End If
        'window.external.parentdocument.parentwindow.external.logmessage "SequenceDataChange - seqexec==ERROR, DisplayStr=" & DisplayStr
    Case "PAUSE", "END"
        pushbuttonExec.FillColor = "YELLOW"
        pushbuttonExec.textColor = "BLACK"
        DisplayStr = sd.DataValue("CurrentPoint.seqexec")
        'window.external.parentdocument.parentwindow.external.logmessage "SequenceDataChange - seqexec==PAUSE/END, DisplayStr=" & DisplayStr
    Case Else
        pushbuttonExec.FillColor = RGB(231, 219, 214)
        pushbuttonExec.textColor = "BLACK"
        DisplayStr = sd.DataValue("CurrentPoint.seqexec")
        'window.external.parentdocument.parentwindow.external.logmessage "SequenceDataChange - seqexec=='else', DisplayStr=" & DisplayStr
    End Select

    pushbuttonExec.innerText = DisplayStr

    pushbuttonOper.innerText = sd.DataValue("CurrentPoint.procmod")
    Select Case sd.DataValue("CurrentPoint.procmod")
    Case "EMSD"
        pushbuttonOper.FillColor = "RED"
        pushbuttonOper.textColor = "WHITE"
        pushbuttonStep.FillColor = "RED"
        pushbuttonStep.textColor = "WHITE"
    Case "HOLD", "SHDN"
        pushbuttonOper.FillColor = "YELLOW"
        pushbuttonOper.textColor = "BLACK"
        pushbuttonStep.FillColor = "RED"
        pushbuttonStep.textColor = "WHITE"
    Case Else
        pushbuttonOper.FillColor = RGB(231, 219, 214)
        pushbuttonOper.textColor = "BLACK"
        pushbuttonStep.FillColor = RGB(231, 219, 214)
        pushbuttonStep.textColor = "BLACK"
    End Select
    
    'window.external.parentdocument.parentwindow.external.logmessage "SequenceDataChange - procmod=" & sd.DataValue("CurrentPoint.procmod")
    
End Sub

Sub SequencePointState
    If UCase(sd.DataValue("CurrentPoint.PTEXECST")) = "INACTIVE" Then
        state_pointState.Value = "INACTIVE"
        state_pointState.Style.visibility = "visible"
        'window.external.parentdocument.parentwindow.external.logmessage "SequencePointState - INACTIVE"
        Exit Sub
    End If
    If Not sd.QualityConfigError("CurrentPoint.STSMSG") Then
        If UCase(sd.DataValue("CurrentPoint.STSMSG")) <> "NONE" Then
            state_pointState.textColor = "BLACK"
            state_pointState.Style.visibility = "Visible"
            state_pointState.Value = sd.DataValue("CurrentPoint.STSMSG")
            'window.external.parentdocument.parentwindow.external.logmessage "SequencePointState - STSMSG=" & sd.DataValue("CurrentPoint.STSMSG")
            Exit Sub
        End If
    End If
    state_pointState.Style.visibility = "Hidden"
End Sub</SCRIPT>
