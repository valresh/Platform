shaperefcount="60">'
' General Section (sysdtlswitch_oneportstatus.sha)

Sub InitPort(objPort, sKey)
Dim sPath
Dim sDebugStr
Dim sTest

'	window.external.Parent.LogMessage "sysdtlswitch_oneportstatus.sha - InitPort TOP..."
	on error resume next  

	sPath = "localhost.[ROOT\SNMP\" & sSwitchName & "].SNMP_RFC1213_MIB_IFTABLE." & sKey

	sTest = objPort.GetCustomProperty("Value", "valuePortKey")
	if sTest = sKey then
' 		Debug/keep
'		window.external.Parent.LogMessage "InitPort - sKey already set for: " & sKey & ", NOT calling SetCustomProperty for this port's custom parameters"
	else

		objPort.autoReloadContent = false
		objPort.SetCustomProperty "Parameter", "paramOperStatus", sPath & ".ifOperStatus"
		objPort.SetCustomProperty "Parameter", "paramPortDescr", sPath & ".ifDescr"
		objPort.SetCustomProperty "Parameter", "paramPortSpeed", sPath & ".ifSpeed"
		objPort.SetCustomProperty "Parameter", "paramPortIndex", sPath & ".ifIndex"
		objPort.SetCustomProperty "Value", "valuePortKey", sKey
		objPort.SetCustomProperty "Point", "pointPort", sPoint

'Debug/keep  
'		window.external.Parent.LogMessage "InitPort - sPath= " & sPath
'		sDebugStr = objPort.GetCustomProperty("Parameter", "paramOperStatus")
'		window.external.Parent.LogMessage "InitPort - paramOperStatus= " & sDebugStr
'		sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortDescr")
'		window.external.Parent.LogMessage "InitPort - paramPortDescr= " & sDebugStr
'		sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortSpeed")
'		window.external.Parent.LogMessage "InitPort - paramPortSpeed= " & sDebugStr
'		sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortIndex")
'		window.external.Parent.LogMessage "InitPort - paramOperStatus= " & sDebugStr
'		window.external.Parent.LogMessage "sysdtlswitch_oneportstatus.sha - InitPort bottom, calling .ReloadContent on single port..."
		objPort.ReloadContent

	end if

end sub


Sub PDC(objVal, nCol)
Dim sKey

'	window.external.Parent.LogMessage "PDC TOP..."
	on error resume next ' hides script error, possibly addressed by above change to throttle .ReloadContent calls

	sKey = objVal.parentElement.parentElement.GetCustomProperty("Value", "valuePortKey")

'	window.external.Parent.LogMessage "... PDC: sKey=" & sKey

	if sKey = "" then exit sub


	if IsStsGoodQuality(objVal) then 
'		window.external.Parent.LogMessage "PDC: IsStsGoodQuality GOOD, calling PortDataChange..."
		PortDataChange sKey, nCol, objVal.value
'	else 
'		window.external.Parent.LogMessage "PDC: IsStsGoodQuality BAD - NOT calling PortDataChange"
	end if

End Sub

Sub PDC100000(objVal)
Dim sKey

	on error resume next
	sKey = objVal.parentElement.parentElement.GetCustomProperty("Value", "valuePortKey")
	if sKey = "" then exit sub
	if IsStsGoodQuality(objVal) then PortDataChange sKey, 0, objVal.value + 100000

End Sub

' End General Section (sysdtlswitch_oneportstatus.sha)
'</SCRIPT>

<SCRIPT language=VBScript defer>'
' General Section (sysdtlswitchb.htm)
option explicit
Dim nPortCount
Dim PortNames(60) '50 plus a few spares
Dim sPoint
Dim sSwitchName

sub UpdatePortList
Dim ix

'window.external.Parent.LogMessage "sysdtlswitchb.htm - UpdatePortList TOP..."
	ListView.ColumnHeaders.Clear
	ListView.ColumnHeaders.Add 1, , "", 0
	ListView.ColumnHeaders.Add 2, , textLBColTitle001.value, 80
	ListView.ColumnHeaders.Add 3, , textLBColTitle002.value, 420
	ListView.ColumnHeaders.Add 4, , textLBColTitle003.value, 80
	ListView.ColumnHeaders.Add 5, , textLBColTitle004.value, 120
	ListView.font.name="Tahoma"
	ListView.font.Italic=false
	ListView.font.size=10
	ListView.font.bold=false
	ListView.SortOrder = 0
	ListView.SortKey = 0
	ListView.FullRowSelect = true

'window.external.Parent.LogMessage "... calling InitPort on all in-use ports, nPortCount=" & nPortCount
	for ix = 0 to nPortCount - 1
		InitPort grpPorts.children(ix), PortNames(ix)
	next
end sub


Sub PortDataChange(sKey, nCol, sVal)
Dim objListItem, n1000, n1024, nVal
	on error resume next

'window.external.Parent.LogMessage "sysdtlswitchb.htm - PortDataChange; sKey:" & sKey & ", nCol:" & nCol & ", sVal:" & sVal
	set objListItem = ListView.ListItems.Item(sKey)
	if objListItem is nothing then
'	window.external.Parent.LogMessage "...in PortDataChange, empty sKey, adding key to ListItem: " & sKey
		set objListItem = ListView.ListItems.Add(, sKey, "")
'		if objListItem is nothing then msgbox "Still nothing"
		if objListItem is nothing then window.external.Parent.LogMessage "... ListItem still 'nothing' after adding sKey!"
	end if
	if nCol = 0 then
		objListItem.Text = sVal
	elseif nCol = 4 then
		if sVal > 1000000 then objListItem.SubItems(nCol) = sVal / 1000000
	else
		objListItem.SubItems(nCol) = sVal
	end if
	ListView.style.visibility = "inherit"
	textRequestingStatus.style.visibility = "hidden"
'window.external.Parent.LogMessage "... PortDataChange bottom"

End Sub


Function IsStsGoodQuality(obj)
	if not obj is nothing and IsObject(obj) then
		if (obj.quality and 192) = 192 then
			IsStsGoodQuality = TRUE
		else
			IsStsGoodQuality = FALSE
		end if
	else
		IsStsGoodQuality = FALSE
	end if
end function
' End General Section (sysdtlswitchb.htm)
'</SCRIPT>

<SCRIPT language=VBScript for=shpPortTable_shpPortNames_alphaPortFetch defer 
event=ondatachange>Dim ix, sFullPath, fQual
	on error resume next'  << Jim removed to not hide errors...

	for ix = 0 to nRememberedCount - 1
'		sFullPath = sPoint & "." & sPartPath & ix   << Jim modified, since "pointTable" already assigned sPoint
		sFullPath = "pointTable." & sPartPath & ix  'e.g. $switch_130.localhost.[ROOT\SNMP\]PCDI2955Y.SNMP_FRC1213_MIB_IFTABLE.__branchenum.10

'window.external.Parent.LogMessage "alphaPortFetch_ondatachange ix:" & ix 
'window.external.Parent.LogMessage "... sFullPath= " & sFullPath
		err.clear
		fQual = me.QualityGood(sFullPath)
		if (err.number = 0) and fQual and me.DataChanged(sFullPath) then PortNames(ix) = me.DataValue(sFullPath)

	next

'window.external.Parent.LogMessage "... calling UpdatePortList"
	UpdatePortList</SCRIPT>

<SCRIPT id=9835D403-2091-47BC-92F2-4F2554C0C82E language=VBScript defer 
shaperefcount="1">'
' General Section (sysdtlswitch_port_table.sha)
option explicit
Dim sPartPath
Dim nRememberedCount

Sub InitPortTable(objShape, sSwitch)


'	window.external.Parent.LogMessage "InitPortTable TOP - sSwitchName: " & sSwitch & "; sPoint: " & sPoint
	sPartPath = "localhost.[ROOT\SNMP\" & sSwitch & "].SNMP_RFC1213_MIB_IFTABLE.__branchenum."
	objShape.autoReloadContent = false
	objShape.SetCustomProperty "Parameter", "paramPortCount", sPartPath & "#"
	objShape.SetCustomProperty "Point", "pointPortCount", sPoint
	objShape.ReloadContent		' trigger fetch of interface count
end sub

' This routine lives in sysdtlswitch_port_names.sha
Sub InitPortList(objShape)
Dim ix
	on error resume next
	if nRememberedCount = nPortCount then exit sub
	nRememberedCount = nPortCount
	objShape.autoReloadContent = false
	for ix = 0 to nPortCount - 1
		objShape.SetCustomProperty "Parameter", "paramPort" & ix, sPartPath & ix
	next
	for ix = nPortCount to 59
		objShape.SetCustomProperty "Parameter", "paramPort" & ix, ""
	next
	objShape.SetCustomProperty "Point", "pointTable", sPoint
	objShape.ReloadContent
end sub

' End General Section (sysdtlswitch_port_table.sha)
'</SCRIPT>
