    </head>
    <body scroll="no">
        <viewlink:tabset id="TabSet">
            <xml id="TabsXml">
                <tabset selected="GroupStatus.htm">
                    <tab disabled="false" tabid="GroupDetails.htm" title="Group Details">
                    </tab>
                    <tab disabled="false" tabid="ItemDetails.htm" title="Item List">
                    </tab>
                    <tab disabled="false" tabid="GroupStatus.htm" title="Group Status">
                    </tab>
                </tabset>
            </xml>
        </viewlink:tabset>
        <div id="DisplayArea" class="DetailsArea" align="left">
            <hr />
            <div id="WaitingSpan">
                Initializing display...
            </div>
            <table id="GroupDetails" cellpadding="0" callspacing="0" border="0">
                <tr>
                    <td colspan="4">
                        <div class="heading">
                            General:
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        Status:
                    </td>
                    <td>
                        <div id="lblStatus">
                        </div>
                    </td>
                    <td>
                        Start Time:
                    </td>
                    <td>
                        <div id="lblStartTime">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        Good Writes:
                    </td>
                    <td>
                        <div id="lblGoodWrites">
                        </div>
                    </td>
                    <td>
                        Errors:
                    </td>
                    <td>
                        <div id="lblErrors">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        Valid Items:
                    </td>
                    <td>
                        <div id="lblNumberOfValidItems">
                        </div>
                    </td>
                    <td>
                        Actual Period:
                    </td>
                    <td>
                        <span id="lblActualPeriod"></span>
                        &nbsp;msecs
                    </td>
                </tr>
                <tr>
                    <td colspan="4">
                        <hr />
                        <div class="heading">
                            Connected Status:
                        </div>
                    </td>
                </tr>
                <tr>
                    <td id="lblSrcPrimary1">
                        Source Primary:
                    </td>
                    <td>
                        <div id="lblConnectedSrcPrimary">
                        </div>
                    </td>
                    <td id="lblDstPrimary1">
                        Destination Primary:
                    </td>
                    <td>
                        <div id="lblConnectedDstPrimary">
                        </div>
                    </td>
                    <tr>
                        <td id="lblSrcBackup1">
                            Source Backup:
                        </td>
                        <td>
                            <div id="lblConnectedSrcBackup">
                            </div>
                        </td>
                        <td id="lblDstBackup1">
                            Destination Backup:
                        </td>
                        <td>
                            <div id="lblConnectedDstBackup">
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4">
                            <hr />
                            <div class="heading">
                                Error Code:
                            </div>
                        </td>
                    </tr>
                <tr>
                    <td id="lblSrcPrimary2">
                        Source Primary:
                    </td>
                    <td>
                        <div id="lblhResultSrcPrimary">
                        </div>
                    </td>
                    <td id="lblDstPrimary2">
                        Destination Primary:
                    </td>
                    <td>
                        <div id="lblhResultSrcBackup">
                        </div>
                    </td>
                </tr>
                <tr>
                    <td id="lblSrcBackup2">
                        Source Backup:
                    </td>
                    <td>
                        <div id="lblhResultDstPrimary">
                        </div>
                    </td>
                    <td id="lblDstBackup2">
                        Destination Backup:
                    </td>
                    <td>
                        <div id="lblhResultDstBackup">
                        </div>
                    </td>
                </tr>
            </table>
            <!-- End of GroupDetails -->
            <br />
            <viewlink:systembutton id="cmdRefresh" class="pushbutton">
                Refresh
            </viewlink:systembutton>
            <div id="PageLinks">
                <span id="cmdConfiguration" class="clsGroupLink"></span>
                <br />
                <br />
                <span id="cmdSysStatus" class="clsGroupLink"></span>
                <br />
                <br />
            </div>
        </div>
    </body>
</html>
