<SCRIPT language=VBScript defer>Sub UpdateStatus(index)
ConfiguredBit = document.getElementById("alpConfiguredBit"&index).value
ConnectionBit = document.getElementById("alpConnectiondBit"&index).value
if (ConfiguredBit = 0 and (ConnectionBit = 1 or ConnectionBit = 0)) then
	document.getElementById("shaConnectionStatus"&index).value = 1 'Not Configured
Elseif (ConfiguredBit = 1 and ConnectionBit = 1) then
	document.getElementById("shaConnectionStatus"&index).value = 2 'OK
Elseif (ConfiguredBit = 1 and ConnectionBit = 0) then
	document.getElementById("shaConnectionStatus"&index).value = 3 'Failed
Else 
document.getElementById("shaConnectionStatus"&index).value = 1 'Not Configured
End if
End Sub</SCRIPT>
