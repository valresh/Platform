<SCRIPT language=VBScript defer>dim bPageComplete
bPageComplete = false
Sub SetPageCompleteTrue()
	bPageComplete = true
end sub
Sub ApplyLayout()
	on error resume next
	GrpLowerPanel.style.top = ""
	GrpLowerPanel.style.bottom = "2px"
	GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2
	GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	GrpCenterPanel.style.pixelHeight = Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10
	If Window.external.Application.CurrentDisplayPageType = 10 Then
		grpEU.style.posTop = ConIndPV.style.posTop - 2
	end if
End Sub
sub setSpToolTip()
SpHiL =  rect002.DataValue("CurrentPoint.SPHI")
SpLol =  rect002.DataValue("CurrentPoint.SPLO") 
strOpToolTip = "SP High Limit = " & SpHil & " EU" & vbcr & "SP Low Limit  = " & SpLol & " EU"
if SpHiL = "1.#QNAN" OR SpLOl = "1.#QNAN" THEN 
ConIndSP.title = ""
else
ConIndSP.title = strOpToolTip
end if
end sub
sub setOpToolTip()
OpHiL =  rect002.DataValue("CurrentPoint.OPHI")
OpLol =  rect002.DataValue("CurrentPoint.OPLO")
strOpToolTip = "OP High Limit = " & OpHil & " %" & vbcr & "OP Low Limit  = " & OpLol & " %"
if OpHiL = "1.#QNAN" OR OpLol = "1.#QNAN" THEN 
ConIndOP.title = ""
else 
ConIndOP.title = strOpToolTip
end if
end sub
Sub OffNormalModeState()
On Error Resume Next
    Dim strMode, strNormMode
    strMode = ConCboMode.value
    strNormMode = rect002.DataValue("CurrentPoint.NORMALMODE")
	If strcomp(lcase(strNormMode), "none") <> 0 and  StrComp(strMode, strNormMode) <> 0 Then	
        TxtMode.styleclass = "Txt_Label_Off_Normal"	
		TxtMode.title = "Mode is off-normal (Normal mode is " & strNormMode & ")"		
    Else		
        TxtMode.styleclass = "Txt_Label_Normal"
		TxtMode.title = Vbnullstring
    End If
End Sub
Sub EUdescWidth
On Error Resume Next
    If ConAlpEUTickMarksServerBits.Value = 1 Then
        If Len(ConAlpPVEU2.Value) > 8 Then  'compensate for big/small numbers
           ConAlpUNITS.Style.pixelWidth = 45 - (Len(ConAlpPVEU2.Value) - 8) * 10
                If ConAlpUNITS.Style.pixelWidth < 20 Then
                    ConAlpUNITS.Style.pixelWidth = 20
                End If
        ElseIf Len(ConAlpPVEU2.Value) < 9 Then
            ConAlpUNITS.Style.pixelWidth = 45 + (7 - Len(ConAlpPVEU2.Value)) * 10
            If ConAlpUNITS.Style.pixelWidth > 62 Then
                ConAlpUNITS.Style.pixelWidth = 62
            End If
        End If
    End If
End Sub</SCRIPT>
