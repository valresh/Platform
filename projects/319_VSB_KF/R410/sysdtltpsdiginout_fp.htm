<SCRIPT language=VBScript for=Page defer event=onoperatorkey>' possible special handling if ramping for momentary/latched if combo_OP selected
'	Dim code
'	if UCase(window.document.activeElement.id) = "COMBO_OP" then
'		code=window.event.keycode
'		window.external.parentdocument.parentwindow.external.logmessage "OnOperatorKey, code: " & code
'		call Moment_Latch(code)
'	end if


' possible special handling if ramping for momentary/latched if combo_OP selected
	Dim code
'	if UCase(window.document.activeElement.id) = "COMBO_OP" then
	code=window.event.keycode
	window.external.parentdocument.parentwindow.external.logmessage "OnOperatorKey, code: " & code 

	if bMomentaryTimerActive = true then

		if code = IKB_KEY_RAISE_RELEASE then
			window.external.parentdocument.parentwindow.external.logmessage "OnOperatorKey, IKB_KEY_RAISE_RELEASE during ramping; calling Moment_Latch"
			call Moment_Latch("OKB RAISE RELEASE")
		elseif code = IKB_KEY_LOWER_RELEASE then
			window.external.parentdocument.parentwindow.external.logmessage "OnOperatorKey, IKB_KEY_LOWER_RELEASE during ramping; calling Moment_Latch"
			call Moment_Latch("OKB LOWER RELEASE")
		end if

	end if</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onexecutecommand>	dim strCommand
	strCommand = window.event.getAttribute("onExecuteCommand", 0)
	window.external.parentdocument.parentwindow.external.logmessage "Event-OnExecuteCmd: >>" & strCommand & "<<"

'// TEST   (workaround issue where IKB/OEP fails to send Raise/Lower release keys)
'	if strCommand = "OKB FAST RAISE" and bCurrentlyRamping then  'or use next line
'	if strCommand = "Lower" and bCurrentlyRamping then '  (for testing w/o IKB/OEP availability, only works for testing raise/raise-release)
'		window.external.parentdocument.parentwindow.external.logmessage "_+_+_+_+ TEST: converting FAST-RAISE to RAISE-RELEASE!"
'		strCommand = "OKB RAISE RELEASE"
'	end if
'//END TEST

	'note: the OKB release keys are not raised as onexecutecommand events - see those actually handled as OnOperatorKey events on Page
	if not (strCommand="Raise" or strCommand="OKB RAISE" or strCommand="Lower" or strCommand="OKB LOWER" _
		or strCommand="Raise Release" or strCommand="Lower Release" or strCommand="RaiseRepeat" or _
		strCommand="LowerRepeat" or strCommand="OKB RAISE REPEATED" or strCommand="OKB LOWER REPEATED" _
		or strCommand="OKB RAISE RELEASE" or strCommand="OKB LOWER RELEASE") then
		exit sub
	end if

	' if this is MOMENTARY or LATCHED (Doorbell) point, then bypass the operator confirmation and hold the value while key held
	if bCurrentlyRamping then
		window.external.parentdocument.parentwindow.external.logmessage "Calling Moment_Latch as ramping ongoing..."
		call Moment_Latch(strCommand)
		window.event.returnvalue = false 'Notify Station the command is handled
		exit sub
	end if

	if UCase(window.document.activeElement.id) = "COMBO_OP" and (sd.DataValue("CurrentPoint.MOOUTIND") = "MOMENT" or (not sd.QualityGood("CurrentPoint.MOOUTIND") and sd.DataValue("CurrentPoint.PNTOPOP") = "LATCHOUT")) then

		window.external.parentdocument.parentwindow.external.logmessage "Calling Moment_Latch, strCommand=" & strCommand
		window.external.parentdocument.parentwindow.external.logmessage "...MOOUTIND= >>" & sd.DataValue("CurrentPoint.MOOUTIND") & "<< and PNTOPOP= >>" & sd.DataValue("CurrentPoint.PNTOPOP") & "<<"
		call Moment_Latch(strCommand)
		window.event.returnvalue = false 'Notify Station the command is handled
		exit sub
	end if

	'disable PV ramping if not PVSOURCE=MAN
	if sd.QualityGood("CurrentPoint.PVSOURCE") and sd.DataValue("CurrentPoint.PVSOURCE") <> "MAN" and UCase(window.document.activeElement.id) = "COMBO_PV" then
		window.event.returnvalue = false 'Notify Station the command is handled  (do nothing)
		exit sub
	end if

	if Page.hasFocus or sElementRaiseLower <> "" or UCase(window.document.activeElement.id) = "COMBO_OP" or UCase(window.document.activeElement.id) = "COMBO_PV" or UCase(window.document.activeElement.id) = "COMBO_MD" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then

'raise/lower keys require operator confirmation - supported for OP, MODE, MODATTR
		if strCommand="Raise" or strCommand="OKB RAISE" then

			window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise " 
			if sElementRaiseLower = "OP" or UCase(window.document.activeElement.id) = "COMBO_OP" then							
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "OP"
				GrpOP.focus 'set focus to unbound element to avoid Station noise, reset to OP later
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_OP.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseOP(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			elseif sElementRaiseLower = "PV" or UCase(window.document.activeElement.id) = "COMBO_PV" then							
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "PV"
				GrpPV.focus 'set focus to unbound element to avoid Station noise, reset to PV later
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_PV.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextRaisePV(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			elseif sElementRaiseLower = "MODE" or UCase(window.document.activeElement.id) = "COMBO_MD" then				
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODE"

				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MD.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseMODE(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				GrpMD.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			elseif sElementRaiseLower = "MODATTR" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then				
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODATTR"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MDATTR.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseMODATTR(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				GrpMDAttr.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			end if
		elseif strCommand="Lower" or strCommand="OKB LOWER" then
			if sElementRaiseLower = "OP" or UCase(window.document.activeElement.id) = "COMBO_OPFINAL" or UCase(window.document.activeElement.id) = "COMBO_OP" then
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "OP"
				GrpOP.focus 'set focus to unbound element to avoid Station noise, reset to OP later
				if sd.QualityGood("CurrentPoint.MOOUTIND") and sd.DataValue("CurrentPoint.MOOUTIND") = "MOMENT" then
					'call HandleMomentaryControl(strCommand)
				else
					if sCurrentShownRaiseLowerValue = "" then
						sCurrentShownRaiseLowerValue = combo_OP.innerText
					end if
					sCurrentShownRaiseLowerValue = GetNextLowerOP(sCurrentShownRaiseLowerValue)
					window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Lower-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
					window.event.returnvalue = false 'Notify Station the command is handled
					call RaiseLowerConfirm2()
				end if
			elseif sElementRaiseLower = "PV" or UCase(window.document.activeElement.id) = "COMBO_PV" then							
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "PV"
				GrpPV.focus 'set focus to unbound element to avoid Station noise, reset to PV later
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_PV.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextLowerPV(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			elseif sElementRaiseLower = "MODE" or UCase(window.document.activeElement.id) = "COMBO_MD" then
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODE"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MD.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextLowerMODE(sCurrentShownRaiseLowerValue)
				GrpMD.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			elseif sElementRaiseLower = "MODATTR" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then				
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODATTR"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MDATTR.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextLowerMODATTR(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Lower-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				GrpMDAttr.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm2()
			end if
		end if
	end if</SCRIPT>

Function RaiseLowerConfirm2()

	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID) 'clear old/other timers
  	intRaiseLowerTimerID = window.setInterval ("CheckRaiseLowerResponse2()", 500)

End Function

sub CheckRaiseLowerResponse2

	dim sResponse
	dim iStatus
	dim ptPromptType 
	dim sMsgZoneText
	ptPromptType = 1

	on error resume next ' until station issue resolved for page.AutoSelectOnNextModeChange

	nConfirmCount = nConfirmCount + 1

	sMsgZoneText = window.external.parentdocument.parentwindow.external.MessageZoneText 

'	sConfirmRaiseLowerMsg = "<" & nConfirmCount & "> " & "Change state of TPS:" & text_NAME.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	sConfirmRaiseLowerMsg = "Change state of TPS:" & alphaTagName.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	iStatus = window.external.parentdocument.parentwindow.external.GetResponse3 (sConfirmRaiseLowerMsg, ptPromptType, sResponse)

'	window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: status returned= " & iStatus

	if iStatus = 0 and nConfirmCount > 1 then

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: - action cancelled by user" 
		call CancelRaiseLowerConfirmation
		exit sub
	elseif iStatus = 1 then
		if sResponse = "" then
			'no response yet... let timer fire again shortly
		else
			'recieved response, process it and we're DONE
			if UCase(sResponse) = "Y" then
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: setting: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				if sElementRaiseLower = "OP" then
					combo_OP.hostpopulation = true
					combo_OP.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.OP"), 1
					end if
					combo_OP.focus
				elseif sElementRaiseLower = "PV" then
					combo_PV.hostpopulation = true
					combo_PV.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.PV"), 1
					end if
					combo_PV.focus
				elseif sElementRaiseLower = "MODE" then
					combo_MD.hostpopulation = true
					page.AutoSelectOnNextModeChange = true
					combo_MD.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODE"), 1
					end if
					combo_MD.focus
				elseif sElementRaiseLower = "MODATTR" then
					combo_MDATTR.hostpopulation = true
					combo_MDATTR.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODATTR"), 1
					end if
					combo_MDATTR.focus
				end if
			end if

			call CancelRaiseLowerConfirmation

		end if
	end if

	if nConfirmCount > 2 and (sMsgZoneText = "" or (sConfirmRaiseLowerMsg <> sMsgZoneText)) then		
		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: message text changed operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if

	'expire after Experion's "operator timeout" - e.g. 60 seconds (x2 as timer is .5 secs)
	if nConfirmCount > oper_timeout.value * 2 then 

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: nConfirmCount > Experion operator timeout: " & oper_timeout.value & "; operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if


end sub

sub ApplyLayout()
'	This routine enables the 'smart sizing' of faceplates
	on error resume next

	'*******************************************************************************************************************
	' this code section enables faceplates to stretch taller, 
	' if the provided (SafeView) window has a height/width aspect ratio of 2.5 or greater
    
	dim oSview
    	dim nFpRatio, nSVWindowRatio, nNewRatio

	set oSview=getobject("","Honeywell.Workspace.Client")
    	If oSview.IsManagerActive = true then
        	nFpRatio= (Page.style.pixelHeight / Page.style.pixelWidth)
        	nSVWindowRatio= round((Page.parentElement.clientHeight / Page.parentElement.clientWidth),1)   'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        	nNewRatio = round(nSVWindowRatio / nFpRatio,1)                                                'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        	if window.external.AppWindow.width <= 500 and nSVWindowRatio >= 2.5 then                      '500px is max facplate width supported
            		Page.style.pixelHeight = clng((Page.style.pixelHeight * nNewRatio))
        	end if
    	end if
	' 
	'*******************************************************************************************************************

	GrpLowerPanel.style.top = ""
	GrpLowerPanel.style.bottom = "2px"

	grpPanelBackground.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2
	grpPanelBackground.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	grpPanelBackground.style.pixelHeight = Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10

	GrpCenterPanel.style.top = ""
	if (Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10) > 153 then
		GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	else
		GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 2) & "px"
	end if

	call UpdateCenterPanelLayout

end sub

Sub Update_Diginout
    
    'window.external.parentdocument.parentwindow.external.logmessage "***Update_DIGINOUT - TOP"
    
    'Following sub will only be called once after the faceplate is invoked.
    If Initialized = False Then
        Initialized = True
        sNameStr = alphaTagName.Value
    End If
    
    'window.external.parentdocument.parentwindow.external.logmessage "***Update-DIGINOUT - calling CommonAlarm..."
    Call CommonAlarm
    'window.external.parentdocument.parentwindow.external.logmessage "***Update-DIGINOUT - calling CommonStateWithoutStsmsg..."
    Call CommonStateWithoutStsmsg
    Call CommonRedTag
    Call CommonModeOffNormalCheck
    Call CommonModattrOffNormalCheck
    'window.external.parentdocument.parentwindow.external.logmessage "***Update-DIGINOUT - calling DiginoutLED..."

sub Moment_Latch(strCmd)

	if bDigitalOutputPoint=True then

		if UCase(strCmd) = "RAISE" or UCase(strCmd) = "OKB RAISE" or UCase(strCmd) = "OKB RAISE REPEATED" then
			window.external.parentdocument.parentwindow.external.logmessage "Ramp RAISE key pressed/held..."
			if not bCurrentlyRamping then  'before ramping, make sure the move is legal (can't RAISE from State2)
				if combo_OP.value = sd.DataValue("CurrentPoint.State2") then  'bail if un-ramped value is already 'raised'
					window.external.parentdocument.parentwindow.external.logmessage "RAISE key but already at State2 - aborting raise command!"
					exit sub
				end if
			end if
           	bMomentaryPressed = true 
			bCurrentlyRamping = true  ' used to keep logic to track OP ramping once started, even if OP no longer selected
			window.clearInterval(iTimerID3)
			iTimerID3 = window.setInterval("TimerFunction3", 3000)  'if not reset here within 3 secs, then sunset ramping mode

			sRampedOPValue = sd.DataValue("CurrentPoint.State2")  ' ramping UP to State2
			' the OP's return value may not be State1 !!    OP 'at rest' may be "NONE"
			'sDelayedWriteReleaseValue = sd.DataValue("CurrentPoint.State1")
			if sDelayedWriteReleaseValue = "" then 
				sDelayedWriteReleaseValue = combo_OP.value
				window.external.parentdocument.parentwindow.external.logmessage "Initializing ramp-return to " & sDelayedWriteReleaseValue
			end if
			window.external.parentdocument.parentwindow.external.logmessage "RAISE to (" & sd.DataValue("CurrentPoint.State2") & ")"
			window.external.parentdocument.parentwindow.external.logmessage " .... RETURN OP value is: " & sDelayedWriteReleaseValue
           	if iTimerID = 0 then
               	iTimerID = window.setInterval("TimerFunction",1000)
				bMomentaryTimerActive = true
           	end if
		elseif UCase(strCmd) = "RAISE RELEASE" or UCase(strCmd) = "OKB RAISE RELEASE" then
			'TODO - determine if OK scenario when PNTBOXTY = AMC
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: (diginout) Raise release"
			bCurrentlyRamping = false  ' release means we're done
			window.clearInterval(iTimerID3)    'exiting ramping here explicitly, no need for timer-based sunsetting
			iTimerID3 = 0
        	if iTimerID2 = 0 then
				window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: (diginout) Raise release; setting TimerFunction2 to write " & sDelayedWriteReleaseValue
    	        iTimerID2 = window.setInterval("TimerFunction2",1300)  '' 1300 vs 1000 to give time for raise to have completed
	    	end if

		elseif UCase(strCmd) = "LOWER" or UCase(strCmd) = "OKB LOWER" or UCase(strCmd) = "OKB LOWER REPEATED" then
			window.external.parentdocument.parentwindow.external.logmessage "Ramp LOWER key pressed/held..."
			if not bCurrentlyRamping then  'before ramping, make sure the move is legal (can't LOWER from State1)
				if combo_OP.value = sd.DataValue("CurrentPoint.State1") then  'bail if un-ramped value is already 'raised'
					window.external.parentdocument.parentwindow.external.logmessage "LOWER key but already at State1 - aborting lower command!"
					exit sub
				end if
			end if

			bMomentaryPressed = True
			bCurrentlyRamping = true  ' used to keep logic to track OP ramping once started, even if OP no longer selected
			window.clearInterval(iTimerID3)
			iTimerID3 = window.setInterval("TimerFunction3", 3000)  'if not reset here within 3 secs, then sunset ramping mode

			sRampedOPValue = sd.DataValue("CurrentPoint.State1")  'ramping DOWN to State1
			' the OP's return value may not be State2 !!    OP 'at rest' may be "NONE"
			'sDelayedWriteReleaseValue = sd.DataValue("CurrentPoint.State2")
			if sDelayedWriteReleaseValue = "" then 
				sDelayedWriteReleaseValue = combo_OP.value
				window.external.parentdocument.parentwindow.external.logmessage "Initializing ramp-return to " & sDelayedWriteReleaseValue
			end if
			window.external.parentdocument.parentwindow.external.logmessage "LOWER to (" & sd.DataValue("CurrentPoint.State1") & ")"
			window.external.parentdocument.parentwindow.external.logmessage " .... RETURN OP value is: " & sDelayedWriteReleaseValue
 
            if iTimerID = 0 then
        		iTimerID = window.setInterval("TimerFunction",1000)
				bMomentaryTimerActive = true
            end if

		elseif UCase(strCmd) = "LOWER RELEASE" or UCase(strCmd) = "OKB LOWER RELEASE" then

			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: (diginout) Lower release" ', writing value '2' to OP"
' *WHY was this here?? >>>>		nDelayedWriteReleaseValue = 2  ' TODO: is this correct even if PNTBOXTY = "AMC" ?
			bCurrentlyRamping = false  ' release means we're done
			window.clearInterval(iTimerID3)    'exiting ramping here explicitly, no need for timer-based sunsetting
			iTimerID3 = 0

        	if iTimerID2 = 0 then
				window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: (diginout) Lower release; setting TimerFunction2 to write " & sDelayedWriteReleaseValue 'cstr(iDigitalOPValue)
    	        iTimerID2 = window.setInterval("TimerFunction2",1300)  ' 1300 vs 1000 to give time for lower to have completed
	    	end if
		end if
	end if

end sub


sub TimerFunction
	if bMomentaryPressed = true then
		window.external.parentdocument.parentwindow.external.logmessage "Ramping.. digital value = " & iDigitalOPValue
		combo_OP.hostpopulation = true
		combo_OP.value = sRampedOPValue
		bMomentaryPressed = false  ' will be immediately reset if key is being held
		bMomentaryTimerActive = true
	else
		window.clearInterval(iTimerID)
		bMomentaryTimerActive = false
		window.external.parentdocument.parentwindow.external.logmessage "Stopped ramping timer.."
		iTimerID = 0
	end if
end sub

sub TimerFunction2 
' This delayed function delays the write of the return value long enough to enable a previous
' raise/lower to be completed; particularly important for scenario in which a single ramp/lower click
' is pressed on an IKB that has instant release-response

	' do not write while bMomentaryActive flag is true; wait for ramps to complete first
	window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: (diginout) TimerFunction2:release - momentary active: " & cstr(bMomentaryTimerActive)

	if not bMomentaryTimerActive then   'if active, we've yet to complete a delayed write, so wait

		if sDelayedWriteReleaseValue > "" then 
			combo_OP.value = sDelayedWriteReleaseValue
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: delayed release RTN value written: " & sDelayedWriteReleaseValue
		else
			window.external.parentdocument.parentwindow.external.logmessage "MOMENTARY: delayed release RTN value NOT set (0) - no RTN written"	
		end if
		bMomentaryPressed = false
		bMomentaryTimerActive = true
		iDigitalOPValue = 0
		sDelayedWriteReleaseValue = ""
		window.clearInterval(iTimerID2)
		iTimerID2 = 0
	end if
	'else let this timer return to test again

end sub


sub TimerFunction3   
'   in case of lost 'release' after ramping begun, provide mechanism to sunset the bCurrentlyRamping flag
	if bCurrentlyRamping = true then
		window.external.parentdocument.parentwindow.external.logmessage "Ramping.. sunsetting currently-ramping mode"
		bCurrentlyRamping = false
		if sDelayedWriteReleaseValue > "" then 
			combo_OP.value = sDelayedWriteReleaseValue
			window.external.parentdocument.parentwindow.external.logmessage "...sunsetting ramp mode=RTN value written: " & sDelayedWriteReleaseValue
		else
			window.external.parentdocument.parentwindow.external.logmessage "...sunsetting ramp mode but no release value to write"	
		end if
		sDelayedWriteReleaseValue = ""
	end if
	window.clearInterval(iTimerID3)
	iTimerID3 = 0
end sub</SCRIPT>

Sub CommonAlarm

    Dim state_PNTSTATE
    ' point state indicator
    If sd.QualityGood("CurrentPoint.PNTSTATE") And UCase(sd.DataValue("CurrentPoint.PNTSTATE")) <> "OK" Then
        state_PNTSTATE = Left(sd.DataValue("CurrentPoint.PNTSTATE"), 1)
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - PNTSTATE=" & state_PNTSTATE
    Else
        state_PNTSTATE = ""
    End If
    
    '   Replace HIGHAL with ALENBST if inhibited
    If UCase(sd.DataValue("CurrentPoint.ALENBST")) <> "INHIBIT" Then
        If UCase(sd.DataValue("CurrentPoint.HIGHAL")) = "NOALARM" Or Not sd.QualityGood("CurrentPoint.HIGHAL") Then
            If state_PNTSTATE <> "" Then
                state_alarmState.Value = state_PNTSTATE
                If bToolTips = True Then
                    state_alarmState.Title = "PNTSTATE= " & sd.DataValue("CurrentPoint.PNTSTATE")
                End If
                state_alarmState.Style.visibility = "Visible"
            Else
                state_alarmState.Style.visibility = "Hidden"
            End If  ' state_PNTSTATE
           'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - NOALARM (or not config)"
        Else
           'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - in alarm: " & sd.DataValue("CurrentPoint.HIGHAL")
            state_alarmState.Style.visibility = "Visible"
            state_alarmState.Value = sd.DataValue("CurrentPoint.HIGHAL")
            If state_PNTSTATE <> "" Then
                state_alarmState.Value = state_alarmState.Value & " " & state_PNTSTATE
                If bToolTips = True Then
                    state_alarmState.Title = "HIGHAL= " & sd.DataValue("CurrentPoint.HIGHAL") & ", PNTSTATE= " & sd.DataValue("CurrentPoint.PNTSTATE")
                End If
            Else
                If bToolTips = True Then
                    state_alarmState.Title = "HIGHAL= " & sd.DataValue("CurrentPoint.HIGHAL")
                End If
            End If  ' state_PNTSTATE
        End If  ' state_HIGHAL
    Else
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - INHIBIT"
        state_alarmState.Style.visibility = "Visible"
        state_alarmState.Value = sd.DataValue("CurrentPoint.ALENBST")
        If state_PNTSTATE <> "" Then
            If bToolTips = True Then
                state_alarmState.Title = "ALENBST= INHIBIT, PNTSTATE=" & sd.DataValue("CurrentPoint.PNTSTATE")
            End If
            state_alarmState.Value = state_alarmState.Value & " " & state_PNTSTATE
        Else
            If bToolTips = True Then
                state_alarmState.Title = "ALENBST= INHIBIT"
            End If
       End If  'state_PNTSTATE
    End If  ' state_ALENBST


'   Show "DISABLED" in case below
    If UCase(sd.DataValue("CurrentPoint.ALENBST")) = "DISABLE" Then
        textAlarmDisabled.Style.visibility = "Visible"
	'window.external.parentdocument.parentwindow.external.logmessage  "CommonAlarm - DISABLED"

        textAlarmDisabled.Style.visibility = "Hidden"
    End If
End Sub

Sub AnalogPVStatus
'
'   See Faceplate ocx for comment-matrix as to behavior here

    Dim bExOK

    If sd.QualityGood("CurrentPoint.PVEXHIFL") And Not sd.IsNan("CurrentPoint.PVEXHIFL") And sd.QualityGood("CurrentPoint.PVEXLOFL") And Not sd.IsNan("CurrentPoint.PVEXLOFL") Then
        bExOK = True
    Else
        bExOK = False
    End If

'   PV may be "not configured" in which case we hide the PV Status shape
    If UCase(sd.DataValue("CurrentPoint.PVSTS")) = "NORMAL" Or sd.QualityConfigError("CurrentPoint.PV") Then
		if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
			window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
			shpPvstatus.Value = 15 'Path status input error (alone)
			shpPvstatus.Style.visibility = "Visible"
		else
	        shpPvstatus.Value = 1  '1st is invisible
    	    shpPvstatus.Style.visibility = "Hidden"
	        'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - Normal (or not configured)"
		end if
    ElseIf UCase(sd.DataValue("CurrentPoint.PVSTS")) = "BAD" Then
        If bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'B'"
            shpPvstatus.Value = 2   ' red "B"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And (Not sd.DataValue("CurrentPoint.PVEXLOFL") <> 0) Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'H'"
            shpPvstatus.Value = 3   ' red "H"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf bExOK And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 And (Not sd.DataValue("CurrentPoint.PVEXHIFL") <> 0) Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'L'"
            shpPvstatus.Value = 4   ' red "L"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "MAN" Then
            'both EX..FL params must be 'off' ...look at PVSOURCE
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - M'"
            shpPvstatus.Value = 5   ' red "M"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "SUB" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'S'"
            shpPvstatus.Value = 6   ' red "S"
            shpPvstatus.Style.visibility = "Visible"
        ElseIf UCase(sd.DataValue("CurrentPoint.PVSOURCE")) = "BAD" Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'B'(2)"
            shpPvstatus.Value = 13   ' red "B"
            shpPvstatus.Style.visibility = "Visible"
        Else
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'B'(3)"
            shpPvstatus.Value = 2   ' just make it bad - red "B"
            shpPvstatus.Style.visibility = "Visible"
        End If

		'for all of the above cases, if the path status is also bad, then adding "14" will update the tooltip accordingly in the shape sequence
		'if $PATHSTS (new EHB parameter) indicates INERR or INOUTERR, then show
		if UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INERR" or UCase(sd.DataValue("CurrentPoint.$PATHSTS")) = "INOUTERR" then
			window.external.parentdocument.parentwindow.external.logmessage "PV has path issue ($PATHSTS)"
			shpPvstatus.Value = shpPvstatus.value + 14  'include *Path Status Error* in tooltip ALONG WITH above status 
		end if

    ElseIf UCase(sd.DataValue("CurrentPoint.PVSTS")) = "UNCERTN" Then
        If bExOK And sd.DataValue("CurrentPoint.PVEXHIFL") <> 0 And sd.DataValue("CurrentPoint.PVEXLOFL") <> 0 Then
            'window.external.parentdocument.parentwindow.external.logmessage  "AnalogPVStatus - 'U'"

Function RaiseLowerConfirm()

	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID) 'clear old/other timers
  	intRaiseLowerTimerID = window.setInterval ("CheckRaiseLowerResponse()", 500)

End Function

sub CancelRaiseLowerConfirmation

	'generic routine to clean up and bail out of confirmation of raise/lower OP/MODE/MODATTR
	window.external.parentdocument.parentwindow.external.CancelResponse
	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID)
	sCurrentShownRaiseLowerValue = ""
	sElementRaiseLower = ""
	sConfirmRaiseLowerMsg = ""
end sub

Function OnDeactivateCancelRamp2

	window.clearInterval(intCancelRampOnPageDeactivateID)
	call CancelRaiseLowerConfirmation

end function


sub CheckRaiseLowerResponse

	dim sResponse
	dim iStatus
	dim ptPromptType 
	dim sMsgZoneText
	ptPromptType = 1

	nConfirmCount = nConfirmCount + 1

	sMsgZoneText = window.external.parentdocument.parentwindow.external.MessageZoneText 

'	sConfirmRaiseLowerMsg = "<" & nConfirmCount & "> " & "Change state of TPS:" & text_NAME.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	sConfirmRaiseLowerMsg = "Change state of TPS:" & alphaTagName.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	iStatus = window.external.parentdocument.parentwindow.external.GetResponse3 (sConfirmRaiseLowerMsg, ptPromptType, sResponse)

	'window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: status returned= " & iStatus

	if iStatus = 0 and nConfirmCount > 1 then

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: - action cancelled by user" 
		call CancelRaiseLowerConfirmation
		exit sub
	elseif iStatus = 1 then
		if sResponse = "" then
			'no response yet... let timer fire again shortly
		else
			'recieved response, process it and we're DONE
			if UCase(sResponse) = "Y" then

				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: setting: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				if UCase(sElementRaiseLower) = "MODE" then
					combo_MD.hostpopulation = true
'					page.AutoSelectOnNextModeChange = true
					Call SetAutoSelect
					combo_MD.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODE"), 1
					end if
					combo_MD.focus
				elseif UCase(sElementRaiseLower) = "MODATTR" then
					combo_MDATTR.hostpopulation = true
					combo_MDATTR.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODATTR"), 1
					end if
					combo_MDATTR.focus
				end if
			end if

			call CancelRaiseLowerConfirmation

		end if
	end if

	if nConfirmCount > 2 and (sMsgZoneText = "" or (sConfirmRaiseLowerMsg <> sMsgZoneText)) then		
		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: message text changed operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if

	'expire after Experion's "operator timeout" - e.g. 60 seconds (x2 as timer is .5 secs)
	if nConfirmCount > oper_timeout.value * 2 then 

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: nConfirmCount > Experion operator timeout: " & oper_timeout.value & "; operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if


end sub

<SCRIPT id=44E2F4AF-016E-4438-83E1-2015B17A2118 language=JScript defer 
shaperefcount="1">var centerPanelCurrentPage = 1;
centerPanelCurrentDot = 1;
var centerPanelMaxPage = 5;
var centerPanelMaxPageConfigured = 5;
var oShape
var ColorTheme = 'Light';
var colorTheme = 1;
var bshow2ndPage = true;
var bshow3rdPage = true;
var bshow4thPage = true;
var PageContentBaseId = 'CenterPanelPage';

function calculateActualDots()
{

	//Calculate actual dots as per the boolean configured like show2ndPage, show3rdPage
	if (bshow2ndPage != true && centerPanelMaxPageConfigured >= 2)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}
	if (bshow3rdPage != true && centerPanelMaxPageConfigured >= 3)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}
	if (bshow4thPage != true && centerPanelMaxPageConfigured >= 4)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}

	//Once Actual dots calculated initialize the Navigation button with dots
	initializeNavButton()
}

function initializeNavButton()
{

	//Default hide all and show only dots which are applicable
	oShape.objects("btn" + ColorTheme + 'Closed').style.visibility = "inherit";

	switch (centerPanelMaxPage)
	{
		case 2:
			oShape.objects("dotSelected" + ColorTheme + 21).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 22).style.visibility = "inherit";
			break;
		case 3:
			oShape.objects("dotSelected" + ColorTheme + 31).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 32).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 33).style.visibility = "inherit";
			break;
		case 4:
			oShape.objects("dotSelected" + ColorTheme + 41).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 42).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 43).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 44).style.visibility = "inherit";
			break;
		case 5:
			oShape.objects("dotSelected" + ColorTheme + 51).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 52).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 53).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 54).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 55).style.visibility = "inherit";
			break;
		default:
			oShape.style.visibility = 'hidden';
	}
}

function PanelNavigation()
{

	// centerPanelCurrentDot to handle current dots to be selected.
	// centerPanelCurrentPage page to handle current Page to be shwon

	//Hide all
	centerPanelCurrentPage = centerPanelCurrentPage + 1;
	centerPanelCurrentDot = centerPanelCurrentDot + 1;


	//skipping current page based on the boolean configured like show2ndPage, show3rdPage and show4thPage
	if (bshow2ndPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 2)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;

	}
	if (bshow3rdPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 3)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;

	}
	if (bshow4thPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 4)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;
	}
	//Resetting the centerPanelCurrentPage to default in case centerPanelCurrentPage crossed the limit as per the boolean configured like show2ndPage, show3rdPage and show4thPage
	if (bshow2ndPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 2)
	{
		centerPanelCurrentPage = 1
	}
	if (bshow3rdPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 3)
	{
		centerPanelCurrentPage = 1
	}
	if (bshow4thPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 4)
	{
		centerPanelCurrentPage = 1
	}

	//Applying the style to the button as per the Closed and Open Status, If the selected dots is other than 1 then its open button.
	if (centerPanelCurrentDot == 1)
	{
		oShape.objects("btn" + ColorTheme + 'Closed').style.visibility = "inherit";
	}
	else
	{
		oShape.objects("btn" + ColorTheme + 'Open').style.visibility = "inherit";
	}
	//Applying the style to the dots as per selected/unselected dots.
	for (var i = 1; i <= centerPanelMaxPage; i++)
	{
		if (i == centerPanelCurrentDot)
		{
			oShape.objects("dotSelected" + ColorTheme + centerPanelMaxPage + i).style.visibility = "inherit";
		}
		else
		{
			oShape.objects("dotUnselected" + ColorTheme + centerPanelMaxPage + i).style.visibility = "inherit";
		}
	}
	// Showing only the applicable page as per the selected dots
	for (obj in oShape.parentElement.children)
	{
		if (obj.toUpperCase().indexOf(PageContentBaseId) !== -1)
		{
			if (obj.slice(-1) == centerPanelCurrentPage)
			{
				document.getElementById(obj).style.display = "block"
				document.getElementById(obj).style.visibility = "Inherit";
			}
			else
			{
				document.getElementById(obj).style.display = "None"
				document.getElementById(obj).style.visibility = "Hidden";
			}
		}
	}
	// Resetting the centerPanelCurrentPage in case it ha crossed the max of configured page
	if (centerPanelCurrentPage >= centerPanelMaxPageConfigured)
	{
		centerPanelCurrentPage = 0;
	}
	// Resetting the dots in case it ha crossed the max of configured page
	if (centerPanelCurrentDot >= centerPanelMaxPage)
	{
		centerPanelCurrentDot = 0;
	}
}</SCRIPT>
