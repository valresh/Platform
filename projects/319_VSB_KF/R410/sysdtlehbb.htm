<SCRIPT language=VBScript defer>Sub Groupvisibility()
Dim i
For i = 1 to 21
	if not sd.QualityBad ("CurrentPoint.BOXTYPE[{%INDEX"&i&"%}]") then
	document.getElementById("Grp"&i).style.visibility = "Visible"
	else
	document.getElementById("Grp"&i).style.visibility = "Hidden"
end if
Next

End Sub</SCRIPT>

<SCRIPT language=VBScript for=pb2 defer event=onclick>Dim i
For i = 1 to 21
	Displaydatarepository.PutValue CStr("INDEX"&i), i+21
	document.getElementById ("txtnum"&i).value = i+21
Next



Call Groupvisibility()


pb1.disabled = false
pb2.disabled = true
pb3.disabled = false</SCRIPT>
