<SCRIPT language=VBScript for=SaveDateNum defer event=onupdate>if me.value= 0 Then
	SaveDate.style.visibility = "hidden"
	SaveTime.style.visibility = "hidden"
Else
	SaveDate.style.visibility = "visible"
	SaveTime.style.visibility = "visible"
End if</SCRIPT>
<SCRIPT language=VBScript for=pbSave defer event=onclick>If len(cstr(MessagePadText.value)) > MaxCharacters Then
	ntimer=window.setInterval("ShowTooLongMsg",100)
Else
	For pNum = 1 To numTextParts
		Page.children.Item("txtStoredTextPart"&pNum).value = mid(cstr(MessagePadText.value),(1+(pNum -1)*250),250)
	Next
	SaveTimeNum.value = SystemTime.value
	SaveDatenum.value= SystemDate.value
End If</SCRIPT>
<SCRIPT language=VBScript for=pbClear defer event=onclick>For pNum = 1 To numTextParts
	Page.children.Item("txtStoredTextPart"&pNum).value = ""
Next
MessagePadText.value = ""
SaveTimeNum.value = SystemTime.value
SaveDatenum.value= SystemDate.value</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onpagecomplete>For pNum = 1 To numTextParts
	MessagePadText.value = MessagePadText.value + Page.children.Item("txtStoredTextPart"&pNum).value
Next</SCRIPT>
<SCRIPT language=VBScript defer>dim ntimer
const MaxCharacters = 5000
const numTextParts = 20
sub ShowTooLongMsg
	window.external.TemporaryMessageZoneText = TooLongMsg.value
	window.clearInterval(ntimer)
end sub</SCRIPT>
