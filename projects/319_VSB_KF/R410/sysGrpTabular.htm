sub GetNextPosition (key)
dim flag
	if key = 37 or key = 40 then
		activeFP = activeFP -1
		if activeFP <= 0 then 
		  activeFP = 8
		end if
		 while FPPosition(activeFP) = 0 and flag <16
		  	activeFP = activeFP - 1
			if activeFP <= 0 then 
				activeFP = 8
				flag = flag + 1
			end if
	     wend
		flag = 0
	elseif key = 38 or key = 39 then
		 activeFP = activeFP +1
		 if activeFP >=9 then 
			activeFP = 1
		 end if
		 while FPPosition(activeFP) = 0 and flag <16
		  	activeFP = activeFP + 1
			if activeFP >=9 then 
				activeFP = 1
				flag = flag + 1
			end if
  	     wend
		flag = 0
	end if
if key=37 or key=38 or key=39 or key=40 then 
document.getelementbyid("hscgroupfaceplate"&activeFP).children.item(0).contentwindow.page.focus
document.getelementbyid("hscgroupfaceplate"&activeFP).children.item(0).contentwindow.page.click
end if
end sub

function GetPointNameFromURL(location,searchString)
dim position
dim pointEnd
dim pointName
position = instr(location,searchString)
if position > 0 then
	pointEnd = instr(position,location,"%")
	pointName = mid(location,position+len(searchString)+1,pointEnd-position-(len(searchString)+1))
	GetPointNameFromURL = pointName
end if
end function</SCRIPT>
