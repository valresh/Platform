<SCRIPT language=JScript defer>var maxLimit = 16
var counter = 0;
var IOModuleIndexList = [];
var IOModuleCount = 0;
var IOMScrollBarPosition = 0;
var CurrentIOMindex = 0;
function List_Configured_IOM()
{
	// lets find out which IOM is configured.
	for( var i =0; i<=30; i++ )
	{
		var IOMindex = ('00' + i).slice(-2);
    	if ( sd.QualityGood("Currentpoint.ExpIOBoard"+ IOMindex +"Model") && sd.DataValue("Currentpoint.ExpIOBoard"+ IOMindex +"Model") != "")
	   {
		   	if( sd.DataValue("Currentpoint.ExpIOBoard"+ IOMindex +"Address") >=0 && sd.DataValue("Currentpoint.ExpIOBoard"+ IOMindex +"Address")< 100)
		   	{
			 	IOModuleIndexList.push(IOMindex);
				IOModuleCount++;
		   	}
	   } 
 	}
	Show_Configured_IOM();
}
function Show_Configured_IOM()
{
	for( var i =0; i<=16; i++ )
	{
		var IOMindex = ('00' + i).slice(-2);
		if ((16*IOMScrollBarPosition + i) < IOModuleCount)
		{
			DisplayDataRepository.PutValue("Index"+IOMindex , IOModuleIndexList[16*IOMScrollBarPosition + i])
			document.getElementById("grpIOM" + IOMindex).style.visibility = "inherit"
		}
		else
		{
			document.getElementById("grpIOM" + IOMindex).style.visibility = "hidden"
		}
	}
	if (IOModuleCount > 16 )
	{
		scrollbar.style.visibility = "inherit";
	}
	else
	{
		scrollbar.style.visibility = "hidden";
	}
Set_Current_IOM();
}
function Set_Current_IOM()
{
		for( var i =0; i<=16; i++ )
	{
		var IOMindex = ('00' + i).slice(-2);
		document.getElementById("rectIOM" + IOMindex).style.visibility = "hidden";
		document.getElementById("alpBoardAddress" + IOMindex).textColor = "#000000";
		document.getElementById("alpIOMDescription" + IOMindex).textColor = "#000000";
		document.getElementById("alpIOMModel" + IOMindex).textColor = "#000000";
		document.getElementById("alpIOMDescription" + IOMindex).textColor = "#000000";
	}
	var IOMindex = ('00' + CurrentIOMindex).slice(-2);
	document.getElementById("rectIOM" + IOMindex).style.visibility = "inherit";
	document.getElementById("alpBoardAddress" + IOMindex).textColor = "#FFFFFF";
	document.getElementById("alpIOMDescription" + IOMindex).textColor = "#FFFFFF";
	document.getElementById("alpIOMModel" + IOMindex).textColor = "#FFFFFF";
	document.getElementById("alpIOMDescription" + IOMindex).textColor = "#FFFFFF";
	DisplayDataRepository.PutValue("ChanIndex" , IOModuleIndexList[16*IOMScrollBarPosition + CurrentIOMindex]);
}
function Hide_UnConfigured_Channel(obj)
{

	{

function Show_Channel_Status(chnStatusNum, chnMaskNum) 
{
	var chnStatus = '00000000000000000000000000000000'.split('');
	var statusBin = [];
	while (chnStatusNum > 0) 
	{
		statusBin[statusBin.length] = chnStatusNum % 2;
		chnStatus[statusBin.length -1] = chnStatusNum % 2;
		chnStatusNum >>>= 1; // basically /= 2 without remainder if any
	}
	var chnMask = '00000000000000000000000000000000'.split('');
	var maskBin = [];
	while (chnMaskNum > 0) 
	{
		maskBin[maskBin.length] = chnMaskNum % 2;
		chnMask[maskBin.length -1] = chnMaskNum % 2;
		chnMaskNum >>>= 1; // basically /= 2 without remainder if any
	}
	for ( var i = 1; i<=32; i++)
	{
		var Index = ('00' + i).slice(-2);
		if (chnMask[i-1] != 0) 
		{
			document.getElementById("shpChannelStatus" + Index).value = chnStatus[i-1] + 2;
		}
		else
		{
			document.getElementById("shpChannelStatus" + Index).value = 1;
		}
	}
}</SCRIPT>
