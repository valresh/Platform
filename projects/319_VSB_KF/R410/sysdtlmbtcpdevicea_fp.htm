<SCRIPT language=VBScript defer>Dim SingBridge, RedBridge, SingDevice, RedDevice, SingSafetyMngr, RedSafetyMngr
SingBridge = 0
RedBridge = 1
SingDevice = 2
RedDevice = 3
SingSafetyMngr = 4
RedSafetyMngr = 5
SingGenericDevice = 6
RedGenericDevice = 7

Sub ApplyLayout()
	
	on error resume next
	GrpLowerPanel.style.top = "" : GrpLowerPanel.style.bottom = "2px" 
	GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2 : GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"

End Sub</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>if sd.DataChanged("currentpoint.SIMSTATE") then
    if sd.DataValue("currentpoint.SIMSTATE") = 2 then
		'SIMSTATE is SIMFREEZE
	    txtSIM.style.visibility = "Hidden" : EnumSimulationState.style.visibility = "visible"
	elseif sd.DataValue("currentpoint.SIMSTATE") = 1 then
		'SIMSTATE is SIMRUN
		txtSIM.style.visibility = "visible" : EnumSimulationState.style.visibility = "Hidden"
	else
		txtSIM.style.visibility = "hidden" : EnumSimulationState.style.visibility = "Hidden" 
	end if
end if

if not sd.QualityBad("currentpoint.DEVTYPE") then
Select case (sd.DataValue ("CurrentPoint.DEVTYPE"))
	case SingBridge
		grpSecondaryCenter.style.visibility = "Hidden" : grpSecondaryLower.style.visibility = "Hidden" : txtDEVTYPE.value = TxtBridge.value
	case RedBridge
		txtDEVTYPE.value = txtRedundantBridge.value
	case SingDevice
		grpSecondaryCenter.style.visibility = "Hidden" : grpSecondaryLower.style.visibility = "Hidden" : txtDEVTYPE.value = TxtDevice.value
	case RedDevice
		txtDEVTYPE.value = TxtRedundantDevice.value
	case SingSafetyMngr
		grpSecondaryCenter.style.visibility = "Hidden" : grpSecondaryLower.style.visibility = "Hidden" : txtDEVTYPE.value = TxtSM.value
	case RedSafetyMngr
		txtDEVTYPE.value = txtRedundantSM.value
	case SingGenericDevice
		grpSecondaryCenter.style.visibility = "Hidden" : grpSecondaryLower.style.visibility = "Hidden" : txtDEVTYPE.value = TxtDevice.value
	case RedGenericDevice
		txtDEVTYPE.value = TxtRedundantDevice.value
End select
end if</SCRIPT>
