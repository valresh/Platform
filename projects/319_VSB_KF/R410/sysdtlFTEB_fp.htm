<SCRIPT language=VBScript defer>Sub ApplyLayout()
on error resume next
	GrpLowerPanel.style.top = "" : GrpLowerPanel.style.bottom = "2px" 
	GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2 : GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
End Sub</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>On Error Resume Next
if sd.DataChanged("currentpoint.MODISREDUN") then
   if not sd.QualityBad("currentpoint.MODISREDUN") then
     if sd.DataValue("currentpoint.MODISREDUN")=1 then
	   
       GrpRedFP.style.visibility="visible"
     else
	 	'Not Redundant
       GrpRedFP.style.visibility="hidden"
     end If
   end if
end if
if sd.DataChanged("currentpoint.DEVICEIDX") then
  if not sd.QualityBad("currentpoint.DEVICEIDX") then
    If sd.DataValue("currentpoint.DEVICEIDX")<10 Then
        AlpDevIDX.value= TxtHashZerozero.value & sd.DataValue("currentpoint.DEVICEIDX")
    ElseIf sd.DataValue("currentpoint.DEVICEIDX")>=10 And sd.DataValue("currentpoint.DEVICEIDX")<100 Then
        AlpDevIDX.value= TxtHashzero.value & sd.DataValue("currentpoint.DEVICEIDX")
    Else
        AlpDevIDX.value= TxtHash.value & sd.DataValue("currentpoint.DEVICEIDX")
    End If
  end if
end if


if sd.DataChanged("currentpoint.SECMODNAME") then
  if not sd.QualityBad("currentpoint.SECMODNAME") then
    if sd.DataValue("currentpoint.MODISREDUN")=1 then
	' configured for redundancy
      if (Trim(sd.DataValue("currentpoint.SECMODNAME"))="") then
	  ' Secondary module
        TxtPriLabel.style.visibility="hidden": TxtSecLabel.style.visibility="visible"
			' When this module is secondary and the release is LS, hide the lower panel LEDs
			if isnumeric( ServerTypeRaw.value) then
				if ServerTypeRaw.value = 9 then
					grpFTE_LEDs.style.visibility = "hidden"
				end if
			end if	
      else
        TxtPriLabel.style.visibility="visible": TxtSecLabel.style.visibility="hidden"
     end if
    else
     TxtPriLabel.style.visibility="hidden": TxtSecLabel.style.visibility="hidden"
  end if
 end if
end if</SCRIPT>

<SCRIPT id=0D03BDD1-EAF6-4D7D-9870-2976FE87250F language=vbscript defer 
shaperefcount="4">Sub InstallCodebase()
	urlbase	 = location.protocol & "//" & location.host
	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
	install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
	redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub
</SCRIPT>
