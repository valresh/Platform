<SCRIPT language=VBScript for=shpLED010_shpBRYG_LED defer event=ondatachange>DIM sText, sPt, sDataPath, fFlag, sValue
	on error resume next

	sText = shpLED010_grpBRYG_LED.parentElement.GetCustomProperty("Parameter", "StatusPath")
	sPt = shpLED010_grpBRYG_LED.parentElement.GetCustomProperty("Point", "SpsLEDPoint")
	sDataPath = sPt & "." & sText
	if sText = "" then exit sub
	if sPt = "" then exit sub
	Err.Clear
	fFlag = me.QualityGood(sDataPath)
	if Err.Number <> 0 then
		'MsgBox "exception testing data quality"
		me.value = 1				' black
	elseif fFlag then
		Err.Clear
		fFlag = me.DataChanged(sDataPath)
		if Err.Number <> 0 then
			'MsgBox "exception testing data changed"
			me.value = 1			' black
		elseif fFlag then
			Err.Clear
			sValue = me.DataValue(sDataPath)
			if Err.Number <> 0 then
				'MsgBox "exception getting data value"
				me.value = 1		' black
			else
				' MsgBox "actually got a data value"
				me.value = sValue + 1
			end if
		end if
	else
		'MsgBox "data quality NOT good"
		me.value = 1				' black
	end if</SCRIPT>

<SCRIPT language=VBScript for=alphaComponentCount defer event=onupdate>'
' Sub alphaComponentCount_onupdate
	if IsStsGoodQuality(me) then
		textDataUnavailable.style.visibility = "Hidden"
		if me.value = "0" then
			textNoComponents.style.visibility = "Inherit"
			grpCompTitles.style.visibility = "Hidden"
			grpLEDs.style.visibility = "Hidden"
		else
			textNoComponents.style.visibility = "Hidden"
			grpCompTitles.style.visibility = "Inherit"
			grpLEDs.style.visibility = "Inherit"
		end if
	else
		textDataUnavailable.style.visibility = "Inherit"
		textNoComponents.style.visibility = "Hidden"
		grpCompTitles.style.visibility = "Hidden"
		grpLEDs.style.visibility = "Hidden"
	end if
' End Sub alphaComponentCount_onupdate
'</SCRIPT>

<SCRIPT language=VBScript defer>'
' General Section (sysdtlcomputera_fp.htm)
option explicit
Dim nNameTop, nLEDTop, nItemSep, sSortInit

sub ApplyLayout()
	on error resume next
	grpLowerPanel.style.top = ""
	grpLowerPanel.style.bottom = "2px" ' "15px"
	PicBackground.style.pixelWidth = Page.style.pixelWidth + 3
	PicBackground.style.pixelHeight = Page.style.pixelHeight + 10
'	grpCenterPanel.style.top= (grpUpperPanel.style.pixelHeight + 15) & "px"
	grpCenterPanel.style.top= grpUpperPanel.style.pixelTop + grpUpperPanel.style.pixelHeight+ 2
'	grpCenterPanel.style.bottom = ""
	grpCenterPanel.style.bottom = (grpLowerPanel.style.pixelHeight + 15) & "px"
	' Comment out the following line if you don’t want the center panel to be stretched (e.g. on sysdtlsta)
'	grpCenterPanel.style.pixelHeight = Page.style.pixelHeight - grpLowerPanel.style.pixelHeight - grpUpperPanel.style.pixelHeight - 20
end sub

sub UpdateComponentName(objMe)
Dim nIx, sPoint, sPath, sName, sStyle, objLed, objName
	nIx = CInt(Right(objMe.id, 2))
	set objLed = grpLEDs.children(nIx)
	set objName = grpCompTitles.children(nIx)
	if IsStsGoodQuality(objMe) then
		sName = objMe.value
		sPath = "[ROOT\HONEYWELL].TPS_HCICOMPONENT.NAME='" & sName & "'.Status"
		sPoint = alphaPointName.value
		sStyle = "Inherit"
	else
		sName = ""
		sPath = ""
		sPoint = ""
		sStyle = "Hidden"
	end if
	objName.value = sName
	objLed.style.visibility = sStyle
	objName.style.visibility = sStyle
	if objLed.GetCustomProperty("Parameter", "StatusPath") <> sPath then
		objLed.autoReloadContent = false
		objLed.SetCustomProperty "Parameter", "StatusPath", sPath
		objLed.SetCustomProperty "Point", "SpsLEDPoint", sPoint
		objLed.ReloadContent
		SortComponents
	end if
end sub

'
' sort the items now
sub SortComponents
Dim nCnt, nIx, nIx2, nSort(20), nTemp, nSwapCount

	if sSortInit <> "qwerty" then
		sSortInit = "qwerty"
		nNameTop = grpCompTitles.children(0).style.pixelTop
		nItemSep = grpCompTitles.children(1).style.pixelTop - nNameTop
		nLEDTop = grpLEDs.children(0).style.pixelTop
	end if
	nCnt = 0
	for nIx = 0 to grpCompTitles.children.length - 1
		if grpCompTitles.children(nIx).style.visibility = "inherit" then
			nSort(nCnt) = nIx
			nCnt = nCnt + 1
		end if
	next
	if nCnt = 0 then exit sub
	if nCnt = 1 then
		grpCompTitles.children(nSort(0)).style.pixelTop = nNameTop
		grpLEDs.children(nSort(0)).style.pixelTop = nLEDTop
	else
		' first sort indexes in array ...
		nSwapCount = 0
		for nIx = 0 to nCnt - 2
			for nIx2 = nIx + 1 to nCnt - 1
				if grpCompTitles.children(nSort(nIx)).value > grpCompTitles.children(nSort(nIx2)).value then
					nTemp = nSort(nIx)
					nSort(nIx) = nSort(nIx2)
					nSort(nIx2) = nTemp
					nSwapCount = nSwapCount + 1
				end if
			next
		next
		' ... now walk array placing items on screen
		for nIx = 0 to nCnt - 1
			grpCompTitles.children(nSort(nIx)).style.pixelTop = nNameTop + (nIx * nItemSep)
			grpLEDs.children(nSort(nIx)).style.pixelTop = nLEDTop + (nIx * nItemSep)
		next
	end if
end sub

' IsStsGoodQuality() - Function to determine whether a data bound object has good quality
function IsStsGoodQuality(objMe)
	if not objMe is nothing and IsObject(objMe) then
		if (objMe.quality and 192) = 192 then
			IsStsGoodQuality = TRUE
		else
			IsStsGoodQuality = FALSE
		end if
	else
		IsStsGoodQuality = FALSE
	end if
end function

<SCRIPT language=JScript defer>function UpdateMaintenanceToggle()
{
	if (alphaMaintenanceMode.QualityConfigError("CurrentPoint.SYSSUPMD"))
	{
		GrpMaintenanceState.style.visibility = "hidden"
	}
	else if (!isNaN(alphaMaintenanceMode.value))
	{
		GrpMaintenanceState.style.visibility = "inherit"
		if(alphaMaintenanceMode.value > 0)
		{
			if (window.external.SecurityLevel >= alphaMaintModeSecLvl.value)
			{
				deviceMaintenanceToggle.className = "ToggleOn"
				lblMaintenance.className = "OnStatusText"
				lblMaintenance.value = "SUPPRESSED MODE"
			}
			else
			{
				deviceMaintenanceToggle.className = "ToggleOnDisabled"
				lblMaintenance.className = "OnStatusText"
				lblMaintenance.value = "SUPPRESSED MODE"
			}
		}
		else if(alphaMaintenanceMode.value == 0)
		{
			if (window.external.SecurityLevel >= alphaMaintModeSecLvl.value)
			{
				deviceMaintenanceToggle.className = "ToggleOff"
				lblMaintenance.className = "OffStatusText"
				lblMaintenance.value = "UNSUPPRESSED"
			}
			else
			{
				deviceMaintenanceToggle.className = "ToggleOffDisabled"
				lblMaintenance.className = "OffStatusText"
				lblMaintenance.value = "UNSUPPRESSED"
			}
		}
	}
	else
	{
		GrpMaintenanceState.style.visibility = "inherit"
		deviceMaintenanceToggle.className = "ToggleUnknown"
		lblMaintenance.className = "OnStatusText"
		lblMaintenance.value = "BAD"
	}
}</SCRIPT>
