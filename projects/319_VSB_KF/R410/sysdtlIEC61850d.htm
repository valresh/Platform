<SCRIPT language=JScript for=sd defer event=onupdate>if (this.DataChanged("CurrentPoint.DataAttributeList"))
{
  DataAttributeList = [];
  DataQualityList = [];
  DataTimeStampList = [];
  DataTypeList = [];
  if (this.QualityGood("CurrentPoint.DataAttributeList"))
  {
    if ((this.DataValue("CurrentPoint.DataAttributeList") != null) && (this.DataValue("CurrentPoint.DataAttributeList") != ""))
    {
      var strDataAttribute = this.DataValue("CurrentPoint.DataAttributeList").toUpperCase().split("-");
      for (var i = 0; i < strDataAttribute.length; i++)
      {
        var strData = strDataAttribute[i];
        if (strData.indexOf("$A") > 0)
        {
          DataTypeList.push("A");
          strData = strData.replace("$A", "");
          if (strData.indexOf("#") > 0)
          {
            var strQuality = strData.split("#")
            DataQualityList.push(strQuality[0] + "Q");
            DataTimeStampList.push(strQuality[0] + "T");
            strData = strData.replace("#", "");
            DataAttributeList.push(strData);
          }
          else
          {
            DataQualityList.push("Q");
            DataTimeStampList.push("T");
            DataAttributeList.push(strData);
          }
        }
        else if (strData.indexOf("$D") > 0)
        {
          DataTypeList.push("D");
          strData = strData.replace("$D", "")
          if (strData.indexOf("#") > 0)
          {
            var strQuality = strData.split("#")
            DataQualityList.push(strQuality[0] + "Q");
            DataTimeStampList.push(strQuality[0] + "T");
            strData = strData.replace("#", "")
            DataAttributeList.push(strData);
          }
          else
          {
            DataQualityList.push("Q");
            DataTimeStampList.push("T");
            DataAttributeList.push(strData);
          }
        }
      }
    }
  }
  for (var i = 0; i < DataAttributeList.length; i++)
  {
    DisplayDataRepository.PutValue(("ParamName" + (i + 1)), (DataAttributeList[i]));
    if (i >=16)
    {
      break;
    }
  }
}</SCRIPT>
