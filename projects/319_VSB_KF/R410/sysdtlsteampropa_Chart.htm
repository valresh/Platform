<SCRIPT language=JScript defer>var CanvasWidth = 800;
var CanvasHeight = 480;
var xaxisMin = 0;
var xaxisMax = 10;
var yaxisMin = 0;
var yaxisMax = 800;
//var yRatio = CanvasHeight/yMax;
//var xRatio = CanvasWidth/xMax;
var CanvasWidthInterval = 80;
var CanvasHeightInterval = 60;
var ConstantPressureDataSetNodes
var ConstantPressureDataNodes
var b_canvas;
var b_context;
var p_canvas;
var p_context;
var CanvasId;
function TranformCanvas()
{
}

function DrawGridLine()
{
var b_canvas = document.getElementById(TSChartcanvas);
var b_context = b_canvas.getContext("2d");
for (var x = 0.5; x < CanvasWidth; x += 10) 
{
  b_context.beginPath();
  b_context.moveTo(x, yaxisMin);
  b_context.lineTo(x, CanvasHeight);
  b_context.lineWidth = 0.5;
  b_context.strokeStyle = "#cccccc";
  b_context.stroke();
}
for (var y = 0.5; y < CanvasHeight; y += 10) 
{
  b_context.beginPath();
  b_context.moveTo(0, y);
  b_context.lineTo(CanvasWidth, y);
  b_context.lineWidth = 0.5;
  b_context.strokeStyle = "#cccccc";
  b_context.stroke();
}
}
function DrawAxisLine(id)
{
var b_canvas = document.getElementById("TSChartcanvas");
var b_context = b_canvas.getContext("2d");
for (var x = CanvasWidthInterval; x < CanvasWidth; x += CanvasWidthInterval) 
{
  b_context.beginPath();
  b_context.moveTo(x, 0);
  b_context.lineTo(x, CanvasHeight);
  b_context.lineWidth = 1;
  b_context.strokeStyle = "#461D7C";
  b_context.stroke();
}
for (var y = CanvasHeightInterval; y < CanvasHeight; y += CanvasHeightInterval) 
{
  b_context.beginPath();
  b_context.moveTo(0, y);
  b_context.lineTo(CanvasWidth, y);
  b_context.lineWidth = 1;
  b_context.strokeStyle = "#461D7C";
  b_context.stroke();
}
}

function readXMLData()
{
var xmlDocumentObject;
xmlDocumentObject = new ActiveXObject("Microsoft.XMLDOM")
xmlDocumentObject.load("ConstPressure.xml")
ConstantPressureDataSetNodes = xmlDocumentObject.getElementsByTagName("ConstantPressureDataSet")
ConstantPressureDataNodes = ConstantPressureDataSetNodes(0).getElementsByTagName("Data")

}
function DrawConstantPressureLine(id)
{
var b_canvas = document.getElementById("TSChartPressurecanvas");
var b_context = b_canvas.getContext("2d");
  b_context.beginPath();
for(var j = 0; j< 2; j++)
{
ConstantPressureDataNodes = ConstantPressureDataSetNodes(j).getElementsByTagName("Data")
  for(var i = 0; i< ConstantPressureDataNodes.length-2; i+=2)
  {
  b_context.moveTo(ConstantPressureDataSetNodes(j).getElementsByTagName("Data")(i).getAttribute("Entropy")*xRatio, ConstantPressureDataSetNodes(j).getElementsByTagName("Data")(i).getAttribute("Temperature")*yRatio);
  b_context.quadraticCurveTo(ConstantPressureDataSetNodes(j).getElementsByTagName("Data")(i+1).getAttribute("Entropy")*xRatio, ConstantPressureDataSetNodes(j).getElementsByTagName("Data")(i+1).getAttribute("Temperature")*yRatio,ConstantPressureDataSetNodes(j).getElementsByTagName("Data")(i+2).getAttribute("Entropy")*xRatio, ConstantPressureDataSetNodes(j).getElementsByTagName("Data")(i+2).getAttribute("Temperature")*yRatio);
  b_context.lineWidth = 0.25;
  b_context.strokeStyle = "#ff0000";
  b_context.stroke();
  }
 }

}</SCRIPT>
