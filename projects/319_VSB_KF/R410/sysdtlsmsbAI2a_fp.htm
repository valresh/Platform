<SCRIPT language=VBScript defer>strDacaBlockName = "ai"

sub BlockStatus_update(oSource)
on error resume next

	iQualityBad = 4
	sidx = right(oSource.id,1)
	set oTxtSt = Page.children("TxtSt" & sidx)
	set oLinAlmPri = Page.children("LinAlmPriTag" & sidx)
	
		if (oSource.quality and iQualityBad) = iQualityBad	then
			oTxtSt.style.visibility = "hidden"
			oLinAlmPri.style.visibility = "hidden"
		else
			oTxtSt.style.visibility = "inherit"
			oLinAlmPri.style.visibility = "inherit"
		end if	
	

end sub</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onunload>'clear MOSS/MOSR just in case when the FP is closed
	if sd.DataExists("CurrentPoint.MOSS.PV") then
		if sd.DataValue("CurrentPoint.MOSS.PV") = 1 then sd.DataValue("CurrentPoint.MOSS.PV") = 0
	end if
	if sd.DataExists("CurrentPoint.MOSR.PV") then
		if sd.DataValue("CurrentPoint.MOSR.PV") = 1 then sd.DataValue("CurrentPoint.MOSR.PV") = 0 
	end if</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onpagecomplete>on error resume next
document.title=cstr(alphaTagName.value) 
gbPageComplete = true
call PVFormatUpdate(sd,strDacaBlockName)
call SetEUDescHeight(ConAlpEUDesc_GSH)

'Init MOS command combo
strMOSS = sd.DataValue("CurrentPoint.MOSS.STATETEXT[1]")
strMOSR = sd.DataValue("CurrentPoint.MOSR.STATETEXT[1]")
CboMOS.AddString " "
CboMOS.AddString strMOSS
CboMOS.AddString strMOSR
CboMOS.selectedindex= 0</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>on error resume next
	if sd.DataChanged("CurrentPoint." & strDacaBlockName & ".pvformat") then
		call PVFormatUpdate(sd, strDacaBlockName)
	end if
	'Simulate one-shot command 
	if sd.DataChanged("CurrentPoint.MOSS.PV") then
		if sd.DataValue("CurrentPoint.MOSS.PV") = 1 then sd.DataValue("CurrentPoint.MOSS.PV") = 0 
		CboMOS.selectedindex= 0
	end if
	'Simulate one-shot command
	if sd.DataChanged("CurrentPoint.MOSR.PV") then
		if sd.DataValue("CurrentPoint.MOSR.PV") = 1 then sd.DataValue("CurrentPoint.MOSR.PV") = 0 
		CboMOS.selectedindex= 0
	end if</SCRIPT>

<SCRIPT language=VBScript for=CboMOS defer event=onchange>on error resume next
	'MOS Command order in combobox : index=0 (NONE) /index=1 (SET)/ index=2(RESET)
	if me.selectedindex = 1 then
		sd.DataValue("CurrentPoint.MOSS.PV")=1
		window.setTimeout "GrpMOS.style.visibility = ""hidden""", 500
	elseif me.selectedindex = 2 then
		sd.DataValue("CurrentPoint.MOSR.PV")=1
		window.setTimeout "GrpMOS.style.visibility = ""hidden""", 500
	end if</SCRIPT>

<SCRIPT language=VBScript for=CboMOS defer event=ondeactivate>	document.getElementById("GrpMOS").style.visibility = "hidden"</SCRIPT>
