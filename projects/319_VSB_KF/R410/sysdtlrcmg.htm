// ---------------------------------------------------------------------
// Methods for setting up the event grid support
// ---------------------------------------------------------------------

function InitRCMEvents()
{
	try
	{
		g_TDO = RCMEventsTable.Binding.DataObjects.Item(0);
	}
	catch( err )
	{
		// If we couldn't access the table data object,
		// then we must wait until the page connector is ready.
		BindingBehavior.attachEvent("onpageconnectorready", InitRCMEvents);
		return;
	}
	
	BindingBehavior.detachEvent("onpageconnectorready", InitRCMEvents);

	// Load the XML document with column setting
	var xmlDoc = new ActiveXObject("Msxml2.DOMDocument.6.0");
	xmlDoc.load("sysdtlrcmg_files\\ColumnSetting.xml");

	// set some impossible filter so that it shows nothing initially
	g_TDO.AuxFilter = "Category like '30'";

	// Calling SetState tells the TDO that it can complete its initialization
	g_TDO.SetState("", xmlDoc.xml);
}

function GetPageParam(Param)
{
	var sValue = "";				// Parse the SCM name from the URL

	if( (document.location.search != null) && (document.location.search.length > 0) )
	{
		// get rid of the leading '?', url unencode, and split at '&'
		var arrPairs = unescape( document.location.search.substr(1) ).split("&");
		var len = arrPairs.length;
	
		for( var i=0; i < len; i++ )
		{
			// split at the equals
			var arrPair = arrPairs[i].split("=");

			if( arrPair.length == 2 )
			{
				if( arrPair[0].toUpperCase() == Param.toUpperCase())
				{
					sValue = arrPair[1];
				}
			}
		}
	}
	return sValue;
}

function PerformFilter()
{
	try
	{
		//current RCM
		var strRCM = HwPropCollControl.Use("/SEQ").Value;

		//currently selected Step
		var strBlock = HwPropCollControl.Use("/Selected_Step").Value;
		
		// Query String 
		var strQuery = "( ( (Source = '" + strRCM + "') and (ConditionName like 'Start') ) or ( (Source = '" + strRCM + "') and (Description = '" + strBlock + "') and (ConditionName = 'Step Start') ) )"
		
		g_strRCM = strRCM;
		g_strBlock = strBlock;

		if(g_TDO.AuxFilter == strQuery)
		{
			g_TDO.ForceRequery(); 
		}
		else
		{
			g_TDO.AuxFilter = strQuery;

			if(g_bSetLastSevenDaysFilter == false)
			{
				HideGridContent();
				UpdateTimeFiler();
				g_bSetLastSevenDaysFilter = true;
			}
		}
	}
	catch( err )
	{
	}
}

// ---------------------------------------------------------------------
// Methods for progress indication
// ---------------------------------------------------------------------

var g_lCount = 1;
var g_timerID = null;
var PROGRESS_MAX_COUNT = 27;

function StartProgress()
{
	endTrans();
	g_lCount = 1;
	spnProgressDOT.innerText = ".";
	spnProgress.style.display = "inline";
	window.setTimeout(doTrans, 500, "JScript");
}

function StopProgress()
{
	endTrans();
	spnProgress.style.display = "none";

	//current RCM and step
	var strRCM = HwPropCollControl.Use("/SEQ").Value;
	var strBlock = HwPropCollControl.Use("/Selected_Step").Value;

	if( (g_strRCM == strRCM) && (g_strBlock == strBlock) )
	{
		ShowGridContent();
	}
}

function endTrans()
{
	if( g_timerID != null )
	{
		window.clearInterval(g_timerID);
		g_timerID = null;
	}
}

function doTrans()
{
	endTrans();

	if(spnProgress.style.display == "none")
		return;
			
	if( g_lCount == PROGRESS_MAX_COUNT )
	{
		g_lCount = 1;
		spnProgressDOT.innerText = ".";
	}

	spnProgressDOT.innerText += "."
	g_lCount++;	
	g_timerID = window.setInterval(doTrans, 1000, "JScript");
}

// --------------------------------------------------------------------------------------
// ParseZoom
//
//	Converts a zoom value returned by style.zoom into a float.
// --------------------------------------------------------------------------------------

function ParseZoom(z)
{
	var dZoom = 1.0;

	if( typeof(z) == "string" )
	{
		if( z != "normal" )
		{
			if( z.length > 0 )
			{
				if( z.charAt( z.length - 1 ) == '%' )
				{	
					dZoom = parseFloat(z) / 100.0;
				}
				else
				{
					dZoom = parseFloat(z);
				}
			}
		}
	}
	else if( typeof(z) == "number" )
	{
		dZoom = z;
	}

	if( dZoom <= 0 ) dZoom = 1.0;

	return dZoom;
}

// ----------------------------------------------------------------------------------
// Pad
//
//	Pads the string representation of the specified value with the specified character
//	if its length is less than that desired.
// ----------------------------------------------------------------------------------

function Pad(value, numChars, char, bPadLeft)
{
	var s = "" + value;
	
	while( s.length < numChars )
	{
		if( bPadLeft )
			s = char + s;
		else
			s = s + char;
	}
	
	return s;
}
// --------------------------------------------------------------------------------------
function Handle_PaneResize(pad, newposn)
{
	try
	{
		if(pad == lnHorizantal)
		{
			g_HSTop = newposn-g_Gapbtwsplitter;
			g_UpperTopRatio = parseInt((100*g_HSTop)/g_TotalHeight);
		}
		else
		{
			if(pad == lnUpperVertical)
			{
				g_UVSLeft = newposn-g_Gapbtwsplitter;
				g_LeftTopRatio = parseInt((100*g_UVSLeft)/g_TotalWidth);
			}
			else
			{
				if(pad == lnLowerVertical)
				{
					g_LRVSLeft = newposn-g_SplitterSize-3*g_Gapbtwsplitter;
					g_MiddleBottomRatio = parseInt((100*(g_LRVSLeft-g_LLVSLeft))/g_TotalWidth);
					g_LeftBottomRatio = parseInt((100*g_LLVSLeft)/g_TotalWidth);
				}
				else
				{
					if (pad == lnLeftLowerVertical)
					{
						g_LLVSLeft = newposn-g_Gapbtwsplitter;
						g_LeftBottomRatio = parseInt((100*g_LLVSLeft)/g_TotalWidth);
						g_MiddleBottomRatio = parseInt((100*(g_LRVSLeft-g_LLVSLeft))/g_TotalWidth);
					}
				}
			}
		}
		Arrange_Panels();
		Save_Panels();
	}
	catch( err )
	{
		//alert("Handle_PaneResize", err.number, err.description);
	}
}


// --------------------------------------------------------------------------------------
function Pane_OnResize()
{
	try
	{
		var zoom = ParseZoom(Page.style.zoom);
		if( PaneResizer.vertical )
		{
			var diff = (window.event.clientX - PaneResizer.startposn) / zoom;
			var newLeft = g_oCurrentPad.style.pixelLeft + diff;
			if( newLeft < PaneResizer.min )
				newLeft = PaneResizer.min;
			else if( newLeft > PaneResizer.max )
				newLeft = PaneResizer.max;		
			diff = newLeft - g_oCurrentPad.style.pixelLeft;
			PaneResizer.newposn = newLeft;
			PaneResizer.runtimeStyle.pixelLeft = PaneResizer.style.pixelLeft + diff ;
		}
		else
		{
			// Calculate the min and max height of the pane so that the last row is not partially obscured 
			var PaneMinHeight = PaneResizer.min;
			var PaneMaxHeight = PaneResizer.max;
			var diff = (window.event.clientY - PaneResizer.startposn) / zoom;		
			var newTop = g_oCurrentPad.style.pixelTop + diff;
			if( newTop < PaneMinHeight )
				newTop = PaneMinHeight;
			else if( newTop > PaneMaxHeight )
				newTop = PaneMaxHeight;
			diff = newTop - g_oCurrentPad.style.pixelTop;
			PaneResizer.newposn = newTop;
			PaneResizer.runtimeStyle.pixelTop = PaneResizer.style.pixelTop + diff;
		}
	}
	catch( err )
	{
		//alert("Pane_OnResize", err.number, err.description);
	}
}
// --------------------------------------------------------------------------------------
function Pane_OnEndResize()
{
	try
	{
		if( PaneResizer.newposn != null )
		{
			Handle_PaneResize(g_oCurrentPad, PaneResizer.newposn);
		}

		PaneResizer.releaseCapture();
	}
	catch( err )
	{
		//alert("Pane_OnEndResize", err.number, err.description);
	}
}
// --------------------------------------------------------------------------------------
function Pane_OnCancelResize()
{
	try
	{
		g_oCurrentPad = null;
		PaneResizer.runtimeStyle.left = "";
		PaneResizer.runtimeStyle.top = "";
		PaneResizer.startposn = 0;
		PaneResizer.newposn = null;
		PaneResizer.style.display = "none"
		PaneResizer.onmouseup = null;
		PaneResizer.onmousemove = null;
		PaneResizer.onlosecapture = null;
	}
	catch( err )
	{
		
		//alert("Pane_OnCancelResize", err.number, err.description);
	}
}

// --------------------------------------------------------------------------------------
// Function 	: Initial Position
// Use		: Arranging the panels as per saved positions.
// --------------------------------------------------------------------------------------
function InitialPosition_Panels()
{
	try
	{
		var strTemp;	

		HwPropCollControl.Use("/Splitter_Position[1]").Descriptor = "/Persist";
		if(HwPropCollControl.Use("/Splitter_Position[1]").Value != null) 
		{
			strTemp = HwPropCollControl.Use("/Splitter_Position[1]").Value;
		}
		else
		{
			strTemp = "1,35,35,20,25";	
		}

		lvarPanelTempSize = strTemp.split(",");
		if(lvarPanelTempSize.length == 5)
		{
			//fill the global for the positions required to arrange the panels.
			g_ShowFaceplate = parseInt(lvarPanelTempSize[0]);
			g_UpperTopRatio = parseInt(lvarPanelTempSize[1]);
			g_LeftTopRatio = parseInt(lvarPanelTempSize[2]);
			g_LeftBottomRatio = parseInt(lvarPanelTempSize[3]);
			g_MiddleBottomRatio = parseInt(lvarPanelTempSize[4]);
		}
		else
		{
			//fill the global for the positions required to arrange the panels.
			g_ShowFaceplate = 1;
			g_UpperTopRatio = 60;
			g_LeftTopRatio = 35;
			g_LeftBottomRatio = 25;
			g_MiddleBottomRatio = 30;
		}
		g_TotalHeight = parseInt(grpTableView.style.pixelHeight-g_StatusFieldHeight);
		g_TotalWidth = parseInt(grpTableView.style.pixelWidth);

		g_UVSLeft = parseInt((g_TotalWidth-g_SplitterSize-2*g_Gapbtwsplitter)*g_LeftTopRatio/100);
		g_HSTop = parseInt((g_TotalHeight-g_SplitterSize-2*g_Gapbtwsplitter)*g_UpperTopRatio/100);
		g_LLVSLeft = parseInt((g_TotalWidth-2*g_SplitterSize-2*g_Gapbtwsplitter)*g_LeftBottomRatio/100);
		g_LRVSLeft = parseInt((g_TotalWidth-2*g_SplitterSize-2*g_Gapbtwsplitter)*(g_LeftBottomRatio+g_MiddleBottomRatio)/100);
		Arrange_Panels();
	}
	catch( err )
	{
		//alert("InitialPosition_Panels," + err.number + ", " + err.description);
	}
}

// --------------------------------------------------------------------------------------
// Function 	: Arrange Panels
// Use		: Arranging the panels as per saved positions.
// --------------------------------------------------------------------------------------
function Arrange_Panels()
{
	try
	{
		lnHorizantal.style.pixelLeft = 0;
		lnHorizantal.style.pixelTop = g_HSTop+g_Gapbtwsplitter;
		lnHorizantal.style.pixelWidth = g_TotalWidth;
		lnHorizantal.style.pixelHeight = g_SplitterSize;

		lnUpperVertical.style.pixelLeft = g_UVSLeft+g_Gapbtwsplitter;
		lnUpperVertical.style.pixelTop = 0;
		lnUpperVertical.style.pixelWidth = g_SplitterSize;
		lnUpperVertical.style.pixelHeight = g_HSTop;

		lnLeftLowerVertical.style.pixelLeft = g_LLVSLeft+g_Gapbtwsplitter;
		lnLeftLowerVertical.style.pixelTop = g_HSTop+g_SplitterSize+2*g_Gapbtwsplitter;
		lnLeftLowerVertical.style.pixelWidth = g_SplitterSize;
		lnLeftLowerVertical.style.pixelHeight = g_TotalHeight-g_HSTop-g_SplitterSize-2*g_Gapbtwsplitter;

		lnLowerVertical.style.pixelLeft = g_LRVSLeft+g_Gapbtwsplitter;
		lnLowerVertical.style.pixelTop = lnLeftLowerVertical.style.pixelTop;
		lnLowerVertical.style.pixelWidth = g_SplitterSize;
		lnLowerVertical.style.pixelHeight = lnLeftLowerVertical.style.pixelHeight;

		grpStatusField.style.pixelLeft = 0;
		grpStatusField.style.pixelTop = g_TotalHeight;
		grpStatusField.style.pixelWidth = g_TotalWidth;
		grpStatusField.style.pixelHeight = g_StatusFieldHeight;

		SeqSummary.style.pixelLeft = 0;
		SeqSummary.style.pixelTop = 0;
		SeqSummary.style.pixelWidth = lnUpperVertical.style.pixelLeft-g_Gapbtwsplitter;
		SeqSummary.style.pixelHeight = lnUpperVertical.style.pixelHeight;
		
		SeqDetail.style.pixelLeft = lnUpperVertical.style.pixelLeft+g_SplitterSize+g_Gapbtwsplitter;
		SeqDetail.style.pixelTop = 0;
		SeqDetail.style.pixelWidth = g_TotalWidth-lnUpperVertical.style.pixelLeft-g_SplitterSize-g_Gapbtwsplitter;
		SeqDetail.style.pixelHeight = lnUpperVertical.style.pixelHeight;

		grpMiniTrend.style.pixelLeft = 0;
		grpMiniTrend.style.pixelTop = lnLeftLowerVertical.style.pixelTop;
		grpMiniTrend.style.pixelWidth = lnLeftLowerVertical.style.pixelLeft-g_Gapbtwsplitter;
		grpMiniTrend.style.pixelHeight = lnLeftLowerVertical.style.pixelHeight;

		SeqKeyParams.style.pixelLeft = lnLeftLowerVertical.style.pixelLeft+g_SplitterSize+g_Gapbtwsplitter;
		SeqKeyParams.style.pixelTop = lnLeftLowerVertical.style.pixelTop;
		SeqKeyParams.style.pixelWidth = lnLowerVertical.style.pixelLeft-lnLeftLowerVertical.style.pixelLeft-g_SplitterSize-2*g_Gapbtwsplitter;
		SeqKeyParams.style.pixelHeight = lnLeftLowerVertical.style.pixelHeight;

		SeqAddlDetails.style.pixelLeft = lnLowerVertical.style.pixelLeft+g_SplitterSize+g_Gapbtwsplitter;
		SeqAddlDetails.style.pixelTop = lnLowerVertical.style.pixelTop;
		SeqAddlDetails.style.pixelWidth = g_TotalWidth-lnLowerVertical.style.pixelLeft-g_SplitterSize-g_Gapbtwsplitter;
		SeqAddlDetails.style.pixelHeight = lnLowerVertical.style.pixelHeight;

		RCM_Annotation_Component.style.pixelLeft = lnLowerVertical.style.pixelLeft+g_SplitterSize+g_Gapbtwsplitter;
		RCM_Annotation_Component.style.pixelTop = lnLowerVertical.style.pixelTop;
		RCM_Annotation_Component.style.pixelWidth = g_TotalWidth-lnLowerVertical.style.pixelLeft-g_SplitterSize-g_Gapbtwsplitter;
		RCM_Annotation_Component.style.pixelHeight = lnLowerVertical.style.pixelHeight;
		if (g_ShowAnnotation == true)
			ShowAnnotation();

'MiniTrend Related functions
Function InitTrend
	Dim i
	Dim iTrendLineCount

	iTrendLineCount = HwPropCollControl.Use("/Trend_Line_Count").Value
	If iTrendLineCount < 0 Then
		iTrendLineCount = 0
	ElseIf(iTrendLineCount > 32) Then
		iTrendLineCount = 32
	End If
	If (iTrendLineCount = 0) Then
		'Clean the minitrend/Rmove all plots
		For i = 1 to 32
			MiniTrend.Legend.PlotVisible(i) = False
		Next
	Else
		Dim strPoint, strParam, iStyle, iColor
		'Read the Keys and populate MiniTrend
		MiniTrend.AutoRuntimeDataRequest = False
		For i=0 to iTrendLineCount-1
			strPoint = Eval("HwPropCollControl.Use(""/Trend_Line_Point[" & i & "]"").Value")
			strParam = Eval("HwPropCollControl.Use(""/Trend_Line_Param[" & i & "]"").Value")
			iStyle = Eval("HwPropCollControl.Use(""/Trend_Line_Style[" & i & "]"").Value")
			iColor = Eval("HwPropCollControl.Use(""/Trend_Line_Color[" & i & "]"").Value")
			
			MiniTrend.Legend.PointID(i+1) = strPoint
			MiniTrend.Legend.Parameter(i+1) = strParam
			MiniTrend.Legend.PlotVisible(i+1) = True
			MiniTrend.Legend.PlotColor(i+1) = iColor
			MiniTrend.ChartArea.Plots.Item(i+1).MarkerStyle = iStyle
		Next
		For i = iTrendLineCount+1 to 32
			MiniTrend.Legend.PlotVisible(i) = False
		Next
		MiniTrend.RuntimeDataRequest	'Batch subscribe the plots	
		'msgbox "Interval: " & CInt(HwPropCollControl.Use("/Trend_Interval").Value)
		
		If(HwPropCollControl.Use("/Trend_Freeze").Value = False) Then
			MiniTrend.Resume
			MiniTrend.SetPeriod 0,0,0,0,0,0,HwPropCollControl.Use("/Trend_Est_Duration").Value
			MiniTrend.SetPeriod 0,0,0,0,0,0,HwPropCollControl.Use("/Trend_Est_Duration").Value
		Else
			MiniTrend.SetTimeRange CDate(HwPropCollControl.Use("/Trend_Start_Time").Value), 0.0, CDate(HwPropCollControl.Use("/Trend_End_Time").Value)
			MiniTrend.Pause			
		End If
		Select Case CInt(HwPropCollControl.Use("/Trend_Interval").Value)
			Case 0		MiniTrend.SetSampleInterval 0,1,0,0,False	'1Min
			Case 1		MiniTrend.SetSampleInterval 0,6,0,0,True	'6MinAvg
			Case 2		MiniTrend.SetSampleInterval 1,0,0,0,True	'1HourAvg
			Case 3		MiniTrend.SetSampleInterval 8,0,0,0,True	'8HourAvg
			Case 4		MiniTrend.SetSampleInterval 24,0,0,0,True	'24HourAvg
			Case 5		MiniTrend.SetSampleInterval 0,0,5,0,False	'5Sec
			Case 6		MiniTrend.SetSampleInterval 1,0,0,0,False	'1Hour
			Case 7		MiniTrend.SetSampleInterval 8,0,0,0,False	'8Hour
			Case 8		MiniTrend.SetSampleInterval 24,0,0,0,False	'24Hour
			Case Else	MiniTrend.SetSampleInterval 0,0,3,0,False	'default 3Sec
		End Select
	End If
End Function
function GetBreadcrumb
	Dim strLocation
	strLocation = Document.location
		if instr(lcase(strLocation),"breadcrumb=") > 0 then
			strBreadCrumb = mid(strLocation, instr(lcase(strLocation),"breadcrumb=")+11, instr(lcase(strLocation),"&") - (instr(lcase(strLocation),"breadcrumb=") + 11))
			BreadCrumb = replace(strBreadCrumb,"%3E", ">")
			GetBreadcrumb = BreadCrumb
		else
			GetBreadcrumb = ""
		end if
end function


function TableViewInitForActivities()

	document.title = ActivityPointDetail.value

		pbNotApplicable.style.visibility = "visible"
		grpTableView.style.visibility = "hidden" ' This line is needed to make the redcover appear on top
	else
		' activity is executing
		if bRefreshOnNextActExecute = False then
			'HwPropCollControl.Use("/SEQ").Value = CSTR(sd.DataValue("CurrentPoint.ACTENTITY"))
	
		else
			'This should never happen. Just in case, the activity starts executing when HwPropCollControl is no longer alive, refresh the page
			window.external.InvokeMenu( 1058 )
		end if	
		pbActivePhases.disabled = False
		pbHandlers.disabled = False
		pbChart.disabled = False
		pbResources.disabled = False
		pbNotApplicable.style.visibility = "hidden"

	Dim P

        //------------------------------------------------------------------------

        // CreateExtensionDiv

        //------------------------------------------------------------------------

        // <summary>

        // Creates a single div in the specified parent element with the specified

        // styles and attributes.

        // </summary>

        // <param name="extId">The ID for the new div.</param>

        // <param name="extClass">The class(es) for the new div.</param>

        // <param name="extXStyle">The style used to give the div its horizontal position ('left' or 'right')</param>

        // <param name="extXPos">The expression for the div's horizontal position.</param>

        // <param name="extYStyle">The style used to give the div its vertical position ('top or 'bottom')</param>

        // <param name="extYPos">The expression for the div's vertical position.</param>

        // <param name="extWidth">The expression for the div's width.</param>

        // <param name="extHeight">The expression for the div's height.</param>

        // <param name="extDisplay">The expression for the div's display style - null or '' if this is not needed.</param>

        // <param name="objExtParent">The element to insert the new div as a child of.</param>

        // <returns>

        // true if the div was created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateExtensionDiv(extId, extClass, extXStyle, extXPos, extYStyle, extYPos, extWidth, extHeight, extDisplay, objExtParent)

        {

          try

          {

            var objExt = window.document.getElementById(extId);

            if (objExt == null)

            {

              objExt = window.document.createElement("div");

              objExt.id = extId;

              objExt.className = extClass;

              objExt.style.position = "absolute";

              objExt.style.overflow = "hidden";

              objExt.style.setExpression(extXStyle, extXPos, "JavaScript");

              objExt.style.setExpression(extYStyle, extYPos, "JavaScript");

              objExt.style.setExpression("width", extWidth, "JavaScript");

              objExt.style.setExpression("height", extHeight, "JavaScript");

              if (typeof(extDisplay) == "string" && extDisplay.length > 0)

              {

                objExt.style.setExpression("display", extDisplay, "JavaScript");

              }

              

              // Insert the new extension div into the proper location in a seperate thread, so that

              // the time it takes doesn't delay the calculation of the size and location of the

              // other extensions. This also breaks out of the onreadystatechange handler thread before

              // mucking around with the DOM, which could potentially change the readyState again.

              window.setTimeout(function(){ objExtParent.appendChild(objExt); }, 5);

            }

            return true;

          }

          catch(e)

          {

            alert("Exception creating background extension '" + extId + "': " + (typeof(e) == "string" ? e : e.description));

          }

          return false;

        }

        

        //------------------------------------------------------------------------

        // CreateBackgroundExtensions

        //------------------------------------------------------------------------

        // <summary>

        // Create empty elements inside the background that match the colored

        // parts of the shape to give the impression that the Page stretches

        // all the way to the edges of the Background.

        // </summary>

        // <returns>

        // true if the extensions were created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateBackgroundExtensions()

        {

          try

          {

              var objPage = window.document.getElementById("Page");

              var objBackground = window.document.getElementById("Background");      

              if (objPage == null || objBackground == null)

              {

                return false;

              }

                                          

              // Extend the TitleBar on the right-hand edge

              CreateExtensionDiv("bgTitleBar", "TitleBar", 

                                  "right", "'0px'", "top", "'0px'", 

                                  "Background.clientWidth - Page.offsetWidth", 

                                  "TitleBarBackground.offsetHeight", 

                                  null, objBackground);

              

              // Extend the TabSet on the right-hand edge.

              CreateExtensionDiv("bgTabSet", "TabSet", 

                                  "right", "'0px'", "top", "TitleBarBackground.offsetHeight", 

                                  "Background.clientWidth - Page.offsetWidth", "TabSetBackground.offsetHeight", 

                                  "TabSetBackground.currentStyle.display", objBackground);

              

              // Extend the NavPane on the bottom edge.


              CreateExtensionDiv("bgNavPane", "NavPane NavPaneFP",

                                   "left", "'0px'", "bottom", "'0px'", 

                                   "NavPane.offsetWidth", "Background.clientHeight - Page.offsetHeight", 

                                   null, objBackground);



              return true;

          }

          catch(e)

          {

             alert("Exception creating background extensions: " + (typeof(e) == "string" ? e : e.description));

          }  

          return false;

        }

        



      </SCRIPT>

        }
