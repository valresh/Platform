href=".\Styles\SysFaceplate.css">
<SCRIPT language=VBScript for=Page defer event=onpagecomplete>	call LinkBDisplay()</SCRIPT>
<SCRIPT language=VBScript for=checkboxEnableLinkA defer event=onclick>	If (alphaChnType.value = 34) Then
		If (checkboxEnableLinkA.value=1) and (LinkBImplemented.value=1) Then
			' if the 'in service' bit for FS90 link A is disabled, then disable link B bit as well
			checkboxEnableLinkB.value=0
		End If
	End If</SCRIPT>
<SCRIPT language=VBScript for=sd defer event=onupdate>If not me.QualityBad("CurrentPoint.alarmvalue") Then
	If ConAlpAlarmValue.value = txtNONE.innerText Then
  		ConAlpAlarmValue.style.visibility="Hidden"
	else
		ConAlpAlarmValue.style.visibility="Visible"
	End If
End if</SCRIPT>
<SCRIPT language=VBScript defer>' Hides or shows Link B information depending on whether Link B is implemented
sub LinkBDisplay ( )
	'ISR85221 - handle FS90 channel special case
	if ((alphaLinkBImplemented.value = 0) or (alphaChnType.value = 34)) then
		' Hide the Link B-related components, and present the simplified version of the Link A status label
		strLinkBVisibility = "hidden" 
		lblLinkAStatus.value = "Status"
		strLinkAVisibility = "inherit"
	else
		strLinkBVisibility = "inherit" 
		strLinkAVisibility = "hidden"
		lblLinkAStatus.value = "Link A Status"
	end if
    ' The Link A status label is hidden until we have decided its value
	lblLinkAStatus.style.visibility = "inherit" 
	GrpCenterPanelLinkBComponents.style.visibility = strLinkBVisibility 
	GrpLowerPanelLinkBComponents.style.visibility = strLinkBVisibility
	lblEnableLinkAPrefix.style.visibility = strAVisibility
end sub
' Rearranges the faceplate's contents to cope with resizing.
Sub ApplyLayout()
 on error resume next
	GrpLowerPanel.style.top = ""
	GrpLowerPanel.style.bottom = "2px"
	GrpCenterPanel.style.top = GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2
	GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
End Sub</SCRIPT>
<SCRIPT language=VBScript for=alpSimState defer event=onupdate>if me.QualityGood("CurrentPoint.SimulationMode") then
	if me.value <> 1 Then
		txtSimulation.style.visibility = "Hidden"
		txtSimulationLB.style.visibility = "Hidden"
	else
		txtSimulation.style.visibility = "inherit"
		if ((alphaLinkBImplemented.value = 0) or (alphaChnType.value = 34)) then
			txtSimulationLB.style.visibility = "hidden"
		else
			txtSimulationLB.style.visibility = "inherit"
		end if
	End if
else
		txtSimulation.style.visibility = "Hidden"
		txtSimulationLB.style.visibility = "Hidden"
end if</SCRIPT>
<SCRIPT language=JScript for=ConAlpTagname defer event=onupdate>if ((this.scrollHeight - this.clientHeight) > 0 )
	{
		this.styleClass = "PointName_LongTag_Style";
		ConAlpDescription.styleClass = "Description_LongTag_Style";
	}
	else
	{
		this.styleClass = "PointName_Style";
		ConAlpDescription.styleClass = "Description_Style";
	}</SCRIPT>
