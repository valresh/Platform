<SCRIPT language=VBScript for=ConAlpHWYNum2 defer event=onupdate>if me.QualityGood("ct_TagName2.HWYNUM") then

		sHiwayNum = cstr("0" & sHiwayNum)
	end if

		sBoxNum = me.DataValue("ct_TagName2.OUTBOXNM")
	else

	end if

	sBoxTagName = "$HY"&sHiwayNum & "B"& sBoxNum

end if</SCRIPT>

<SCRIPT language=VBScript defer>Sub Initialize_TagName()
On Error Resume Next
For i = 1 to 8
	if window.external.StationDataRepository.GetValue("ct_TagName"&i) <> "." and window.external.StationDataRepository.GetValue("ct_TagName"&i) <> vbnullstring then
		document.getElementById("ConAlpTagName"&i).value = window.external.StationDataRepository.GetValue("ct_TagName"&i)
	else
		document.getElementById("ConAlpTagName"&i).value = txtEnterTagName.value
	end if
Next
if window.external.StationDataRepository.GetValue("op_Message") <> "." then
	ConAlpMessage.value = window.external.StationDataRepository.GetValue("op_Message")
end if
End Sub</SCRIPT>
