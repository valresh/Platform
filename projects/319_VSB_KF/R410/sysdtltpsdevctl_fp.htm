<SCRIPT language=VBScript for=combo_OPFINAL defer event=onchange>	on error resume next

	'this object bound to OPFINAL which is the reflected process value
	'however, writes are made to OP not OPFINAL

	'value that timer routine will write to OP
	sOPTemp.innerText = me.innerText 

	'nDemandCount = 0 tells timer routine to 'write sOPTemp'
	nDemandCount = 0 

	'clear any potential existing timer (e.g. operator changes mind and sets value again)
	window.clearInterval(intTimerID)

	'immediately reflect (dis)agreement of OP vs this newly-requested OPFINAL value
	if me.innerText <> sd.DataValue("CurrentPoint.OPFINAL") then 
		textboxOPoffNormal.style.visibility = "inherit"
		textboxOP.style.visibility = "hidden"
	else
		textboxOPoffNormal.style.visibility = "hidden"
		textboxOP.style.visibility = "inherit"
	end if

	intTimerID = window.setInterval("UpdateOPFINAL()", 200) '2000)  'first time short as we do synch data write

	'we've handled the 'write' here, so don't have Experion attempt to actually write to opfinal
	me.CancelChange

	'probably not necessary, but add'l hint to Experion to just forget this event
	window.event.returnvalue = false</SCRIPT>

<SCRIPT language=VBScript for=sd_OPFINAL defer event=ondatachange>'	This routine just to speed response to OPFINAL tracking of OP change made via synchdatawrite of OP
	combo_OPFINAL.innerText = me.DataValue("CurrentPoint.OPFINAL")

	if (nDemandCount >= 0) then
		if combo_OPFINAL.innerText = sOPTemp.innerText then 'turn off OP highlight, we're done
			textboxOPoffNormal.style.visibility = "hidden"
			textboxOP.style.visibility = "inherit"
			nDemandCount = -1
			window.clearInterval(intTimerID)
			exit sub
		end if
	end if

	'if we've iterated twice, then update the "OP" text highlight indicator and we're done
	if nDemandCount >= 2 then 
		nDemandCount = -1
		window.clearInterval(intTimerID)
		ShowOPText
	else
	'	wait 2 seconds and check value again for 'best update performance' 
		ShowOPText
		nDemandCount = nDemandCount + 1
		intTimerID = window.setInterval("UpdateOPFINAL()", 2000)  'try a total of 4 times
	end if</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onexecutecommand>	dim strCommand
	strCommand = window.event.getAttribute("onExecuteCommand", 0)
	if not (strCommand="Raise" or strCommand="OKB RAISE" or strCommand="Lower" or strCommand="OKB LOWER") then
		exit sub
	end if

	'disable PV ramping if not PVSOURCE=MAN
	if sd.QualityGood("CurrentPoint.PVSOURCE") and sd.DataValue("CurrentPoint.PVSOURCE") <> "MAN" and UCase(window.document.activeElement.id) = "COMBO_PV" then
		window.event.returnvalue = false 'Notify Station the command is handled  (do nothing)
		exit sub
	end if

	if Page.hasFocus or sElementRaiseLower <> "" or UCase(window.document.activeElement.id) = "COMBO_OPFINAL" or UCase(window.document.activeElement.id) = "COMBO_OP" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then

		'raise/lower keys require operator confirmation - supported for OP/OPFINAL
		if strCommand="Raise" or strCommand="OKB RAISE" then

			window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise " 
			if sElementRaiseLower = "OP" or UCase(window.document.activeElement.id) = "COMBO_OPFINAL" or UCase(window.document.activeElement.id) = "COMBO_OP" then
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "OP"
				GrpOP.focus 'set focus to unbound element to avoid Station noise, reset to OP later
				if sCurrentShownRaiseLowerValue = "" then
					if bOPOnly then 
						sCurrentShownRaiseLowerValue = combo_OP.innerText
					else
						sCurrentShownRaiseLowerValue = combo_OPFINAL.innerText
					end if
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseOP(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm()
			elseif sElementRaiseLower = "MODATTR" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then				
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODATTR"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MDATTR.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextRaiseMODATTR(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				GrpMDAttr.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm()
			end if
		elseif strCommand="Lower" or strCommand="OKB LOWER" then

			if sElementRaiseLower = "OP" or UCase(window.document.activeElement.id) = "COMBO_OPFINAL" or UCase(window.document.activeElement.id) = "COMBO_OP" then
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "OP"
				GrpOP.focus 'set focus to unbound element to avoid Station noise, reset to OP later
				if sCurrentShownRaiseLowerValue = "" then
					if bOPOnly then 
						sCurrentShownRaiseLowerValue = combo_OP.innerText
					else
						sCurrentShownRaiseLowerValue = combo_OPFINAL.innerText
					end if
				end if
				sCurrentShownRaiseLowerValue = GetNextLowerOP(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Lower-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm()
			elseif sElementRaiseLower = "MODATTR" or UCase(window.document.activeElement.id) = "COMBO_MDATTR" then				
				window.clearInterval(intRaiseLowerTimerID)
				sElementRaiseLower = "MODATTR"
				if sCurrentShownRaiseLowerValue = "" then
					sCurrentShownRaiseLowerValue = combo_MDATTR.innerText
				end if
				sCurrentShownRaiseLowerValue = GetNextLowerMODATTR(sCurrentShownRaiseLowerValue)
				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: OnExecuteCommand: Raise-Confirm: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				GrpMDAttr.focus 'set focus to unbound element to avoid Station noise, reset later
				window.event.returnvalue = false 'Notify Station the command is handled
				call RaiseLowerConfirm()
			end if
		end if

	end if</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>	dim bVisible 
	bVisible = false

	call Update_DEVCTL

	ShowOPText  'normal-tracking of OPFINAL only if not recent operator-OP-write

	if not sd.QualityGood("CurrentPoint.PVNORMAL") then
		grpPVNORMAL.style.visibility = "Hidden"
	else
		grpPVNORMAL.style.visibility = "Inherit"
 		combo_PVNORMAL.value = sd.DataValue("CurrentPoint.PVNORMAL")
		bVisible = true
	end if

	if bParamsAdjusted = true then 
		exit sub
	end if

' additional page, show only valid parameters
	if sd.QualityBad("CurrentPoint.PVSOURCE") then 'hide and shift others up
		grpPVSOURCE.style.visibility = "Hidden"
		grpPVNORMAL.style.pixeltop = grpBYPASS.style.pixeltop
		grpBYPASS.style.pixeltop = grpPVSOURCE.style.pixeltop
	else
		grpPVSOURCE.style.visibility = "Inherit"
		bVisible = true
	end if	

	if not sd.QualityGood("CurrentPoint.BYPASS") then
		grpBYPASS.style.visibility = "Hidden"
		grpPVNORMAL.style.pixeltop = grpBYPASS.style.pixeltop
	else
		grpBYPASS.style.visibility = "Inherit"
		bVisible = true
	end if

	if bVisible = true then
		shpPanelNavigation.style.visibility = "Inherit" 
	else
		shpPanelNavigation.style.visibility = "Hidden"
	end if
	
	bParamsAdjusted = true</SCRIPT>

Function UpdateOPFINAL()

	'This routine is used to write operator OP-changes and then track corresponding OPFINAL updates that are
	'directly placed into the OP's combobox text area
	window.clearInterval(intTimerID)
	if nDemandCount = 0 then
		if not sd.SetDataValueSynchronous("CurrentPoint.OP", sOPTemp.innerText) then
			nDemandCount = 2  ' write failed, don't bother waiting any longer
		end if
	end if
	if 1 = trigger_update.value then 
		sd.TriggerDataUpdate("CurrentPoint.OPFINAL"), 1
	end if
	sd_OPFINAL.RequestDemandData

End Function

Function RaiseLowerConfirm()

	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID) 'clear old/other timers
  	intRaiseLowerTimerID = window.setInterval ("CheckRaiseLowerResponse()", 500)

End Function

sub CancelRaiseLowerConfirmation

	'generic routine to clean up and bail out of confirmation of raise/lower OP/MODE/MODATTR
'	window.external.parentdocument.parentwindow.external.MessageZoneText = ""
	window.external.parentdocument.parentwindow.external.CancelResponse
	nConfirmCount = 0
	window.clearInterval(intRaiseLowerTimerID)
	sCurrentShownRaiseLowerValue = ""
	sElementRaiseLower = ""
	sConfirmRaiseLowerMsg = ""

end sub

Function OnDeactivateCancelRamp

	window.clearInterval(intCancelRampOnPageDeactivateID)
	call CancelRaiseLowerConfirmation

end function

sub CheckRaiseLowerResponse

	dim sResponse
	dim iStatus
	dim ptPromptType 
	dim sMsgZoneText
	ptPromptType = 1

	nConfirmCount = nConfirmCount + 1

	sMsgZoneText = window.external.parentdocument.parentwindow.external.MessageZoneText 

'	sConfirmRaiseLowerMsg = "<" & nConfirmCount & "> " & "Change state of TPS:" & alphaTagName.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	sConfirmRaiseLowerMsg = "Change state of TPS:" & alphaTagName.value & "." & sElementRaiseLower & " to " & sCurrentShownRaiseLowerValue
	iStatus = window.external.parentdocument.parentwindow.external.GetResponse3 (sConfirmRaiseLowerMsg, ptPromptType, sResponse)

'	window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: status returned= " & iStatus

	if iStatus = 0 and nConfirmCount > 1 then

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: - action cancelled by user" 
		call CancelRaiseLowerConfirmation
		exit sub
	elseif iStatus = 1 then
		if sResponse = "" then
			'no response yet... let timer fire again shortly
		else
			'recieved response, process it and we're DONE
			if UCase(sResponse) = "Y" then

				window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: setting: " & sElementRaiseLower & " to: " & sCurrentShownRaiseLowerValue
				if sElementRaiseLower = "OP" then
					if bOPOnly then 
						combo_OP.hostpopulation = true
						combo_OP.value = sCurrentShownRaiseLowerValue
						if 1 = trigger_update.value then 
							sd.TriggerDataUpdate("CurrentPoint.OP"), 1
						end if
						combo_OP.focus
					else
						' same as if selected via combobox - reflect OPFINAL update a.s.a.p.
						sOPTemp.innerText = sCurrentShownRaiseLowerValue 

						'nDemandCount = 0 tells timer routine to 'write sOPTemp'
						nDemandCount = 0 

						'clear any potential existing timer (e.g. operator changes mind and sets value again)
						window.clearInterval(intTimerID)

						'immediately reflect (dis)agreement of OP vs this newly-requested OPFINAL value
						if combo_OPFINAL.innerText <> sCurrentShownRaiseLowerValue then 
							textboxOPoffNormal.style.visibility = "inherit"
							textboxOP.style.visibility = "hidden"
						else
							textboxOPoffNormal.style.visibility = "hidden"
							textboxOP.style.visibility = "inherit"
						end if

						intTimerID = window.setInterval("UpdateOPFINAL()", 200) '2000)  'first time short as we do synch data write
						combo_OPFINAL.focus
					end if
				elseif sElementRaiseLower = "MODATTR" then
					combo_MDATTR.hostpopulation = true
					combo_MDATTR.value = sCurrentShownRaiseLowerValue
					if 1 = trigger_update.value then 
						sd.TriggerDataUpdate("CurrentPoint.MODATTR"), 1
					end if
					combo_MDATTR.focus
				end if
			end if

			call CancelRaiseLowerConfirmation

		end if
	end if

	if nConfirmCount > 2 and (sMsgZoneText = "" or (sConfirmRaiseLowerMsg <> sMsgZoneText)) then		
		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: message text changed operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if

	'expire after Experion's "operator timeout" - e.g. 60 seconds (x2 as timer is .5 secs)
	if nConfirmCount > oper_timeout.value * 2 then 

		window.external.parentdocument.parentwindow.external.logmessage "RaiseLowerConfirm: nConfirmCount > Experion operator timeout: " & oper_timeout.value & "; operation cancelled" 
		call CancelRaiseLowerConfirmation
		exit sub

	end if

end sub

sub ApplyLayout()

'	This routine enables the 'smart sizing' of faceplates

	on error resume next


	'*******************************************************************************************************************
	' this code section enables faceplates to stretch taller, 
	' if the provided (SafeView) window has a height/width aspect ratio of 2.5 or greater
    
	dim oSview
    	dim nFpRatio, nSVWindowRatio, nNewRatio

	set oSview=getobject("","Honeywell.Workspace.Client")
    	If oSview.IsManagerActive = true then
        	nFpRatio= (Page.style.pixelHeight / Page.style.pixelWidth)
        	nSVWindowRatio= round((Page.parentElement.clientHeight / Page.parentElement.clientWidth),1)   'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        	nNewRatio = round(nSVWindowRatio / nFpRatio,1)                                                'Use rounding attempt to avoid excess pixels from excessive decimals in calculation
        	if window.external.AppWindow.width <= 500 and nSVWindowRatio >= 2.5 then                      '500px is max facplate width supported
            		Page.style.pixelHeight = clng((Page.style.pixelHeight * nNewRatio))
        	end if
    	end if
	' 
	'*******************************************************************************************************************

	GrpLowerPanel.style.top = ""
	GrpLowerPanel.style.bottom = "2px"

	grpPanelBackground.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight+ 2
	grpPanelBackground.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	grpPanelBackground.style.pixelHeight = Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10

	GrpCenterPanel.style.top = ""
	if (Page.style.pixelHeight - GrpLowerPanel.style.pixelHeight - GrpUpperPanel.style.pixelHeight - 10) > 153 then
		GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
	else
		GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 2) & "px"
	end if

	call UpdateCenterPanelLayout

end sub

'set alarm zone
Sub CommonAlarm

    Dim state_PNTSTATE
    ' point state indicator
    If sd.QualityGood("CurrentPoint.PNTSTATE") And sd.DataValue("CurrentPoint.PNTSTATE") <> "OK" Then
        state_PNTSTATE = Left(sd.DataValue("CurrentPoint.PNTSTATE"), 1)
'        window.external.parentdocument.parentwindow.external.logmessage "CommonAlarm - PNTSTATE=" & state_PNTSTATE
    Else
        state_PNTSTATE = ""
    End If
    
    '   Replace HIGHAL with ALENBST if inhibited
    If sd.DataValue("CurrentPoint.ALENBST") <> "INHIBIT" Then
        If UCase(sd.DataValue("CurrentPoint.HIGHAL")) = "NOALARM" Or Not sd.QualityGood("CurrentPoint.HIGHAL") Then
            If state_PNTSTATE <> "" Then
                state_alarmState.Value = state_PNTSTATE
                If bToolTips = True Then
                    state_alarmState.Title = "PNTSTATE= " & sd.DataValue("CurrentPoint.PNTSTATE")
                End If
                state_alarmState.Style.visibility = "Visible"
            Else
                state_alarmState.Style.visibility = "hidden"
            End If  ' state_PNTSTATE
 '           window.external.parentdocument.parentwindow.external.logmessage "CommonAlarm - NOALARM (or not config)"
        Else
 '           window.external.parentdocument.parentwindow.external.logmessage "CommonAlarm - in alarm: " & sd.DataValue("CurrentPoint.HIGHAL")
            state_alarmState.Style.visibility = "Visible"
            state_alarmState.Value = sd.DataValue("CurrentPoint.HIGHAL")
            If state_PNTSTATE <> "" Then
                state_alarmState.Value = state_alarmState.Value & " " & state_PNTSTATE
                If bToolTips = True Then
                    state_alarmState.Title = "HIGHAL= " & sd.DataValue("CurrentPoint.HIGHAL") & ", PNTSTATE= " & sd.DataValue("CurrentPoint.PNTSTATE")
                End If
            Else
                If bToolTips = True Then
                    state_alarmState.Title = "HIGHAL= " & sd.DataValue("CurrentPoint.HIGHAL")
                End If
            End If  ' state_PNTSTATE
        End If  ' state_HIGHAL
    Else
'        window.external.parentdocument.parentwindow.external.logmessage "CommonAlarm - INHIBIT"
        state_alarmState.Style.visibility = "Visible"
        state_alarmState.Value = sd.DataValue("CurrentPoint.ALENBST")
        If state_PNTSTATE <> "" Then
            If bToolTips = True Then
                state_alarmState.Title = "ALENBST= INHIBIT, PNTSTATE=" & sd.DataValue("CurrentPoint.PNTSTATE")
            End If
            state_alarmState.Value = state_alarmState.Value & " " & state_PNTSTATE
        Else
            If bToolTips = True Then
                state_alarmState.Title = "ALENBST= INHIBIT"
            End If
       End If  'state_PNTSTATE
    End If  ' state_ALENBST


'   Show "DISABLED" in case below
    If UCase(sd.DataValue("CurrentPoint.ALENBST")) = "DISABLE" Then
        textAlarmDisabled.Style.visibility = "Visible"
'        window.external.parentdocument.parentwindow.external.logmessage "CommonAlarm - DISABLED"
    Else
        textAlarmDisabled.Style.visibility = "hidden"
    End If
End Sub

Sub DevctlOPLED
    ' setops
    OPS0 = 0
    OPS1 = 0
    OPS2 = 0
	if sd.QualityGood("CurrentPoint.OP") then  'only test the numeric OP if the general OP is good
        Select Case alpOPNumeric.value   '<< holds the numeric version of the OP
'        Select Case sd.DataValue("CurrentPoint.OP.internal")
        Case 0
            OPS0 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "DevctlOPLED, OP==0, Setting OPSO=1"
        Case 1
            OPS1 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "DevctlOPLED, OP==1, Setting OPS1=1"
        Case 2
            OPS2 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "DevctlOPLED, OP==2, Setting OPS2=1"
        End Select
    End If
    
    Call UpdateDevctlInterlock
    
    'determine output LED per OPS? and S?  Update_OPIndicator
    If OPS0 = 0 And S0 = 1 Then LEDOUPT0.Value = 2
    If OPS0 = 1 And S0 = 1 Then LEDOUPT0.Value = 3
    If OPS0 = 0 And S0 = 0 Then LEDOUPT0.Value = 4 '    << standard Experion devctl OP shape does not have circle/slash option 
    If OPS0 = 1 And S0 = 0 Then LEDOUPT0.Value = 5 '    << standard Experion devctl OP shape does not have circle/slash option
    If OPS1 = 0 And S1 = 1 Then LEDOUPT1.Value = 2
    If OPS1 = 1 And S1 = 1 Then LEDOUPT1.Value = 3
    If OPS1 = 0 And S1 = 0 Then LEDOUPT1.Value = 4
    If OPS1 = 1 And S1 = 0 Then LEDOUPT1.Value = 5
    If OPS2 = 0 And S2 = 1 Then LEDOUPT2.Value = 2
    If OPS2 = 1 And S2 = 1 Then LEDOUPT2.Value = 3
    If OPS2 = 0 And S2 = 0 Then LEDOUPT2.Value = 4
    If OPS2 = 1 And S2 = 0 Then LEDOUPT2.Value = 5

    'window.external.parentdocument.parentwindow.external.logmessage "DevctlOPLED - LEDs set per OPSO/1/2/S0/S1/S2:" & OPS0 & "/" & OPS1 & "/" & OPS2 & "/" & S0 & "/" & S1 & "/" & S2

End Sub

'Set interlock value and OP value
Sub UpdateDevctlInterlock
    
    ' setinterlock
    If sd.QualityGood("CurrentPoint.Initman") Then
        If sd.DataValue("CurrentPoint.Initman") = 1 Then
            S0 = 0
            S1 = 0
            S2 = 0
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, Initman==1, Setting S0/S1/S2=0"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.REDTAG") Then
        If sd.DataValue("CurrentPoint.REDTAG") = "ON" Then
            S0 = 0
            S1 = 0
            S2 = 0
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, RED TAG, Setting S0/S1/S2=0"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.modAttr") Then
        If sd.DataValue("CurrentPoint.PTEXECST") = "ACTIVE" And sd.DataValue("CurrentPoint.modAttr") = "PROGRAM" Then
            S0 = OPS0
            S1 = OPS1
            S2 = OPS2
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, PROGRAM modattr, Setting S0/S1/S2=OPS0/OPS1/OPS2"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.localman") Then
        If sd.DataValue("CurrentPoint.PTEXECST") = "ACTIVE" And sd.DataValue("CurrentPoint.localman") = 1 Then
            S0 = OPS0
            S1 = OPS1
            S2 = OPS2
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, Localman==1, Setting S0/S1/S2=OPS0/OPS1/OPS2"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.SI0") Then
        If sd.DataValue("CurrentPoint.SI0") = 1 Then
            S0 = 1
            S1 = 0
            S2 = 0
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, SIO==1, Setting S0=1,S1/S2=0"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.BYPASS") Then
        If sd.DataValue("CurrentPoint.BYPASS") = 1 Then
            S0 = 1
            S1 = 1
            S2 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, BYPASS==1, Setting S0/S1/S2=1"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.I0") Then
        If sd.DataValue("CurrentPoint.I0") = 1 Then
            S0 = 1
            S1 = 0
            S2 = 0
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, I0==1, Setting S0=1,S1/S2=0"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.I1") Then
        If sd.DataValue("CurrentPoint.I1") = 1 Then
            S0 = 0
            S1 = 1
            S2 = 0
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, I1==1, Setting S0=0,S1=1,S2=0"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.I2") Then
        If sd.DataValue("CurrentPoint.I2") = 1 Then
            S0 = 0
            S1 = 0
            S2 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, I2==1, Setting S0/S1=0,S2=1"
            Exit Sub
        End If
    End If
    If sd.QualityGood("CurrentPoint.P0") Then
        If sd.DataValue("CurrentPoint.P0") = 1 Then
            S0 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, P0==1, Setting S0=1"
        Else
            S0 = OPS0
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, P0<>1, Setting S0=OPS0:" & OPS0
        End If
    Else
        S0 = 0
        'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, setting S0=0 (P0 *not* QualityGood)"
    End If
    If sd.QualityGood("CurrentPoint.P1") Then
        If sd.DataValue("CurrentPoint.P1") = 1 Then
            S1 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, P1==1, Setting S1=1"
        Else
            S1 = OPS1
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, P1<>1, Setting S1=OPS1:" & OPS1
        End If
    Else
        S1 = 0
        'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, setting S1=0 (P1 *not* QualityGood)"
    End If
    If sd.QualityGood("CurrentPoint.P2") Then
        If sd.DataValue("CurrentPoint.P2") = 1 Then
            S2 = 1
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, P2==1, Setting S2=1"
        Else
            S2 = OPS2
            'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, P2<>1, Setting S2=OPS2:" & OPS2
        End If
    Else
        S2 = 0
        'window.external.parentdocument.parentwindow.external.logmessage "UpdateDevctlInterlock, setting S2=0 (P2 *not* QualityGood)"
    End If
    
End Sub

Sub DevctlSVColor
    If UCase(sd.DataValue("CurrentPoint.PTEXECST")) = "INACTIVE" Then
        'window.external.parentdocument.parentwindow.external.logmessage "Point is inactive"
        ConIndSECVAR.levelFillColor = RGB(0, 139, 139)
    Else
        If sd.DataValue("CurrentPoint.SECVAR") > sd.DataValue("CurrentPoint.SVHHTP") Then
            'window.external.parentdocument.parentwindow.external.logmessage "SVHHFL in alarm"
            Select Case sd.DataValue("CurrentPoint.SVHHPR")
                Case "EMERGNCY"
                    'window.external.parentdocument.parentwindow.external.logmessage "SVHHPR -- EMERGNCY"
                    ConIndSECVAR.levelFillColor = UrgentColor
                Case "HIGH"
                    'window.external.parentdocument.parentwindow.external.logmessage "SVHHPR -- HIGH"
                    ConIndSECVAR.levelFillColor = HighColor
                Case "LOW"
                    'window.external.parentdocument.parentwindow.external.logmessage "SVHHPR -- LOW"
                    ConIndSECVAR.levelFillColor = LowColor
                Case Else
                    'window.external.parentdocument.parentwindow.external.logmessage "SVHHPR -- Others"
                    ConIndSECVAR.levelFillColor = RGB(0, 139, 139)
            End Select
        ElseIf sd.DataValue("CurrentPoint.SECVAR") > sd.DataValue("CurrentPoint.SVHITP") Then
            'window.external.parentdocument.parentwindow.external.logmessage "SVHIFL in alarm"
            Select Case sd.DataValue("CurrentPoint.SVHIPR")
                Case "EMERGNCY"
                    'window.external.parentdocument.parentwindow.external.logmessage "SVHIPR -- EMERGNCY"
                    ConIndSECVAR.levelFillColor = UrgentColor
                Case "HIGH"
                    'window.external.parentdocument.parentwindow.external.logmessage "SVHIPR -- HIGH"
                    ConIndSECVAR.levelFillColor = HighColor
                Case "LOW"
                    'window.external.parentdocument.parentwindow.external.logmessage "SVHIPR -- LOW"
                    ConIndSECVAR.levelFillColor = LowColor
                Case Else
                    'window.external.parentdocument.parentwindow.external.logmessage "SVHIPR -- Others"
                    ConIndSECVAR.levelFillColor = RGB(0, 139, 139)
            End Select
        Else
            'window.external.parentdocument.parentwindow.external.logmessage "NO SV Alarm"
            ConIndSECVAR.levelFillColor = RGB(0, 139, 139)
        End If
    End If
End Sub

' alarm trip shape for devctl
Sub devctl_almtp_update(sdx)

    Dim Range, Eulow, sEUDesc

    Dim oShape
    Set oShape = sdx.parentNode.parentNode

    Range = 100
    Eulow = 0

    If sdx.QualityGood("Tagname.sveulo") And Not sdx.IsNan("Tagname.sveulo") And sdx.QualityGood("Tagname.sveuhi") And Not sdx.IsNan("Tagname.sveuhi") Then
        Eulow = sdx.DataValue("Tagname.sveulo")
        Range = sdx.DataValue("Tagname.sveuhi") - Eulow
		'window.external.parentdocument.parentwindow.external.logmessage "devtl_almtp_update - sveulo:" & Eulow & ", range: " & Range
    End If
    
    sEUDesc = sdx.DataValue("Tagname.SVEUDESC")
    
    If sdx.QualityGood("Tagname.svhhtp") And Not sdx.IsNan("Tagname.svhhtp") And Range > 0 And sdx.DataValue("Tagname.svhhpr") > 1 Then
        Call devctl_AlmTP_OnUpdate(oShape.Objects("rectHH"), sdx.DataValue("Tagname.svhhtp"), sdx.DataValue("Tagname.svhhpr"), Range, Eulow, sEUDesc)
    Else
        oShape.Objects("rectHH").Style.visibility = "hidden": oShape.Objects("rectHH").Style.pixelHeight = 0
    End If

    If sdx.QualityGood("Tagname.svhitp") And Not sdx.IsNan("Tagname.svhitp") And Range > 0 And sdx.DataValue("Tagname.svhipr") > 1 Then
        Call devctl_AlmTP_OnUpdate(oShape.Objects("rectHI"), sdx.DataValue("Tagname.svhitp"), sdx.DataValue("Tagname.svhipr"), Range, Eulow, sEUDesc)
    Else
        oShape.Objects("rectHI").Style.visibility = "hidden": oShape.Objects("rectHI").Style.pixelHeight = 0
    End If

End Sub

Sub devctl_AlmTP_OnUpdate(oRect, tp, pr, Range, Eulow, sEUDesc)
    Dim iWidth
    iWidth = oRect.parentNode.Style.pixelWidth

	'window.external.parentdocument.parentwindow.external.logmessage "devctl_AlmTP_OnUpdate, oRect.id=" & oRect.id & ", tp:" & tp & ", pr:" & pr & ", Range:" & Range & ", Eulow:" & Eulow & ", sEUDesc:" & sEUDesc

    If Eulow > tp Then
        oRect.Style.pixelWidth = iWidth
    Else
        oRect.Style.pixelWidth = (Range - tp + Eulow) / Range * iWidth
    End If
    oRect.Style.pixelLeft = iWidth - oRect.Style.pixelWidth

    If oRect.Style.pixelWidth > 0 Then
        CommonGetAlarmColors
        Select Case pr
        Case 4
            oRect.FillColor = UrgentColor
            oRect.Style.visibility = "visible"
        Case 3
            oRect.FillColor = HighColor
            oRect.Style.visibility = "visible"
        Case 2
            oRect.FillColor = LowColor
            oRect.Style.visibility = "visible"
        Case Else
            oRect.FillColor = "NONE"
            'oRect.Style.visibility = "hidden"
        End Select
    End If
    
    Dim sToolTipTxt
    
    If Right(oRect.id, 2) = "HH" Then
        sToolTipTxt = "High High"
    Else
        sToolTipTxt = "High"
    End If
    
    If bToolTips = True Then
        oRect.Title = "SVSRC " & sToolTipTxt & " alarm limit: " & tp & " " & sEUDesc
    End If
End Sub

<SCRIPT id=44E2F4AF-016E-4438-83E1-2015B17A2118 language=JScript defer 
shaperefcount="1">var centerPanelCurrentPage = 1;
centerPanelCurrentDot = 1;
var centerPanelMaxPage = 5;
var centerPanelMaxPageConfigured = 5;
var oShape
var ColorTheme = 'Light';
var colorTheme = 1;
var bshow2ndPage = true;
var bshow3rdPage = true;
var bshow4thPage = true;
var PageContentBaseId = 'CenterPanelPage';

function calculateActualDots()
{

	//Calculate actual dots as per the boolean configured like show2ndPage, show3rdPage
	if (bshow2ndPage != true && centerPanelMaxPageConfigured >= 2)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}
	if (bshow3rdPage != true && centerPanelMaxPageConfigured >= 3)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}
	if (bshow4thPage != true && centerPanelMaxPageConfigured >= 4)
	{
		centerPanelMaxPage = centerPanelMaxPage - 1
	}

	//Once Actual dots calculated initialize the Navigation button with dots
	initializeNavButton()
}

function initializeNavButton()
{

	//Default hide all and show only dots which are applicable
	oShape.objects("btn" + ColorTheme + 'Closed').style.visibility = "inherit";

	switch (centerPanelMaxPage)
	{
		case 2:
			oShape.objects("dotSelected" + ColorTheme + 21).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 22).style.visibility = "inherit";
			break;
		case 3:
			oShape.objects("dotSelected" + ColorTheme + 31).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 32).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 33).style.visibility = "inherit";
			break;
		case 4:
			oShape.objects("dotSelected" + ColorTheme + 41).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 42).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 43).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 44).style.visibility = "inherit";
			break;
		case 5:
			oShape.objects("dotSelected" + ColorTheme + 51).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 52).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 53).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 54).style.visibility = "inherit";
			oShape.objects("dotUnselected" + ColorTheme + 55).style.visibility = "inherit";
			break;
		default:
			oShape.style.visibility = 'hidden';
	}
}

function PanelNavigation()
{

	// centerPanelCurrentDot to handle current dots to be selected.
	// centerPanelCurrentPage page to handle current Page to be shwon

	//Hide all
	centerPanelCurrentPage = centerPanelCurrentPage + 1;
	centerPanelCurrentDot = centerPanelCurrentDot + 1;


	//skipping current page based on the boolean configured like show2ndPage, show3rdPage and show4thPage
	if (bshow2ndPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 2)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;

	}
	if (bshow3rdPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 3)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;

	}
	if (bshow4thPage != true && centerPanelCurrentPage < centerPanelMaxPageConfigured && centerPanelCurrentPage == 4)
	{
		centerPanelCurrentPage = centerPanelCurrentPage + 1;
	}
	//Resetting the centerPanelCurrentPage to default in case centerPanelCurrentPage crossed the limit as per the boolean configured like show2ndPage, show3rdPage and show4thPage
	if (bshow2ndPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 2)
	{
		centerPanelCurrentPage = 1
	}
	if (bshow3rdPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 3)
	{
		centerPanelCurrentPage = 1
	}
	if (bshow4thPage != true && centerPanelCurrentPage >= centerPanelMaxPageConfigured && centerPanelCurrentPage == 4)
	{
		centerPanelCurrentPage = 1
	}

	//Applying the style to the button as per the Closed and Open Status, If the selected dots is other than 1 then its open button.
	if (centerPanelCurrentDot == 1)
	{
		oShape.objects("btn" + ColorTheme + 'Closed').style.visibility = "inherit";
	}
	else
	{
		oShape.objects("btn" + ColorTheme + 'Open').style.visibility = "inherit";
	}
	//Applying the style to the dots as per selected/unselected dots.
	for (var i = 1; i <= centerPanelMaxPage; i++)
	{
		if (i == centerPanelCurrentDot)
		{
			oShape.objects("dotSelected" + ColorTheme + centerPanelMaxPage + i).style.visibility = "inherit";
		}
		else
		{
			oShape.objects("dotUnselected" + ColorTheme + centerPanelMaxPage + i).style.visibility = "inherit";
		}
	}
	// Showing only the applicable page as per the selected dots
	for (obj in oShape.parentElement.children)
	{
		if (obj.toUpperCase().indexOf(PageContentBaseId) !== -1)
		{
			if (obj.slice(-1) == centerPanelCurrentPage)
			{
				document.getElementById(obj).style.display = "block"
				document.getElementById(obj).style.visibility = "Inherit";
			}
			else
			{
				document.getElementById(obj).style.display = "None"
				document.getElementById(obj).style.visibility = "Hidden";
			}
		}
	}
	// Resetting the centerPanelCurrentPage in case it ha crossed the max of configured page
	if (centerPanelCurrentPage >= centerPanelMaxPageConfigured)
	{
		centerPanelCurrentPage = 0;
	}
	// Resetting the dots in case it ha crossed the max of configured page
	if (centerPanelCurrentDot >= centerPanelMaxPage)
	{
		centerPanelCurrentDot = 0;
	}
}</SCRIPT>
