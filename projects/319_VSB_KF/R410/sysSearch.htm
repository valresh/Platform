<SCRIPT language=JScript>
function OnEnter_MenuItem(object)
{
	if (parent.disabled == true) return;
	object.className = "MENUITEM_HOVER";
}

function OnLeave_MenuItem(object)
{
	if (parent.disabled == true) return;
	object.className = "";
}

function CheckDrag()
{
	return window.event.srcElement.isContentEditable;
}

function CheckSelect()
{
	return window.event.srcElement.isContentEditable;
}

<SCRIPT language=VBScript for=GoBtn defer event=onclick>	Dim SecurityLevel

	SecurityLevel = window.external.Parent.RuntimeStatus.SecurityLevel

	if not SecurityLevel = 0 and not SecurityLevel = 1 Then
	    if (SearchString.Value = "") then
			SearchString.Value= "*"
			window.external.Parent.RequestTask 21, 73, 0, 0, 0, "*"
		else
			window.external.Parent.RequestTask 21, 73, 0, 0, 0, SearchString.Value
		end if
	else
		window.external.MessageZoneText = HigherSecurityText.Value
	end if</SCRIPT>
