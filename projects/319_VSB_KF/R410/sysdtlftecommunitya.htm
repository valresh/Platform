<SCRIPT id=4E84921E-158D-4F21-8F04-4D241BAB117E language=VBScript defer 
shaperefcount="7">DIM sErrorString

	sErrorString = "--------"

Function IsStsGoodQuality(obj)
	if not obj is nothing and IsObject(obj) then
		if (obj.quality and 192) = 192 then
			IsStsGoodQuality = TRUE
		else
			IsStsGoodQuality = FALSE
		end if
	else
		IsStsGoodQuality = FALSE
	end if
end function</SCRIPT>

<SCRIPT language=VBScript for=Computername_alpha defer event=onupdate>	Dim sNodeName, sValue

	if IsStsGoodQuality(me) then
		sNodeName = me.value
		sValue = shpAuxDisp.GetCustomProperty("Value", "AuxComputerTarget")
		if (sNodeName <> sValue) and (sNodeName <> "") then
			' MsgBox "sNodeName: """ & sNodeName & """, sValue: """ & sValue & """"
			shpAuxDisp.style.visibility = "inherit"
			textInaccessible.style.visibility = "hidden"
			textAccessing.style.visibility = "hidden"
			shpAuxDisp.autoReloadContent = false
			shpAuxDisp.SetCustomProperty "Value", "AuxComputerTarget", sNodeName
			shpAuxDisp.SetCustomProperty "Value", "AuxHide", 0
			shpAuxDisp.ReloadContent
			shpAuxDisp.Objects("textInitializeAux").onclick
		end if
	else
			shpAuxDisp.style.visibility = "hidden"
			textInaccessible.style.visibility = "inherit"
			textAccessing.style.visibility = "hidden"
	end if</SCRIPT>

<SCRIPT language=VBScript for=shpAuxDisp_textInitializeAux defer event=onclick>'
'Sub textInitialize_onclick
'DIM sLocalAuxDisplayTarget, objLocalAuxContainer, sLocalAuxDisplayProgid, sLocalComponentName, objLocalAuxDisp
DIM sAuxDisplayTarget, sAuxDisplayProgid, sComponentName, objAuxDisp
	set objAuxDisp = nothing

	' can't do anything till we have a target node
	sAuxDisplayTarget = shpAuxDisp_groupAuxDisplay.parentElement.GetCustomProperty("Value", "AuxComputerTarget")
	if sAuxDisplayTarget = "" then exit sub
	' send progid even if blank, as blank is supposed to shut down old display
	sAuxDisplayProgid = shpAuxDisp_groupAuxDisplay.parentElement.GetCustomProperty("Value", "AuxProgid")
	shpAuxDisp_ctlAuxContainer.ShowDisplay sAuxDisplayProgid
	if sAuxDisplayProgid = "" then exit sub
	' get component name for display
	sComponentName = shpAuxDisp_groupAuxDisplay.parentElement.GetCustomProperty("Value", "AuxComponentName")
	if sComponentName = "" then exit sub
	' only if there was a progid do we need to do the following to specialize the display
	set objAuxContainer = shpAuxDisp_ctlAuxContainer
	set objAuxDisp = shpAuxDisp_ctlAuxContainer.AuxDisplay
	if not objAuxDisp is nothing and not IsNull(objAuxDisp)and IsObject(objAuxDisp) then
		objAuxDisp.HostName = sAuxDisplayTarget
		objAuxDisp.HciComponentName = sComponentName
		' release control interface
		set objAuxDisp = nothing
	else
		shpAuxDisp_ctlAuxContainer.ShowDisplay ""
		shpAuxDisp_groupAuxDisplay.parentElement.autoReloadContent = false
		shpAuxDisp_groupAuxDisplay.parentElement.SetCustomProperty "Value", "AuxHide", 1
		shpAuxDisp_groupAuxDisplay.parentElement.onclick
	end if
	' cause the size to change so aux display will fit correctly
	shpAuxDisp_ctlAuxContainer.style.pixelWidth = shpAuxDisp_ctlAuxContainer.style.pixelWidth Xor 1
'End Sub textInitialize_onclick
'</SCRIPT>

	      objAuxDisp.HostName = "" 'sAuxDisplayTarget
	      objAuxDisp.HciComponentName = ""  'sComponentName
	      
		  ' release control interface
		   set objAuxDisp = nothing
       end if

		objAuxContainer.ShowDisplay ""
		set objAuxContainer = nothing
	end if</SCRIPT>
