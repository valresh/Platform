<!-- "LocationBrowser.htm" -->
<!-- $Revision: 5 $ -->
<html>
<head >
    <title> Location Browser </title> 

    <OBJECT id=PBControlObject style="LEFT: 0px; WIDTH: 0px; POSITION: absolute; TOP: 0px; HEIGHT: 0px" 
        codeBase="" classid=clsid:F294C996-D9DB-11D3-80A3-00C04F9A66E9 VIEWASTEXT>
	</OBJECT>

    <script language=jscript>
		var g_bobjEmBrowserReady = false;
		var g_bStationObjectReady = false;
        var g_BrowserScrpltGap = 20;

        function fnSetStationObject()
        {
            if (g_bobjEmBrowserReady != true) {
                g_bStationObjectReady = true;
                return;                
            }
            objEmBrowser.SetBackgroundColor("buttonface");
            return objEmBrowser.SetStationObject();
        }

        function fnGetTagName()
        {
            if (g_bobjEmBrowserReady != true) {
                return;                
            }
            return objEmBrowser.GetTagName();
        }
	
	    function fnGetAreaNumber()
        {
            if (g_bobjEmBrowserReady != true) {
                return;                
            }
            return objEmBrowser.GetAreaNumber();
        }
        
        function fnGetFullName()
        {
            if (g_bobjEmBrowserReady != true) {
                return;                
            }
            return objEmBrowser.GetFullName();
        }
        
        function fnGetPointNumber()
        {
            if (g_bobjEmBrowserReady != true) {
                return;                
            }
            return objEmBrowser.GetPointNumber();
        }
        
        function fnGetServerStatus()
        {
            if (g_bobjEmBrowserReady != true) {
                return 0;        
            }
            return objEmBrowser.GetServerStatus();
        }
        
        function fnShow(iType)
        {
            if (g_bobjEmBrowserReady != true) {
                return;        
            }
            objEmBrowser.Show(iType);
        }
        
		function fnDisconnectServer()
		{
			if(g_bobjEmBrowserReady != true)
			{
				return;
			}
			objEmBrowser.DisconnectServer();
		}
        
    </script>	
	
    <script language=vbscript>
	    Function Initialize()
            Dim strPBScriptlet
    	    
    	    On Error Resume Next
	        strPBScriptlet = ""
            			        
            strPBScriptlet = window.external.DisplayDirectory & "LocationBrowserScrplt.htm"
	       
	        If 0 = err.Number Then
		        divEmBrowser.innerHtml = _
			        "<OBJECT ID='objEmBrowser'" & _ 
                    "name='nobjEmBrowser' "  & _
	                "style='width:301px; height:392px; " & _
			        "		border: none;' " & _
                    "TYPE='text/x-scriptlet' " & _
                    "DATA='file:\\" & strPBScriptlet & "' " & _
			        "UNSELECTABLE='no' > " & _
			        "</OBJECT>"
    	    End If
	    End Function
    </script>
</head>

<body id=PBbody scroll="no" onload="Initialize()" onresize="SizeChanged()" style="background-color: buttonface">

    <div id="divEmBrowser">
    </div>    

    <script language="jscript"
        FOR="objEmBrowser"
        EVENT="onscriptletevent(sName, oEventData)">

        switch (sName) {
            case "event_onready":
                g_bobjEmBrowserReady = true;
                if (g_bStationObjectReady == true) {
                    objEmBrowser.SetBackgroundColor("buttonface");
                    objEmBrowser.SetStationObject();
                }
                break;
            case "event_onpointselect":
                Handle_OnPointSelect();
                break;
            case "event_onserverstatuschange":
                Handle_OnServerStatusChange();
                break;
            default:
                break;
        }
    </script>

    <script language="jscript">
        function    Handle_OnPointSelect() {
            try {           
            external.OnPointSelected();
            } catch(err) {
            alert("Handle_OnPointSelect catch " + err.number + " " + err.description);
            }
            return;
        }

        function    Handle_OnServerStatusChange() {
            return;
        }
	
        function     SizeChanged() {
            if (g_bobjEmBrowserReady)
            {
                objEmBrowser.style.pixelWidth = PBbody.clientWidth - g_BrowserScrpltGap;
                objEmBrowser.style.pixelHeight = PBbody.clientHeight - g_BrowserScrpltGap;
            }
        }

    </script> 
</body>
</html>
