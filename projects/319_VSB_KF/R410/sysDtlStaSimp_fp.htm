<SCRIPT language=VBScript defer>sub ApplyLayout()
	On error resume next
	GrpLowerPanel.style.top = "" 
	GrpLowerPanel.style.bottom = "0px" 
	GrpCenterPanel.style.top= "" 
	GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight - 2) & "px"
end sub
sub AlmarmState(LinAlmIndex)
dim iPriority,iEnabled
On error resume next
iPriority = sd.DataValue("currentpoint.Al" & (LinAlmIndex+1) & "pri")
iEnabled = sd.DataValue("currentpoint.Al" & (LinAlmIndex+1) & "Armed")
If iPriority>0 and  iEnabled>0 then
  document.getelementbyid("LinAlm"&LinAlmIndex).linecolor = vbBlack
  select case iPriority
    case 1 document.getelementbyid("LinAlm"&LinAlmIndex).linecolor=AlarmStateIconFactory.lowcolor
    case 2 document.getelementbyid("LinAlm"&LinAlmIndex).linecolor=AlarmStateIconFactory.highcolor
    case 3 document.getelementbyid("LinAlm"&LinAlmIndex).linecolor=AlarmStateIconFactory.urgentcolor
  end select
  document.getelementbyid("LinAlm"&LinAlmIndex).title="State " & LinAlmIndex & ": State Alarm"
else
  document.getelementbyid("LinAlm"&LinAlmIndex).linecolor="transparent"
  document.getelementbyid("LinAlm"&LinAlmIndex).title=""
end if
end sub
sub GrpStatesHiddenVisble
on error resume next
if sd.DataValue("CurrentPoint.PVController") = 0 then
	GrpStates.style.visibility = "hidden"
else
	GrpStates.style.visibility = "Visible"   
		for each Obj in GrpStates.children
  			if csng(right(Obj.id,1))<(2^(sd.DataValue("CurrentPoint.ipwidth")+1)) then
				Obj.style.visibility="inherit"
 			else
        		Obj.style.visibility="hidden"
  			end if
		next
end if
end sub
sub ShowHidePvOpMd()
'PV parameter
	if sd.DataValue("CurrentPoint.PVController") = 0  then
		TxtPV.style.visibility="hidden"
		ConAlpPV.style.visibility="hidden"
		call GrpStatesHiddenVisble
	else
		TxtPV.style.visibility="visible"
		ConAlpPV.style.visibility="visible"
		call GrpStatesHiddenVisble
 	end if
'OP parameter
	if sd.DataValue("CurrentPoint.OPController") = 0 and sd.DataValue("CurrentPoint.OPDESTINATION") = vbNullstring  then
		TxtOP.style.visibility="hidden"
		ConCboOP.style.visibility="hidden"
	else
		TxtOP.style.visibility="visible"
		ConCboOP.style.visibility="visible"
	end if
'MD Parameter
	if sd.DataValue("CurrentPoint.MDController") = 0 and sd.DataValue("CurrentPoint.MDDESTINATION") = vbNullstring  then
		TxtMode.style.visibility="hidden"
		ConCboMode.style.visibility="hidden"
	else
		TxtMode.style.visibility="visible"
		ConCboMode.style.visibility="visible"
		page.modeElement = "ConCboMode" ' for Auto selection
	end if
end sub</SCRIPT>
<SCRIPT language=VBScript for=sd defer event=ondatachange>if me.DataChanged("CurrentPoint.PVController") or me.DataChanged("CurrentPoint.OPController") or me.DataChanged("CurrentPoint.OPDESTINATION")or me.DataChanged("CurrentPoint.MDController")or me.DataChanged("CurrentPoint.MDDESTINATION") then
		call ShowHidePvOpMd()
end if
	if me.DataChanged("CurrentPoint.ipwidth") then
		call GrpStatesHiddenVisble
	end if
for i = 1 to 8
	if me.DataChanged("CurrentPoint.Al" & i & "Pri") then
		call AlmarmState(i-1) ' (i-1) is index of object LinAlm
	end if
next
for i = 1 to 8
	if me.DataChanged("CurrentPoint.Al" & i & "Armed") then
		call AlmarmState(i-1)' (i-1) is index of object LinAlm
	end if
next</SCRIPT>
<SCRIPT language=VBScript for=ConAlpAlarmValue defer event=onupdate>on error resume next
	if UCase(me.value)="NONE" or sd.DataValue("CurrentPoint.AlarmPriority") = 0 then
	   me.style.visibility="hidden"
	else
   		me.style.visibility="visible"
	end if</SCRIPT>
<SCRIPT language=VBScript for=ConAlpNumPV defer event=onupdate>dim iValueON, sColor
on error resume next
if ConAlpPVInError.value=1 or ConAlpOnScan.value=0 then

	page.all("ConAlpPVState"&i).styleClass = "General_Inactive_Left_Style"
	If i=me.value then
	   page.all("TxtPV"&i).style.fontweight="bold" : page.all("ConAlpPVState"&i).style.fontweight="bold" : page.all("ShpState"&i).value=iValueON
	else
	   page.all("txtPV"&i).style.fontweight="normal" : page.all("ConAlpPVState"&i).style.fontweight="normal" : page.all("ShpState"&i).value=1
	end if    
	next
else
   iValueON=2
   for i=0 to 7
	page.all("ConAlpPVState"&i).styleClass = "General_Left_Style"
	If i=me.value then
	   page.all("TxtPV"&i).style.fontweight="bold" : page.all("ConAlpPVState"&i).style.fontweight="bold" : page.all("ShpState"&i).value=iValueON
	else
	   page.all("txtPV"&i).style.fontweight="normal" : page.all("ConAlpPVState"&i).style.fontweight="normal" : page.all("ShpState"&i).value=1
	end if    
	next
end if</SCRIPT>
