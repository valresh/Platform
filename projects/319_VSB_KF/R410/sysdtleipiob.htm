<SCRIPT language=VBScript for=sd defer event=ondatachange>if not sd.QualityBad("Currentpoint.NUMCHANNELS") then
	For i = 0 to sd.DataValue("Currentpoint.NUMCHANNELS")-1 
		document.getElementById("GrpAIChannel"&i).Style.Visibility = "Inherit"
		document.getElementById("GrpAOChannel"&i).Style.Visibility = "Inherit"
		document.getElementById("GrpDOChannel"&i).Style.Visibility = "Inherit"
		document.getElementById("ChannelNum"&i).Style.Visibility = "Inherit"
		document.getElementById("ChannelName"&i).Style.Visibility = "Inherit"
		'document.getElementById("pbRow"&i).Style.Visibility = "Inherit"
	Next
End if
if not sd.QualityBad("CurrentPoint.DevType") then
	select case sd.DataValue("CurrentPoint.DevType")
		case 0 'Module is of AI Type
			GrpAI.style.visibility = "Inherit"
			GrpAO.style.visibility = "Hidden"
			GrpDO.style.visibility = "Hidden"
			pbInput.style.visibility = "Visible"
			pbOutPut.style.visibility = "Hidden"
		case 1 'Module is of AO Type
			GrpAI.style.visibility = "Hidden"
			GrpAO.style.visibility = "Inherit"
			GrpDO.style.visibility = "Hidden"
			pbInput.style.visibility = "Hidden"
			pbOutPut.style.visibility = "Visible"
		case 2 'Module is of DI Type
			GrpAI.style.visibility = "Hidden"
			GrpAO.style.visibility = "Hidden"
			GrpDO.style.visibility = "Hidden"
			pbInput.style.visibility = "Visible"
			pbOutPut.style.visibility = "Hidden"
		case 3 'Module is of DO Type
			GrpAI.style.visibility = "Hidden"
			GrpAO.style.visibility = "Hidden"
			GrpDO.style.visibility = "Inherit"
			pbInput.style.visibility = "Hidden"
			pbOutPut.style.visibility = "Visible"
		case 4 'Module is of Device Type
			GrpAI.style.visibility = "Hidden"
			GrpAO.style.visibility = "Hidden"
			GrpDO.style.visibility = "Hidden"
		case else
			GrpAI.style.visibility = "Hidden"
			GrpAO.style.visibility = "Hidden"
			GrpDO.style.visibility = "Hidden"
	end select
end if
if not sd.QualityBad("Currentpoint.NUMCHANNELS") then
	if sd.DataValue("CurrentPoint.NUMCHANNELS")<= 16 then
		pbChannel15.style.visibility = "Hidden"
		pbChannel31.style.visibility = "Hidden"
		pbChannel47.style.visibility = "Hidden"
		pbChannel63.style.visibility = "Hidden"
	elseif sd.DataValue("CurrentPoint.NUMCHANNELS")<= 32 then
		pbChannel15.style.visibility = "Inherit"
		pbChannel31.style.visibility = "Inherit"
		pbChannel47.style.visibility = "Hidden"
		pbChannel63.style.visibility = "Hidden"
	elseif sd.DataValue("CurrentPoint.NUMCHANNELS")<= 48 then
		pbChannel15.style.visibility = "Inherit"
		pbChannel31.style.visibility = "Inherit"
		pbChannel47.style.visibility = "Inherit"
		pbChannel63.style.visibility = "Hidden"
	else
		pbChannel15.style.visibility = "Inherit"
		pbChannel31.style.visibility = "Inherit"
		pbChannel47.style.visibility = "Inherit"
		pbChannel63.style.visibility = "Inherit"
	end if
end if</SCRIPT>

<SCRIPT language=VBScript for=pbChannel15 defer event=onclick>for i = 0 to 15
	DisplayDataRepository.PutValue "Index"&i, i
	document.getElementById("ChannelNum"&i).value = i
next</SCRIPT>

	DisplayDataRepository.PutValue "Index"&i, i+16
	document.getElementById("ChannelNum"&i).value = i+16
