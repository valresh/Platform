<SCRIPT language=VBScript defer>Sub PointDetail(CMName)
	If CMName.value = Empty or CMName.value = "NaN" then
		window.external.TemporaryMessageZoneText Message.value 
	Else 
		window.external.RequestTask 21, 73, 0, 0, 0, CMName.value
	end if
end sub

Sub selection(Sel)
b=Sel
		Document.getElementById("CMNAME" & b).textColor = 50282496
		Document.getElementById("SubSlot" & b).textColor = 50282496
		Document.getElementById("line" & b).style.visibility="Visible"
		Document.getElementById("line" & b).lineColor=50282496
end sub

Sub Deselection(Desel)
c=Desel
		Document.getElementById("CMNAME" & c).textColor = VBBLACK
		Document.getElementById("SubSlot" & c).textColor = VBBLACK
		Document.getElementById("line" & c).style.visibility="Hidden"
		Document.getElementById("line" & c).lineColor=VBBLACK
end sub
Sub Dataupdate()
for i = 1 to 16
Document.getElementById("CMNAME"& i).style.visibility = "Hidden" 
	if Document.getElementById("CM" & i).Value = empty or Document.getElementById("CM" & i).Value = "NaN" then
		Document.getElementById("CMNAME" & i).value= ""
		Document.getElementById("CMNAME"& i).style.visibility = "Hidden" 
	Else
		IOName = Document.getElementById("CM" & i).Value
		dotPos = InStr(1,IOName,".",1)
		CMName = Mid(IOName, 1,dotPos-1)
		Document.getElementById("CMNAME" & i).Value = CMName
		Document.getElementById("CMNAME"& i).style.visibility = "VISIBLE" 
	end if
next
end Sub</SCRIPT>
