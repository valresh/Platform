<SCRIPT language=JScript defer>var OK_ICON = "./Images/Icon_OK.png"
var FAIL_ICON = "./Images/Icon_Fail.png"
var MARGINAL_ICON = "./Images/Icon_Marginal.png"
var SEVERE_ICON = "./Images/Icon_Severe.png"
var TRANSITIONAL_ICON = "./Images/Icon_Transitional.png"
var UNKNOWN_ICON = "./Images/Icon_Unknown.png"
var DISABLED_ICON = "./Images/Icon_Disabled.png"
var BLANK_ICON = "./Images/blank.png"</SCRIPT>
<SCRIPT language=JScript for=alphaCommandResult defer event=onupdate>txtCmdResult.value = "";
if(alphaCommandResult.DataValue("$LCN.CMDRESULT") !== undefined)
{	
	var results = alphaCommandResult.DataValue("$LCN.CMDRESULT").split(";");
	for(var i=0; i < results.length; i++)
	{
		var entry = results[i].split(",");
		var status = -1;
		var result;
		if(entry.length == 2) //multi load
		{
			status = parseInt(entry[0]);
			result = entry[1].replace(/^\s+/g, '');
		}
		else //single node command
		{
			result = results[i].replace(/^\s+/g, '');
		}
		if(status == 0)
		{
			txtCmdResult.innerHTML += "<span class='Command_Result_Item'><img class='Command_Result_Icon' src='" + TRANSITIONAL_ICON + "'>" + result + "</span><br>";
		}
		else if(status == 1)
		{
			txtCmdResult.innerHTML += "<span class='Current_Command_Result_Item'><img class='Command_Result_Icon' src='" + TRANSITIONAL_ICON + "'>" + result + "</span><br>";
		}
		else if(status == 2)
		{
			txtCmdResult.innerHTML += "<span class='Command_Result_Item'><img class='Command_Result_Icon' src='" + OK_ICON + "'>" + result + "</span><br>";
		}
		else if(status == 3)
		{
			txtCmdResult.innerHTML += "<span class='Command_Result_Item'><img class='Command_Result_Icon' src='" + MARGINAL_ICON + "'>" + result + "</span><br>";
		}
		else if(status == 4)
		{
			txtCmdResult.innerHTML += "<span class='Command_Result_Item'><img class='Command_Result_Icon' src='" + FAIL_ICON + "'>"  + result + "</span><br>";
		}
		else if(result != "")
		{
			txtCmdResult.innerHTML += "<span class='Command_Result_Item'>" + result + "</span><br>";
		}
	}
}</SCRIPT>
