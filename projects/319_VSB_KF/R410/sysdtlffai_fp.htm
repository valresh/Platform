<SCRIPT language=VBScript defer>dim gbPageComplete, strCtlBlockName ,PreviousModeAttr
dim HiHipri ,Hipri ,LoLopri ,Lopri ,DevHipri ,DevLopri ,BlockPri
dim HiHiFlag ,HiFlag ,LoLoFlag ,LoFlag ,DevHiFlag ,DevLoFlag ,BlockFlag,iAlarm
dim HiHiAlarm ,HiAlarm ,LoLoAlarm ,LoAlarm ,DevHiAlarm ,DevLoAlarm ,Max1 ,Max2
dim Flag1 , Flag2 ,Flag 
Flag = 1
DevHiPri = 0
DevLoPri = 0

strCtlBlockName = "ai"

	on error resume next
		call ApplyLayout_Stretch(indAIOutValue)

sub AlarmUpdate
on error resume next
dim iAlarm
	On error resume next
	iAlarm = sd.DataValue("CurrentPoint.ai.alarm_sum.current")
	    if (iAlarm and &H2)>0 then
          
			HiHiAlarm  = 10 + HiHipri
        else 
            HiHiAlarm = 0
	    end if 
   
	if (iAlarm and &H8)>0 then
            LoLoAlarm  = 9 + LoLoPri
        else 
            LoLoAlarm = 0
	end if

	if (iAlarm and &H4)>0 then
            HiAlarm    = 8 + Hipri
        else 
            HiAlarm = 0
	end if

	if (iAlarm and &H10)>0 then
            LoAlarm    = 7 + LoPri
        else 
            LoAlarm = 0
	end if

	if (iAlarm and &H20)>0 then
            DevHiAlarm = 6 + DevHiPri
        else 
            DevHiAlarm = 0
	end if

	if (iAlarm and &H40)>0 then
            DevLoAlarm = 5 + DevLoPri
        else 
            DevLoAlarm = 0
	end if

	if (iAlarm and &H80)>0 then
            BlockFlag = 4
        else 
            BlockFlag = 0
	end if
	Call Alarmpri
end sub

sub Alarmpri

if HiHiAlarm > HiAlarm then
    if HiHiAlarm > LoLoAlarm then 
         Flag1 = 2
		 Max1 = HiHiAlarm
    else 
	     if HiHiAlarm = LoLoAlarm then
         Flag1 = 1
		 Max1 = 0
		 else
	     Flag1 = 3
		 Max1 = LoLoAlarm
		 end if
    end if 
else
   if HiAlarm > LoLoAlarm then
        Flag1 = 4
	    Max1 = HiAlarm
   else 
        if HiAlarm = LoLoAlarm then 
		Flag1 = 1 
		Max1 = 0         
        else
		Flag1 = 3
		Max1 = LoLoAlarm
		End if 
   end if
end if


if LoAlarm > DevHiAlarm then
    if LoAlarm > DevLoAlarm then 
         Flag2 = 5
		 Max2 = LoAlarm
    else 
	     if LoAlarm > DevLoAlarm then 
         Flag2 = 1
		 Max2 = 0
		 else 	     
	     Flag2 = 7
		 Max2 = DevLoAlarm
		 end if
    end if 
else
   if DevHiAlarm > DevLoAlarm then
        Flag2 = 6
	    Max2 = DevHiAlarm
   else 
        if DevHiAlarm = DevLoAlarm then
        Flag2 = 1
		Max2 = 0          
        else
		Flag2 = 7
		Max2 = DevLoAlarm
		end if
   end if
end if

If Max1 = Max2 then
flag = 1
else
If Max1 > Max2 then
   Flag = Flag1 
else
   Flag = Flag2
end if 
end if

if Flag = 1 and BlockFlag = 4 then 
   ShpHiAlmType.value = 8 
else
   ShpHiAlmType.value = Flag
end if 
end sub

	end if

end sub</SCRIPT>

<SCRIPT id=4706C234-4E9A-4CA4-AF97-37DAA51B0E66 language=VBScript defer 
shaperefcount="1">sub AlmTP_OnUpdate(oSource, oSource1, oRect)
dim iTop, iHeight, oShape, sToolTipTxt, sEUDesc ,Hilimit
on error resume next
if isnumeric(oSource.currentvalue)and oSource1.value>1 then 
 set oShape=oSource.parentnode.parentnode
 itop=oSource.parentnode.style.pixeltop
 iheight=oSource.parentnode.style.pixelheight
 iheight=oSource.parentnode.style.pixelheight
 pvRange = (oShape.objects("ConAlpPVEUHi").value-oShape.objects("ConAlpPVEULo").value)
 pvRangelo =   oShape.objects("ConAlpPVEULo").value
 iVal = oSource.value

 if oShape.objects("ConAlpHHAlmTP").value = "NaN" or oShape.objects("ConAlpHiAlmTP").value = "NaN" or oShape.objects("ConAlpHHAlmTP").value = "+INF" or oShape.objects("ConAlpHHAlmTP").value = "-INF" or oShape.objects("ConAlpHiAlmTP").value = "+INF" or oShape.objects("ConAlpHiAlmTP").value = "-INF" then
    HiFlag = 0
 elseif (oShape.objects("ConAlpHHAlmTP").value-oShape.objects("ConAlpHiAlmTP").value) = 0 then  
    HiFlag = 0
 else 
    HiFlag = 1
 end if

 if oShape.objects("ConAlpLoAlmTP").value = "NaN" or oShape.objects("ConAlpLLAlmTP").value = "NaN" or oShape.objects("ConAlpLoAlmTP").value = "+INF" or oShape.objects("ConAlpLoAlmTP").value = "-INF" or oShape.objects("ConAlpLLAlmTP").value = "+INF" or oShape.objects("ConAlpLLAlmTP").value = "-INF" then
    LoFlag = 0
 elseif (oShape.objects("ConAlpLoAlmTP").value-oShape.objects("ConAlpLLAlmTP").value) = 0 then  
    LoFlag = 0
 else 
    LoFlag = 1
 end if

 

Select Case Right(oRect.id, 1)

            Case "H"
                If pvRange * iHeight <> 0 Then
                    oRect.Style.pixelHeight = (iHeight ) - (iVal - pvRangeLo) / pvRange * iHeight
                Else
                    oRect.Style.pixelHeight = iHeight
                End If
                oRect.Style.pixelTop = iTop
                
                If Right(oRect.id, 2) = "HH" Then
                    If oRect.Style.pixelHeight < 1 Then oRect.Style.pixelHeight = 1
					
				 Else
					 
					If (oRect.Style.pixelHeight <= 1) Then oRect.Style.pixelHeight = 1  + HiFlag
					 
				 End If 
				
			

            Case "L"
                If pvRange * iHeight <> 0 Then
                    oRect.Style.pixelHeight = (iVal - pvRangeLo) / pvRange * iHeight
                Else
                    oRect.Style.pixelHeight = 0
                End If
                
                If Right(oRect.id, 2) = "LL" Then
                    If oRect.Style.pixelHeight < 1 Then oRect.Style.pixelHeight = 1     'min LoLo pixel height is 3, for tooltip access
                Else
				    
                    If ( oRect.Style.pixelHeight <= 1) Then oRect.Style.pixelHeight = 1  + LoFlag   'min Lo pixel height is 4, so not *arbitrarily* occluded by above
                End If

                oRect.Style.pixelTop = iTop + iHeight - oRect.Style.pixelHeight

  End Select
  call AlmPriority_OnUpdate(oSource1,oRect)
 
else
 oRect.style.visibility="hidden"
end if

end sub

sub AlmPriority_OnUpdate(oSource,oRect)
On Error resume next
if oRect.style.pixelheight>0 then 
  select case oSource.value
    case 3,4,5,6,7
