<SCRIPT language=VBScript defer>Dim CurrScrollBarPosition
Dim NumOfScrolls
Dim gNumAdjParams
Dim NumOfRows
NumOfRows = 20
CurrScrollBarPosition = 0
NumOfScrolls = 0
gNumAdjParams = -1
Dim bPageLoadComplete

Function ChangeParameters()
	Dim i
	For i= 0 to 19
		Dim iTemp
		iTemp = (CurrScrollBarPosition) * 20 + i
		
		If(iTemp > alpNumAdjParams.value) Then
			DisplayDataRepository.PutValue CStr("CONFIGPARAM"&CStr(i)), "-"
		Else
			DisplayDataRepository.PutValue CStr("CONFIGPARAM"&CStr(i)), CStr("CONFIGPARAM(" & CStr(CInt(iTemp)) &")")
		End If
		Next
		For i= 0 to 19
	     iTemp = (CurrScrollBarPosition) * 20 + i
		 document.getElementById("alpNum" & CStr(i)	).value = cstr(iTemp)
		 next
		If NumOfScrolls = 0 Then
			pbFirstPage.disabled = True
			pbLastPage.disabled = True
			pbNextPage.disabled = True
			pbPrevPage.disabled = True
		ElseIf CurrScrollBarPosition > 0 AND CurrScrollBarPosition < NumOfScrolls Then
			pbFirstPage.disabled = False
			pbLastPage.disabled = False
			pbNextPage.disabled = False
			pbPrevPage.disabled = False
		ElseIf CurrScrollBarPosition = 0 Then
			pbFirstPage.disabled = True
			pbLastPage.disabled = False
			pbNextPage.disabled = False
			pbPrevPage.disabled = True
		ElseIf CurrScrollBarPosition = NumOfScrolls Then
			pbFirstPage.disabled = False
			pbLastPage.disabled = True
			pbNextPage.disabled = True
			pbPrevPage.disabled = False
		End If
		PageNo.value = CStr(CurrScrollBarPosition + 1)
End Function</SCRIPT>
