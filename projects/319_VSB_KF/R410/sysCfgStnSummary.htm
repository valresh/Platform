<SCRIPT language=vbscript ExcludeFromShapes="1">
Sub InstallCodebase()
    urlbase	 = location.protocol & "//" & location.host
	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
    install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
    redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub
</SCRIPT>

<SCRIPT language=VBScript for=ServerTypeRaw defer event=onupdate>Select Case ServerTypeRaw.value
Case 5,6,7
  		' EBI Building Manager Server Type
		txtFlexStation.style.visibility="hidden"
		txtStation.style.visibility="visible"
		txtFlexStation1.style.visibility="hidden"
		txtStation1.style.visibility="visible"
Case Else
		' EPKS Server type
		txtFlexStation.style.visibility="visible"
		txtStation.style.visibility="hidden"
		txtFlexStation1.style.visibility="visible"
		txtStation1.style.visibility="hidden"
End Select</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onpagecomplete>If ( ServerTypeRaw.value  = 5 Or ServerTypeRaw.value = 6 Or ServerTypeRaw.value = 7 ) Then
	If IsComfortPointOpen.value = 1 Then
		StnNameTbl.style.visibility = "hidden"
		StnDetLink.style.visibility = "hidden"
	else
		StnNameTbl.style.visibility = "inherit"
		StnDetLink.style.visibility = "inherit"
	End If
	KeyboardTable.style.visibility = "hidden"
	txtKeyType.style.visibility = "hidden"
Else
	StnNameTbl.style.visibility = "inherit"
	StnDetLink.style.visibility = "inherit"
	KeyboardTable.style.visibility = "inherit"
	txtKeyType.style.visibility = "inherit"
End If</SCRIPT>
