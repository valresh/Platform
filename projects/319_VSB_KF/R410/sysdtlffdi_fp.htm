<SCRIPT language=VBScript defer>dim gbPageComplete, strCtlBlockName ,PreviousModeAttr

strCtlBlockName = "di"

Sub ApplyLayout()
	on error resume next
		call ApplyLayout_NoStretch(di)
End Sub

sub AlarmUpdate
dim iAlarm
	On error resume next
	iAlarm = sd.DataValue("CurrentPoint.di.alarm_sum.current")
	
	if (iAlarm and &H4)>0 then
	    ShpHiAlmType.value=4
	elseif (iAlarm and &H80)>0 then
	    ShpHiAlmType.value=8
	else
	    ShpHiAlmType.value=1
	end if
end sub

sub GrantDeny
    on error resume next
	if sd.DataValue("Currentpoint.di.grant_deny.grant.oper") xor sd.DataValue("Currentpoint.di.grant_deny.grant.local") then
		cboModeAttr.value = txtsdPROGRAM.value
	elseif not(sd.DataValue("Currentpoint.di.grant_deny.grant.oper")) then
		cboModeAttr.value = txtsdOPERATOR.value
	else 
		cboModeAttr.value = txtsdNONE.value ' This shouldn't happen
	end if
	PreviousModeAttr = cboModeAttr.value
end sub</SCRIPT>

<SCRIPT language=VBScript for=CboModeAttr defer event=onchange>on error resume next
If me.innerText <> PreviousModeAttr then
	if ucase(me.innerText) = ucase(txtsdOPERATOR.value) then
	sd.DataValue("Currentpoint.di.grant_deny.grant.oper") = 0
	sd.DataValue("Currentpoint.di.grant_deny.grant.local") = 0
	else
	sd.DataValue("Currentpoint.di.grant_deny.grant.oper") = 1
	end if
end if</SCRIPT>

<SCRIPT language=VBScript for=alpAIPVStatus defer event=onupdate>if not sd.QualityBad("currentpoint.di.out_d.status") and sd.DataValue("currentpoint.di.out_d.status") <> Empty then
	ConRectOutStatus.style.visibility = "Visible" : ConTxtOutStatus.style.visibility = "Visible" 
	ConTxtOutStatus.value = left(me.value,1) : ConTxtOutStatus.textColorBlink = me.textColorBlink
	ConTxtOutStatus.textColor = me.textColor
else
	ConRectOutStatus.style.visibility = "Hidden" : 	ConTxtOutStatus.style.visibility = "Hidden"
end if</SCRIPT>

<SCRIPT language=VBScript for=alpAIOutValue001 defer event=onupdate>On error resume next 
 if me.value = "NaN" then
 me.style.visibility = "hidden"
 ConCboPV.style.visibility = "hidden"
 alpAIOutValue002.style.visibility = "visible"
 alpAIOutValue003.style.visibility = "visible"
 else
 me.style.visibility = "Visible"
 alpAIOutValue002.style.visibility = "hidden"
 alpAIOutValue003.style.visibility = "hidden"
 ConCboPV.style.visibility = "visible"
 end if</SCRIPT>

<SCRIPT language=VBScript for=alpAIOutValue003 defer event=onmouseover>me.title = txtsdPV.value & " " & me.value</SCRIPT>

<SCRIPT language=VBScript for=ConCboPV defer event=onmouseover>me.title = txtsdPV.value & " " & me.value</SCRIPT>

<SCRIPT language=VBScript for=PbAlmAck defer event=onclick>on error resume next
window.external.Application.Document.ParentWindow.external.InvokeMenu2 "Acknowledge Alarm"</SCRIPT>

<SCRIPT language=VBScript for=Page defer event=onpagecomplete>on error resume next
	document.title = cstr(ConAlpTagName.value)
	call AlarmUpdate
    cboModeAttr.AddString txtsdPROGRAM.value
	cboModeAttr.AddString txtsdOPERATOR.value</SCRIPT>

<SCRIPT language=VBScript for=sd defer event=ondatachange>if me.DataChanged("CurrentPoint.di.alarm_sum.current") then	call AlarmUpdate

if sd.DataChanged("CurrentPoint.di.MODE.NORMAL") then call OffNormalModeState(sd, ConAlpActualMD, TxtMD, strCtlBlockName, "MODE.NORMAL")

if me.DataChanged("Currentpoint.di.grant_deny.grant.oper") or me.DataChanged("Currentpoint.di.grant_deny.grant.local") then
	call GrantDeny
end if
if not me.QualityBad("CurrentPoint.EENAME") then
	DisplayDataRepository.PutValue "FFLinkName" , me.DataValue("CurrentPoint.EENAME")
end if
If not me.QualityBad("FFLinkName.LINKNUM") then ' CM is assigned to FFLink
  almAlarmState1.style.visibility = "visible"
  almAlarmState.style.visibility = "hidden"
 else
  almAlarmState1.style.visibility = "hidden"
  almAlarmState.style.visibility = "visible"
end if</SCRIPT>

    {
        this.styleClass = "PointName_Style";
        ConAlpDescription.styleClass = "Description_Style";
    }</SCRIPT>
