<SCRIPT language=vbscript ExcludeFromShapes="1">
Sub InstallCodebase()
    urlbase	 = location.protocol & "//" & location.host
	instpage = urlbase & WebDisplayLocation.content & "/" & WebInstallPageName.content
    install  = Escape(urlbase & WebPackageLocation.content & "/" & WebPackageName.content)
    redirect = Escape(location.href)
	window.location = instpage & "?install=" & install & "&redirect=" & redirect
End Sub
</SCRIPT>

<SCRIPT language=VBScript defer>sub CheckSecLvl
	dim strVisibleHidden
	strVisibleHidden = "visible"
	if isnumeric(txtMinSecLvl.value) then
		if txtMinSecLvl.value <= window.external.parent.runtimestatus.securitylevel then
			strVisibleHidden = "hidden"
		end if
	end if
	rectOperGroupID.style.visibility = strVisibleHidden
end sub</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onpagecomplete>' only show LDAP tab if on EBI and not on CPO
	If (ServerTypeRaw.value >= 5 And ServerTypeRaw.value <= 7 And IsComfortPointOpen.value <>1) Then		
		pbLDAPConfig.style.visibility = "inherit"
	Else		
		shpTabs.style.posWidth = 396
		shpTabs.src = "sysstabs2a_1276X849.sha"
		pbLDAPConfig.style.visibility = "hidden"
	End If
	shpTabs.style.visibility = "inherit"
	call CheckSecLvl</SCRIPT>
<SCRIPT language=VBScript for=Page defer event=onoperatorchange>	call CheckSecLvl</SCRIPT>
<SCRIPT language=VBScript for=txtMinSecLvl defer event=onupdate>	call CheckSecLvl</SCRIPT>
<SCRIPT language=JScript defer>function isOperatorConfigured(elem)
{
if (elem.value.length > 0 )
{
	elem.parentElement.style.visibility = "inherit";
}
else
{
	elem.parentElement.style.visibility = "Hidden" // Hide the access level if operator is not configured
}
}</SCRIPT>
