shaperefcount="7">DIM sErrorString

	sErrorString = "--------"

Function IsStsGoodQuality(obj)
	if not obj is nothing and IsObject(obj) then
		if (obj.quality and 192) = 192 then
			IsStsGoodQuality = TRUE
		else
			IsStsGoodQuality = FALSE
		end if
	else
		IsStsGoodQuality = FALSE
	end if
end function</SCRIPT>

<SCRIPT language=VBScript for=shpDetailView_os_version_alpha type="" defer 
event=ondatachange>'
'Sub os_version_alpha_ondatachange
DIM sDataPath, sResult

	on error resume next
	'''''''''''''''''''''
	sDataPath = "."
	sResult = DataFetchShowState(me, sDataPath)
	if Err.Number = 0 then sOsVersion = sResult
	'''''''''''''''''''''
	sDataPath = "."
	sResult = SimpleDataFetch(me, sDataPath)
	if Err.Number = 0 then nSpMajor = sResult
	'''''''''''''''''''''
	sDataPath = "."
	sResult = SimpleDataFetch(me, sDataPath)
	if Err.Number = 0 then nSpMinor = sResult
	'''''''''''''''''''''
	sDataPath = "."
	sResult = SimpleDataFetch(me, sDataPath)
	if Err.Number = 0 then nOsBuild = sResult
	'''''''''''''''''''''
	if sOsVersion = "" then exit sub	' show nothing until we have the base part
	sVersionString = sOsVersion
	if nSpMajor > 0 OR nSpMinor > 0 then
		sVersionString = sVersionString & "  " & shpDetailView_os_service_pack_caption_hidden.value & " " & FormatNumber(nSpMajor, 0)
		if nSpMinor > 0 then
			sVersionString = sVersionString & "." & FormatNumber(nSpMinor, 0)
		end if
	end if
	if nOsBuild > 0 then
		sVersionString = sVersionString & "  " & shpDetailView_os_build_number_caption_hidden.value & " " & FormatNumber(nOsBuild, 0, TristateFalse, TristateFalse, TristateFalse)
	end if
	me.value = sVersionString
'End Sub os_version_alpha_ondatachange
'</SCRIPT>

<SCRIPT language=VBScript for=txtMACAddress defer event=onupdate>dim strPointPath, strPortObject, strPortStatusParamBase, ix, sMACAddress

	on error resume next

	sMACAddress = me.value
	if sMACAddress <> "" then
		shpPortStatus.autoReloadContent = false
		' construct parameter path
		strPortObject = "localhost.[ROOT\HONEYWELL].ControlFirewall.MACAddress=""" & sMACAddress & """"
		shpPortStatus.SetCustomProperty "Parameter", "FPGARevisionParam", strPortObject & ".FpgaRevision"
		shpPortStatus.SetCustomProperty "Parameter", "FPGABuildParam", strPortObject & ".FpgaBuild"
		shpPortStatus.SetCustomProperty "Parameter", "MicroRevisionParam", strPortObject & ".MicroRevision"
		shpPortStatus.SetCustomProperty "Parameter", "MicroBuildParam", strPortObject & ".MicroBuild"
		shpPortStatus.SetCustomProperty "Parameter", "HdwRevisionParam", strPortObject & ".HwRevision"
		shpPortStatus.SetCustomProperty "Parameter", "HdwBuildParam", strPortObject & ".HwBuild"
		shpPortStatus.SetCustomProperty "Parameter", "NbrPorts", strPortObject & ".NumberOfPorts"
		strPortStatusParamBase = strPortObject & ".PortState."
		for ix = 0 to 8
		 	shpPortStatus.SetCustomProperty "Parameter", "Port" & CStr(ix) & "StateParam", strPortStatusParamBase & CStr(ix)
		next
		strPointPath = displayDataRepository.GetValue("CurrentPoint")
		shpPortStatus.SetCustomProperty "Point", "SPSPoint", strPointPath
		' MsgBox "SetCustomProperty SPSPoint: " & strPointPath & vbcrlf & "strPortObject=" & strPortObject
		shpPortStatus.ReloadContent
	end if</SCRIPT>

	on error resume next

	sSPSPoint = shpPortStatus_grpStatus.parentElement.GetCustomProperty("Point","SPSPoint")
	sRevParam = shpPortStatus_grpStatus.parentElement.GetCustomProperty("Parameter","FpgaRevisionParam")
	sBuildParam = shpPortStatus_grpStatus.parentElement.GetCustomProperty("Parameter","FpgaBuildParam")
	if sSPSPoint = "" Or sRevParam = "" Or sBuildParam = "" then
		' MsgBox "alphaFpgaRevision_ondatachange: invalid custom props"
		exit sub
	end if

	Err.Clear
	fValChanged = me.DataChanged(sSPSPoint & "." & sRevParam)
	if Err.Number = 0 And fValChanged then
		fQualGood = me.QualityGood(sSPSPoint & "." & sRevParam)
		if Err.Number <> 0 then
			sFpgaRevision = ""
		else
			if fQualGood then
				sFpgaRevision = me.DataValue(sSPSPoint & "." & sRevParam)
			else
				sFpgaRevision = ""
			end if
		end if
	end if

	Err.Clear
	fValChanged = me.DataChanged(sSPSPoint & "." & sBuildParam)
	if Err.Number = 0 And fValChanged then
		fQualGood = me.QualityGood(sSPSPoint & "." & sBuildParam)
		if Err.Number <> 0 then
			' MsgBox "Runtime Error accessing SPSPoint.FpgaBuildParam: 0x" & Hex(Err.Number)
			sFpgaBuild = ""
		else
			if fQualGood then
				sFpgaBuild = me.DataValue(sSPSPoint & "." & sBuildParam)
			else
				sFpgaBuild = ""
			end if
		end if
	end if

	if sFpgaRevision <> "" then
		if sFpgaBuild <> "" and sFpgaBuild <> "0" then
			me.value = sFpgaRevision & " build: " & sFpgaBuild
		else
			me.value = sFpgaRevision
		end if
	end if</SCRIPT>

<SCRIPT language=VBScript for=shpPortStatus_alphaPortStatus defer 
event=ondatachange>DIM fValChanged, fQualGood, sSPSPoint, sParam, sName, sKey, wValue, sLink, sSpeed, sDuplex

DIM nNbrPorts

nNbrPorts = 1

DIM sRevParam, sBuildParam, sFPGAValue

	on error resume next
	
'	if me.QualityGood("SPSPoint.FPGARevisionParam") then
'		sFPGAValue = me.DataValue("SPSPoint.FPGARevisionParam")
'	else
'		sFPGAValue = ""
'	end if

'msgbox "sFPGAValue is " & sFPGAValue

'	if me.QualityGood("SPSPoint.FPGABuildParam") then
'		sFGPAValue = sFGPAValue & " build: " & me.DataValue("SPSPoint.FPGABuildParam")
'	end if
'
'	shpPortStatus_alphaFPGARevision.value = sFPGAValue

'msgbox shpPortStatus_alphaFPGARevision.value

	sSPSPoint = shpPortStatus_grpStatus.parentElement.GetCustomProperty("Point","SPSPoint")
	if sSPSPoint = "" then
		' MsgBox "alphaPortStatus_ondatachange: invalid SPSPoint property"
		exit sub
	end if


	if not me.QualityGood("spspoint.nbrports") then
		txtNoPorts.style.visibility = "Inherit"
'		grpPortStatus.style.visibility = "Hidden"
'		msgbox "bad quality NbrPorts!"
		exit sub
	else
		txtNoPorts.style.visibility = "Hidden"
		grpPortStatus.style.visibility = "Inherit"
		nNbrPorts = me.DataValue("spspoint.nbrports")
	end if

'

	for ix = 0 to nNbrPorts-1 '8
		sParam = ""
		sName = CStr(ix)
		if ix = 0 then sName = shpPortStatus_textUplinkLabel.value
		sKey = "PORT" & sName
	 	sParam = shpPortStatus_grpStatus.parentElement.GetCustomProperty("Parameter", "Port" & CStr(ix) & "StateParam")
		if sParam <> "" then
			Err.Clear
			fValChanged = me.DataChanged(sSPSPoint & "." & sParam)
			if Err.Number = 0 And fValChanged then
				fQualGood = me.QualityGood(sSPSPoint & "." & sParam)
				if Err.Number = 0 And fQualGood then
					wValue = me.DataValue(sSPSPoint & "." & sParam)
					if Err.Number = 0 then
						if IsObject(shpPortStatus_lvPortStatus) then
							if NOT fInitialized then
								shpPortStatus_lvPortStatus.Font.Name = "tahoma"
								shpPortStatus_lvPortStatus.Font.Bold = false
								shpPortStatus_lvPortStatus.Font.Size = 10
								shpPortStatus_lvPortStatus.ColumnHeaders.Clear
								shpPortStatus_lvPortStatus.ColumnHeaders.Add 1, , "Port#", 95
								shpPortStatus_lvPortStatus.ColumnHeaders.Add 2, , "Link", 100
								shpPortStatus_lvPortStatus.ColumnHeaders.Add 3, , "Speed", 100
								shpPortStatus_lvPortStatus.ColumnHeaders.Add 4, , "Duplex", 100
								fInitialized = true
							end if

							' do we need to add the item?
							if shpPortStatus_lvPortStatus.ListItems(sKey).Text = "" then
								shpPortStatus_lvPortStatus.ListItems.Add ix + 1, sKey , sName
							end if
							' does it exist now?
							if shpPortStatus_lvPortStatus.ListItems(sKey).Text <> "" then
								' update the subitems
								' MsgBox " Port" & ix & " value: " & CStr(wValue)
								'Port State decode: 7 = Speed; 6 = Duplex; 5 = Link; 4 = Enable; 3:1 = 0 (reserved); 0 ???
								if wValue AND 128 then
									sSpeed = "100MBit"
								else
									sSpeed = "10MBit"
								end if
								if wValue AND 64 then
									sDuplex = "Full"
								else
									sDuplex = "Half"
								end if
								if wValue AND 32 then
									sLink = "Up"
								else
									sLink = "Down"
								end if
								shpPortStatus_lvPortStatus.ListItems(sKey).SubItems(1) = sLink
								shpPortStatus_lvPortStatus.ListItems(sKey).SubItems(2) = sSpeed
								shpPortStatus_lvPortStatus.ListItems(sKey).SubItems(3) = sDuplex
								shpPortStatus_lvPortStatus.BackColor = vbWhite 
								shpPortStatus_lvPortStatus.ForeColor = vbBlack 
							else
								' MsgBox "Failed adding item: " & CStr(ix)
							end if
						else
							' MsgBox "shpPortStatus_lvPortStatus is not an object"
						end if
					else
						' MsgBox "Error getting DataValue for: " & sKey & " error: " & CStr(Err.Number)
					end if
				else
					' MsgBox "Removing BadQuality port: " & sKey
					shpPortStatus_lvPortStatus.BackColor = vbBlack 
					shpPortStatus_lvPortStatus.ForeColor = vbWhite 
				end if
			else
				' MsgBox "Error checking for DataChanged for: " & sKey & " error: " & CStr(Err.Number)
			end if
		else
			' MsgBox "Empty custom param for: " & sKey 
		end if	
	next</SCRIPT>
