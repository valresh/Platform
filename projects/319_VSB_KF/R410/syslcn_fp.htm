<SCRIPT language=JScript defer>OVERRIDE_CMDSTS = "NEED OVERRIDE"
function ExpandStatusAck()
{
	statusAck.style.top = 30
	statusAck.style.height = 146
	statusAckOverlay.style.height = 145
	btnStatusAck.style.height = 32
	statusAckHeading.style.height = 16
	statusAckText.style.height = 50
	btnStatusAck.style.top = 105
	statusAckHeading.style.top = 6
	statusAckText.style.top = 25
	if(toggleAck.className == "TabOpenSimple")
	{
		toggleAck.className = "TabOpenOverlay"
	}
}
function ShrinkStatusAck()
{
	statusAck.style.top = 57
	statusAck.style.height = 118
	statusAckOverlay.style.height = 118
	btnStatusAck.style.height = 32
	statusAckHeading.style.height = 16
	statusAckText.style.height = 50
	btnStatusAck.style.top = 78
	statusAckHeading.style.top = 6
	statusAckText.style.top = 25
	if(toggleAck.className == "TabOpenOverlay")
	{
		toggleAck.className = "TabOpenSimple"
	}
}
function ResetButtons()
{
	btnSave.disabled = false
	btnDump.disabled = false
	btnLoad.disabled = false
	btnShutdown.disabled = false
	btnLoad.className = "Flat_Button_Style"
	btnSave.className = "Flat_Button_Style"
	btnDump.className = "Flat_Button_Style"
	btnShutdown.className = "Flat_Button_Style"	
}
function DisableButtons()
{
	btnSave.disabled = true
	btnDump.disabled = true
	btnLoad.disabled = true
	btnShutdown.disabled = true
	btnLoad.className = "Flat_Button_Disabled_Style"
	btnSave.className = "Flat_Button_Disabled_Style"
	btnDump.className = "Flat_Button_Disabled_Style"
	btnShutdown.className = "Flat_Button_Disabled_Style"
}
function UpdateCommandStatus()
{
	if(alphaCommandStatus.value == "")
	{
		cmdAck.style.visibility = "hidden"
		alphaCommandFeedback.value = ""
		cmdFailText.value = ""
		ResetButtons()
		ShrinkStatusAck()
		return
	}
	if(alphaCommandStatus.value == OVERRIDE_CMDSTS)
	{
		DisableButtons()
		btnShutdown.disabled = false
		btnShutdown.className = "Flat_Button_Highlight_Style"
		loadMsg = "Press Shutdown to proceed with override"
		window.external.showCallout(btnShutdown, loadMsg, 3, 1)
		return
	}
	cmdSts = alphaCommandStatus.value.split(",");
	if(cmdSts.length < 5)
	{
		alphaCommandFeedback.value = "Unknown"
		return; //cmdsts must have 5 fields
	}
	var state = cmdSts[0].toLowerCase()
	var cmdType = cmdSts[1].toLowerCase()
	var multiLoad = false
	if(cmdSts[2].toLowerCase() == "true")
	{
		multiLoad = true;
	}
	//Check if node type contains UCN information
	var nodeType;
	var ucnNodeNum = 0;
	var isUCNNode = false;
	if(cmdSts[3].indexOf('UCN') >= 0)
	{
		isUCNNode = true;
		var ucnInfo = cmdSts[3].split(" ")
		if(ucnInfo.length == 3)
		{
			ucnNodeNum = parseInt(ucnInfo[1])
			nodeType = ucnInfo[2]
		}
	}
	else
	{
		nodeType = cmdSts[3];
	}
	var nodeNum = parseInt(cmdSts[4])
	var errorStatus = "";
	if(cmdSts.length == 6)
	{
		errorStatus = cmdSts[5].toLowerCase()
	}
	if(nodeNum < 10)
	{
		nodeNum = "0" + nodeNum
	}
	if(isUCNNode && ucnNodeNum < 10)
	{
		ucnNodeNum = "0" + ucnNodeNum
	}
	if(state == "done")
	{
		DisableButtons()
		ExpandStatusAck()
		cmdFailHeading.value = cmdType.toUpperCase() + " DONE";
		if(multiLoad)
		{
			cmdFailText.value = "Multi " + cmdType + " completed."
		}
		else
		{
			if(isUCNNode)
			{
				cmdFailText.value = "UCN" + ucnNodeNum + " " + nodeType + nodeNum + " " + cmdType + " completed."
			}
			else
			{
				cmdFailText.value = nodeType + nodeNum + " " + cmdType + " completed."
			}
		}
		cmdAck.style.visibility = "visible"
	}
	else if(state == "busy")
	{
		ShrinkStatusAck()
		cmdAck.style.visibility = "hidden"
		DisableButtons()
		if(alphaNodeNo.value && alphaNodeNo.value != "" && alphaNodeType.value && alphaNodeType.value != "")
		{
			if(parseInt(nodeNum) == parseInt(alphaNodeNo.value) && nodeType.toLowerCase() == alphaNodeType.value.toLowerCase())
			{
				if(cmdType == "load")
				{
					btnLoad.className = "Flat_Button_Busy_Style"
				}
				else if(cmdType == "dump")
				{
					btnDump.className = "Flat_Button_Busy_Style"
				}
				else if(cmdType == "save")
				{
					btnSave.className = "Flat_Button_Busy_Style"
				}
				else if(cmdType == "shutdown")
				{
					btnShutdown.className = "Flat_Button_Busy_Style"
				}
			}
		}
		var displayState = "Busy... "
		if(multiLoad)
		{
			displayState = "Multi... "
		}
		if(cmdType == "load")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Loading"
		}
		else if(cmdType == "dump")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Dumping"
		}
		else if(cmdType == "save")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Saving"
		}
		else if(cmdType == "shutdown")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Shutdown"
		}
		else if(cmdType == "restore")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Restoring"
		}
	}
	else if(state == "fail")
	{
		DisableButtons()
		ExpandStatusAck()
		cmdFailHeading.value = cmdType.toUpperCase() + " FAIL";
		if(multiLoad)
		{
			cmdFailText.value = "Multi " + cmdType + " operation failed."
		}
		else
		{
			if(isUCNNode)
			{
				cmdFailText.value = "UCN" + ucnNodeNum + " " + nodeType + nodeNum + " - " + errorStatus + "."
			} 
			else
			{
				cmdFailText.value = nodeType + nodeNum + " - " + errorStatus + "."
			}	
		}
		cmdAck.style.visibility = "visible"
	}
}</SCRIPT>

	End if

peripheralIcon = BLANK_ICON
peripheralBlinkIcon = BLANK_ICON
Function UpdatePeripheral()
	if(alphaNodeType.value = "US") Then
		PeripheralStatus.style.visibility = "inherit"
		Select case alphaCompoPeriphSts.value
			case "????"
				txtPeripheral.value = "UNKNOWN"
			case "OK"
				txtPeripheral.value = "OK"
			case "FAIL"
				txtPeripheral.value = "FAIL"
				peripheralIcon = PERIPHERAL_ICON
				peripheralBlinkIcon = PERIPHERAL_BLINK_ICON
			case ""
				PeripheralStatus.style.visibility = "hidden"
			case "SERVICE"
				txtPeripheral.value = "SERVICE"
				peripheralIcon = PERIPHERAL_ICON
				peripheralBlinkIcon = PERIPHERAL_BLINK_ICON
			case else
				txtPeripheral.value = "UNKNOWN"
		End select
	else
		PeripheralStatus.style.visibility = "hidden"
	End if
	iconPeripheral.src = peripheralIcon
End Function
Function UpdateMaintenance()
	if(alphaMantExists.value = "TRUE") Then
		iconMaintenance.src = MAINT_ICON
		Maintenance.style.visibility = "inherit"
	else
		Maintenance.style.visibility = "hidden"
	End if
End Function
ledNodeStatusIcon = ".\Images\blank.png"
ledNodeStatusBlinkIcon = ".\Images\blank.png"
Function UpdateNodeStatusIcon()
	Select case alphaNodeStatus.value
		case "OK"
			ledNodeStatusIcon = OK_ICON
			ledNodeStatusBlinkIcon = OK_ICON
        case "BACKUP"
            ledNodeStatusIcon = OK_ICON
            ledNodeStatusBlinkIcon = OK_ICON
		case "WARN"
			ledNodeStatusIcon = MARGINAL_ICON
			ledNodeStatusBlinkIcon = MARGINAL_BLINK_ICON
		case "FAIL"
			ledNodeStatusIcon = FAIL_ICON
			ledNodeStatusBlinkIcon = FAIL_BLINK_ICON
		case "SEVERE"
			ledNodeStatusIcon = SEVERE_ICON
			ledNodeStatusBlinkIcon = SEVERE_BLINK_ICON
		case "QUALIF","PWR_ON","NET_LD","LOC_LD","TEST","READY","UPGRADE"
			ledNodeStatusIcon = TRANSITIONAL_ICON
			ledNodeStatusBlinkIcon = TRANSITIONAL_BLINK_ICON
		case "ISOL"
			ledNodeStatusIcon = UNKNOWN_ICON
			ledNodeStatusBlinkIcon = UNKNOWN_BLINK_ICON
		case "OFF"
			ledNodeStatusIcon = DISABLED_ICON
			ledNodeStatusBlinkIcon = DISABLED_ICON
		case "UNAVL"
			ledNodeStatusIcon = DISABLED_ICON
			ledNodeStatusBlinkIcon = DISABLED_ICON			
		case else
			ledNodeStatusIcon = UNKNOWN_ICON
			ledNodeStatusBlinkIcon = UNKNOWN_BLINK_ICON
	End select
	ledNodeStatus.src = ledNodeStatusIcon
End Function
Function UpdateLCNCommStatus()
	if(alphaNodeStatus.value = "OFF") Then
		alphaLCNCommText = "UNKNOWN"
		ledLCNComm.src = UNKNOWN_ICON		
	elseif(alphaComSts.value = "OK") Then
		alphaLCNCommText = "OK"
		ledLCNComm.src = OK_ICON
	elseif(alphaComSts.value = "SUSPCT" or alphaComSts.value = "????") Then
		alphaLCNCommText = "SUSPECT" 
		ledLCNComm.src = MARGINAL_ICON
	elseif(alphaComSts.value = "FAIL") Then
		alphaLCNCommText = "FAIL"
		ledLCNComm.src = FAIL_ICON
	else
		alphaLCNCommText = "UNKNOWN"
		ledLCNComm.src = UNKNOWN_ICON
	end if
End Function
Function DisplayTagNames()
	'Displays the Reundant Node Pair (Only AM, NIM and HG)
	if (alphaNodeType.value = "NM" or alphaNodeType.value = "HG" or alphaNodeType.value = "AM") Then
		if(alphaRedundancy.value = "P" or alphaRedundancy.value = "S") Then
			Dim redunPairNo
			if(alphaRedunPairNo.value < 10 ) Then
				redunPairNo = "0"+CStr(alphaRedunPairNo)
			else
				redunPairNo = CStr(alphaRedunPairNo)
			end if
			Dim redunTagName
			if (alphaNodeType.value <> "") Then
				redunTagName = alphaNodeType.value + redunPairNo
			End if
			if(alphaRedundancy.value = "P") Then
				alphaPrimaryNodeTagname.value = alphaItemName.value
				alphaSecondaryNodeTagname.value = redunTagName
				alphaPrimaryNodeTagname.className = "ActiveText"
				alphaSecondaryNodeTagname.className = "NonActiveText"
			elseif(alphaRedundancy.value = "S") Then
				alphaPrimaryNodeTagname.value = redunTagName
				alphaSecondaryNodeTagname.value = alphaItemName.value
				alphaSecondaryNodeTagname.className = "ActiveText"
				alphaPrimaryNodeTagname.className = "NonActiveText"
			end if
		else
			alphaPrimaryNodeTagname.value = alphaItemName.value
			alphaPrimaryNodeTagname.className = "ActiveText"
			alphaSecondaryNodeTagname.value = ""
		end if
	else
		alphaPrimaryNodeTagname.value = alphaItemName.value
		alphaPrimaryNodeTagname.className = "ActiveText"
	end if
End Function
Function UpdateRedundantIcons()
	'Displays Primary Secondary Icons
	if ((alphaNodeType.value = "NM" or alphaNodeType.value = "HG" or alphaNodeType.value = "AM") and alphaRedundancy.DataValue("CurrentPoint.NODEACTSTATE") = "RUNNING") Then
		if(alphaRedundancy.value = "P") Then
			primaryNodeRedunStatus.style.visibility = "inherit"
			secondaryNodeRedunStatus.style.visibility = "inherit"
			primaryNodeRedunStatus.src = ".\Images\Primary Selected.png"
			secondaryNodeRedunStatus.src = ".\Images\Secondary.png"
		elseif(alphaRedundancy.value = "S") Then
			primaryNodeRedunStatus.style.visibility = "inherit"
			secondaryNodeRedunStatus.style.visibility = "inherit"
			primaryNodeRedunStatus.src = ".\Images\Primary.png"
			secondaryNodeRedunStatus.src = ".\Images\Secondary Selected.png"
		else
			primaryNodeRedunStatus.style.visibility = "hidden"
			secondaryNodeRedunStatus.style.visibility = "hidden"		
		end if
	else
		primaryNodeRedunStatus.style.visibility = "hidden"
		secondaryNodeRedunStatus.style.visibility = "hidden"		
	end if
End Function
nwStatusIcon = ".\Images\blank.png"
nwStatusBlinkIcon = ".\Images\blank.png"
Function UpdateNetworkHiwayStatus()
	'Displays the Network Hiway (Only NM and HG)
	if(alphaNodeType.value = "NM" or alphaNodeType.value = "HG") Then
		DisplayProcessNetwork = True
		'Make visible the network/hiway information
		NetworkHiwayInfo.style.visibility = "inherit"
		if IsNumeric(alphaNetNo.value) Then
			alphaNetworkHiwayText.style.left = 19
			alphaNetworkHiwayText.style.width = 125
			if(alphaNodeType.value = "NM") Then
				networkType = "UCN"
			else
				networkType = "HWY"
			end if
			lblNetworkHiway.value = networkType + " Status"
			if(alphaNetNo.value < 10 ) Then
				alphaNetworkHiwayText.value = networkType+" 0"+CStr(alphaNetNo.value)
			else
				alphaNetworkHiwayText.value = networkType+" "+CStr(alphaNetNo.value)
			end if
			'Determine which icon to show
			if(alphaNWSts.value = "OK") Then
				nwStatusIcon = OK_ICON
				nwStatusBlinkIcon = OK_ICON
			elseif(alphaNWSts.value = "FAILURE") Then
				nwStatusIcon = FAIL_ICON
				nwStatusBlinkIcon = FAIL_BLINK_ICON
			elseif(alphaNWSts.value = "IDLE") Then
				nwStatusIcon = MARGINAL_ICON
				nwStatusBlinkIcon = MARGINAL_BLINK_ICON
			elseif(alphaNWSts.value = "UNAVAIL") Then
				nwStatusIcon = DISABLED_ICON
				nwStatusBlinkIcon = DISABLED_ICON
			else
				nwStatusIcon = UNKNOWN_ICON
				nwStatusBlinkIcon = UNKNOWN_BLINK_ICON
			end if
			ledNetworkHiway.src = nwStatusIcon
		else
			alphaNetworkHiwayText.value = "UNKNOWN"
		end if
	else
		'Hide the network/hiway information
		NetworkHiwayInfo.style.visibility = "hidden"
	end if
End Function
Function DisplaySaveButton()
	'Displays Save button (For all nodes, except US, HM and NG)
	if(alphaNodeType.value <> "US" and alphaNodeType.value <> "HM" and alphaNodeType.value <> "NG")  Then
		'Moving common command buttons below save button
		btnLoad.style.top = 96
		btnShutdown.style.top = 96
		btnDump.style.top = 135
		btnNativeWindow.style.top = 135
		btnSave.style.visibility = "inherit"
	else
		'Move common command buttons commands up
		btnSave.style.visibility = "hidden"
		btnLoad.style.top = 57
		btnShutdown.style.top = 57
		btnDump.style.top = 96
		btnNativeWindow.style.top = 96
	end if
End Function
Function UpdateConsole()
	if (alphaNodeType.value = "US") Then
		'Make visible the console information
		DisplayConsole = True
		ConsoleInfo.style.visibility = "inherit"
		if(IsNumeric(alphaConsoleNo.value)) Then
			if(alphaConsoleNo.value < 10 ) Then
				alphaConsoleText.value = "CN0"+CStr(alphaConsoleNo.value)
			else
				alphaConsoleText.value = "CN"+CStr(alphaConsoleNo.value)
			end if
		else
			alphaConsoleText.value = "UNKNOWN"
		end if
	else
		'Hide the aux information
		ConsoleInfo.style.visibility = "hidden"
	end if
End Function
Function UpdateHistoryCollection()
	' Displays the History Collection (Only HM Nodes)
	if (alphaNodeType.value = "HM") Then
		DisplayHistoryCollection = True
		HistoryCollectionInfo.style.visibility = "inherit"
		if(alphaHstSts.value = "Y") Then
			alphaHistoryCollectionText.value = "YES"
			iconHistoryCollection.src = COLLECTION_ICON
		elseif(alphaHstSts.value = "N") Then
			alphaHistoryCollectionText.value = "NO"
			iconHistoryCollection.src = BLANK_ICON
		else
			alphaHistoryCollectionText.value = "UNKNOWN"
			iconHistoryCollection.src = BLANK_ICON
		End if
	else
		HistoryCollectionInfo.style.visibility = "hidden"
	end if
End Function
Function UpdateMaintenanceStatus()
	' Displays the Maintenane Status
	if(alphaMantExists.value = "TRUE") Then
		alphaMaintenanceText.value = "MARGINAL"
		ledMaintenance.className = "led_yellow"
	elseif(alphaMantExists.value = "FALSE") Then
		alphaMaintenanceText.value = "OK"
		ledMaintenance.className = "led_green"
	else
		alphaMaintenanceText.value = "UNKNOWN"
		ledMaintenance.className = "led_black"
	End if
End Function
Function UpdateLayout()
	if(DisplayHistoryCollection = False and DisplayConsole = False and DisplayProcessNetwork = False) Then
		'Move LCN Comm and TPN Status up
		if(DisplayDevidx = False) Then
			LCNComm.style.top = NO_DEVIDX_INFO_TOP
			NodeStatus.style.top = NO_DEVIDX_INFO_TOP + INFO_HEIGHT
			PeripheralStatus.style.top = NO_DEVIDX_INFO_TOP + (INFO_HEIGHT*2)
		else
			LCNComm.style.top = DEVIDX_INFO_TOP
			NodeStatus.style.top = DEVIDX_INFO_TOP + INFO_HEIGHT
			PeripheralStatus.style.top = DEVIDX_INFO_TOP + (INFO_HEIGHT*2)
		End if
	elseif(DisplayDevidx = False) Then
		HistoryCollectionInfo.style.top = NO_DEVIDX_INFO_TOP
		NetworkHiwayInfo.style.top = NO_DEVIDX_INFO_TOP
		ConsoleInfo.style.top = NO_DEVIDX_INFO_TOP
		LCNComm.style.top = NO_DEVIDX_INFO_TOP + INFO_HEIGHT
		NodeStatus.style.top = NO_DEVIDX_INFO_TOP + (INFO_HEIGHT*2)
		PeripheralStatus.style.top = NO_DEVIDX_INFO_TOP + (INFO_HEIGHT*3)
	else
		HistoryCollectionInfo.style.top = DEVIDX_INFO_TOP
		NetworkHiwayInfo.style.top = DEVIDX_INFO_TOP
		ConsoleInfo.style.top = DEVIDX_INFO_TOP
		LCNComm.style.top = DEVIDX_INFO_TOP + INFO_HEIGHT
		NodeStatus.style.top = DEVIDX_INFO_TOP + (INFO_HEIGHT*2)
		PeripheralStatus.style.top = DEVIDX_INFO_TOP + (INFO_HEIGHT*3)		
	End if
End Function
Function UpdateDevidx()
	if(alphaDevidx.QualityGood("CurrentPoint.DEVIDX")) Then
		devidx = alphaDevidx.DataValue("CurrentPoint.DEVIDX")
		if(devidx = 0) Then
			alphaDevidx.value = ""
			DisplayDevidx = False
		elseif(devidx < 10) Then
			alphaDevidx.value = "#00" + CStr(devidx)
		elseif(devidx < 100) Then
			alphaDevidx.value = "#0" + CStr(devidx)
		else
			alphaDevidx.value = "#" + CStr(devidx)
		End if
	End if
End Function
Function UpdateNodeStatus()
	Select case alphaNodeStatus.value
		case "WARN"
			alphaStatusText.value = "WARNING"
		case "QUALIF"
			alphaStatusText.value = "QUALIFIED"
		case "PWR_ON"
			alphaStatusText.value = "POWER ON"
		case "NET_LD"
			alphaStatusText.value = "NET LOAD"
		case "LOC_LD"
			alphaStatusText.value = "LOC LOAD"
		case "ISOL"
			alphaStatusText.value = "ISOLATED"
		case "UNAVL"
			alphaStatusText.value = "UNAVAILABLE"
		case else
			alphaStatusText.value = alphaNodeStatus.value
	End select
End Function
Function UpdateAckMessage()
	if(alphaNodeStatus.DataValue("CurrentPoint.BLINKNODESTS") = "TRUE") Then
		if(alphaNodeNo.value < 10) Then
			nodeNum = "0" + CStr(alphaNodeNo.value)
		else
			nodeNum = CStr(alphaNodeNo.value)
		End if
		Select case alphaNodeStatus.value
			case "FAIL"
				DisplayAckMessage(Cstr(alphaNodeType.value) + nodeNum + " Node failure. Please acknowledge.")
				ack = NODE_STATE_ACK + ";" + CStr(alphaNodeNo.value)
			case "ISOL"
				DisplayAckMessage(Cstr(alphaNodeType.value) + nodeNum + " Node isolated. Please acknowledge.")
				ack = NODE_STATE_ACK + ";" + CStr(alphaNodeNo.value)
			case "WARN"
				DisplayAckMessage(Cstr(alphaNodeType.value) + nodeNum + " Node warning. Please acknowledge.")
				ack = NODE_AUX_STATE_ACK + ";" + CStr(alphaNodeNo.value)
			case "SEVERE"
				DisplayAckMessage(Cstr(alphaNodeType.value) + nodeNum + " Node severe. Please acknowledge.")
				ack = NODE_AUX_STATE_ACK + ";" + CStr(alphaNodeNo.value)
			case "PWR_ON"
				DisplayAckMessage(Cstr(alphaNodeType.value) + nodeNum + " Node power on. Please acknowledge.")
				ack = NODE_STATE_ACK + ";" + CStr(alphaNodeNo.value)
		End select
	else
		statusAck.style.visibility = "hidden"
		toggleAck.style.visibility = "hidden"
	End if
End Function
Function DisplayAckMessage(ackMessage)
	statusAck.style.visibility = "visible"
	toggleAck.style.visibility = "visible"
	statusAckText.value = ackMessage
	toggleAck.className = "TabClose"
End Function
Function UpdateIcons()
	//If the zoom is large enought, use the 2x icons instead
	if(page.style.zoom > 1.5) Then
		OK_ICON = "./Images/Icon_OK_2x.png"
		FAIL_ICON = "./Images/Icon_Fail_2x.png"
		FAIL_BLINK_ICON = "./Images/Icon_Fail_Blink_2x.png"
		MARGINAL_ICON = "./Images/Icon_Marginal_2x.png"
		MARGINAL_BLINK_ICON = "./Images/Icon_Marginal_Blink_2x.png"
		SEVERE_ICON = "./Images/Icon_Severe_2x.png"
		SEVERE_BLINK_ICON = "./Images/Icon_Severe_Blink_2x.png"
		TRANSITIONAL_ICON = "./Images/Icon_Transitional_2x.png"
		TRANSITIONAL_BLINK_ICON = "./Images/Icon_Transitional_Blink_2x.png"
		UNKNOWN_ICON = "./Images/Icon_Unknown_2x.png"
		UNKNOWN_BLINK_ICON = "./Images/Icon_Unknown_Blink_2x.png"
		DISABLED_ICON = "./Images/Icon_Disabled_2x.png"
		MAINT_ICON = "./Images/maint_2x.png"
		MAINT_BLINK_ICON = "./Images/maint_blink_2x.png"
		COLLECTION_ICON = "./Images/collection_2x.png"
		PERIPHERAL_ICON = "./Images/Peripheral_2x.png"
		PERIPHERAL_BLINK_ICON = "./Images/Peripheral Blink_2x.png"
	End if
	UpdateNodeStatusIcon()
	UpdateNetworkHiwayStatus()
	UpdateLCNCommStatus()
	UpdateHistoryCollection()
	UpdateMaintenance()
	UpdatePeripheral()
	UpdateLostEvents()
	UpdateCommandStatus()
End Function</SCRIPT>
