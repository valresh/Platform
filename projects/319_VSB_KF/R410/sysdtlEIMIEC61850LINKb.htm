		'Update the parameters
		Call ChangeParameters
End If</SCRIPT>

<SCRIPT language=VBScript for=PageNo defer event=onchange>On Error Resume Next
Dim iPageNo
If IsNumeric(me.value) Then
	iPageNo = CInt(me.value) - 1
	If iPageNo >=0 AND iPageNo <= NumOfScrolls Then
		CurrScrollBarPosition = iPageNo
		'Update the parameters
		Call ChangeParameters
	Else
		window.external.TemporaryMessageZoneText = Invalidpagenumber.value
		me.value = CInt (CurrScrollBarPosition + 1)
		me.CancelChange
	End If
Else
	window.external.TemporaryMessageZoneText = Invalidpagenumber.value
	me.value = CInt (CurrScrollBarPosition + 1)
	me.CancelChange
End If</SCRIPT>
