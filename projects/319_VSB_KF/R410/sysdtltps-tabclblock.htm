Sub InitPort(objPort, sKey)
Dim sPath
Dim sDebugStr
Dim sTest

'	window.external.Parent.LogMessage "sysdtlswitch_oneportstatus.sha - InitPort TOP..."
	on error resume next  

	sPath = "localhost.[ROOT\SNMP\" & sSwitchName & "].SNMP_RFC1213_MIB_IFTABLE." & sKey

	sTest = objPort.GetCustomProperty("Value", "valuePortKey")
	if sTest = sKey then
' 		Debug/keep
'		window.external.Parent.LogMessage "InitPort - sKey already set for: " & sKey & ", NOT calling SetCustomProperty for this port's custom parameters"
	else

		objPort.autoReloadContent = false
		objPort.SetCustomProperty "Parameter", "paramOperStatus", sPath & ".ifOperStatus"
		objPort.SetCustomProperty "Parameter", "paramPortDescr", sPath & ".ifDescr"
		objPort.SetCustomProperty "Parameter", "paramPortSpeed", sPath & ".ifSpeed"
		objPort.SetCustomProperty "Parameter", "paramPortIndex", sPath & ".ifIndex"
		objPort.SetCustomProperty "Value", "valuePortKey", sKey
		objPort.SetCustomProperty "Point", "pointPort", sPoint

'Debug/keep
		'window.external.Parent.LogMessage "InitPort - sPath= " & sPath
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramOperStatus")
		'window.external.Parent.LogMessage "InitPort - paramOperStatus= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortDescr")
		'window.external.Parent.LogMessage "InitPort - paramPortDescr= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortSpeed")
		'window.external.Parent.LogMessage "InitPort - paramPortSpeed= " & sDebugStr
		'sDebugStr = objPort.GetCustomProperty("Parameter", "paramPortIndex")
		'window.external.Parent.LogMessage "InitPort - paramOperStatus= " & sDebugStr
		'window.external.Parent.LogMessage "sysdtlswitch_oneportstatus.sha - InitPort bottom, calling .ReloadContent on single port..."
		objPort.ReloadContent

	end if

end sub


Sub PDC(objVal, nCol)
Dim sKey

'	window.external.Parent.LogMessage "oneportstatus - PDC TOP..."
	on error resume next ' hides script error, possibly addressed by above change to throttle .ReloadContent calls

	sKey = objVal.parentElement.parentElement.GetCustomProperty("Value", "valuePortKey")

'	window.external.Parent.LogMessage "... PDC sKey=" & sKey

	if sKey = "" then exit sub


	if IsStsGoodQuality(objVal) then 
'		window.external.Parent.LogMessage "oneportstatus - PDC IsStsGoodQuality GOOD, calling PortDataChange..."
		PortDataChange sKey, nCol, objVal.value
'	else
'		window.external.Parent.LogMessage "oneportstatus - PDC IsStsGoodQuality BAD - NOT calling PortDataChange"
	end if

End Sub

Sub PDC100000(objVal)
Dim sKey

	on error resume next
	sKey = objVal.parentElement.parentElement.GetCustomProperty("Value", "valuePortKey")
	if sKey = "" then exit sub
	if IsStsGoodQuality(objVal) then PortDataChange sKey, 0, objVal.value + 100000

End Sub

' End General Section (sysdtlswitch_oneportstatus.sha)
'</SCRIPT>

<SCRIPT language=VBScript for=ListView defer event=ItemClick(Item)>	dim nIdx
	dim sParam
	dim sTemp
	dim nParenIdx

	on error resume next

	'get number from e.g. CLSLOT(12)
	'                     12345678910
	sTemp = Item.subitems(1)	
	nParenIdx = Instr(sTemp, "(")  'e.g. 7
	sTemp = Right(sTemp, len(sTemp) - nParenIdx)  'e.g. 10-7=3, i.e. "12)"
	sTemp = Left(sTemp, len(sTemp) - 1) 'i.e. "12"

	shpSelectedActivity.autoReloadContent = False

	sParam = "CLACTIVE(" & sTemp & ")"

	shpSelectedActivity.SetCustomProperty "parameter", "myParameter", sParam

	shpSelectedActivity.style.visibility = "Inherit"
	shpSelectedActivity.ReloadContent
	shpSelectedActivity.Objects("txtSelectedActivity").value = "CLSLOTS(" & sTemp & ")"


	window.clearInterval(intTimerID2)
  	intTimerID2 = window.setInterval ("HideSelectedActivity", 25000)</SCRIPT>

Function UpdateBlkTimes()
	dim objListItem
	dim sTemp
	dim ix
	dim sIx
	window.clearInterval(intTimerID)
	
	for ix = 1 to sd.DataValue("CurrentPoint.CLSLOTS")
		if sd.DataValue("CurrentPoint.CLACTIVE(" & ix & ")") <> "NOTCONFG" then
			sIx = "CLSLOTS(" & ix & ")" 
			set objListItem = ListView.ListItems.Item(sIx)
			if objListItem is nothing then
				msgbox "Display error: UpdateBlkTimes - ListView's objListItem is nothing; sIx=" & sIx
			else
				sTemp = "blktime" & ix
				objListItem.subitems(8) = shpBlkTimes.Objects(sTemp).value
			end if
		end if
	next

sub UpdateCLSlotList

	dim objListItem
	dim sIx
	dim ix
	sIx = " "
	on error resume next

'	window.external.Parent.LogMessage "sysdtlswitchb.htm - UpdatePortList TOP..."
	ListView.ColumnHeaders.Clear
	ListView.ColumnHeaders.Add 1, , "", 0
	ListView.ColumnHeaders.Add 2, , "Block Index", 120
	ListView.ColumnHeaders.Add 3, , "Block Name", 80
	ListView.ColumnHeaders.Add 4, , "Activity", 80
	ListView.ColumnHeaders.Add 5, , "Insertion Point", 100
	ListView.ColumnHeaders.Add 6, , "Insertion Order", 100
	ListView.ColumnHeaders.Add 7, , "Block Error", 80
	ListView.ColumnHeaders.Add 8, , "Location", 65
	ListView.ColumnHeaders.Add 9, , "Block Time", 260
	ListView.font.name="Tahoma"
	ListView.font.Italic=false
	ListView.font.size=10
	ListView.font.bold=false
'	ListView.SortOrder = 0
'	ListView.SortKey = 1
	ListView.Sorted = false
	ListView.FullRowSelect = true

	if not sd.QualityGood("CurrentPoint.CLSLOTS") then exit sub

	if sd.DataValue("CurrentPoint.CLSLOTS") > 0 then
		for ix = 1 to sd.DataValue("CurrentPoint.CLSLOTS")
			sIx = "CLSLOTS(" & ix & ")" 
			set objListItem = ListView.ListItems.Add(, sIx, "")
			objListItem.Text = sIx
			objListItem.subitems(1) = sIx
			objListItem.subitems(3) = sd.DataValue("CurrentPoint.CLACTIVE(" & ix & ")")
			if sd.DataValue("CurrentPoint.CLACTIVE(" & ix & ")") <> "NOTCONFG" then
				objListItem.subitems(2) = sd.DataValue("CurrentPoint.BLKNAME(" & ix & ")")
				objListItem.subitems(4) = sd.DataValue("CurrentPoint.INSPOINT(" & ix & ")")
				objListItem.subitems(5) = sd.DataValue("CurrentPoint.INSORDER(" & ix & ")")
				objListItem.subitems(6) = sd.DataValue("CurrentPoint.CLBLKERR(" & ix & ")")
				objListItem.subitems(7) = sd.DataValue("CurrentPoint.CLERRLOC(" & ix & ")")
			end if

		next
	end if
end sub

sub ActivityChanged()

	dim sIdx
	dim objListItem

	window.clearInterval(intTimerID2)
  	intTimerID2 = window.setInterval ("HideSelectedActivity", 25000)

'	on error resume next
	sIdx = shpSelectedActivity.Objects("txtSelectedActivity").value

	if left(sIdx, 7) <> "CLSLOTS" then 
		exit sub 'initial update from empty shape, unused
	end if
	set objListItem = ListView.ListItems.Item(sIdx)
	if objListItem is nothing then
		msgbox "Activity changed: objListItem is nothing! sIdx=" & sIdx
	else
'		msgbox "setting CLACTIVE for " & sIdx & " to " & shpSelectedActivity.Objects("combobox001").value
		objListItem.subitems(3) = shpSelectedActivity.Objects("combobox001").value
	end if

end sub

	window.clearInterval(intTimerID2)
	shpSelectedActivity.style.visibility = "Hidden"

<SCRIPT language=VBScript for=Page defer event=onpagecomplete>	dim sEntType
	dim idxTabs
	dim sDispType
	dim bTrend
	bTrend = true

	pbGeneral.style.visibility = "Inherit"
  	intTimerID = window.setInterval ("UpdateBlkTimes()", 750)
	intTimerID3 = window.setInterval ("UpdateListViewValues()", 10000)
	sDispType = sdTabInfo.DataValue("CurrentPoint.DISPTYPE")	
	sEntType = sdTabInfo.DataValue("CurrentPoint.ENT_TYPE")

	select case sDispType 'determine if 3rd or 6th tab

		case "LOGIC" 
			idxTabs = 2
			bTrend = false
		case "ACID"
			idxTabs = 2
			bTrend = false
		case "NULL"
			idxTabs = 2
			bTrend = false
		case "ARRAY"
			idxTabs = 2
			bTrend = false
		case "CUSTOM"
			idxTabs = 2
			bTrend = false
		case "SEQUENCE"
			idxTabs = 2
			bTrend = false
		case "DIGCOMP"
			idxTabs = 2
		case "DIGIN"
			idxTabs = 2
		case "DIGOUT"
			idxTabs = 2
		case "DIGINOUT"
			idxTabs = 2
		case "DEVCTL"
			idxTabs = 2
		case "SWITCH"
			idxTabs = 2
			bTrend = false
		case "SWITCHAM"
			idxTabs = 2
			bTrend = false
		case else
			idxTabs = 4
	end select

	'PV Info and Ctl Tuning pair
	if idxTabs <> 2 then 'not "basic"
		pbPvInfo.style.visibility = "Inherit"  
		if sdTabInfo.DataValue("CurrentPoint.DISPTYPE") = "RAMPSOAK" then 
			pbCtlTuningRampsoak.style.visibility = "Inherit"
			pbCtlTuning.style.visibility = "Hidden"
		else
			pbCtlTuningRampsoak.style.visibility = "Hidden"
			pbCtlTuning.style.visibility = "Inherit"
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.PNTTYPE")and sdTabInfo.DataValue("CurrentPoint.PNTTYPE") = "LOGIC" then
		if sdTabInfo.QualityGood("CurrentPoint.PNTNODTY") and (sdTabInfo.DataValue("CurrentPoint.PNTNODTY") = "LM" or sdTabInfo.DataValue("CurrentPoint.PNTNODTY") = "SM" or sdTabInfo.DataValue("CurrentPoint.PNTNODTY") = "HPM") then
			pbLogicView.style.left = arrayTabs(idxTabs)
			idxTabs = idxTabs + 1
			pbLogicView.style.visibility = "Inherit"
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.NOPINPTS") then
		if (sEntType = "REGAM" or sEntType = "REGPVNIM") and sdTabInfo.DataValue("CurrentPoint.NOPINPTS") > 0 then
			pbPVConnect.style.Left = arrayTabs(idxTabs)
			idxTabs = idxTabs + 1
			pbPVConnect.style.visibility = "Inherit"
		end if
	end if

	if sdTabInfo.QualityGood("CurrentPoint.NOCINPTS") and sdTabInfo.QualityGood("CurrentPoint.NOCOPTS") then
		if sdTabInfo.DataValue("CurrentPoint.NOCINPTS") > 0 or sdTabInfo.DataValue("CurrentPoint.NOCOPTS") > 0 then  'show if either...
			pbCtlConnect.style.Left = arrayTabs(idxTabs)
			idxTabs = idxTabs + 1
			pbCtlConnect.style.visibility = "Inherit"
		end if
	end if
	
	if sdTabInfo.QualityGood("CurrentPoint.CCINPT") then
		if sdTabInfo.DataValue("CurrentPoint.CCINPT") = "YES" and (sEntType = "REGAM" or sEntType = "COUNTER" or sEntType = "TIMER") then  
			pbCutout.style.Left = arrayTabs(idxTabs)
			idxTabs = idxTabs + 1
			pbCutout.style.visibility = "Inherit"
		end if

        //------------------------------------------------------------------------

        // CreateExtensionDiv

        //------------------------------------------------------------------------

        // <summary>

        // Creates a single div in the specified parent element with the specified

        // styles and attributes.

        // </summary>

        // <param name="extId">The ID for the new div.</param>

        // <param name="extClass">The class(es) for the new div.</param>

        // <param name="extXStyle">The style used to give the div its horizontal position ('left' or 'right')</param>

        // <param name="extXPos">The expression for the div's horizontal position.</param>

        // <param name="extYStyle">The style used to give the div its vertical position ('top or 'bottom')</param>

        // <param name="extYPos">The expression for the div's vertical position.</param>

        // <param name="extWidth">The expression for the div's width.</param>

        // <param name="extHeight">The expression for the div's height.</param>

        // <param name="extDisplay">The expression for the div's display style - null or '' if this is not needed.</param>

        // <param name="objExtParent">The element to insert the new div as a child of.</param>

        // <returns>

        // true if the div was created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateExtensionDiv(extId, extClass, extXStyle, extXPos, extYStyle, extYPos, extWidth, extHeight, extDisplay, objExtParent)

        {

          try

          {

            var objExt = window.document.getElementById(extId);

            if (objExt == null)

            {

              objExt = window.document.createElement("div");

              objExt.id = extId;

              objExt.className = extClass;

              objExt.style.position = "absolute";

              objExt.style.overflow = "hidden";

              objExt.style.setExpression(extXStyle, extXPos, "JavaScript");

              objExt.style.setExpression(extYStyle, extYPos, "JavaScript");

              objExt.style.setExpression("width", extWidth, "JavaScript");

              objExt.style.setExpression("height", extHeight, "JavaScript");

              if (typeof(extDisplay) == "string" && extDisplay.length > 0)

              {

                objExt.style.setExpression("display", extDisplay, "JavaScript");

              }

              

              // Insert the new extension div into the proper location in a seperate thread, so that

              // the time it takes doesn't delay the calculation of the size and location of the

              // other extensions. This also breaks out of the onreadystatechange handler thread before

              // mucking around with the DOM, which could potentially change the readyState again.

              window.setTimeout(function(){ objExtParent.appendChild(objExt); }, 5);

            }

            return true;

          }

          catch(e)

          {

            alert("Exception creating background extension '" + extId + "': " + (typeof(e) == "string" ? e : e.description));

          }

          return false;

        }

        

        //------------------------------------------------------------------------

        // CreateBackgroundExtensions

        //------------------------------------------------------------------------

        // <summary>

        // Create empty elements inside the background that match the colored

        // parts of the shape to give the impression that the Page stretches

        // all the way to the edges of the Background.

        // </summary>

        // <returns>

        // true if the extensions were created with no problems, false otherwise.

        // </returns>

        //------------------------------------------------------------------------

        function CreateBackgroundExtensions()

        {

          try

          {

              var objPage = window.document.getElementById("Page");

              var objBackground = window.document.getElementById("Background");      

              if (objPage == null || objBackground == null)

              {

                return false;

              }

                                          

              // Extend the TitleBar on the right-hand edge

              CreateExtensionDiv("bgTitleBar", "TitleBar", 

                                  "right", "'0px'", "top", "'0px'", 

                                  "Background.clientWidth - Page.offsetWidth", 

                                  "TitleBarBackground.offsetHeight", 

                                  null, objBackground);

              

              // Extend the TabSet on the right-hand edge.

              CreateExtensionDiv("bgTabSet", "TabSet", 

                                  "right", "'0px'", "top", "TitleBarBackground.offsetHeight", 

                                  "Background.clientWidth - Page.offsetWidth", "TabSetBackground.offsetHeight", 

                                  "TabSetBackground.currentStyle.display", objBackground);

              

              // Extend the NavPane on the bottom edge.



              CreateExtensionDiv("bgNavPane", "NavPane NavPaneFP",

                                   "left", "'0px'", "bottom", "'0px'", 

                                   "NavPane.offsetWidth", "Background.clientHeight - Page.offsetHeight", 

                                   null, objBackground);



              return true;

          }

          catch(e)

          {

             alert("Exception creating background extensions: " + (typeof(e) == "string" ? e : e.description));

          }  

          return false;

        }
