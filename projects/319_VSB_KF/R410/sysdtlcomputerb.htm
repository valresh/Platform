<SCRIPT language=VBScript defer>'
' General Section (sysdtlcomputerb.htm)
option explicit

DIM nTimerID
	nTimerID = 0

Dim sDiagnosticText

sub AddToDiagMsg(sText)
	sDiagnosticText = sDiagnosticText & sText
end sub

sub InitDisplay
	set objTreeView = shpTreeView.Objects("TreeView1")
end sub

' IsStsGoodQuality() - Function to determine whether a data bound object has good quality
function IsStsGoodQuality(objMe)
	if not objMe is nothing and IsObject(objMe) then
		if (objMe.quality and 192) = 192 then
			IsStsGoodQuality = TRUE
		else
			IsStsGoodQuality = FALSE
		end if
	else
		IsStsGoodQuality = FALSE
	end if
end function

function GetValidString( objVal, nType )
dim strVal
	on error resume next
	if IsNull(objVal) then
		GetValidString = ""
	elseif NOT IsObject(objVal) then	
		GetValidString = ""
	elseif IsStsGoodQuality(objVal) then
		GetValidString = MakeValidString(objVal.currentValue, nType)
	else
		GetValidString = ""
	end if
end function

function MakeValidString( InVal, nType )
dim strVal
	on error resume next
	if IsNull(InVal) then
		' MsgBox "NULL"
		MakeValidString = ""
		exit function
	end if

	if IsEmpty(InVal) then 
		' MsgBox "Empty"
		MakeValidString = ""
		exit function
	end if
	
	Err.Clear	
	if nType = vbBoolean then
		strVal = CStr(CBool(InVal))
	else 
		if nType = vbDate then
			strVal = FormatDateTime(CDate(InVal),vbGeneralDate)
		else
			strVal = CStr(InVal)
		end if
	end if
'	nAscVal = Asc(strVal)
	if Err.Number <> 0 then
		' MsgBox "MakeValidString Error: " & Err.Description
		Err.Clear
		MakeValidString = ""
		exit function
	else
		' MsgBox "MakeValidString() - " & strVal
		MakeValidString = strVal
	end if
end function

Sub netintfdata_AddNetTreeProp (strAdapterKey, strBaseKey, strL2Key, strL2Val, strL3Key, strL3Val)
Dim sKey, objNode, fSortL2, bExpand
	on error resume next
	bExpand = CBool(cbExpandAll.value)
	cbExpandAll.disabled = false
	set objNode = Nothing

'	AddToDiagMsg vbcrlf & "netintfdata_AddNetTreeProp(" & strAdapterKey & ", " & strBaseKey & ", " & strL2Key & ", " & strL2Val & ", " & strL3Key & ", " & strL3Val & ")"
	sKey = strAdapterKey
	if sKey <> "" then
		if strBaseKey <> "" then
			sKey = sKey & "_" & strBaseKey
		end if
		if strL2Key <> "" then
			strL2Key = sKey & "_" & strL2Key
		end if
		if strL3Key <> "" then
			strL3Key = sKey & "_" & strL3Key
			fSortL2 = false
		else
			fSortL2 = true
		end if
		set objNode = AddTreeChild(sKey, strL2Key, strL2Val)
		if IsObject(objNode) then
			objNode.Sorted = fSortL2
'				AddToDiagMsg vbcrlf & "netintfdata_AddNetTreeProp: key " & strL2Key & ", sorted is " & fSortL2
			if bExpand then objNode.Expanded = true
		end if
		if strL3Key <> "" then
			set objNode = AddTreeChild(strL2Key, strL3Key, strL3Val)
			if IsObject(objNode) then
				objNode.Sorted = False
'					AddToDiagMsg vbcrlf & "netintfdata_AddNetTreeProp: key " & strL3Key & ", sorted is False"
				if bExpand then objNode.Expanded = true
			end if
		end if
	end if

End Sub


'////////////////////////////////////////////////////////////////////
' AddTreeRoot()
'////////////////////////////////////////////////////////////////////
sub AddTreeRoot (strKey, strText )
Dim objTreeRoot
	on error resume next
  	set objTreeRoot = TreeView1.Nodes.Add( , , strKey, strText)
	if IsObject(objTreeRoot) then
		objTreeRoot.Sorted = True
'			AddToDiagMsg vbcrlf & "netintfdata_AddNetTreeProp: key " & strKey & ", sorted is True"
		objTreeRoot.Expanded = False
	end if
end sub


'////////////////////////////////////////////////////////////////////
' RemoveTreeRoot()
'////////////////////////////////////////////////////////////////////
sub RemoveTreeRoot (strKey)
	on error resume next
  	TreeView1.Nodes.Remove(strKey)
end sub

sub SetRootText(strKey,strText)
DIM objRootItem
	on error resume next
'	AddToDiagMsg vbcrlf & "SetRootText: key " & strKey & ", text=""" & strText & """"
	set objRootItem = TreeView1.Nodes.Item(strKey)
	if IsObject(objRootItem) then
	  	objRootItem.Text = strText
	else
'		MsgBox "SetRootText() - tree item """ & strKey & """ not found"
	end if
end sub

'////////////////////////////////////////////////////////////////////
' AddTreeChild()
'////////////////////////////////////////////////////////////////////
function AddTreeChild (strParentKey, strChildKey, strChildText)
Dim objItem
	on error resume next
'	AddToDiagMsg vbcrlf & "AddTreeChild: ParentKey=" & strParentKey & ", strChildKey=""" & strChildKey & ", ChildText=""" & strChildText & """"
	if strChildText = "" then			' need to remove this key if text blank
'			AddToDiagMsg vbcrlf & "AddTreeChild: removing key " & strChildKey
		call TreeView1.Nodes.Remove(strChildKey) 
		set AddTreeChild = Nothing
	else
		set objItem = TreeView1.Nodes.Item(strChildKey)
		if IsObject(objItem) then
			objItem.Text = strChildText
			set AddTreeChild = objItem
'				AddToDiagMsg vbcrlf & "AddTreeChild: updating key " & strChildKey & " with text """ & strChildText & """"
		else
			set AddTreeChild = TreeView1.Nodes.Add(strParentKey, 4, strChildKey, strChildText)
'				AddToDiagMsg vbcrlf & "AddTreeChild: creating key " & strChildKey & " with text """ & strChildText & """"
		end if
	end if
end function

'////////////////////////////////////////////////////////////////////
'  ExpandTreeBranch()
'////////////////////////////////////////////////////////////////////
Sub ExpandTreeBranch (strBranchKey, bExpanded)
	TreeView1.Nodes(strBranchKey).Expanded = bExpanded
end sub


'////////////////////////////////////////////////////////////////////
'  ExpandAllTreeNodes()
'////////////////////////////////////////////////////////////////////
Sub ExpandAllTreeNodes()
dim objNode, bExpand
	bExpand = CBool(cbExpandAll.value)
	for each objNode in TreeView1.Nodes
		if objNode.Children then
			ExpandTreeNodes objNode, bExpand
		end if
	next
end sub

'////////////////////////////////////////////////////////////////////
'  ExpandTreeNodes()
'////////////////////////////////////////////////////////////////////
Sub ExpandTreeNodes(ByRef objNode, ByVal bExpand)
dim objChildNode, bSubExpand
	bSubExpand = bExpand
	If IsObject(objNode) And objNode.Children Then
		if InStr(1,objNode.Key,"_",vbTextCompare) then
'msgbox "In objChildNode: objNode.Key=" & objNode.Key & " objNode.Text=" & objNode.Text
			if not objNode.parent is nothing then
				if InStr(1,objNode.Parent.Key,"_",vbTextCompare) then
					bSubExpand = True	' expand subitems in each setting group
				end if
			end if
		end if
      	Set objChildNode = objNode.Child
      	Do
        	ExpandTreeNodes objChildNode, bSubExpand
        	Set objChildNode = objChildNode.Next
      	Loop Until objChildNode Is Nothing
		objNode.Expanded = bSubExpand
    end If
end Sub
' End General Section ( sysdtlcomputerb.htm)
'</SCRIPT>
