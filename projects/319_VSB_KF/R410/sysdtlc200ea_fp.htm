<SCRIPT language=VBScript defer>correctWidth = 0
SKIP = -1

Sub ApplyLayout()           
                Call AdjustHeight()
                Call AdjustWidth()
End Sub

Sub AdjustHeight()
                
                GrpLowerPanel.style.top = "" 
                GrpLowerPanel.style.bottom = "2px"
                GrpCenterPanel.style.top= GrpUpperPanel.style.pixelTop + GrpUpperPanel.style.pixelHeight + 2 
                GrpCenterPanel.style.bottom = (GrpLowerPanel.style.pixelHeight + 15) & "px"
              	 
End Sub

Sub AdjustWidth()
                Call CalculateCorrectWidth()       
                if (correctWidth <> SKIP) then                   
                    GrpUpperPanel.style.pixelwidth = correctWidth 
                    GrpCenterPanel.style.pixelwidth = correctWidth
                    GrpLowerPanel.style.pixelwidth = correctWidth 
												
                end if
End Sub

Sub CalculateCorrectWidth()
                POPUP = 0
                displayType = window.external.Application.CurrentDisplayPageType 
				CurrentPage = window.external.CurrentPage
					if ((window.external.Application.Document.ParentWindow.external.WindowMode = 0 and displayType = POPUP And page.style.zoom = 1) or (window.external.Application.Document.ParentWindow.external.WindowMode = 1 and lcase(CurrentPage) <> "syssystemsummary.htm" and displayType = POPUP)) then
                	
                                correctWidth = SKIP
                                Exit Sub
               		else   

               		if (page.style.zoom > 1) then   
                 		shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))                               
                    	correctWidth = (document.body.offsetWidth - abs(shrinkedWidth)) - 4  'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                                                                                                 
                    else                                        
                         shrinkedWidth = document.body.offsetWidth - (document.body.offsetWidth * (1 / page.style.zoom))
                         correctWidth = document.body.offsetWidth + abs(shrinkedWidth)  -4   'The "-4" is just to adjust the fraction value which may come after above division and to avoid truncation.                                

                    end if

                end if    

End Sub</SCRIPT>

style="HEIGHT: 0px; WIDTH: 0px; POSITION: absolute; LEFT: 0px; TOP: 0px"

<SCRIPT language=VBScript for=sd defer event=ondatachange>if sd.DataChanged("currentpoint.SIMSTATE") then
	if sd.DataValue("currentpoint.SIMSTATE") = 2 then
		'SIMSTATE is  "SIMFREEZE"
		txtSIM.style.visibility = "Hidden"
		EnumSimulationState.style.visibility = "visible"
	elseif sd.DataValue("currentpoint.SIMSTATE") = 1 then
		'SIMSTATE is SIMRUN
		txtSIM.style.visibility = "visible"
		EnumSimulationState.style.visibility = "Hidden"
	else 
		txtSIM.style.visibility = "hidden"
		EnumSimulationState.style.visibility = "Hidden"
	end if
end if
if sd.DataChanged("currentpoint.RDNROLESTATE") then
	if sd.DataValue("currentpoint.RDNROLESTATE") = 0 then
		'RDNROLESTATE is "UNDEFINED" then
       alpRDN_State001.style.visibility = "hidden"
	   txtRDN_Role.style.visibility = "hidden"
	   alpRDNSYNCSTATE.style.visibility = "hidden"	   
	   txtSYNC_State.style.visibility = "hidden"	   
	   alpRDNCHASSISID.style.visibility = "hidden"
	   txtRdnChassisId.style.visibility = "hidden"

	elseif sd.DataValue("currentpoint.RDNROLESTATE") = 1 then 
		'RDNROLESTATE is ="NONREDUND" then  ' SIM case
	   alpRDNSYNCSTATE.style.visibility = "hidden"
	   txtSYNC_State.style.visibility = "hidden"
	   alpRDNCHASSISID.style.visibility = "hidden"
	   txtRdnChassisId.style.visibility = "hidden" 
	   ' In case of Non redund memory info still will valid as SIM = Non-Redundent and memeory info is valid for SIM

	elseif sd.DataValue("currentpoint.RDNROLESTATE") = 3 then 
		'RDNROLESTATE is ="SECONDARY" then 
	   textMemoryInfo.style.visibility = "hidden" 'Memory Info
	   alphanumMemoryInfo.style.visibility = "hidden" 'Memory Info
	   
	End if
end if</SCRIPT>
