<SCRIPT language=VBScript for=RecordOffsetViewer defer event=onupdate>	Dim i
	For i = 1 To 20
		UpdateGrpLabelText i
	    PreventButtonPress i
		ChangeTextColour AphaGrp.children("alpha" & i),i
	Next</SCRIPT>
<SCRIPT language=VBScript defer>Sub PreventButtonPress( j )
	Dim thisRecord
	thisRecord = CInt(RecordOffsetViewer.value) + CInt(j) - 1
	If thisRecord <= CInt(UpperLimitViewer.value) Then
	 grpCoverUpButtons.children("CoverUp" & j).style.visibility="visible"
	Else
		 grpCoverUpButtons.children("CoverUp" & j).style.visibility="hidden"
	End If 
End Sub
Sub ChangeTextColour( vAlphatext, vOffset )
	Dim thisRecord
	thisRecord = CInt(RecordOffsetViewer.value) + CInt(vOffset) - 1
	If thisRecord <= CInt(UpperLimitViewer.value) Then
			vAlphatext.disabled=true
	Else
		vAlphatext.disabled=false
	End If 
End Sub
Sub UpdateGrpLabelText( j )
	Dim thisRecord
	thisRecord = CInt(RecordOffsetViewer.value) + CInt(j) - 1
	If thisRecord <= CInt(UpperLimitViewer.value) Then
	LabelGrp.children("GrpLabel" & j).value = txtTPN.value
	Else
			LabelGrp.children("GrpLabel" & j).value = txtEPKS.value
	End If 
End Sub</SCRIPT>
<SCRIPT language=VBScript for=UpperLimitViewer defer event=onupdate>	If CInt(UpperLimitViewer.value) <= 0 Then
		txtTpnGroupRange.style.visibility = "hidden"
		txtType.style.visibility = "hidden"
		LabelGrp.style.visibility = "hidden"
		PbTPN.style.visibility="hidden"
		PbEPKS.style.visibility="hidden"
	Else
		txtTpnGroupRange.value= "(" & txtGrpRangeDescription.value& " " & CInt(UpperLimitViewer.value) & ")"
		txtTpnGroupRange.style.visibility = "visible"
		txtType.style.visibility= "visible"
		LabelGrp.style.visibility="visible"
		PbTPN.style.visibility="visible"
		PbEPKS.style.visibility="visible"
	End If
if(RecordOffsetViewer.value=1 and UpperLimitViewer.value=450)then
grpTPN.style.visibility="visible"
grpwithoutTPN.style.visibility="hidden"
else
grpTPN.style.visibility="hidden"
grpwithoutTPN.style.visibility="visible"
End if
Dim i
For i = 1 To 20
		UpdateGrpLabelText i
	    PreventButtonPress i
		ChangeTextColour AphaGrp.children("alpha" & i),i
	Next</SCRIPT>
