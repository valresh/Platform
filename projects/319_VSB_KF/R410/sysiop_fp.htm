// Helper functions
function padNumber(numToPad)
{
	var paddedNum;
 	if(numToPad < 10)
	{
		paddedNum = "0" + numToPad;
	}
	else
	{
		paddedNum = numToPad;
	}
	return paddedNum;
}
function Param2Status(param)
{
	if(param == "NOTCONFG")
	{
		return "NOT CONFIG";
	}
	else if(param == "CONFGMIS")
	{
		return "CONFIG MIS";
	}
	else if(param == "SOFTFAIL")
	{
		return "SOFT FAIL";
	}
	else if(param == "IDLESF")
	{
		return "IDLE SF";
	}
	else if(param == "NONEXIST")
	{
		return "NON EXIST";
	}
	else if(param == "NORESP")
	{
		return "NO RESPONSE";
	}
	else if(param == "POWERON")
	{
		return "POWER ON";
	}
	else if(param == "COMMERR")
	{
		return "COMM ERROR";
	}
	else if(param == "UNAVAIL")
	{
		return "UNAVAILABLE";
	}
	else
	{
		return param;
	}
}
// Update Icons
function Param2Icons(param)
{
	var icons = 
	{
		icon : BLANK_ICON,
		blinkIcon : BLANK_ICON
	};
	if(param == "NOTCONFG" || param == "UNAVAIL")
	{
		icons = 
		{
			icon : STATUS_DISABLED_ICON_CURRENT,
			blinkIcon : STATUS_DISABLED_ICON_CURRENT
		}
	}
	else if(param == "CONFGMIS")
	{
		icons = 
		{
			icon : STATUS_SEVERE_ICON_CURRENT,
			blinkIcon : STATUS_SEVERE_BLINK_ICON_CURRENT
		}
	}
	else if(param == "OK")
	{
		icons = 
		{
			icon : STATUS_OK_ICON_CURRENT,
			blinkIcon : STATUS_OK_ICON_CURRENT
		}
	}
	else if(param == "IDLE")
	{
		icons = 
		{
			icon : STATUS_MARGINAL_ICON_CURRENT,
			blinkIcon : STATUS_MARGINAL_BLINK_ICON_CURRENT
		}
	}
	else if(param == "SOFTFAIL" || param == "IDLESF" || param == "COMMERR" || param == "BSF")
	{
		icons = 
		{
			icon : STATUS_FAIL_ICON_CURRENT,
			blinkIcon : STATUS_FAIL_BLINK_ICON_CURRENT
		}
	}
	else if(param == "NONEXIST" || param == "NORESP" || param == "UNAVAIL" || param == "UNKNOWN")
	{
		icons = 
		{
			icon : STATUS_UNKNOWN_ICON_CURRENT,
			blinkIcon : STATUS_UNKNOWN_BLINK_ICON_CURRENT
		}
	}
	else if(param == "POWERON")
	{
		icons = 
		{
			icon : STATUS_TRANSITIONAL_ICON_CURRENT,
			blinkIcon : STATUS_TRANSITIONAL_BLINK_ICON_CURRENT
		}
	}
	return icons;
}

function IopAckStatus(param)
{
	if(param == "NOTCONFG")
	{
		return "not configured";
	}
	else if(param == "CONFGMIS")
	{
		return "config mismatch";
	}
	else if(param == "SOFTFAIL" || param == "BSF")
	{
		return "soft fail";
	}
	else if(param == "IDLESF")
	{
		return "idle soft fail";
	}
	else if(param == "NONEXIST")
	{
		return "non exist";
	}
	else if(param == "NORESP")
	{
		return "no response";
	}
	else if(param == "POWERON")
	{
		return "power on";
	}
	else if(param == "COMMERR")
	{
		return "comm error";
	}
	else if(param == "UNAVAIL")
	{
		return "unavailable";
	}
	else
	{
		return param.toLowerCase();
	}
}

function UpdateCommandStatus()
{
	if(alphaCommandStatus.value == "")
	{
		cmdAck.style.visibility = "hidden"
		alphaCommandFeedback.value = ""
		cmdFailText.value = ""
		ShrinkStatusAck()
		return
	}
	cmdSts = alphaCommandStatus.value.split(",");
	if(cmdSts.length < 5)
	{
		alphaCommandFeedback.value = "Unknown"
		return; //cmdsts must have 5 fields
	}
	var state = cmdSts[0].toLowerCase()
	var cmdType = cmdSts[1].toLowerCase()
	var multiLoad = false
	if(cmdSts[2].toLowerCase() == "true")
	{
		multiLoad = true;
	}
	//Check if node type contains UCN information
	var nodeType;
	var ucnNodeNum = 0;
	var isUCNNode = false;
	if(cmdSts[3].indexOf('UCN') >= 0)
	{
		isUCNNode = true;
		var ucnInfo = cmdSts[3].split(" ")
		if(ucnInfo.length == 3)
		{
			ucnNodeNum = parseInt(ucnInfo[1])
			nodeType = ucnInfo[2]
		}
	}
	else
	{
		nodeType = cmdSts[3];
	}
	var nodeNum = parseInt(cmdSts[4])
	var errorStatus = "";
	if(cmdSts.length == 6)
	{
		errorStatus = cmdSts[5].toLowerCase()
	}
	if(nodeNum < 10)
	{
		nodeNum = "0" + nodeNum
	}
	if(isUCNNode && ucnNodeNum < 10)
	{
		ucnNodeNum = "0" + ucnNodeNum
	}
	if(state == "done")
	{
		ExpandStatusAck()
		cmdFailHeading.value = cmdType.toUpperCase() + " DONE";
		if(multiLoad)
		{
			cmdFailText.value = "Multi " + cmdType + " completed."
		}
		else
		{
			if(isUCNNode)
			{
				cmdFailText.value = "UCN" + ucnNodeNum + " " + nodeType + nodeNum + " " + cmdType + " completed."
			}
			else
			{
				cmdFailText.value = nodeType + nodeNum + " " + cmdType + " completed."
			}
		}
		cmdAck.style.visibility = "visible"
	}
	else if(state == "busy")
	{
		ShrinkStatusAck()
		cmdAck.style.visibility = "hidden"
		var displayState = "Busy... "
		if(multiLoad)
		{
			displayState = "Multi... "
		}
		if(cmdType == "load")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Loading"
		}
		else if(cmdType == "dump")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Dumping"
		}
		else if(cmdType == "save")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Saving"
		}
		else if(cmdType == "shutdown")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Shutdown"
		}
		else if(cmdType == "restore")
		{
			alphaCommandFeedback.value = displayState + nodeType + nodeNum + " Restoring"
		}
	}
	else if(state == "fail")
	{
		ExpandStatusAck()
		cmdFailHeading.value = cmdType.toUpperCase() + " FAIL";
		if(multiLoad)
		{
			cmdFailText.value = "Multi " + cmdType + " operation failed."
		}
		else
		{
			if(isUCNNode)
			{
				cmdFailText.value = "UCN" + ucnNodeNum + " " + nodeType + nodeNum + " - " + errorStatus + "."
			} 
			else
			{
				cmdFailText.value = nodeType + nodeNum + " - " + errorStatus + "."
			}	
		}
		cmdAck.style.visibility = "visible"
	}
}</SCRIPT>
